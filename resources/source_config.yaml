# Bronnen-configuratie voor de Certificaid conversie-pipeline.
#
# Gebruik:
#   python tools/convert.py --source WIB92 --reindex
#   python tools/convert.py --type ejustice --reindex   # alle ejustice bronnen
#   python tools/convert.py --list                       # overzicht status
#
# Velden:
#   type        : conversiemethode (wib92 | wetboek | ejustice_nl | ejustice_bilingual | raw_md | skip)
#   raw         : pad naar bronbestand (PDF of MD)
#   output      : gestructureerde markdown output
#   content     : site-versie (Quartz) — optioneel
#   wetboek_key : sleutel in CONFIGS-dict van convert-wetboek.py (enkel voor type=wetboek)
#   itaa_sectie : ITAA-LEX sectienummer
#   tags        : YAML-lijst voor frontmatter
#   bijgewerkt  : datum van de gecoördineerde versie
#   cleanup     : lijst van extra cleanup-stappen (bovenop de standaard)
#   status      : volledig | toc_only | onbekend | ontbreekt | skip
#
#   bron_rol    : autoriteit en studiegewicht van de bron (gebruik in RAG + conceptextractie)
#     "itaa_lex"       — staat in ITAA-LEX, raadpleegbaar bij examen; hoogste autoriteit
#     "normatief"      — wettekst buiten ITAA-LEX; hoge autoriteit, niet bij examen
#     "interpretatief" — CBN-adviezen, ITAA-normen; autoriteit voor interpretatie
#     "praktijkgids"   — toelichtingen, gidsen, commentaar; hoe het in de praktijk werkt
#     "formulier"      — aangifteformulieren; referentie, geen conceptinhoud


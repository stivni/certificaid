# Bronnen-configuratie voor de Certificaid conversie-pipeline.
#
# Gebruik:
#   python tools/etl/convert.py --source WIB92 --reindex
#   python tools/etl/convert.py --type ejustice --reindex   # alle ejustice bronnen
#   python tools/etl/convert.py --list                       # overzicht status
#
# Velden:
#   type        : conversiemethode (wib92 | wetboek | ejustice_nl | ejustice_bilingual | raw_md | split | skip)
#   derived_from: (alleen type=split) source-name waaruit deze MD is afgeleid via een splits-tool
#   raw         : pad naar bronbestand (PDF of MD)
#   output      : gestructureerde markdown output
#   content     : site-versie (Quartz) — optioneel
#   mode        : (alleen type=wetboek) nl | bilingual | eu_richtlijn — sub-discriminator voor convert-wetboek.py
#   wet         : (alleen type=wetboek) volledige wetnaam, gebruikt in frontmatter van de output
#   titel       : (alleen type=wetboek) korte titel, als H1-heading in de output
#   col_x       : (alleen type=wetboek bilingual) x-coördinaat splitspunt voor NL/FR-kolommen
#   start_page  : (alleen type=wetboek) eerste pagina van de eigenlijke wettekst
#   itaa_sectie : ITAA-LEX sectienummer
#   tags        : YAML-lijst voor frontmatter
#   bijgewerkt  : datum van de gecoördineerde versie
#   cleanup     : lijst van extra cleanup-stappen (bovenop de standaard)
#   status      : volledig | toc_only | onbekend | ontbreekt | skip
#
#   bron_rol    : autoriteit en studiegewicht van de bron (gebruik in RAG + conceptextractie)
#     "itaa_lex"       — staat in ITAA-LEX, raadpleegbaar bij examen; hoogste autoriteit
#     "normatief"      — wettekst buiten ITAA-LEX; hoge autoriteit, niet bij examen
#     "interpretatief" — CBN-adviezen, ITAA-normen; autoriteit voor interpretatie
#     "praktijkgids"   — toelichtingen, gidsen, commentaar; hoe het in de praktijk werkt
#     "formulier"      — aangifteformulieren; referentie, geen conceptinhoud
#
# ─────────────────────────────────────────────────────────────────────────────
# Twee secties:
#   sources/      : per-bron entries met expliciete extract-strategie (wetteksten,
#                   wetboeken, KB's). Geschikt voor curated bronnen met een
#                   eigen PDF en een uniek conversie-pad.
#   collections/  : bulk-bronnen met dezelfde strategie voor alle items
#                   (CBN-adviezen, ITAA-normen). Per item leeft de detail in de
#                   .md frontmatter; de collection beschrijft welke fields
#                   gebruikt worden als input voor provenance.
#
# Collection schema:
#   bron_rol      : zelfde als bij sources
#   output_dir    : pad naar de map met .md output-files
#   pipeline      : pad naar het script dat de .md's produceert (voor provenance)
#   item_inputs   : lijst van frontmatter-velden die per item als input tellen
#                   - field: <fm-veld>
#                     kind:  local | url
#                   Alle resolvende velden worden samen als inputs opgenomen.
# ─────────────────────────────────────────────────────────────────────────────

collections:

  cbn-adviezen:
    bron_rol: interpretatief
    output_dir: resources/bronnen/adviezen/
    pipeline: tools/etl/reprocess_cbn_adviezen.py
    item_inputs:
      - field: bron
        kind: url
    description: |
      ~437 CBN-adviezen, gedownload van cbn-cnc.be (HTML-scrape) en omgezet
      naar markdown. Per item: 'bron' bevat de bron-URL.

  itaa-normen:
    bron_rol: interpretatief
    output_dir: resources/bronnen/normen/
    pipeline: tools/etl/process_normen.py
    item_inputs:
      - field: bron-pdf
        kind: local
      - field: online
        kind: url
      - field: bron
        kind: url
    description: |
      ITAA-normen + ISA/ISAE/ISRS van BeExcellent, IBR-IRE en IFAC.
      Sommige ISA-normen hebben een lokaal raw PDF (bron-pdf); de meeste
      hebben een online URL of een hostname als bron.


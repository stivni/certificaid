  - onderwerp: "Verplichting opmaak + verantwoordelijkheid bestuursorgaan"
    ref: "WVV art. 3:1 + art. 3:22 e.v."
  - onderwerp: "Geconsolideerd jaarverslag — inhoud"
    ref: "WVV art. 3:32"
  - onderwerp: "Wettelijke controle geconsolideerde JR"
    ref: "WVV art. 3:74"
    noot: "Commissaris van moeder, of apart aangewezen revisor/auditkantoor"
  - onderwerp: "Verantwoordelijkheid commissaris bij groepscontrole"
    ref: "WVV art. 3:76"
    noot: "Eindverantwoordelijk, ook voor werk uitgevoerd door auditors in andere landen op dochters"
  - onderwerp: "Inhoud van het commissarisverslag — 12 elementen"
    ref: "WVV art. 3:77 § 1"
  - onderwerp: "Opmaak geconsolideerde JR door bestuursorgaan moeder"
    ref: "WVV art. 3:31"
  - onderwerp: "Termijn opmaak + AV-voorlegging (6 maanden) + NBB-neerlegging (30 dagen + max 7 maanden)"

    noot: "Eerder vermeld als 'KB-WVV art. 3:31' — fout. Art. 3:31 regelt wie opmaakt, niet wanneer."
  - onderwerp: "Sanctie bij niet-tijdige neerlegging"
    ref: "WIB art. 218 (VenB-vermeerdering)"
  - onderwerp: "CSRD-duurzaamheidsrapportage"
    ref: "EU-richtlijn 2022/2464 (omgezet in WVV via Wet 2 augustus 2024)"
    noot: "Verplicht voor grote groepen en beursgenoteerde — fasering 2024-2028"


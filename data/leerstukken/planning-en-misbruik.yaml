wettelijk_fundament:
  - onderwerp: "Algemene anti-misbruik-bepaling — inkomstenbelastingen"
    ref: "WIB92 art. 344 §1"
    noot: "Vier-voorwaardentest cumulatief: één verrichting + strijdig met doelstellingen + hoofddoel fiscaal + geen overtuigend tegenbewijs."
  - onderwerp: "Algemene anti-misbruik-bepaling — juridische constructies (kaaiman-link)"
    ref: "WIB92 art. 344/1"
  - onderwerp: "Algemene anti-misbruik-bepaling — btw"
    ref: "WBTW art. 1 §10"
    noot: "Inhoudelijk vergelijkbaar: fiscaal voordeel in strijd met doelstellingen van het Wetboek + handelingen die in wezen het voordeel beogen."
  - onderwerp: "Parallelle anti-misbruik-bepaling — diverse rechten en taksen"
    ref: "WDRT art. 202"
  - onderwerp: "Parallelle anti-misbruik-bepaling — Waals Gewest"
    ref: "Decreet 6 mei 1999 art. 12quinquies"
  - onderwerp: "Parallelle anti-misbruik-bepaling — Brussels Hoofdstedelijk Gewest"
    ref: "Brusselse Codex Fiscale Procedure art. 52"
  - onderwerp: "Parallelle anti-misbruik-bepaling — Vlaamse gewestbelastingen (incl. erfbelasting)"
    ref: "Vlaamse Codex Fiscaliteit art. 3.17.0.0.2"
  - onderwerp: "Simulatie — civielrechtelijke basis (tegenakten niet tegenwerpbaar derden)"
    ref: "Burgerlijk Wetboek art. 5.197 (oud art. 1321)"
  - onderwerp: "Bewijsmiddelen gemeen recht — toepasselijk op simulatie-bewijs"
    ref: "WIB92 art. 340"
  - onderwerp: "Brepols — vrije keuze minst belaste weg"
    ref: "Hof van Cassatie, 6 juni 1961"
    noot: "Cassatie-arrest niet apart als wettekst in de bronnen-RAG; doctrinaire en jurisprudentiële consensus."
  - onderwerp: "Au Vieux Saint-Martin — alle gevolgen moeten aanvaard worden"
    ref: "Hof van Cassatie, 29 januari 1988"
    noot: "Idem — cassatie-arrest niet apart in de wetteksten-RAG; algemene jurisprudentiële consensus."
  - onderwerp: "Bedrijfsleidersbezoldiging — kader voor herkwalificatie huur (V2-context)"
    ref: "WIB92 art. 32"
  - onderwerp: "Privé-meerwaarde gebouw aangehouden > 5 jaar (e contrario context V2)"
    ref: "WIB92 art. 90, 10°"


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Wettelijke controle jaarrekening + benoeming commissaris"
    ref: "WVV art. 3:55 · 3:58 · 3:70 · 3:72"
    noot: "Art. 3:55 = benoeming door AV op voorstel bestuursorgaan; art. 3:58 = 3-jaars mandaat; art. 3:70 = wettelijke controle door commissaris; art. 3:72 = controleplicht-drempels (verwijst naar art. 1:24-1:26). Verifieerd via MCP."
  - onderwerp: "Statuut bedrijfsrevisor + tucht + ISQM"
    ref: "Wet 7 december 2016 betreffende organisatie van het beroep van bedrijfsrevisor"
    noot: "Inschrijving in openbaar register IBR; bewaarplicht revisiedossier 10 jaar (art. 16); kwaliteitstoetsing."

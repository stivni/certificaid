verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: onafhankelijkheid-en-deontologie-bij-controleopdrachten
      hint: "De onderbouwende deontologie-laag — bedreigingen-kader IESBA (5 categorieën), KB 1 maart 1998 art. 9, kwaliteitsmanagement ISQM 1/ISA 220. Lees dit vóór je in de audit-cyclus duikt; aanvaarding is de eerste fase waar onafhankelijkheid getoetst wordt."
    - slug: aanvaarden-plannen-en-uitvoeren-van-een-audit
      hint: "De audit-cyclus eerste helft — aanvaarding · planning (materialiteit + risico-inschatting ISA 315/320) · uitvoering (7 procedures + assertions ISA 500-530). Dit is het zwaarste leerstuk."
    - slug: afronden-en-rapporteren-van-een-audit
      hint: "De audit-cyclus tweede helft — afronding (ISA 450/540/560/570/580/720) + oordeel-types (ISA 700/705/706) + revisiedossier (10 jaar bewaring). De beslismatrix oordeel-types is hier het pedagogisch hart."
    - slug: bijzondere-wettelijke-verslagen-bij-vennootschapsverrichtingen
      hint: "Het parallel spoor — Boek 14 + Boek 5 + Boek 7 WVV. Inbreng in natura · omzetting · fusie · ontbinding. Beperkte zekerheid, staat A&P door bestuursorgaan, ITAA-normen. Examen-zwaartepunt nummer één in PO 1.6."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — vier opdracht-types langs zekerheidsniveau, statuut commissaris versus accountant, normbronnen-hiërarchie op één pagina."


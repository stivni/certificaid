# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Legaliteitsbeginsel federaal — geen belasting zonder wet"
    ref: "Grondwet art. 170 §1"
    noot: "Verifieerbare basis voor de bronnen-hiërarchie en voor het bestaan van elke federale belasting."
  - onderwerp: "Bevoegdheid gewest / gemeenschap"
    ref: "Grondwet art. 170 §2"
    noot: "Belasting van gewest of gemeenschap door decreet of ordonnantie. Wordt verder uitgewerkt in L2."
  - onderwerp: "Bevoegdheid provincie en bovengemeentelijk bestuur"
    ref: "Grondwet art. 170 §3"
  - onderwerp: "Bevoegdheid agglomeratie, federatie van gemeenten, gemeente"
    ref: "Grondwet art. 170 §4"
  - onderwerp: "Retributie / belasting-onderscheid"
    ref: "Grondwet art. 173"
    noot: "Buiten provincies, polders en wateringen kan van burgers geen retributie worden gevorderd dan alleen als belasting ten behoeve van de Staat, gemeenschap, gewest, agglomeratie, federatie van gemeenten of gemeente. Bevestigt het belasting-monopolie."
  - onderwerp: "Belastbare winst vennootschappen — boekhoud-pijler"
    ref: "WIB92 art. 24"
    noot: "Illustreert de verhouding fiscaal recht ↔ boekhoudrecht: fiscale winst vertrekt van de boekhoudkundige winst."
  - onderwerp: "Niet-aftrekbaarheid verboden uitgaven — fiscale moraliteits-neutraliteit"
    ref: "WIB92 art. 53"
    noot: "Illustreert de afwijking fiscaal ↔ boekhoudkundig (zie ook L3 over moraliteits-neutraliteit)."


rechtspraak:
  - onderwerp: "Grondwettelijk Hof — proportionaliteit gewestelijke autonome heffingen"
    inhoud: "Het Grondwettelijk Hof toetst gewestelijke autonome belastingen (zoals planbatenheffing, leegstandsheffing) aan het gelijkheidsbeginsel + proportionaliteitseis: het tarief en de modaliteiten mogen niet kennelijk onredelijk zijn ten opzichte van het beoogde beleidsdoel. Vaste rechtspraak bij planbatenheffing (meerwaarde-pakker) en leegstand (anti-leegstand-instrument). Concrete arrest-referenties: nader te bevestigen via primaire bron."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd; specifieke arrest-nummers laten we hier open, in samenvatting of synthese-leerstuk kan een specifieke ankerzaak toegevoegd worden"


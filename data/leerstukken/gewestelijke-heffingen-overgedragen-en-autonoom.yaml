# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Lijst overgedragen gewestbelastingen"
    ref: "Bijzondere Financieringswet 16.01.1989 (BFW) art. 3"
    noot: "Registratierechten op onroerende overdrachten · schenkbelasting · erfbelasting · onroerende voorheffing · verkeersbelasting · BIV · eurovignet · spelen-en-weddenschappen. Voor Vlaanderen volledig overgenomen in VCF."
  - onderwerp: "Vlaamse Codex Fiscaliteit — overzicht relevante titels"
    ref: "Decreet 13.12.2013 — VCF"
    noot: "OV = Titel 2.1 (basistarief 3,97 % art. 2.1.4.0.1); verkeersbelasting = Titel 2.2; BIV = Titel 2.3 (verbod opcentiemen art. 2.3.4.2.2); leegstandsheffing bedrijfsruimten = Titel 2.6 (heffing vanaf 3de opeenvolgende registratie — art. 2.6.7.0.1; opcentiemen toegelaten — art. 2.6.4.0.2); procedure = Titel 3."
  - onderwerp: "Kadastraal inkomen als grondslag OV"
    ref: "WIB92 art. 486 (vaststelling KI) + art. 518 (indexering)"
  - onderwerp: "Planbatenheffing — rechtsgrond"
    ref: "Vlaamse Codex Ruimtelijke Ordening (VCRO) art. 2.6.4 t.e.m. 2.6.18"
    noot: "Inning volgens VCF Titel 3."
  - onderwerp: "Verbod opcentiemen gemeente/provincie op federale directe belastingen"
    ref: "WIB92 art. 464"
    noot: "Uitzondering: aanvullende gemeentebelasting PB (art. 465-470/2) is uitdrukkelijk toegelaten."
  - onderwerp: "Toelating opcentiemen op OV en op leegstand"
    ref: "WIB92 art. 464/1 + VCF art. 2.1.4.0.2 + VCF art. 2.6.4.0.2"
  - onderwerp: "Aanvullende gewestelijke PB"
    ref: "BFW art. 5/1 e.v. (versie 2014) + WIB92 art. 96/1 t.e.m. 96/4"
  - onderwerp: "Lokalisatie erfbelasting + schenkbelasting"
    ref: "BFW art. 5 §2"
    noot: "Erfbelasting: laatste fiscale woonplaats overledene + 5-jaarsregel. Schenkbelasting onroerend goed: fiscale woonplaats schenker op datum schenking."
  - onderwerp: "Brusselse + Waalse gewestelijke fiscale codes (kort)"
    ref: "Ord. 6 maart 2019 — Brusselse Codex Fiscale Procedure (⚠️ te verifiëren via primaire bron) · Decreet 6 mei 1999 — Waalse vestiging, invordering, geschillen"


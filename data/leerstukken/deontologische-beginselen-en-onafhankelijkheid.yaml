verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: opdrachtaanvaarding-en-clientenrelatie
      hint: "Threats-and-safeguards in actie — wat gebeurt er bij intake van een nieuwe cliënt, in de opdrachtbrief, en bij confraterne overdracht. Documentatie + onafhankelijkheidsregister."
    - slug: beroepsgeheim-en-aansprakelijkheid
      hint: "Verdieping vertrouwelijkheid (strafrechtelijk beschermd via art. 458 SW) + drie sporen aansprakelijkheid bij schending van een beginsel."
    - slug: kwaliteitstoezicht-en-tucht
      hint: "Hoe naleving van de beginselen wordt afgedwongen — kantoor-kwaliteitssysteem + kwaliteitstoetsing + tuchtprocedure."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — vijf beginselen + vijf bedreigingen + onafhankelijkheids-checklist op één pagina."


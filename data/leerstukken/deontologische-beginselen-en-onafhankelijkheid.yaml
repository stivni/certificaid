wettelijk_fundament:
  - onderwerp: "Deontologische beginselen — wettelijke verankering"
    ref: "Wet 17 maart 2019 (ITAA-wet) art. 37"
    noot: "Algemene rechtsgrondslag — accountant handelt met respect voor de beginselen van de deontologie + in het publiek belang."
  - onderwerp: "Onverenigbaarheden + objectieve uitvoering"
    ref: "Wet 17 maart 2019 art. 48"
    noot: "Verbiedt activiteiten die de onafhankelijkheid hypothekeren of belangenconflict creëren."
  - onderwerp: "Deontologische code als KB"
    ref: "KB 9 december 2019 — deontologische code ITAA"
    noot: "Uitvoeringsbesluit van art. 49 Wet-ITAA. Werkt vijf beginselen + threats-and-safeguards-kader uit."
  - onderwerp: "Ronselverbod"
    ref: "KB 1 maart 1998 — Reglement van plichtenleer art. 30"
    noot: "Vergoeding mag niet afhangen van andere diensten — verbod aanbrengcommissie + pakket-aanbiedingen."
  - onderwerp: "Vijf fundamentele beginselen"
    ref: "IESBA Code of Ethics 2024 — Section 110.1 A1"
    noot: "Integriteit + objectiviteit + vakbekwaamheid/zorgvuldigheid + vertrouwelijkheid + professioneel gedrag. Bindend via verwijzing in KB 9-12-2019 en ITAA-normen."
  - onderwerp: "Threats-and-safeguards-cyclus"
    ref: "IESBA Code of Ethics 2024 — Section 120"
    noot: "Identificeer · evalueer · pak aan. Continue toepassing."
  - onderwerp: "Vijf categorieën bedreigingen"
    ref: "IESBA Code of Ethics 2024 — Section 120.6 A3"
    noot: "Self-interest · self-review · advocacy · familiariteit · intimidatie."
  - onderwerp: "Onafhankelijkheid — independence-of-mind + appearance"
    ref: "IESBA Code of Ethics 2024 — Section 400.4-400.5"
    noot: "Twee dimensies — beide moeten voldoen."
  - onderwerp: "Onafhankelijkheid — financiële belangen, familie, niet-assurance-diensten"
    ref: "IESBA Code of Ethics 2024 — Section 510 + 521 + 600"
    noot: "Concrete verboden voor assurance-opdrachten. Strenger voor PIE (Section 540 voor partner-rotatie)."
  - onderwerp: "Onafhankelijkheidsverklaring bij commissaris-opdracht"
    ref: "Wet 7 december 2016 (revisorenwet) art. 14"
    noot: "Formele verklaring aan algemene vergadering. Cross-PO doorklik naar PO 1.6 (commissaris)."

footer: "Leerstuk PO 4.0. Status: voorgesteld — POC volgens ADR-037."

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Cassatie — vordering in rechte als enige stuiting tenuitvoerlegging"
    inhoud: "Vaste rechtspraak: de tenuitvoerlegging van een dwangbevel kan enkel worden gestuit door een vordering in rechte (verzet) — niet door administratief bezwaar tegen de onderliggende aanslag. Bezwaar en verzet zijn verschillende rechtsmiddelen met verschillende functies."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd; specifieke arrest-nummers worden in samenvatting aangevuld."
  - onderwerp: "Cassatie — hoofdelijkheid bestuurder art. 442quater"
    inhoud: "De ontvanger moet effectief de FOUT of TEKORTKOMING van de bestuurder aantonen — louter niet-betaling door de vennootschap volstaat niet. Cassatie heeft de bewijslast van de administratie meermaals onderstreept."
    confidence: "⚠️ te verifiëren — concrete arrest-nummers nog open."

footer: "Leerstuk PO 2.5. Status: voorgesteld — POC volgens ADR-037."

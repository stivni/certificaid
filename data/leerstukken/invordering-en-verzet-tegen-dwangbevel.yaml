  - onderwerp: "Verjaring invordering"
    ref: "Wetboek Invordering 2020 art. 23"
    noot: "5 jaar verjaring invordering — start bij definitief worden aanslag; stuiting door dwangbevel of betalingsherinnering volgens regels Ger.W."
  - onderwerp: "Kohier als uitvoerbare titel"
    ref: "WIB92 art. 297-298"
  - onderwerp: "Invordering — bezwaar schorst niet"

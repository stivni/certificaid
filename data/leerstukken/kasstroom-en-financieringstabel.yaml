wettelijk_fundament:
  - onderwerp: "Verplichting kasstroomoverzicht onder IFRS"
    ref: "IAS 7 (Statement of Cash Flows)"
    noot: "Verplicht voor IFRS-rapporterende ondernemingen + voor geconsolideerde groepen (zie PO 1.4)"
  - onderwerp: "Geen wettelijke verplichting voor enkelvoudige B-GAAP-JR"
    ref: "KB-WVV (geen vereiste in basis-schema)"
    noot: "Wordt in praktijk vaak vrijwillig opgenomen — voor analyse-doeleinden essentieel"
  - onderwerp: "Verband met toelichting niet-balans-rechten/verplichtingen"
    ref: "KB-WVV art. 3:91 e.v. (Staten toelichting)"
    noot: "Off-balance leasings + langetermijn-engagementen relevant voor toekomstig cash-beeld"
  - onderwerp: "Operationele cashflow vóór belastingen — formule"
    ref: "Vernimmen + NBB-balanscentrale conventie"
    noot: "Klassieke begrips-omschrijving: bedrijfsresultaat + niet-kasbestanddelen van bedrijfskosten"


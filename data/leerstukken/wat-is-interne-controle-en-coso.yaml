    ref: "COSO 2013 — internationale doctrine (geen wettekst)"
    noot: "Wereldwijde de-facto-standaard, waarop ISA 315 expliciet is gealigneerd; 5 componenten + 3 doel-categorieën + 17 onderliggende principes."

wettelijk_fundament:
  - onderwerp: "DSCR-vuistregel + bancaire kredietanalyse-doctrine"
    ref: "Geen wettelijke verankering — internationaal aanvaarde bancaire praktijk. Belgisch: Belfius Companyweb-scoring + NBB Balanscentrale-data. KMO-financiering: Wet 21-12-2013 betreffende diverse bepalingen inzake de financiering van kleine en middelgrote ondernemingen (transparantie-eisen kredietverstrekking)."
  - onderwerp: "Annuïteit + matching-principe"
    ref: "Financiële wiskunde — geen wettelijke regeling. Matching-principe is bedrijfseconomische doctrine (Brealey/Myers/Allen)."
  - onderwerp: "Operationele kasstroom — boekhoudkundige definitie"
    ref: "Voor KSO-techniek: IAS 7 §10-20 (indirecte methode); voor de Belgische proxy: CBN-advies 2011/14 (cashflow = nettoresultaat + niet-kaskosten)."
    noot: "BIBF-/ITAA-examen-conventie volgt CBN 2011/14 — geen werkkapitaal-correctie, anders dan IAS 7."
  - onderwerp: "Staatswaarborg KMO-krediet"
    ref: "Vlaamse Waarborgregeling — Decreet 6 februari 2004 + uitvoeringsbesluiten. Gigarant NV biedt grote-projects-waarborgen. Brussels en Waals Gewest hebben analoge regelingen (Sowalfin, finance.brussels)."


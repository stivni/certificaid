# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Opdrachtbrief — wettelijke basis"
    ref: "Wet 17 maart 2019 (ITAA-wet) art. 42"
    noot: "Vereiste schriftelijke opdrachtbrief vóór elke opdracht. Vertegenwoordiger-natuurlijke persoon expliciet vermelden."
  - onderwerp: "Aansprakelijkheid + verbod op exoneratie"
    ref: "Wet 17 maart 2019 art. 44"
    noot: "Lid 1 = burgerrechtelijke aansprakelijkheid gemeen recht. Lid 2 = geen exoneratie bij bedrieglijk opzet of voorbehouden opdrachten. Lid 3 = verzekeringsplicht."
  - onderwerp: "Onverenigbaarheden bij opdrachtaanvaarding"
    ref: "Wet 17 maart 2019 art. 48"
    noot: "Verbiedt voorwaarden die objectieve uitvoering in gedrang brengen."
  - onderwerp: "Opdrachtbrief-vormvereisten + 13 inhoudsvelden"
    ref: "ITAA-norm-opdrachtbrief § 2-8"
    noot: "Inclusief retroactiviteit-uitzondering bij dringende prestaties (§ 5)."
  - onderwerp: "Aanvaardings-discipline + threats-analyse"
    ref: "ITAA-norm intern kwaliteitsmanagement par. 11 + 13"
    noot: "Vereist documentatie van aanvaarding + onafhankelijkheids-evaluatie."
  - onderwerp: "Aanvaardings-cyclus voor controle/review-opdrachten"
    ref: "ITAA-norm-kmo-controlenorm § 2.2.1 §32-§38"
    noot: "Vier-stappen-proces uitgewerkt voor assurance-context."
  - onderwerp: "Internationale aanvaardings-standaard"
    ref: "ISA 210 (Overeenkomen van de voorwaarden van controleopdrachten) + ISA 220 (herzien) — cliëntaanvaarding en -continuering"
    noot: "Bindend voor commissaris-opdrachten."
  - onderwerp: "IESBA — bedreigingen + overdrachtsgesprek + belangenconflict"
    ref: "IESBA Code of Ethics — Section 120 + Section 320 + Section 310"
    noot: "Section 320 = predecessor-procedure bij wisseling. Section 310 = belangenconflicten + informed consent + Chinese walls."
  - onderwerp: "Verbod handtekening-delegatie + schriftelijke aantekening werkzaamheden"
    ref: "KB 1 maart 1998 — Reglement van plichtenleer art. 16-17"
    noot: "Geldt voor monopolieopdrachten — vertegenwoordiger-natuurlijke persoon tekent zelf."
  - onderwerp: "Ronselverbod (= geen aanbrengcommissie)"
    ref: "KB 1 maart 1998 — Reglement van plichtenleer art. 30"
    noot: "Vergoeding mag niet afhangen van andere diensten. Geldt ook voor cliënt-overdracht tussen ITAA-leden."
  - onderwerp: "KYC bij opdrachtaanvaarding"
    ref: "Wet 18 september 2017 (antiwitwaswet) art. 19 + 21-32"
    noot: "Uitgewerkt in [[antiwitwasplichten-in-de-praktijk]]."
  - onderwerp: "Retentierecht — algemene burgerrechtelijke leer"
    ref: "Burgerlijk Wetboek (Boek 5 BW) — algemene retentierecht-leer"
    noot: "Geen specifiek wettelijk regime voor accountants — afgeleid uit algemene leer + ingeperkt door deontologische beginselen (art. 37 Wet-ITAA)."


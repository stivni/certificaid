# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Leasing — lessee single model + lessor financieel/operationeel"
    ref: "IFRS 16 — Leases (Verordening (EU) 2023/1803)"
    noot: "Sleutel-alinea's: 5-8 (vrijstellingen short-term + low-value), 9-22 (lease-identificatie), 22-38 (lessee-opname + waardering), 26 (afschrijving ROU), 36-38 (vervolgwaardering leaseverplichting), 61-65 (lessor-onderscheid + waardering)."
  - onderwerp: "Voorraden — kostprijsformules + NRV"
    ref: "IAS 2 — Inventories (Verordening (EU) 2023/1803)"
    noot: "Sleutel-alinea's: 23-26 (kostprijsformules — specifieke identificatie + FIFO + GMP), 25 (LIFO-verbod), 9 (lower of cost and net realisable value), 28-33 (NRV-test)."
  - onderwerp: "Opbrengsten — 5-stappen-model + over-time vs point-in-time"
    ref: "IFRS 15 — Revenue from Contracts with Customers (Verordening (EU) 2023/1803)"
    noot: "Sleutel-alinea's: 9-21 (stap 1 contract-identificatie), 22-30 (stap 2 prestatieverplichtingen), 47-72 (stap 3 transactieprijs), 73-86 (stap 4 toewijzing), 31-46 (stap 5 erkenning), 35 (over time-criteria), 38 (point-in-time)."
  - onderwerp: "Presentatie + verbod 'extraordinary items'"
    ref: "IAS 1 — Presentation of Financial Statements (Verordening (EU) 2023/1803)"
    noot: "IAS 1.87 verbiedt 'extraordinary items'. IAS 1.97 vereist afzonderlijke vermelding materiële posten binnen gewone resultaten."
  - onderwerp: "BE-GAAP — leasing kwalificatie + verwerking"
    ref: "KB-WVV 29.04.2019 art. 3:51 + CBN-advies 2015/4 (Boekhoudkundige verwerking leasing)"
    noot: "Wedersamenstelling-van-kapitaal-test + 15 %-koopoptieregel voor onderscheid financiële vs operationele lease aan beide zijden."
  - onderwerp: "BE-GAAP — voorraadwaarderingsmethoden"
    ref: "KB-WVV 29.04.2019 art. 3:21"
    noot: "Vier toegelaten methodes: individualisering · gewogen gemiddelde · FIFO · LIFO. CBN-advies 132/7 bevestigt LIFO-verbod onder IAS 2."
  - onderwerp: "BE-GAAP — opbrengstverantwoording"
    ref: "KB-WVV 29.04.2019 art. 3:11 + art. 3:23 (realisatie + matching) + klasse 70 MAR"
    noot: "Realisatie bij prestatie of factuurmoment. CBN-advies 2018/13 (opbrengstverantwoording lange-termijn-contracten)."
  - onderwerp: "BE-GAAP — afschaffing 'uitzonderlijke resultaten'"
    ref: "KB van 18 december 2015 (omzetting Richtlijn 2013/34/EU)"

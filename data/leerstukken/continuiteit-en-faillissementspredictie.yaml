wettelijk_fundament:
  - onderwerp: "Going-concern als waarderingsbeginsel"
    ref: "CBN-advies 2018/18 — Going concern – Waarderingsregels bij stopzetting of gedeeltelijke stopzetting."
    noot: "Definieert wanneer kantelen + wat dan met activa-waardering, voorzieningen, herstructurerings-kosten."
  - onderwerp: "Verslaggeving over continuïteits-beoordeling"
    ref: "CBN-advies 2018/18 sectie 'Verslaggeving' + WVV art. 3:6 (jaarverslag risico's)."
  - onderwerp: "Alarmprocedure NV"
    ref: "WVV art. 7:228 (netto-actief < helft / < kwart kapitaal — AV binnen 2 maanden) + art. 7:229 (netto-actief < 61.500 EUR — ontbindings-vordering)."
    noot: "AV beslist binnen 2 maanden over voortzetting, ontbinding of andere maatregelen."
  - onderwerp: "Alarmprocedure BV (kapitaalloos)"
    ref: "WVV art. 5:153 — netto-actief negatief OF onmogelijkheid om opeisbare schulden over 12 maanden te voldoen."
    noot: "Andere trigger dan NV: kapitaal-concept werd afgeschaft bij BV (WVV 2019); netto-actief-positief en liquiditeitstest zijn de twee assen."
  - onderwerp: "Berekening netto-actief"
    ref: "CBN-advies 2021/14 — Jaarrekeningrechtelijke analyse van de alarmbelprocedure onder het WVV."
    noot: "Twee voorbeelden met balansen. Methodiek: totaal activa − voorzieningen − schulden − niet-afgeschreven oprichtings/O&O-kosten."
  - onderwerp: "Bestuurder-zorgvuldigheidsplicht + aansprakelijkheid"
    ref: "WVV art. 2:52 § 1 (zorgvuldigheidsstandaard — bestuurder is persoonlijk aansprakelijk voor 'beslissingen, daden of gedragingen die zich kennelijk buiten de marge bevinden waarbinnen normaal voorzichtige en zorgvuldige bestuurders, geplaatst in dezelfde omstandigheden, redelijkerwijze van mening kunnen verschillen') + art. XX.225 WER (bijzondere aansprakelijkheid bij faillissement wegens kennelijk grove fout). Art. 2:56 betreft de aansprakelijkheidsplafonds (cap-bedragen), niet de zorgvuldigheidsplicht zelf."
  - onderwerp: "Auditor going-concern-procedure"
    ref: "ISA 570 (Going Concern) — IAASB-standaard, in België verbindend via IBR/IRE."
    noot: "Cross-PO: PO 1.6 werkt ISA 570 verder uit voor controleverklaring-keuze."

footer: "Leerstuk PO 1.9 — lstk 3 van 4. Status: voorgesteld."

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Auditor-verantwoordelijkheid voor fraude"
    ref: "ISA 240 — De verantwoordelijkheden van de auditor met betrekking tot fraude in het kader van een controle van financiële overzichten"
    noot: "Onderscheid fout vs fraude (intentie); twee hoofdtypes fraude — frauduleuze financiële verslaggeving + oneigenlijke toe-eigening; professioneel-kritische instelling; management override als specifieke risico-bron."
  - onderwerp: "Frauderisico als specifieke COSO-component"
    ref: "ISA 315 (herzien-2019), Bijlage 3"
    noot: "COSO-component 2 (risico-inschatting) vereist expliciete overweging van frauderisico bij elke onderneming."
  - onderwerp: "ITAA KMO-controlenorm — fraude-overwegingen KMO"
    ref: "ITAA-norm KMO-controlenorm — §97-98 + Bijlage 1"

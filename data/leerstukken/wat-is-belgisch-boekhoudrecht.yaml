verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: wie-moet-boekhouden-en-hoe
      hint: "Wie is boekhoudplichtig + dubbele vs vereenvoudigde boekhouding + de 8 beginselen + bewaarplicht — de WER-kant uitgewerkt."
    - slug: vennootschap-grootte-en-schema-keuze
      hint: "Hoe bepaal je grootte (micro/klein/groot) en wat verandert er — moeder, dochter, beursgenoteerd, vereniging. De WVV-kant uitgewerkt."
    - slug: jaarrekening-publiceren-en-sancties
      hint: "Wat er in de jaarrekening + bijlagen moet, hoe ze wordt neergelegd en wat de sancties zijn bij niet-naleving."
    - slug: individuele-jaarrekening-opmaken
      hint: "Cross-PO — de TECHNIEK van jaarrekening-opmaken (eindejaarsverrichtingen, resultaatbestemming). PO 1.4 leerstuk."
    - slug: wat-is-jaarrekeninganalyse
      hint: "Cross-PO — wat er met de jaarrekening gebeurt nadat ze is opgesteld. PO 1.3 leerstuk."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — bronnenhiërarchie + autoriteiten-tabel + bindend/niet-bindend onderscheid bij elkaar."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "EU IAS/IFRS-verordening (rechtstreeks toepasselijk)"
    ref: "Verordening (EG) nr. 1606/2002 van 19 juli 2002"
    noot: "Verplicht IFRS voor geconsolideerde jaarrekening beursgenoteerde Belgische groepen. België heeft de optionele uitbreiding naar enkelvoudige jaarrekening NIET doorgevoerd — daar blijft B-GAAP."
  - onderwerp: "EU jaarrekeningenrichtlijn (vereist Belgische omzetting)"
    ref: "Richtlijn 2013/34/EU van 26 juni 2013"
    noot: "Bron van de grootte-categorieën (micro/klein/middelgroot/groot) — omgezet in WVV art. 1:24-25 en KB 29-04-2019."
  - onderwerp: "EU antiwitwasrichtlijn — strafrechtelijke kant"
    ref: "Richtlijn (EU) 2018/1673 van 23 oktober 2018"
    noot: "Raakt accountancy via meldingsplicht — verdere uitwerking in PO 2.5 (planning + misbruik) + de ITAA-deontologie."
  - onderwerp: "Federale bevoegdheidsverdeling boekhoudrecht"
    ref: "Grondwet (federale wetgevende bevoegdheid voor economisch recht)"
    noot: "Boekhouden + jaarrekening = federaal. Geen gewest- of gemeenschapsregels."
  - onderwerp: "Boekhoudplicht + dubbele/vereenvoudigde boekhouding"
    ref: "WER Boek III art. III.82 — III.95"
    noot: "Art. III.82 (boekhoudplichtige onderneming) · III.83 (omvang boekhouding) · III.84 (dubbele boekhouding) · III.85 (vereenvoudigd of dubbel — keuze + drempels) · III.86-89 (boeken + nummering + tijdsorde) · III.88 (bewaarplicht 7 jaar) · III.89 (inventaris) · III.90 (jaarrekening — verwijst naar WVV)."
  - onderwerp: "Boekhoudregels — Belgische vennootschappen + verenigingen"
    ref: "WVV Boek 3 (Wet 23 maart 2019)"
    noot: "Art. 3:1 (jaarrekening opmaken + AV-goedkeuring binnen 6 mnd) · 3:5 (jaarverslag — groot) · 3:6 (inhoud jaarverslag) · 3:10 (neerlegging NBB) · 3:12 (welke stukken neerleggen) · 3:13 (uitvoeringsregels) · 3:22 (consolidatie — cross-link PO 1.4) · 3:72 (controle door commissaris)."
  - onderwerp: "Uitvoering WER — boekhoudverplichtingen"
    ref: "KB van 21 oktober 2018 houdende de boekhoudkundige verplichtingen van ondernemers"
    noot: "Concretiseert dagboeken, centralisatieboek (art. 4 §1), bewaartermijn boeken (art. 8 — 7 jaar). Bijlage 1 = MAR ondernemingen · bijlage 3 = MAR verenigingen."
  - onderwerp: "Uitvoering WVV — schema's + waardering"
    ref: "KB van 29 april 2019 tot uitvoering van het WVV"
    noot: "Bevat de jaarrekening-schema's (bijlagen 3-4 vennootschappen, 6-7 verenigingen), waarderingsregels (art. 3:6 §1 — getrouw-beeld + afwijking met motivering), toelichtingsinhoud (art. 3:61), MAR uitvoeringsregels."
  - onderwerp: "ITAA-deontologische code"
    ref: "KB 9 december 2019 — code van de gecertificeerd accountants en gecertificeerd belastingadviseurs"
    noot: "Bindt de gecertificeerd accountant — onafhankelijkheid, vertrouwelijkheid, opdrachtenbrief, retentierecht. Tucht via ITAA-instanties."
  - onderwerp: "CBN-adviezen — gezaghebbend"
    ref: "Commissie voor Boekhoudkundige Normen (FOD Economie)"
    noot: "Niet bindend in strikte zin — wel de facto via getrouw-beeld-eis. Klassiekers voor PO 1.2: CBN 2017/10 (consolidatie-grootte) · CBN 2019/04 (schatting-wijziging) · CBN 2019/12 (vereenvoudigde boekhouding vzw) · CBN 2022/03 + 2022/09 (consistentie + grootte-toetsing)."


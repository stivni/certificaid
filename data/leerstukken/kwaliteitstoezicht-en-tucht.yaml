# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Permanente vorming — wettelijke basis"
    ref: "ITAA-norm permanente vorming art. 1 + 3 + 6 + 8 + 11 + 13"
    noot: "120u/3jr + min 20u/jaar. In werking sinds 1 januari 2021."
  - onderwerp: "Permanente vorming — categorieën A en B + bonus-tellings"
    ref: "ITAA-norm permanente vorming art. 7 (1°-7°)"
    noot: "Doceren = 2u per uitgevoerd uur. Publicaties = 2u per 3.000 tekens. Doceren + publicaties max 30u/jaar."
  - onderwerp: "Permanente vorming — sanctie-cascade"
    ref: "ITAA-norm permanente vorming art. 11"
    noot: "Terechtwijzing (Raad art. 85 3° Wet-ITAA) → intrekking hoedanigheid → tuchtverwijzing."
  - onderwerp: "Cel Permanente Vorming — toezichtsorgaan"
    ref: "ITAA-norm permanente vorming art. 13"
    noot: "Paritair samengesteld. Stagiairs onder stagecommissie, niet onder Cel."
  - onderwerp: "Intern kwaliteitsmanagement — kantoorniveau"
    ref: "ITAA-norm intern kwaliteitsmanagement (Belgische vertaling ISQM 1)"
    noot: "Verplicht voor elk kantoor — proportioneel naar omvang."
  - onderwerp: "ISQM 1 — Quality Management for Firms"
    ref: "ISQM 1 — IAASB"
    noot: "Acht componenten. In werking voor boekjaren vanaf 15-12-2022."
  - onderwerp: "ISQM 2 — Engagement Quality Review"
    ref: "ISQM 2 — IAASB"
    noot: "EQR verplicht bij PIE-audits + andere hoog-risico-opdrachten."
  - onderwerp: "ISA 220 — Kwaliteitsmanagement op opdrachtniveau (audit)"
    ref: "ISA 220 (herzien)"
    noot: "Opdrachtpartner persoonlijke eindverantwoordelijkheid."
  - onderwerp: "Externe kwaliteitstoetsing ITAA — wettelijke basis"
    ref: "Wet 17 maart 2019 (ITAA-wet) art. 57-60"
    noot: "Verplicht voor alle gecertificeerde leden. Aankondiging min 2 maanden vooraf (art. 58 lid 1)."
  - onderwerp: "Kwaliteitstoetsing — inzage-plicht"
    ref: "Wet 17 maart 2019 art. 58 lid 2"
    noot: "Beroepsgeheim NIET tegenstelbaar aan toetser — toetser is zelf gebonden."
  - onderwerp: "Onafhankelijkheid toetser"
    ref: "Wet 17 maart 2019 art. 57"
    noot: "Selectie volgens objectieve procedure; specifieke ITAA-opleiding."
  - onderwerp: "Tuchtprocedure — wettelijke basis"
    ref: "Wet 17 maart 2019 (ITAA-wet) Hoofdstuk 8 (Handhaving), art. 94 e.v."
    noot: "Klacht-initiatie via belanghebbende, procureur-generaal, of ambtshalve (rechtskundig assessor / Raad)."
  - onderwerp: "Tuchtprocedure — verloop + tuchtcommissie"
    ref: "Wet 17 maart 2019 art. 94-95 + 100"
    noot: "Onderzoek door rechtskundig assessor → verwijzing naar tuchtcommissie (NL/FR-kamer) → gemotiveerde uitspraak."
  - onderwerp: "Tuchtprocedure — beroep"
    ref: "Wet 17 maart 2019 art. 106"
    noot: "Commissie van Beroep ITAA. Cassatieberoep bij Hof van Cassatie mogelijk — alleen rechtsvragen."
  - onderwerp: "Sancties — vier graden + factoren bij bepaling"
    ref: "Wet 17 maart 2019 Hoofdstuk 8 + art. 100"
    noot: "Waarschuwing · berisping · schorsing max 1 jaar · schrapping. Zes factoren bij sanctie-keuze (ernst, duur, draagkracht, behaalde winst, medewerking, recidive)."
  - onderwerp: "Terechtwijzing als alternatief voor tuchtsanctie"
    ref: "Wet 17 maart 2019 art. 85 3°"
    noot: "Door Raad bij minder ernstige feiten — geen formele tuchtsanctie."
  - onderwerp: "Klager geen procespartij in tuchtrecht"
    ref: "KB 1 maart 1998 — Reglement van plichtenleer art. 6 + 7"
    noot: "Klager krijgt 'gemotiveerd resultaat'; kan worden gehoord; geen pleidooi."


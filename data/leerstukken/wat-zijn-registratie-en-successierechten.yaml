# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Koepel registratie- en successierechten (Vlaanderen)"
    ref: "Vlaamse Codex Fiscaliteit (VCF) Boek 2 (sinds 1.1.2015)"
    noot: >
      Vlaanderen heeft inning + tarieven volledig overgenomen. Brussel en
      Wallonië behouden W.Reg. (registratierechten) en W.Succ.
      (successierechten) federaal, met eigen tarief-ingrepen.
  - onderwerp: "Koepel registratierechten (Brussel + Wallonië)"
    ref: "Wetboek der registratie-, hypotheek- en griffierechten (W.Reg.)"
    noot: "Inning door FOD Financiën — Algemene Administratie van de Patrimoniumdocumentatie."
  - onderwerp: "Koepel successierechten (Brussel + Wallonië)"
    ref: "Wetboek der successierechten (W.Succ.)"
    noot: "Idem — FOD Financiën int. Tarieven met regionale variaties."
  - onderwerp: "Bevoegd gewest voor erfbelasting"
    ref: "VCF art. 5/1 (Vlaanderen) + analoge federale regel W.Succ."
    noot: "Fiscale woonplaats erflater op de dag van overlijden bepaalt het bevoegde gewest, ongeacht ligging van het vermogen."
  - onderwerp: "Huwelijksvermogensrecht — wettelijk stelsel + varianten"
    ref: "BW Boek 2 (hervorming wet 22 juli 2018, in werking 1.9.2018)"
    noot: "Federaal — geldt identiek in alle drie gewesten. Stelsel-keuze bepaalt wat in nalatenschap valt."
  - onderwerp: "Erfrecht — wettelijke devolutie + reservataire bescherming"
    ref: "BW Boek 4 (hervorming wet 31 juli 2017, in werking 1.9.2018)"
    noot: "Federaal. Overlevende echtgenoot krijgt vruchtgebruik op hele nalatenschap naast afstammelingen; afstammelingen-reserve = helft van de nalatenschap."
  - onderwerp: "Vrijstelling gezinswoning overlevende echtgenoot (Vlaanderen)"
    ref: "VCF art. 2.7.6.0.3"
    noot: "Vlaamse vrijstelling 100 % op het deel gezinswoning dat naar de overlevende echtgenoot toekomt. Brussel + Wallonië hebben eigen, beperkter vrijstellingsregime."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Geen specifieke wetsbron"
    ref: "BEP- en marginale-analyse zijn bedrijfseconomische technieken — geen wettelijke regeling."
    noot: >
      Wel verwant: de BOEKHOUDKUNDIGE behandeling van voorraad bij keuze
      tussen full en direct costing valt onder KB-WVV art. 3:18-19 + CBN 132/7
      (zie [[kostprijsmethoden-kiezen]] §Wettelijk fundament). De BESLISSINGS-
      analyse zelf is regelvrij — wel onderworpen aan trouw beeld bij externe
      rapportering van de uitkomsten.
  - onderwerp: "Make-or-buy en transfer pricing (bij intra-groep-make-or-buy)"
    ref: "WIB92 art. 185 §2 (arm's length-beginsel)"
    noot: >
      Als de 'buy'-leverancier een verbonden vennootschap is binnen dezelfde
      groep, moet de prijs marktconform zijn — anders fiscale correctie.
      Buiten scope hier; vermelding voor cross-PO-bewustzijn naar PO 2.x
      (fiscaliteit).


wettelijk_fundament:
  - onderwerp: "Wettelijk kader voorafgaande beslissingen — Dienst Voorafgaande Beslissingen"
    ref: "Wet 24 december 2002 art. 20-28"
    noot: "Programmawet — instelling van het systeem. Art. 21 regelt de aanvraagvereisten, art. 22 de uitsluitingen (vier cumulatieve gronden: 1° reeds fiscale gevolgen / administratief beroep / gerechtelijke handeling; 2° niet aangewezen of zonder uitwerking; 3° invordering en vervolgingen; 4° Pillar 2), art. 23 de bindende werking en geldigheidsduur, art. 24 de anonieme publicatie."
  - onderwerp: "Uitvoeringsbesluit ruling-procedure"
    ref: "KB 30 januari 2003 — uitvoering art. 26 Wet 24 december 2002"
    noot: "Vlaamse Codex Fiscaliteit voorziet een afzonderlijke Vlaamse ruling-procedure voor Vlaamse gewestbelastingen."
  - onderwerp: "Uitsluitingen — reeds uitgevoerd, in geschil, hypothetisch, strijdig met de wet"
    ref: "Wet 24 december 2002 art. 22"
  - onderwerp: "Bindende werking en geldigheidsduur"
    ref: "Wet 24 december 2002 art. 23"
  - onderwerp: "Algemene anti-misbruik-bepaling — relatie met ruling"
    ref: "WIB92 art. 344 §1"
    noot: "Een ruling neutraliseert het AAMB-risico voor de gespecifieerde verrichting; de DVB zal echter weigeren een ruling te geven die op AAMB botst."


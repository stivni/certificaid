wettelijk_fundament:
  - onderwerp: "Schenkingen — vormvoorschriften"
    ref: "BW Boek 4 (hervorming 2018) — schenking onroerend vereist notariële akte (art. 4.117 e.v.); schenking roerend kan via handgift met aangetekende brief"
    noot: "Civiele vormvereisten — fiscaal volgt: notariële schenking → automatische registratie + schenkbelasting; handgift → vrijwillige registratie."
  - onderwerp: "Reservatair erfdeel afstammelingen"
    ref: "BW Boek 4 (hervorming 2018) — helft van nalatenschap"
    noot: "Beperking testamentaire vrijheid + planning-impact: maximaal 'beschikbaar deel' kan toegewezen worden aan niet-reservataire erfgenamen."
  - onderwerp: "Gunstregime familiale onderneming — schenking"
    ref: "VCF art. 2.8.6.0.3"
    noot: "0 % schenkbelasting bij familiale vennootschap met reële activiteit + continuïteit + participatie 3 jaar nadien. Brussel + Wallonië: eigen verlaagd-tarief-regime."
  - onderwerp: "Gunstregime familiale onderneming — erfopvolging"
    ref: "VCF art. 2.7.4.2.2"
    noot: "3 % rechte lijn / 7 % anderen op aandelen familiale vennootschap. Vereist Vlabel-attest in aangifte van nalatenschap."
  - onderwerp: "Schenkbelasting roerend goed (aandelen) Vlaanderen"
    ref: "VCF art. 2.8.4.1.1 — vlak tarief rechte lijn 3 % / anderen 7 %"
    noot: "Sinds 2004 substantieel verlaagd om planning te stimuleren. Onroerend goed-schenking blijft progressief 3-27 %."
  - onderwerp: "Fictie schenking < 3 jaar zonder registratie"
    ref: "VCF art. 2.7.1.0.5 / W.Succ. art. 7"
    noot: "Schenking gedaan binnen 3 jaar vóór overlijden zonder schenkbelasting → behandeld als legaat. Registratie binnen termijn → fictie speelt niet."
  - onderwerp: "Voorbehoud vruchtgebruik — forfaitaire waardering"
    ref: "W.Reg. art. 47 (forfait vruchtgebruik volgens leeftijd vruchtgebruiker)"
    noot: "Schenkbelasting op blote eigendom = volle waarde min forfait. Voor 62-jarige ~14 % vruchtgebruik-forfait."
  - onderwerp: "Huwelijkscontract — verblijvings-beding + beding van aanwas"
    ref: "BW Boek 2 (hervorming 2018) — huwelijkscontract notarieel"
    noot: "Civielrechtelijk geldig; fiscaal fictie art. 2.7.1.0.7 VCF (overgang behandeld als legaat)."
  - onderwerp: "Levensverzekering — fictie + pro-rata-regel"
    ref: "VCF art. 2.7.1.0.6 / W.Succ. art. 8"
    noot: "Uitkering aan begunstigde = legaat; bij gemeenschap-financiering: 50 % belastbaar."
  - onderwerp: "Vennootschap als planningsinstrument"
    ref: "WVV (Wetboek van vennootschappen en verenigingen) + WIB 92"
    noot: "Diepere behandeling in PO 3.0 (vennootschapsrecht) + PO 2.3 (vennootschapsbelasting). Hier alleen de fiscale logica."
  - onderwerp: "Ruling Vlabel familiale onderneming"
    ref: "VCF art. 3.22.0.0.1 e.v."
    noot: "Voorafgaande beslissing bindt Vlabel voor beschreven feitenkader. Aanbevolen bij twijfel over familiale-vennootschap-kwalificatie."
  - onderwerp: "Anti-misbruik"
    ref: "VCF art. 3.17.0.0.2 / W.Reg. art. 18 § 2"
    noot: "Vlabel/fiscus kan kunstmatige structuren herkwalificeren. Toepassing bij schijn-familiale-vennootschap of artificiële vruchtgebruik-splitsing."


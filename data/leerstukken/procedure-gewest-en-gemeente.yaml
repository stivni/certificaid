# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Vlaamse bezwaartermijn"
    ref: "VCF art. 3.5.2.0.1 (3 mnd vanaf 3de werkdag na verzending aanslagbiljet) + art. 3.5.2.0.2 (aanvullende bezwaren) + art. 3.5.2.0.4 (specifiek voor onroerende voorheffing — niet vóór 31 maart van het jaar volgend op aanslagjaar)"
  - onderwerp: "Vlaamse opschorting invordering bij bezwaar"
    ref: "VCF art. 3.10.4.6.1"
  - onderwerp: "Waalse bezwaartermijn + AMB-AMB-WEGE-werking"
    ref: "Décret 6 mei 1999 art. 25-28"
    noot: "6 mnd bezwaartermijn (art. 25); bezwaarschrift dekt automatisch andere belastingen op dezelfde betwiste bestanddelen (art. 25bis)."
  - onderwerp: "Brusselse gewestelijke fiscale procedure"
    ref: "Ord. 6 maart 2019 — Brusselse Codex Fiscale Procedure (in werking 1.1.2020)"
    noot: "Brusselse Codex Fiscale Procedure (Ord. 6.3.2019) art. 100 — bezwaarinstantie = Bruxelles Fiscalité; termijn = 186 dagen vanaf 7de dag na verzending (NIET 3 mnd — atypisch lang)."
  - onderwerp: "Lokale bezwaarprocedure"
    ref: "Wet 24 december 1996 art. 9 betreffende de vestiging en de invordering van de provincie- en gemeentebelastingen"
    noot: "⚠️ te verifiëren — Wet 24.12.1996 niet rechtstreeks in RAG-corpus aangetroffen; bezwaartermijn 3 mnd bij College B&S (gemeente) of Deputatie (provincie)."
  - onderwerp: "Beroep bij fiscale rechtbank"
    ref: "WIB92 art. 1385decies + 1385undecies (Gerechtelijk Wetboek)"
    noot: "Termijn: 3 mnd vanaf kennisgeving administratieve beslissing OF stilzitten 18 mnd na bezwaar. Van toepassing bij federaal, Vlaams (via VCF), Waals (via Décret), Brussels (via Codex) en lokaal."
  - onderwerp: "Vernietigings­beroep tegen reglement"
    ref: "Gecoördineerde wetten Raad van State"
    noot: "60 dgn na bekendmaking — Afdeling Bestuursrechtspraak."
  - onderwerp: "Federale fiscale procedure (raakvlak — niet kern)"
    ref: "WIB92 art. 366 (bezwaar adviseur-generaal) + art. 371 (termijn 1 JAAR vanaf 3de werkdag) + art. 376 (ambtshalve ontheffing)"
    noot: "Voor uitwerking: zie PO 2.5."

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Cassatie — gevolgen vormgebreken aanslagbiljet"
    inhoud: "Vaste cassatierechtspraak: een aanslagbiljet zonder vermelding van bezwaar­instantie + bezwaartermijn (of met onjuiste vermelding) doet de termijn NIET ingaan — beschermings­regel ten gunste van de belasting­plichtige. Geldt voor zowel federale als gewestelijke en lokale aanslagbiljetten. Concrete arrest-referenties worden in samenvatting van PO 2.7 verder aangevuld."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd in Cassatie-rechtspraak; specifieke arrest-nummers worden in synthese-fase aangevuld"
  - onderwerp: "Raad van State — vernietiging gemeentelijke belasting­reglementen"
    inhoud: "Vaste rechtspraak van de Raad van State (Afdeling Bestuursrechtspraak) op de vier wettigheids­criteria uit [[gemeente-en-provinciebelastingen]]. Klassieke gronden voor vernietiging: ontbrekend belang van de gemeente (gelijkheidstoets fail), gebrekkige motivering, geldigheidsduur verstreken zonder vernieuwing. Concrete arrest-referenties worden in samenvatting + voorbeeldexamenvragen aangevuld."
    confidence: "⚠️ te verifiëren — concrete arrest-nummers laten we open voor synthese-fase"

footer: "Leerstuk PO 2.7. Status: voorgesteld — POC volgens ADR-037."

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Bevoegdheids­verdeling drie niveaus"
    ref: "Grondwet art. 41 + 162 + 170 + BFW 16.01.1989 art. 3 + 5"
  - onderwerp: "Lokalisatie erfbelasting + 5-jaarsregel"
    ref: "BFW art. 5 §2"
    noot: "Bevoegd gewest = laatste fiscale woonplaats overledene; bij verhuis in laatste 5 jr vóór overlijden = gewest waar overledene het langst woonde in die periode."
  - onderwerp: "Lokalisatie schenkbelasting onroerend goed"
    ref: "BFW art. 5 §2 + W.Reg. art. 132 (gewestelijke bepaling) + VCF art. 2.7-2.8"
    noot: "Bevoegd gewest = fiscale woonplaats schenker op datum schenking — niet ligging onroerend goed."
  - onderwerp: "Lokalisatie OV"
    ref: "BFW art. 3, eerste lid, 5° + VCF art. 2.1.1.0.1 (Vlaanderen)"
    noot: "Ligging van het onroerend goed."
  - onderwerp: "Lokalisatie aanvullende gemeentebelasting PB"
    ref: "WIB92 art. 466 + 467"
    noot: "Fiscale woonplaats van de belasting­plichtige op 1 januari aanslagjaar."
  - onderwerp: "Lokalisatie verkeersbelasting + BIV"
    ref: "WIGB / VCF Titel 2.2 + 2.3"
    noot: "Woonplaats titularis-inschrijver van het voertuig."
  - onderwerp: "Aanvullende gewestelijke PB + gewest-verminderingen"
    ref: "BFW art. 5/1 e.v. + WIB92 art. 96/1-96/4 + art. 14538/1"
    noot: "Voor inhoudelijke verminderingen + tarieven: zie PO 2.1 en concept-record gewestelijke-belastingverminderingen-pb."
  - onderwerp: "Ruling Vlabel"
    ref: "VCF Titel 3 — voorafgaande beslissingen"
  - onderwerp: "Anti-misbruik bij vestigingskeuze"
    ref: "WIB92 art. 344 §1 (algemene anti-misbruik) + VCF art. 3.17.0.0.2 (Vlaams equivalent)"

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Cassatie — werkelijke woonplaats voor fiscale lokalisatie"
    inhoud: "Vaste cassatierechtspraak bij betwistingen over fiscale woonplaats (relevant voor lokalisatie erfbelasting, schenkbelasting, aanvullende gewestelijke PB): de FEITELIJKE situatie weegt zwaarder dan de inschrijving in het rijksregister. Centrum van levensbelangen + duurzaamheid + woon-werk-patroon = beslissende elementen. Belangrijk bij Vermeulen-type cases waarin een verhuis kort voor overlijden of schenking wordt geopereerd om gunstigere gewest-tarieven op te zoeken — anti-misbruik kan getriggerd worden."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd in Cassatie + Hof van Beroep-rechtspraak; specifieke arrest-nummers worden in synthese-fase aangevuld"
  - onderwerp: "Grondwettelijk Hof — gelijkheidstoets gewest-tariefverschillen"

# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Verplichte registratie + termijnen authentieke akten"
    ref: "W.Reg. art. 19 + art. 32 / VCF art. 3.12.3.0.1"
    noot: "Authentieke akten over onroerend goed, schenkingen, vennootschap: 15 dagen vanaf akte."
  - onderwerp: "Termijn onderhandse akten vastgoed-overdracht"
    ref: "W.Reg. art. 32, 4° (4 maanden) — analoge VCF-bepaling"
    noot: "Compromis, onderhandse schenking, huur > 9 jaar: 4 maanden."
  - onderwerp: "Aanwijzing van lastgever (command/déclaration de command)"
    ref: "W.Reg. art. 158, 1° / VCF art. 2.9.6.0.1"
    noot: "Drie cumulatieve voorwaarden: voorbehoud in compromis, authentieke aanwijzingsakte, registratie uiterlijk de eerste werkdag na compromis. Bij niet-naleving: wederverkoop → tweemaal verkooprecht."
  - onderwerp: "Solidaire aansprakelijkheid notaris"
    ref: "W.Reg. art. 35"
    noot: "Notaris is solidair aansprakelijk voor het verkooprecht bij notariële akten."
  - onderwerp: "Belastingverhoging bij laattijdige aangifte/registratie (Vlaanderen)"
    ref: "VCF art. 3.18.0.0.4 + uitvoeringsbesluiten"
    noot: "Verhoging variërend van 10 % (eerste overtreding goede trouw) tot 200 % (herhaling/fraude)."
  - onderwerp: "Nalatigheidsinteresten"
    ref: "VCF art. 3.9.2.0.1 / federaal: KB Wetboek W.Reg."
    noot: "Op het verschuldigde recht + boete vanaf wettelijke vervaldag."
  - onderwerp: "Bezwaarprocedure Vlabel"
    ref: "VCF art. 3.5.1.0.4 (termijn 3 maanden vanaf aanslagbiljet)"
    noot: "Schriftelijk, gemotiveerd, bij Vlabel. Bij afwijzing → gerechtelijk via fiscale rechtbank."

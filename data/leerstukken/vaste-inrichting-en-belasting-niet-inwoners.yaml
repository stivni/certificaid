rechtspraak:
  - onderwerp: "Schumacker — niet-inwoners met 75%-Belgisch inkomen"
    inhoud: "HJEU 14 februari 1995, C-279/93 (Schumacker): niet-inwoner van een EU-lidstaat die ≥ 75% van zijn wereldinkomen uit een andere lidstaat haalt, moet voor persoonlijke aftrekken gelijkgesteld worden met inwoner van die staat. Belgische omzetting via WIB92 art. 243/1."
  - onderwerp: "Berlioz / Brisal (HJEU) — bronheffing bij niet-inwoners en EU-vrijheid"
    inhoud: "Klassieke HJEU-arresten over discriminatie van niet-inwoners bij bronheffing. Vaste leer: bronheffing zonder mogelijkheid van aftrek werkelijke kosten kan strijdig zijn met EU-dienstenverkeer-vrijheid."
    confidence: "⚠️ te verifiëren in primaire bron"


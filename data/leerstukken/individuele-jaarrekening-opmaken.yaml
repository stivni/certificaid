wettelijk_fundament:
  - onderwerp: "Verplichting tot opmaak jaarrekening + verantwoordelijkheid bestuursorgaan"
    ref: "WVV art. 3:1"
  - onderwerp: "Schema-keuze + drempels groottecategorieën"
    ref: "WVV art. 1:24 (klein) · art. 1:25 (micro)"
    noot: "Exacte bedragen: Cijferzakboekje — verhoogd door Wet 28 maart 2024"
  - onderwerp: "Waarderingsregels enkelvoudig"
    ref: "KB-WVV art. 3:1 e.v."
  - onderwerp: "Resultaatbestemming + dubbele uitkeringstest BV/CV"
    ref: "WVV art. 5:141-5:144 (BV) · art. 6:114-6:117 (CV) · art. 7:212-7:214 (NV)"
  - onderwerp: "Sociale balans"
    ref: "Wet 22 december 1995 + KB 4 augustus 1996"
    noot: "Integrerend deel jaarrekening; CBN-advies S100 + 2009/12 voor scope-vragen"
  - onderwerp: "Termijn opmaak + AV-voorlegging (6 maanden)"
    ref: "WVV art. 3:1 § 1"
  - onderwerp: "Termijn NBB-neerlegging (30 dagen + max 7 maanden)"
    ref: "WVV art. 3:10"
    noot: "Eerder vermeld als 'KB-WVV art. 3:31' — fout. Dat artikel betreft de geconsolideerde JR, niet de enkelvoudige."
  - onderwerp: "Sanctie bij niet-naleving termijnen"
    ref: "WVV art. 2:70 (gerechtelijke ontbinding) · WIB art. 444 (hoofdsanctie laattijdige aangifte)"
    noot: "Eerder vermeld als 'WVV art. 2:74' (ambtshalve ontbinding) — fout. WIB art. 218 raakt voorafbetalingen, niet neerlegging zelf."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Voorraadwaardering — verplichte full-costing-aanpak voor wettelijke JR"
    ref: "KB-WVV art. 3:18 (aanschaffingswaarde) + art. 3:19 (vervaardigingsprijs) + CBN-advies 132/7"
    noot: >
      De wettelijke jaarrekening eist dat productiekosten in voorraad
      gewaardeerd zijn tegen vervaardigingsprijs — inclusief redelijk
      aandeel in productie-overhead. Direct-costing-voorraad is dus
      enkel voor interne sturing, niet voor neerlegging.
  - onderwerp: "Voorraadwaarderingsmethodes (FIFO · LIFO · gewogen gemiddelde · individualisatie)"
    ref: "KB-WVV art. 3:21"
  - onderwerp: "Onderbenutting van capaciteit — idle-capacity-kost"
    ref: "IAS 2 §13 (analoge logica onder KB-WVV: niet-toegerekende vaste OH bij abnormale onderbenutting direct in resultaat)"
    noot: >
      Voorkomt dat een tegenvallend productiejaar artificieel hogere
      eenheidskosten produceert door alle vaste OH over een kleinere
      productie uit te smeren. Toepassing bij Meridia indien bezetting
      onder normale capaciteit valt.
  - onderwerp: "Materiële variantie — pro-rata-spreiding over voorraad én KGV"
    ref: "Vuistregel — geen specifiek wetsartikel. IAS 2 + CBN-praktijk: bij niet-materiële variantie integraal in resultaat (658/758); bij materiële afwijking pro-rata-correctie."
    noot: "5%-drempel is praktijk-vuistregel (🤖), geen wettelijke materialiteitsdrempel."

footer: "Leerstuk PO 1.8 — lstk 2 van 4 (hoe-leerstuk, hoofdgewicht). Status: voorgesteld."

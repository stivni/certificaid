# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Legaliteitsbeginsel — federaal · gewest · provincie · gemeente"
    ref: "Grondwet art. 170 §1-§4"
    noot: "§1 federaal-wet; §2 gewest-decreet/ordonnantie; §3 provincie-raadsbeslissing; §4 gemeente-raadsbeslissing."
  - onderwerp: "Gemeentelijke + provinciale autonomie voor eigen belangen"
    ref: "Grondwet art. 41 + art. 162"
  - onderwerp: "Gelijkheid + non-discriminatie inzake belastingen"
    ref: "Grondwet art. 10-11 + art. 172"
  - onderwerp: "Gewestelijke fiscale bevoegdheid — lijst eigen belastingen"
    ref: "Bijzondere Financieringswet 16.01.1989 (BFW) art. 3"
    noot: "Lijst van overgedragen gewestbelastingen: registratierechten op onroerende overdrachten + schenkbelasting + erfbelasting + onroerende voorheffing + verkeersbelasting + BIV + eurovignet + spelen-en-weddenschappen."
  - onderwerp: "Aanvullende gewestelijke personenbelasting"
    ref: "BFW art. 5/1 e.v. (versie 2014) + WIB92 art. 96/1-96/4"
    noot: "Gewest kan opcentiemen + kortingen op gewestelijke schijf PB instellen + eigen belastingverminderingen."
  - onderwerp: "Non-bis-in-idem — verbod gemeente/provincie opcentiemen op federale directe belastingen"
    ref: "WIB92 art. 464"
    noot: "Verbod opcentiemen op PB, VenB, RPB, BNI. Uitdrukkelijke uitzondering: aanvullende gemeentebelasting PB (art. 465-470/2) is wel toegelaten. Voor OV: art. 464/1 laat gemeentelijke + provinciale opcentiemen op de OV uitdrukkelijk toe."
  - onderwerp: "Verbod opcentiemen op BIV"
    ref: "WIGB art. 107 + VCF art. 2.3.4.2.2"
  - onderwerp: "Vlaamse gewestelijke fiscale code"
    ref: "Vlaamse Codex Fiscaliteit (Decreet 13.12.2013) — VCF"
    noot: "Bundelt OV (Titel 2.1), verkeersbelasting (2.2), BIV (2.3), leegstandsheffing bedrijfsruimten (2.6), erfbelasting + registratiebelasting (2.7-2.8) en de procedure (Titel 3). Beheerd door Vlabel."
  - onderwerp: "Brusselse gewestelijke fiscale procedure"
    ref: "Ordonnantie van 6 maart 2019 — Brusselse Codex Fiscale Procedure"
    noot: "⚠️ te verifiëren via primaire bron — niet rechtstreeks in RAG-corpus aanwezig; vermeld via concept-record gewestelijke-fiscale-procedure."
  - onderwerp: "Waalse gewestelijke fiscale procedure"
    ref: "Decreet van 6 mei 1999 betreffende de vestiging, de invordering en de geschillen inzake de Waalse gewestelijke belastingen"
  - onderwerp: "Lokale belastingreglement — bevoegdheid gemeenteraad"
    ref: "Grondwet art. 170 §4 + Decreet over het Lokaal Bestuur (Vl) + Wet 24.12.1996 (gemeente- en provinciebelastingen, federaal kader)"
    noot: "⚠️ te verifiëren — Wet 24.12.1996 niet rechtstreeks in RAG-corpus aangetroffen; vermeld via concept-record lokale-belasting-reglement."

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Grondwettelijk Hof — gelijkheidstoets gemeentelijke belastingen"
    inhoud: "Vaste rechtspraak van het Grondwettelijk Hof: een gemeentelijk belastingreglement moet gelijke gevallen gelijk behandelen; ongelijke behandeling vereist een objectieve en redelijke rechtvaardiging die in verhouding staat tot het doel van het reglement (art. 10-11 + 172 GW). Toepassing op lokale belastingen wordt uitgewerkt in [[gemeente-en-provinciebelastingen]]."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd in tientallen GwH-arresten; specifieke arrest-referenties laten we open voor het synthese-leerstuk waar de wettigheidstoets concreet wordt toegepast"

footer: "Leerstuk PO 2.7. Status: voorgesteld — POC volgens ADR-037."

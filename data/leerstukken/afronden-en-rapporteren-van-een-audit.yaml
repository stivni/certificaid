# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Evaluatie van afwijkingen"
    ref: "ISA 450 §4-9"
    noot: "Drie categorieën (feitelijke + afgeleide + beoordelings); accumulatie + evaluatie tegen materialiteit."
  - onderwerp: "Schattingen"
    ref: "ISA 540 (herzien)"
    noot: "Schatting-evaluatie + onafhankelijke schatting + presentatie + toelichting. Verifieerd via MCP."
  - onderwerp: "Gebeurtenissen na balansdatum"
    ref: "ISA 560"
    noot: "Aanpassende vs niet-aanpassende gebeurtenissen tussen balansdatum en verslagdatum."
  - onderwerp: "Continuïteit"
    ref: "ISA 570 §22 + KB WVV art. 3:6 §1"
    noot: "Going concern als waarderingsbasis; aparte sectie 'onzekerheid van materieel belang m.b.t. continuïteit' wanneer relevant."
  - onderwerp: "Letter of Representation"
    ref: "ISA 580 §10"
    noot: "Schriftelijke bevestiging management — verantwoordelijkheid + volledigheid mededelingen."
  - onderwerp: "Andere informatie (jaarverslag)"
    ref: "ISA 720"
    noot: "Consistentie-check met jaarrekening; aparte vermelding in verslag bij niet-gecorrigeerde inconsistentie."
  - onderwerp: "Oordeel goedkeurend"
    ref: "ISA 700 (herzien) §20-49"
    noot: "Modelverslag + verplichte secties + ITAA-KMO-controlenorm voor Belgische toepassing. Verifieerd via MCP."
  - onderwerp: "Modificaties van het oordeel"
    ref: "ISA 705 (herzien) §7-10"
    noot: "Voorbehoud §7 · afkeurend §8 · onthouding §9-10. ITAA-KMO §119 (voorbehoud) + §121 (oordeelonthouding) als Belgische bewoordingen. Verifieerd via MCP."
  - onderwerp: "Paragraaf benadrukking + andere aangelegenheden"
    ref: "ISA 706 (herzien)"
    noot: "Emphasis of Matter + Other Matter — zonder modificatie van oordeel."
  - onderwerp: "Documentatie"
    ref: "ISA 230 + ISA 220 (herzien) §31 + §36"
    noot: "Voldoende documentatie zodat ervaren niet-betrokken auditor werkzaamheden + conclusies kan begrijpen; slot-review + EQR."
  - onderwerp: "Bewaring revisiedossier — 10 jaar"
    ref: "Wet 7 december 2016 (bedrijfsrevisoren) art. 16 · Wet 17 maart 2019 (ITAA) + KB"
    noot: "Vertrekt vanaf datum controleverslag."
  - onderwerp: "Vermeldingen-plicht commissaris België"
    ref: "WVV art. 3:75"
    noot: "Bestuursverslag-consistentie + boekhouding overeenstemt met BBA + overtredingen WVV."


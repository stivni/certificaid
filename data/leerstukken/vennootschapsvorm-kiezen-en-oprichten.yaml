wettelijk_fundament:
  - onderwerp: "BV — geen minimumkapitaal, financieel plan + toereikend aanvangsvermogen"
    ref: "WVV art. 5:3 + 5:4"
    noot: "Het kapitaalconcept verdwijnt in de BV; schuldeisersbescherming via financieel plan + uitkeringstesten."
  - onderwerp: "BV — inbreng in natura (bedrijfsrevisorenverslag)"
    ref: "WVV art. 5:7"
    noot: "Bedrijfsrevisor — niet accountant. Bijzonder verslag oprichters + verslag revisor over waardering."
  - onderwerp: "NV — minimumkapitaal 61.500 EUR + volstorting bij oprichting"
    ref: "WVV art. 7:2 + 7:11"
    noot: "Volledige plaatsing; minstens 1/4 volgestort; inbrengen in natura volledig volstort."
  - onderwerp: "NV — inbreng in natura (bedrijfsrevisorenverslag)"
    ref: "WVV art. 7:7"
    noot: "Analoog aan BV 5:7."
  - onderwerp: "Oprichtersaansprakelijkheid BV — drie jaar"
    ref: "WVV art. 5:15"
    noot: "Bij faillissement binnen 3 jaar na oprichting: oprichters hoofdelijk aansprakelijk voor verbintenissen indien aanvangsvermogen kennelijk ontoereikend."
  - onderwerp: "Oprichtersaansprakelijkheid NV — drie jaar"
    ref: "WVV art. 7:17"
    noot: "Analoog aan BV 5:15."
  - onderwerp: "WVV-overgang BVBA → BV (van rechtswege per 2020)"
    ref: "WVV — overgangsbepalingen Wet 23.3.2019"
    noot: "Geen besluit AV, geen accountantsverslag, geen liquiditeitstest. Oud BVBA-kapitaal wordt 'statutair onbeschikbare inbreng' (CBN-advies 2019/14)."
  - onderwerp: "Vrijwillige omzetting van rechtsvorm — Boek 14"
    ref: "WVV art. 14:3 + 14:5 + 14:8"
    noot: "Bestuursverslag + staat activa/passiva max 3 mnd oud + accountant- of revisorenverslag + AV-besluit notariële akte. Volledig uitgewerkt in [[bijzondere-mandaten-van-de-accountant]]."
  - onderwerp: "Groottecategorieën (klein/microvennootschap) — cross-PO doorklik"
    ref: "WVV art. 1:24-1:26 (cross-PO [[1.2]])"
    noot: "Bepalend voor jaarrekening-schema + audit-vereiste. Geen leerstof in PO 3.0."


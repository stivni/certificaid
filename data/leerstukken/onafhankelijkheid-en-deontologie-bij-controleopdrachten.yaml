wettelijk_fundament:
  - onderwerp: "Onafhankelijkheid accountants — weigeringsplicht"
    ref: "KB 1 maart 1998 art. 9"
    noot: "Accountant moet opdracht weigeren of beëindigen bij elke invloed, feit of band die zijn onafhankelijkheid, beoordelingsvrijheid of onpartijdigheid kan aantasten. Verifieerd via MCP. Nog actief geldig."
  - onderwerp: "Belangenconflict accountants"
    ref: "KB 1 maart 1998 art. 11"
    noot: "Verbod aanvaarden of voortzetten opdracht bij belangenconflict; verplichting cliënt te informeren. Verifieerd via MCP."
  - onderwerp: "Anti-concentratie accountants"
    ref: "KB 1 maart 1998 art. 14"
    noot: "Verbod beperking activiteit tot één belangengroep of één gezag. Verifieerd via MCP."
  - onderwerp: "Deontologische code ITAA"
    ref: "KB 9 december 2019"
    noot: "Operationalisering bedreigingen-kader + safeguards. Naast (niet vervangend) KB 1998."
  - onderwerp: "Statuut bedrijfsrevisor + onafhankelijkheid"
    ref: "Wet 7 december 2016 betreffende organisatie revisoraat"
    noot: "Algemene onafhankelijkheids-bepalingen + cumul-verboden voor revisoren."
  - onderwerp: "OOB-controles — Verordening 537/2014"
    ref: "EU-Verordening 537/2014"
    noot: "Verboden niet-controle-diensten + 10-jarige kantoor-rotatie + 7-jarige partner-rotatie voor OOB. Niet van toepassing voor REVIA niet-OOB."
  - onderwerp: "IESBA Code — bedreigingen-kader"
    ref: "IESBA International Code of Ethics for Professional Accountants — Part 1 (algemeen) + Part 4 (onafhankelijkheid)"
    noot: "5 bedreigingen-categorieën + safeguards-cyclus + percentage-drempels (15 % honoraria · 7-jarige partner-rotatie OOB)."
  - onderwerp: "Kwaliteitsmanagement kantoor"
    ref: "ISQM 1"
    noot: "8 componenten van kwaliteitsmanagement-systeem; jaarlijkse evaluatie. In voege sinds 15-12-2022."
  - onderwerp: "Kwaliteitsmanagement opdracht"
    ref: "ISA 220 (herzien)"
    noot: "Opdrachtpartner-verantwoordelijkheid; team-samenstelling + supervisie + slot-review + documentatie. Verifieerd via MCP."
  - onderwerp: "Engagement Quality Reviews"
    ref: "ISQM 2"
    noot: "EQR-vereisten voor OOB + complex; onafhankelijke partner-review vóór ondertekening."
  - onderwerp: "Cross-PO — kantoor-brede deontologie"
    ref: "PO 4.0 — Wet 17 maart 2019 (ITAA) art. 29 + 32 + 49 + 65 e.v."
    noot: "Tucht + kwaliteitstoetsing + permanente vorming + AWW. Uitgewerkt in [[deontologische-beginselen-en-onafhankelijkheid]] en [[kwaliteitstoezicht-en-tucht]]."


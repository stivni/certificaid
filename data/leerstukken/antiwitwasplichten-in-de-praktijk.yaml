# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Antiwitwaswet — algemene basis"
    ref: "Wet 18 september 2017 tot voorkoming van het witwassen van geld en de financiering van terrorisme en tot beperking van het gebruik van contanten"
    noot: "Zet EU 5e en 6e antiwitwasrichtlijn om. Vervangt oude AML-wet 11 januari 1993."
  - onderwerp: "Onderworpen entiteiten — gecertificeerd accountant"
    ref: "Wet 18 september 2017 art. 5 §1 23°"
    noot: "Geldt ook voor stagiairs en voor het kantoor als rechtspersoon. Werknemers via interne procedures (art. 10)."
  - onderwerp: "Cliëntenonderzoek (KYC) — verplichte componenten"
    ref: "Wet 18 september 2017 art. 19 + 21-32"
    noot: "Identificatie cliënt + lasthebbers + UBO + aard zakelijke relatie + doorlopende waakzaamheid."
  - onderwerp: "UBO — definitie + drempel 25%"
    ref: "Wet 18 september 2017 art. 4 27°"
    noot: "Natuurlijke persoon met > 25% directe/indirecte eigendom/controle/winsten. Subsidiary mechanism bij versplintering."
  - onderwerp: "UBO-register"
    ref: "Wet 26 juni 2020 — instelling UBO-register + gewijzigde artikelen WER + Antiwitwaswet"
    noot: "Centraal Belgisch register beheerd door FOD Financiën. Cliënt verantwoordelijk voor registratie + update."
  - onderwerp: "Risicogebaseerde benadering"
    ref: "Wet 18 september 2017 art. 37-41"
    noot: "Drie regimes: vereenvoudigd (art. 41) · standaard · verscherpt (art. 37-40)."
  - onderwerp: "Cash-cap 3.000 EUR per transactie"
    ref: "Wet 18 september 2017 art. 67"
    noot: "Sanctie art. 137 — geldboete 250 tot 225.000 EUR + max 10% van het bedrag boven de cap."
  - onderwerp: "CFI-meldingsplicht — wettelijke uitzondering op beroepsgeheim"
    ref: "Wet 18 september 2017 art. 47-59"
    noot: "Bij vermoeden witwassen of terrorisme-financiering. Immuniteit melder via art. 57."
  - onderwerp: "Tipping-off-verbod"
    ref: "Wet 18 september 2017 art. 55"
    noot: "Geen mededeling aan cliënt of derden dat melding gemaakt of onderzoek loopt."
  - onderwerp: "Uitzonderingen op tipping-off"
    ref: "Wet 18 september 2017 art. 56 §3"
    noot: "Ontraden cliënt · ITAA-kennisgeving · parket/politie repressief · collega's zelfde entiteit/verrichting."
  - onderwerp: "Juridisch-advies-uitzondering op meldingsplicht"
    ref: "Wet 18 september 2017 art. 53"
    noot: "Bij 'bepalen rechtspositie' of 'verdediging in rechtsgeding'. Vervalt bij eigen deelname witwassen."
  - onderwerp: "AMLCO — aanstelling"
    ref: "Wet 18 september 2017 art. 9 §2"
    noot: "Onderscheiden persoon vanaf 10 beroepsbeoefenaars. Stagiairs uitgesloten."
  - onderwerp: "UBO-discrepantie-melding"
    ref: "Wet 18 september 2017 art. 74"
    noot: "Bij discrepantie UBO-register vs eigen cliëntonderzoek — meldingsplicht aan toezichthouder."
  - onderwerp: "Administratieve sancties"
    ref: "Wet 18 september 2017 art. 132"
    noot: "Tot 1,25 mln EUR. Door ITAA als toezichtsorgaan voor zijn leden."
  - onderwerp: "Knipperlichten-lijst (niet-limitatief)"
    ref: "ITAA-Handleiding interne procedures AWW 2019 art. 19"
    noot: "Pedagogische lijst die de stagiair moet kunnen herkennen."
  - onderwerp: "10-jaar bewaarplicht AML-dossier"
    ref: "ITAA-Handleiding interne procedures AWW 2019 punt 12.4.2.2-3"
    noot: "Vanaf einde verrichting of einde zakelijke relatie."

footer: "Leerstuk PO 4.0. Status: voorgesteld — POC volgens ADR-037."

    noot: "Sleutel-alinea's: 6 (definities), 15-17 (initiële kostprijs incl. directly attributable), 29-42 (cost vs revaluation model), 43-44 (componentbenadering), 55 (niet stopzetten afschrijving), 60-62 (afschrijvingsmethode patroon-eis)."
  - onderwerp: "Immateriële vaste activa — definitie + opname + R&D-onderscheid"
    ref: "IAS 38 — Intangible Assets (Verordening (EU) 2023/1803)"
    noot: "Sleutel-alinea's: 8-17 (definitie + identifiability + control), 21-23 (opname-criteria), 54-67 (research vs development + 6 criteria), 88-110 (finite vs indefinite life), 48 (internally generated goodwill verboden)."
  - onderwerp: "Presentatie + verbod 'extraordinary items'"
    ref: "IAS 1 — Presentation of Financial Statements (Verordening (EU) 2023/1803)"
    noot: "IAS 1.87 verbiedt 'extraordinary items' in resultaat of toelichting. IAS 1.97 vereist afzonderlijke vermelding van materiële posten binnen gewone exploitatie- of financiële resultaten."
  - onderwerp: "Impairment-test voor vaste activa (cross-cutting)"
    ref: "IAS 36 — Impairment of Assets (Verordening (EU) 2023/1803)"
    noot: "Bij indicaties: vergelijk boekwaarde met realiseerbare waarde (= hoogste van fair value − sales cost en value-in-use). Jaarlijks verplicht voor goodwill + indefinite-life IMA + niet-in-gebruik-genomen IMA."
  - onderwerp: "BE-GAAP — afschrijving + waardevermindering vaste activa"
    ref: "KB-WVV 29.04.2019 art. 3:35 t/m art. 3:43"
    noot: "Art. 3:35 lineair als standaard, andere methodes toegelaten. Art. 3:43 waardevermindering verplicht bij duurzame minderwaarde."
  - onderwerp: "BE-GAAP — facultatieve herwaardering"
    ref: "KB-WVV 29.04.2019 art. 3:35"
    noot: "Beperkt tot MVA + FVA. Duurzame meerwaarde + zekere/vaststaande rendabiliteit. Tegenboeking klasse 12 eigen vermogen."
  - onderwerp: "BE-GAAP — IMA herkenning + activering"
    ref: "CBN-advies 2012/13 (immateriële vaste activa)"
    noot: "Drie criteria: identificeerbaar + gecontroleerd + toekomstig economisch voordeel. Activering ontwikkelingskosten toegelaten mits criteria voldaan."
  - onderwerp: "BE-GAAP — keuze afschrijvingsmethode"
    ref: "CBN-advies 2010/15 (afschrijvingsmethoden)"
    noot: "Onder BE-GAAP is degressief als ZELFSTANDIGE methode aanvaardbaar (mits levensduur-respecterend), in tegenstelling tot IAS 16 dat patroon-eis stelt."


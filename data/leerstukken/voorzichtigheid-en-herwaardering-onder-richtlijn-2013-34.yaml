rechtspraak:
  - onderwerp: "EU-Hof van Justitie — strikte interpretatie voorzichtigheidsbeginsel"
    inhoud: "Het Hof van Justitie heeft in vaste rechtspraak bevestigd dat het voorzichtigheidsbeginsel uit Richtlijn 2013/34/EU (en de voorganger 78/660/EEG) een asymmetrische verplichting oplegt: latente winsten mogen NIET in resultaat tot ze gerealiseerd zijn, terwijl verplichtingen met oorsprong in het boekjaar wél onmiddellijk moeten worden opgenomen. Een Belgische onderneming die afwijkt riskeert herclassificatie door commissaris of fiscus."
    confidence: "⚠️ te verifiëren — algemene leer; specifieke arrest-referenties niet aangetroffen in RAG-corpus, kunnen voor leerstuk weggelaten worden indien niet examen-relevant"

footer: "Leerstuk PO 1.5. Status: voorgesteld."

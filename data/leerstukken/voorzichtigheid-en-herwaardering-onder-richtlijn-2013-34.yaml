wettelijk_fundament:
  - onderwerp: "Algemene beginselen voor financiële verslaglegging — going concern, bestendigheid, voorzichtigheid, matching, materialiteit"
    ref: "Richtlijn 2013/34/EU art. 6"
    noot: "Acht beginselen (a t/m i in lid 1). Voorzichtigheid (c) verder uitgesplitst in drie sub-bepalingen (i, ii, iii)."
  - onderwerp: "Realisatiebeginsel — winsten enkel gerealiseerd opnemen"
    ref: "Richtlijn 2013/34/EU art. 6, lid 1, c), i)"
    noot: "Letterlijke tekst getoetst op examen 2024-1 vraag 7B (eerste stelling)."
  - onderwerp: "Asymmetrische verplichtingen — alle verplichtingen met oorsprong in boekjaar opnemen, ook bij latere kennis"
    ref: "Richtlijn 2013/34/EU art. 6, lid 1, c), ii)"
    noot: "Letterlijke tekst getoetst op examen 2024-1 vraag 7B (tweede stelling). Aansluiting met IAS 10 / CBN-advies 2019/04."
  - onderwerp: "Negatieve waardecorrecties onvoorwaardelijk — afschrijvingen + waardeverminderingen ongeacht winst/verlies"
    ref: "Richtlijn 2013/34/EU art. 6, lid 1, c), iii)"
    noot: "Letterlijke tekst getoetst op examen 2024-1 vraag 7B (derde stelling)."
  - onderwerp: "Herwaarderings-optie — lidstaat kan toestaan of voorschrijven"
    ref: "Richtlijn 2013/34/EU art. 7, lid 1"
    noot: "Lidstaat-keuze: optioneel ('toestaan') of verplicht voor categorieën ('voorschrijven'). Examen-stellingen toetsen de Richtlijn-tekst, niet automatisch de Belgische omzetting. Getest op examen 2024-1 vraag 7B (vierde stelling)."
  - onderwerp: "Tegenboeking herwaardering in eigen vermogen (herwaarderingsreserve)"
    ref: "Richtlijn 2013/34/EU art. 7, lid 2"
    noot: "Verschil tussen aanschaffingsprijs en geherwaardeerd bedrag op creditzijde eigen vermogen — consistent met realisatiebeginsel art. 6 lid 1 c (i)."
  - onderwerp: "Belgische omzetting voorzichtigheids-beginselen"
    ref: "KB-WVV 29.04.2019 art. 3:10 (waarderingen voorzichtigheid + oprechtheid + goede trouw) + art. 3:11 e.v."
    noot: "Integrale omzetting Richtlijn 2013/34/EU art. 6 — geen strengere of mildere afwijking."
  - onderwerp: "Belgische omzetting herwaarderings-optie — facultatief"
    ref: "KB-WVV 29.04.2019 art. 3:35 (facultatieve herwaardering MVA + FVA)"
    noot: "Voorwaarden: duurzame meerwaarde + zekere/vaststaande rendabiliteit. Tegenboeking klasse 12 eigen vermogen. Niet uitkeerbaar als dividend zolang niet gerealiseerd."
  - onderwerp: "IFRS-pendant herwaardering — revaluation model"
    ref: "IAS 16.31 (Verordening (EU) 2023/1803)"
    noot: "Keuze per MVA-klasse: cost model (alinea 30) of revaluation model (alinea 31). Reële waarde minus latere afschrijvingen."
  - onderwerp: "IFRS-pendant fair value definitie + hiërarchie"
    ref: "IFRS 13 — Fair Value Measurement (Verordening (EU) 2023/1803)"
    noot: "Overkoepelende definitie + hiërarchie level 1/2/3 voor alle IFRS-standaarden die fair value gebruiken."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Bezwaar — bij wie + vorm"
    ref: "WIB92 art. 366"
    noot: "Schriftelijk, gemotiveerd, ondertekend, bij adviseur-generaal AAFisc."
  - onderwerp: "Bezwaartermijn directe belastingen"
    ref: "WIB92 art. 371"
    noot: "**1 jaar** vanaf 3e werkdag na verzending aanslagbiljet. NIET 6 maanden."
  - onderwerp: "Reformatio in pejus verboden"
    ref: "WIB92 art. 375"
    noot: "Adviseur-generaal mag aanslag niet verhogen op bezwaar — alleen handhaven, verminderen of vernietigen."
  - onderwerp: "Ambtshalve ontheffing (cross-fase rechtsmiddel)"
    ref: "WIB92 art. 376"
    noot: "5 jaar — voor materiële vergissingen + dubbele belasting; geen verkorting tot bezwaartermijn."
  - onderwerp: "Invordering — bezwaar schorst niet"
    ref: "WIB92 art. 410"
    noot: "Onbetwist deel opeisbaar; bewarend beslag mogelijk."
  - onderwerp: "Gerechtelijke fase — rechtbank fiscale kamer"
    ref: "Ger.W. art. 569 16° (bevoegdheid) + art. 1385undecies (termijn + fictieve afwijzing)"
    noot: "3 maanden vanaf kennisgeving directeursbeslissing; fictieve afwijzing na 6 maanden stilzwijgen."
  - onderwerp: "Fiscale Bemiddelingsdienst"
    ref: "Wet 25.4.2007 betreffende de fiscale bemiddelingsdienst"
    noot: "Aanvraag schorst de termijn voor beroep naar rechtbank tot afsluiting bemiddeling. Sinds 2019 ook bevoegd voor invorderingsgeschillen."
  - onderwerp: "Motiveringsplicht directeursbeslissing"
    ref: "Wet 29.7.1991"
  - onderwerp: "Gewest-bezwaartermijnen (cross-PO doorklik [[2.7]])"
    ref: "VCF art. 3.5.2.0.1 (Vl 3 mnd) · Brusselse Codex Fiscale Procedure art. 100 (Br 186 dagen) · Décret 6.5.1999 art. 25 (W 6 mnd)"
  - onderwerp: "Lokale bezwaarprocedure (cross-PO doorklik [[2.7]])"
    ref: "Wet 24.12.1996 art. 9 (gemeente + provincie, 3 maanden)"


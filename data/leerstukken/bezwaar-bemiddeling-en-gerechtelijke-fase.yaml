rechtspraak:
  - onderwerp: "Cassatie — start bezwaartermijn op 3e werkdag na verzending"
    inhoud: "Vaste rechtspraak: de bezwaartermijn van art. 371 WIB start op de 3e werkdag na verzending van het aanslagbiljet — niet op de datum vermeld op het biljet, niet op de datum van ontvangst. Beschermingsregel ten gunste van de belastingplichtige; bij vormgebrek (geen of foute vermelding bezwaarinstantie/termijn) start de termijn helemaal niet."
    confidence: "⚠️ te verifiëren — algemene leer is bestendigd; specifieke arrest-nummers nog open."
  - onderwerp: "Cassatie — reformatio in pejus"
    inhoud: "Vaste rechtspraak: de adviseur-generaal mag de aanslag op bezwaar niet verhogen; ook de rechter in eerste aanleg of beroep is in fiscale procedure gehouden aan dit principe (art. 375 WIB + algemeen rechtsbeginsel)."
    confidence: "⚠️ te verifiëren — concrete arrest-nummers nog open."


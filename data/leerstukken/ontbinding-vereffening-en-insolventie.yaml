# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Te-late faillissementsaangifte als grove fout"
    inhoud: "Vaste rechtspraak: bestuurder die kennelijk wist of had moeten weten dat de onderneming was opgehouden te betalen, maar geen aangifte deed of opzettelijk vertraagde om handelingen te blijven stellen, begaat een kennelijk grove fout — aansprakelijkheid art. 2:57 + XX.225."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."
  - onderwerp: "Vrijwillige ontbinding bij staking van betaling als omzeiling"
    inhoud: "Cassatie heeft bevestigd dat een bestuur dat vrijwillige ontbinding voorstelt terwijl staking van betaling reeds was opgetreden, geen geldig alternatief stelt voor de faillissementsaangifteplicht. Een rechtbank kan in dat geval ambtshalve faillietverklaring uitspreken."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."


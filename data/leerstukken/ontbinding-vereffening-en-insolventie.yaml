# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Ontbindings-AV — bijzonder verslag bestuur + staat A&P + accountant-/revisorenverslag"
    ref: "WVV art. 2:67"
    noot: "Staat van activa en passiva max 3 maanden oud. Verslag mag door commissaris, externe accountant of bedrijfsrevisor."
  - onderwerp: "Vereffenaar — aanstelling + plichten + voorrangs-orde"
    ref: "WVV art. 2:79 e.v.; voorrangs-orde art. 2:87"
    noot: "Aangesteld door AV; aansprakelijk bij grove fout of plichtsverzaking."
  - onderwerp: "Ontbinding-en-vereffening in één akte"
    ref: "WVV art. 2:91"
    noot: "Voorwaarden cumulatief: geen vereffenaar, alle schulden voldaan/geconsigneerd (of schriftelijke instemming schuldeiser), accountant-/revisorenverslag bevestigt."
  - onderwerp: "Sluiting van vereffening"
    ref: "WVV art. 2:92"
    noot: "Sluitings-AV onderhands; bekendmaking + plaats bewaring boeken + consignatie. Vennootschap verdwijnt uit KBO."
  - onderwerp: "Heropening vereffening bij vergeten activum"
    ref: "WVV art. 2:95"
    noot: "Procedure indien achteraf actief blijkt."
  - onderwerp: "Boek XX WER — toepassingsgebied"
    ref: "WER art. XX.1 e.v."
    noot: "Insolventie van ondernemingen — alle rechtsvormen + zelfstandigen."
  - onderwerp: "Kamer voor ondernemingen in moeilijkheden"
    ref: "WER art. XX.21 e.v. + art. XX.25-XX.29 (onderzoek) + art. XX.29/1 (actieve oproeping op verzoek schuldenaar)"
    noot: "Bij ondernemingsrechtbank — ambtshalve oproeping bij signalen + actief verzoek schuldenaar."
  - onderwerp: "Ondernemingsbemiddelaar"
    ref: "WER art. XX.36-XX.38"
    noot: "Aanstelling op vraag van onderneming; vrijwillig + vertrouwelijk."
  - onderwerp: "Gerechtelijke reorganisatie — verzoekschrift + bijlagen"
    ref: "WER art. XX.41"
    noot: "Verzoekschrift bestuur aan rechtbank; opschorting van betalingen 4 mnd (verlengbaar)."
  - onderwerp: "Gerechtelijke reorganisatie — opschorting"
    ref: "WER art. XX.50 e.v."
    noot: "Werking + duur van de opschorting."
  - onderwerp: "GR — collectief akkoord (homologatie + bindendheid)"
    ref: "WER art. XX.83/15 (homologatie) + art. XX.83/20 (bindendheid)"
    noot: "Reorganisatieplan voorgelegd aan alle schuldeisers; stemming meerderheid + waarde per klasse; rechterlijke homologatie."
  - onderwerp: "Besloten gerechtelijke reorganisatie — opschorting"
    ref: "WER art. XX.83/24"
    noot: "Opschorting op verzoek van de herstructureringsdeskundige."
  - onderwerp: "Herstructureringsdeskundige"
    ref: "WER art. XX.49/2 (openbare procedure) + art. XX.83/22 e.v. (besloten variant)"
    noot: "Rechterlijke aanstelling. Accountant kan deze rol opnemen."
  - onderwerp: "Faillissement — aangifteplicht 1 maand"
    ref: "WER art. XX.102"
    noot: "Bestuur moet aangifte doen binnen 1 mnd na 'ophouden te betalen'. Plicht opgeschort vanaf neerlegging GR-verzoekschrift. Niet-aangifte = strafrechtelijk + burgerlijk aansprakelijk."
  - onderwerp: "Faillissement — vonnis van faillietverklaring + curator"
    ref: "WER art. XX.100"
    noot: "Door ondernemingsrechtbank; curator aangesteld."
  - onderwerp: "Faillissement — vonnis bij voorraad uitvoerbaar + verzet"
    ref: "WER art. XX.108"
    noot: "Vonnis bij voorraad uitvoerbaar; verzet door verstekdoende partij."
  - onderwerp: "Niet-tegenwerpbaarheid handelingen tussen staking van betaling en vonnis"
    ref: "WER art. XX.112"
    noot: "Handelingen na staking van betaling tegenstelbaar of niet."
  - onderwerp: "Wrongful trading"
    ref: "WER art. XX.225"
    noot: "Bestuurder aansprakelijk voor netto-passief van boedel bij kennelijk grove fout die heeft bijgedragen tot faillissement."
  - onderwerp: "Persoonlijke aansprakelijkheid bestuurders sociale-zekerheidsbijdragen"
    ref: "WER art. XX.226"
    noot: "Bij minstens twee faillissementen in vijf jaar."
  - onderwerp: "Beroepsverbod"
    ref: "WER art. XX.229"
    noot: "Verbod bestuursfunctie 3-10 jaar bij grove fouten bestuurder."
  - onderwerp: "Kwijtschelding restschulden gefailleerde natuurlijke persoon"
    ref: "WER art. XX.173"
    noot: "Moderner instrument — schulden definitief uitgewist."
  - onderwerp: "Rehabilitatie"
    ref: "WER art. XX.237-XX.239"
    noot: "Voor gefailleerde die geen kwijtschelding heeft verkregen + alle schulden voldoet."


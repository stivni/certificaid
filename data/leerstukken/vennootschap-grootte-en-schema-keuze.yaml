    - slug: wie-moet-boekhouden-en-hoe
      hint: "Boekhoudregime (dubbel vs vereenvoudigd) — onafhankelijk van groottecategorie. Beide samen geven het volledige plichtenpakket."
    - slug: jaarrekening-publiceren-en-sancties

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Kleine vennootschap — drie drempels enkelvoudig"
    ref: "WVV art. 1:24 §1"
    noot: "Drie criteria — jaargemiddelde werknemers · jaaromzet excl. btw · balanstotaal. Cijfers via Cijferzakboekje. Verhoogd door Wet 28-3-2024 + KB 21-3-2024 ter omzetting EU-richtlijn 2023/2775."
  - onderwerp: "Drempel-werking + twee-jaars-buffer"
    ref: "WVV art. 1:24 §2 + art. 1:25 §2"
    noot: "Meer dan één drempel overschreden moet ZICH GEDURENDE TWEE OPEENVOLGENDE BOEKJAREN voordoen vóór de status verandert. Gevolgen vanaf het BOEKJAAR VOLGEND op de tweede overschrijding."
  - onderwerp: "Microvennootschap — eigen drempels + dochter/moeder-uitsluiting"
    ref: "WVV art. 1:25 §1"
    noot: "Microvennootschap = kleine vennootschap die GEEN dochter- of moedervennootschap is en lager drempel-niveau respecteert. Dochter/moeder-uitsluiting zit in DEFINITIE — niet apart in §2."
  - onderwerp: "Moedervennootschap — geconsolideerde grootte-toetsing"
    ref: "WVV art. 1:24 §6 (verbondenheid art. 1:20)"
    noot: "Een moeder wordt op geconsolideerde basis getoetst — niet enkelvoudig. Toepassing via aggregatie + 20%-correctie of volledige consolidatie. Examen-favoriet."
  - onderwerp: "Genoteerde vennootschap — altijd groot"
    ref: "WVV art. 1:11"
    noot: "Effecten toegelaten tot verhandeling op gereglementeerde markt → altijd groot. Volledig schema + jaarverslag + commissaris + IFRS voor geconsolideerd."
  - onderwerp: "Starters — drempels te goeder trouw geschat"
    ref: "WVV art. 1:24 §3 + 1:25 §3"
    noot: "Eerstejaars-vennootschap: drempels geschat bij begin boekjaar. Geen automatische correctie voor afwijkingen."
  - onderwerp: "Groep van beperkte omvang (consolidatieplicht-drempel)"
    ref: "WVV art. 1:26 §1"
    noot: "Groep-niveau drempel — andere cijfers dan klein-vennootschap (250 FTE / 34M / 17M — geïndexeerd). Niet hetzelfde als art. 1:24. Trigger voor consolidatieplicht, niet voor schema-keuze."
  - onderwerp: "Jaarverslag — verplicht voor groot"
    ref: "WVV art. 3:5 (jaarverslag opmaken) + 3:4 (vrijstelling klein)"
    noot: "Kleine vennootschappen vrijgesteld; grote moeten jaarverslag opmaken. Inhoud van het jaarverslag uitgewerkt in art. 3:6 e.v."
  - onderwerp: "Commissarisplicht"
    ref: "WVV art. 3:72"
    noot: "Verplicht voor grote vennootschappen en voor vennootschappen in groep met >50 werknemers. Kleine vennootschap solo: vrijgesteld."
  - onderwerp: "Sociale balans — verkort vs volledig"
    ref: "KB-WVV art. 3:24"
    noot: "Verkort schema voor klein, volledig voor groot. Onderscheid relevant voor opleidingskost-bestanddelen (vraag 2008-bibf — alleen direct of ook indirect)."
  - onderwerp: "Vereniging — groottecategorieën"
    ref: "WVV-VZW art. 3:47 + KB 21-10-2018 (vereenvoudigd vzw)"
    noot: "Aparte drempels voor vzw/ivzw/stichting (geïndexeerd via Cijferzakboekje). Cascade naar boekhoud-regime (vereenvoudigd → dubbel) + schema (vereenvoudigd → verkort → volledig) + neerlegging (griffie vs NBB)."
  - onderwerp: "Vereniging — neerlegging grote vzw bij NBB"
    ref: "WVV-VZW art. 3:48"
    noot: "Grote vereniging neerlegt jaarrekening bij NBB; kleine vereniging neerlegt bij griffie ondernemingsrechtbank."
  - onderwerp: "Geconsolideerde grootte-toetsing — methodologie"
    ref: "CBN-advies 2017/10 + 2022/03"
    noot: "Aggregatie + 20%-correctie voor intra-groep of volledige consolidatie. Gezaghebbend, niet bindend — interpretatie van art. 1:24 §6 WVV."
  - onderwerp: "Definitie netto-omzet (drempel-criterium)"
    ref: "WVV art. 1:26/1"
    noot: "Geldt voor zowel de drempel-test van klein/groot als de groep-van-beperkte-omvang-test. Voor opbrengsten waarvoor meer dan helft niet beantwoordt aan netto-omzet: totaal van bedrijfs- + financiële opbrengsten excl. niet-recurrente opbrengsten."


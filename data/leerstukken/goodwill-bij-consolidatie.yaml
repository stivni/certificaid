# Leerstuk-script — goodwill bij consolidatie
#
# Hoofdvraag: wat is goodwill, hoe ontstaat ze, hoe verloopt afschrijving
# en impairment, en wat is badwill?
#
# Status: nieuw (markdown nog niet geschreven). Bouwt door op Aurelia's
# 1,6 mln goodwill uit hoe-consolideren — toont volgende stappen
# (afschrijving, impairment) over de levensduur.

meta:
  slug: goodwill-bij-consolidatie
  titel: "Goodwill bij consolidatie"
  po: "1.4"
  cluster: consolidatie
  voorbeeldgroep: aurelia
  beschrijving: >
    Leerstuk PO 1.4 — het consolidatieverschil-leerstuk: hoe ontstaat
    goodwill, hoe wordt ze nadien afgeschreven, wanneer is een
    impairment nodig, en hoe verschilt B-GAAP van IFRS?

intro:
  callout_beat: >
    Standaard leerstuk-intro. Vereiste voorkennis: [[hoe-consolideren]]
    — vooral het eerste-consolidatie-deel waar goodwill voor het eerst
    op de balans komt.

# ---------------------------------------------------------------------------

antwoord_in_een_blik:
  beats:
    - "Goodwill = aanschafprijs van de deelneming MINUS aandeel in de reële NEV van de dochter"
    - "Onder B-GAAP: lineair afschrijven over de vermoedelijke gebruiksduur (max 10 jaar als die niet betrouwbaar te schatten is) + impairment-test bij ongunstige economische omstandigheden"
    - "Onder IFRS: GEEN afschrijving — wel jaarlijkse impairment-test (verplichte review per cash-generating unit)"
    - "Badwill (negatief consolidatieverschil) = omgekeerde situatie, eigen regels"

# ---------------------------------------------------------------------------

opbouw:

  - id: hoe-ontstaat-goodwill
    titel: "Hoe ontstaat goodwill bij eerste consolidatie?"
    niveau: 2
    beats:
      - "Verwijs kort naar [[hoe-consolideren]] stap 2 voor de eerste-consolidatie-mechaniek"
      - "Recapituleer Aurelia's case: 6,0 betaald voor 80% van Bellator, aandeel in reële NEV 4,4 → goodwill 1,6"
      - "Belangrijke nuance: goodwill = na reële-waarde-herwaardering, niet vs boekwaarde"
      - "Wat goodwill conceptueel IS: premie voor merknaam, klantenrelaties, synergie — alles wat WAARDE heeft maar niet apart in de balans van de dochter stond"
    visualisaties:
      - type: tabel-inline
        kolommen: ["Component", "Bedrag (mln)"]
        rijen:
          - ["Aanschafprijs deelneming (80% van Bellator)", "**6,0**"]
          - ["Aandeel in reële NEV van Bellator (80% × 5,5)", "(4,4)"]
          - ["**Goodwill bij eerste consolidatie**", "**1,6**"]

  - id: afschrijving-bgaap
    titel: "Afschrijving onder B-GAAP"
    niveau: 2
    beats:
      - "Hoofdregel (KB-WVV art. 3:131 § 1): lineair afschrijven over vermoedelijke gebruiksduur volgens een passend afschrijvingsplan"
      - "Belangrijk: > 5 jaar moet gemotiveerd worden in de toelichting"
      - "Als gebruiksduur niet betrouwbaar te ramen: max 10 jaar (CBN-advies 2016/7, verwijst naar oude art. 61 KB W.Venn., principe behouden in KB-WVV)"
      - "Toon Aurelia's afschrijvings-schema: 1,6 mln over 10 jaar = 0,16 mln per jaar"
      - "Boeking: D Afschrijving op consolidatieverschil / C Cumulatieve afschrijvingen"
    visualisaties:
      - type: tabel-inline
        kolommen: ["Boekjaar", "Goodwill begin", "Afschrijving", "Goodwill einde"]
        rijen:
          - ["2026 (jaar 1)", "1,60", "(0,16)", "1,44"]
          - ["2027 (jaar 2)", "1,44", "(0,16)", "1,28"]
          - ["...", "...", "...", "..."]
          - ["2035 (jaar 10)", "0,16", "(0,16)", "0,00"]

  - id: impairment-bgaap
    titel: "Impairment onder B-GAAP — niet-recurrente afschrijving"
    niveau: 2
    beats:
      - "Naast de lineaire afschrijving: bij ongunstige economische ontwikkelingen moet een aanvullende of niet-recurrente afschrijving (KB-WVV art. 3:131 § 1)"
      - "Trigger: wanneer het 'niet langer economisch verantwoord' is om goodwill aan de huidige waarde te handhaven"
      - "Voorbeeld-scenario: Aurelia stelt vast dat Bellator's belangrijkste klant wegviel in 2028 → niet-recurrente afschrijving van 0,5 mln"
      - "Boeking: geboekt in afzonderlijke post bedrijfskosten of financiële kosten"
      - "Belangrijke nuance: impairment is GEEN herwaarderingsstap, terugneming is onder B-GAAP zelden mogelijk"

  - id: ifrs-impairment-only
    titel: "IFRS — geen afschrijving, alleen impairment"
    niveau: 2
    beats:
      - "IFRS 3 + IAS 36: goodwill wordt NIET afgeschreven"
      - "In plaats daarvan: jaarlijkse impairment-test verplicht per cash-generating unit (CGU)"
      - "Toets: recoverable amount = max(reële waarde - kosten verkoop, gebruikswaarde via DCF)"
      - "Als CGU-boekwaarde > recoverable amount → impairment-verlies in resultatenrekening"
      - "Terugneming van goodwill-impairment: VERBODEN onder IFRS (anders dan voor andere activa)"
      - "Praktisch: IFRS-impairment leidt vaak tot grote eenmalige verliezen (bv. ArcelorMittal 2019)"

  - id: badwill
    titel: "Badwill — het negatieve consolidatieverschil"
    niveau: 2
    beats:
      - "Definitie: omgekeerde situatie — aanschafprijs < aandeel in reële NEV"
      - "Waarom zou dat gebeuren? Distress-overname, niet-erkende verplichtingen, urgent need to exit door verkoper"
      - "Behandeling B-GAAP (KB-WVV art. 3:131 § 2): badwill geboekt onder passiva-rubriek; in resultaat via 'opbrengsten' wanneer een ongunstige ontwikkeling die de basis vormde, zich realiseert"
      - "Behandeling IFRS (IFRS 3 § 34-36): 'bargain purchase' — direct in resultatenrekening na revalidatie van fair value-meting"
      - "Examenrelevantie: vaste val — studenten verwarren badwill met 'gewone' opbrengst"

  - id: presentatie-in-jaarrekening
    titel: "Waar staat goodwill in de geconsolideerde balans?"
    niveau: 2
    beats:
      - "Onder de immateriële vaste activa (rubriek II) — apart vermeld als 'Consolidatieverschillen'"
      - "Toelichting moet: bedrag van het verschil + gehanteerde afschrijvingstermijn + motivering indien > 5 jaar"
      - "Onder IFRS apart als 'Goodwill' onder non-current assets, met disclosure over CGUs en impairment-tests"


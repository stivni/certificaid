verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: wat-is-belgisch-boekhoudrecht
      hint: "Eerder leerstuk — het bronnen-veld waaruit alle regels hierboven afkomstig zijn."
    - slug: vennootschap-grootte-en-schema-keuze
      hint: "Volgend leerstuk — wat verandert er als jouw boekhoudpijler in een groot-regime kantelt (jaarverslag, commissaris, volledig schema)."
    - slug: jaarrekening-publiceren-en-sancties
      hint: "Hoe de beginselen-werking doorwerkt in de toelichting + sancties bij niet-naleving van de bewaarplicht of foutieve neerlegging."
    - slug: individuele-jaarrekening-opmaken
      hint: "Cross-PO — de TECHNIEK van eindejaarsverrichtingen + resultaatbestemming (afschrijvingen, voorzieningen, overlopende rekeningen). PO 1.4 leerstuk."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — boekhoudplicht-beslisboom + drie regimes vereenvoudigd/dubbel/groot + 8 beginselen + bewaartermijn-tabel."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Boekhoudplichtige onderneming — definitie"
    ref: "WER art. III.82 + art. I.1"
    noot: "Sinds Wet 15-04-2018 (in werking 1-11-2018): vrije beroepen vallen er ook onder. Uitzonderingen: bestuurders-natuurlijke-personen voor mandaat, zuivere land- en tuinbouw, politieke partijen, sport-/hobby-inkomsten zonder beroepskarakter."
  - onderwerp: "Inhoud boekhouding — wat moet erin?"
    ref: "WER art. III.83"
    noot: "Alle verrichtingen, bezittingen, rechten van welke aard ook, vorderingen, schulden en verplichtingen. Voor natuurlijke persoon: enkel beroeps-deel; private vermogen apart."
  - onderwerp: "Dubbele boekhouding — hoofdregel"
    ref: "WER art. III.84"
    noot: "Stelsel van boeken en rekeningen + gebruikelijke regels dubbel boekhouden. Verrichtingen zonder uitstel, getrouw, volledig en naar tijdsorde ingeschreven."
  - onderwerp: "Vereenvoudigde boekhouding — uitzondering"
    ref: "WER art. III.85 §1 — drempel via KB 21-10-2018"
    noot: "Drempel art. 1 KB 21-10-2018: 500.000 EUR omzet excl. btw (verhoogd tot 620.000 EUR voor bepaalde brandstofverkoop). Toepasbaar op natuurlijke persoon, maatschap, VOF, CommV onder de drempel. Vereenvoudigd vzw: aparte cascade — zie [[vennootschap-grootte-en-schema-keuze]]."
  - onderwerp: "Vereiste dagboeken bij vereenvoudigd"
    ref: "WER art. III.85 §1 lid 1"
    noot: "Drie dagboeken: financieel + inkoop + verkoop. Plus inventarisboek (art. III.89). Geen MAR, geen grootboek."
  - onderwerp: "Centralisatieboek — minstens maandelijks"
    ref: "Art. 4 §1 KB 21-10-2018"
    noot: "Hulpdagboeken worden minstens maandelijks gecentraliseerd in het algemeen dagboek + grootboek. Examen-vraag 2003-bibf."
  - onderwerp: "Tijdsorde + onveranderlijkheid"
    ref: "WER art. III.86 + art. III.88"
    noot: "Boeken naar tijdsorde, zonder wit vak of weglating. Correctie zichtbaar (oorspronkelijke tekst leesbaar). Onveranderlijkheid garandeert bewijs-waarde."
  - onderwerp: "Jaarlijkse inventaris"
    ref: "WER art. III.89"
    noot: "Eens per jaar inventaris van bezittingen + vorderingen + schulden — basis voor de jaarrekening (dubbel) of de vermogensstaat (vereenvoudigd)."
  - onderwerp: "Bewaarplicht boeken + bewijsstukken — 7 jaar"
    ref: "WER art. III.88 + art. 8 KB 21-10-2018"
    noot: "7 jaar vanaf 1 januari van het jaar VOLGEND op de afsluiting. Originelen voor dagboeken + centralisatieboek + inventarisboek. Voor andere boeken: origineel of afschrift toegelaten."
  - onderwerp: "Bijzondere BTW-bewaartermijn"
    ref: "Art. 60 §1 WBTW (algemeen 10 jaar) + art. 48 §2 WBTW (15 jaar herziening onroerend)"
    noot: "BTW-stukken kunnen langer moeten bewaard worden dan boekhoudkundig — toegelaten regel: langste termijn aanhouden."
  - onderwerp: "Trouw beeld + getrouwheids-vereiste"
    ref: "WVV art. 3:1 + KB-WVV art. 3:6 §1"
    noot: "Getrouw beeld als meta-norm. Override van strikte regel mogelijk, MET motivering in toelichting."
  - onderwerp: "Acht boekhoudbeginselen"
    ref: "KB-WVV art. 3:6 — 3:32 (waardering) + KB-WVV art. 3:23 (voorzieningen — voorzichtigheid)"
    noot: "Trouw beeld · voorzichtigheid · continuïteit · bestendigheid · matching · realisatie · materialiteit · niet-compensatie."
  - onderwerp: "Schatting-wijziging vs waarderingsregel-wijziging"
    ref: "CBN-advies 2019/04 + KB-WVV art. 3:6"
    noot: "Schatting-wijziging = prospectief; waarderingsregel-wijziging = retroactief (zeldzaam). Onderscheid is examen-favoriet (vraag 2013-2)."
  - onderwerp: "Correctie van fout in neergelegde jaarrekening"
    ref: "WVV art. 3:19"
    noot: "Materiële fouten + dwaling in rechte of feite. Correctie ter goedkeuring AV (behalve loutere materiële fouten van bestuursorgaan)."


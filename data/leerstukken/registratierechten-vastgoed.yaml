# Afsluiting
# ---------------------------------------------------------------------------

verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: registratieformaliteit-en-procedure
      hint: "De proces-as: welke akten moet je registreren, binnen welke termijn, met welke sancties — en de command/sterkmaking-techniek."
    - slug: erfbelasting-en-aangifte-nalatenschap
      hint: "Van leven naar overlijden — devolutie, nalatenschap-grondslag, aangifte van nalatenschap, tarieven + fictiebepalingen."
    - slug: successieplanning-en-gunstregime
      hint: "Schenking als planning-instrument + gunstregime familiale onderneming — keuze schenken nu vs erven later."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — vergelijkingstabel drie gewesten + abattement-voorwaarden + grondslag-regels."

doorklik_concepten:
  intro: "Voor wie definitorisch detail wil opzoeken:"
  groepen:
    - concepten: [verkooprecht, verdeelrecht, hypotheekrecht]
    - concepten: [schenkbelasting, registratie-en-successierechten]

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Verkooprecht — algemeen tarief"
    ref: "W.Reg. art. 44 (Brussel/Wallonië 12,50 %) · VCF art. 2.9.4.1.1 (Vlaanderen 12 %)"
    noot: "Ten laste van de koper (art. 35 W.Reg. / art. 2.9.1.0.1 VCF)."
  - onderwerp: "Verlaagd tarief enige eigen woning (Vlaanderen)"
    ref: "VCF art. 2.9.4.2.11 (2 % sinds 2022; 1 % bij ingrijpende energetische renovatie of monument)"
    noot: "Cumulatieve voorwaarden: enige + eigen + hoofdverblijf binnen 3 jaar + behouden ≥ 5 jaar."
  - onderwerp: "Abattement eigen woning (Brussel)"
    ref: "W.Reg. art. 46bis (Brusselse versie — vermindering grondslag €200.000)"
    noot: "Voorwaarden: natuurlijke persoon, geheelheid in volle eigendom, hoofdverblijf binnen 2 jaar, behouden ≥ 5 jaar."
  - onderwerp: "Grondslag verkooprecht — algemene regel"
    ref: "W.Reg. art. 45-46 / VCF art. 2.9.3.0.1"
    noot: "Bedongen prijs en lasten, met als minimum de verkoopwaarde van het overgedragen goed."
  - onderwerp: "Minimum-grondslag blote eigendom met voorbehoud vruchtgebruik door vervreemder"
    ref: "W.Reg. art. 48 / VCF art. 2.9.3.0.6"
    noot: "Grondslag = verkoopwaarde **volle eigendom**, geen aftrek voor het voorbehouden vruchtgebruik."
  - onderwerp: "Grondslag blote eigendom met vruchtgebruik door derde gevestigd"
    ref: "W.Reg. art. 49 (forfait vruchtgebruik volgens art. 47)"
    noot: "Wél aftrek volgens forfait — verschil met art. 48 is wezenlijk."
  - onderwerp: "Verdeelrecht — tarief + grondslag"
    ref: "W.Reg. art. 109 (Brussel/Wallonië 1 %) · VCF art. 2.10.1.0.1 (belastbaar feit) + art. 2.10.4.0.1 (Vlaanderen 2,5 % tarief; 1 % bij verdeling tussen ex-echtgenoten/ex-wett. samenwoners)"
    noot: "Grondslag = volledige verkoopwaarde van het onverdeelde goed (massa), niet alleen het overgedragen aandeel."
  - onderwerp: "Hypotheekrecht"
    ref: "W.Reg. art. 87 e.v. / VCF art. 2.11.4.0.1"
    noot: "1 % op het hypothecair ingeschreven bedrag, alle drie gewesten."
  - onderwerp: "Schenkbelasting onroerend goed — progressieve tarieven"
    ref: "VCF art. 2.8.4.1.1 (Vlaanderen — schalen rechte lijn 3-9-18-27 % en andere 10-20-30-40 %) · W.Reg. art. 131 (Brussel + Wallonië, eigen schalen)"
    noot: "Voor het gunstregime familiale onderneming (0 % schenking aandelen Vlaanderen): zie [[successieplanning-en-gunstregime]]."
  - onderwerp: "Antimisbruik fiscaal"
    ref: "VCF art. 3.17.0.0.2 / W.Reg. art. 18 § 2"
    noot: "Fiscus kan herkwalificeren bij ontbreken niet-fiscale motieven — relevant bij blote-eigendom-vennootschap-splitsing."


wettelijk_fundament:
  - onderwerp: "WVV-alarmbel kapitaalhoudende vennootschappen (NV, Comm.VA, SE)"
    ref: "WVV art. 7:228"
    noot: "Trigger: nettoactief < helft (of vierde) kapitaal door geleden verlies; AV binnen 2 maanden samenroepen + bijzonder bestuursverslag"
  - onderwerp: "WVV-alarmbel kapitaalloze vennootschappen (BV, CV)"
    ref: "WVV art. 5:153"
    noot: "Twee tests: solvabiliteit (nettoactief negatief dreigt/is) + liquiditeit (schulden komende 12 maanden niet kunnen betalen); CBN-advies 2021/14 voor jaarrekeningrechtelijke invulling"
  - onderwerp: "Going-concern-evaluatie commissaris"
    ref: "ISA 570 (herzien) — Going Concern"
    noot: "Diep behandeld in [[leerpaden/1-6|PO 1.6]] — commissaris signaleert material uncertainty going concern"
  - onderwerp: "Voorstellen formuleren — programma-doelstelling 1.3.1.2"
    ref: "ITAA-examenprogramma PO 1.3 doelstelling 2"
    noot: "Integratie-niveau: niet alleen analyseren maar adviseren"
  - onderwerp: "Kamers voor ondernemingen in moeilijkheden (KOM)"
    ref: "WER Boek XX"
    noot: "Detectie-signalen + vrijwillig gesprek — behandeld in [[leerpaden/1-9|PO 1.9]]"
  - onderwerp: "Altman Z-score (private firm)"
    ref: "Doctrine financiële analyse (Altman 1968 + herzieningen)"
    noot: "Geen wettelijke status; klinisch screening-instrument"

footer: "Leerstuk PO 1.3 — synthese + integratie-niveau. Status: voorgesteld. Volgende stap voor de student: oefening Tessera BV + samenvatting voor herhaling."

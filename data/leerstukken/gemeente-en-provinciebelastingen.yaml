  - onderwerp: "Grondwettelijk Hof + Raad van State — wettigheidstoets gemeentelijke belastingreglementen"
    inhoud: "Zowel het Grondwettelijk Hof als de Raad van State hebben in vaste rechtspraak het toetsings­kader voor gemeentelijke + provinciale belastingreglementen verfijnd. Sleutel-arresten betreffen typisch (a) discriminatie­vragen (bv. onderscheid hoofdverblijf/tweede verblijf — aanvaard wegens objectieve verschillen) en (b) proportionaliteit-vragen (tarief moet redelijk verband houden met het doel of de dienst). Specifieke arrest-referenties worden in de samenvatting + voorbeeldexamenvragen-laag van PO 2.7 verder aangevuld."

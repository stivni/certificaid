# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Lokale fiscale autonomie — bevoegdheid + heffingsorgaan"
    ref: "Grondwet art. 41 + art. 162 + art. 170 §3-§4"
  - onderwerp: "Gelijkheids­beginsel inzake belastingen"
    ref: "Grondwet art. 10-11 + art. 172"
  - onderwerp: "Aanvullende gemeentebelasting op de PB"
    ref: "WIB92 art. 465 t.e.m. 470/2"
    noot: "Gemeente bepaalt tarief jaarlijks; grondslag = Staats-PB op gezamenlijk belaste inkomsten vóór verrekening voorheffingen (art. 466). Inning + doorstorting FOD Financiën."
  - onderwerp: "Verbod opcentiemen op directe federale belastingen"
    ref: "WIB92 art. 464"
    noot: "Geen opcentiemen op PB, VenB, RPB, BNI; geen belasting op vee."
  - onderwerp: "Toelating opcentiemen op OV"
    ref: "WIB92 art. 464/1 + VCF art. 2.1.4.0.2"
  - onderwerp: "Toelating opcentiemen op leegstandsheffing bedrijfsruimten"
    ref: "VCF art. 2.6.4.0.2"
  - onderwerp: "Verbod opcentiemen op BIV"
    ref: "VCF art. 2.3.4.2.2 (verwijzing naar art. 107 WIGB)"
  - onderwerp: "Lokaal belastingreglement — kaderwet"
    ref: "Wet 24 december 1996 betreffende de vestiging en de invordering van de provincie- en gemeentebelastingen + Decreet Lokaal Bestuur (Vl) + Wallonië/Brussel-equivalenten"
    noot: "⚠️ te verifiëren via primaire bron — Wet 24.12.1996 niet rechtstreeks aangetroffen in RAG-corpus; vermeld via concept-record lokale-belasting-reglement. Bezwaartermijn 3 maanden bij College B&S vanaf 3de werkdag na verzending aanslagbiljet."
  - onderwerp: "Vernietiging reglement"
    ref: "Gecoördineerde wetten Raad van State — vernietigingsberoep binnen 60 dagen na bekendmaking"
  - onderwerp: "Toezicht op gemeentelijke fiscaliteit"

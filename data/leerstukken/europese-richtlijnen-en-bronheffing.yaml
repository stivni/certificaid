wettelijk_fundament:
  - onderwerp: "Moeder-dochterrichtlijn — drempel + vrijstelling"
    ref: "Richtlijn 2011/96/EU art. 3 lid 1 a) i) (drempel 10%) + art. 5 (vrijstelling bronheffing)"
  - onderwerp: "Moeder-dochterrichtlijn — anti-misbruik"
    ref: "Richtlijn 2011/96/EU art. 1 §2-3 (ingevoegd 2015) — GAAR-clausule"
  - onderwerp: "Interest-royaltyrichtlijn — drempel verbonden onderneming"
    ref: "Richtlijn 2003/49/EG art. 3 b) — ≥ 25% deelneming"
  - onderwerp: "Fusierichtlijn — toepassingsgebied"
    ref: "Richtlijn 2009/133/EG art. 3 (drie cumulatieve voorwaarden) + bijlage I deel A + deel B"
  - onderwerp: "ATAD — exit tax"
    ref: "Richtlijn 2016/1164 art. 5 (omgezet in BE art. 210 §1, 4° + art. 211 WIB92)"
  - onderwerp: "Belgische DBI-aftrek"
    ref: "WIB92 art. 202-205quater (deelnemingsvrijstelling)"
  - onderwerp: "Belgische FBB"
    ref: "WIB92 art. 285-289 (forfaitair gedeelte buitenlandse belasting)"
  - onderwerp: "Belgische fusieneutraliteit"
    ref: "WIB92 art. 211 (fusie) + art. 213 (splitsing) + art. 230bis (grensoverschrijdende mobiliteit)"
  - onderwerp: "Belgische exit-heffing"
    ref: "WIB92 art. 210 §1, 4° (zetelverplaatsing) + art. 412bis (gespreide betaling)"


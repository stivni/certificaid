rechtspraak:
  - onderwerp: "National Grid Indus — exit tax binnen EU"
    inhoud: "HJEU 29 november 2011, C-371/10: lidstaat mag exit-heffing claimen op latente meerwaarden bij zetelverplaatsing binnen EU, maar moet GELIJKMATIGE BETALING in tijd toestaan (geen onmiddellijke heffing). Basis voor ATAD art. 5 + Belgische gespreide betaling 5 jaar."
  - onderwerp: "Cadbury Schweppes — substance-test op buitenlandse vennootschap"
    inhoud: "HJEU 12 september 2006, C-196/04: lidstaat mag fiscale faciliteit weigeren aan buitenlandse vennootschap die 'zuiver kunstmatige constructie' is (zonder economische substantie). Basis voor PPT in MLI + GAAR in MDR-amendering 2015 + ATAD GAAR."
    confidence: "verifieerd in jurisprudentie-context"


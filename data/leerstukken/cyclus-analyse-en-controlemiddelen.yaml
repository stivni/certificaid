wettelijk_fundament:
  - onderwerp: "Cyclus-aanpak — algemeen kader interne beheersing"
    ref: "ISA 315 (herzien-2019), Bijlage 3"
    noot: "Cyclus-aanpak is standaard methodologie binnen ISA 315; auditor identificeert per cyclus de relevante beweringen (assertions) en bijhorende controles."
  - onderwerp: "IT-controles — ITGC + application controls"
    ref: "ISA 315 (herzien-2019), par. A172"
    noot: "Vier hoofd-categorieën ITGC: toegangsbeheer · change management · IT operations · backup en recovery."
  - onderwerp: "Voorraad — fysieke opname bijwonen"
    ref: "ISA 501 §4"
    noot: "Bij materiële voorraad MOET de auditor de fysieke voorraadopname bijwonen (tenzij praktisch onuitvoerbaar) — instructies evalueren, uitvoering waarnemen, voorraad inspecteren, tellingen ter toetsing uitvoeren."
  - onderwerp: "Controletechnieken — algemeen"
    ref: "ISA 500 §A14-A25"
    noot: "Zeven generieke controletechnieken — inspectie · waarneming · externe bevestiging · herberekening · herrekening · navraag · cijferanalyse."
  - onderwerp: "Test-of-controls — responses to assessed risks"
    ref: "ISA 330 — Inspelen door de auditor op ingeschatte risico's"
    noot: "Wanneer de auditor wil steunen op IC moet hij test of controls uitvoeren over de relevante periode."
  - onderwerp: "Cut-off + overeenstemmingsbeginsel"
    ref: "⚠️ context — KB 29 april 2019 op de jaarrekening + WER Boek III art. III.89"
    noot: "Boekhoudkundige basis voor cut-off-controle en aansluiting boekhouding met inventaris; geverifieerd via examen-vragen modelantwoord (2014-1)."
  - onderwerp: "Ontwerp interne controle — 8-stappen-flow"
    ref: "COSO 2013 — internationale doctrine (geen wettekst)"
    noot: "Methodologische uitwerking van de 5 COSO-componenten; ondersteund door ISA 315-eisen op design effectiveness."


# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Inbreng in natura BV"
    ref: "WVV art. 5:7"
    noot: "Commissaris of bedrijfsrevisor exclusief — verslag over waardering + tegenprestatie + redelijkheid. Gecertificeerd accountant uitgesloten."
  - onderwerp: "Inbreng in natura NV"
    ref: "WVV art. 7:7"
    noot: "Analoog aan BV; met fractiewaarde-toetsing."
  - onderwerp: "Kapitaalverhoging in natura BV/NV"
    ref: "WVV art. 5:133 BV / 7:183 NV (verwijzend naar 7:7)"
    noot: "Verwijzen naar inbreng-natura-mechaniek."
  - onderwerp: "Quasi-inbreng (NV alleen)"
    ref: "WVV art. 7:8 + 7:10"
    noot: "Commissaris of bedrijfsrevisor; gecertificeerd accountant uitgesloten. Drempel ≥ 10% geplaatst kapitaal, binnen 2 jaar na oprichting, insider-verkrijging."
  - onderwerp: "Beperking voorkeurrecht NV"
    ref: "WVV art. 7:191"
    noot: "Commissaris of bedrijfsrevisor — verslag over uitgifteprijs + motivering beperking."
  - onderwerp: "Interim-dividend NV"
    ref: "WVV art. 7:199"
    noot: "Statutaire machtiging + winst lopend boekjaar + dubbele test + tussentijdse staat. Commissaris of (in afwezigheid) bedrijfsrevisor."
  - onderwerp: "Inkoop eigen aandelen BV/NV"
    ref: "WVV art. 5:147 BV / 7:215 NV"
    noot: "AV-besluit + dubbele test (geen specifiek extern verslag in afwezigheid commissaris)."
  - onderwerp: "Omzetting van rechtsvorm — binnenlands (Boek 14)"
    ref: "WVV art. 14:3 (staat max 3 mnd) + 14:4 (verslag commissaris/bedrijfsrevisor/gecertificeerd accountant) + 14:5 (bestuursverslag) + 14:8 (AV 3/4 meerderheid)"
    noot: "Vermeldt enige overwaardering nettoactief."
  - onderwerp: "Omzetting van rechtsvorm — grensoverschrijdend"
    ref: "WVV art. 14:20-14:25"
    noot: "Staat max 4 maanden; gelijkaardige verslag-vereiste; 3/4-meerderheid."
  - onderwerp: "Fusie — fusievoorstel + verslag ruilverhouding"
    ref: "WVV art. 12:25 (fusievoorstel) + 12:26 (verslag bij fusie door overneming) + 12:39 (verslag bij fusie door oprichting)"
    noot: "Commissaris, bedrijfsrevisor of gecertificeerd accountant — sinds Wet 25-05-2023. Methoden + redelijkheid + relatief belang."
  - onderwerp: "Splitsing — verslag ruilverhouding"
    ref: "WVV art. 12:78"
    noot: "Analoog aan fusie — commissaris/bedrijfsrevisor/gecertificeerd accountant."
  - onderwerp: "Inbreng bedrijfstak of algemeenheid"
    ref: "WVV art. 12:92 e.v."
    noot: "Verslag-mechaniek analoog aan inbreng-in-natura (commissaris of bedrijfsrevisor)."
  - onderwerp: "Ontbindings-AV — staat A&P + verslag"
    ref: "WVV art. 2:67"
    noot: "Commissaris, externe accountant of bedrijfsrevisor mogen — staat max 3 mnd."
  - onderwerp: "Ontbinding-en-vereffening in één akte"
    ref: "WVV art. 2:91"
    noot: "Accountant of revisor bevestigt staat A&P (art. 2:67) + alle schulden voldaan/geconsigneerd."
  - onderwerp: "Vereffenaarsmandaat"
    ref: "WVV art. 2:79 e.v. (aansprakelijkheid art. 2:80)"
    noot: "Opdracht-mandaat. Accountant kan vereffenaar zijn."
  - onderwerp: "Herstructureringsdeskundige GR"
    ref: "WER art. XX.49/2 (openbare procedure) + XX.83/22 e.v. (besloten variant)"
    noot: "Rechterlijke aanstelling tijdens GR."
  - onderwerp: "Gerechtsdeskundige"
    ref: "Ger.W. art. 962 e.v."
    noot: "Aanstelling door rechter bij geschillen — boekhoudkundige expertise."
  - onderwerp: "Cross-PO doorklik — opdrachtbrief + onafhankelijkheid + kwaliteitsmanagement"
    ref: "PO 4.0 deontologie (zie [[opdrachtaanvaarding-en-opdrachtbrief]] en [[kwaliteitsmanagement-opdracht]])"
    noot: "Algemene deontologie-spelregels (ITAA-norm + ISQM 1). Niet uitgewerkt in PO 3.0 — cross-PO doorklik."
  - onderwerp: "Cross-PO doorklik — ISAE-attestopdrachten aan derden"
    ref: "ISAE 3000 / 3402 (cross-PO 4.0)"
    noot: "Attest aan derden in M&A-context — bv. werkkapitaalverklaring, normalised EBITDA-rapport."

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Beroepsaansprakelijkheid accountant bij inadequaat verslag"
    inhoud: "Lagere rechtspraak: een accountant die een verslag uitbrengt over inbreng in natura zonder voldoende eigen verificatie van de waardering (louter overname van oprichters-waardering) is aansprakelijk tegenover derden die later schade lijden. ITAA-norm + art. 1382 BW. Vandaar belang van DOSSIER-discipline."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."
  - onderwerp: "Methode-toets bij ruilverhouding fusie/splitsing"
    inhoud: "Cassatie heeft bevestigd dat de revisor in een fusie-verslag GEEN absolute waarde-uitspraak hoeft te doen, maar wel de gebruikte methoden + hun relatieve belang moet motiveren. Een verslag dat slechts één methode hanteert zonder rationale = vatbaar voor nietigheid van de fusie-besluit op vordering van een aandeelhouder."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."

footer: "Leerstuk PO 3.0. Status: voorgesteld — POC volgens ADR-037. Synthese-leerstuk — integreert L1-L5."

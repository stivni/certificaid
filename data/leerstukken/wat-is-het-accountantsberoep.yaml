# Afsluiting
# ---------------------------------------------------------------------------

verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: deontologische-beginselen-en-onafhankelijkheid
      hint: "De vijf beginselen die op elke opdracht rusten — integriteit, objectiviteit, vakbekwaamheid, vertrouwelijkheid, professioneel gedrag — plus onafhankelijkheid als strengere standaard voor assurance-opdrachten. Met threats-and-safeguards-cyclus."
    - slug: opdrachtaanvaarding-en-clientenrelatie
      hint: "Hoe een nieuwe cliënt opnemen — intake + opdrachtbrief + kantoorvoering + beëindiging incl. confraterne overdracht."
    - slug: kwaliteitstoezicht-en-tucht
      hint: "Welke mechanismen dwingen naleving af — kwaliteitsmanagement op kantoor + ITAA-kwaliteitstoetsing + tuchtprocedure + permanente vorming."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — beroepsstructuur + organen-tabel + normbronnen-hiërarchie op één pagina."

doorklik_concepten:
  intro: "Voor wie definitorisch detail wil opzoeken:"
  groepen:
    - concepten: [gecertificeerd-accountant, itaa-beroepsorganisatie]
    - concepten: [normbronnen, opdracht-types]

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Beroepsstatuut + titel + toelatingsvoorwaarden"
    ref: "Wet 17 maart 2019 (ITAA-wet) art. 3 + 10 + 13 + 16"
    noot: "art. 3 = beroepsactiviteiten; art. 10 = toelatingsvoorwaarden; art. 13 = stage; art. 16 = stagiair-grenzen."
  - onderwerp: "Monopolieopdrachten — voorbehouden activiteiten"
    ref: "Wet 17 maart 2019 art. 3, 6° tot 8°"
    noot: "Expertise + attesterende opdrachten + andere wettelijk voorbehouden. Discipline-regels in KB plichtenleer art. 16-17 + 30."
  - onderwerp: "Onverenigbaarheden + objectieve uitvoering"
    ref: "Wet 17 maart 2019 art. 48"
    noot: "Algemene basis voor onverenigbaarheden-leer; uitgewerkt in [[deontologische-beginselen-en-onafhankelijkheid]]."
  - onderwerp: "ITAA als instituut + organen + register"
    ref: "Wet 17 maart 2019 art. 29 + 32 + 65 + 69 + 70"
    noot: "Openbaar register + algemene vergadering + Raad + uitvoerend comité."
  - onderwerp: "Cumul-verbod ITAA ↔ IBR"
    ref: "Wet 17 maart 2019 art. 10 §5"
    noot: "Bedrijfsrevisor mag niet om hoedanigheid gecertificeerd belastingadviseur verzoeken."
  - onderwerp: "Deontologische code als KB"
    ref: "KB 9 december 2019 (deontologische code ITAA)"
    noot: "Gebaseerd op art. 49 Wet-ITAA. Uitgewerkt in [[deontologische-beginselen-en-onafhankelijkheid]]."
  - onderwerp: "Plichtenleer — oudere KB nog deels in voege"
    ref: "KB 1 maart 1998 — Reglement van plichtenleer art. 16 + 17 + 30"
    noot: "Niet vervangen; art. 16 = verbod handtekening-delegatie; art. 30 = ronselverbod."
  - onderwerp: "Publiek toezicht — Hoge Raad voor de Economische Beroepen"
    ref: "Wet 17 maart 2019 art. 80"
    noot: "Adviezen op nieuwe ITAA-normen; geen advies binnen 3 maanden = geacht gunstig."
  - onderwerp: "IFRS rechtstreekse bindendheid voor beursgenoteerde EU-groepen"
    ref: "Verordening (EG) 1606/2002 art. 2"
    noot: "Uitzondering op de regel dat internationale standaarden alleen via verwijzing bindend zijn."

footer: "Leerstuk PO 4.0. Status: voorgesteld — POC volgens ADR-037."

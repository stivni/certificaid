wettelijk_fundament:
  - onderwerp: "Functiescheiding als preventieve beheersingsmaatregel"
    ref: "ISA 315 (herzien-2019), Bijlage 3 §20-22"
    noot: "Functiescheiding is bedoeld om beperkingen aan te brengen in de mogelijkheden om fouten te maken EN te verhullen of fraude te plegen EN te verhullen."
  - onderwerp: "KMO-compensatie via direct toezicht zaakvoerder"
    ref: "ISA 315 (herzien-2019), §A157"
    noot: "Bij minder complexe entiteiten met beperkte staf kan de eigenaar-bestuurder via directe betrokkenheid effectief toezicht uitoefenen ter compensatie."
  - onderwerp: "ITAA-norm voor KMO-context"
    ref: "ITAA-norm KMO-controlenorm — §97-98 toetsingen + Bijlage 1 (Definities)"
    noot: "Werkt ISA 315-principes operationeel uit voor KMO-controleopdrachten; vereist evaluatie functiescheiding en compenserende controles."
  - onderwerp: "5 controletechnische functies (BURCB) + 4-categorieën-typologie"
    ref: "Starreveld-traditie + COSO 2013 — internationale doctrine (geen wettekst)"
    noot: "Klassieke audit-doctrine; impliciet in ISA 315 §26 (interne beheersingsactiviteiten). 4-categorieën-typologie (Aut · Bew · Reg · Contr) is COSO/IIA-uitwerking."


# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Ultra vires en derden te goeder trouw"
    inhoud: "Vaste rechtspraak: een bestuurder die buiten het maatschappelijk doel handelt, bindt de vennootschap tegenover een derde die te goeder trouw kon menen dat de handeling binnen het doel viel (objectieve doel-toets). Beschermt rechtsverkeer."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."
  - onderwerp: "Schending belangenconflict-protocol als nietigheidsgrond"
    inhoud: "Cassatie heeft bevestigd dat schending van de mededelings- en onthoudingsplicht een belanghebbende toelaat nietigheid van het bestuursbesluit te vorderen, zelfs indien de beslissing op zichzelf niet onredelijk is."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd; specifieke arrest-nummers open."


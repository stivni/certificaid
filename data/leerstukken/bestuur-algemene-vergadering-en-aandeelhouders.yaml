# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Bestuursorgaan en vertegenwoordiging — BV"
    ref: "WVV art. 5:52-5:53"
    noot: "Interne bevoegdheid (ultra vires) + externe vertegenwoordigingsmacht (vennootschap gebonden ook buiten voorwerp, behoudens kwade trouw derde)."
  - onderwerp: "Bestuursvormen NV — enige bestuurder, RvB, duaal"
    ref: "WVV art. 7:73 e.v. (RvB) + 7:85 e.v. (enige bestuurder) + 7:104 e.v. (duaal)"
    noot: "Drie modellen. Collegiale RvB minstens 3 leden, of 2 indien <3 aandeelhouders."
  - onderwerp: "Belangenconflict BV"
    ref: "WVV art. 5:55-5:56"
    noot: "Mededelingsplicht + onthouding + notulen + jaarverslag. Bij enige of alle bestuurders geconflicteerd: voorleggen aan AV."
  - onderwerp: "Belangenconflict NV — enige bestuurder"
    ref: "WVV art. 7:90"
    noot: "Voorleggen aan AV of melden + uitvoeren onder eigen verantwoordelijkheid."
  - onderwerp: "Belangenconflict NV — RvB"
    ref: "WVV art. 7:84"
    noot: "Mededeling + onthouding van stemming; raad mag de beslissing niet delegeren."
  - onderwerp: "Onrechtmatig financieel voordeel"
    ref: "WVV art. 5:57 BV / 7:97 NV"
    noot: "Persoonlijke + hoofdelijke aansprakelijkheid bestuurder, ook bij protocol-naleving."
  - onderwerp: "AV — bijeenroeping BV"
    ref: "WVV art. 5:62"
    noot: "Door bestuur of op verzoek aandeelhouders ≥10%; oproepingsformaliteiten 15 dagen."
  - onderwerp: "AV — bijeenroeping NV"
    ref: "WVV art. 7:113 (+ 7:115 voor genoteerde NV — 30 dagen)"
    noot: "Analoog; ≥10% van het kapitaal."
  - onderwerp: "AV — versterkte meerderheden statutenwijziging"
    ref: "WVV art. 5:100 BV / 7:153 NV"
    noot: "3/4 meerderheid + 1/2 quorum; tweede AV geen quorum-vereiste."
  - onderwerp: "Individueel controlerecht aandeelhouders zonder commissaris"
    ref: "WVV art. 3:101 (algemeen) + boekspecifieke regelingen"
    noot: "Inzage in boeken, briefwisseling, notulen. Klassiek minderheidsrecht."
  - onderwerp: "Nietigheid besluiten organen"
    ref: "WVV art. 2:42-2:47"
    noot: "Strijdig met wet, statuten, bevoegdheidsgebrek, proceduregebrek. Vordering binnen 6 maanden."
  - onderwerp: "Kwijting bestuur"
    ref: "WVV art. 5:77 BV / 7:149 NV"
    noot: "Bindt enkel de AV; geen derden, geen verzwijgingen."
  - onderwerp: "Gerechtelijke uittreding/uitsluiting aandeelhouder"
    ref: "WVV art. 2:60 + 2:69"
    noot: "Klassieke remedie bij blokkering — duur en zwaar; SHA-exit-mechanisme is meestal eenvoudiger."


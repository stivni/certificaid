rechtspraak:
  - onderwerp: "Tie-breaker residentie + arrest 'middelpunt van levensbelangen'"
    inhoud: "Cassatie en feitenrechters toetsen het 'middelpunt van levensbelangen' aan een gemengde set criteria: gezin, eigendom, werkadres, sociaal netwerk. Geen één criterium absoluut; rechter weegt feiten. Klassieke arrest-referenties: nader te bevestigen via primaire bron — algemene leer wel bestendigd."
    confidence: "⚠️ te verifiëren"


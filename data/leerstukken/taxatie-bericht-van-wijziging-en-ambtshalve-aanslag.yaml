    ref: "WIB92 art. 445"
  - onderwerp: "Bijzondere aanslag geheime commissielonen (cross-PO)"
    ref: "WIB92 art. 219"
    noot: "100% (of 50% indien begunstigde identificeerbaar). Uitgewerkt in [[2.3]]."
  - onderwerp: "Motiveringsplicht bestuurshandelingen"
    ref: "Wet 29.7.1991"
    noot: "Ongemotiveerde of gebrekkig gemotiveerde BvW = nietig."


# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Bericht van wijziging"
    ref: "WIB92 art. 346"
    noot: "1 maand antwoordtermijn vanaf 3e werkdag na verzending; verlengbaar op gemotiveerd verzoek."
  - onderwerp: "Ambtshalve aanslag"
    ref: "WIB92 art. 351"
    noot: "Bij geen aangifte, geen of laat antwoord op vraag om inlichtingen of BvW, of verhindering onderzoek."
  - onderwerp: "Omkering bewijslast bij ambtshalve aanslag"
    ref: "WIB92 art. 352"
    noot: "In bezwaar moet belastingplichtige bewijzen dat aanslag onjuist is."
  - onderwerp: "Vestiging van de aanslag — kohier"
    ref: "WIB92 art. 297-298 + 359"
  - onderwerp: "BvW-verlenging 6 maanden bij nakende verjaring"
    ref: "WIB92 art. 354 §1 lid 4 in fine"
    noot: "BvW verzonden in laatste 6 mnd van aanslagtermijn verlengt termijn automatisch met 6 mnd vanaf antwoord cliënt of vervaldag."
  - onderwerp: "Belastingverhoging"

# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Opmaak jaarrekening — verplichting + AV-goedkeuring binnen 6 mnd"
    ref: "WVV art. 3:1"
    noot: "Het bestuursorgaan stelt jaarrekening op en legt ze ter goedkeuring voor aan de AV binnen 6 maanden na afsluitdatum."
  - onderwerp: "Inhoud jaarrekening — balans + resultatenrekening + toelichting"
    ref: "KB-WVV art. 3:1 + bijlage 3 (volledig) + bijlage 4 (verkort + micro)"
    noot: "Drie onverbreekbare delen. Voor vereniging: bijlagen 6-7 KB-WVV."
  - onderwerp: "Toelichting — inhoud + waarderingsregels-samenvatting"
    ref: "KB-WVV art. 3:6 §1 (waarderingsregels + afwijking) + art. 3:61 (toelichting-inhoud)"
    noot: "Samenvatting waarderingsregels + bijzondere vermeldingen + verbintenissen buiten balans + niet-courante posten. Wijziging waarderingsregel of schatting motiveren (CBN-advies 2019/04 als interpretatie)."
  - onderwerp: "Jaarverslag — opmaken-plicht voor groot"
    ref: "WVV art. 3:5"
    noot: "Bestuursorgaan stelt verslag op waarin het rekenschap geeft van zijn beleid. Inhoud uitgewerkt in art. 3:6."
  - onderwerp: "Vrijstelling jaarverslag voor klein"
    ref: "WVV art. 3:4"
    noot: "Kleine vennootschap vrijgesteld van jaarverslag-opmaak."
  - onderwerp: "Inhoud jaarverslag"
    ref: "WVV art. 3:6"
    noot: "Getrouw overzicht ontwikkeling/resultaten/positie + risico's + niet-financiële prestatie-indicatoren waar relevant + bestuursverantwoording."
  - onderwerp: "Sociale balans — verkort vs volledig"
    ref: "KB-WVV art. 3:24"
    noot: "Verkort schema voor klein, volledig voor groot. Opleidingskost-bestanddelen: direct (verkort) of direct + indirect + reis/verblijf (volledig)."
  - onderwerp: "Bestuurdersvermelding — neer te leggen stuk"
    ref: "WVV art. 3:12 1°"
    noot: "Naam + voornamen + beroep + woonplaats van bestuurders + commissaris + (waar relevant) externe accountant of bedrijfsrevisor met lidmaatschapsnummer. NIET 'eerste blad jaarrekening' onder art. 3:5."
  - onderwerp: "Neerlegging bij NBB — termijn"
    ref: "WVV art. 3:10 lid 2"
    noot: "Binnen 30 dagen na AV-goedkeuring én ten laatste 7 maanden na afsluit. Twee deadlines parallel — de eerstvallende telt."
  - onderwerp: "Vermoeden schade derden bij niet-neerlegging"
    ref: "WVV art. 3:10 lid 3"
    noot: "Schade door derden geleden wordt geacht voort te vloeien uit het verzuim, BEHOUDENS TEGENBEWIJS. Bron is art. 3:10 zelf — niet art. 3:43 (een veelvoorkomende verkeerde verwijzing)."
  - onderwerp: "Acceptatie door NBB"
    ref: "WVV art. 3:14"
    noot: "Binnen 8 werkdagen na ontvangst — bij wezenlijke fouten correctie binnen 2 maanden door vennootschap."
  - onderwerp: "Welke stukken worden neergelegd"
    ref: "WVV art. 3:12 2°-10°"
    noot: "Bestemmingsoverzicht resultaat (indien niet uit jaarrekening blijkt) + jaarverslag (groot) + commissaris-verklaring + sociale balans + andere wettelijk voorgeschreven stukken."
  - onderwerp: "Tariefbijdrage bij laattijdige neerlegging"
    ref: "Art. 3:13 KB-WVV + KB 27-09-2009"
    noot: "Vast bedrag — progressief verhoogd bij langere vertraging + bij grote vennootschap. Cijfers via Cijferzakboekje."
  - onderwerp: "Gerechtelijke ontbinding bij niet-neerlegging"
    ref: "WVV art. 2:70"
    noot: "Ondernemingsrechtbank kan ontbinding uitspreken op vraag belanghebbende, openbaar ministerie of kamer voor ondernemingen in moeilijkheden. Regularisatietermijn mogelijk. NIET art. 2:74 (die regelt eigen-vermogen-ontbinding — andere grond)."
  - onderwerp: "Correctie van neergelegde jaarrekening"
    ref: "WVV art. 3:19"
    noot: "Materiële fouten of dwaling in rechte/feite — correctie ter goedkeuring AV (behalve loutere materiële fouten door bestuursorgaan zelf)."
  - onderwerp: "Wettelijke controle door commissaris"
    ref: "WVV art. 3:72"
    noot: "Verplicht bij grote en bij groep > 50 werknemers. Controleverklaring volgens vast schema (inleiding + reikwijdte + oordeel + onzekerheden + aanvullende vermeldingen)."
  - onderwerp: "Aansprakelijkheid bestuursorgaan"
    ref: "WVV art. 2:56 + art. 2:57 (cap)"
    noot: "Voor wettelijke verplichtingen-overtreding zoals niet-neerlegging: niet onder business-judgement-rule. Cap volgens grootte-categorie (vier schijven)."
  - onderwerp: "Schatting-wijziging bij waarderingsregel-aanpassing"
    ref: "CBN-advies 2019/04 + KB-WVV art. 3:6"
    noot: "Schatting-wijziging = prospectief; vermelding aard + bedrag in toelichting (waarderingsregels). Examen-vraag 2013-2."

footer: "Leerstuk PO 1.2 — proces + sanctie. Status: voorgesteld volgens ADR-037."

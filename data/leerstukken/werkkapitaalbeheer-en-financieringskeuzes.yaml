wettelijk_fundament:
  - onderwerp: "Functionele-balans-doctrine (NBK/BBK/NT) zelf"
    ref: "Geen wettelijke bepaling — bedrijfseconomisch model (Ooghe & Van Wymeersch, *Handboek financiële analyse*). Rekening-indeling klasse 5 (geldbeleggingen 50-53 + liquide 54-58) + rubriek 43 (financiële schulden bank kort) volgt MAR (KB 21-10-2018)."
  - onderwerp: "Kapitaalbeschermings-test bij dividend-uitkering NV"
    ref: "WVV art. 7:212 — netto-actief-test voor de NV bij uitkering aan aandeelhouders."
  - onderwerp: "BV-liquiditeitstest naast netto-actief-test"
    ref: "WVV art. 5:143 — bestuursorgaan moet 12-maand-prognose maken voor opeisbare schulden na uitkering."
    noot: "Specifiek BV — vervangt het kapitaal-concept dat in WVV werd afgeschaft. Voor de NV geldt geen wettelijke liquiditeitstest maar wel de bestuurder-zorgvuldigheidsplicht (WVV art. 2:52 § 1)."
  - onderwerp: "Interestaftrek-beperking (ATAD / thin-cap)"
    ref: "WIB92 art. 198/1 — financieringskostensurplus aftrekbaar tot max(30 % EBITDA · 3 mio EUR)."
    noot: "Relevant bij financieringsmix-keuze: te veel vreemd vermogen bij grote ondernemingen botst tegen de aftrekgrens."
  - onderwerp: "Alarmprocedure NV"
    ref: "WVV art. 7:228 — bij netto-actief < helft kapitaal: bijeenroeping AV binnen 2 maanden."
    noot: "Indirecte werkkapitaal-relevantie: dividend-uitkering die netto-actief onder de drempel duwt is de facto verboden."


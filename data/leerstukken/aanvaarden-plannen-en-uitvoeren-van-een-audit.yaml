# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Aanvaarding opdracht + opdrachtbrief"
    ref: "ISA 210 §6 + §10"
    noot: "Randvoorwaarden (boekhoudkundig stelsel + verantwoordelijkheid management); schriftelijke opdrachtbrief verplicht."
  - onderwerp: "Onafhankelijkheid bij aanvaarding"
    ref: "KB 1 maart 1998 art. 9 + 11 + 14 · IESBA Code"
    noot: "Weigeren bij elke bedreiging die onafhankelijkheid, beoordelingsvrijheid of onpartijdigheid kan aantasten. Verifieerd via MCP. Uitgewerkt in [[onafhankelijkheid-en-deontologie-bij-controleopdrachten]]."
  - onderwerp: "Planning"
    ref: "ISA 300"
    noot: "Algehele audit-strategie + werkprogramma per bewering."
  - onderwerp: "Kennisverwerving entiteit + omgeving + interne beheersing"
    ref: "ISA 315 (herzien-2019) §13-37"
    noot: "Inzicht in entiteit + omgeving + financieel verslaggevingsstelsel + systeem interne beheersing (incl. IT). Verifieerd via MCP."
  - onderwerp: "Materialiteit"
    ref: "ISA 320 §10-13 · ISA 200"
    noot: "Door de auditor vastgelegd; benchmark + percentage + uitvoeringsmaterialiteit + clearly trivial threshold. Verifieerd via MCP."
  - onderwerp: "Inspelen op risico's"
    ref: "ISA 330"
    noot: "Substantieve werkzaamheden + tests op operationele effectiviteit van controles."
  - onderwerp: "Audit-bewijs + 7 procedures"
    ref: "ISA 500 §6 + §A14-A25"
    noot: "Voldoende en geschikt; betrouwbaarheids-rangorde extern > intern, door auditor gegenereerd > door cliënt gegenereerd."
  - onderwerp: "Voorraadtelling + rechtszaken"
    ref: "ISA 501 §4 (voorraad) + §9-12 (rechtszaken + lawyer's letter)"
    noot: "Auditor woont fysieke voorraadtelling bij wanneer voorraad materieel; lawyer's letter voor hangende rechtszaken."
  - onderwerp: "Externe bevestigingen"
    ref: "ISA 505 §6 + §7 + §12-13"
    noot: "Positieve vs negatieve confirmaties; alternatieve werkzaamheden bij non-respons. Verifieerd via MCP."
  - onderwerp: "Cijferanalyses"
    ref: "ISA 520"
    noot: "Analytische werkzaamheden in planning + uitvoering + slot-review."
  - onderwerp: "Steekproeven"
    ref: "ISA 530"
    noot: "Statistische en niet-statistische steekproef-aanpakken."
  - onderwerp: "Schattingen"
    ref: "ISA 540 (herzien)"
    noot: "Schattingen waardering (voorraad-veroudering + voorzieningen). Verifieerd via MCP."
  - onderwerp: "Verbonden partijen"
    ref: "ISA 550"
    noot: "Identificatie + bewijs voor transacties verbonden partijen; voor REVIA: Polska + Verbeke Holding + persoonlijke transacties Hubert Verbeke."
  - onderwerp: "Communicatie governance + interne beheersing"
    ref: "ISA 260 + ISA 265"
    noot: "Significante bevindingen + significante tekortkomingen IC."
  - onderwerp: "Kwaliteitsmanagement op opdracht-niveau"
    ref: "ISA 220 (herzien)"
    noot: "Delegatie + supervisie + slot-review; opdrachtpartner eindverantwoordelijk. Verifieerd via MCP."
  - onderwerp: "ITAA-KMO-controlenorm — Belgische toepassing"
    ref: "ITAA-KMO-controlenorm"
    noot: "Voor niet-OOB-entiteiten zoals REVIA; verwijst naar ISA's voor methodologie."


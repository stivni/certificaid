verder_lezen:
  intro: "Wanneer je dit snapt, ga dan naar:"
  leerstukken:
    - slug: afronden-en-rapporteren-van-een-audit
      hint: "De directe vervolg-stap — afronding (ISA 450 evaluatie afwijkingen + ISA 540 schattingen + ISA 560 gebeurtenissen na balansdatum + ISA 570 continuïteit + ISA 580 LOR + ISA 720 jaarverslag) + oordeel-types met beslismatrix + revisiedossier (10 jaar bewaring). De drie REVIA-issues krijgen daar hun oordeel-uitkomst."
    - slug: onafhankelijkheid-en-deontologie-bij-controleopdrachten
      hint: "De onderbouwende laag — bedreigingen-kader IESBA met threats-and-safeguards-cyclus. Komt prominent terug bij elke aanvaarding én bij elke gebeurtenis tijdens uitvoering die het beeld kan kantelen."
    - slug: wat-is-externe-controle-en-welke-opdrachten-bestaan
      hint: "Voor het kader — opdracht-types + statuut commissaris + normbronnen-hiërarchie. Lees terug indien onzeker over hoe de wettelijke controle zich verhoudt tot andere opdracht-types."
    - slug: bijzondere-wettelijke-verslagen-bij-vennootschapsverrichtingen
      hint: "Het parallel spoor — niet een audit, maar een bijzonder mandaat met beperkte zekerheid. Belangrijk verschil in werkwijze: staat A&P door bestuursorgaan i.p.v. ontwerp-jaarrekening; modelverslag i.p.v. controleverklaring."
  samenvatting:
    hint: "Voor herhaling vlak vóór het examen — audit-cyclus zes fases op één pagina + materialiteits-formule + 7 procedures + 13 beweringen."


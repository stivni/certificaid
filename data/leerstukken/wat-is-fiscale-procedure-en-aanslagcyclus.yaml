# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Aangifte directe belastingen — algemene basis"
    ref: "WIB92 art. 305-310"
    noot: "art. 305 algemene aangifteplicht · art. 309 bijzondere aangifte bij vertrek (3 maanden) · art. 310 aangifte VenB (1 maand na AV, max 7 mnd na boekjaareinde)."
  - onderwerp: "Vestiging van de aanslag — inkohiering"
    ref: "WIB92 art. 297-298 + art. 359"
    noot: "Het kohier is een uitvoerbare titel; aanslagbiljet wordt verzonden op basis van het kohier."
  - onderwerp: "Aanslagtermijnen — overzicht"
    ref: "WIB92 art. 354 (3/4/6/10 jaar sinds Wet 20.11.2022)"
    noot: "Uitgewerkt in [[controle-onderzoek-en-bewijs]] en samenvatting."
  - onderwerp: "Bezwaartermijn"
    ref: "WIB92 art. 366 (bezwaar) + art. 371 (1 jaar vanaf 3e werkdag na verzending aanslagbiljet)"
    noot: "Uitgewerkt in [[bezwaar-bemiddeling-en-gerechtelijke-fase]]. NIET 6 maanden."
  - onderwerp: "Invordering — bezwaar schorst niet"
    ref: "WIB92 art. 410"
    noot: "Onbetwist deel blijft opeisbaar; bewarend beslag mogelijk."
  - onderwerp: "Btw — eigen verjaring + onderzoek"
    ref: "WBTW art. 81bis (verjaring 3/4/7) + art. 60-63 (onderzoek)"
    noot: "Cross-PO doorklik [[2.4]]."
  - onderwerp: "Federale dwanginvordering"
    ref: "Wetboek van de minnelijke en gedwongen invordering van fiscale en niet-fiscale schuldvorderingen (in werking 1.1.2020) art. 13 (dwangbevel)"
  - onderwerp: "Motiveringsplicht bestuurshandelingen"
    ref: "Wet 29.7.1991 betreffende de uitdrukkelijke motivering van de bestuurshandelingen"
    noot: "Geldt voor BvW, aanslag en directeursbeslissing — uitgewerkt in [[taxatie-bericht-van-wijziging-en-ambtshalve-aanslag]]."
  - onderwerp: "Fiscale bemiddelingsdienst"
    ref: "Wet 25.4.2007 betreffende de fiscale bemiddelingsdienst"
    noot: "Uitgewerkt in [[bezwaar-bemiddeling-en-gerechtelijke-fase]]."

# ---------------------------------------------------------------------------
# Klassieke rechtspraak
# ---------------------------------------------------------------------------

rechtspraak:
  - onderwerp: "Cassatie — gevolgen vormgebreken aanslagbiljet"
    inhoud: "Vaste cassatierechtspraak: een aanslagbiljet zonder vermelding van bezwaarinstantie + bezwaartermijn (of met onjuiste vermelding) doet de termijn NIET ingaan — beschermingsregel ten gunste van de belastingplichtige. Concrete arrest-referenties worden in samenvatting verder aangevuld."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd, specifieke arrest-nummers nog open."

footer: "Leerstuk PO 2.5. Status: voorgesteld — POC volgens ADR-037."

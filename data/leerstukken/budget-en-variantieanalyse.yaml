# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Geen specifieke wetsbron voor budget of variantieanalyse"
    ref: "Bedrijfseconomische technieken — geen wettelijke regeling onder WVV/KB-WVV."
    noot: >
      Wel relevant: pro-forma JR onder masterbudget moet conform de
      KB-WVV-rubricering opgemaakt zijn (consistentie met de wettelijke
      jaarrekening die later geneerd wordt). Standaardkost-variantie-
      boekingen (rekening 658/758) volgen het MAR (KB 21-10-2018).
  - onderwerp: "Materiële variantie — voorraadcorrectie"
    ref: "IAS 2 §13 + KB-WVV art. 3:18-19 + CBN-advies 132/7"
    noot: >
      Bij materiële afwijking (vuistregel > 5% van standaardkost) moet de
      variantie pro-rata over voorraad én kostprijs verkopen gespreid worden
      om de voorraadwaardering correct te houden. Niet-materiële variantie
      mag integraal in resultaat. 5%-drempel = praktijk-vuistregel (🤖),
      geen wettelijke materialiteitsregel.
  - onderwerp: "Boekhoudkundige verwerking — variantierekeningen 658/758"
    ref: "KB 21-10-2018 (MAR) — klassen 65/75 voor niet-recurrente kosten/opbrengsten waaronder productie-varianties bij standaardkost"

footer: "Leerstuk PO 1.8 — lstk 4 van 4 (sluit het PO af). Status: voorgesteld."

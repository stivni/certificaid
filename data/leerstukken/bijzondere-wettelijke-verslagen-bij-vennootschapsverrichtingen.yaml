    - slug: wat-is-externe-controle-en-welke-opdrachten-bestaan
      hint: "Voor het kader — bijzondere wettelijke verslagen vormen de VIJFDE categorie naast audit / review / ISAE / AUP. Wettelijke monopolie van accountant of revisor; statuut hangt van type af."
    - slug: aanvaarden-plannen-en-uitvoeren-van-een-audit
      hint: "Vergelijking met audit-aanvaarding — opdrachtbrief + onafhankelijkheidstoets gelden analoog. Risico-inschatting per bewering werkt anders (beperkte zekerheid)."

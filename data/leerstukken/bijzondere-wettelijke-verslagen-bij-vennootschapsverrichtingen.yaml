# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Inbreng in natura — oprichting (BV)"
    ref: "WVV art. 5:7"
    noot: "Bijzonder verslag oprichters + verslag bedrijfsrevisor over waardering + werkelijke vergoeding. Verifieerd via MCP."
  - onderwerp: "Inbreng in natura — oprichting (NV)"
    ref: "WVV art. 7:7"
    noot: "Verslag oprichters + bedrijfsrevisor; conclusie waardering komt overeen met aandelen-tegenwaarde. Verifieerd via MCP."
  - onderwerp: "Inbreng in natura — kapitaalverhoging (BV / NV)"
    ref: "WVV art. 5:112 (BV) + 7:183 (NV)"
    noot: "Commissaris (indien aangesteld) of door bestuursorgaan aangewezen bedrijfsrevisor of (sinds wet 25-5-2023) gecertificeerd accountant. Verifieerd via MCP."
  - onderwerp: "Quasi-inbreng"
    ref: "WVV art. 5:8 (BV) + 7:8 (NV)"
    noot: "Verkrijging binnen 2 jaar na oprichting van vermogensbestanddelen door aandeelhouders voor > 10 % kapitaal."
  - onderwerp: "Omzetting van rechtsvorm — nationaal"
    ref: "WVV art. 14:3 (omzettingsvoorstel) + 14:5 (staat A&P + verslag)"
    noot: "Bestuursorgaan stelt staat A&P op (nationaal: geen wettelijke termijn — ITAA-norm hanteert max 3 maanden); accountant of revisor verslag over staat. Verifieerd via MCP."
  - onderwerp: "Omzetting — grensoverschrijdend"
    ref: "WVV art. 14:20-14:21 (emigratie) + 14:73-14:74 (immigratie)"
    noot: "Staat A&P max 4 maanden oud; commissaris of bedrijfsrevisor of gecertificeerd accountant verslag. Verifieerd via MCP."
  - onderwerp: "Fusie en splitsing"
    ref: "WVV Boek 12 (fusie) + Boek 13 (splitsing)"
    noot: "Gemeenschappelijk fusievoorstel + verslag bestuursorgaan + verslag accountant of revisor over ruilverhouding."
  - onderwerp: "Ontbinding — algemeen"
    ref: "WVV art. 2:67 + 2:71"
    noot: "Verzwaarde vermeldingen ontbindings-akte + verslag accountant of revisor."
  - onderwerp: "Ontbinding-in-één-akte"
    ref: "WVV art. 2:91"
    noot: "Cumulatieve voorwaarden: geen vereffenaar + alle schulden betaald of geconsigneerd + commissaris/bedrijfsrevisor/externe accountant verslag. Verifieerd via MCP."
  - onderwerp: "Discontinuïteits-waardering bij ontbinding"
    ref: "KB WVV art. 3:6 §2"
    noot: "Going concern verlaten → waardering tegen afwikkelingswaarde."
  - onderwerp: "ITAA-norm bijzondere opdrachten"
    ref: "ITAA-norm inbreng in natura + quasi-inbreng (gemeenschappelijk met IBR) · ITAA-norm omzetting · ITAA-norm ontbinding-vereffening (§11 verificatie commissarisplicht) · gemeenschappelijke IBR-ITAA-norm fusie/splitsing"
    noot: "Per verrichting verplichte procedures + modelverslagen. §11 ontbinding-vereffening verifieerd via MCP."
  - onderwerp: "Toezending verslag aan ITAA"
    ref: "ITAA-richtlijn — 1 maand"
    noot: "Termijn voor toezending van bijzondere-verslagen aan de ITAA na ondertekening. Examen-klassieker 2013-1."
  - onderwerp: "Ter beschikking aandeelhouders 15 dagen"
    ref: "WVV art. 7:128 (kapitaalverhoging) + analoge bepalingen"
    noot: "Bestuurs-verslagen + bijzondere verslagen ter beschikking gesteld 15 dagen vóór AV."
  - onderwerp: "Onafhankelijkheid bij bijzonder mandaat"
    ref: "KB 1 maart 1998 art. 9 + IESBA Code"
    noot: "Per opdracht toets bedreigingen — vooral zelf-toetsing bij commissaris-overlap."
  - onderwerp: "Gerechtelijke expertise"
    ref: "Ger.W. art. 962-991ter"
    noot: "Benoeming gerechtsdeskundige + werkwijze op tegenspraak. Buiten kern PO 1.6."

footer: "Leerstuk PO 1.6 — parallel spoor (zwaarste — hoe-uitzondering ~4500 woorden). Status: voorgesteld — ADR-037."

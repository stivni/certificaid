# Leerstuk-script — erfbelasting + aangifte van nalatenschap
#
# PO 2.6, lstk 4 van 5. Techniek-leerstuk (zwaarst van het pakket): brengt
# civielrechtelijk fundament (huwelijksvermogen + devolutie) samen met
# fiscale techniek (grondslag, tarief, aangifte, fictiebepalingen). Werkt
# de hypothetische overlijdens-aangifte van Filip De Wilde volledig door.

meta:
  slug: erfbelasting-en-aangifte-nalatenschap
  titel: "Erfbelasting en aangifte van nalatenschap — devolutie, grondslag, tarief, procedure"
  po: "2.6"
  cluster: registratie-en-successierechten
  voorbeeldgroep: de-wilde
  beschrijving: >
    Leerstuk PO 2.6 — het zwaarste leerstuk. Vijf vragen samen: wie erft
    (devolutie hervormd erfrecht 2018), wat valt in de nalatenschap (bruto
    actief min aannemelijk passief, gecorrigeerd voor huwelijksvermogen),
    hoeveel belasting (gewest + tarief-schaal per erfgenaam-categorie),
    hoe dien je aangifte (4-maand-termijn + aangifteplichtigen), en welke
    fictiebepalingen breiden de grondslag uit?

intro:
  callout_beat: >
    Standaard leerstuk-intro met verwijzing naar minicursus PO 2.6. Vermeld
    dat dit leerstuk zwaarder is dan de vorige drie — vijf vragen samen
    omdat ze didactisch onlosmakelijk zijn. De stagiair die alleen het
    tarief kent zonder devolutie kan geen aangifte opstellen. Leerstukken
    [[wat-zijn-registratie-en-successierechten]] (kader) +
    [[registratieformaliteit-en-procedure]] (proces) zijn vooraf nodig.

# ---------------------------------------------------------------------------
# Antwoord in één blik
# ---------------------------------------------------------------------------

antwoord_in_een_blik:
  beats:
    - "Open in één zin: erfbelasting is een **gewestelijke heffing op de overgang van vermogen bij overlijden**. Drie kwesties moeten samenhangend beantwoord worden — wat valt in de nalatenschap (civiel + fiscaal), wie erft welk deel (devolutie), tegen welk tarief (per erfgenaam, per gewest)."
    - "Tweede zin: de **aangifte van nalatenschap** is het procedurele instrument — binnen 4 maanden na overlijden in België (5 maanden bij overlijden in EU, 6 maanden daarbuiten), ingediend door de erfgenamen en algemene legatarissen, betaling binnen 2 maanden na verstrijken aangiftetermijn."
    - "Derde zin: vijf **fictiebepalingen** breiden de grondslag uit — om planning-trucs in extremis te neutraliseren. Schenking < 3 jaar zonder registratie, levensverzekering aan overlevende echtgenoot of derde, beding van aanwas, sterfhuisclausule, schuldbekentenis aan erfgenaam."
    - "Vierde zin: voor de accountant zit het zwaarste werk in **stap 1 (inventarisatie vermogen + huwelijksstelsel-toepassing)** en **stap 2 (aannemelijk-passief-classificering)** — de helft van examen-vragen test of de stagiair de juiste posten kan rangschikken volgens art. 27 + 33 W.Succ./VCF."
  visualisaties:
    - type: tabel-inline
      kolommen: ["Stap", "Wat doe je?"]
      rijen:
        - ["1. Civiel kader", "Huwelijksstelsel + devolutie bepalen → wat valt in nalatenschap + wie erft"]
        - ["2. Bruto actief", "Inventarisatie + waardering goederen erflater + helft gemeenschap"]
        - ["3. Aannemelijk passief", "Schulden bestaand op overlijdens-dag + begrafeniskosten *(art. 27)* + uitzondering lening erfgenaam *(art. 33)*"]
        - ["4. Fictie-bepalingen", "Schenking < 3 jaar zonder registratie · levensverzekering · beding van aanwas · sterfhuisclausule"]
        - ["5. Bevoegd gewest + tarief", "Fiscale woonplaats erflater bepaalt VCF / W.Succ. — tarief progressief per erfgenaam"]
        - ["6. Aangifte indienen", "4 maanden in België · 5/6 maanden Europa/buitenland · aangifteplichtigen art. 38"]
  afsluiter: "Korte zin: 'We werken het hieronder in vijf secties uit, met de hypothetische overlijdens-aangifte van Filip De Wilde als doorlopende voorbeeldcase.'"

# ---------------------------------------------------------------------------
# Opbouw
# ---------------------------------------------------------------------------

opbouw:

  - id: civiel-fundament-uitgewerkt
    titel: "Civielrechtelijk fundament — huwelijksvermogen + devolutie"
    niveau: 2
    beats:
      - "Open: erfbelasting bouwt op civiel recht. Het examen straft hard wie 'snel naar tarief' wil zonder eerst de civiele basis vast te leggen. Twee kennisstromen moeten samenkomen — huwelijksvermogensrecht (BW Boek 2, hervorming 2018) bepaalt **wat in de nalatenschap valt**, erfrecht (BW Boek 4, hervorming 2018) bepaalt **wie erft welk deel**."
      - "**Huwelijksvermogen — drie stelsels.** (a) **Wettelijk stelsel** (gemeenschap van aanwinsten + behoud eigen goederen) — geldt voor wie huwt zonder huwelijkscontract. Aanwinsten (arbeidsinkomsten, gemeenschappelijke aankopen) zijn gemeenschappelijk; goederen van vóór huwelijk + erfenissen + schenkingen nadien blijven eigen. (b) **Gemeenschap van alle goederen** — contractueel, alles gemeenschappelijk. (c) **Zuivere scheiding van goederen** — contractueel, niets gemeenschappelijk."
      - "Toepassing op De Wilde (uit voorbeeldgroep): Filip + Lieve gehuwd 1988, wettelijk stelsel. Bij overlijden Filip wordt het gemeenschapsvermogen **eerst ontbonden** (helft naar Lieve als overlevende echtgenoot, helft in nalatenschap Filip); eigen goederen Filip (Tweede verblijf Knokke, 20 % aandelen via erfenis) gaan integraal in nalatenschap; eigen goederen Lieve blijven van haar."
      - "Toon de tabel met **wat in de nalatenschap valt vs wat niet**. Cruciaal: de **helft van het gemeenschapsvermogen** komt in de nalatenschap — niet het geheel. Dit is een klassieke beginnersfout."
      - "**Devolutie — hervormd erfrecht 2018.** Drie hoofdregels. (a) **Afstammelingen erven bij voorrang** (kinderen, dan kleinkinderen via plaatsvervulling, dan achterkleinkinderen). (b) **Overlevende echtgenoot** krijgt naast afstammelingen het **vruchtgebruik op de hele nalatenschap** (art. 4.50 BW oud / art. 4.196 BW nieuw). Afstammelingen krijgen de blote eigendom. Vruchtgebruik is gekapitaliseerd op basis van leeftijd-tabellen (Lebreton-tabel / Schryvers-tabel) voor de fiscale waardering. (c) **Bij afwezigheid van afstammelingen** erft de overlevende echtgenoot meer — volle eigendom met regels voor de zijlijn (ouders, broers, zussen)."
      - "**Reservatair erfdeel.** Afstammelingen hebben een **wettelijke reserve** van de helft van de nalatenschap (BW hervorming 2018 — vroegere reserves voor ouders zijn afgeschaft). De andere helft is het 'beschikbaar deel' waarover de erflater testamentair vrij kan beschikken. Wie kinderen onterft tot beneden de reserve: testament wordt teruggebracht tot wat reservataire bescherming toelaat."
      - "Toon de devolutie-schema voor De Wilde: Filip overlijdt zonder testament, 2 kinderen (Sofie + Stef) + overlevende echtgenoot Lieve. Lieve krijgt vruchtgebruik op de hele nalatenschap; Sofie + Stef krijgen elk de **helft van de blote eigendom**. Bij gezinswoning Antwerpen extra: vrijstelling erfbelasting voor overlevende echtgenoot art. 2.7.6.0.3 VCF (Vlaanderen) — Lieve betaalt 0 % op het volledige aandeel van Filip in de gezinswoning."
      - "**Vier legataris-categorieën** (examen-favoriet). Een **testament** kan iemand niet-erfgenaam aanwijzen als legataris — vier kwalificaties met verschillende rechten + aangifteplichten. (1) **Algemeen legataris** — krijgt de hele nalatenschap (of het beschikbaar deel ervan). (2) **Legataris onder algemene titel** — krijgt een fractie (bv. 1/3) of een categorie goederen (bv. alle onroerend goed). (3) **Bijzondere legataris** — krijgt een specifiek goed (bv. 'mijn schilderij van Magritte aan Jan'). (4) **Wettelijke legataris** — bestond historisch voor de overlevende echtgenoot (vandaag geïntegreerd in wettelijke devolutie)."
      - "Blockquote-aside: het verschil tussen de vier categorieën raakt **aangifteplicht**. Erfgenamen + algemene legatarissen + algemene begiftigden zijn aangifteplichtig (art. 38 W.Succ. / art. 3.3.1.0.5 VCF). Bijzondere legatarissen meestal niet — zij ontvangen hun specifieke goed en betalen erfbelasting op hun aandeel, maar de aangifte zelf wordt door de algemene erfgenamen ingediend. Een examenvraag uit 2014-1 testte dit precies — de student moest weten wie aangifteplichtig is bij een testament met meerdere legataris-types."
    visualisaties:
      - type: mermaid
        ref: devolutie-filip-wilde
        bron: voorbeeldgroep
      - type: tabel-inline
        kolommen: ["Goed", "Stelsel-kwalificatie", "In nalatenschap Filip?"]
        rijen:
          - ["Gezinswoning Antwerpen", "Gemeenschap", "**Helft** *(225k)* → wel"]
          - ["Tweede verblijf Knokke", "Eigen Filip *(erfenis 2010)*", "**Volledig** *(350k)* → wel"]
          - ["Studio Brussel", "Gemeenschap", "**Helft** *(110k)* → wel"]
          - ["20 % aandelen via erfenis 2010", "Eigen Filip", "**Volledig** *(~300k)* → wel"]
          - ["40 % aandelen via aankoop", "Gemeenschap", "**Helft** *(~300k)* → wel"]
          - ["Beleggingsportefeuille KBC", "Gemeenschap", "Helft *(250k)* → wel"]
          - ["Tak 23 levensverzekering Filip", "Premies uit gemeenschap", "Fictie-bepaling *(zie verder)* → 50 % belastbaar"]
          - ["Zicht- en spaarrekeningen", "Gemeenschap", "Helft *(20k)* → wel"]
      - type: tabel-inline
        kolommen: ["Legataris-categorie", "Wat krijgt hij?", "Aangifteplichtig?"]
        rijen:
          - ["**Erfgenaam *(wettelijke devolutie)***", "Volgens wettelijke regels (afstammelingen, echtgenoot, ouders, broers/zussen)", "**Ja**"]
          - ["**Algemeen legataris**", "Hele nalatenschap (of beschikbaar deel)", "**Ja**"]
          - ["**Legataris onder algemene titel**", "Fractie (1/3, 1/4) of categorie goederen", "Soms — afhankelijk van scope"]
          - ["**Bijzondere legataris**", "Specifiek goed of bedrag", "**Nee** *(maar wel verschuldigd erfbelasting op zijn aandeel)*"]
          - ["**Algemeen begiftigde** *(contractuele erfstelling)*", "Vergelijkbaar met algemeen legataris", "**Ja**"]

  - id: bruto-actief-en-passief
    titel: "Bruto actief min aannemelijk passief — wat staat erin?"
    niveau: 2
    beats:
      - "Open: het netto-belastbaar bedrag = **bruto actief van de nalatenschap min aannemelijk passief**. Beide componenten verdienen apart aandacht — vooral het passief, omdat dat **klassieke examen-camouflage** is."
      - "**Bruto actief — vijf componenten.** (1) **Eigen onroerend goed** van de erflater (verkoopwaarde op dag overlijden). (2) **Helft van het gemeenschappelijk onroerend goed** (huwelijksstelsel-bepaald). (3) **Roerend goed** — beleggingen, cash, voertuigen, kunst (waardering volgens marktwaarde of forfait). (4) **Aandelen + bedrijfsbelangen** — waardering volgens de werkelijke economische waarde. (5) **Vorderingen** (op derden, op vennootschappen, op familieleden). Sommige fictie-uitbreidingen volgen — werkt §3 hieronder uit."
      - "**Waardering**: verkoopwaarde op datum overlijden. Voor onroerend goed: vrij gewaardeerd (in de praktijk: schattingsverslag of vergelijkbare verkoopprijzen). Voor effecten: beurskoers op dag overlijden of binnen een redelijke periode (15 dagen). Voor aandelen niet-genoteerd: substantie + DCF + multiples — terrein waar Vlabel kritisch is en waar de accountant verdedigingsstrategie opbouwt."
      - "**Aannemelijk passief (art. 27 + 33 W.Succ. / art. 2.7.3.4.1 VCF) — de kern-camouflage.** Stelregel: alleen **schulden die bestonden op de dag van overlijden** zijn aftrekbaar, plus **begrafeniskosten** (zonder plafond). Schulden ontstaan **na** overlijden zijn géén passief — ze zijn een last van de erfgenamen, niet van de nalatenschap."
      - "**Vier voorbeelden van WEL passief**: (1) openstaande hypothecaire lening op gezinswoning. (2) lopende facturen (energie, water, telecom) gefactureerd voor overlijden, betaald nadien. (3) belastingschulden voor overlijdens-jaar (PB + lokale belastingen) — die rusten op de erflater zelf. (4) begrafeniskosten + repatriëring + plechtigheid — art. 27 noemt deze expliciet."
      - "**Vier voorbeelden van GEEN passief**: (1) **ereloon notaris voor opmaak attest van erfopvolging of aangifte van nalatenschap** — ontstaan **ná** overlijden. (2) **stookolie geleverd na overlijdens-datum** — geen schuld erflater. (3) **lening bij een erfgenaam** — verworpen door **art. 33, 1° W.Succ.** als anti-misbruik (ouders konden anders 'leningen' opzetten kort vóór overlijden). (4) **belasting op vermogen nadien** — N.v.t. tot 2026 in België."
      - "**Cruciale uitzondering art. 33, 2° W.Succ. / VCF**: een **lening bij een erfgenaam** is **wél aannemelijk** als de lening **bestemd was voor verbetering van een nalatenschapsgoed** (verbouwing, renovatie). De wet wil legitieme onroerend-goed-investeringen tussen familie niet straffen."
      - "Concretiseer met De Wilde-scenario `filip-overlijdt-hypothetisch`: vijf passief-posten getoetst. (1) Begrafeniskosten €9.500 — **AANGENOMEN**. (2) Lopende facturen €1.800 (gas/water gefactureerd voor overlijden) — **AANGENOMEN**. (3) Ereloon advocaat voor opmaak aangifte €3.500 — **NIET AANGENOMEN** (ontstaan ná). (4) Lening van zoon Stef €25.000 voor renovatie Knokke — **AANGENOMEN** op grond van art. 33, 2° (bestemming verbetering nalatenschapsgoed). (5) Stookolie €1.200 geleverd juli 2026 — **NIET AANGENOMEN** (na overlijden mei 2026)."
      - "Toon de aannemelijk-passief-tabel volledig + reken bruto, passief, netto. Bruto De Wilde scenario = €1.645.000 (incl. fictie levensverzekering €90.000). Passief = €36.300. Netto-belastbaar = **€1.608.700** vóór tarief-toepassing."
      - "Blockquote-aside: in examenvragen van 2008, 2013-1, 2014-1, 2015-1 zit elke keer een gemengde lijst van vijf-zes passief-posten waarvan er twee-drie te schrappen zijn. Het is **de** klassieke 2.6-camouflage. Tip: gebruik altijd het dubbele criterium 'bestond de schuld op overlijdens-dag?' + 'kennis art. 33 uitzonderingen?'. Niet één laatste vraag stellen — beide."
    visualisaties:
      - type: tabel-inline
        kolommen: ["Filip overlijdt — passief-posten", "Bedrag", "Status art. 27 + 33", "Argument"]
        rijen:
          - ["Begrafeniskosten + repatriëring + plechtigheid", "€9.500", "**AANGENOMEN**", "Art. 27 — zonder plafond"]
          - ["Lopende facturen (gas, water) gefactureerd vóór overlijden", "€1.800", "**AANGENOMEN**", "Schuld bestaand op overlijdens-dag"]
          - ["Ereloon advocaat voor aangifte van nalatenschap", "€3.500", "**NIET AANGENOMEN**", "Ontstaan ná overlijden"]
          - ["Lening van zoon Stef *(renovatie Knokke)*", "€25.000", "**AANGENOMEN**", "Uitzondering art. 33, 2° — bestemming verbetering nalatenschapsgoed"]
          - ["Stookolie geleverd juli 2026", "€1.200", "**NIET AANGENOMEN**", "Levering na overlijden"]
          - ["**Aannemelijk passief totaal**", "**€36.300**", "", ""]
      - type: tabel-inline
        kolommen: ["Filip nalatenschap-saldo", "Bedrag"]
        rijen:
          - ["Bruto actief *(incl. fictie levensverzekering €90.000)*", "**€1.645.000**"]
          - ["Aannemelijk passief", "**−€36.300**"]

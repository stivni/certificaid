  - id: tarief-en-bevoegd-gewest
    titel: "Bevoegd gewest + tariefschalen — wie betaalt hoeveel?"
    niveau: 2
    beats:
      - "Open: het gewest dat de erfbelasting heft = het gewest van **fiscale woonplaats van de erflater op de dag van overlijden** (art. 5/1 VCF + federaal analoog). De ligging van het vermogen of de woonplaats van de erfgenaam is niet beslissend. Bij verhuis korte tijd voor overlijden: meetdatum is 'voornaamste verblijfplaats in de laatste 5 jaar'."
      - "Voor De Wilde: Filip heeft fiscale woonplaats Antwerpen sinds 1990 → bij overlijden 2026 toepassing **VCF (Vlaanderen)**. Dat geldt voor het hele vermogen — ook studio Brussel + (theoretisch) Waals onroerend. Brussel- of Wallonië-W.Succ. komt niet kijken."
      - "**Vlaamse tariefschalen — drie categorieën.** (a) **Rechte lijn** (afstammelingen + echtgenoot + wettelijk samenwonende) — meest gunstig. Schalen 2026 (Cijferzakboekje): 3 % tot €50.000 / 9 % tussen €50.000-€250.000 / 27 % boven €250.000. **Per erfgenaam afzonderlijk** — Sofie en Stef worden niet samengeteld; elk een eigen aanslag. (b) **Broers en zussen** — minder gunstig. 25 % tot €75.000 / 30 % tot €125.000 / 55 % boven. (c) **Anderen** (vrienden, derden) — duurst. 25 % tot €75.000 / 45 % tot €125.000 / 55 % boven."
      - "**Bijzondere tariefschalen.** (a) **Onroerend goed wordt apart belast** van roerend goed bij berekening per schijf (anti-progressie-stapeling). (b) **Gunstregime familiale onderneming bij erfopvolging** (art. 2.7.4.2.2 VCF): **3 %** rechte lijn / **7 %** anderen — i.p.v. progressieve schalen. Voorwaarden: familiale vennootschap, reële economische activiteit, continuïteit + participatie 3 jaar nadien. (c) **Vrijstelling gezinswoning overlevende echtgenoot** (art. 2.7.6.0.3 VCF): **0 %** op het deel gezinswoning naar overlevende echtgenoot — Lieve betaalt geen erfbelasting op de helft gezinswoning die ze van Filip krijgt."
      - "**Brussel + Wallonië tariefschalen** (W.Succ.) — verschillen in detail. Brussel: 3 % tot €50k / 8 % tot €100k / 9 % tot €175k / 18 % tot €250k / 24 % tot €500k / 30 % boven (rechte lijn). Wallonië: 3-30 % progressief (rechte lijn). Geen vrijstelling gezinswoning zoals VCF; wel vermindering of abattement in beperkte mate."
      - "Concretiseer De Wilde tarief-berekening (vereenvoudigd). Netto nalatenschap €1.608.700. Toedeling civiel: Lieve krijgt vruchtgebruik op alles + volle eigendom op gezinswoning-aandeel; Sofie + Stef krijgen elk blote eigendom op de helft van de rest. **Lieve**: gezinswoning-helft Filip €225.000 → 0 % VCF vrijstelling = €0. Vruchtgebruik op rest gekapitaliseerd (Lieve 60, kapitalisatiecoëfficiënt ~33 % volgens forfait) — rechte lijn tarief op gekapitaliseerd bedrag. **Sofie + Stef**: elk blote eigendom op (€1.608.700 − €225.000 − Lievenvruchtgebruik) / 2. Tarief rechte lijn 3 %/9 %/27 % per schijf. Voor aandelen De Wilde Bouw NV (€600.000 in nalatenschap): mogelijk gunstregime art. 2.7.4.2.2 VCF → **3 % vlak** i.p.v. progressief — als familiale vennootschap-voorwaarden voldaan blijven 3 jaar na overlijden."
      - "Blockquote-aside: **per-erfgenaam-tarif vs nalatenschapstarief**. In Vlaanderen + Wallonië wordt erfbelasting per erfgenaam geheven (per persoon eigen schaal). In Brussel: per nalatenschap (één globale schaal). Implicatie: een nalatenschap van €600.000 verdeeld over 3 kinderen kost in Vlaanderen veel minder dan in Brussel — elke €200k aanslag valt in lage schijven."
    visualisaties:
      - type: tabel-inline
        kolommen: ["Vlaamse erfbelasting tariefschijf", "Rechte lijn", "Broers/zussen", "Anderen"]
        rijen:
          - ["€0 — €50.000", "**3 %**", "25 %", "25 %"]
          - ["€50.000 — €75.000", "**9 %**", "25 %", "25 %"]
          - ["€75.000 — €125.000", "**9 %**", "30 %", "45 %"]
          - ["€125.000 — €250.000", "**9 %**", "55 %", "55 %"]
          - ["> €250.000", "**27 %**", "55 %", "55 %"]
      - type: tabel-inline
        kolommen: ["Bijzondere tariefregime VCF", "Tarief", "Voorwaarden"]
        rijen:
          - ["Gezinswoning → overlevende echtgenoot *(art. 2.7.6.0.3)*", "**0 %**", "Echtgenoot is overlevende; gezinswoning was hoofdverblijf"]
          - ["Familiale onderneming bij erfopvolging *(art. 2.7.4.2.2)*", "**3 %** rechte lijn · **7 %** anderen", "Familiale venn., reële activiteit, continuïteit + participatie 3 jaar nadien"]
          - ["Roerende schenking < 3 jaar zonder registratie", "Reguliere erfbelasting *(fictie)*", "Art. 2.7.1.0.5 VCF"]

  - id: aangifte-van-nalatenschap
    titel: "Aangifte van nalatenschap — termijn, aangifteplichtigen, sancties"
    niveau: 2
    beats:
      - "Open: de aangifte van nalatenschap is **een aparte aangifte** met eigen termijnen + sancties — niet hetzelfde als de algemene registratiebelasting-formaliteit (lstk 3). Vier vragen: wie? wanneer? waar? wat als laattijdig?"
      - "**Wie? Aangifteplichtigen** (art. 38 W.Succ. / art. 3.3.1.0.5 VCF): (1) **erfgenamen** — wettelijke + testamentaire; (2) **algemene legatarissen** — wie het hele beschikbaar deel krijgt; (3) **algemene begiftigden** — bij contractuele erfstelling. **Bijzondere legatarissen** zijn niet aangifteplichtig — zij worden belast op hun aandeel maar dragen niet de aangifte. **Hoofdelijke aansprakelijkheid**: de aangifte mag door één aangifteplichtige worden ondertekend met effect voor allen, maar elke aangifteplichtige is hoofdelijk aansprakelijk voor de juistheid."
      - "**Wanneer? Termijnen** (art. 40 W.Succ. / art. 3.3.1.0.6 VCF). (a) **Overlijden in België**: **4 maanden** vanaf overlijdens-datum. (b) **Overlijden in een EU-lidstaat**: **5 maanden**. (c) **Overlijden buiten de EU**: **6 maanden**. Filip overlijdt 15 mei 2026 in België → aangifte uiterlijk **15 september 2026**."
      - "**Termijnverlenging mogelijk** — moet aangevraagd worden bij Vlabel/FOD vóór verstrijken van de oorspronkelijke termijn. Toegekend bij bijzondere omstandigheden (complexe internationaal vermogen, vermissing erfgenamen, lopende rechtszaak rond legataris-kwalificatie). Niet routine — geen automatisme."
      - "**Waar? Bevoegde administratie**: Vlabel (Vlaanderen) of FOD Financiën — Algemene Administratie van de Patrimoniumdocumentatie (Brussel/Wallonië). Online indienen of via gestandaardiseerd papier-formulier."
      - "**Wat staat er in de aangifte?** Inventaris bruto actief + aannemelijk passief + verklaring fictie-bepalingen + identificatie aangifteplichtigen + huwelijksstelsel-verklaring + verklaring eerdere schenkingen < 3 jaar (al dan niet geregistreerd) + bij gunstregime familiale onderneming: verklaring + attest Vlabel (voor familiale vennootschap-kwalificatie)."
      - "**Betaaltermijn (art. 77 W.Succ. / art. 3.10.4.4.1 VCF)**: erfbelasting moet betaald worden **binnen 2 maanden na verstrijken van de aangiftetermijn**. Filip-scenario: aangiftetermijn 15 september 2026 → **betaling uiterlijk 15 november 2026**. Bij betalingsmoeilijkheden — afbetalingsplan kan aangevraagd worden (renteloos voor beperkte termijn, daarna met nalatigheidsrente)."
      - "**Sancties laattijdigheid.** (a) Laattijdige aangifte: belastingverhoging variërend van 10 % (lichte vertraging, goede trouw) tot 100 % (fraude) — art. 3.18.0.0.4 VCF. (b) Laattijdige betaling: nalatigheidsinteresten + eventuele dwanginvordering (beslag op nalatenschap-bestanddelen). (c) Onvolledige aangifte: na controle bijkomende aanslag + 50 % belastingverhoging klassiek."
      - "Toon termijn-kompas voor Filip: overlijden 15 mei 2026 → aangifte 15 september → betaling 15 november. **6 maanden** beslaat het hele proces. De accountant orchestreert."
      - "Blockquote-aside: een **opschortende voorwaarde** in een testament (bv. 'mijn zoon krijgt het gebouw als hij de naam draagt') schorst de heffing **niet** automatisch. De aangifte moet binnen termijn, met provisorische opname; bij realisatie of niet-realisatie volgt verrekening. Examenvraag 2014-1 testte dit precies — student moet weten dat termijn loopt, niet wacht op vervulling van de voorwaarde."
    visualisaties:
      - type: tabel-inline
        kolommen: ["Termijn", "Wettelijk", "Filip-scenario *(overlijden 15 mei 2026)*"]
        rijen:
          - ["Aangifte indienen — overlijden in België", "**4 maanden** *(art. 40 W.Succ./3.3.1.0.6 VCF)*", "Uiterlijk **15 september 2026**"]
          - ["Aangifte — overlijden in EU", "5 maanden", "n.v.t."]
          - ["Aangifte — overlijden buiten EU", "6 maanden", "n.v.t."]
          - ["Betaling erfbelasting", "**2 maanden** na aangiftetermijn *(art. 77 W.Succ./3.10.4.4.1 VCF)*", "Uiterlijk **15 november 2026**"]
          - ["Termijnverlenging aangifte", "Op aanvraag — vóór termijn", "Filip-scenario: geen aanvraag nodig"]

  - id: fictiebepalingen
    titel: "Fictiebepalingen — de grondslag uitgebreid"
    niveau: 2
    beats:
      - "Open: vijf **fictiebepalingen** breiden de belastbare grondslag uit naar verrichtingen **bij leven** die fiscaal worden behandeld alsof het overdrachten **bij overlijden** waren. Allemaal anti-misbruik: planning-trucs in extremis worden geneutraliseerd."
      - "**Fictie 1 — Schenking < 3 jaar zonder registratie (art. 2.7.1.0.5 VCF / art. 7 W.Succ.).** Een schenking gedaan binnen 3 jaar vóór overlijden, **zonder dat de schenkbelasting werd betaald** (= niet geregistreerd), wordt voor de erfbelasting beschouwd als legaat. Doel: voorkomen dat ouders kort vóór overlijden 'snel' alles wegschenken via handgift om de erfbelasting te ontwijken."
      - "**Implicatie voor planning**: schenking **registreren binnen 4 maanden** (schenkbelasting betalen) → fictie speelt niet, het goed verlaat de toekomstige nalatenschap definitief. Schenking **niet registreren** (puur handgift + aangetekende brief) → moet 3 jaar overleven, anders alsnog erfbelasting. **Hier ligt een planning-trade-off** die in [[successieplanning-en-gunstregime]] uitgewerkt wordt."
      - "**Fictie 2 — Levensverzekering aan begunstigde (art. 2.7.1.0.6 VCF / art. 8 W.Succ.).** Uitkering van een levensverzekering bij overlijden van de verzekerde aan een aangeduide begunstigde wordt voor de erfbelasting **als legaat van de erflater aan de begunstigde** beschouwd. Reden: zonder fictie zou een Tak 21/23-verzekering een belasting-vrije vermogensoverdracht zijn buiten de nalatenschap om."
      - "**Pro-rata-regel**: alleen het deel dat met gemeenschapsvermogen werd gefinancierd is fictief belast — 50 % bij wettelijk stelsel. Voor Filip-scenario: Tak 23 reserve €180.000, premies uit gemeenschap → **50 % = €90.000** wordt als legaat aan Lieve beschouwd in de aangifte. Lieve is rechte lijn → tarief progressief, maar mogelijk vrijstelling gezinswoning kicke. Niet automatisch — moet expliciet in aangifte."
      - "**Fictie 3 — Beding van aanwas (art. 2.7.1.0.7 VCF).** Wanneer twee echtgenoten of partners contractueel afspreken dat bij overlijden van één van hen het gemeenschappelijk goed (typisch onroerend) volledig overgaat naar de overlevende (i.p.v. aan de erfgenamen), wordt dit civielrechtelijk geldig — maar fiscaal behandeld alsof het overgenomen aandeel een legaat is. Anti-misbruik tegen ontwijking van het erfdeel van de kinderen + de erfbelasting."
      - "**Fictie 4 — Sterfhuisclausule (art. 2.7.1.0.7 VCF, deels overlappend).** Een variant van het beding van aanwas, contractueel ingeschreven in een huwelijkscontract bij ziekte van één echtgenoot. De goederen van de zieke echtgenoot vallen onmiddellijk bij overlijden van die echtgenoot aan de gezonde, zonder dat dat als 'gewone' nalatenschap geldt. Fiscaal: als legaat beschouwd voor de erfbelasting."
      - "**Fictie 5 — Schuldbekentenis aan erfgenaam (art. 33 W.Succ. / art. 2.7.3.4.1 VCF).** Reeds vermeld in §2 over passief — als anti-misbruik: een 'schuldbekentenis' kort vóór overlijden waarbij de overledene zogezegd geld leende van een erfgenaam wordt **niet als passief erkend**. Uitzondering art. 33, 2°: lening met bestemming verbetering nalatenschapsgoed = wél aftrekbaar."
      - "Toon de fictie-tabel met de vijf gevallen + Filip-toepassing."
      - "Blockquote-aside: fictiebepalingen zijn **examen-favoriet** omdat ze het verschil tonen tussen civielrechtelijke vorm en fiscale realiteit. De student die alleen burgerlijk recht heeft, ziet de schenking 'definitief uit het patrimonium'; de fiscalist ziet de 3-jaars-radar nog tikken. Inzicht in beide perspectieven is voor de accountant essentieel — dat is precies wat de adviesvraag van de cliënt vraagt."
    visualisaties:
      - type: tabel-inline
        kolommen: ["Fictie", "Wat wordt belast?", "Wetsbasis VCF", "De Wilde-toepassing"]
        rijen:
          - ["Schenking < 3 jaar zonder registratie", "Geschonken goed = fictief legaat", "Art. 2.7.1.0.5", "Schenking aandelen 2018 aan Sofie was geregistreerd → fictie speelt niet"]
          - ["Levensverzekering aan begunstigde", "Uitkering pro rata = fictief legaat", "Art. 2.7.1.0.6", "Tak 23 €180k → 50 % (€90k) belastbaar als legaat aan Lieve"]
          - ["Beding van aanwas", "Overgang aandeel onverdeeld goed", "Art. 2.7.1.0.7", "Filip-Lieve hebben geen beding van aanwas — niet van toepassing"]
          - ["Sterfhuisclausule", "Idem — variant huwelijkscontract", "Art. 2.7.1.0.7", "Niet van toepassing"]
          - ["Schuldbekentenis aan erfgenaam", "Lening = geen passief tenzij verbetering goed", "Art. 33 W.Succ. / 2.7.3.4.1 VCF", "Lening Stef €25k = AANGENOMEN (uitzondering — renovatie Knokke)"]

  - id: drie-valkuilen
    titel: "Drie valkuilen"
    niveau: 2
    type_blokken: warning-bullets
    beats:
      - "Valkuil 1 (⚠️): **Helft gemeenschapsvermogen vergeten af te trekken**. Bij overlijden van Filip is alleen de **helft** van de gemeenschapsgoederen in zijn nalatenschap — niet het geheel. Studio Brussel staat voor €220.000 op tafel; nalatenschap-aandeel Filip = €110.000. Student die het geheel optelt zit op het dubbele en betaalt fictief erfbelasting op vermogen dat al naar Lieve gaat als overlevende echtgenoot. Eerste check bij elke aangifte: **welk stelsel + helft eraf**."
      - "Valkuil 2 (⚠️): **Ereloon notaris/advocaat voor de aangifte als passief inschrijven**. Klassieke camouflage. Het ereloon ontstaat **ná** overlijden = geen schuld van de erflater. Geen aftrek. Examenvragen 2008, 2013-1, 2014-1, 2015-1 testen dit elke keer. Cijfers van rond €3.000-€5.000 worden 'plausibel' in een lijstje gezet — student moet ze schrappen."
      - "Valkuil 3 (⚠️): **Fictiebepaling levensverzekering vergeten in te schrijven**. De Tak 21/23-uitkering aan de overlevende echtgenoot komt **niet automatisch** in de aangifte — de aangifteplichtige moet expliciet pro rata vermelden (50 % bij gemeenschap-financiering). Vlabel/FOD kan achteraf bij controle vaststellen + bijkomende aanslag + 50 % belastingverhoging. Voorkomen: bij elk overlijden polis-overzicht opvragen."


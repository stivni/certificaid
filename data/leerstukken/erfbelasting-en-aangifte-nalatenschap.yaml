# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Bevoegd gewest erfbelasting"
    ref: "VCF art. 5/1 (Vlaanderen) + analoge federale regel voor W.Succ. Brussel/Wallonië"
    noot: "Fiscale woonplaats erflater op dag overlijden; bij verhuis < 5 jaar: voornaamste verblijfplaats in laatste 5 jaar."
  - onderwerp: "Huwelijksvermogensrecht — hervorming 2018"
    ref: "BW Boek 2 — wet 22 juli 2018 (in werking 1.9.2018)"
    noot: "Wettelijk stelsel = gemeenschap van aanwinsten + behoud eigen goederen. Federaal — geldt identiek in alle drie gewesten."
  - onderwerp: "Erfrecht — hervorming 2018"
    ref: "BW Boek 4 — wet 31 juli 2017 (in werking 1.9.2018)"
    noot: "Reservataire erfgenaam = afstammelingen (helft van nalatenschap); overlevende echtgenoot krijgt vruchtgebruik op hele nalatenschap naast afstammelingen (art. 4.50 oud / 4.196 nieuw)."
  - onderwerp: "Bruto actief + aannemelijk passief"
    ref: "W.Succ. art. 15 (actief) + art. 27 (passief) + art. 33 (uitzondering lening erfgenaam) / VCF art. 2.7.3.x"
    noot: "Schulden bestaand op dag overlijden + begrafeniskosten. Uitzondering art. 33, 2°: lening van erfgenaam voor verbetering nalatenschapsgoed."
  - onderwerp: "Tariefschalen erfbelasting Vlaanderen"
    ref: "VCF art. 2.7.4.1.1 (rechte lijn) · art. 2.7.4.2.1 (anderen)"
    noot: "Schalen rechte lijn 3 % / 9 % / 27 %. Bedragen in Cijferzakboekje. Brussel + Wallonië: eigen W.Succ.-schalen."
  - onderwerp: "Vrijstelling gezinswoning overlevende echtgenoot"
    ref: "VCF art. 2.7.6.0.3"
    noot: "100 % vrijstelling op deel gezinswoning dat naar overlevende echtgenoot toekomt. Vlaamse vrijstelling — Brussel + Wallonië beperkter."
  - onderwerp: "Gunstregime familiale onderneming bij erfopvolging"
    ref: "VCF art. 2.7.4.2.2"
    noot: "3 % rechte lijn / 7 % anderen i.p.v. progressief. Voorwaarden: familiale venn., reële economische activiteit, continuïteit + participatie 3 jaar nadien."
  - onderwerp: "Aangifte van nalatenschap — termijn"
    ref: "W.Succ. art. 40 / VCF art. 3.3.1.0.6"
    noot: "4 maanden overlijden in België; 5 maanden EU; 6 maanden buiten EU. Termijnverlenging mogelijk op aanvraag vóór verstrijken."
  - onderwerp: "Aangifteplichtigen"
    ref: "W.Succ. art. 38 / VCF art. 3.3.1.0.5"
    noot: "Erfgenamen + algemene legatarissen + algemene begiftigden. Hoofdelijk aansprakelijk voor juistheid."
  - onderwerp: "Betaaltermijn erfbelasting"
    ref: "W.Succ. art. 77 / VCF art. 3.10.4.4.1"
    noot: "2 maanden na verstrijken aangiftetermijn. Afbetalingsplan mogelijk."
  - onderwerp: "Fictie schenking < 3 jaar zonder registratie"
    ref: "VCF art. 2.7.1.0.5 / W.Succ. art. 7"
    noot: "Schenking gedaan binnen 3 jaar vóór overlijden zonder schenkbelasting → behandeld als legaat."
  - onderwerp: "Fictie levensverzekering"
    ref: "VCF art. 2.7.1.0.6 / W.Succ. art. 8"
    noot: "Uitkering bij overlijden van verzekerde aan begunstigde = legaat voor erfbelasting; pro-rata-regel voor financiering uit gemeenschap."
  - onderwerp: "Fictie beding van aanwas + sterfhuisclausule"
    ref: "VCF art. 2.7.1.0.7"
    noot: "Contractuele aanwas-clausules tussen echtgenoten/partners: overgang behandeld als legaat."
  - onderwerp: "Belastingverhoging laattijdige aangifte"
    ref: "VCF art. 3.18.0.0.4 + uitvoeringsbesluiten"
    noot: "10-100 % afhankelijk van mate goede trouw + herhaling + fraude."


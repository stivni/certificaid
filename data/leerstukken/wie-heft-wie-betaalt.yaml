# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Heffende bevoegdheid — vier niveaus"
    ref: "Grondwet art. 170 §§1-4"
    noot: "Federaal (§1), gewest/gemeenschap (§2), provincie (§3), agglomeratie/federatie/gemeente (§4). Elk niveau vereist een eigen wettelijk instrument."
  - onderwerp: "Belasting-monopolie tegenover retributie"
    ref: "Grondwet art. 173"
    noot: "Buiten enkele uitzonderingen kan van burgers geen retributie worden gevorderd dan alleen als belasting ten behoeve van Staat, gemeenschap, gewest, agglomeratie, federatie van gemeenten of gemeente."
  - onderwerp: "Bijzondere Financieringswet — gewestelijke fiscale autonomie"
    ref: "Bijzondere wet 16 januari 1989 (BFW) art. 3 (eigen gewestbelastingen) + art. 5 (lokalisatie + overname inning) + art. 5/1 e.v. (aanvullende gewestelijke PB)"
    noot: "Lijst eigen gewestbelastingen: registratie- en successierechten, hypotheekrechten, OV, verkeersbelasting, BIV, eurovignet, spelen en weddenschappen, automatische ontspanningstoestellen, openingsbelasting slijterijen."
  - onderwerp: "Aanvullende gemeentebelasting op PB"
    ref: "WIB92 art. 465"
    noot: "In afwijking van art. 464 mogen agglomeraties en gemeenten een aanvullende belasting op de PB vestigen. Tarieven vastgesteld door gemeenteraadsreglement."
  - onderwerp: "Opcentiemen provincie/agglomeratie/gemeente op OV en bepaalde gewestbelastingen"
    ref: "WIB92 art. 464/1"
  - onderwerp: "Vlaamse leegstandsheffing bedrijfsruimten"
    ref: "Vlaamse Codex Fiscaliteit art. 2.6.1.0.1 (heffing) + art. 2.6.7.0.1 (verschuldigd vanaf jaar volgend op derde opeenvolgende registratie) + art. 2.6.7.5.1 (opschorting bedrijfseconomische omstandigheden)"
    noot: "Eigen Vlaamse heffing — geen federaal equivalent. Wordt geïnd door VLABEL."
  - onderwerp: "Belastbare inkomsten van bestuurder — bedrijfsleidersbezoldiging"
    ref: "WIB92 art. 32"
    noot: "Werkgever houdt bedrijfsvoorheffing in en stort door; bestuurder geeft aan in PB. Klassiek voorbeeld van uiteenvallen 'wettelijke schuldenaar' versus 'belastingplichtige'."


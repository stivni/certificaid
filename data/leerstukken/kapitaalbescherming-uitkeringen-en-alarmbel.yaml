rechtspraak:
  - onderwerp: "Vermoeden causaliteit niet-naleving alarmbel"
    inhoud: "IBA-rechtsleer (Strelia 2022) bevestigt vaste rechtspraak: bij niet-bijeenroeping AV in alarmbel-context wordt schade door derden vermoed veroorzaakt te zijn door de niet-bijeenroeping. Vermoeden weerlegbaar, maar bewijslast verschuift naar bestuurder."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd."
  - onderwerp: "Alarmbel-schending als grove fout art. 2:57"
    inhoud: "Cassatie heeft het laten alarmbel-luiden bij ernstige financiële moeilijkheden als grove fout gekwalificeerd, met als gevolg dat de cap van art. 2:56 wegvalt en de bestuurder onbeperkt aansprakelijk is voor de schade die schuldeisers daardoor lijden."
    confidence: "⚠️ te verifiëren — algemene leer bestendigd; specifieke arrest-nummers per kamer."


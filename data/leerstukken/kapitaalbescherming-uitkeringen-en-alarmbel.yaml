# ---------------------------------------------------------------------------
# Wettelijk fundament
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "BV — netto-actief-test bij uitkering"
    ref: "WVV art. 5:142"
    noot: "Geen uitkering indien netto-actief negatief zou worden of zou dalen onder statutair onbeschikbare inbreng/reserves."
  - onderwerp: "BV — liquiditeitstest"
    ref: "WVV art. 5:143"
    noot: "Bestuursorgaan vaststellen dat vennootschap haar opeisbare schulden ≥12 mnd na uitkering kan blijven betalen."
  - onderwerp: "BV — sanctie bij onrechtmatige uitkering"
    ref: "WVV art. 5:144"
    noot: "Hoofdelijke aansprakelijkheid bestuurders voor schade + terugvorderingsrecht tegen aandeelhouders, ongeacht hun goede trouw."
  - onderwerp: "NV — netto-actief- en liquiditeitstest"
    ref: "WVV art. 7:212-7:213"
    noot: "Analoog aan BV maar getoetst aan gestort/opgevraagd kapitaal + onbeschikbare reserves."
  - onderwerp: "NV — quasi-inbreng"
    ref: "WVV art. 7:8 + 7:10"
    noot: "Insider-verkrijging ≥ 10% kapitaal binnen 2 jaar na oprichting — bedrijfsrevisorenverslag + AV-goedkeuring."
  - onderwerp: "Inbreng in natura BV (oprichting + kapitaalverhoging)"
    ref: "WVV art. 5:7 + 5:133"
    noot: "Bijzonder verslag bestuur + bedrijfsrevisorenverslag."
  - onderwerp: "Inbreng in natura NV (oprichting + kapitaalverhoging)"
    ref: "WVV art. 7:7 + 7:197"
    noot: "Analoog."
  - onderwerp: "Beperking voorkeurrecht NV"
    ref: "WVV art. 7:191"
    noot: "Aanvullend verslag commissaris/revisor over uitgifteprijs + motivering beperking."
  - onderwerp: "Interim-dividend NV"
    ref: "WVV art. 7:213"
    noot: "Statutaire machtiging + dubbele test + winst van lopend boekjaar."
  - onderwerp: "Kapitaalvermindering NV — 2-maand-schuldeiserstermijn"
    ref: "WVV art. 7:208"
    noot: "Schuldeisers kunnen zekerheid vragen binnen 2 maanden na bekendmaking."
  - onderwerp: "Inkoop eigen aandelen BV / NV"
    ref: "WVV art. 5:147 BV / 7:215 NV"
    noot: "AV-besluit versterkte meerderheid + uitkeringsruimte volgens dubbele test."
  - onderwerp: "**Alarmbel BV — negatief netto-actief of liquiditeitstest**"
    ref: "WVV art. 5:153"
    noot: "Trigger: §1 nettoactief negatief of dreigt negatief — §2 liquiditeitstest 12 mnd faalt. AV bijeenroepen binnen 2 mnd."
  - onderwerp: "**Alarmbel NV — drempels 1/2 en 1/4 kapitaal**"
    ref: "WVV art. 7:228"
    noot: "Twee drempels — elk een aparte AV-cyclus."
  - onderwerp: "Bestuurdersaansprakelijkheid — algemeen + cap"
    ref: "WVV art. 2:56 + 2:57"
    noot: "Cap volgens omzet/balanstotaal; cap valt bij grove fout (alarmbel-schending kwalificeert)."
  - onderwerp: "Wrongful trading — bijdrage tot faillissement"
    ref: "WER art. XX.227"
    noot: "Curator kan vordering instellen voor netto-passief bij kennelijk grove fout — typisch bij te-late alarmbel."


# Samenvatting-script — PO 1.3 Analyse en kritische beoordeling jaarrekening
#
# POC-status (na 1-4 en 1-8). Volgt het schema in data/samenvattingen/SCHEMA.md.
# Bedoeld als geheugen-kapstok voor herhaling, niet om voor het eerst te leren.

meta:
  slug: "1-3"
  titel: "Analyse en kritische beoordeling van de jaarrekening"
  po: "1.3"
  beschrijving: "PO-samenvatting (geheugen-kapstok): vier ratio-families, functionele balans, schema-bewustzijn, valkuilen op 3-4 A4 — printbaar voor herhaling"
  explorer_title: "6. Samenvatting"
  print_a4: 4

intro:
  callout_beat: >
    Standaard samenvatting-intro: "kapstok voor herhaling, niet om voor het eerst te leren".
    Verwijs naar de leerstukken voor uitleg en doorwerking + naar de minicursus voor verhaal.

take_away:
  titel: "Take-away — wat je écht moet weten"
  bullets:
    - "**Vier ratio-families samen, niet apart.** Liquiditeit · solvabiliteit · rentabiliteit · activiteit. Eén ratio alleen geeft geen oordeel — pas drie dimensies (trend · sector · cross-categorie) geven betekenis."
    - "**Eerst herwerken, dan rekenen.** Analytische balans (4 blokken) + functionele balans-drieluik (NBK · BBK · NT). De BBK-rubriekenkeuze (ja/nee per balanspost) is een terugkerende valkuil."
    - "**Schema-bewustzijn.** In het verkort schema verdwijnen omzet (rubriek 70) en aankopen (60) — DSO en commerciële brutomarge zijn dan niet berekenbaar. Klassieke valkuil."
    - "**Bruto in twee betekenissen.** Bruto van niet-kaskosten (EBITDA = bruto van afschrijvingen) **vs** bruto in commerciële zin (omzet − rubriek 60). Belgische conventie voor 'brutoverkoopmarge' = bedrijfsresultaat / omzet (NBB)."
    - "**Cash ≠ winst.** Operationele cashflow kan negatief zijn terwijl er winst is — werkkapitaal vreet cash op. IAS 7 indirecte methode: nettoresultaat + niet-kas-items + Δ werkkapitaal."
    - "**Doelstelling 1.3.1.2: voorstellen formuleren.** Integratie-niveau. Analyse stopt niet bij vaststellen; concrete aanbevelingen aan bestuur horen erbij."

extra_blokken:

  - id: vier-families-tabel
    type: tabel-vergelijking
    titel: "Vier ratio-families — formule, rubrieken, interpretatie"
    kolommen: ["Familie", "Kernratio's", "Formule", "Rubrieken", "Vuistregel"]
    rijen:
      - ["**Liquiditeit**", "Current ratio", "VA / KT-sch", "(3+40-41+50-58+490) / (42-48+492)", "1,5-2,0 gezond"]
      - ["", "Quick ratio (acid test)", "(VA − voorraden) / KT-sch", "Idem zonder klasse 3", "> 1,0 ✓"]
      - ["", "Cash ratio", "(50-58) / KT-sch", "Liq. middelen + geldbel. / KT-sch", "0,2-0,4 typisch"]
      - ["", "Cash conversion cycle (CCC)", "DSO + DIO − DPO", "dagen", "lager = beter"]
      - ["**Solvabiliteit**", "Schuldgraad", "VV / Totaal", "(16+17+42-48+492) / 10/49", "< 70 % gezond"]
      - ["", "Solvabiliteitsratio (EV/totaal)", "EV / Totaal = 100 % − schuldgraad", "10-15 / 10/49", "> 30 % comfortabel"]
      - ["", "Debt-to-equity", "VV / EV", "—", "< 2 gezond"]
      - ["", "Interest coverage", "EBIT / kosten van schulden", "9901 / 650", "> 5 sterk · < 3 zwak"]
      - ["**Rentabiliteit**", "Brutoverkoopmarge (NBB)", "Bedrijfsresultaat / omzet", "9901 / 70", "sector-afhankelijk"]
      - ["", "Commerciële brutomarge", "(omzet − aankopen) / omzet", "(70 − 60) / 70", "10-50 % afh. sector"]
      - ["", "EBITDA-marge", "EBITDA / omzet", "(9901+630+631+635) / 70", "> 10 % sterk"]
      - ["", "Nettomarge", "Nettoresultaat / omzet", "9904 / 70", "> 5 % sterk"]
      - ["", "ROE", "Nettoresultaat / EV", "9904 / 10-15", "> 10 % gezond"]
      - ["", "ROA", "Bedrijfsresultaat / Totaal activa", "9901 / 10/49", "sector-afhankelijk"]
      - ["**Activiteit**", "DSO (klanten)", "(40 × 365) / (70 × 1,21)", "dagen", "lager = beter"]
      - ["", "DPO (leveranciers)", "(44 × 365) / ((60+61) × 1,21)", "dagen", "hoger = relief"]
      - ["", "DIO (voorraad)", "(3 × 365) / 60", "dagen", "lager = beter"]
      - ["", "Werkkapitaalbehoefte (BBK)", "Excl. exploitatie-VA − Excl. exploitatie-KT-sch", "zie BBK-tabel", "—"]

  - id: functionele-balans-drieluik
    type: tabel-vergelijking
    titel: "Functionele balans NBK · BBK · NT"
    kolommen: ["Component", "Formule", "Wat meet het?"]
    rijen:
      - ["**NBK** (netto-bedrijfskapitaal)", "Permanent vermogen − Vaste activa<br>= VA − Schulden ≤ 1j", "Structurele buffer voor cyclus"]
      - ["**BBK** (behoefte aan bedrijfskapitaal)", "Exploitatie-VA − Exploitatie-KT-sch", "Cash vastgepind in operationele cyclus"]
      - ["**NT** (nettothesaurie)", "NBK − BBK<br>= (50-58) − (42+43)", "Cash-overschot of -tekort. > 0 = geen KT-noodfinanciering"]
    noot: "De BBK-rubriekenkeuze (ja/nee per balanspost) en de interpretatie van een positieve nettothesaurie zijn beide klassieke vraagstellingen — zie tabel hieronder."

  - id: bbk-rubrieken
    type: tabel-vergelijking
    titel: "BBK — ja/nee per balansrubriek"
    kolommen: ["Rubriek", "Code", "In BBK?", "Reden"]
    rijen:
      - ["Voorraden", "30/36", "✅ Ja", "Exploitatief"]
      - ["Bestellingen in uitvoering", "37", "✅ Ja", "Exploitatief"]
      - ["Handelsvorderingen", "40", "✅ Ja", "Exploitatief"]
      - ["Overige vorderingen ≤ 1j", "41", "✅ Ja", "Meestal exploitatief (btw)"]
      - ["Overlopende rek. actief", "490/1", "✅ Ja", "Pro rata"]
      - ["Geldbeleggingen", "50/53", "❌ Nee", "Thesaurie"]
      - ["Liquide middelen", "54/58", "❌ Nee", "Thesaurie"]
      - ["Vaste activa", "20-29", "❌ Nee", "Permanent"]
      - ["Handelsschulden", "44", "✅ Ja", "Exploitatief"]
      - ["Ontvangen vooruitbet.", "46", "✅ Ja", "Exploitatief"]
      - ["Fisc/soc/loonschulden", "45", "✅ Ja", "Exploitatief"]
      - ["Overige schulden", "47/48", "✅ Ja", "Meestal exploitatief"]
      - ["Overlopende rek. passief", "492/3", "✅ Ja", "Pro rata"]
      - ["**42 LT-schulden binnen 1j vervallend**", "42", "**❌ Nee**", "**Financieel**"]
      - ["**43 Financiële schulden (kaskredieten)**", "43", "**❌ Nee**", "**Financieel**"]
      - ["EV · voorzieningen · LT-schulden", "10-17", "❌ Nee", "Permanent"]

  - id: schema-volledig-vs-verkort
    type: tabel-vergelijking
    titel: "Volledig vs verkort schema — welke ratio's vallen weg?"
    kolommen: ["Schema", "Wie?", "Wat ontbreekt?", "Onmogelijke ratio's"]
    rijen:
      - ["**Volledig**", "Groot (criteria boven drempel)", "—", "Geen"]
      - ["**Verkort**", "Klein (binnen drempels)", "Omzet (70) in 9900 Brutomarge · rubriek 60 niet apart · reserves niet uitgesplitst", "**DSO** · **DPO** · **commerciële brutomarge**"]
      - ["**Micro**", "Microvennootschap (zeer beperkt)", "Idem + nog meer vereenvoudigd · geen sociale balans", "Idem + nog meer activiteits-ratios"]
    noot: "Drempels (Cijferzakboekje) — niet hardcoded. Klassieke vraag: 'welke ratio kan je niet berekenen in verkort schema?' Antwoord: DSO + DPO + commerciële brutomarge."

  - id: beslisboom-welke-ratio
    type: mermaid
    titel: "Beslisboom — welke ratio bij welke vraag?"
    mermaid_type: flowchart-td
    code: |
      V[Vraag van de gebruiker] --> Q1{Liquiditeit<br/>of solvabiliteit?}
      Q1 -->|Kortetermijn betaalcapaciteit| L[**Liquiditeit**<br/>current · quick · cash · CCC]
      Q1 -->|Langetermijn schuldcapaciteit| S[**Solvabiliteit**<br/>schuldgraad · EV/totaal · IC]
      V --> Q2{Winstgevendheid<br/>of efficiëntie?}
      Q2 -->|Verdient kapitaal genoeg?| R[**Rentabiliteit**<br/>marges · ROE · ROA]
      Q2 -->|Hoe efficiënt draait werkkapitaal?| A[**Activiteit**<br/>DSO · DPO · DIO]
      R --> DP[DuPont:<br/>ROE = marge × turnover × hefboom]
      L --> CC[CCC verbindt<br/>met activiteit]
      A --> BBK[BBK verbindt<br/>met liquiditeit]
      S --> HB[Hefboom-toets:<br/>ROA na bel. vs kostprijs VV]

  - id: dupont-en-hefboom
    type: tabel-vergelijking
    titel: "DuPont + hefboomanalyse — cross-categorie instrumenten"
    kolommen: ["Instrument", "Formule", "Interpretatie"]
    rijen:
      - ["**DuPont-decompositie**", "ROE = Nettomarge × Asset turnover × Equity multiplier", "Waar komt ROE-mutatie vandaan? Marge / efficiëntie / hefboom"]
      - ["**Operationele hefboom (DOL)**", "Δ % EBIT / Δ % omzet", "Hoge DOL = hoge vaste kosten = asymmetrisch"]
      - ["**Financiële hefboom (DFL)**", "EBIT / (EBIT − kosten van schulden)", "DFL > 1 = rente-last verhoogt ROE-gevoeligheid"]
      - ["**Hefboomeffect-toets**", "ROA na bel. > kostprijs VV?", "Ja → schuld werkt POSITIEF · Nee → NEGATIEF"]

  - id: begrippen-scherp
    type: tabel-vergelijking
    titel: "Begrippen scherp houden"
    kolommen: ["Begrip", "Definitie", "Niet verwarren met"]
    rijen:
      - ["**Intrinsieke waarde** (per aandeel)", "EV / aantal aandelen", "Beurswaarde (markt) · fractiewaarde (kapitaal-deel)"]
      - ["**Fractiewaarde**", "Kapitaal (of inbreng voor BV/CV) / aantal aandelen", "Intrinsieke waarde (inclusief reserves)"]
      - ["**Beurswaarde**", "Markt-prijs per aandeel × aantal aandelen", "Intrinsieke · fractiewaarde"]
      - ["**Solvabiliteitsratio**", "EV / totaal passief", "Zelffinancieringsgraad ((reserves+overgedragen)/totaal)"]
      - ["**Zelffinancieringsgraad**", "(Reserves + overgedragen winst) / totaal", "Solvabiliteitsratio (telt ook inbreng)"]
      - ["**'Bruto' verkoopmarge (NBB)**", "Bedrijfsresultaat / omzet — bruto = vóór niet-kaskosten in marge-zin (NBB-conventie)", "Commerciële brutomarge (omzet − rubr.60) / omzet"]
      - ["**Netto-rentabiliteit bedrijfsactiva**", "(Resultaat vóór belasting + kosten van schulden) / totaal activa — CBN 2011/14", "ROA (bedrijfsresultaat / totaal — geen rente-correctie)"]
      - ["**Operationele cashflow vóór belastingen**", "Bedrijfsresultaat + niet-kasbestanddelen bedrijfskosten", "Klassieke cashflow (start van eindresultaat 9904)"]
      - ["**EBIT** (bedrijfsresultaat ≈ 9901)", "Earnings before interest and taxes", "EBITDA (bruto van niet-kaskosten)"]
      - ["**EBITDA**", "EBIT + afschrijvingen + waardeverm. + voorzieningen", "EBIT (na niet-kaskosten)"]

  - id: continuiteit-altman
    type: tabellen-en-formules
    titel: "Continuïteit + Altman Z-score"
    sub_blokken:
      - type: tabel-inline
        sub_titel: "Going-concern-indicatoren"
        kolommen: ["Signaal", "Bron"]
        rijen:
          - ["Negatief eigen vermogen", "Balans"]
          - ["Structurele verliezen (3 jaar)", "RR-trend"]
          - ["Interest coverage < 1,5 of covenant-schending", "Solvabiliteits-ratio"]
          - ["Aanhoudende negatieve operationele cashflow", "Kasstroomtabel"]
          - ["KT-financiering voor LT-verliezen", "Balans-evolutie"]
          - ["Toelichting met onzekerheidsclausule", "Toelichting bestuur"]
      - type: formule
        sub_titel: "Altman Z-score (private firm)"
        formule: "Z' = 0,717 X1 + 0,847 X2 + 3,107 X3 + 0,420 X4 + 0,998 X5"
        beschrijving_na: |
          - X1 = NBK / Totaal activa
          - X2 = (Reserves + overgedragen winst) / Totaal activa
          - X3 = EBIT / Totaal activa
          - X4 = EV (boekwaarde) / VV-totaal
          - X5 = Omzet / Totaal activa
          - **Z' < 1,23** = distress · **1,23 − 2,90** = grijze zone · **> 2,90** = veilig
      - type: prose-blok
        sub_titel: "WVV-alarmbel (raakvlak PO 1.9)"
        beats:
          - "**NV / Comm.VA / SE** (kapitaalhoudend, art. 7:228): trigger = nettoactief < helft (of vierde) kapitaal door geleden verlies"
          - "**BV / CV** (kapitaal-loos, art. 5:153): twee tests — solvabiliteit (nettoactief negatief dreigt/is) OF liquiditeit (schulden komende 12 maanden niet kunnen betalen)"
          - "**Reactie**: bijzonder bestuursverslag binnen 2 maanden + AV-bijeenroeping + voorstel maatregelen of vereffening"
          - "CBN-advies 2021/14 geeft de jaarrekeningrechtelijke invulling"

valkuilen:
  titel: "Klassieke valkuilen"
  format: tabel
  rijen:
    - valkuil: "'Netto rentabiliteit = na belasting'"
      wat_klopt_niet: "'Netto' kan ook 'na niet-kaskosten' betekenen (vs bruto-rentabiliteit)"
      wat_klopt_wel: "Twee betekenissen — let op formule-keuze. CBN 2011/14 = na afschrijvingen, vóór belasting"
    - valkuil: "'Rubriek 42 LT-schuld binnen jaar vervallend in BBK'"
      wat_klopt_niet: "Rubriek 42 lijkt kortlopend maar is een FINANCIËLE schuld"
      wat_klopt_wel: "Niet in BBK — exploitatie-filter sluit financieel uit"
    - valkuil: "'Verkort schema = alle ratio's berekenbaar'"
      wat_klopt_niet: "Omzet (70) en aankopen (60) ontbreken — DSO + DPO + commerciële brutomarge onmogelijk"
      wat_klopt_wel: "Liquiditeit + solvabiliteit blijven berekenbaar"
    - valkuil: "'Hogere afschrijving verlaagt de brutoverkoopmarge'"
      wat_klopt_niet: "Afschrijvingen (rubr. 630) staan ONDER de commerciële brutomarge in het schema"
      wat_klopt_wel: "Geen effect op de NBB-brutoverkoopmarge — de afschrijving zit al in 9901 verwerkt"
    - valkuil: "'Positieve NT = altijd goed'"
      wat_klopt_niet: "Structureel hoge NT kan onderbenutting cash signaleren"
      wat_klopt_wel: "Positief = goede liquiditeit, maar interpreteer in context (sector + alternatieven)"
    - valkuil: "'Eén ratio = oordeel'"
      wat_klopt_niet: "Een ratio zonder trend + sector + cross-categorie is een snapshot zonder context"
      wat_klopt_wel: "Vier-assen-methode: trend + sector + cross-categorie + kwalitatief"
    - valkuil: "'Window-dressing = fraude'"
      wat_klopt_niet: "Grijze schaal — sommige technieken zijn binnen de wet (vervroegde inning)"
      wat_klopt_wel: "Spectrum van legitieme jaarafsluit-optimalisatie tot fraude. Detectie via balansdatum-vergelijking met Q1 of mid-jaar"
    - valkuil: "'EBITDA = cash'"
      wat_klopt_niet: "EBITDA negeert werkkapitaal-mutaties — winst en cash kunnen sterk verschillen"
      wat_klopt_wel: "Operationele cashflow = EBITDA ± Δ werkkapitaal − betaalde rente − betaalde belastingen"


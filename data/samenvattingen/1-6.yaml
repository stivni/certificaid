# Samenvatting-script — PO 1.6 Externe controle
#
# Proces-PO met dubbel zwaartepunt: (a) de ISA-audit-cyclus (planning →
# uitvoering → afronding → verslag) en (b) de bijzondere wettelijke
# verslagen Boek 14 WVV. Strakke samenvatting met audit-cyclus-mermaid,
# opdracht-types-tabel, beslismatrix oordeel-types, audit-bewijs-flow,
# zeven controlewerkzaamheden met bewijskracht-rangorde, bijzondere
# mandaten als kapstok-vergelijking, IESBA bedreigingen-kader en zeven
# valkuilen. Vermijdt detail-cijfers (Cijferzakboekje / WVV-drempels).
#
# Wets-claims al bevestigd door de vijf gerenderde leerstukken
# (geen MCP-call nodig in deze render):
#   - Vier opdracht-types IAASB (audit ISA / review ISRE / ISAE / AUP ISRS 4400)
#   - Vier oordeel-types ISA 705 + ITAA-KMO §119-121
#   - Audit-cyclus zes fases (aanvaarding → planning → uitvoering → afronding → verslag → archivering)
#   - Zeven controlewerkzaamheden ISA 500 §A14-A25
#   - Bijzondere mandaten Boek 14 WVV — art. 5:7 (inbreng) · 14:3 + 14:5 (omzetting) · gemeenschappelijke IBR-ITAA-fusienorm · art. 2:71 + 2:80 (ontbinding)
#   - Vijf IESBA bedreigingen-categorieën + KB 1 maart 1998 art. 9
#   - Revisiedossier 10 jaar — Wet 7 dec 2016 art. 16 + ISA 230
#   - Materialiteit door auditor — ISA 320
#
# Status: eerste-versie samenvatting POC, op basis van vijf gerenderde
# leerstukken (NIET op basis van oude cluster-themafiches — die fasen uit
# per ADR-039).

meta:
  slug: "1-6"
  titel: "Externe controle"
  po: "1.6"
  beschrijving: "PO-samenvatting (geheugen-kapstok): vier opdracht-types langs zekerheidsniveau, de audit-cyclus van aanvaarding tot verslag, de beslismatrix voor de vier oordeel-types, de zeven controlewerkzaamheden met bewijskracht-rangorde, het vergelijkings-kapstok voor de bijzondere wettelijke verslagen Boek 14 WVV en het IESBA bedreigingen-kader — printbaar op 3 A4."
  explorer_title: "6. Samenvatting"
  print_a4: 3

intro:
  callout_beat: >
    Proces-PO met dubbele zwaartepunt — de audit-cyclus (ISA-kader) én de
    bijzondere wettelijke verslagen (Boek 14 WVV). Deze samenvatting bundelt
    de vier opdracht-types langs hun zekerheidsniveau, de zes audit-fases,
    de beslismatrix voor het oordeel, de zeven controlewerkzaamheden met
    bewijskracht-rangorde, de vier bijzondere-mandaten-archetypes en het
    IESBA bedreigingen-kader. Voor verhaal en routekaart: overzicht PO 1.6.

# ---------------------------------------------------------------------------
# Verplichte sectie 1: TAKE-AWAY (6 scherpe bullets — zaken die NIET in
# een tabel verderop af te lezen zijn)
# ---------------------------------------------------------------------------

take_away:
  titel: "Take-away — wat je écht moet weten"
  bullets:
    - "**Zekerheidsniveau, niet de naam, bepaalt het type opdracht.** Audit = redelijke zekerheid (positief geformuleerd oordeel — *true and fair view*). Review = beperkte zekerheid (negatief — *niets dat doet vermoeden*). ISAE = redelijk of beperkt op niet-financiële info. AUP = géén zekerheid (bevindingen). Bij elke nieuwe opdracht: éérst het zekerheidsniveau vaststellen, dan pas de norm zoeken — anders mismatch tussen verwachting en eindproduct."
    - "**De audit-cyclus is iteratief, niet lineair.** Risico-inschatting (ISA 315) stuurt de strategie (ISA 300 + 320); controlebevindingen sturen de risico-inschatting opnieuw bij. Examen-cases integreren altijd meerdere fases — materialiteit + confirmaties + cut-off + voorbehoud in één vraag. Wie de cyclus als checklist behandelt, mist de feedback-loops die het oordeel onderbouwen."
    - "**Materialiteit ligt bij de auditor — niet bij KB, niet bij de AV.** Vaste regel sinds ISA 320: de auditor stelt overall materiality vast (vuistregels 0,5-1 % omzet · 1-2 % activa · 5-10 % resultaat vóór belastingen) en uitvoeringsmaterialiteit (typisch 50-75 % daarvan). MCQ-strikvraag elk examen: 'wie bepaalt materialiteit?' — auditor, vastgelegd in werkprogramma."
    - "**Bewijskracht heeft een rangorde.** Externe bevestigingen door derden + eigen waarneming + herberekening = sterk. Inlichtingen + cliënt-cijfers = zwak. Bij een bewijs-mix bouwt de auditor zijn oordeel op de sterkere bron. Lawyer's letter (ISA 580) of bankconfirmatie (ISA 505) krijgt voorrang boven een mondelinge management-toelichting — examen toetst deze hiërarchie expliciet."
    - "**Vier oordeel-types langs één 2×2-matrix.** Materieel × diepgaand × type probleem (afwijking of scope-beperking). Materieel-niet-diepgaand = voorbehoud · materieel-diepgaand-afwijking = afkeurend · materieel-diepgaand-scope = onthouding · niet-materieel = goedkeurend. Een onthouding (geen informatie) ≠ een afkeurend oordeel (verkeerde informatie) — verwarring is examen-klassieker."
    - "**Bijzondere mandaten zijn géén audit — limited assurance op een staat door het bestuursorgaan.** Vier verrichtings-types (inbreng natura · omzetting · fusie/splitsing · ontbinding) delen één patroon: opdrachtbrief → staat A&P opgemaakt door bestuursorgaan (max 3 maanden oud) → beperkte zekerheid → modelverslag met expliciete vermelding overwaardering + risico-clausule. Werken op proef- en saldibalans van interne boekhouder = niet aanvaardbaar."
    - "**Onafhankelijkheid kent vijf bedreigings-categorieën (IESBA).** Eigenbelang · zelf-toetsing · belangenbehartiging · vertrouwdheid · intimidatie. Per opdracht: identificeer → evalueer (significant?) → safeguard of weiger. KB 1 maart 1998 art. 9 verbiedt onverenigbare functies absoluut; voor alle andere bedreigingen weegt de auditor met safeguards. Aanvaarding zonder threats-and-safeguards-cyclus = professional misconduct."

# ---------------------------------------------------------------------------
# Optionele extra blokken — volgorde = render-volgorde
# ---------------------------------------------------------------------------

extra_blokken:

  - id: opdracht-types-tabel
    type: tabel-vergelijking
    titel: "Vier opdracht-types — IAASB-kader"
    intro: "De keuze tussen audit, review, ISAE en AUP wordt gestuurd door het **gewenste zekerheidsniveau** dat derden van het verslag verwachten — niet door de naam. Bij wettelijke opdrachten (commissaris) is het type vastgelegd; bij contractuele opdrachten kiest de opdrachtgever het niveau. Voor uitwerking: [[wat-is-externe-controle-en-welke-opdrachten-bestaan]]."
    kolommen: ["Opdracht", "Zekerheidsniveau", "Norm-kader", "Eindproduct"]
    rijen:
      - ["**Audit** (controle van historische financiële info)", "**Redelijke zekerheid** (positief)", "ISA 100-810 + ITAA-KMO-controlenorm (niet-OOB)", "Controleverklaring — *true and fair view*"]
      - ["**Review** / beoordeling", "**Beperkte zekerheid** (negatief)", "ISRE 2400 / 2410", "Beoordelingsverslag — *niets doet vermoeden dat …*"]
      - ["**ISAE** (assurance op niet-historische / niet-financiële info)", "**Redelijk of beperkt**", "ISAE 3000 + 3400 reeks", "Assurance-rapport (CSR, prospectus, …)"]
      - ["**Overeengekomen procedures (AUP)**", "**Géén zekerheid**", "ISRS 4400 (herzien 2020)", "Rapport van feitelijke bevindingen — gebruiker trekt conclusie"]
      - ["**Compilatie** (verwante dienst)", "**Géén zekerheid**", "ISRS 4410", "Samenstellingsverslag — vermelding 'geen audit of review'"]
    noot: "Bijzondere wettelijke verslagen (Boek 14 WVV — inbreng, omzetting, fusie, ontbinding) volgen meestal de **limited-assurance-logica** met eigen ITAA-modelverslagen — niet ISRE, niet ISA. Zie blok bijzondere mandaten verderop."

  - id: audit-cyclus
    type: mermaid
    titel: "Audit-cyclus — zes fases van opdracht tot archief"
    intro: "Lineair op het schema, iteratief in de praktijk: planning herziet zich op basis van bevindingen, afronding kan terugkomen op uitvoering. Voor uitwerking: [[aanvaarden-plannen-en-uitvoeren-van-een-audit]] (fases 1-3) + [[afronden-en-rapporteren-van-een-audit]] (fases 4-6)."
    mermaid_type: flowchart-lr
    code: |
      A[Aanvaarding<br/>ISA 210 + 220<br/>+ KB 1 maart 1998] --> B[Planning<br/>ISA 300 + 315 + 320<br/>materialiteit + risico]
      B --> C[Uitvoering<br/>ISA 330 + 500-580<br/>7 controlewerkzaamheden]
      C -.->|bevindingen herzien risico| B
      C --> D[Afronding<br/>ISA 450 + 540 + 560<br/>+ 570 + 580 + 720]
      D --> E[Verslag<br/>ISA 700 + 705 + 706<br/>+ ITAA-KMO §119-121]
      E --> F[Revisiedossier<br/>ISA 230 + Wet 7 dec 2016<br/>10 jaar bewaring]

  - id: audit-bewijs-flow
    type: mermaid
    titel: "Audit-bewijs — risico-gestuurde aanpak"
    intro: "Risico-inschatting (ISA 315) bepaalt strategie + materialiteit (ISA 300 + 320), die de aard, timing en omvang van de procedures (ISA 330 + 500-530) sturen. Procedures genereren bevindingen → evaluatie → oordeel. Voor uitwerking: [[aanvaarden-plannen-en-uitvoeren-van-een-audit]]."
    mermaid_type: flowchart-td
    code: |
      A[Kennisverwerving entiteit<br/>ISA 315 §13-37]
      A --> B[Risico-inschatting<br/>per bewering<br/>ISA 315 §A190]
      B --> C[Materialiteit<br/>ISA 320 §10-13<br/>door auditor]
      C --> D[Strategie + werkprogramma<br/>ISA 300]
      D --> E[Procedures<br/>ISA 330 + 500-530]
      E --> F{Voldoende +<br/>geschikt bewijs?}
      F -->|nee| G[Aanvullende werkzaamheden<br/>of scope-beperking]
      F -->|ja| H[Bevindingen accumuleren<br/>ISA 450]
      H --> I[Afronding + oordeel]
      G -.->|herzien risico| B

  - id: controlewerkzaamheden
    type: tabel-vergelijking
    titel: "Zeven controlewerkzaamheden — bewijskracht-rangorde"
    intro: "ISA 500 §A14-A25 — de gesloten lijst. Bewijskracht hangt af van bron (extern > intern), aard (direct > afgeleid) en wie de procedure uitvoert (auditor zelf > door derden). Examen-klassieker: 'noem er vier'. Voor uitwerking: [[aanvaarden-plannen-en-uitvoeren-van-een-audit]]."
    kolommen: ["Werkzaamheid", "Wat", "Bewijskracht", "Typische valkuil"]
    rijen:
      - ["**Externe bevestiging**", "Schriftelijk antwoord rechtstreeks aan auditor (bank, debiteur, advocaat, leverancier)", "**Zeer sterk** (extern + onafhankelijk + schriftelijk)", "Lage respons → alternatieve werkzaamheden ISA 505 §12 — niet automatisch voorbehoud"]
      - ["**Inspectie** stukken / activa", "Materiële vaststelling van boeken, contracten, fysieke activa", "**Sterk** voor bestaan; matig voor waardering", "Voorraadtelling (ISA 501) → bestaan ≠ waardering"]
      - ["**Observatie**", "Bijwonen van een procedure die anderen uitvoeren (telling, cyclische controle)", "**Beperkt** — alleen op moment van observatie", "Hawthorne-effect: gedrag verandert door observatie"]
      - ["**Herberekening**", "Auditor controleert zelf de wiskundige juistheid", "**Sterk** (door auditor zelf)", "Mechanisch — bewijst juistheid, niet volledigheid"]
      - ["**Opnieuw uitvoeren**", "Auditor herhaalt zelf een controle die door IC werd uitgevoerd", "**Sterk** voor IC-werking", "Steekproef-design bepaalt geldigheid"]
      - ["**Cijferanalyses**", "Vergelijking met budget, voorgaande periodes, sectorgemiddelden, ratio's", "**Matig** — vooral risico-detectie", "Globaal patroon mist micro-anomalieën"]
      - ["**Inlichtingen / inquiries**", "Vragen aan management of medewerkers", "**Zwak** — interne bron + niet-corroborerend", "Altijd corroboreren met ander bewijs"]
    noot: "Vuistregel rangorde: extern > intern; auditor zelf > door anderen; schriftelijk > mondeling; corroboratief > geïsoleerd. Bij conflicterend bewijs prevaleert de sterkere bron."

  - id: beslismatrix-oordeel
    type: mermaid
    titel: "Beslismatrix oordeel-types — materieel × diepgaand × type probleem"
    intro: "Twee assen (materieel? diepgaand?) × twee oorzaken (afwijking of scope-beperking) = vier oordeel-types. ISA 705 (herzien) + ITAA-KMO-controlenorm §119-121. Eén centrale beslissing — alle examen-vragen over voorbehoud, afkeurend of onthoudend oordeel volgen deze matrix. Voor uitwerking: [[afronden-en-rapporteren-van-een-audit]]."
    mermaid_type: flowchart-td
    code: |
      A{Voldoende geschikt<br/>bewijs verzameld?}
      A -->|nee = scope-beperking| B{Materieel?}
      A -->|ja = bewijs OK| C{Afwijking vastgesteld?}
      C -->|nee| D[Goedkeurend oordeel<br/>ISA 700]
      C -->|ja| E{Materieel?}
      B -->|nee| D
      B -->|ja| F{Diepgaand?}
      E -->|nee| D
      E -->|ja| G{Diepgaand?}
      F -->|nee| H[Voorbehoud<br/>scope-beperking<br/>ISA 705 §7]
      F -->|ja| I[Oordeelonthouding<br/>ISA 705 §9-10<br/>ITAA-KMO §121]
      G -->|nee| J[Voorbehoud<br/>afwijking<br/>ISA 705 §7 + §119]
      G -->|ja| K[Afkeurend oordeel<br/>ISA 705 §8]

  - id: bijzondere-mandaten
    type: tabel-vergelijking
    titel: "Bijzondere wettelijke verslagen — vergelijkings-kapstok"
    intro: "Vier verrichtings-types delen één patroon: opdrachtbrief → staat A&P door **bestuursorgaan** (niet interne boekhouder) → onderzoek door beroepsbeoefenaar met **beperkte zekerheid** → modelverslag met expliciete clausules. Zekerheidsniveau, doel en verplichte vermeldingen verschillen per verrichting. Voor uitwerking: [[bijzondere-wettelijke-verslagen-bij-vennootschapsverrichtingen]]."
    kolommen: ["Verrichting", "Wetbron WVV", "Wie staat A&P", "Zekerheid", "Kern-clausule modelverslag"]
    rijen:
      - ["**Inbreng in natura**", "art. 5:7 (BV) + 7:7 (NV)", "Bestuursorgaan", "**Limited assurance** (waardering)", "Geen overwaardering nettoactief + correspondentie tegenwaarde"]
      - ["**Quasi-inbreng**", "art. 5:8 + 7:8", "Bestuursorgaan", "Limited assurance", "Idem inbreng + transactie binnen 2 jaar na oprichting"]
      - ["**Omzetting** van rechtsvorm", "art. 14:3 + 14:5", "Bestuursorgaan (staat ≤ 3 maanden oud)", "Limited assurance op staat A&P", "Risico-clausule **hoofdelijke aansprakelijkheid bij overwaardering** + onderzoek volledigheid"]
      - ["**Fusie / splitsing**", "art. 12:1 e.v. + gemeenschappelijke IBR-ITAA-fusienorm", "Bestuursorganen alle betrokken vennootschappen", "Limited assurance", "Ruilverhouding pertinent + redelijk + correcte toelichting in fusievoorstel"]
      - ["**Ontbinding + vereffening**", "art. 2:71 + 2:80", "Bestuursorgaan (staat ≤ 3 maanden)", "Limited assurance + **discontinuïteits-waardering** (KB WVV art. 3:6 §2)", "Bevestiging volledigheid passiva + bij ontbinding-in-één-akte: alle schulden betaald of geconsigneerd"]
    noot: "**Privé- en gerechtelijke expertise** (1.6.taak.1.a + 1.6.taak.1.b) volgen een andere logica — geen wettelijke monopolie, tegenspraak-procedure, eindgebruiker is de partij of de rechter. Geen examen-zwaarte; vermelding volstaat."

  - id: bedreigingen-kader
    type: mermaid
    titel: "IESBA bedreigingen-kader — vijf categorieën + cyclus"
    intro: "Per opdracht: identificeer bedreigingen → evalueer (significant?) → safeguard of weiger. Naast IESBA werken in België ook KB 1 maart 1998 art. 9 (onverenigbare functies — absoluut verbod) en ISQM 1/2 (kwaliteitsmanagement). Voor uitwerking: [[onafhankelijkheid-en-deontologie-bij-controleopdrachten]]."
    mermaid_type: flowchart-td
    code: |
      A[Opdracht in zicht] --> B[Identificeer bedreigingen]
      B --> C1[Eigenbelang<br/>self-interest<br/>financiële belang]
      B --> C2[Zelf-toetsing<br/>self-review<br/>eigen werk toetsen]
      B --> C3[Belangenbehartiging<br/>advocacy<br/>cliënt verdedigen]
      B --> C4[Vertrouwdheid<br/>familiarity<br/>te lange relatie]
      B --> C5[Intimidatie<br/>intimidation<br/>druk of dreiging]
      C1 --> D{Significant?}
      C2 --> D
      C3 --> D
      C4 --> D
      C5 --> D
      D -->|nee| E[Aanvaarden +<br/>documenteren]
      D -->|ja| F{Safeguard mogelijk?}
      F -->|ja| G[Safeguards toepassen<br/>EQR · partner-rotatie ·<br/>second opinion · scheiding teams]
      F -->|nee| H[Weigeren of<br/>beëindigen]
      G --> E
      I[KB 1 maart 1998 art. 9<br/>onverenigbare functies] -.->|absoluut verbod| H

# ---------------------------------------------------------------------------
# Verplichte sectie: VALKUILEN (7 — overgenomen + scherp geformuleerd
# uit de valkuilen-secties van de vijf leerstukken)
# ---------------------------------------------------------------------------

valkuilen:
  titel: "Klassieke valkuilen"
  format: tabel
  rijen:
    - valkuil: "Lage respons confirmaties = automatisch voorbehoud"
      wat_klopt_niet: "Stagiairs concluderen meteen tot scope-beperking bij respons onder 80 %"
      wat_klopt_wel: "ISA 505 §12 verplicht **alternatieve werkzaamheden** (subsequent receipts, verzendingsdocumenten, contract-inspectie). Pas als die ook geen bewijs leveren én de post materieel is, ontstaat een scope-beperking — en zelfs dan eerst diepgaand-toets vóór voorbehoud."

    - valkuil: "Materialiteit door KB of door de algemene vergadering"
      wat_klopt_niet: "Verwarring met andere drempels die wel wettelijk zijn vastgelegd (controleplicht-drempels WVV art. 1:26)"
      wat_klopt_wel: "Materialiteit wordt door de **auditor zelf** vastgesteld (ISA 320). Vuistregels 0,5-1 % omzet · 1-2 % activa · 5-10 % resultaat vóór belastingen. Vastgelegd in werkprogramma en herzien bij significante wijziging."

    - valkuil: "Staat A&P opgemaakt door de interne boekhouder voor een bijzonder mandaat"
      wat_klopt_niet: "Interne boekhouder is goed met cijfers — lijkt logisch dat hij ook de staat A&P maakt"
      wat_klopt_wel: "De staat A&P moet door het **bestuursorgaan** worden opgemaakt en ondertekend. Interne boekhouder is geen bestuursorgaan. Werken op proef- en saldibalans = niet aanvaardbaar voor bijzonder mandaat — beroepsbeoefenaar moet weigeren of bestuursorgaan tot opmaak verplichten."

    - valkuil: "Oordeelonthouding gelijkstellen aan afkeurend oordeel"
      wat_klopt_niet: "Beide zijn 'slecht nieuws' — oogt vergelijkbaar"
      wat_klopt_wel: "**Onthouding** = de auditor heeft **onvoldoende bewijs** om een oordeel te vormen (scope-beperking materieel + diepgaand). **Afkeurend** = de auditor heeft **wel bewijs** en de jaarrekening geeft geen getrouw beeld (afwijking materieel + diepgaand). Geen informatie ≠ verkeerde informatie."

    - valkuil: "Vergeten dat de termijn ter beschikking 15 dagen is bij bijzondere mandaten"
      wat_klopt_niet: "Stagiair denkt dat het verslag pas op de AV-zitting beschikbaar moet zijn"
      wat_klopt_wel: "Het bijzonder verslag + onderliggende staat moeten **15 dagen vóór de AV** ter beschikking liggen van de vennoten op de zetel — bij omzetting, ontbinding én fusie. Niet-naleving = AV-besluit aanvechtbaar."

    - valkuil: "Bewijswaarde van mondelinge management-inlichtingen overschatten"
      wat_klopt_niet: "Management is dichtbij de cijfers — kennis = bewijs"
      wat_klopt_wel: "Inlichtingen zijn de **zwakste** bewijsbron. Altijd **corroboreren** met extern of objectief bewijs. Lawyer's letter (ISA 580) en management-letter (ISA 580) zijn uitzonderingen: schriftelijk + ondertekend door management/advocaat verhoogt bewijskracht maar vervangt geen externe confirmatie."

    - valkuil: "Onafhankelijkheid evalueren bij aanvaarding en daarna vergeten"
      wat_klopt_niet: "Eén check bij opdrachtbrief volstaat"
      wat_klopt_wel: "Onafhankelijkheid moet **doorlopend** worden gemonitord (ISA 220 herzien + ISQM 1). Nieuwe omstandigheden (familielid in bestuur, lening bij cliënt, andere opdracht door zelfde partner) kunnen een nieuwe bedreiging opwerpen. Herziening bij elke fase + EQR voor OOB-opdrachten."


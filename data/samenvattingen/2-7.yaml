# Samenvatting-script — PO 2.7 Regionale en lokale belastingen
#
# Kader-PO met sterke procedure-component. Strakke samenvatting met
# bevoegdheidsdriehoek + drie types gewest-heffing + drie hefbomen
# gemeente + wettigheidstoets + bezwaarroute + termijntabel.
# Vermijdt cijferdetails (Cijferzakboekje + tarief-records dragen die).
#
# Drie kritische wets-correcties (al gepatched in L4-render + voorbeeldgroep):
#   - Federale bezwaartermijn = 1 jaar (WIB92 art. 371), NIET 6 maanden
#   - Brusselse Codex art. 100 = 186 dagen vanaf 7de dag (NIET 3 maanden)
#   - Waals decreet = art. 25 + 25bis (NIET art. 28)
#
# Status: eerste-versie samenvatting POC, op basis van vijf gerenderde
# leerstukken (NIET op basis van eerdere themafiches — die migreren niet).

meta:
  slug: "2-7"
  titel: "Regionale en lokale belastingen"
  po: "2.7"
  beschrijving: "PO-samenvatting (geheugen-kapstok): bevoegdheidsdriehoek federaal-gewest-lokaal, drie types gewestelijke heffing, drie hefbomen gemeente, wettigheidstoets in 4 criteria, bezwaarroute-beslisboom en termijntabel — printbaar op 3-4 A4."
  explorer_title: "6. Samenvatting"
  print_a4: 3

intro:
  callout_beat: >
    Kader-PO over wie wat mag heffen — niet over tarieven. Deze samenvatting
    bundelt de bevoegdheidsdriehoek, de drie types gewest-heffing, de drie
    hefbomen lokaal, de wettigheidstoets in vier criteria en de
    bezwaarroute-beslisboom met termijntabel. Voor verhaal en routekaart:
    minicursus PO 2.7. Voor inhoudelijke tarieven: PO 2.1 (PB), PO 2.6
    (erf + schenking), PO 2.5 (federale procedure).

# ---------------------------------------------------------------------------
# Verplichte sectie 1: TAKE-AWAY (5-6 scherpe bullets — zaken die NIET in
# een tabel verderop af te lezen zijn)
# ---------------------------------------------------------------------------

take_away:
  titel: "Take-away — wat je écht moet weten"
  bullets:
    - "**Bevoegdheid is altijd per heffing, nooit per persoon.** Eén cliënt kan voor de ene heffing Vlaams zijn en voor de andere Waals — elk feit heeft een eigen aanknopingspunt (woonplaats schenker, ligging perceel, titularis voertuig, ...). Reflex 'Vlaamse cliënt = Vlaamse fiscaliteit voor alles' is fout."
    - "**Overgedragen ≠ autonoom.** Bij een overgedragen heffing ligt het belastbaar feit federaal vast (BFW) en kiest het gewest enkel tarief + vrijstellingen. Bij een autonome heffing kiest het gewest alles — andere drempels, andere grondslag, niet transponeerbaar tussen gewesten."
    - "**Aanvullende belasting ≠ opcentiem.** Aanvullende = procentuele opslag op een eindaanslag (gemeentebelasting PB). Opcentiem = vermenigvuldigingsfactor op een basistarief (gemeente-OV). Twee verschillende mechanismen, twee verschillende procedures, vaak verward in de volksmond — examen-favoriet."
    - "**Wettigheidstoets = 4 opeenvolgende hekken.** Eén faal volstaat: formele wettigheid (raad bevoegd? bekendmaking? geldigheidsduur?) → materiële bevoegdheid (territoriaal + geen federale/gewestelijke materie) → algemene rechtsbeginselen (gelijkheid + proportionaliteit + non-bis-in-idem) → procedureregels. Hoog tarief op zich is geen wettigheidsgrond."
    - "**Termijnen verschillen drastisch per loket.** Verkeerd geadresseerd bezwaar = verlies van termijn, ongeacht inhoudelijke kracht. Bij elk biljet eerst: welke administratie? Daarna: welke termijn?"
    - "**Vernietigingsberoep RvS ≠ individueel bezwaar.** Twee parallelle routes: bezwaar college B&S binnen 3 maanden treft één aanslag; vernietigingsberoep Raad van State binnen 60 dagen vanaf bekendmaking treft het hele reglement (en alle aanslagen die erop steunen)."

# ---------------------------------------------------------------------------
# Optionele extra blokken — volgorde = render-volgorde
# ---------------------------------------------------------------------------

extra_blokken:

  - id: bevoegdheidsdriehoek
    type: mermaid
    titel: "Bevoegdheidsdriehoek — wie heft op welke grondwetsbasis?"
    intro: "Vier niveaus, vier paragrafen van Grondwet art. 170, vier norm-instrumenten. Strakke hiërarchie: wet > decreet/ordonnantie > belastingreglement. Voor inhoud: zie [[wat-zijn-regionale-en-lokale-belastingen]]."
    mermaid_type: flowchart-td
    code: |
      F[Federaal<br/>PB · VenB · BTW · accijnzen<br/>GW art. 170 §1 — wet]
      G1[Vlaams Gewest<br/>VCF — Vlabel]
      G2[Brussels Hoofdstedelijk Gewest<br/>Brusselse Codex Fiscale Procedure]
      G3[Waals Gewest<br/>Décret 6.5.1999 — SPW Fiscalité]
      P[Provincie<br/>opcentiemen OV · eigen heffingen<br/>GW art. 170 §3 — provinciereglement]
      M[Gemeente<br/>aanvullende PB · opcentiemen OV · sui generis<br/>GW art. 170 §4 — gemeentereglement]
      F -->|BFW art. 3| G1
      F -->|BFW art. 3| G2
      F -->|BFW art. 3| G3
      G1 --> P
      G1 --> M
      G2 --> M
      G3 --> P
      G3 --> M

  - id: drie-types-gewestelijke-heffing
    type: tabel-vergelijking
    titel: "Drie types gewestelijke heffing — wie bepaalt wat?"
    intro: "Scharniervraag bij elke gewest-heffing: tot welke categorie hoort ze? Die ene keuze bepaalt of een tariefverschil tussen Vlaanderen/Brussel/Wallonië 'normaal' is (overgedragen — federale grondslag blijft) of fundamenteel (autonoom — alles kan verschillen)."
    kolommen: ["Type", "Wie bepaalt belastbaar feit?", "Wie bepaalt tarief + vrijstellingen?", "Hoofdvoorbeelden"]
    rijen:
      - ["**Overgedragen**", "Federaal (verankerd in BFW)", "Gewest", "Onroerende voorheffing · verkeer · BIV · registratie- en erfbelasting"]
      - ["**Aanvullend op federale PB**", "Federaal (PB-grondslag uniform)", "Gewest kiest opcentiem of korting op gewest-aandeel", "Gewestelijke opcentiemen PB · woonbonus (Vl, uitdovend) · chèque habitat (W)"]
      - ["**Autonoom**", "Gewest (eigen materie, geen federaal equivalent)", "Gewest", "Leegstandsheffing bedrijfsruimten (Vl) · planbatenheffing (Vl) · leegstandsheffing woningen (Br/W)"]
    noot: "Diepte per heffing + drie-gewesten-vergelijking: [[gewestelijke-heffingen-overgedragen-en-autonoom]]. Concrete tarieven via Cijferzakboekje 2026."

  - id: drie-hefbomen-gemeente
    type: tabel-vergelijking
    titel: "Drie hefbomen gemeente — hoe wordt lokaal geld opgehaald?"
    intro: "Gemeenten en provincies hebben een **algemene** bevoegdheid (alles tenzij), niet een gelijste zoals het gewest. Binnen die ruimte werken drie technieken naast elkaar. Voor diepte: [[gemeente-en-provinciebelastingen]]."
    kolommen: ["Hefboom", "Mechaniek", "Grondslag", "Voorbeeld kustgemeente"]
    rijen:
      - ["**Aanvullende gemeentebelasting PB**", "Procentuele opslag op de federale PB-aanslag van inwoners", "Hoofdsom PB (gezamenlijk belaste inkomsten) — afzonderlijk belaste roerende inkomsten tellen NIET mee", "6-9 % typisch; gemiddelde ~7 %"]
      - ["**Opcentiemen onroerende voorheffing**", "Vermenigvuldigingsfactor op de basis-OV (gewest-tarief × geïndexeerd KI)", "Geïndexeerd kadastraal inkomen", "950 gemeente + 300 provincie → factor (1 + 12,5) = 13,5 × basis-OV"]
      - ["**Sui-generis-belasting**", "Eigen heffing op een eigen belastbaar feit, vastgesteld bij raadsbeslissing", "Vast door reglement (forfaitair of progressief)", "Tweede verblijven 1.250 EUR/jaar · honden progressief · terrassen 45 EUR/m²"]
    noot: "Sui-generis ≠ willekeur. Vier grenzen blijven gelden: territoriaal binnen gemeente · geen federale/gewestelijke materie · algemene rechtsbeginselen · procedureregels. Zie wettigheidstoets hieronder."

  - id: opcentiemen-formule
    type: tabellen-en-formules
    titel: "Opcentiemen-formule — vaak verkeerd uitgerekend"
    sub_blokken:

      - type: formule
        sub_titel: "Onroerende voorheffing — totaal met opcentiemen"
        beschrijving: "**Opcentiemen zijn vermenigvuldigers, geen procentopslagen.** 1.000 opcentiemen = factor 11 (1 + 1000/100), NIET 10. 950 gemeente + 300 provincie geeft factor (1 + 12,5) = 13,5 × basis-OV. Klassieke examenval bij snelle berekening."
        formule: "\\text{OV-totaal} = \\text{KI}_{\\text{geïndexeerd}} \\times t_{\\text{gewest}} \\times \\left(1 + \\frac{\\text{opc.}_{\\text{gem}} + \\text{opc.}_{\\text{prov}}}{100}\\right)"

      - type: tabel-inline
        sub_titel: "Basis-OV-tarief per gewest"
        kolommen: ["Gewest", "Basistarief", "Typische gemeente-opcentiemen", "Provincie-opcentiemen"]
        rijen:
          - ["Vlaanderen", "3,97 %", "700-2.500", "Geplafonneerd sinds 2018"]
          - ["Brussel", "1,25 %", "2.000-3.500 (vaak hoger dan Vl)", "Geen — Brussel heeft geen provincies"]
          - ["Wallonië", "1,25 %", "1.000-3.000", "Nog vrij vastgesteld"]
        noot: "Lager basistarief Brussel/Wallonië wordt vaak gecompenseerd door hogere opcentiemen — vergelijken zonder gemeente-cijfer is altijd te vroeg. Actuele cijfers via Cijferzakboekje 2026."

  - id: wettigheidstoets
    type: mermaid
    titel: "Wettigheidstoets gemeente- of provinciereglement — vier hekken"
    intro: "Examen-favoriet. Vier opeenvolgende criteria, één faal = nietigheid (van reglement of aanslag). Voor uitwerking + toepassing op kustgemeente-mock-reglementen: [[gemeente-en-provinciebelastingen]]."
    mermaid_type: flowchart-td
    code: |
      A[Reglement of aanslag voorgelegd]
      A --> B{1. Formele wettigheid<br/>raad bevoegd?<br/>bekendmaking correct?<br/>geldigheidsduur?}
      B -->|nee| F[Nietig]
      B -->|ja| C{2. Materiële bevoegdheid<br/>territoriaal binnen gemeente?<br/>geen federale/gewestelijke materie?<br/>fiscale autonomie hoger niveau gerespecteerd?}
      C -->|nee| F
      C -->|ja| D{3. Algemene rechtsbeginselen<br/>gelijkheid + non-discriminatie?<br/>proportionaliteit?<br/>willekeur?<br/>non-bis-in-idem?}
      D -->|nee| F
      D -->|ja| E{4. Procedureregels<br/>aanslagbiljet volledig?<br/>termijn aanslag gerespecteerd?<br/>hoorrecht?}
      E -->|nee| F
      E -->|ja| G[Rechtsgeldig]

  - id: bezwaarroute-beslisboom
    type: mermaid
    titel: "Bezwaarroute-beslisboom — waar dien ik in?"
    intro: "Eerste reflex bij elk fiscaal geschil: welke administratie? Pas daarna: welke termijn? Verkeerd geadresseerd = onontvankelijk, hoe sterk de inhoud ook is. Voor uitwerking per route: [[procedure-gewest-en-gemeente]]."
    mermaid_type: flowchart-td
    code: |
      A[Welk soort heffing?]
      A -->|Federale rijksbelasting<br/>PB · VenB · BTW| B1[Adviseur-generaal AAFisc<br/>termijn 1 jaar]
      A -->|Gewestelijk| B2{Welk gewest?}
      A -->|Lokaal<br/>gemeente of provincie| B3[College B&S of Deputatie<br/>termijn 3 mnd]
      B2 -->|Vlaams| C1[Vlabel<br/>termijn 3 mnd]
      B2 -->|Brussels| C2[Bruxelles Fiscalité<br/>termijn 186 dagen]
      B2 -->|Waals| C3[SPW Fiscalité / Walfin<br/>termijn 6 mnd]
      C1 --> D[Fiscale rechtbank<br/>eerste aanleg — fiscale kamer]
      C2 --> D
      C3 --> D
      B3 --> D
      A -.->|Reglement zelf<br/>aanvechten| R[Raad van State<br/>60 dagen na bekendmaking]

  - id: termijntabel
    type: tabellen-en-formules
    titel: "Termijntabel bezwaar — uit het hoofd voor het examen"
    sub_blokken:

      - type: tabel-inline
        sub_titel: "Per heffing — instantie + termijn + startpunt"
        kolommen: ["Heffing", "Bezwaarinstantie", "Termijn", "Startpunt"]
        rijen:
          - ["**Federale** PB · VenB · BTW", "Adviseur-generaal AAFisc", "**1 jaar**", "3de werkdag na verzending aanslagbiljet (WIB92 art. 371)"]
          - ["**Vlaamse** gewestbelasting (OV · verkeer · BIV · erf · registratie · leegstand · planbaten)", "Vlabel", "**3 maanden**", "3de werkdag na verzending aanslagbiljet (VCF art. 3.5.2.0.1)"]
          - ["**Brusselse** gewestbelasting", "Bruxelles Fiscalité", "**186 dagen**", "7de dag na verzending aanslagbiljet (Brusselse Codex art. 100)"]
          - ["**Waalse** gewestbelasting", "SPW Fiscalité (Walfin)", "**6 maanden**", "Datum uitwerking kennisgeving (Décret 6.5.1999 art. 25)"]
          - ["**Gemeentebelasting** (sui generis · aanvullende · opcentiemen)", "College van burgemeester en schepenen", "**3 maanden**", "3de werkdag na verzending aanslagbiljet"]
          - ["**Provinciebelasting**", "Bestendige Deputatie", "**3 maanden**", "3de werkdag na verzending aanslagbiljet"]
          - ["**Reglement zelf** (vernietigingsberoep)", "Raad van State — Afdeling Bestuursrechtspraak", "**60 dagen**", "Bekendmaking reglement"]
          - ["**Beroep tegen bezwaar-beslissing**", "Rechtbank van eerste aanleg — fiscale kamer", "**3 maanden** OF stilzitten **18 mnd**", "Kennisgeving administratieve beslissing"]
        noot: "Atypische punten: federale termijn = 1 JAAR (niet 6 mnd). Brussel = 186 DAGEN vanaf 7de dag (niet 3 maanden — al lijkt het qua omvang dicht bij 6 maanden, het startpunt is anders). Wallonië = 6 maanden, twee keer zo lang als Vlabel. Bij Waals bezwaar dekt één indiening ambtswege ook supplementen op dezelfde betwiste bestanddelen (Décret art. 25bis)."

      - type: tabel-inline
        sub_titel: "Lokalisatie-aanknopingspunten per heffing"
        kolommen: ["Heffing", "Aanknopingspunt"]
        rijen:
          - ["Personenbelasting + aanvullende gemeentebelasting PB", "Fiscale woonplaats op 1 januari aanslagjaar"]
          - ["Onroerende voorheffing + opcentiemen", "Ligging van het onroerend goed"]
          - ["Verkeersbelasting + BIV", "Woonplaats titularis-inschrijver voertuig"]
          - ["Erfbelasting", "Laatste fiscale woonplaats overledene — **vijfjaarsregel**: bij verhuis in 5 jaar vóór overlijden geldt het gewest waar de overledene het **langst** woonde in die periode"]
          - ["Schenkbelasting onroerend goed", "Fiscale woonplaats **schenker** op datum schenking (NIET ontvanger)"]
          - ["Sui-generis gemeentebelasting", "Grondgebied waar belastbaar feit zich voordoet"]
        noot: "Eén cliënt, meerdere gewesten + meerdere gemeenten: regel. Bij elke heffing apart lokaliseren. Voor synthese-cases: [[geintegreerd-advies-bij-vestigingskeuze-en-vermogenstransfer]]."

# ---------------------------------------------------------------------------
# Verplichte sectie: VALKUILEN (6 — overgenomen uit valkuilen-secties van
# de vijf leerstukken, scherp geformuleerd op samenvattings-niveau)
# ---------------------------------------------------------------------------

valkuilen:
  titel: "Klassieke valkuilen"
  format: tabel
  rijen:
    - valkuil: "Federale bezwaartermijn '6 maanden' inroepen"
      wat_klopt_niet: "Een biljet PB/VenB hanteert geen 6-maanden-termijn"
      wat_klopt_wel: "**1 jaar** vanaf 3de werkdag na verzending (WIB92 art. 371). De 6 mnd is de Waalse gewest-termijn — verwar ze niet."
    - valkuil: "Brusselse termijn invullen als '3 maanden' of '6 maanden'"
      wat_klopt_niet: "Geen van beide klopt — Brussel heeft een atypische dagen-termijn"
      wat_klopt_wel: "**186 dagen** vanaf 7de dag na verzending (Brusselse Codex art. 100). Reken dagen, niet maanden, bij krappe marges."
    - valkuil: "Opcentiemen × 1 % toepassen"
      wat_klopt_niet: "1.000 opcentiemen ≠ 1.000 % opslag bovenop de basis op een factor 10 manier"
      wat_klopt_wel: "Factor = 1 + (opcentiemen / 100). 1.000 opcentiemen → ×11. 950 → ×10,5. 950 gem + 300 prov → ×13,5."
    - valkuil: "Individueel bezwaar = vernietigingsberoep"
      wat_klopt_niet: "Twee parallelle routes worden door elkaar gehaald"
      wat_klopt_wel: "Bezwaar college B&S (3 mnd) treft één aanslag; vernietigingsberoep RvS (60 dgn vanaf bekendmaking) treft heel het reglement. Andere instantie, andere termijn, ander effect."
    - valkuil: "Aanvullende belasting PB = autonome gewestbelasting"
      wat_klopt_niet: "Gewest 'kiest een eigen tarief op de PB' wordt verkeerd geïnterpreteerd als eigen belasting"
      wat_klopt_wel: "Aanvullende gewestelijke PB = opslag op een **federale** PB-aanslag — federale grondslag blijft, gewest kiest enkel opcentiem of korting binnen de gewestelijke schijf."
    - valkuil: "5-jaarsregel erfbelasting toepassen op 'gewest waar overledene laatst woonde'"
      wat_klopt_niet: "Bij verhuis kort vóór overlijden geldt niet het laatste gewest"
      wat_klopt_wel: "Bevoegd gewest = waar de overledene het **langst** woonde in de 5 jaar vóór het overlijden (BFW art. 5 §2). Schenkbelasting onroerend goed daarentegen volgt de **schenker**, niet de ontvanger."


  - type: competentie
    competentie_id: documenteren-auditdossier

  - type: thematisch
    titel: "Kwaliteitsbeheersing rond het auditdossier: kantoor, opdracht en review"
    concepten:
      - controledocumentatie
      - kwaliteitsbeheersing-opdrachtniveau

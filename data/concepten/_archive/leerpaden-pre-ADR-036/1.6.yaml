  - type: thematisch
    titel: "Communicatie met management, governance en de brug naar interne controle (PO 1.7)"
    concepten:
      - communicatie-met-management-governance
      - communicatie-tekortkomingen-interne-beheersing

  - type: competentie
    competentie_id: toepassen-professional-skepticism-en-deontologie-audit

  - type: thematisch
    titel: "Antiwitwas- en tuchtrechtelijk kader rond de externe controle"
    concepten:
      - antiwitwasmeldingsplicht-accountant
      - tuchtrechtelijke-aansprakelijkheid-accountant
      - beroepsaansprakelijkheid-accountant

  - type: oriëntatie
    titel: "Reflectie: kwaliteitscontrole, beroepsaansprakelijkheid en het levende beroep"
    rationale_hint: >-
      Sluit af met een korte reflectie op wat een audit-opdracht na de
      handtekening nog kan opleveren: ITAA-kwaliteitscontrole op
      opdrachtniveau (records kwaliteitsbeheersing-opdrachtniveau en
      opdrachtgerichte-kwaliteitsbeoordeling) en de civiele,
      strafrechtelijke en tuchtrechtelijke beroepsaansprakelijkheid van
      de accountant bij nalatigheid of onafhankelijkheidsbreuken (records
      beroepsaansprakelijkheid-accountant en
      tuchtrechtelijke-aansprakelijkheid-accountant). Verbind met
      onafhankelijkheid-externe-accountant, belangenconflict-accountant
      en beroepsgeheim-accountant uit het skepticism-hoofdstuk:
      deontologie is geen losse laag bovenop het werk, maar de manier
      waarop de auditor zijn oordeel beschermt. Maak de overstap naar
      PO 1.7 (interne controle) door op te merken dat de externe auditor
      stéunt op een goed werkende interne beheersing — vandaar de
      verplichte communicatie van tekortkomingen
      (communicatie-tekortkomingen-interne-beheersing) en het potentieel
      gebruik van het werk van interne auditors
      (gebruik-werk-interne-auditors-audit). Ook PO 1.4 (consolidatie) en
      PO 1.3 (analyse) lopen via dezelfde auditcyclus, alleen met andere
      risicoprofielen.


programmaonderdeel: "1.6"
titel: "Externe controle — Bedrijfsrevisor / Gecertificeerd accountant"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Waarom externe controle? Stakeholders, vertrouwen en de assurance-keten"
    rationale_hint: >-
      Vertrek vanuit het idee dat een jaarrekening pas economisch betekenis
      krijgt als een onafhankelijke derde haar bevestigt: zonder externe
      controle kunnen aandeelhouders, schuldeisers, werknemers, fiscus en
      NBB de cijfers niet vertrouwen. Verbind 'getrouw beeld' en
      'regelmatigheid' als controlecriteria met de stakeholders die er
      belang bij hebben (uit de records getrouw-beeld-controle en
      regelmatigheid-jaarrekening-audit). Maak duidelijk dat externe
      controle een gelaagd vakgebied is — niet één opdrachttype, maar een
      spectrum van zekerheidsniveaus (audit met redelijke-mate-van-zekerheid,
      review met beperkte-mate-van-zekerheid, samenstelling zonder
      zekerheid) — en dat de stagiair leert redeneren van opdrachttype
      naar werkprogramma naar oordeel. Verwijs naar de actoren
      bedrijfsrevisor en gecertificeerd-accountant-ga uit de records: wie
      mag wat doen, en onder welke norm. Plaats externe controle expliciet
      tegenover interne controle (PO 1.7): de externe auditor stéunt op
      een goed werkende interne beheersing maar vervangt ze niet — die
      brug komt verderop in de risico-inschatting en de
      tekortkomingen-communicatie terug.

  - type: thematisch
    titel: "Wettelijk kader en normenhiërarchie: Wet ITAA, KB plichtenleer, ITAA-normen, ISA en IESBA"
    concepten:
      - algemene-controlenorm-accountant
      - kmo-controlenorm-accountant
      - iesba-code-of-ethics
      - wettelijke-controleopdracht-commissaris
      - contractuele-controleopdracht
      - contractuele-beoordelingsopdracht

  - type: thematisch
    titel: "Actoren in de externe controle: wie mag wat?"
    concepten:
      - bedrijfsrevisor
      - gecertificeerd-accountant-ga
      - gedeelde-wettelijk-voorbehouden-opdracht
      - met-governance-belaste-personen
      - kleine-vennootschap
      - public-interest-entity

  - type: synthese
    synthese_id: opdrachttypes-zekerheidsniveaus-synthese
    rationale_hint: >-
      Plaats deze synthese vroeg als visuele kapstok over het hele
      programmaonderdeel: het spectrum audit (redelijke-mate-van-zekerheid)
      → review (beperkte-mate-van-zekerheid) → ISRS 4410 samenstelling
      (geen zekerheid) → due diligence en bijzondere opdrachten. De
      student ziet meteen welke opdrachttypes bestaan, welk
      zekerheidsniveau eraan vasthangt en welk soort verslag eruit volgt.
      Verbind expliciet redelijke-mate-van-zekerheid met
      beperkte-mate-van-zekerheid (positieve versus negatieve conclusie-
      formulering) en met beoordelingsverslag-elementen — verderop in het
      leerpad wordt de audit-route uitgediept; de review- en
      samenstellingsroute zijn hier vooral kader.

  - type: thematisch
    titel: "Zekerheidsniveaus en alternatieve opdrachttypes: review en samenstelling"
    concepten:
      - redelijke-mate-van-zekerheid
      - beperkte-mate-van-zekerheid
      - samenstellingsopdracht
      - beoordelingsverslag-elementen

  - type: thematisch
    titel: "Bijzondere wettelijk voorbehouden opdrachten"
    concepten:
      - ontbinding-vereffening-opdracht
      - fusie-splitsing-controleopdracht
      - omzetting-vennootschap-opdracht
      - effectennorm-opdracht
      - gerechtelijke-en-private-expertise
      - wettelijke-verklaring-gecertificeerd-accountant

  - type: competentie
    competentie_id: aanvaarden-audit-opdracht

  - type: synthese
    synthese_id: auditcyclus-fasen-synthese
    rationale_hint: >-
      Na de aanvaardingsfase plaatst deze synthese de vier fasen van de
      audit naast elkaar: aanvaarding → planning + risico-inschatting →
      uitvoering + assurance-informatie → conclusie + verslag. De
      vergelijkingstabel toont per fase doel, kern-output en
      norm-referentie (kmo-controlenorm-accountant +
      algemene-controlenorm-accountant); de Mermaid-flowchart maakt de
      iteratieve aard expliciet (nieuwe risico's tijdens uitvoering kunnen
      de planning hertriggeren). Dit hoofdstuk is de procedurele kaart
      voor de zes competenties die hierop volgen.

  - type: competentie
    competentie_id: verwerven-kennis-van-clientonderneming-audit

  - type: competentie
    competentie_id: uitvoeren-risico-inschatting-en-materialiteit-audit

  - type: thematisch

programmaonderdeel: "1.4"
titel: "Geconsolideerde jaarrekening en wetgeving betreffende de geconsolideerde jaarrekening"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Wat is consolideren? Waarom een geconsolideerde jaarrekening?"
    rationale_hint: >-
      Vertrek vanuit de groep-fictie en de economische realiteit van een
      moedervennootschap die via dochterondernemingen handelt: de
      enkelvoudige jaarrekening van de moeder geeft die economische realiteit
      onvolledig weer, vandaar de geconsolideerde-jaarrekening als
      voorstelling 'alsof het geheel één vennootschap was'. Verbind dit met
      het beschermingsdoel voor derden (aandeelhouders, schuldeisers,
      werknemers) waaruit de consolidatieverplichting voortvloeit. Verwijs
      naar de begrippen consolidatiekring, moedervennootschap,
      dochteronderneming en controle als bouwstenen die verderop in het
      leerpad uitgewerkt worden.

  - type: thematisch
    titel: "Het fundamentele begrippenkader: controle en de actoren in een groep"
    concepten:
      - controle
      - moedervennootschap
      - dochteronderneming
      - exclusieve-controle
      - gezamenlijke-controle
      - invloed-van-betekenis
      - geassocieerde-onderneming
      - gemeenschappelijke-dochteronderneming

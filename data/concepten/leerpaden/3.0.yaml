  - type: synthese
    synthese_id: insolventietriage-beslisboom
    rationale_hint: >-
      Beslisboom voor de accountant die continuïteitsproblemen vaststelt:
      van symptoom (cash-flow-probleem, opeisbare schulden niet meer
      kunnen voldoen) naar maatregel — alarmbelprocedure (intern),
      buitengerechtelijk minnelijk akkoord (bilaterale onderhandeling),
      besloten voorbereiding faillissement (pre-pack), gerechtelijke
      reorganisatie minnelijk akkoord, gerechtelijke reorganisatie
      collectief akkoord, gerechtelijke reorganisatie overdracht onder
      gerechtelijk gezag, faillietverklaring. Per maatregel: wanneer
      passend, welke drempel, welke rol accountant.

  - type: synthese
    synthese_id: gerechtelijke-reorganisatie-varianten-vergelijking
    rationale_hint: >-
      De drie varianten van gerechtelijke reorganisatie naast elkaar:
      minnelijk akkoord (bilateraal met geselecteerde schuldeisers),
      collectief akkoord (reorganisatieplan met stemming door alle
      schuldeisers en homologatie), en overdracht onder gerechtelijk
      gezag (verkoop van de onderneming of een onderdeel ervan).
      Per variant: doel, drempel, schuldeiserspositie, gevolg voor
      continuïteit van de juridische entiteit. Examenkritisch.

  - type: voorbereiding
    titel: "Taak 1 — Begeleiding bij oprichting van een vennootschap"
    rationale_hint: >-
      Concretisering 1 van het examenprogramma: de accountant
      begeleidt de oprichting. De stagiair moet de oprichtingscyclus
      van A tot Z kunnen ophangen aan de juiste juridische en
      boekhoudkundige instrumenten — vennootschapsvormkeuze,
      financieel plan, inbrengverslag, oprichtingsakte, openingsbalans,
      KBO-registratie — en de bijhorende aansprakelijkheidsrisico's
      (oprichtersaansprakelijkheid, kennelijk-ontoereikend aanvangs-
      vermogen) onderkennen. Volgt het stappenplan in
      `oprichtingsproces-stappenplan`.
    concepten:
      - financieel-plan-oprichting

  - type: synthese
    synthese_id: oprichtingsproces-stappenplan
    rationale_hint: >-
      Stappenplan-synthese die het examenprogramma-onderdeel 'oprichting'
      ophangt aan een tijdslijn: (1) keuze vennootschapsvorm, (2)
      opstelling financieel plan, (3) inbreng + waardering, (4)
      oprichtingsakte (notarieel voor kapitaalvennootschappen,
      onderhands voor maatschap), (5) publicatie en KBO-registratie,
      (6) openingsbalans. Per stap: welk verslag of mandaat door de
      accountant.

  - type: competentie
    competentie_id: opstellen-financieel-plan-oprichting
  - type: competentie
    competentie_id: voorbereiden-oprichtingsakte
  - type: competentie
    competentie_id: begeleiden-inbreng-bij-oprichting
  - type: competentie
    competentie_id: opstellen-openingsbalans-vennootschap
  - type: competentie
    competentie_id: begeleiden-registratie-onderneming-kbo
  - type: competentie
    competentie_id: signaleren-oprichtersaansprakelijkheid-risico

  - type: voorbereiding
    titel: "Taak 2 — Advies bij overdracht, overname of ontbinding"
    rationale_hint: >-
      Concretisering 2 van het examenprogramma: de accountant adviseert
      bij overdracht (share deal of asset deal), overname (due diligence,
      waardering, closing) of ontbinding (vrijwillig of gerechtelijk,
      klassiek of in-één-akte). Cruciaal: weten welke route past bij
      welke situatie (synthese exit-routes), welke rol de accountant
      neemt (mandaat versus advies) en welk verslag of attest hij
      uitbrengt. Bij deze taak komen de clusters 3.0.V (overname),
      3.0.VI (SHA), 3.0.VIII (conflict) en 3.0.IX (ontbinding) samen.

  - type: synthese
    synthese_id: exit-routes-onderneming-overzicht
    rationale_hint: >-
      Overzicht van alle exit-routes uit een onderneming: verkoop
      aandelen (share deal), verkoop activa/bedrijfstak (asset deal),
      fusie of splitsing, omzetting, overdracht onder gerechtelijk
      gezag, vrijwillige ontbinding-vereffening, gerechtelijke
      ontbinding, faillissement. Per route: drempel, gevolg voor
      werknemers, fiscale gevolgen, accountantsrol. Helpt de student
      een advies-opdracht situeren voor hij in detail duikt.

  - type: synthese
    synthese_id: mandaat-versus-advies-rol-accountant
    rationale_hint: >-
      Cruciaal onderscheid voor taak 2 én taak 3: wanneer treedt de
      accountant op als **adviseur** (vrije opdracht, geen wettelijk
      voorbehouden mandaat, geen onafhankelijkheidsvereiste op deze
      cliënt) en wanneer als **wettelijk mandataris** (bijzonder
      mandaat: omzettingsverslag, inbrengverslag, fusieverslag,
      vereffeningsverslag — onafhankelijk, onverenigbaar met
      adviesopdracht voor dezelfde cliënt)? De student moet deze
      grens herkennen voor hij een opdracht aanvaardt.

  - type: competentie
    competentie_id: adviseren-overdrachtsroute-onderneming
  - type: competentie
    competentie_id: adviseren-ontbindingsroute-vennootschap
  - type: competentie
    competentie_id: begeleiden-due-diligence-overname
  - type: competentie
    competentie_id: begeleiden-waardering-onderneming-bij-overdracht
  - type: competentie
    competentie_id: opstellen-overname-verslaggeving-accountant
  - type: competentie
    competentie_id: begeleiden-vereffening-vennootschap
  - type: competentie
    competentie_id: signaleren-risicos-overdracht-of-ontbinding

  - type: voorbereiding
    titel: "Taak 3 — Bijzondere mandaten van de accountant"
    rationale_hint: >-
      Concretisering 3 van het examenprogramma: de accountant treedt
      op als bijzondere mandataris voor wettelijk voorbehouden
      verslagen — inbrengverslag, quasi-inbrengverslag, uitsluiting
      voorkeurrecht, omzettingsverslag, fusie/splitsing-verslag,
      ontbindings- en vereffeningsstaat. Onafhankelijkheidsvereisten
      zijn strikt (onverenigbaar met advies of boekhoudopdracht voor
      dezelfde cliënt) — beslisboom in onderstaande synthese. Per
      mandaat een aparte competentie met verslagstructuur en
      methodologie.
    concepten:
      - bijzondere-mandaten-accountant
      - onafhankelijkheid-bijzondere-mandataris

  - type: synthese
    synthese_id: onafhankelijkheids-beslisboom-bijzondere-mandaten
    rationale_hint: >-
      Beslisboom onafhankelijkheid: aanvaard ik dit bijzonder mandaat?
      Stappen: (1) ben ik commissaris bij dezelfde vennootschap?
      (2) heb ik in de afgelopen 2 jaar een advies- of
      boekhoud­opdracht voor deze cliënt uitgevoerd? (3) ben ik
      verbonden met de andere partij bij de transactie? (4) heb ik
      een financieel belang in de uitkomst? Bij elke ja-positie:
      onverenigbaar. Examenkritisch: de praktijkvraag op het examen
      test deze beslisboom.

  - type: competentie
    competentie_id: opstellen-verslag-omzetting-vennootschap
  - type: competentie
    competentie_id: opstellen-verslag-fusie-splitsing-ruilverhouding
  - type: competentie
    competentie_id: opstellen-beoordelingsverslag-uitsluiting-voorkeurrecht
  - type: competentie
    competentie_id: opstellen-verslag-ontbinding-vereffening-staat

  - type: oriëntatie
    titel: "Reflectie: vennootschapsrecht als gelaagd vakgebied — WVV, WER en de accountantspraktijk"
    rationale_hint: >-
      Sluit af met een reflectie op de twee wettelijke pijlers — het
      WVV (2019) voor het normale leven van de vennootschap (oprichting,
      bestuur, AV, kapitaal, conflicten, ontbinding) en WER Boek XX
      (2018) voor het bijzondere leven (vroegtijdige waarschuwing,
      gerechtelijke reorganisatie, faillissement). De stagiair moet zien
      dat deze twee pijlers niet los staan maar in elkaar grijpen:
      bestuurdersaansprakelijkheid uit het WVV wordt verzwaard door WER
      Boek XX (faillissementsaansprakelijkheid, kennelijk grove fout);
      de meldingsplicht van de accountant uit Wet ITAA wordt
      operationeel via WER Boek XX (vroegtijdige waarschuwing);
      ontbinding (WVV) en faillissement (WER) zijn vaak elkaars
      alternatief. Maak de overstap naar PO 3.1 (fiscaliteit
      vennootschapsbelasting) en PO 1.6 (externe controle —
      commissarisopdracht) expliciet: vennootschapsrecht is de
      juridische ruggengraat waarin de andere PO's hun zin krijgen.


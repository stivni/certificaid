  - type: synthese
    synthese_id: vennootschapsvormen-vergelijking
    rationale_hint: >-
      Plaats deze synthese vroeg als visuele kapstok: de student ziet
      meteen waar de hoofdvormen (BV, NV, CV, maatschap, VOF, Comm.V)
      van elkaar verschillen op de kritische assen — minimumkapitaal,
      aansprakelijkheid van de vennoten, overdraagbaarheid van
      aandelen, bestuursmodel, en doelgroep. Onder het oude wetboek
      bestonden 17 vennootschapsvormen; het WVV (2019) heeft dit
      gereduceerd tot 4 hoofdvormen (BV, NV, CV, maatschap). Elke rij
      van de vergelijkingstabel komt verderop in het leerpad terug.


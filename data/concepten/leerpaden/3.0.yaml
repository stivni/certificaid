programmaonderdeel: "3.0"
titel: "Vennootschapsrecht"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Waarom vennootschapsrecht voor de accountant? Van oprichting tot exit"
    rationale_hint: >-
      Vertrek vanuit het idee dat de gecertificeerd accountant in elke
      levensfase van een vennootschap een rol speelt: bij **oprichting**
      adviseert hij over de vennootschapsvorm en stelt hij het financieel
      plan op (oprichtersaansprakelijkheid op zijn schouders); tijdens
      het **leven** van de vennootschap begeleidt hij kapitaalbewegingen,
      uitkeringen, jaarrekeningen en algemene vergaderingen; bij
      **overdracht of overname** speelt hij een sleutelrol in due
      diligence, waardering en closing; bij **conflicten en exit** is hij
      vaak de raadgever die de partijen door geschillenbeslechting,
      ontbinding of vereffening loodst; en bij **moeilijkheden** is hij
      wettelijk verplicht om alarmsignalen te melden (meldingsplicht
      continuïteit) en de cliënt naar gerechtelijke reorganisatie of
      faillissement te begeleiden. Het WVV (2019) — dat het oude
      Wetboek van vennootschappen heeft vervangen — en WER Boek XX
      (insolventie) zijn de twee wettelijke pijlers. Daarnaast: dit PO
      is uniek omdat het ook **drie examen-taken** koppelt (oprichting,
      overdracht-ontbinding, bijzondere mandaten) — dat zijn de
      concretiseringen die op het examen worden getoetst. De stagiair
      moet niet alleen het vennootschapsrecht kennen, maar ook weten
      welke verslagen en mandaten de accountant zelf uitvoert.


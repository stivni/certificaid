      - kwijting-bestuurder

  - type: thematisch
    titel: "Verzwaarde aansprakelijkheid — fiscale schulden, sociale schulden en insolventie"
    concepten:
      - bestuurdersaansprakelijkheid-fiscale-schulden
      - bestuurdersaansprakelijkheid-sociale-schulden
      - bestuurdersaansprakelijkheid-bij-insolventie
      - kennelijk-ontoereikend-aanvangsvermogen

  - type: synthese
    synthese_id: aansprakelijkheidsgrondslagen-bestuur-vergelijking
    rationale_hint: >-
      Plaats deze synthese als overzichtskaart van de grondslagen
      waarop een bestuurder aansprakelijk kan worden gesteld: gewone
      bestuursfout (art. 2:56 WVV — schending van de behoorlijke
      vervulling), onrechtmatige daad jegens derden (art. 1382 BW),
      schending van de statuten of het WVV (art. 2:56 § 2 WVV),
      faillissementsaansprakelijkheid (kennelijk-grove fout — art. XX.225
      WER), kennelijk-ontoereikend aanvangsvermogen (art. 5:16 BV /
      art. 7:18 NV), fiscale en sociale schulden (art. 442quater WIB92,
      art. 93undeciesC BTW). Per grondslag: wie kan vorderen, welke
      bewijslast, hoofdelijk of niet, beperking. Examenkritisch.

  - type: synthese
    synthese_id: verzwaarde-aansprakelijkheid-bij-insolventie-overzicht
    rationale_hint: >-
      Maakt de brug tussen bestuursthema en insolventiethema: bij
      een faillissement of gerechtelijke reorganisatie verschuift de
      aansprakelijkheidslat — wat tijdens normale werking nog onder
      de behoorlijke-vervullingsnorm valt, wordt onder insolventie
      verzwaard via faillissementsaansprakelijkheid (kennelijk grove
      fout), wrongful trading (verdere uitbating na continuïteits-
      verlies), en de verdachte periode (transacties teruggeschroefd).
      Deze synthese activeert wat de student in cluster 3.0.X
      (insolventie) verderop in detail leert.


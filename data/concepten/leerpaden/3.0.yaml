      - belangenconflict-accountant

  - type: synthese
    synthese_id: vergelijking-vorderingen-vennootschapsconflict
    rationale_hint: >-
      Plaats deze synthese als overzichtstabel van de drie kernvorderingen
      bij een vennootschapsconflict — uitsluitings­vordering
      (gedwongen verkoop door tegenaandeelhouder), uittredings­vordering
      (gedwongen overname door tegenaandeelhouder), en
      minderheids­vordering (vennootschapsvordering tegen bestuurder
      in naam van de vennootschap). Per vordering: wie kan instellen,
      tegen wie, welke drempel (gegronde redenen, % aandelen), welk
      gevolg, welke termijn. Examenkritisch — typische casus-vraag.

  - type: synthese
    synthese_id: beslisboom-remedie-vennootschapsconflict
    rationale_hint: >-
      Beslisboom voor de praktijk: van symptoom (deadlock, onenigheid,
      vermoeden van fout, druk vanuit minderheid) naar remedie
      (alternatieve geschilbeslechting → minnelijke uittreding via
      statuten → wettelijke uittredings- of uitsluitingsvordering →
      gerechtelijke ontbinding wegens wettige redenen). De stagiair
      leert wanneer welke route past en welke rol de accountant kan
      spelen.


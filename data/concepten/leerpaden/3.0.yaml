  - type: synthese
    synthese_id: asset-deal-versus-share-deal
    rationale_hint: >-
      Plaats deze synthese vóór de aandeelhoudersovereenkomst-cluster:
      ze verheldert de eerste strategische keuze in elke overname —
      koopt de overnemer de **aandelen** van de target (share deal:
      eenvoudig, maar overneming van álle latente verplichtingen) of de
      **activa/bedrijfstak** (asset deal: meer cherry-picking maar
      formeler, met de regels van WVV art. 12:103 e.v. over inbreng of
      overdracht van bedrijfstak/algemeenheid). De synthese vergelijkt
      op fiscale, juridische en boekhoudkundige assen. Examenkritisch
      bij PO 3.0.taak.2.

  - type: synthese
    synthese_id: purchase-price-mechanismen
    rationale_hint: >-
      Sluit de overname-cluster af met de prijs-mechanismen: closing
      accounts versus locked box versus earn-out — drie technieken om
      het prijsrisico tussen signing en closing te verdelen. De
      gecertificeerd accountant speelt hier een sleutelrol als
      verifieerder van de closing accounts of de locked-box-balans.

  - type: thematisch
    titel: "Aandeelhoudersovereenkomsten — vier categorieën clausules"
    concepten:
      - aandeelhoudersovereenkomst
      - overdrachtsbeperking-aandelen
      - exit-mechanismen-sha

      - bestuurdersaansprakelijkheid-bij-onrechtmatige-uitkering
      - individueel-controlerecht-aandeelhouder
      - alarmbelprocedure

  - type: synthese
    synthese_id: uitkeringstest-vergelijking-bv-nv
    rationale_hint: >-
      De BV kent na het WVV geen kapitaal meer — uitkeringen vereisen
      een **dubbele test**: een netto-actieftest (boekhoudkundig: blijft
      het netto-actief positief na uitkering?) én een liquiditeitstest
      (kan de vennootschap haar opeisbare schulden de komende 12 maanden
      betalen?). De NV behoudt het kapitaalbegrip en kent alleen de
      netto-actieftest. Plaats deze synthese als didactische scharnier
      tussen de kapitaaltheoretische logica (NV: schuldeiserbescherming
      via kapitaal) en de cash-flow-logica (BV: schuldeiserbescherming
      via solvabiliteit én liquiditeit). Examenkritisch — komt vrijwel
      elk examen terug.


    concepten:
      - vereffening-in-een-akte
      - bevestiging-vereffenaar-deficitaire-vereffening
      - vereffenaarsaansprakelijkheid

  - type: thematisch
    titel: "Omzetting — van rechtsvorm wijzigen zonder ontbinding"
    concepten:
      - omzetting-vennootschap
      - voorstel-omzetting-vennootschap
      - controleverslag-omzetting

  - type: synthese
    synthese_id: vrijwillige-versus-gerechtelijke-ontbinding
    rationale_hint: >-
      Twee routes naar ontbinding: vrijwillig (beslissing van de
      buitengewone AV, statutair quorum + meerderheid, verslag bestuur
      + controleverslag accountant of bedrijfsrevisor) versus
      gerechtelijk (vordering tot ontbinding wegens wettige redenen,
      door minstens 10% van de aandeelhouders of door belanghebbende
      derden, of door de procureur des Konings). Per route: vereisten,
      gevolgen, welke verslagen door de accountant. Examenkritisch:
      taak 2 vereist diagnose van de juiste route.

  - type: synthese
    synthese_id: klassieke-versus-een-akte-vereffening
    rationale_hint: >-
      De klassieke vereffening (ontbinding → benoeming vereffenaar →
      werkzaamheden → omstandige staat → sluiting) versus de
      vereffening-in-één-akte (ontbinding en sluiting op dezelfde
      AV). Voorwaarden voor de versnelde procedure: geen schulden bij
      derden, alle aandeelhouders aanwezig, alle aandeelhouders
      tekenen, controleverslag bedrijfsrevisor of accountant. De
      student leert de toepassingsvoorwaarden — fout toepassen is
      een vaak voorkomende beroepsfout. Examenkritisch — taak 2 en 3.


  - type: thematisch
    titel: "Controleverwerving in genoteerde vennootschappen — overnamebod, squeeze-out en sell-out"
    concepten:
      - verplicht-overnamebod
      - uitkoopbod-squeeze-out
      - sell-out-minderheid

  - type: synthese
    synthese_id: drag-along-tag-along
    rationale_hint: >-
      Twee exit-clausules die bij elke private-equity-deal terugkeren
      en didactisch naast elkaar moeten: **drag-along** beschermt de
      meerderheid (kan minderheid meeslepen bij verkoop aan een derde),
      **tag-along** beschermt de minderheid (mag meelopen op dezelfde
      prijsvoorwaarden). De student leert ze niet door definities maar
      door rolomkering te zien: wie heeft welk belang bij welke clausule?

  - type: synthese
    synthese_id: controleverwerving-methodes
    rationale_hint: >-
      Sluit de overname- en SHA-cluster af met een breed overzicht van
      de manieren waarop controle over een vennootschap kan worden
      verworven: aandelenkoop (share deal), activakoop (asset deal),
      fusie, splitsing, kapitaalverhoging met inbreng, openbaar
      overnamebod (genoteerd). Per methode: wie beslist (AV vs.
      bestuursorgaan), welke meldingsplicht, welke verslagen door de
      bedrijfsrevisor of accountant. Examenkritisch overzicht voor
      taak 2 (overdracht-advies).

  - type: thematisch
    titel: "Bestuurdersaansprakelijkheid — grondslagen en periode"
    concepten:
      - bestuurdersaansprakelijkheid
      - oprichtersaansprakelijkheid
      - feitelijk-bestuurder
      - behoorlijke-vervulling-bestuursopdracht
      - aansprakelijkheidsperiode-bestuurder
      - aansprakelijkheidsbeperking-bestuurder

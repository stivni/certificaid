  - type: synthese
    synthese_id: bestuursmodel-vennootschap
    rationale_hint: >-
      Plaats deze synthese na de bestuursthema's: ze toont op één blad
      hoe BV, NV en CV elk hun bestuursmodel structureren — enkelvoudig
      (één of meer bestuurders met gelijke bevoegdheid bij BV/CV) versus
      monistisch (raad van bestuur als college bij NV) versus duaal
      (raad van toezicht + directieraad bij NV). De student ziet meteen
      dat de keuze van het bestuursmodel niet vrij is per vennootschapsvorm
      en dat ze structurele gevolgen heeft voor verantwoordelijkheid,
      vertegenwoordiging en aansprakelijkheid.


  - type: synthese
    synthese_id: synthese-soorten-algemene-vergadering
    rationale_hint: >-
      Eerst de drie soorten algemene vergaderingen onderscheiden —
      gewone (jaarvergadering: goedkeuring jaarrekening, kwijting,
      bestemming resultaat), buitengewone (statutenwijziging,
      kapitaalbewegingen, ontbinding) en bijzondere (alle andere
      AV's die niet onder de twee andere vallen) — vóór de student
      naar de quorum- en meerderheidsregels overstapt. Examenkritisch:
      welk type AV voor welk besluit?

  - type: synthese
    synthese_id: synthese-quorum-meerderheid-algemene-vergadering
    rationale_hint: >-
      Quorum- en meerderheidsvereisten zijn een examen-klassieker. Deze
      synthese plaatst de regels naast elkaar: gewone AV (geen quorum,
      gewone meerderheid), buitengewone AV voor statutenwijziging
      (50%-quorum, 75% meerderheid), buitengewone AV voor wijziging
      van het doel of omzetting (50%-quorum, 80% meerderheid),
      vermindering van de rechten verbonden aan een aandelenklasse
      (quorum en meerderheid per klasse). De student leert lezen welke
      drempel bij welke beslissing hoort.

  - type: synthese
    synthese_id: synthese-bevoegdheidsverdeling-av-vs-bestuur
    rationale_hint: >-
      Sluit de AV-cluster af met de bevoegdheidsverdeling tussen
      algemene vergadering en bestuursorgaan: residuaire bestuurs-
      bevoegdheid versus exclusieve AV-bevoegdheden (statutenwijziging,
      kapitaalbewegingen, benoeming/ontslag bestuurders, kwijting,
      ontbinding). Examenkritisch: welk orgaan beslist over welk type
      handeling?


programmaonderdeel: "1.5"
titel: "Beginselen van de Europese wetgeving en de IFRS-normen"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Waarom IFRS naast Belgisch GAAP? Twee referentiestelsels, één economische realiteit"
    rationale_hint: >-
      Vertrek vanuit het idee dat een Belgische onderneming haar jaarrekening
      in beginsel opstelt volgens BE-GAAP (KB-WVV + WER Boek III), maar dat
      sommige ondernemingen ook of zelfs uitsluitend IFRS moeten of mogen
      toepassen. Verbind het verschil tussen de twee stelsels met hun
      doelpubliek: BE-GAAP dient vooral fiscus, schuldeisers en kleine
      aandeelhouders (voorzichtigheidsbeginsel, historische kostprijs), IFRS
      richt zich op kapitaalmarkten en internationale investeerders (fair
      value, getrouw economisch beeld). Maak duidelijk dat IFRS in België
      verplicht is voor de geconsolideerde jaarrekening van beursgenoteerde
      groepen (Verordening 1606/2002) en optioneel voor sommige niet-genoteerde
      groepen. Sluit aan bij de begrippen `ifrs-verordening-1606-2002`,
      `ifrs-toepassingsgebied-belgie` en `be-gaap-vs-ifrs-overzicht` uit de
      meegeleverde records — die fungeren als kapstok voor de hele cursus.

  - type: thematisch
    titel: "De twee referentiestelsels — begrippen en conceptueel raamwerk"
    concepten:
      - belgisch-gaap
      - ifrs
      - ifrs-conceptueel-raamwerk

  - type: thematisch
    titel: "Het Europese kader: richtlijn 2013/34/EU en verordening 1606/2002"
    concepten:
      - eu-harmonisatie-jaarrekeningenrecht
      - verplichte-ifrs-eu-beursgenoteerden
      - endorsement-procedure-eu
      - ifrs-toepassingsgebied-belgie
      - public-interest-entity
      - groottecriteria-jaarrekening
      - consolidatieverplichting

  - type: synthese
    synthese_id: be-gaap-vs-ifrs-overzicht
    rationale_hint: >-
      Plaats deze synthese vroeg als visuele kapstok: de student kent IFRS
      nog niet in detail, maar ziet meteen waar de twee stelsels fundamenteel
      verschillen — fair value vs. historische kostprijs, componentenbenadering
      vs. globale afschrijving, IFRS 16 single-model lessee vs. operationele/
      financiële lease, 5-stappen-model vs. realisatiebeginsel. Elke rij van
      de vergelijkingstabel wordt verderop in het leerpad uitgewerkt; deze
      synthese is de globale kaart die de student doorheen het hele
      programmaonderdeel meeneemt.

  - type: competentie
    competentie_id: bepalen-toepasselijkheid-ifrs-belgie

  - type: thematisch
    titel: "Brug: jaarrekeningpresentatie als regime-overstijgend concept"
    concepten:
      - jaarrekening-presentatie
    rationale_hint: >-
      Deze regime-overstijgende cluster fungeert als brug tussen de
      BE-GAAP-presentatie (KB WVV, klasse 1-7, balans + resultatenrekening +
      toelichting) die de student al kent uit PO 1.1, en de IFRS-presentatie
      (IAS 1, vijf componenten) die hierna volgt. De boodschap: dezelfde
      economische realiteit wordt onder elk stelsel anders gepresenteerd —
      zelfde getrouw-beeld-doel, andere vorm. Zo herkent de student in de
      volgende cluster (IAS 1) waar IFRS van BE-GAAP afwijkt zonder de
      gemeenschappelijke beginselen te verliezen.

  - type: thematisch
    titel: "IAS 1 — Presentatie van de jaarrekening: vijf componenten en presentatiebeginselen"
    concepten:
      - jaarrekening-componenten-ifrs
      - presentatiebeginselen-jaarrekening-ifrs
      - balans-presentatie-ifrs
      - totaalresultaat-ifrs
      - mutatieoverzicht-eigen-vermogen-ifrs
      - toelichtingsvereisten-jaarrekening-ifrs

  - type: competentie
    competentie_id: presenteren-jaarrekening-ifrs

  - type: thematisch
    titel: "Vaste activa onder IFRS: IAS 16 en IAS 38 — kostprijs, herwaardering en componenten"
    concepten:
      - materiele-vaste-activa-ifrs
      - immateriele-vaste-activa-ifrs
      - herwaarderingsmodel-ifrs
      - componentenbenadering
      - afschrijvingen-ifrs
      - intercalaire-interesten

  - type: competentie
    competentie_id: waarderen-materiele-vaste-activa-ifrs

  - type: thematisch
    titel: "Brug: bijzondere waardevermindering als regime-overstijgend mechanisme"
    concepten:
      - bijzondere-waardevermindering
      - bijzondere-waardevermindering-be-gaap
    rationale_hint: >-
      Vóór de IFRS-specifieke IAS 36-cluster eerst de regime-overstijgende
      logica: detecteer indicatoren, vergelijk boekwaarde met realiseerbare
      waarde, boek het verschil. Onder BE-GAAP gebeurt dat per actief volgens
      de waarderingsregels in het KB WVV (voorzichtigheidsbeginsel); onder
      IFRS gebeurt het meer formeel via CGU's en de IAS 36-toets. Door beide
      naast elkaar te plaatsen ziet de student de gemeenschappelijke economische
      logica én weet hij waar de regimes uiteenlopen — dat is examenkritisch
      bij vragen die de stelsels vergelijken.

  - type: thematisch
    titel: "Bijzondere waardevermindering onder IAS 36: indicaties, CGU en realiseerbare waarde"
    concepten:
      - bijzondere-waardevermindering-ifrs

  - type: competentie
    competentie_id: toetsen-bijzondere-waardevermindering-ifrs

  - type: thematisch
    titel: "Brug: opbrengsten onder BE-GAAP — het realisatiebeginsel"
    concepten:
      - opbrengsten-be-gaap
    rationale_hint: >-
      Vóór het IFRS 15-model eerst de BE-GAAP-referentie: onder Belgisch recht
      worden opbrengsten erkend volgens het realisatiebeginsel (geboekt zodra
      gerealiseerd, dat wil zeggen levering of dienstverrichting voltrokken en
      tegenprestatie redelijk zeker). Dit principe sluit aan bij het
      voorzichtigheidsbeginsel uit PO 1.1. Door dit eerst te activeren ziet de
      student waarom IFRS 15 met zijn vijf-stappen-model fundamenteel anders is:
      één opbrengstcontract wordt opgesplitst in afzonderlijke prestatie-
      verplichtingen, en de opbrengst per prestatieverplichting wordt erkend
      naargelang de controle overgaat — niet bij globale levering.

  - type: thematisch
    titel: "Opbrengsten onder IFRS 15: het vijf-stappen-model en prestatieverplichtingen"
    concepten:
      - opbrengsten-ifrs
      - prestatieverplichting
      - onderhanden-projecten-ifrs

  - type: competentie
    competentie_id: toepassen-vijf-stappen-model-opbrengsten-ifrs

  - type: thematisch
    titel: "Voorraden onder IFRS: IAS 2 en het verbod op LIFO"
    concepten:
      - voorraden-ifrs

  - type: synthese
    synthese_id: ifrs-16-lessee-vs-lessor-overzicht
    rationale_hint: >-
      Plaats deze synthese vóór de leasing-competentie: ze maakt in één
      vergelijking expliciet hoe IFRS 16 het BE-GAAP-onderscheid tussen
      operationele en financiële leasing aan lessee-zijde heeft afgeschaft
      (single-model: alle leases op balans als right-of-use-actief +
      leaseverplichting), terwijl aan lessor-zijde het oude onderscheid
      operationele/financiële lease behouden blijft. Deze asymmetrie is
      examenkritisch en wordt door de daaropvolgende competentie uitgewerkt
      vanuit lessee-perspectief.

  - type: thematisch
    titel: "Leasing onder IFRS 16: right-of-use-actief en leaseverplichting bij lessee"
    concepten:
      - leasing-ifrs
      - right-of-use-actief
      - leaseverplichting-ifrs
      - lessee-vs-lessor-leasing-ifrs
      - sale-and-leaseback-ifrs

  - type: competentie
    competentie_id: verwerken-leasing-ifrs-lessee

  - type: thematisch
    titel: "Brug: stelselwissel jaarrekening — van BE-GAAP naar IFRS en omgekeerd"
    concepten:
      - stelselwissel-jaarrekening
      - wijziging-boekhoudkundig-referentiestelsel
      - ifrs-eerste-toepassing
      - correctie-jaarrekening-ifrs
      - goodwill-be-gaap
    rationale_hint: >-
      De regime-overstijgende cluster `stelselwissel-jaarrekening` plaatst
      drie verwante gevallen op één kapstok: (1) eerste toepassing van IFRS
      door een onderneming die voorheen alleen BE-GAAP rapporteerde
      (IFRS 1 — openings-balans, retroactieve toepassing met vrijstellingen),
      (2) wijziging van het boekhoudkundig referentiestelsel binnen het bestaande
      regime (waarderingsregel-wijziging onder BE-GAAP, schattings- of
      grondslag-wijziging onder IAS 8), en (3) correctie van fouten uit eerdere
      perioden. Door deze drie samen te brengen zien de studenten dat de
      vraag "welk stelsel pas ik vanaf wanneer toe?" altijd dezelfde drie
      ingrediënten heeft: transitiedatum, overgangsregels, en
      toelichtingsvereisten. Goodwill onder BE-GAAP (verplichte afschrijving
      vs. IFRS impairment-only) is een sprekend voorbeeld van een verschil
      dat bij stelselwissel uitdrukkelijk moet worden behandeld.

  - type: competentie
    competentie_id: uitvoeren-eerste-toepassing-ifrs

  - type: oriëntatie
    titel: "Reflectie: IFRS als levend normenstelsel — IAS 17 → IFRS 16 en IAS 18 → IFRS 15"
    rationale_hint: >-
      Sluit af met een reflectie op de dynamiek van IFRS: het ITAA-anker
      noemt nog IAS 11, IAS 17 en IAS 18, maar die zijn intussen vervangen
      door IFRS 15 (opbrengsten, vervangt IAS 11 + IAS 18) en IFRS 16
      (leasing, vervangt IAS 17). Verwijs naar de `edges[]` met type
      `vervangt` in de records `leasing-ifrs`, `opbrengsten-ifrs` en
      `onderhanden-projecten-ifrs`: de student moet leren dat IFRS niet
      stilstaat en dat het examen zowel de huidige stand (IFRS 15/16) als
      de historische ankering (IAS 11/17/18) kan toetsen. Maak de overstap
      naar PO 1.4 (consolidatie onder IFRS 10/11/3) en naar PO 1.1 (BE-GAAP
      als referentiekader) expliciet: dezelfde economische gebeurtenis
      krijgt onder elk stelsel een andere boekhoudkundige neerslag.


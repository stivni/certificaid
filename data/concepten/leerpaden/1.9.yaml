programmaonderdeel: "1.9"
titel: "Financiële analyse en fundamentele principes van financieel bedrijfsbeheer"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Van toelating naar bekwaamheid: wat verdiept PO 1.9 boven PO 1.3?"
    rationale_hint: >-
      Open vanuit het feit dat de stagiair de [[doelstellingen-financiele-analyse]]
      en de basis-ratio's (liquiditeit, solvabiliteit, rentabiliteit) al kent uit
      PO 1.3. PO 1.9 voegt drie nieuwe lagen toe: (i) economische diepte — niet
      alleen balansaggregaten maar [[toegevoegde-waarde-financiele-analyse]] en
      [[herstructurering-resultatenrekening]]; (ii) kasstroom-rigoreur — een
      drie-segmenten [[kasstroomoverzicht-drie-segmenten]] (CFO/CFI/CFF) in plaats
      van één cashflow-bedrag, plus [[behoefte-aan-bedrijfskapitaal]] als
      analytische conventie; (iii) bekwaamheid-niveau interpretatie — van losse
      ratio's naar [[interpretatie-financiele-ratios]], met expliciete
      falen-detectie via [[falen-van-de-onderneming]], [[altman-z-score]] en
      [[ohlson-o-score]]. Sluit af met het verschil tussen "een ratio kunnen
      berekenen" (1.3) en "een diagnose kunnen stellen met aanbevelingen aan
      het management" (1.9).

  - type: thematisch
    titel: "Wie leest de jaarrekening en met welk doel? — gebruikersperspectief en scoping"
    concepten:
      - doelstellingen-financiele-analyse
      - gebruikers-jaarrekening
      - getrouw-beeld-jaarrekening
      - jaarrekening-als-studieobject
      - intake-financiele-analyse
      - bestuursverslag

  - type: thematisch
    titel: "Vertrekpunt: balans-herwerking herhaald, nu vanuit bekwaamheidsperspectief"
    concepten:
      - analytische-balans

  - type: thematisch
    titel: "Resultatenrekening herwerken: vier blokken, drie schema's, toegevoegde waarde"
    concepten:
      - herstructurering-resultatenrekening
      - toegevoegde-waarde-financiele-analyse

  - type: competentie
    competentie_id: herstructureren-resultatenrekening-en-toegevoegde-waarde

  - type: thematisch
    titel: "Cashflow, financieringsbronnen en mutaties: de tweede pijler naast de balans"
    concepten:
      - cashflow-analyse
      - tabel-waardemutaties
      - financiering-met-eigen-vermogen
      - financiering-met-derdenkapitaal

  - type: synthese
    synthese_id: kasstroomoverzicht-drie-segmenten
    rationale_hint: >-
      Plaats deze synthese als kapstok vóór de twee kasstroom-competenties:
      vóór de student CFO, CFI of CFF afzonderlijk leert opstellen, ziet hij
      in één overzicht hoe de drie segmenten samen de verklaring leveren voor
      de evolutie van de [[behoefte-aan-bedrijfskapitaal]] en de nettokas. Dit
      voorkomt dat het kasstroomoverzicht als drie losse berekeningen blijft
      hangen en maakt duidelijk waarom IFRS (IAS 7) net dit drie-segmenten-
      schema verplicht stelt waar het Belgisch volledig schema het slechts
      aanbeveelt. De synthese vormt ook de brug naar de BBK-competentie die
      hierop volgt.

  - type: competentie
    competentie_id: opstellen-driesegmenten-kasstroomoverzicht

  - type: thematisch
    titel: "Werkkapitaal versus behoefte aan bedrijfskapitaal: de analytische conventie"
    concepten:
      - werkkapitaal
      - behoefte-aan-bedrijfskapitaal

  - type: competentie
    competentie_id: bepalen-behoefte-aan-bedrijfskapitaal

  - type: thematisch
    titel: "Ratio-set in de diepte: de vier doelen en hun ratio's"
    concepten:
      - ratio-vier-doelen-vergelijking
      - liquiditeitsratio
      - current-ratio
      - quick-ratio
      - liquiditeitstoets-beslisboom
      - solvabiliteitsratio
      - debt-equity-ratio
      - rentabiliteit-totaal-activa-roa
      - rentabiliteit-eigen-vermogen-roe

  - type: thematisch
    titel: "Bekwaamheid-niveau lezen: trend, sector en contextuele interpretatie"
    concepten:
      - interpretatie-financiele-ratios
      - horizontale-analyse-jaarrekening
      - verticale-analyse-jaarrekening
      - sectorvergelijking-financiele-analyse
      - historische-evolutie-financiele-analyse

  - type: thematisch
    titel: "Falen als fenomeen: signalen, alarmbel, covenanten en juridisch kader"
    concepten:
      - falen-van-de-onderneming
      - risicoparagraaf-bestuursverslag
      - ratio-covenants
      - cijferanalyses-controle-norm

  - type: thematisch
    titel: "Kwantitatieve faillissement-predictiemodellen: Altman Z en Ohlson O"
    concepten:
      - altman-z-score
      - ohlson-o-score

  - type: competentie
    competentie_id: toepassen-faillissement-predictiemodellen

  - type: synthese
    synthese_id: kwantitatieve-financiele-diagnose
    rationale_hint: >-
      Na de Altman/Ohlson-competentie heeft de student twee modellen in de
      vingers, maar nog geen kader om ze samen te plaatsen naast ratio-analyse
      en sectorvergelijking. Deze synthese werkt als kapstok vóór de
      eind-diagnose: ze laat zien hoe een [[altman-z-score]] en een
      [[ohlson-o-score]] convergeren met de [[ratio-vier-doelen-vergelijking]]
      en met de [[sectorvergelijking-financiele-analyse]] tot één
      kwantitatief oordeel. Dit verlaagt de drempel naar de software-
      competentie (waar tools deze synthese geautomatiseerd leveren) en naar
      de capstone-diagnose (waar de stagiair de synthese zelf moet verwoorden).

  - type: thematisch
    titel: "IT-tools voor financiële analyse: NBB-Online, Bel-First, Graydon, scoringtools"
    concepten:
      - financiele-analyse-software

  - type: competentie
    competentie_id: gebruiken-financiele-analyse-software

  - type: competentie
    competentie_id: stellen-bekwaamheid-financiele-diagnose

  - type: oriëntatie
    titel: "Grenzen van kwantitatieve modellen: wat een diagnose NIET kan zeggen"
    rationale_hint: >-
      Sluit het leerpad af met een reflectief blok dat de beperkingen van
      kwantitatieve financiële analyse expliciet maakt. Verbind hier
      [[falen-van-de-onderneming]] (een fenomeen dat zich pas geleidelijk
      manifesteert en deels niet-financieel is) met [[altman-z-score]] en
      [[ohlson-o-score]] (modellen gekalibreerd op andere markten, andere
      tijdperken — type I/II-fouten). Herneem [[cijferanalyses-controle-norm]]:
      een cijferanalyse signaleert, ze bewijst niet; en
      [[interpretatie-financiele-ratios]]: cijfers krijgen pas betekenis in
      context (sector, conjunctuur, bedrijfsmodel). Wijs op het belang van
      [[risicoparagraaf-bestuursverslag]] en niet-financiële informatie om
      kwantitatieve signalen te valideren of te corrigeren. Eindig met de
      boodschap dat bekwaamheid-diagnose een oordeel blijft: de stagiair leert
      wáár hij modellen moet vertrouwen en wáár hij de mens-review boven het
      model moet plaatsen.


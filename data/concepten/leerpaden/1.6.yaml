programmaonderdeel: "1.6"
titel: "Externe controle — Bedrijfsrevisor / Gecertificeerd accountant"
status: voorgesteld
schema_version: "1.0"
hoofdstukken:
  - type: oriëntatie
    titel: "Waarom externe controle? Stakeholders, vertrouwen en de assurance-keten"
    rationale_hint: >-
      Vertrek vanuit het idee dat een jaarrekening pas economisch betekenis
      krijgt als een onafhankelijke derde haar bevestigt: zonder externe
      controle kunnen aandeelhouders, schuldeisers, werknemers, fiscus en
      NBB de cijfers niet vertrouwen. Verbind 'getrouw beeld' en
      'regelmatigheid' als controlecriteria met de stakeholders die er
      belang bij hebben (uit de records getrouw-beeld-controle en
      regelmatigheid-jaarrekening-audit). Maak duidelijk dat externe
      controle een gelaagd vakgebied is — niet één opdrachttype, maar een
      spectrum van zekerheidsniveaus (audit, review, samenstelling) — en
      dat de stagiair leert redeneren van opdrachttype naar werkprogramma
      naar oordeel. Verwijs naar de actoren bedrijfsrevisor en
      gecertificeerd-accountant-ga uit de records: wie mag wat doen, en
      onder welke norm.

  - type: thematisch
    titel: "Wettelijk kader en normenhiërarchie: Wet ITAA, KB plichtenleer, ITAA-normen en ISA"
    concepten:
      - itaa-algemene-controlenorm
      - itaa-kmo-controlenorm
      - wettelijke-controleopdracht-commissaris
      - contractuele-controleopdracht
      - contractuele-beoordelingsopdracht

  - type: thematisch
    titel: "Actoren in de externe controle: wie mag wat?"
    concepten:
      - bedrijfsrevisor
      - gecertificeerd-accountant-ga
      - gedeelde-wettelijk-voorbehouden-opdracht
      - met-governance-belaste-personen

  - type: synthese
    synthese_id: opdrachttypes-zekerheidsniveaus-synthese
    rationale_hint: >-
      Plaats deze synthese vroeg als visuele kapstok over het hele
      programmaonderdeel: het spectrum audit (redelijke zekerheid) →
      review (beperkte zekerheid) → ISRS 4410 samenstelling (geen
      zekerheid) → due diligence en bijzondere opdrachten. De student
      ziet meteen welke opdrachttypes bestaan, welk zekerheidsniveau
      eraan vasthangt en welk soort verslag eruit volgt. Verbind met de
      records redelijke-mate-van-zekerheid, beperkte-mate-van-zekerheid
      en beoordelingsverslag-elementen — verderop in het leerpad wordt
      de audit-route uitgediept; de review- en samenstellingsroute zijn
      hier vooral kader.

  - type: thematisch
    titel: "Zekerheidsniveaus en alternatieve opdrachttypes: review en samenstelling"
    concepten:
      - redelijke-mate-van-zekerheid
      - beperkte-mate-van-zekerheid
      - samenstellingsopdracht-isrs4410
      - beoordelingsverslag-elementen
      - ontbinding-vereffening-opdracht

  - type: competentie
    competentie_id: aanvaarden-audit-opdracht

  - type: synthese
    synthese_id: auditcyclus-fasen-synthese
    rationale_hint: >-
      Na de aanvaardingsfase plaatst deze synthese de vier fasen van de
      audit naast elkaar: aanvaarding → planning + risico-inschatting →
      uitvoering + assurance-informatie → conclusie + verslag. De
      vergelijkingstabel toont per fase doel, kern-output en
      norm-referentie (KMO-norm + algemene controlenorm); de
      Mermaid-flowchart maakt de iteratieve aard expliciet (nieuwe
      risico's tijdens uitvoering kunnen de planning hertriggeren). Dit
      hoofdstuk is de procedurele kaart voor de zes competenties die
      hierop volgen.

  - type: competentie
    competentie_id: verwerven-kennis-van-clientonderneming-audit

  - type: competentie
    competentie_id: uitvoeren-risico-inschatting-en-materialiteit-audit

  - type: competentie
    competentie_id: opstellen-auditstrategie-en-werkprogramma

  - type: thematisch
    titel: "Controle-instrumenten en testing-soorten: het instrumentarium van de auditor"
    concepten:
      - assurance-informatie
      - toetsing-interne-beheersing
      - gegevensgerichte-werkzaamheden
      - cijferanalyses-audit
      - externe-bevestiging-audit
      - steekproef-audit
      - schriftelijke-bevestiging-management
      - beweringen-audit

  - type: competentie
    competentie_id: selecteren-en-uitvoeren-controle-instrumenten-audit

  - type: thematisch
    titel: "Bijzondere uitvoeringsthema's: schattingen, automatisering en fraude"
    concepten:
      - boekhoudkundige-schattingen-audit
      - specifieke-kwesties-automatisering-audit
      - fraude-versus-fout

  - type: competentie
    competentie_id: documenteren-auditdossier

  - type: competentie
    competentie_id: beoordelen-getrouw-beeld-en-regelmatigheid

  - type: competentie
    competentie_id: opstellen-controleverslag-en-formuleren-oordeel

  - type: competentie
    competentie_id: communiceren-met-bestuur-en-auditcomite

  - type: thematisch
    titel: "Communicatie met management en governance in de praktijk"
    concepten:
      - communicatie-met-management-governance
      - auditcomite

  - type: competentie
    competentie_id: toepassen-professional-skepticism-en-deontologie-audit

  - type: oriëntatie
    titel: "Reflectie: kwaliteitscontrole, beroepsaansprakelijkheid en het levende beroep"
    rationale_hint: >-
      Sluit af met een korte reflectie op wat een audit-opdracht na de
      handtekening nog kan opleveren: ITAA-kwaliteitscontrole op
      opdrachtniveau (record kwaliteitsbeheersing-opdrachtniveau) en de
      civiele en strafrechtelijke beroepsaansprakelijkheid van de
      accountant bij nalatigheid of onafhankelijkheidsbreuken (record
      beroepsaansprakelijkheid-accountant). Verbind met
      onafhankelijkheid-externe-accountant en beroepsgeheim-accountant
      uit het skepticism-hoofdstuk: deontologie is geen losse laag bovenop
      het werk, maar de manier waarop de auditor zijn oordeel
      beschermt. Maak de overstap naar PO 1.4 (consolidatie) en PO 1.3
      (analyse) door op te merken dat de auditor in elk van die contexten
      dezelfde auditcyclus toepast, alleen met andere risicoprofielen.


id: toepassen-volledige-kostencalculatie
titel: Toepassen van de volledige kostencalculatie (full costing) op een productie-eenheid
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.8
voortkomend_uit:
  taken:
  - 1.8.taak.1
  kenniselementen:
  - 1.8.III
  - 1.8.III.A
  - 1.8.II
  - 1.8.II.A
gebaseerd_op_concepten:
- volledige-kostencalculatie
- directe-kosten
- indirecte-kosten
- variabele-kosten
- vaste-kosten
- kostencentrum
- kostendrager
- verdeelsleutel
- kostprijs-per-eenheid
- vervaardigingsprijs
procedure_grondslag:
  wettelijk_pct: 35
  praktijk_pct: 65
  motivering: De volledige bedrijfskostprijs is vakdoctrine, maar de wettelijke vervaardigingsprijs (KB 21.10.2018 art. 22 + CBN 132/7) gebruikt dezelfde mechanica met expliciete verplichting indirecte productiekosten op te nemen. Voor voorraadwaardering wordt de procedure dus deels wettelijk gestuurd.
stappen:
- nr: 1
  titel: Identificeren van directe versus indirecte kosten
  wat: "Splits alle kosten in twee groepen: direct toewijsbaar aan de kostendrager versus niet rechtstreeks toewijsbaar."
  waarom: Alleen op deze tweedeling werkt de toewijzingslogica van full costing — directe kosten kunnen rechtstreeks, indirecte vereisen een sleutel.
  input:
  - artefact: Kostenoverzicht per kostensoort
    veld: Bedragen per categorie
    type: boekhoudkundig-bedrag
  output:
  - artefact: Twee kolommen direct / indirect
    veld: Bedragen geclassificeerd
    type: document
  hoe: |
    1. Pas [[directe-kosten]] §toewijsbaarheid toe: kan elke kost ondubbelzinnig aan
       één product of order gehecht worden zonder verdeelsleutel?
    2. Pas [[indirecte-kosten]] §gemeenschappelijke-kost toe op de rest:
       verlichting werkplaats, leiding, onderhoud, afschrijving algemene installaties.
    3. Let op: een kost kan direct én variabel zijn, of direct én vast — dimensies overlappen.
       Voor full costing telt vooral de directe/indirecte-as.
    4. Documenteer twijfelgevallen (bv. werkkledij): kies één categorie en houd consistent vol.
  grondslag: "[[directe-kosten]] §toewijsbaarheid, [[indirecte-kosten]] §gemeenschappelijke-kost"
- nr: 2
  titel: Verdelen van indirecte kosten over kostencentra (primaire verdeling)
  wat: Alloceer elke indirecte-kosten-soort naar een kostencentrum (hulp- of hoofd-centrum) volgens een verdeelsleutel.
  waarom: De kost moet eerst landen waar hij verbruikt is voordat hij kan worden doorgesluisd naar dragers.
  input:
  - artefact: Indirecte kosten uit stap 1
    veld: Bedragen per indirecte soort
    type: boekhoudkundig-bedrag
  - artefact: Sleutelmatrix uit [[opzetten-analytisch-rekeningenstelsel]]
    veld: Per soort een toewijzingsbasis
    type: document
  output:
  - artefact: Tabel kostencentrum × kostensoort
    veld: Bedrag per cel
    type: boekhoudkundig-bedrag
  hoe: |
    1. Volg [[verdeelsleutel]] §oorzakelijkheidsprincipe.
    2. Pas per indirecte-kosten-soort de gekozen sleutel toe:
       - Huur fabriek: m² per centrum.
       - Energie: machine-uren of kWh-meting per centrum.
       - Leiding/admin: aantal medewerkers per centrum.
    3. Maak een matrix kostencentrum (kolommen) × kostensoort (rijen).
    4. Som per kolom: totaal toegewezen aan elk centrum.
  grondslag: "[[verdeelsleutel]] §oorzakelijkheidsprincipe, [[kostencentrum]] §primaire-verdeling"
- nr: 3
  titel: Verdelen van hulp-centra over hoofd-centra (secundaire verdeling)
  wat: Verdeel de kost van ondersteunende kostencentra (onderhoud, stroom) over de productiecentra die er gebruik van maken.
  waarom: Hulp-centra dragen geen product; hun kost moet doorrollen naar de hoofd-centra waar productie gebeurt.
  input:
  - artefact: Primaire verdeling uit stap 2
    veld: Totalen per centrum
    type: boekhoudkundig-bedrag
  output:
  - artefact: Tabel hoofd-centra met volledige indirecte kost
    veld: Totaal per hoofd-centrum
    type: boekhoudkundig-bedrag
  hoe: |
    1. Bepaal de verdeelsleutel hulp→hoofd (bv. onderhoudsuren per centrum,
       kWh-verbruik per centrum).
    2. Verdeel het totaal van elk hulp-centrum over de hoofd-centra met deze sleutel.
    3. Als hulp-centra onderling diensten leveren: gebruik trapsgewijze of
       gelijktijdige (matrix) verdeling — voor stagiair volstaat trapsgewijs.
    4. Resultaat: elk hoofd-centrum bevat zowel zijn eigen primaire kost als zijn
       aandeel in de hulp-centra.
  grondslag: "[[kostencentrum]] §secundaire-verdeling, [[verdeelsleutel]] §primair-secundair"
- nr: 4
  titel: Doorrekenen naar kostendragers
  wat: Bereken per hoofd-centrum een opslag-tarief (bv. per machine-uur of per directe-arbeidsuur) en pas dit toe op de dragers.
  waarom: Pas dan zit alle indirecte kost in de kostprijs van het product of de order — de basis voor voorraadwaardering en prijszetting.
  input:
  - artefact: Indirecte kost per hoofd-centrum uit stap 3
    veld: Bedrag per centrum
    type: boekhoudkundig-bedrag
  - artefact: Werkelijke productie-data
    veld: Uren of eenheden per drager per centrum
    type: boekhoudkundig-bedrag
  output:
  - artefact: Kostprijs per kostendrager
    veld: Direct + indirect = totaal
    type: nieuwe-balanspost
  hoe: |
    1. Bereken per hoofd-centrum een opslag-tarief:
       tarief = totaal indirecte kost centrum / totaal eenheden activiteit centrum.
    2. Vermenigvuldig het tarief met de eenheden activiteit die elke drager
       in dat centrum heeft verbruikt.
    3. Tel direct toegewezen kosten (uit stap 1) en doorberekend indirect bij elkaar
       op volgens [[volledige-kostencalculatie]] §sommatie.
    4. Vergelijk met [[vervaardigingsprijs]] §wettelijke-componenten als de
       kostprijs ook voor balans-voorraadwaardering wordt gebruikt — productie-onafhankelijke
       overhead (commercieel, administratief) hoort dan NIET mee.
  voorbeeld:
    scenario: "Yperse Werkplaats BV — kostprijs van een serie van 1.000 tapijten-standaard die gepasseerd zijn door Spinnerij, Weverij en Confectie."
    substappen:
    - nr: 1
      titel: Directe kosten van de serie
      type: berekening
      data: |
        | Component                       | Bedrag       |
        |---------------------------------|-------------:|
        | Wol (5.000 kg × € 5,00)         | € 25.000     |
        | Directe arbeid Spinnerij (320 u × € 25)  | €  8.000 |
        | Directe arbeid Weverij (200 u × € 25)    | €  5.000 |
        | Directe arbeid Confectie (160 u × € 25)  | €  4.000 |
        | **Totaal directe kosten**       | **€ 42.000** |
    - nr: 2
      titel: Opslag-tarieven per hoofd-centrum (jaarbasis)
      type: berekening
      data: |
        | Centrum   | Indirecte kost | Activiteit   | Tarief        |
        |-----------|---------------:|-------------:|--------------:|
        | Spinnerij | € 200.000      | 8.000 mach-u | € 25/mach-uur |
        | Weverij   | € 320.000      | 6.400 mach-u | € 50/mach-uur |
        | Confectie | € 280.000      | 7.000 arb-u  | € 40/arb-uur  |
    - nr: 3
      titel: Indirecte kost toegewezen aan de serie
      type: berekening
      data: |
        | Centrum   | Activiteit serie | Tarief        | Bedrag       |
        |-----------|-----------------:|--------------:|-------------:|
        | Spinnerij | 200 mach-u       | € 25/mach-uur | €  5.000     |
        | Weverij   | 160 mach-u       | € 50/mach-uur | €  8.000     |
        | Confectie | 160 arb-u        | € 40/arb-uur  | €  6.400     |
        | **Totaal indirect serie**    |               | **€ 19.400** |
    - nr: 4
      titel: Totale kostprijs en kostprijs per eenheid
      type: berekening
      data: |
        Totale kostprijs serie = € 42.000 + € 19.400 = **€ 61.400**

        Kostprijs per tapijt = € 61.400 / 1.000 = **€ 61,40**
  valkuilen:
  - advies: "Toets bij het rapporteren of de kostprijs voor balans-voorraadwaardering wordt gebruikt — neem dan alleen productie-overhead op, niet commercieel/administratief."
    vaak_fout: "Volledige bedrijfskostprijs (inclusief verkoop en administratie) blindelings als voorraadwaarde op de balans plaatsen."
    grondslag: "[[vervaardigingsprijs]] §scope, CBN 132/7 §2.1"
  - advies: "Documenteer activiteit-eenheid (machine-uren, arbeids-uren) per centrum consistent."
    vaak_fout: "In het ene centrum mach-uren als sleutel gebruiken en in het andere arb-uren zonder uitleg — onvergelijkbaar."
    grondslag: "[[verdeelsleutel]] §oorzakelijkheidsprincipe"
  grondslag: "[[volledige-kostencalculatie]] §toewijzing-naar-drager, [[kostprijs-per-eenheid]] §drie-gebruiksdoelen, [[vervaardigingsprijs]] §wettelijke-componenten, KB 21.10.2018 art. 22"
beslisboom:
- vraag: "Wordt de berekende kostprijs gebruikt voor voorraadwaardering op de balans?"
  ja: "Beperk je tot vervaardigingsprijs-componenten (productiekosten); volg [[bepalen-vervaardigingsprijs-kb-21-10-2018]]."
  nee: "Mag volledige bedrijfskostprijs zijn (productie + commercieel + administratief) voor prijszetting of performantie."
- vraag: "Is de productmix homogeen?"
  ja: "Eén opslag-tarief per hoofd-centrum volstaat."
  nee: "Overweeg [[abc-methode]] met activiteit-specifieke cost-drivers."
voorbeelden:
- situatie: "Yperse Werkplaats BV (productie wollen tapijten) berekent kostprijs van een serie tapijten-standaard die drie productiecentra doorloopt."
  conclusie: "Kostprijs van € 61,40 per tapijt waarvan € 42 direct en € 19,40 doorberekend indirect."
  grondslag: "[[volledige-kostencalculatie]] §sommatie, [[kostprijs-per-eenheid]]"
  redenering: "Drie productiecentra met elk een eigen opslag-tarief; trapsgewijze verdeling van indirect levert kost per eenheid op die zowel voor balans (mits scope vervaardigingsprijs) als voor prijszetting bruikbaar is."

id: bepalen-vervaardigingsprijs-kb-21-10-2018
titel: Bepalen van de vervaardigingsprijs volgens KB 21.10.2018 en CBN 132/7
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.8
voortkomend_uit:
  taken:
  - 1.8.taak.1
  kenniselementen:
  - 1.8.II
  - 1.8.II.A
  - 1.8.II.B
  - 1.8.III.A
gebaseerd_op_concepten:
- vervaardigingsprijs
- voorraadwaardering
- volledige-kostencalculatie
- directe-kosten
- indirecte-kosten
- materiaalkosten
- arbeidskosten
- overige-kosten
- kostprijs-per-eenheid
procedure_grondslag:
  wettelijk_pct: 75
  praktijk_pct: 25
  motivering: KB 21.10.2018 art. 22 + CBN 132/7 §2.1 leggen de samenstelling van de vervaardigingsprijs wettelijk vast (aanschaffingsprijs grondstoffen + direct toerekenbare productiekosten + evenredig deel indirecte productiekosten). Vakdoctrine aspect zit in de invulling (welke verdeelsleutel voor indirect, wat is 'evenredig').
stappen:
- nr: 1
  titel: Toetsen of het object onder de vervaardigingsprijs-regel valt
  wat: Bepaal of het te waarderen object goederen in voorraad of bestellingen in uitvoering zijn die door de onderneming zelf zijn vervaardigd.
  waarom: Vervaardigingsprijs geldt voor zelfvervaardigde voorraden en bestellingen in uitvoering; voor aangekochte voorraad geldt aanschaffingsprijs.
  input:
  - artefact: Aard van het voorraadobject
    veld: Type goed (grondstof, halffabricaat, gereed product, BIU)
    type: document
  output:
  - artefact: Toepasbaarheids-conclusie
    veld: Vervaardigingsprijs vs. aanschaffingsprijs
    type: conclusie
  hoe: |
    1. Klasseer het voorraadobject volgens [[voorraadwaardering]] §rubrieken:
       30 grondstoffen, 31 hulpstoffen, 32 goederen in bewerking, 33 gereed product,
       34 handelsgoederen, 37 bestellingen in uitvoering.
    2. Voor 32, 33 en 37 (zelfvervaardigd): vervaardigingsprijs.
    3. Voor 30, 31, 34 (aangekocht): aanschaffingsprijs (= inkoopprijs + bijkomende kosten).
    4. Documenteer keuze in toelichting jaarrekening (waarderingsregels).
  grondslag: "[[voorraadwaardering]] §rubrieken, KB 21.10.2018 art. 22 + 23"
- nr: 2
  titel: Berekenen van de aanschaffingsprijs van grondstoffen
  wat: Bepaal de aanschaffingsprijs van de gebruikte grondstoffen en hulpstoffen die in het product zijn verwerkt.
  waarom: Dit is de eerste verplichte component van de vervaardigingsprijs (KB art. 22 + CBN 132/7 §2.1).
  input:
  - artefact: Materiaal-stuklijst + voorraad-bewegingen
    veld: Kg/m² per eenheid product + waarderings-methode (FIFO, LIFO toegelaten, gewogen gemiddelde)
    type: boekhoudkundig-bedrag
  output:
  - artefact: Grondstoffen-kost per eenheid en per serie
    veld: €
    type: boekhoudkundig-bedrag
  hoe: |
    1. Pas [[materiaalkosten]] §aanschaffingsprijs toe: inkoopprijs + bijkomende
       kosten (transport, invoerrechten, niet-recupereerbare BTW) − kortingen.
    2. Vermenigvuldig per eenheid product met het normverbruik (bv. 5 kg wol per
       tapijt).
    3. Voor voorraadafloop: pas de waarderings-methode toe die in de waarderingsregels
       is vastgelegd (FIFO, gewogen gemiddelde — LIFO toegelaten maar zeldzaam).
  grondslag: "[[materiaalkosten]] §aanschaffingsprijs, CBN 132/7 §2.1, KB 21.10.2018 art. 22"
- nr: 3
  titel: Optellen van direct toerekenbare productiekosten
  wat: Tel alle productiekosten op die rechtstreeks aan het product toe te wijzen zijn — arbeid, energie, machine-uren — en die als gevolg van de productie zijn ontstaan.
  waarom: KB art. 22 verplicht inclusie van direct toerekenbare productiekosten — anders is de vervaardigingsprijs onvolledig.
  input:
  - artefact: Tijdsregistratie directe arbeid + standaarduurtarief (€ 25/u bij Yperse)
    veld: Werkelijke of standaard uren × tarief
    type: boekhoudkundig-bedrag
  - artefact: Direct toewijsbare overige productiekosten
    veld: Energie productiemachine, hulpstoffen, uitval
    type: boekhoudkundig-bedrag
  output:
  - artefact: Direct toewijsbare kost per eenheid
    veld: €
    type: boekhoudkundig-bedrag
  hoe: |
    1. Volg [[arbeidskosten]] §directe-arbeid: brutoloon × (1 + sociale lasten +
       vakantiegeld) — typisch € 25/u inclusief bij Yperse Werkplaats BV.
    2. Verwerk overige direct toerekenbare productiekosten via [[overige-kosten]]
       §direct-toerekenbaar.
    3. Geen commerciële, administratieve of financiële kosten — die behoren NIET
       tot de vervaardigingsprijs (KB art. 22 al.2 expliciet).
  grondslag: "[[arbeidskosten]] §directe-arbeid, [[overige-kosten]] §direct-toerekenbaar, KB 21.10.2018 art. 22, CBN 132/7 §2.1"
- nr: 4
  titel: Toerekenen van het 'evenredig deel' indirecte productiekosten
  wat: Bepaal welk deel van de indirecte productiekosten (productie-overhead) toe te rekenen valt aan het product, op een redelijke en consistente basis.
  waarom: KB art. 22 stelt dat 'een evenredig deel' van de productiekosten die slechts onrechtstreeks aan het product kunnen worden toegerekend, in de vervaardigingsprijs moet zitten — behalve als de onderneming opteert voor exclusie en dat motiveert in de toelichting.
  input:
  - artefact: Indirecte productiekosten per kostencentrum uit [[toepassen-volledige-kostencalculatie]]
    veld: Bedrag + activiteit
    type: boekhoudkundig-bedrag
  - artefact: Bezettingsgraad
    veld: Werkelijk versus normvolume
    type: percentage
  output:
  - artefact: Toegerekend indirect deel per eenheid
    veld: €
    type: boekhoudkundig-bedrag
  hoe: |
    1. Gebruik de verdeelsleutels van [[toepassen-volledige-kostencalculatie]] stap 4
       om indirecte productiekost aan de drager toe te wijzen.
    2. CBN 132/7 §2.1 staat exclusie van indirecte productiekosten toe op
       voorwaarde van expliciete vermelding in toelichting + consistente toepassing.
    3. Onderbezetting: kost van leegloop (vaste kosten × (norm-volume − werkelijk
       volume) / norm-volume) hoort NIET in de vervaardigingsprijs — die wordt als
       periodekost behandeld.
    4. Het 'evenredig deel' verbiedt dat onderbezetting alle voorraad-eenheden
       belast met de niet-geproduceerde overhead.
  voorbeeld:
    scenario: "Yperse Werkplaats BV — vervaardigingsprijs per tapijt-standaard (serie van 1.000)."
    substappen:
    - nr: 1
      titel: Componenten vervaardigingsprijs
      type: berekening
      data: |
        | Component                                  | Bedrag        |
        |--------------------------------------------|--------------:|
        | Grondstoffen wol (5 kg × € 5,00)           | €  25,00      |
        | Direct toerekenbare arbeid (0,68 u × € 25) | €  17,00      |
        | Indirect toegerekend productie-deel (zie stap 4 van [[toepassen-volledige-kostencalculatie]]) | €  19,40 |
        | **Vervaardigingsprijs per tapijt**          | **€  61,40**  |
    - nr: 2
      titel: Voor balans-voorraadwaardering
      type: opmerking
      data: |
        Geen commerciële of administratieve kost meegerekend (uit het scope-verbod
        van KB art. 22 al.2). Onderbezetting van Confectie 5 % → € 14.000 jaar-kost
        van leegloop blijft buiten de voorraadwaardering en wordt periodekost.
  valkuilen:
  - advies: "Sluit commerciële, administratieve en financiële kosten expliciet uit van de vervaardigingsprijs."
    vaak_fout: "Volledige bedrijfskostprijs op voorraad zetten — kunstmatig opgeblazen voorraad-waarde, schendt KB art. 22 al.2."
    grondslag: "[[vervaardigingsprijs]] §scope-verbod, KB 21.10.2018 art. 22 al.2"
  - advies: "Pas een 'evenredig' deel toe — corrigeer voor onderbezetting via norm-volume."
    vaak_fout: "Werkelijke totale indirecte productiekost delen door werkelijk volume — onderbezetting wordt zo onterecht aan voorraad toegerekend."
    grondslag: "[[vervaardigingsprijs]] §evenredigheid, CBN 132/7 §2.1"
  grondslag: "[[vervaardigingsprijs]] §evenredig-deel-indirect, CBN 132/7 §2.1, KB 21.10.2018 art. 22"
- nr: 5
  titel: Opnemen, toetsen en toelichten
  wat: Boek de voorraad in tegen vervaardigingsprijs, toets aan eventuele lagere realisatiewaarde, en vermeld de waarderings-methode in de toelichting.
  waarom: De jaarrekening vereist (i) opname tegen vervaardigingsprijs of lagere marktwaarde, (ii) consistente toepassing, en (iii) transparantie via de waarderingsregels.
  input:
  - artefact: Vervaardigingsprijs per eenheid uit stap 4
    veld: € per eenheid + voorraadtelling
    type: boekhoudkundig-bedrag
  - artefact: Marktprijs of netto-realisatiewaarde
    veld: Verkoopprijs − verkoopkosten
    type: boekhoudkundig-bedrag
  output:
  - artefact: Voorraad-waardering op balans + toelichting waarderingsregels
    veld: Saldo + methode-omschrijving
    type: nieuwe-balanspost
  hoe: |
    1. Bereken voorraad-saldo: aantal × vervaardigingsprijs per eenheid.
    2. Toets aan netto-realisatiewaarde volgens [[voorraadwaardering]] §lagere-marktwaarde:
       waardeer aan vervaardigingsprijs OF lagere markt indien dat lager is.
    3. Bij lagere markt: boek waardevermindering (klasse 631) — geen blijvende
       upgrading na herstel.
    4. Documenteer in toelichting: gekozen methode (FIFO/LIFO/gewogen gemiddelde),
       behandeling indirecte productiekosten (inclusief of exclusief met motivering),
       behandeling onderbezetting.
  grondslag: "[[voorraadwaardering]] §lagere-marktwaarde, KB 21.10.2018 art. 28 + 100, CBN 132/7"
beslisboom:
- vraag: "Is het object zelfvervaardigd?"
  ja: "Vervaardigingsprijs van toepassing."
  nee: "Aanschaffingsprijs (KB art. 23)."
- vraag: "Opteert de onderneming voor exclusie van indirecte productiekosten?"
  ja: "Toegestaan onder CBN 132/7 §2.1, mits expliciet in toelichting + consistente toepassing."
  nee: "Evenredig deel indirect verplicht inbegrepen."
- vraag: "Is netto-realisatiewaarde lager dan vervaardigingsprijs?"
  ja: "Boek waardevermindering (klasse 631); voorraad op balans aan lagere waarde."
  nee: "Behoud vervaardigingsprijs."
voorbeelden:
- situatie: "Yperse Werkplaats BV — eindvoorraad gereed product 2.000 tapijten-standaard op balansdatum."
  conclusie: "Voorraad-waarde = 2.000 × € 61,40 = € 122.800; geen waardevermindering nodig (marktprijs € 60 = boven vervaardigingsprijs)."
  grondslag: "[[vervaardigingsprijs]], [[voorraadwaardering]] §lagere-marktwaarde"
  redenering: "Direct (€ 42) + indirect-toerekenbaar productie-deel (€ 19,40) volgens KB art. 22. Geen administratieve/commerciële kost meegerekend; eventueel deel onderbezetting is periodekost."

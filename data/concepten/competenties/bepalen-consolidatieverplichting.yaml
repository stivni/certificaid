id: bepalen-consolidatieverplichting
titel: Bepalen of een vennootschap een geconsolideerde jaarrekening moet opstellen
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.4
voortkomend_uit:
  taken:
  - 1.4.taak.1
  kenniselementen:
  - 1.4.I.C
  - 1.4.I.B
  - 1.4.II.B
gebaseerd_op_concepten:
- consolidatieverplichting
- moedervennootschap
- controle
- consortium
- vrijstelling-subconsolidatie
- groottecriteria-consolidatie
- groep-van-beperkte-omvang
procedure_grondslag:
  wettelijk_pct: 90
  praktijk_pct: 10
  motivering: De plicht volgt rechtstreeks uit WVV art. 3:22 en volgende. Vrijstellingen staan in WVV art. 1:26 en KB WVV. Enkel de feitelijke beoordeling van controle-in-feite en de toetsing aan groottecriteria vragen oordeel.
stappen:
- nr: 1
  titel: Vaststellen of de entiteit als vennootschap kwalificeert
  wat: Ga na of de entiteit rechtspersoonlijkheid heeft en als vennootschap kwalificeert.
  waarom: Alleen vennootschappen met rechtspersoonlijkheid kunnen moedervennootschap zijn.
  input:
  - artefact: Statuten van de entiteit
    veld: Juridische vorm
    type: document
  - artefact: KBO-uittreksel
    veld: Rechtsvorm
    type: document
  output:
  - artefact: Notitie aan dossier
    veld: Bevestiging vennootschapsstatus
    type: conclusie
  hoe: |
    1. Open de statuten van de entiteit (bv. Aurelia Holding NV).
    2. Lees de juridische vorm (NV, BV, CV, maatschap zonder rechtspersoonlijkheid, ...).
    3. Vergelijk met de definitie van moedervennootschap in [[moedervennootschap]] §definitie.
    4. Conclusie: vennootschap met rechtspersoonlijkheid → ga naar stap 2. Geen rechtspersoonlijkheid of natuurlijk persoon → geen consolidatieplicht op deze entiteit (mogelijk wel via consortium-lid).
  valkuilen:
  - advies: Een natuurlijke persoon is nooit zelf moedervennootschap.
    vaak_fout: Aannemen dat Pieter Vermeulen die meerderheidsstemrechten heeft in meerdere vennootschappen, zelf consolidatieplichtig is.
    grondslag: "[[consolidatieverplichting]] §natuurlijke personen"
  - advies: Een maatschap zonder rechtspersoonlijkheid is geen moeder.
    vaak_fout: Een maatschap zonder rechtspersoonlijkheid behandelen als moedervennootschap.
    grondslag: "[[consolidatieverplichting]] §rechtspersoonlijkheid"
  grondslag: "[[moedervennootschap]] §definitie, WVV art. 1:15"
- nr: 2
  titel: Vaststellen of er controle bestaat over een of meer dochters
  wat: Ga na of de vennootschap controle uitoefent over een of meer andere vennootschappen.
  waarom: Zonder controle is de vennootschap geen moeder en hoeft zij niet te consolideren.
  input:
  - artefact: Aandelenregister
    veld: Stemrechten per aandeelhouder
    type: percentage
  - artefact: Aandeelhoudersovereenkomsten
    veld: Afspraken over benoemingen, vetorechten
    type: document
  - artefact: Notulen van laatste twee algemene vergaderingen
    veld: Aanstelling bestuurders met effectieve stemrechten
    type: document
  output:
  - artefact: Lijst van gecontroleerde vennootschappen
    veld: Aard van controle (in rechte, in feite, exclusief, gezamenlijk)
    type: conclusie
  hoe: |
    1. Open het aandelenregister van Aurelia Holding NV en zoek per deelneming het stemrechtpercentage.
    2. Bij meer dan 50 % stemrechten: onweerlegbaar vermoeden van controle in rechte (zie [[exclusieve-controle]] §controle-in-rechte).
    3. Bij precies 50 % of minder: open de aandeelhoudersovereenkomsten en check op vetorechten of benoemingsrechten.
    4. Open de notulen van de laatste twee algemene vergaderingen (AV) van de doelvennootschap. Heeft Aurelia de meerderheid van bestuurders aangesteld met haar effectieve stemrechten? Dan is er controle in feite (zie [[exclusieve-controle]] §controle-in-feite).
    5. Maak een lijst van alle gecontroleerde vennootschappen met de aard van controle.
  valkuilen:
  - advies: Tel ook controle-in-feite mee, niet alleen het aandelenpercentage.
    vaak_fout: Aannemen dat controle altijd meer dan 50 % stemrechten vereist.
    grondslag: "[[controle]] §controle-in-feite"
  grondslag: "[[controle]] §soorten controle, WVV art. 1:14 tot 1:19"
- nr: 3
  titel: Onderzoeken of er een consortium is
  wat: Ga na of meerdere vennootschappen onder centrale leiding staan zonder onderlinge moeder-dochter-relatie.
  waarom: Bij een consortium ontbreekt een verticale moeder en rust de plicht gezamenlijk op de leden (WVV art. 3:24).
  input:
  - artefact: Aandeelhoudersstructuur van de betrokken vennootschappen
    veld: Wie controleert wie?
    type: document
  - artefact: Aandeelhoudersovereenkomsten of beleidsdocumenten
    veld: Aanwijzingen voor centrale leiding
    type: document
  output:
  - artefact: Conclusie over groep-structuur
    veld: Verticale groep met moeder OF horizontale groep (consortium)
    type: conclusie
  hoe: |
    1. Teken de aandeelhoudersstructuur uit: wie bezit aandelen in wie?
    2. Is er één rechtspersoon die de andere(n) controleert? → verticale groep, ga naar stap 4 met die moeder.
    3. Staan meerdere vennootschappen onder gemeenschappelijke leiding (vaak natuurlijke persoon zoals Pieter Vermeulen) zonder dat zij elkaar controleren? → consortium.
    4. Bij consortium: de plicht rust gezamenlijk bij Industria Antwerpen NV en Jachthaven Jezus-Eik NV (zie [[consortium]] §gezamenlijke-plicht).
  grondslag: "[[consortium]] §definitie, WVV art. 1:19 en 3:24"
- nr: 4
  titel: Toetsen aan de vrijstelling 'groep van beperkte omvang'
  wat: Bereken de geconsolideerde of geaggregeerde cijfers en toets aan de drempelwaarden.
  waarom: Een kleine groep is in beginsel vrijgesteld van consolidatie (WVV art. 1:26 §1).
  input:
  - artefact: Enkelvoudige jaarrekeningen van alle groepsvennootschappen
    veld: Omzet, balanstotaal, jaargemiddelde werknemers
    type: boekhoudkundig-bedrag
  output:
  - artefact: Toets-conclusie
    veld: Vrijgesteld of niet
    type: conclusie
  hoe: |
    1. Verzamel de enkelvoudige jaarrekeningen van Aurelia Holding NV en al haar dochters.
    2. Bereken op geaggregeerde basis (som van enkelvoudige cijfers, vóór eliminaties): jaaromzet, balanstotaal en jaargemiddelde werknemers.
    3. Vergelijk met de drempelwaarden uit [[groottecriteria-consolidatie]] §drempels (cijferzakboekje).
    4. Overschreden de groep meer dan één criterium gedurende twee opeenvolgende boekjaren? → vrijstelling vervalt, ga naar stap 5.
    5. Overschreden ten hoogste één criterium? → groep van beperkte omvang, vrijgesteld (tenzij beursnotering, zie [[groep-van-beperkte-omvang]] §uitzondering-notering).
  voorbeeld:
    scenario: "Aurelia Holding NV consolideert met haar dochter Gent Garantie BV. Geaggregeerde cijfers: omzet 20 mln EUR, balanstotaal 12 mln EUR, jaargemiddelde werknemers 180."
    substappen:
    - nr: 1
      titel: Toets aan drempels groep van beperkte omvang
      type: berekening
      data: |
        | Criterium                     | Geaggregeerd | Drempel (cijferzakboekje) | Overschreden? |
        |-------------------------------|-------------:|--------------------------:|:--------------|
        | Jaaromzet                     | 20 mln EUR   | 34 mln EUR                | Nee           |
        | Balanstotaal                  | 12 mln EUR   | 17 mln EUR                | Nee           |
        | Jaargemiddelde werknemers     | 180          | 250                       | Nee           |
    - nr: 2
      titel: Conclusie
      type: opmerking
      data: |
        Geen enkel criterium overschreden → groep van beperkte omvang.
        Vrijgesteld van consolidatie (mits geen notering op gereglementeerde markt).
  valkuilen:
  - advies: "'Geaggregeerde basis' is enkel een berekeningswijze, geen vooraf bestaande consolidatie."
    vaak_fout: Aannemen dat 'op geconsolideerde basis' betekent dat er al een geconsolideerde jaarrekening moet bestaan vóór de toets.
    grondslag: "[[groottecriteria-consolidatie]] §toetswijze"
  grondslag: "[[groep-van-beperkte-omvang]] §drempels, WVV art. 1:26"
- nr: 5
  titel: Toetsen aan de vrijstelling van subconsolidatie
  wat: Ga na of een hogere moeder al een gelijkwaardige geconsolideerde jaarrekening opstelt.
  waarom: Subconsolidatie wordt vermeden als hogerop al wordt geconsolideerd, tenzij er beursnotering is.
  input:
  - artefact: Aandeelhoudersstructuur op hoger niveau
    veld: Bestaat er een hogere moeder?
    type: document
  - artefact: Geconsolideerde jaarrekening van de hogere moeder
    veld: Wettelijke gelijkwaardigheid, controle, openbaarheid
    type: document
  output:
  - artefact: Vrijstellings-conclusie
    veld: Submoeder is wel of niet vrijgesteld
    type: conclusie
  hoe: |
    1. Identificeer de hogere moeder boven Aurelia Holding NV (bv. Kappers Köln GmbH met 95 % in Aurelia).
    2. Vraag de geconsolideerde jaarrekening van Kappers Köln GmbH op.
    3. Toets aan de drie voorwaarden uit [[vrijstelling-subconsolidatie]] §voorwaarden: gelijkwaardigheid (EU-richtlijn 2013/34 of equivalent), wettelijke controle door commissaris, openbaarmaking.
    4. Check of geen enkel lid van de subconsolidatiekring (Aurelia + Brugse Brouwerij BV + andere dochters) genoteerd is op een gereglementeerde markt.
    5. Alle voorwaarden vervuld? → Aurelia is vrijgesteld van subconsolidatie. Een voorwaarde niet vervuld? → wel consolideren.
  valkuilen:
  - advies: Bij beursnotering vervalt de vrijstelling altijd.
    vaak_fout: Aannemen dat de vrijstelling geldt ongeacht of een dochter genoteerd is.
    grondslag: "[[vrijstelling-subconsolidatie]] §uitzondering-notering"
  grondslag: "[[vrijstelling-subconsolidatie]] §voorwaarden, WVV art. 3:26"
- nr: 6
  titel: Formuleren van de eindconclusie
  wat: Stel de eindconclusie op voor de cliënt op basis van stappen 1 tot 5.
  waarom: De cliënt heeft een ondubbelzinnig antwoord nodig over zijn consolidatieplicht.
  input:
  - artefact: Werkpapieren stappen 1-5
    veld: Per toets een ja/nee-conclusie
    type: conclusie
  output:
  - artefact: Conclusienota voor cliënt
    veld: Eindkwalificatie van consolidatieplicht
    type: document
  hoe: |
    1. Vat de conclusies van stappen 1 tot 5 samen in één tabel.
    2. Combineer tot één eindconclusie:
       - Geen rechtspersoonlijkheid of geen controle → niet consolidatieplichtig.
       - Groep van beperkte omvang (zonder notering) → vrijgesteld.
       - Subconsolidatie-vrijstelling van toepassing → vrijgesteld.
       - Anders → consolidatieplichtig als moeder of als consortium-lid samen met andere leden.
    3. Documenteer de gronden voor de conclusie in het cliëntdossier.
  grondslag: "[[consolidatieverplichting]] §eindkwalificatie (praktijk-synthese)"
beslisboom:
- vraag: Heeft de entiteit rechtspersoonlijkheid en is zij een vennootschap?
  ja: Ga naar volgende vraag.
  nee: Geen consolidatieplicht — meestal consortium of geen plicht.
- vraag: Bestaat controle (in rechte of in feite) over één of meer dochters?
  ja: Ga naar volgende vraag (verticale moeder).
  nee: "Onderzoek of er een consortium is. Zo niet: geen consolidatieplicht."
- vraag: Overschrijdt de groep meer dan één van de groottecriteria (WVV art. 1:26 §1) op geconsolideerde of geaggregeerde basis?
  ja: Vrijstelling 'groep van beperkte omvang' vervalt; ga naar volgende vraag.
  nee: Vrijgesteld als groep van beperkte omvang (tenzij notering op gereglementeerde markt).
- vraag: Bestaat hogerop een moeder die al een gelijkwaardige geconsolideerde jaarrekening opstelt, laat controleren en openbaar maakt, en is geen lid van de subconsolidatiekring beursgenoteerd?
  ja: Vrijstelling van subconsolidatie van toepassing — geen plicht voor de submoeder.
  nee: Consolidatieplichtig.
voorbeelden:
- situatie: "Aurelia Holding NV bezit 90 % van de stemrechten in Brugse Brouwerij BV. Brugse oefent een industriële activiteit uit. Aurelia kan via haar stemrechten de meerderheid van bestuurders aanstellen."
  conclusie: "Aurelia is consolidatieplichtig: zij is moeder met exclusieve controle in rechte over Brugse Brouwerij BV."
  grondslag: "[[moedervennootschap]] §controlebevoegdheid; [[exclusieve-controle]] §onweerlegbaar-vermoeden"
  redenering: Stemrechtenmeerderheid (> 50 %) levert het onweerlegbaar vermoeden van controle in rechte op. Aurelia moet Brugse integraal opnemen, tenzij een vrijstelling van toepassing is.
- situatie: "Pieter Vermeulen bezit meerderheidsstemrechten in zustervennootschappen Industria Antwerpen NV en Jachthaven Jezus-Eik NV. Beide staan onder gemeenschappelijke leiding. Er is geen moeder-dochter-relatie tussen Industria en Jachthaven."
  conclusie: "Geen consolidatieplicht voor Pieter Vermeulen zelf. Industria en Jachthaven vormen vermoedelijk een consortium en zijn samen consolidatieplichtig."
  grondslag: "[[consolidatieverplichting]] §natuurlijke-personen; [[consortium]] §horizontale-groep"
  redenering: Een natuurlijke persoon kan geen moeder zijn. Bij centrale leiding zonder onderlinge controle ontstaat een consortium. WVV art. 3:24 legt de plicht op de leden samen.

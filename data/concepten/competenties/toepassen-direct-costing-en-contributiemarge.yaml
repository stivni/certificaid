id: toepassen-direct-costing-en-contributiemarge
titel: Toepassen van direct costing en contributiemarge-analyse
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.8
voortkomend_uit:
  taken:
  - 1.8.taak.1
  kenniselementen:
  - 1.8.III
  - 1.8.III.B
  - 1.8.III.E
  - 1.8.II
  - 1.8.II.A
gebaseerd_op_concepten:
- direct-costing
- contributiemarge
- variabele-kosten
- vaste-kosten
- volledige-kostencalculatie
- costing-methodes-vergelijking
- marginale-kostprijs
- opportuniteitskost
- kostprijs-per-eenheid
procedure_grondslag:
  wettelijk_pct: 10
  praktijk_pct: 90
  motivering: Direct costing en contributiemarge-analyse zijn management-accounting-doctrine zonder Belgische wettelijke verankering. Wettelijk raakvlak is uitsluitend dat CBN 2012/15 direct costing aanvaardt voor analytische rapportering mits voorraad op de balans aan vervaardigingsprijs gewaardeerd blijft. Vereist mens-review wegens praktijk_pct > 70%.
stappen:
- nr: 1
  titel: Identificeren van variabele versus vaste kosten
  wat: "Klasseer alle kostensoorten op de gedrags-as: variabel (verandert mee met productievolume) of vast (blijft gelijk binnen de relevant range)."
  waarom: De hele direct-costing-logica steunt op deze tweedeling — verkeerde classificatie verstoort de contributiemarge.
  input:
  - artefact: Kostenoverzicht
    veld: Bedragen per kostensoort, eventueel ook drijvers
    type: boekhoudkundig-bedrag
  output:
  - artefact: Lijst gesplitst variabel/vast
    veld: Bedrag + classificatie + drijver
    type: document
  hoe: |
    1. Pas [[variabele-kosten]] §gedrag toe: kost evolueert evenredig met output
       (grondstoffen, directe arbeid, energie productiemachines).
    2. Pas [[vaste-kosten]] §gedrag toe: kost blijft gelijk binnen de relevant range
       (huur, afschrijvingen, leiding-salarissen).
    3. Behandel semi-variabele kosten apart: splits in vast deel + variabel deel
       (bv. energie-grondtarief + verbruik) met de hoog-laag-methode.
    4. Documenteer het gedrags-bereik: tot welk volume blijft 'vast' werkelijk vast?
  valkuilen:
  - advies: "Onderscheid steeds de gedrag-as (variabel/vast) van de toewijsbaarheids-as (direct/indirect)."
    vaak_fout: "Variabel gelijkstellen met direct of vast gelijkstellen met indirect — twee assen door elkaar halen."
    grondslag: "[[directe-kosten]] §verschil-met-variabele, [[costing-methodes-vergelijking]] §twee-assen"
  grondslag: "[[variabele-kosten]] §gedrag, [[vaste-kosten]] §gedrag"
- nr: 2
  titel: Berekenen van de contributiemarge per eenheid
  wat: Bereken contributiemarge = verkoopprijs − variabele kost per eenheid.
  waarom: De contributiemarge toont wat elke verkochte eenheid bijdraagt aan dekking van vaste kosten en winst.
  input:
  - artefact: Verkoopprijslijst
    veld: Prijs per product
    type: boekhoudkundig-bedrag
  - artefact: Variabele kostprijs uit stap 1
    veld: Bedrag per eenheid
    type: boekhoudkundig-bedrag
  output:
  - artefact: Contributiemarge per eenheid
    veld: € per stuk + marge-percentage
    type: percentage
  hoe: |
    1. Bereken volgens [[contributiemarge]] §per-eenheid:
       contributiemarge = verkoopprijs − variabele kost per eenheid.
    2. Bereken het contributiemarge-percentage:
       contributiemarge-% = contributiemarge / verkoopprijs.
    3. Onderscheid contributiemarge per eenheid (vergelijk producten) van totale
       contributiemarge (verkoopvolume × marge per eenheid).
    4. Voor multi-product-context: bereken een gewogen gemiddelde contributiemarge
       op basis van de productmix.
  voorbeeld:
    scenario: "Yperse Werkplaats BV — tapijt-standaard met verkoopprijs € 60 en variabele kost € 13 per stuk."
    substappen:
    - nr: 1
      titel: Berekening contributiemarge per eenheid
      type: berekening
      data: |
        Contributiemarge per tapijt = € 60 − € 13 = **€ 47**

        Contributiemarge-% = € 47 / € 60 = **78,3 %**
    - nr: 2
      titel: Totale contributiemarge bij verkoop 25.000 stuks
      type: berekening
      data: |
        Totale contributiemarge = 25.000 × € 47 = **€ 1.175.000**

        Dekt vaste kosten € 800.000 → winst = € 375.000.
  grondslag: "[[contributiemarge]] §per-eenheid, [[contributiemarge]] §percentage"
- nr: 3
  titel: Direct-costing-resultatenrekening opstellen
  wat: "Herorganiseer de resultatenrekening volgens direct-costing-logica: omzet − variabele kost = contributiemarge − vaste kost = bedrijfsresultaat."
  waarom: De direct-costing-volgorde maakt zichtbaar hoe het volume de winst stuurt, en welk vast kostenniveau gedekt moet worden.
  input:
  - artefact: Verkoop- en productiegegevens periode
    veld: Volume × prijs en variabele en vaste kosten
    type: boekhoudkundig-bedrag
  output:
  - artefact: Direct-costing-RR
    veld: Drie blokken
    type: nieuwe-balanspost
  hoe: |
    1. Bouw de drie blokken zoals [[direct-costing]] §RR-structuur voorschrijft:
       omzet − totale variabele kosten = totale contributiemarge.
       − totale vaste kosten = bedrijfsresultaat.
    2. Vergelijk met de full-costing-RR via [[costing-methodes-vergelijking]] §RR-verschil:
       voorraadwijzigingen kunnen het resultaat in beide methoden anders weergeven.
    3. Belangrijk: voor de balans-voorraadwaardering gebruikt België de vervaardigingsprijs;
       de direct-costing-RR is een interne rapporteringsvorm, geen jaarrekening.
  valkuilen:
  - advies: "Houd de direct-costing-rapportering strikt intern; voor de balans hanteer je vervaardigingsprijs."
    vaak_fout: "Voorraden onder direct costing op de balans plaatsen — onder Belgisch jaarrekeningenrecht niet toegelaten als productie-overhead niet mee gewaardeerd is."
    grondslag: "[[vervaardigingsprijs]] §wettelijke-componenten, CBN 2012/15"
  grondslag: "[[direct-costing]] §RR-structuur, [[costing-methodes-vergelijking]] §RR-verschil"
- nr: 4
  titel: Toepassen voor beslissingsanalyse (productmix, prijsondergrens, opportuniteit)
  wat: "Gebruik contributiemarge om typische korte-termijn-beslissingen te onderbouwen: welke producten promoten, minimumprijs voor een extra order, opportuniteitskost van een knelpunt."
  waarom: Bij korte-termijn-keuzes zijn vaste kosten meestal sunk; relevant is de marginale of contributiebijdrage.
  input:
  - artefact: Contributiemarges per product uit stap 2
    veld: € per stuk
    type: boekhoudkundig-bedrag
  - artefact: Knelpuntcapaciteit + alternatieve orders
    veld: Beperkende factor (uren, m², kg grondstof)
    type: boekhoudkundig-bedrag
  output:
  - artefact: Beslissingsadvies
    veld: Productmix, minimumprijs of accepteer-order-conclusie
    type: conclusie
  hoe: |
    1. Voor productmix bij capaciteitsbeperking: bereken contributiemarge per
       eenheid van de schaarse resource (€ marge / machine-uur) volgens
       [[contributiemarge]] §per-schaarse-resource. Promoot het product met de hoogste marge.
    2. Voor minimumprijs bij extra order: gebruik [[marginale-kostprijs]] §korte-termijn —
       extra order is winstgevend zodra prijs > variabele kost per eenheid + inkrementele vaste kost.
    3. Bouw [[opportuniteitskost]] in als de extra order een andere order verdringt:
       relevante kost = variabele kost + verdrongen contributiemarge.
    4. Let op: deze logica werkt enkel korte termijn; op lange termijn moeten ook
       vaste kosten gedekt worden.
  voorbeeld:
    scenario: "Yperse Werkplaats BV ontvangt een eenmalige order van 500 tapijten aan € 35 per stuk. Variabele kost € 13; vaste kosten € 800.000 zijn reeds gedekt door normale productie. Geen verdrongen order."
    substappen:
    - nr: 1
      titel: Bijdrage van de extra order
      type: berekening
      data: |
        Contributiemarge extra order = 500 × (€ 35 − € 13) = 500 × € 22 = **€ 11.000**
    - nr: 2
      titel: Beslissing
      type: opmerking
      data: |
        Aanvaarden — vaste kosten zijn sunk, € 11.000 extra winst.
        Indien een gewone order van 500 stuks aan € 60 (marge € 47) verdrongen zou
        worden: opportuniteitskost = 500 × € 47 = € 23.500. Dan extra-order weigeren
        (€ 11.000 < € 23.500).
  grondslag: "[[contributiemarge]] §per-schaarse-resource, [[marginale-kostprijs]] §korte-termijn, [[opportuniteitskost]] §beslissingsregel"
beslisboom:
- vraag: "Gaat het om voorraadwaardering voor de balans?"
  ja: "Gebruik full costing / vervaardigingsprijs; direct costing is hier niet toegestaan."
  nee: "Direct costing + contributiemarge geschikt voor interne sturing."
- vraag: "Verdringt een extra order een bestaande order?"
  ja: "Reken opportuniteitskost in: relevante kost = variabele kost + verdrongen marge."
  nee: "Relevante kost = variabele kost alleen."
voorbeelden:
- situatie: "Yperse Werkplaats BV evalueert een spot-order van 500 tapijten aan € 35."
  conclusie: "Aanvaarden bij vrije capaciteit (€ 11.000 winst); weigeren bij verdringing van gewone order met marge € 47 (opportuniteitskost € 23.500)."
  grondslag: "[[opportuniteitskost]], [[marginale-kostprijs]] §korte-termijn"
  redenering: "Korte-termijn beslissing: vaste kosten zijn sunk, relevant is variabele kost ± opportuniteitskost."

id: kwalificeren-boekhoudplichtige-onderneming
titel: Kwalificeren of een onderneming boekhoudplichtig is en welk type boekhouding zij moet voeren
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.2
voortkomend_uit:
  taken: []
  kenniselementen:
  - 1.2.III
  - 1.2.III.B
  - 1.2.III.C
  - 1.2.I.C
gebaseerd_op_concepten:
- boekhoudplichtige-onderneming
- dubbel-boekhouden
- vereenvoudigde-boekhouding
- regelmatige-boekhouding
- minimum-algemeen-rekeningenstelsel
- bewaartermijn-boekhouding
- wetboek-economisch-recht-boek-iii
procedure_grondslag:
  wettelijk_pct: 90
  praktijk_pct: 10
  motivering: De boekhoudplicht en de keuze tussen dubbele en vereenvoudigde boekhouding zijn strikt geregeld in WER Boek III en het uitvoerings-KB van 21 oktober 2018. Enkel het inschatten van de feitelijke omzet en de eventuele opportuniteit van vrijwillig dubbele boekhouding vragen praktijkoordeel.
stappen:
- nr: 1
  titel: Identificeer de juridische vorm en de aard van de activiteit
  wat: Bepaal of het om een rechtspersoon, een natuurlijke persoon-zelfstandige of een entiteit zonder rechtspersoonlijkheid gaat.
  waarom: Het toepassingsgebied van WER Boek III hangt af van de vorm — alleen 'ondernemingen' in de zin van WER art. I.1 vallen eronder.
  input:
  - artefact: Statuten of inschrijving in de Kruispuntbank van Ondernemingen (KBO)
    veld: Juridische vorm + activiteitscode
    type: document
  output:
  - artefact: Werknotitie
    veld: Vorm-categorie (rechtspersoon-vennootschap / VZW / eenmanszaak / vrij beroep / maatschap)
    type: conclusie
  hoe: |
    1. Open het KBO-uittreksel van bv. Praktijk Persenaire of Meubelzaak Mertens BV.
    2. Lees de juridische vorm — onderscheid:
       - vennootschap met rechtspersoonlijkheid (BV, NV, CV, ...);
       - VZW, IVZW, stichting;
       - natuurlijke persoon-zelfstandige of vrij beroep;
       - maatschap zonder rechtspersoonlijkheid.
    3. Toets aan de ondernemingsdefinitie van [[boekhoudplichtige-onderneming]] §definitie. Conclusie: valt deze entiteit onder WER Boek III?
  valkuilen:
  - advies: Een maatschap zonder rechtspersoonlijkheid is wél een onderneming en is boekhoudplichtig.
    vaak_fout: Aannemen dat 'geen rechtspersoonlijkheid' gelijkstaat aan 'geen boekhoudplicht'.
    grondslag: "[[boekhoudplichtige-onderneming]] §maatschap"
  grondslag: "[[boekhoudplichtige-onderneming]] §definitie, WER art. I.1.1°"
- nr: 2
  titel: Beoordeel de drempels voor vereenvoudigde boekhouding
  wat: Toets de jaaromzet aan de WER-drempel die de keuze tussen dubbele en vereenvoudigde boekhouding bepaalt.
  waarom: Onder de wettelijke drempel mag een natuurlijke persoon of zeer kleine VOF een vereenvoudigde boekhouding voeren — geen dubbele boekhouding verplicht.
  input:
  - artefact: Resultaatcijfers vorig boekjaar of geprojecteerde omzet
    veld: Omzet (excl. BTW)
    type: boekhoudkundig-bedrag
  output:
  - artefact: Werknotitie
    veld: Verplichting tot dubbele OF vereenvoudigde boekhouding
    type: conclusie
  hoe: |
    1. Lees de actuele omzet-drempel uit [[vereenvoudigde-boekhouding]] §drempel (cijferzakboekje).
    2. Vergelijk met de gerealiseerde omzet van het vorige boekjaar van Praktijk Persenaire.
    3. Onder de drempel én natuurlijk persoon / kleine VOF? → vereenvoudigde boekhouding toegelaten.
    4. Boven de drempel of rechtspersoon? → dubbele boekhouding verplicht ([[dubbel-boekhouden]] §verplichting).
  voorbeeld:
    scenario: "Praktijk Persenaire (eenmanszaak vrij beroep, omzet vorig jaar € 280.000) en Meubelzaak Mertens BV (omzet € 4.500.000) — vergelijking."
    substappen:
    - nr: 1
      titel: Toets drempel
      type: berekening
      data: |
        | Cliënt | Vorm | Omzet | Drempel WER | Regime |
        |---|---|---:|---:|---|
        | Praktijk Persenaire | eenmanszaak | € 280.000 | € 500.000 | Vereenvoudigde boekhouding toegelaten |
        | Meubelzaak Mertens BV | rechtspersoon BV | € 4.500.000 | n.v.t. (rechtspersoon) | Dubbele boekhouding verplicht |
    - nr: 2
      titel: Conclusie
      type: opmerking
      data: |
        Rechtspersoon: drempel speelt niet — altijd dubbele boekhouding.
        Eenmanszaak: drempel beslist.
  valkuilen:
  - advies: De drempel speelt enkel voor natuurlijke personen en kleine VOF — een BV moet altijd dubbele boekhouding voeren, ongeacht omzet.
    vaak_fout: Een BV met omzet onder € 500.000 toelaten tot vereenvoudigde boekhouding.
    grondslag: "[[vereenvoudigde-boekhouding]] §toepassingsgebied"
  grondslag: "[[vereenvoudigde-boekhouding]] §drempel, [[dubbel-boekhouden]] §verplichting"
- nr: 3
  titel: Specificeer de inrichtings-eisen
  wat: Stel vast welke boeken en welk rekeningenstelsel de onderneming moet bijhouden.
  waarom: De wet schrijft niet alleen het type boekhouding voor, maar ook de instrumenten (centraal boek, dagboeken, MAR).
  input:
  - artefact: Conclusie stap 2
    veld: Regime (dubbel / vereenvoudigd)
    type: conclusie
  output:
  - artefact: Inrichtingschecklist
    veld: Lijst van vereiste boeken + rekeningenstelsel
    type: document
  hoe: |
    1. Bij dubbele boekhouding: stel het [[minimum-algemeen-rekeningenstelsel]] §opbouw op (zeven klassen 1-7, klasse 0 voor buiten balans), aangepast aan de bedrijfssector.
    2. Bepaal de dagboeken: aankoopdagboek, verkoopdagboek, financieel dagboek, eventueel hulpdagboeken — zie [[regelmatige-boekhouding]] §inrichting.
    3. Bij vereenvoudigde boekhouding: enkel drie afzonderlijke boeken (financieel, aankopen, verkopen) — geen MAR vereist.
    4. Documenteer in het cliëntdossier welke boeken aangemaakt worden, met startdatum.
  grondslag: "[[regelmatige-boekhouding]] §inrichting, [[minimum-algemeen-rekeningenstelsel]] §opbouw"
- nr: 4
  titel: Bevestig de bewaartermijn aan de cliënt
  wat: Communiceer dat alle boeken en verantwoordingsstukken zeven jaar bewaard moeten blijven.
  waarom: Niet-naleving van de bewaarplicht is strafbaar en hindert de onderbouwing bij fiscale of vennootschapsrechtelijke betwistingen.
  input:
  - artefact: Inrichtingschecklist stap 3
    veld: Lijst van boeken en stukken
    type: document
  output:
  - artefact: Cliëntbrief
    veld: Bewaarplicht-instructie + startdatum
    type: document
  hoe: |
    1. Vermeld in de cliëntbrief de termijn van zeven jaar uit [[bewaartermijn-boekhouding]] §termijn.
    2. Geef aan vanaf welke datum de termijn loopt: 1 januari volgend op het afsluiten van het boekjaar.
    3. Vermeld dat ook elektronische bewaring toegelaten is, mits leesbaar en onveranderlijk.
  grondslag: "[[bewaartermijn-boekhouding]] §termijn, WER art. III.86"
beslisboom:
- vraag: Valt de entiteit onder de WER-ondernemingsdefinitie?
  ja: Boekhoudplicht — ga naar volgende vraag.
  nee: Geen boekhoudplicht onder WER (bv. zuiver private vermogensbeheer-maatschap zonder onderneming).
- vraag: Is de entiteit een rechtspersoon (BV, NV, CV, VZW, ...)?
  ja: Dubbele boekhouding + MAR verplicht.
  nee: Toets aan omzet-drempel.
- vraag: Ligt de jaaromzet boven de WER-drempel?
  ja: Dubbele boekhouding verplicht.
  nee: Vereenvoudigde boekhouding toegelaten.
voorbeelden:
- situatie: "Praktijk Persenaire is een eenmanszaak vrij beroep met omzet € 280.000 in 2024 (gefactureerde erelonen)."
  conclusie: "Boekhoudplichtig onder WER Boek III. Omzet onder drempel + natuurlijke persoon → vereenvoudigde boekhouding toegelaten (drie boeken, geen MAR)."
  grondslag: "[[boekhoudplichtige-onderneming]] §natuurlijke-personen; [[vereenvoudigde-boekhouding]] §drempel"
  redenering: WER-definitie omvat ook beoefenaars van een vrij beroep. Drempel-toets is gunstig. Cliënt moet wel jaarlijks een vereenvoudigde inventaris opmaken.
- situatie: "Meubelzaak Mertens BV is een BV met € 4.500.000 omzet en 12 werknemers."
  conclusie: "Dubbele boekhouding verplicht — rechtspersoon. Inrichting met MAR, dagboeken (aankoop, verkoop, financieel) en eventueel hulpdagboeken voor de winkel."
  grondslag: "[[dubbel-boekhouden]] §verplichting; [[minimum-algemeen-rekeningenstelsel]] §opbouw"
  redenering: Voor rechtspersonen is dubbele boekhouding ongeacht omzet. Het MAR moet worden aangepast aan de detailhandel-sector (eigen subrubrieken voor voorraad winkelgoederen).

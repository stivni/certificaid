id: uitvoeren-intragroep-eliminaties
titel: "Uitvoeren van intragroep-eliminaties en berekenen van het aandeel van derden"
status: voorgesteld
schema_version: "1.1"
programmaonderdelen: [1.4]
voortkomend_uit:
  taken: [1.4.taak.1]
  kenniselementen: [1.4.I.D, 1.4.I.B, 1.4.I.F]
gebaseerd_op_concepten:
  - intragroep-eliminaties
  - minderheidsbelangen
  - integrale-consolidatie
  - evenredige-consolidatie
  - belangenpercentage
procedure_grondslag:
  wettelijk_pct: 80
  praktijk_pct: 20
  motivering: "De eliminatieplichten en de berekening van het aandeel van derden zijn wettelijk vastgelegd (KB WVV art. 3:134-3:140). De materialiteitsbeoordeling (verwaarloosbare bedragen, art. 3:139) is een praktijkoordeel."
stappen:
  - nr: 1
    titel: "Identificeren van onderlinge vorderingen en schulden"
    wat: "Lijst alle wederzijdse vorderingen en schulden tussen groepsvennootschappen op."
    waarom: "Onderlinge posities moeten worden geschrapt om dubbeltelling in de geconsolideerde balans te vermijden."
    input:
      - artefact: "Geconsolideerde proefbalansen van moeder en dochters"
        veld: "Vorderingen en schulden tegenover groepsvennootschappen"
        type: "boekhoudkundig-bedrag"
      - artefact: "Intercompany-reconciliaties"
        veld: "Saldi per tegenpartij"
        type: "boekhoudkundig-bedrag"
    output:
      - artefact: "Werkpapier eliminaties"
        veld: "Lijst onderlinge posities per tegenpartij"
        type: "document"
    hoe: |
      1. Open de proefbalans van Aurelia Holding NV en zoek de subrubrieken 'Vorderingen op groepsvennootschappen' en 'Schulden aan groepsvennootschappen'.
      2. Open de proefbalans van Brugse Brouwerij BV en doe hetzelfde.
      3. Voer een intercompany-reconciliatie uit: voor elk paar (Aurelia ↔ Brugse) moet vordering bij A = schuld bij B (en omgekeerd).
      4. Verschillen tussen vordering en schuld? → vraag uitsplitsing aan beide vennootschappen. Vaak veroorzaakt door valuta-omrekening of timing-verschillen.
      5. Documenteer de geverifieerde saldi voor eliminatie in stap 2.
    grondslag: "[[intragroep-eliminaties]] §identificatie, KB WVV art. 3:134"
  - nr: 2
    titel: "Elimineren van onderlinge vorderingen en schulden"
    wat: "Schrap wederzijdse vorderingen en schulden tussen groepsvennootschappen uit de geconsolideerde balans."
    waarom: "Het beeld 'alsof het geheel één onderneming was' vereist dat interne posities verdwijnen."
    input:
      - artefact: "Werkpapier eliminaties stap 1"
        veld: "Geverifieerde onderlinge posities"
        type: "boekhoudkundig-bedrag"
    output:
      - artefact: "Geconsolideerde balans"
        veld: "Vorderingen + schulden op groepsvennootschappen"
        type: "geëlimineerde-post"
    hoe: |
      1. Boek voor elk paar een eliminatie: debiteer 'Schulden aan groepsvennootschappen' bij dochter, crediteer 'Vorderingen op groepsvennootschappen' bij moeder, voor hetzelfde bedrag.
      2. Verifieer dat na alle eliminaties enkel posities tegenover entiteiten buiten de consolidatiekring overblijven.
      3. Controleer dat de geconsolideerde balans nog steeds in evenwicht is.
      4. Documenteer in werkpapier eliminaties: welke bedragen geschrapt, welke restposten over.
    voorbeeld:
      scenario: "Aurelia Holding NV heeft een vordering van 50 op Brugse Brouwerij BV. Brugse heeft een overeenkomstige schuld van 50 aan Aurelia."
      substappen:
        - nr: 1
          titel: "Eliminatie-boeking"
          type: "boekingsregel"
          data: |
            Debiteer: Schulden aan groepsvennootschappen (Brugse)     50
            Crediteer: Vorderingen op groepsvennootschappen (Aurelia)  50
        - nr: 2
          titel: "Effect op geconsolideerde balans"
          type: "balans"
          data: |
            | Vóór eliminatie                                  | Aurelia | Brugse |
            |--------------------------------------------------|--------:|-------:|
            | Vorderingen op groepsvennootschappen (Brugse)    |      50 |      — |
            | Schulden aan groepsvennootschappen (Aurelia)     |       — |     50 |

            | Na eliminatie in geconsolideerde balans          |   |
            |--------------------------------------------------|--:|
            | Vorderingen op groepsvennootschappen             |  0 |
            | Schulden aan groepsvennootschappen               |  0 |
    grondslag: "[[intragroep-eliminaties]] §boeking-eliminatie, KB WVV art. 3:134"
  - nr: 3
    titel: "Elimineren van in activa begrepen onderlinge winsten"
    wat: "Schrap de winstmarge die de groep aan zichzelf heeft toegerekend en die nog in voorraden of vaste activa zit."
    waarom: "Winsten op interne transacties zijn economisch niet gerealiseerd zolang het actief de groep niet verlaten heeft."
    input:
      - artefact: "Voorraadbestanden bij elke groepsvennootschap"
        veld: "Restvoorraad afkomstig van interne aankoop"
        type: "boekhoudkundig-bedrag"
      - artefact: "Brutomarge intra-groepsverkopen"
        veld: "Percentage marge"
        type: "percentage"
    output:
      - artefact: "Geconsolideerde balans + resultatenrekening"
        veld: "Voorraad en intra-groepswinst"
        type: "geëlimineerde-post"
    hoe: |
      1. Vraag aan elke kopende groepsvennootschap (bv. Brugse): hoeveel voorraad afkomstig van interne aankoop (van Aurelia) staat nog op de balans?
      2. Vraag aan de verkopende vennootschap (Aurelia) de brutomarge die op de interne verkoop is toegepast.
      3. Bereken de niet-gerealiseerde winst: brutomarge × restvoorraad.
      4. Boek de eliminatie: voorraad bij de kopende vennootschap wordt teruggebracht naar de waarde voor de groep (zonder marge); resultaat wordt verminderd met dezelfde brutomarge.
      5. Idem voor vaste activa die intern zijn verkocht: schrap de niet-gerealiseerde winst en herzie de afschrijvingsbasis.
    voorbeeld:
      scenario: "Aurelia Holding NV heeft aan Brugse Brouwerij BV voorraad verkocht met een brutomarge van 25 %. Op balansdatum staat bij Brugse nog 400 van die voorraad."
      substappen:
        - nr: 1
          titel: "Berekening niet-gerealiseerde winst"
          type: "berekening"
          data: |
            niet-gerealiseerde winst = brutomarge × restvoorraad
                                    = 25 % × 400
                                    = **100**
        - nr: 2
          titel: "Eliminatie-boeking"
          type: "boekingsregel"
          data: |
            Debiteer: Resultaat (eliminatie intra-groepswinst)    100
            Crediteer: Voorraad bij Brugse                        100
            → Voorraad wordt teruggebracht naar de waarde voor de groep (300 i.p.v. 400).
    valkuilen:
      - advies: "Schrap ook intra-groepswinsten in voorraad of vaste activa, niet alleen vorderingen en schulden."
        vaak_fout: "Aannemen dat alleen vorderingen en schulden moeten worden geëlimineerd."
        grondslag: "[[intragroep-eliminaties]] §winsten-in-activa"
    grondslag: "[[intragroep-eliminaties]] §niet-gerealiseerde-winsten, KB WVV art. 3:134 lid 2"
  - nr: 4
    titel: "Elimineren van onderlinge opbrengsten en kosten"
    wat: "Schrap interne verkopen, beheersvergoedingen, intresten en huur uit de geconsolideerde resultatenrekening."
    waarom: "Dezelfde transactie mag niet dubbel verschijnen in de groepscijfers."
    input:
      - artefact: "Resultatenrekeningen van groepsvennootschappen"
        veld: "Interne verkopen, beheersvergoedingen, intresten, huur"
        type: "boekhoudkundig-bedrag"
    output:
      - artefact: "Geconsolideerde resultatenrekening"
        veld: "Onderlinge opbrengsten en kosten"
        type: "geëlimineerde-post"
    hoe: |
      1. Maak een matrix van interne transacties tussen Aurelia Holding NV en Brugse Brouwerij BV: verkopen, beheersvergoedingen, intresten op interne leningen, huur van interne gebouwen.
      2. Voor elke transactie: schrap de omzet bij de verkopende vennootschap én de aankoopkost (of huurkost, intrestkost) bij de kopende vennootschap, voor exact hetzelfde bedrag.
      3. Verifieer dat het geconsolideerde resultaat per saldo niet verandert (eliminatie raakt zowel opbrengst als kost).
      4. Documenteer in werkpapier eliminaties: welke transacties geschrapt en bedragen.
    grondslag: "[[intragroep-eliminaties]] §resultaat-eliminaties, KB WVV art. 3:136"
  - nr: 5
    titel: "Aanpassen van eliminaties voor evenredig geconsolideerde dochters"
    wat: "Beperk de eliminaties bij gemeenschappelijke dochters tot het pro-rata deel."
    waarom: "Bij evenredige consolidatie wordt slechts het pro-rata deel opgenomen; eliminatie moet daarbij aansluiten."
    input:
      - artefact: "Lijst gemeenschappelijke dochters"
        veld: "Belangenpercentage per gemeenschappelijke dochter"
        type: "percentage"
    output:
      - artefact: "Werkpapier eliminaties"
        veld: "Aangepaste eliminatiebedragen pro-rata"
        type: "boekhoudkundig-bedrag"
    hoe: |
      1. Identificeer de gemeenschappelijke dochters die evenredig zijn geconsolideerd (bv. Filmstudio Florence BV voor 50 %).
      2. Voor elke eliminatie tussen moeder en gemeenschappelijke dochter: pas niet 100 % maar het belangenpercentage toe (KB WVV art. 3:140 a).
      3. Bv. Cardinal Group NV ↔ Filmstudio Florence BV: eliminatie van intra-groepswinst van 100 wordt 50 % × 100 = 50.
      4. Documenteer apart waarom de pro-rata behandeling is gekozen.
    grondslag: "[[intragroep-eliminaties]] §evenredige-consolidatie-pro-rata, KB WVV art. 3:140"
  - nr: 6
    titel: "Beoordelen van materialiteit"
    wat: "Beslis welke eliminaties achterwege mogen blijven omdat ze van te verwaarlozen betekenis zijn."
    waarom: "De wet staat een proportionaliteitsoordeel toe; rituele eliminatie van triviale bedragen is niet vereist."
    input:
      - artefact: "Bedragen van geïdentificeerde eliminaties"
        veld: "Bedragen"
        type: "boekhoudkundig-bedrag"
      - artefact: "Geconsolideerd balanstotaal + resultaat"
        veld: "Referentiebedragen voor materialiteit"
        type: "boekhoudkundig-bedrag"
    output:
      - artefact: "Werkpapier eliminaties"
        veld: "Lijst eliminaties die achterwege blijven met motivering"
        type: "conclusie"
    hoe: |
      1. Bepaal de materialiteitsdrempel voor de geconsolideerde jaarrekening (typisch een percentage van balanstotaal of resultaat).
      2. Toets per eliminatie of het bedrag onder de drempel valt EN of weglating geen vertekening van het getrouw beeld geeft.
      3. Eliminaties bedoeld in KB WVV art. 3:134, 3:136 1°/2° en 3:138 mogen weggelaten worden als het bedrag verwaarloosbaar is (KB WVV art. 3:139).
      4. Documenteer de gekozen materialiteit en welke eliminaties achterwege blijven.
    grondslag: "[[intragroep-eliminaties]] §materialiteit, KB WVV art. 3:139"
  - nr: 7
    titel: "Berekenen van het aandeel van derden"
    wat: "Bereken het deel van eigen vermogen en resultaat van de dochter dat toebehoort aan minderheidsaandeelhouders."
    waarom: "Bij integrale consolidatie wordt 100 % opgenomen; het deel toebehorend aan derden moet afzonderlijk worden gepresenteerd."
    input:
      - artefact: "Eigen vermogen dochter op afsluitingsdatum"
        veld: "Bedrag"
        type: "boekhoudkundig-bedrag"
      - artefact: "Resultaat dochter boekjaar"
        veld: "Winst of verlies"
        type: "boekhoudkundig-bedrag"
      - artefact: "Belangenpercentage moeder"
        veld: "Percentage"
        type: "percentage"
    output:
      - artefact: "Geconsolideerde balans (passiefzijde)"
        veld: "Belangen van derden"
        type: "nieuwe-balanspost"
      - artefact: "Geconsolideerde resultatenrekening"
        veld: "Aandeel van derden in het resultaat"
        type: "nieuwe-balanspost"
    hoe: |
      1. Neem het eigen vermogen totaal van Brugse Brouwerij BV op afsluitingsdatum (bv. 1.000).
      2. Bereken het derden-percentage: 1 − belangenpercentage moeder (bv. 1 − 0,90 = 0,10).
      3. Belangen van derden in EV = derden-percentage × eigen vermogen dochter = 0,10 × 1.000 = 100. Boek aan passiefzijde.
      4. Resultaat dochter boekjaar (bv. 200): aandeel van derden in resultaat = 0,10 × 200 = 20. Boek onderaan de geconsolideerde resultatenrekening.
      5. Verifieer dat het netto-resultaat voor de moeder dan = 0,90 × 200 = 180.
    voorbeeld:
      scenario: "Aurelia Holding NV bezit 90 % in Brugse Brouwerij BV. Eigen vermogen Brugse op afsluitingsdatum = 1.000. Resultaat boekjaar Brugse = 200."
      substappen:
        - nr: 1
          titel: "Berekening belangen van derden in eigen vermogen"
          type: "berekening"
          data: |
            belangen van derden in EV = (1 − belangenpercentage) × eigen vermogen dochter
                                      = (1 − 0,90) × 1.000
                                      = 0,10 × 1.000
                                      = **100**
        - nr: 2
          titel: "Berekening aandeel van derden in resultaat"
          type: "berekening"
          data: |
            aandeel van derden in resultaat = (1 − 0,90) × 200 = **20**
        - nr: 3
          titel: "Presentatie in geconsolideerde jaarrekening"
          type: "balans"
          data: |
            | Geconsolideerde balans (passiefzijde, uittreksel) |       |
            |---------------------------------------------------|------:|
            | Eigen vermogen toebehorend aan Aurelia            |   x   |
            | **Belangen van derden**                           | **100** |

            | Geconsolideerde resultatenrekening (uittreksel)   |       |
            |---------------------------------------------------|------:|
            | Resultaat boekjaar (totaal)                       |   200 |
            | waarvan: **Aandeel van derden in resultaat**      |  **20** |
            | waarvan: aandeel Aurelia in resultaat             |   180 |
    valkuilen:
      - advies: "Boek alleen 'Belangen van derden' bij integrale consolidatie, nooit bij evenredige consolidatie."
        vaak_fout: "Bij evenredige consolidatie alsnog een aandeel van derden boeken voor het deel buiten de groep."
        grondslag: "[[minderheidsbelangen]] §uitsluitend-bij-integrale-consolidatie"
    grondslag: "[[minderheidsbelangen]] §berekening, KB WVV art. 3:137"
  - nr: 8
    titel: "Aanpassen van de toelichting"
    wat: "Verwijder weggelaten rechten en verplichtingen uit de toelichting bij de geconsolideerde jaarrekening."
    waarom: "Wat geëlimineerd is in cijfers moet ook in de toelichting consistent verdwijnen."
    input:
      - artefact: "Toelichting bij enkelvoudige jaarrekeningen"
        veld: "Rechten en verplichtingen tegenover groepsvennootschappen"
        type: "document"
    output:
      - artefact: "Toelichting bij geconsolideerde jaarrekening"
        veld: "Wederzijdse rechten/verplichtingen verwijderd"
        type: "document"
    hoe: |
      1. Open de toelichting bij de enkelvoudige jaarrekeningen van Aurelia en Brugse.
      2. Identificeer toelichtings-onderdelen die rechten of verplichtingen tussen Aurelia en Brugse vermelden (garanties, borgstellingen, verhuurde activa).
      3. Schrap deze items uit de geconsolideerde toelichting (KB WVV art. 3:138).
      4. Verifieer consistentie: wat geëlimineerd is in cijfers, moet ook uit de tekstuele toelichting verdwijnen.
    grondslag: "[[intragroep-eliminaties]] §toelichting-consistentie, KB WVV art. 3:138"
voorbeelden:
  - situatie: "Aurelia Holding NV bezit 90 % in Brugse Brouwerij BV. Aurelia heeft aan Brugse voorraad verkocht met een brutomarge van 25 %. Op balansdatum staat bij Brugse nog 400 van die voorraad. Eigen vermogen Brugse op afsluitingsdatum = 1.000; resultaat = 200."
    conclusie: "Te elimineren intra-groepswinst in voorraad = 25 % × 400 = 100 (voorraad terug naar 300 — de waarde voor de groep). Belangen van derden op balans = (1 − 0,90) × 1.000 = 100. Aandeel van derden in resultaat = (1 − 0,90) × 200 = 20."
    grondslag: "[[intragroep-eliminaties]] §eliminatie-voorraad; [[minderheidsbelangen]] §berekening"
    redenering: "Intra-groepswinst in voorraad wordt teruggedraaid omdat het actief de groep nog niet heeft verlaten. Het complementaire belang van 10 % wordt afgezonderd voor derden bij integrale consolidatie."

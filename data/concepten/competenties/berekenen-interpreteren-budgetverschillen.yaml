id: berekenen-interpreteren-budgetverschillen
titel: Berekenen en interpreteren van budgetverschillen (verschillenboekhouding)
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.8
voortkomend_uit:
  taken:
  - 1.8.taak.1
  kenniselementen:
  - 1.8.VI
  - 1.8.VI.D
  - 1.8.III.C
gebaseerd_op_concepten:
- verschillenboekhouding
- prijsverschil-arbeid
- voorbepaalde-kosten
- werkelijke-kostencalculatie
- flexibel-budget
- statisch-budget
- budgetbeheer
- variabele-kosten
- vaste-kosten
procedure_grondslag:
  wettelijk_pct: 0
  praktijk_pct: 100
  motivering: Verschillenboekhouding (variance analysis) is integraal management-accounting-doctrine zonder Belgische trusted bron. Vereist mens-review wegens praktijk_pct > 70%.
stappen:
- nr: 1
  titel: Voorbereiden van de vergelijkingsbasis
  wat: "Zorg dat budget (voorbepaalde kosten) en werkelijke realisatie op vergelijkbare basis staan: hetzelfde volume, dezelfde periode, dezelfde scope."
  waarom: Een budget op 25.000 stuks vergelijken met realisatie op 22.000 stuks zonder flexibilisering levert een volume-effect dat de echte oorzaken maskeert.
  input:
  - artefact: Statisch of flexibel budget uit [[opstellen-master-budget]]
    veld: Budget per kostensoort per periode
    type: boekhoudkundig-bedrag
  - artefact: Werkelijke cijfers uit boekhouding
    veld: Werkelijke kost per soort + werkelijk volume
    type: boekhoudkundig-bedrag
  output:
  - artefact: Vergelijkingsbasis (gefixeerd op werkelijk volume)
    veld: Flexibel-budget + werkelijk
    type: document
  hoe: |
    1. Lees [[flexibel-budget]] §gebruik-in-variantie-analyse: zonder flexibilisering loop je
       het volume-effect en het efficiëntie-effect door elkaar.
    2. Herbereken het budget op het werkelijke volume voor variabele kosten
       (vaste kosten blijven gelijk).
    3. Resultaat: drie kolommen — statisch budget, flexibel budget (werkelijk volume),
       werkelijke realisatie.
  grondslag: "[[flexibel-budget]] §gebruik-in-variantie-analyse, [[verschillenboekhouding]] §basis"
- nr: 2
  titel: Splitsen van het materiaalverschil in prijs- en hoeveelheidsverschil
  wat: Bereken voor elke grondstof het prijsverschil (werkelijke − standaard prijs × werkelijke hoeveelheid) en het hoeveelheidsverschil ((werkelijke − standaard hoeveelheid) × standaardprijs).
  waarom: "De splitsing toont wie verantwoordelijk is: inkoop bij prijsverschil, productie bij hoeveelheidsverschil."
  input:
  - artefact: Materiaal-norm + realisatie
    veld: Standaard kg/stuk, standaardprijs, werkelijk verbruik, werkelijke prijs
    type: boekhoudkundig-bedrag
  output:
  - artefact: Prijs- en hoeveelheidsverschil materiaal
    veld: € + gunstig/ongunstig
    type: boekhoudkundig-bedrag
  hoe: |
    1. Pas de splitsing toe volgens [[verschillenboekhouding]] §materiaalverschil:
       Prijsverschil = (werkelijke prijs − standaardprijs) × werkelijke hoeveelheid.
       Hoeveelheidsverschil = (werkelijke − standaard hoeveelheid) × standaardprijs.
    2. Positief = ongunstig (kost meer dan begroot); negatief = gunstig.
    3. Het totaal van beide verschillen = totaal materiaalverschil.
  voorbeeld:
    scenario: "Yperse Werkplaats BV — wol-verbruik voor productie van 22.000 tapijten. Standaard 5 kg per tapijt aan € 5,00/kg. Werkelijk 116.000 kg aan € 5,30/kg."
    substappen:
    - nr: 1
      titel: Berekening prijs- en hoeveelheidsverschil
      type: berekening
      data: |
        Standaard kg voor 22.000 tapijten = 22.000 × 5 = 110.000 kg.

        Prijsverschil = (€ 5,30 − € 5,00) × 116.000 kg = **€ 34.800 ongunstig**

        Hoeveelheidsverschil = (116.000 − 110.000) × € 5,00 = **€ 30.000 ongunstig**

        Totaal materiaalverschil = € 34.800 + € 30.000 = **€ 64.800 ongunstig**
    - nr: 2
      titel: Interpretatie
      type: opmerking
      data: |
        Inkoop kocht duurder dan begroot (€ 34.800) — onderzoek leverancierscontract.
        Productie verbruikte meer (€ 30.000) — onderzoek uitval / herwerking.
  grondslag: "[[verschillenboekhouding]] §materiaalverschil"
- nr: 3
  titel: Splitsen van het arbeidsverschil in tarief- en efficiëntieverschil
  wat: Bereken voor elke loongroep het tariefverschil (werkelijk − standaard uurtarief × werkelijke uren) en het efficiëntieverschil ((werkelijke − standaard uren) × standaard uurtarief).
  waarom: "Splitsing toont waar de afwijking zit: HR/personeelsdienst bij tarief, productieleiding bij efficiëntie."
  input:
  - artefact: Arbeid-norm + realisatie
    veld: Standaard uren/stuk, € 25/u standaard, werkelijke uren, werkelijk tarief
    type: boekhoudkundig-bedrag
  output:
  - artefact: Tarief- en efficiëntieverschil arbeid
    veld: € + gunstig/ongunstig
    type: boekhoudkundig-bedrag
  hoe: |
    1. Pas [[prijsverschil-arbeid]] §splitsing toe:
       Tariefverschil = (werkelijk tarief − standaardtarief) × werkelijke uren.
       Efficiëntieverschil = (werkelijke − standaard uren) × standaardtarief.
    2. Standaardtarief Yperse: € 25/uur inclusief lasten.
    3. Bekijk per kostencentrum apart — Spinnerij/Weverij/Confectie hebben mogelijk
       verschillende oorzaken.
  voorbeeld:
    scenario: "Yperse Werkplaats BV — Confectie. Standaard 0,2 arbeids-uur per tapijt aan € 25/u. 22.000 tapijten = 4.400 standaard-uren. Werkelijk: 4.700 uren aan € 26,50/u."
    substappen:
    - nr: 1
      titel: Berekening
      type: berekening
      data: |
        Tariefverschil = (€ 26,50 − € 25,00) × 4.700 u = **€ 7.050 ongunstig**

        Efficiëntieverschil = (4.700 − 4.400) × € 25,00 = **€ 7.500 ongunstig**

        Totaal arbeidsverschil = **€ 14.550 ongunstig**
    - nr: 2
      titel: Interpretatie
      type: opmerking
      data: |
        Indexering deed het tarief stijgen (HR-/loon-oorzaak); productie verloor 300 uur
        aan herwerking of vertragingen (productie-snelheid).
  grondslag: "[[prijsverschil-arbeid]] §splitsing, [[verschillenboekhouding]] §arbeidsverschil"
- nr: 4
  titel: Berekenen van indirecte-kosten- en volume-verschillen
  wat: Bereken voor indirecte productiekosten een budget- (uitgaven-) verschil en een capaciteits- (volume-) verschil.
  waarom: Bij vaste indirecte kosten hangt het verschil af van zowel uitgavenbeheersing als de bezettingsgraad — twee verschillende stuurbare effecten.
  input:
  - artefact: Indirect-budget + bezetting
    veld: Begrote indirecte kost + normvolume + werkelijk
    type: boekhoudkundig-bedrag
  output:
  - artefact: Budget- en volume-verschil
    veld: €
    type: boekhoudkundig-bedrag
  hoe: |
    1. Bereken volgens [[verschillenboekhouding]] §indirecte-kosten-splitsing:
       Budgetverschil = werkelijke kost − geflexibiliseerd budget bij werkelijk volume.
       Volume-verschil = geflexibiliseerd budget − toegerekende kost
       (= (norm- − werkelijk volume) × standaard opslag-tarief).
    2. Volume-verschil is enkel relevant bij vaste indirecte kosten — variabele
       indirecte kost wordt al door flexibilisering gevangen.
    3. Interpretatie: budget-verschil = uitgavenbeheersing; volume-verschil = onder-
       of overbezetting van capaciteit.
  grondslag: "[[verschillenboekhouding]] §indirecte-kosten-splitsing, [[vaste-kosten]] §bezettingsgraad"
- nr: 5
  titel: Rapporteren en koppelen aan bijsturing
  wat: Synthetiseer alle verschillen in een variantie-rapport en koppel oorzaken aan acties.
  waarom: Een variance-analyse zonder bijsturings-actie is een kostenpost zonder waarde — de cyclus moet sluiten.
  input:
  - artefact: Verschillen uit stappen 2-4
    veld: Volledige verschillenmatrix
    type: document
  - artefact: Gesprekken met afdelingsverantwoordelijken
    veld: Toelichting bij significante verschillen
    type: document
  output:
  - artefact: Variantie-rapport + actie-agenda
    veld: "Per significant verschil: oorzaak + actie + eigenaar"
    type: document
  hoe: |
    1. Tabel per kostencategorie: budget, werkelijk, verschil €, verschil %, type.
    2. Focus op significante verschillen (bv. > 5 % of > € 10.000).
    3. Volg [[budgetbeheer]] §opvolging: koppel elk significant verschil aan een
       verantwoordelijke + corrigerende actie + deadline.
    4. Update budget waar nodig (rolling-forecast-logica) voor resterend boekjaar.
  valkuilen:
  - advies: "Vergelijk werkelijke realisatie tegen het flexibele budget (gefixeerd op werkelijk volume) — niet tegen het statische budget."
    vaak_fout: "Werkelijk volume tegen statisch budget afzetten — vermengt volume-effect met efficiëntie."
    grondslag: "[[flexibel-budget]] §gebruik-in-variantie-analyse"
  - advies: "Splits prijs en hoeveelheid bij elke variabele kost-categorie."
    vaak_fout: "Eén totaal materiaalverschil rapporteren zonder splitsing — onbruikbaar voor sturing."
    grondslag: "[[verschillenboekhouding]] §materiaalverschil"
  grondslag: "[[budgetbeheer]] §opvolging, [[verschillenboekhouding]] §rapportage"
beslisboom:
- vraag: "Is het werkelijke volume gelijk aan het budgetvolume?"
  ja: "Statisch budget volstaat als vergelijkingsbasis."
  nee: "Herbereken naar flexibel budget vóór verschillen-analyse."
- vraag: "Is een verschil materieel (> 5 % of > drempel)?"
  ja: "Onderzoek oorzaak, wijs eigenaar, formuleer corrigerende actie."
  nee: "Loggen voor trend-analyse, geen ad-hoc actie."
voorbeelden:
- situatie: "Yperse Werkplaats BV — periode-afsluiting met materiaal-verschil € 64.800 ongunstig en arbeidsverschil € 14.550 ongunstig op 22.000 tapijten."
  conclusie: "Materiaal: inkoop (€ 34.800) + verbruik (€ 30.000); arbeid: tarief (€ 7.050) + efficiëntie (€ 7.500). Acties: leverancierscontract herzien, herwerking-oorzaak onderzoeken, indexerings-impact aanvaarden."
  grondslag: "[[verschillenboekhouding]] §materiaalverschil, [[prijsverschil-arbeid]] §splitsing"
  redenering: "Splitsing per oorzaak-type maakt de variances stuurbaar; elk verschil heeft een herkenbare eigenaar in de organisatie."

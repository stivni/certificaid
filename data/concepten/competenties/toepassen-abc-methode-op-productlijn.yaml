id: toepassen-abc-methode-op-productlijn
titel: Toepassen van de ABC-methode (Activity Based Costing) op een productlijn
status: voorgesteld
schema_version: "1.1"
programmaonderdelen:
- 1.8
voortkomend_uit:
  taken:
  - 1.8.taak.1
  kenniselementen:
  - 1.8.III
  - 1.8.III.F
  - 1.8.II.A
  - 1.8.II.D
gebaseerd_op_concepten:
- abc-methode
- indirecte-kosten
- volledige-kostencalculatie
- verdeelsleutel
- kostprijs-per-eenheid
- kostendrager
- overige-kosten
- costing-methodes-vergelijking
procedure_grondslag:
  wettelijk_pct: 5
  praktijk_pct: 95
  motivering: ABC-methode is internationale vakdoctrine (Cooper-Kaplan) zonder Belgische trusted wettelijke of CBN-bron. Wettelijk raakvlak is enkel dat een ABC-toerekening kan dienen als 'evenredig deel' indirecte productiekosten conform KB 21.10.2018 art. 22, mits consistent toegepast. Vereist mens-review wegens praktijk_pct > 70%.
stappen:
- nr: 1
  titel: Identificeren van de activiteiten in het productieproces
  wat: Breek het productieproces op in afgebakende activiteiten — herhalende handelingen of stappen die resources consumeren.
  waarom: Activiteit (niet kostencentrum) is het hart van ABC; alleen op activiteit-niveau is de oorzaak-gevolg-relatie scherp genoeg om verdeelsleutels te kiezen.
  input:
  - artefact: Procesbeschrijving + workflow
    veld: Stappen per productlijn
    type: document
  output:
  - artefact: Activiteiten-lijst
    veld: 5-15 activiteiten met scope-omschrijving
    type: document
  hoe: |
    1. Volg [[abc-methode]] §activiteit-identificatie: lijst activiteiten op die
       resources verbruiken en die per output verschillen (machine-instellen, kwaliteitscontrole,
       order-verwerking, transport tussen centra).
    2. Vermijd te grove activiteiten (verliezen onderscheidend vermogen) en
       te fijne (administratieve last).
    3. Voor Yperse Werkplaats BV bijvoorbeeld: machine-instelling, weven,
       afwerken, kwaliteitscontrole, ompakken, verzending.
  grondslag: "[[abc-methode]] §activiteit-identificatie"
- nr: 2
  titel: Kiezen van een cost-driver per activiteit
  wat: Selecteer per activiteit een cost-driver — een meeteenheid die het verbruik van de activiteit weerspiegelt.
  waarom: De cost-driver bepaalt hoe activiteitskost aan een product wordt toegerekend; verkeerde keuze = verkeerde kostprijs.
  input:
  - artefact: Activiteiten-lijst uit stap 1
    veld: Per activiteit + omschrijving
    type: document
  - artefact: Procesmetingen
    veld: Wat varieert per product (aantal instellingen, aantal orders, ...)
    type: boekhoudkundig-bedrag
  output:
  - artefact: Tabel activiteit × cost-driver
    veld: Per activiteit een driver + meeteenheid
    type: document
  hoe: |
    1. Volg [[abc-methode]] §cost-driver-keuze: kies een driver met sterke
       oorzakelijkheid en meetbaarheid.
    2. Drie types drivers:
       - Transactional (aantal voorbereidingen, aantal orders).
       - Duration (uren machine-instelling).
       - Intensity (specifiek verbruik per uitvoering).
    3. Test causaliteit: stijgt de activiteitskost als de driver-waarde stijgt?
    4. Documenteer de driver-keuze met motivering — vermijd 'machine-uren-voor-alles'.
  grondslag: "[[abc-methode]] §cost-driver-keuze, [[verdeelsleutel]] §oorzakelijkheidsprincipe"
- nr: 3
  titel: Berekenen van het cost-driver-tarief per activiteit
  wat: "Bereken per activiteit: tarief = totaal activiteitskost / totaal driver-eenheden."
  waarom: Dit tarief is de prijs van één eenheid driver — de basis voor toerekening aan dragers.
  input:
  - artefact: Activiteitskost per soort
    veld: Bedragen toegewezen aan activiteit
    type: boekhoudkundig-bedrag
  - artefact: Totale driver-eenheden
    veld: Aantal per periode
    type: boekhoudkundig-bedrag
  output:
  - artefact: Cost-driver-tarief per activiteit
    veld: € per eenheid driver
    type: boekhoudkundig-bedrag
  hoe: |
    1. Verzamel de totale kost per activiteit uit klasse-9-rekeningen of uit
       interviews + tijds-allocaties.
    2. Tel de driver-eenheden over de periode op (bv. 200 machine-instellingen per jaar).
    3. Tarief = totaalkost / totaal driver-eenheden.
    4. Verifieer de tarieven op redelijkheid (vergelijk met externe benchmarks).
  grondslag: "[[abc-methode]] §tarief-per-driver"
- nr: 4
  titel: Toewijzen aan kostendragers (producten of orders)
  wat: Vermenigvuldig per product/order/klant het verbruik van elke activiteit met het bijbehorende cost-driver-tarief.
  waarom: "Dit geeft de echte ABC-kostprijs: niet één opslag per productiecentrum, maar een gestaffelde toerekening op basis van werkelijk activiteitsverbruik."
  input:
  - artefact: Cost-driver-tarieven uit stap 3
    veld: € per eenheid driver
    type: boekhoudkundig-bedrag
  - artefact: Verbruik per product per activiteit
    veld: Aantal driver-eenheden per product
    type: boekhoudkundig-bedrag
  output:
  - artefact: ABC-kostprijs per kostendrager
    veld: Direct + per activiteit + totaal
    type: nieuwe-balanspost
  hoe: |
    1. Volg [[abc-methode]] §toerekening: per kostendrager × per activiteit:
       kost = driver-verbruik × cost-driver-tarief.
    2. Tel toegerekende activiteitskosten op + direct toewijsbare kosten
       (materiaal + directe arbeid).
    3. Vergelijk met de uitkomst van traditionele [[volledige-kostencalculatie]] op één
       opslagbasis — toon waar de twee uitkomsten significant verschillen
       (typisch: laag-volume specialiteiten worden onder traditioneel onderbelast).
  voorbeeld:
    scenario: "Yperse Werkplaats BV — vergelijking kostprijs voor twee productlijnen (tapijt-standaard 25.000 stuks/jaar en kleed-handgeknoopt 500 stuks/jaar) met de traditionele methode versus ABC. Indirecte productiekost in totaal € 800.000."
    substappen:
    - nr: 1
      titel: Traditionele toewijzing (één opslag op machine-uren)
      type: berekening
      data: |
        Totaal machine-uren = 25.000 × 0,4 + 500 × 1,2 = 10.600 uur

        Tarief = € 800.000 / 10.600 u = € 75,47/mach-uur

        Indirect tapijt-standaard = 0,4 u × € 75,47 = **€ 30,19**

        Indirect kleed-handgeknoopt = 1,2 u × € 75,47 = **€ 90,57**
    - nr: 2
      titel: ABC-toewijzing
      type: berekening
      data: |
        | Activiteit             | Tarief         | Verbruik standaard | Verbruik luxe  |
        |------------------------|---------------:|-------------------:|---------------:|
        | Machine-instelling     | € 600/instelling | 1 / 100 stuks    | 1 / 5 stuks    |
        | Weven (uur)            | € 35/mach-uur  | 0,4 uur            | 1,2 uur        |
        | Kwaliteitscontrole     | € 8/eenheid    | 1                  | 1              |
        | Afwerking (uur)        | € 60/arb-uur   | 0,1 uur            | 1,5 uur        |
        | Verzending             | € 15/order     | 1/50 stuks         | 1/2 stuks      |

        Indirect tapijt-standaard
          = € 600/100 + 0,4×35 + 8 + 0,1×60 + 15/50
          = € 6 + € 14 + € 8 + € 6 + € 0,30 = **€ 34,30**

        Indirect kleed-handgeknoopt
          = € 600/5 + 1,2×35 + 8 + 1,5×60 + 15/2
          = € 120 + € 42 + € 8 + € 90 + € 7,50 = **€ 267,50**
    - nr: 3
      titel: Verschil-interpretatie
      type: opmerking
      data: |
        Traditioneel: standaard € 30,19, luxe € 90,57.
        ABC: standaard € 34,30, luxe € 267,50.

        Luxe-product werd onder traditioneel ernstig onderschat (€ 90 vs. € 267,50)
        omdat het veel meer voorbereidingen, kwaliteitscontroles en small-batch-
        verzendingen vergt — typische ABC-bevinding voor laag-volume specialiteiten.
  grondslag: "[[abc-methode]] §toerekening, [[costing-methodes-vergelijking]] §ABC-vs-traditioneel"
- nr: 5
  titel: Interpreteren en stuurinformatie afleiden
  wat: "Vertaal de ABC-resultaten naar concrete management-acties: productmix-keuze, prijsbeleid, proces-rationalisatie."
  waarom: ABC heeft pas waarde als de resultaten beslissingen sturen — anders is het een dure rekening-oefening.
  input:
  - artefact: ABC-kostprijzen uit stap 4
    veld: Per product
    type: boekhoudkundig-bedrag
  - artefact: Verkoopprijzen + volumes
    veld: € per stuk + aantal
    type: boekhoudkundig-bedrag
  output:
  - artefact: Stuurnota met conclusies
    veld: Prijs- of productmix-acties
    type: conclusie
  hoe: |
    1. Vergelijk ABC-kostprijs met verkoopprijs: identificeer verlies-makende
       producten die onder traditionele kostprijs winstgevend leken.
    2. Bekijk activiteit-drivers met hoogste totaalkost: kunnen die geëlimineerd
       of geautomatiseerd worden?
    3. Onderzoek of orderbeleid wijzigt: minimum-batch-groottes invoeren als
       machine-instelling de grote driver is.
    4. Documenteer aanbevelingen + verwachte impact.
  valkuilen:
  - advies: "Pas ABC selectief toe op productlijnen of beslissingen waar de extra precisie waarde toevoegt."
    vaak_fout: "ABC opzetten voor het volledige bedrijf — administratief overweldigend en zelden onderhouden."
    grondslag: "[[abc-methode]] §scope-beperking"
  - advies: "Test elke driver op causale stabiliteit voordat je tarieven berekent."
    vaak_fout: "Een driver kiezen op administratief gemak (bv. tijd geboekt) zonder oorzakelijke band met de activiteit."
    grondslag: "[[abc-methode]] §cost-driver-keuze"
  grondslag: "[[abc-methode]] §interpretatie"
beslisboom:
- vraag: "Is de productmix homogeen of bevat ze laag-volume specialiteiten?"
  ja: "Traditionele [[volledige-kostencalculatie]] met één opslag volstaat."
  nee: "ABC verbetert de kostprijs-precisie significant; toepassen aan te raden."
- vraag: "Worden de ABC-resultaten gebruikt voor de balans-voorraadwaardering?"
  ja: "Toetsen aan [[bepalen-vervaardigingsprijs-kb-21-10-2018]] — alleen productie-overhead, consistent toegepast."
  nee: "Vrijer voor interne sturing — commerciële en administratieve activiteiten kunnen mee."
voorbeelden:
- situatie: "Yperse Werkplaats BV — productmix tapijt-standaard (25.000 stuks) versus kleed-handgeknoopt (500 stuks)."
  conclusie: "Traditioneel onderschatte kleed-handgeknoopt met € 177 per stuk (€ 90,57 traditioneel vs. € 267,50 ABC). Aanbeveling: prijs verhogen of minimum-batch-grootte invoeren voor de handgeknoopte productlijn."
  grondslag: "[[abc-methode]] §toerekening, [[costing-methodes-vergelijking]] §ABC-vs-traditioneel"
  redenering: "Laag-volume specialiteit vergt veel set-up en kwaliteitscontrole per eenheid; één globale opslag op machine-uren maskeert die complexiteit volledig."

      A -->|Dividend art. 10| B3[GEDEELD<br/>bronstaat plafond 5%/15%<br/>woonstaat hoofdheffing]
      A -->|Intrest art. 11| B4[GEDEELD<br/>bronstaat plafond typisch 10%]
      A -->|Royalty art. 12| B5[Woonstaat EXCLUSIEF<br/>in zuiver OESO-MV<br/>BE-DBV's vaak gedeeld]
      A -->|Arbeid art. 15| B6[Werkstaat hoofdregel<br/>tenzij <183 dgn<br/>+ werkgever niet werkstaat-inwoner<br/>+ niet via werkstaat-VI]
      A -->|Pensioen art. 18-19| B7[Privé art. 18 woonstaat<br/>overheid art. 19 bronstaat<br/>tenzij inwoner+onderdaan andere]

  vi_drempel_oeso_mv:
    type: flowchart-td
    code: |
      A[Buitenlandse onderneming actief in NL/BE]
      A --> B{art. 5 §1<br/>Vaste bedrijfsruimte<br/>door middel waarvan?}
      B -->|ja| Y[Vaste inrichting]
      B -->|nee| C{art. 5 §2<br/>Voorbeeld-lijst<br/>kantoor · fabriek · mijn · steengroeve}
      C -->|ja| Y
      C -->|steengroeve| Y2[VI per definitie<br/>GEEN tijdsdrempel]
      C -->|nee| D{art. 5 §3<br/>Bouwwerf/installatie<br/>> 12 maanden?}
      D -->|ja| Y
      D -->|nee| E{art. 5 §5<br/>Afhankelijke vertegenwoordiger<br/>habitueel contracten sluiten?}
      E -->|ja| Y
      E -->|nee| F{art. 5 §6<br/>Onafhankelijke agent<br/>in gewone bedrijfsuitoefening?}
      F -->|ja| N[GEEN VI]
      F -->|nee| Y
      C -->|art. 5 §4 uitzondering<br/>opslag · uitstalling · aankoop<br/>uitsluitend voorbereidend| N

# ---------------------------------------------------------------------------
# Drempel-tabellen — herbruikbaar voor leerstukken en samenvatting

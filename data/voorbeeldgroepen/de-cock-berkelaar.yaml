franse_vaste_inrichting:

  beschrijving: >
    Berkelaar Distributie NV (Belgische dochter) opent in 2025 een atelier +
    toonzaal in Lille, Frankrijk. Verbouwingswerken duren 14 maanden (start
    2025-04-01, oplevering 2026-06-15). Na oplevering operationele uitbating
    door 4 lokale Franse werknemers + 1 gedetacheerde Belgische teamleader.

  feitenset:
    locatie: "Lille (Hauts-de-France)"
    type_activiteit: "atelier-verhuur fietsen + retail e-bikes + after-sales"
    huurovereenkomst: "10-jarig handelshuurcontract met Franse vastgoedeigenaar"
    werknemers: "5 (4 lokaal Frans + 1 BE-gedetacheerde)"
    bouwwerf_duur: "14 maanden — verbouwing pand naar atelier-functie"
    omzet_eerste_jaar_2026_h2: "€280.000 (deeljaar)"
    verwachte_omzet_volledig_jaar_2027: "€850.000"

  fiscale_analyse:
    bouwwerf_vi: "art. 5 §3 OESO-MV (en gelijkluidend art. 5 §3 DBV BE-FR 1964) — bouwwerf vormt VI indien duur > 12 maanden. Hier: 14 maanden → VI vanaf dag 1 retro (klassieke OESO-doctrine — drempel = absolute drempel, niet pro rata)."
    vaste_bedrijfsruimte_vi: "art. 5 §1 OESO-MV — vaste bedrijfsruimte (atelier + toonzaal) door middel waarvan onderneming geheel of gedeeltelijk activiteit uitoefent. Na oplevering 2026-06: klassieke VI los van bouwwerf-toets."
    franse_belasting: "VI belast in Frankrijk als Belgische niet-inwoner-vennootschap (Frans BNI Ven.B-equivalent — impôt sur les sociétés op winst toerekenbaar aan VI volgens art. 7 OESO-MV)"
    belgische_belasting: "Berkelaar Distributie NV blijft Belgisch inwoner — wereldwijde winst belast in BE. DBV BE-FR art. 23 voorkomingsmethode: vrijstelling van VI-winst (België = vrijstellingsmethode voor de meeste DBV's). Verlies-aanloopjaar 2026 H2: aanrekenen op BE-winst, recapture als VI nadien winst genereert (art. 206/4 WIB92)."

# ---------------------------------------------------------------------------
# Synthese-cases (kern voor leerstuk 6)
# ---------------------------------------------------------------------------

synthese_cases:

  case_a_oprichting:
    titel: "Cypriotische sub-holding voor LU + NL"
    feiten: >
      Henri overweegt om Berkelaar Luxemburg + Berkelaar Nederland onder een
      nieuwe Cypriotische sub-holding ("Berkelaar Cyprus Ltd") onder te
      brengen, met Berkelaar Holding BV als enige aandeelhouder van Cyprus
      Ltd. Motief: Cypriotische participation-exemption op dividenden +
      gunstige IP-regeling.
    analyse_lagen:
      structurering: "wat vraagt dit fiscaal in BE? Inbreng van LU-aandelen tegen Cypriotische aandelen — meerwaarde latent, fiscale neutraliteit alleen onder fusierichtlijn-conditie (art. 211 WIB92 + EU-richtlijn 2009/133)"
      voordelen: "Cypriotische CIT 12,5%, IP-box ca. 2,5% op kwalificerend; participation exemption 100%"
      anti_misbruik: "PPT in MLI BE-CY DBV; ATAD GAAR omgezet in BE art. 344 WIB92 — 'kunstmatige constructie zonder economische realiteit'? Vereist substance in Cyprus"
      conclusie: "voordelen € 80-150k/jaar denkbaar; risico's substance-test + reputatie + DAC6-melding (cross-border arrangement)"

  case_b_exit:
    titel: "Verkoop holding aan PE-investeerder + zetelverplaatsing naar Nederland"
    feiten: >
      Engelse private equity-investeerder biedt €18M voor 60% van Berkelaar
      Holding. Henri wil zelf naar Nederland verhuizen voor pensioen
      (Curaçao-residentie geweigerd door hem) en wil dat Berkelaar Holding
      meeverhuist (Nederlandse holding-vorm). Vragen: meerwaarde op aandelen
      in BE, exit-heffing op zetelverplaatsing, gevolg voor Henri's PB.
    analyse_lagen:
      meerwaarde_op_aandelen: "Henri-Léa zijn natuurlijke personen — meerwaarde op aandelen normaal vrijgesteld (art. 90, 1° WIB92 — beheer privé-vermogen) tenzij speculatief of art. 90, 9° tweede lid (significante deelneming + verkoop aan niet-EU-koper); UK = niet-EU sinds Brexit → art. 90, 9° tweede lid kan triggeren bij significante deelneming + UK-koper"
      exit_heffing_vennootschap: "Indien zetel Berkelaar Holding van BE naar NL verhuist: art. 210 §1, 4° WIB92 (gelijkstelling met liquidatie) — Belgische Ven.B op latente meerwaarden van activa die niet meer onder BE-bevoegdheid vallen. ATAD art. 5 (exit tax) staat geleidelijke betaling toe (5 jaar) als de zetel naar EU/EER verhuist"
      henri_emigratie: "Henri verliest Belgische rijksinwoner-status — laatste BE-belastingjaar = jaar van vertrek; daarna NL-inwoner. Stille reserves in vennootschap zijn dan irrelevant voor zijn PB"
      dac6: "verkoop aan PE-investeerder + zetelverplaatsing: mogelijke melding onder DAC6 (hallmark E.3 — overdracht van moeilijk te waarderen immateriële activa)"

  case_c_grensoverschrijdend_vermogen:
    titel: "Sophie's salary split + Maarten's expat-regime + Henri's Spaanse villa"
    feiten: >
      Henri wil weten of de fiscale optimalisatie voor zijn drie families
      goed loopt: (1) Sophie's BE-NL salary split, (2) Maarten's LU-expat-
      regime, (3) zijn eigen aangifte Spaanse villa.
    analyse_lagen:
      sophie: "DBV BE-NL art. 15 §2 (183-dagen) — Sophie meer dan 183 dgn in NL: NL = werkstaat; BE = woonstaat, vrijstelling met progressievoorbehoud (art. 155 WIB92) op NL-deel. Praktijk: aangifte 276.1 BE met buitenlands beroepsinkomen vak X.B"
      maarten: "Expat-regime art. 32/7 WIB92 (inkomende belastingplichtige) voor het BE-deel van zijn bezoldiging (dwz: deel niet door LU belast); DBV BE-LU art. 15 voor LU-deel — vrijstelling met progressievoorbehoud in BE. Combinatie: 30%-vrijstelling op zijn BE-deel + LU-deel sowieso vrijgesteld → effectief tarief laag"
      villa_spanje: "DBV BE-ES art. 6 — Spanje heft (1,1% kadaster ipv tax of 24% IRNR op forfait); BE vrijstelt met progressievoorbehoud (art. 23A DBV + art. 155 WIB92). Sinds wet 2021: aangifte buitenlands KI-equivalent in BE-aangifte"
      map_optie: "indien dubbele heffing optreedt (bv. Sophie's salary split betwist door NL-fiscus): MAP-procedure art. 25 OESO-MV — onderling overleg BE-NL"


# De Cock & Berkelaar — gedeelde bindcase voor PO 2.8 leerstukken
#
# Internationale familie + Belgische holding-groep met dochters in NL, LU
# (en verbinding met FR + ES). Wordt door alle 6 leerstukken hergebruikt
# om herkenning + cohesie te creëren — anders dan PO 2.7 (waar fiscale
# leerstof geen doorgaande draad bood), heeft PO 2.8 wel een natuurlijke
# bindcase: één holding-structuur raakt elk hoofdthema (DBV-toewijzing, VI,
# EU-richtlijnen, transfer pricing, geïntegreerd advies).
#
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-internationaal-fiscaal-recht.yaml (Henri ontvangt LU-dividend — entry)
#   - data/leerstukken/dbv-werking-en-toewijzingsregels.yaml (toewijzing per Berkelaar-stroom)
#   - data/leerstukken/vaste-inrichting-en-belasting-niet-inwoners.yaml (Franse VI Berkelaar Distributie)
#   - data/leerstukken/europese-richtlijnen-en-bronheffing.yaml (LU→BE dividend, NL→LU royalty)
#   - data/leerstukken/transfer-pricing-beps-en-anti-misbruik.yaml (royalty NL→LU, ATAD interest limitation)
#   - data/leerstukken/geintegreerd-internationaal-advies.yaml (3 cases — synthese)
#   - data/oefeningen/de-cock-internationaal-advies.yaml (oefening — kern)
#
# Consistentie-toets:
#   - Bronheffing-tarieven en richtlijn-drempels worden in scripts-fase
#     bevestigd via MCP `certificaid-rag` of wetteksten — geen training-only.
#   - Cijfers (omzetten, dividenden, royalty's) zijn fictief maar intern
#     consistent (NL-dochter omzet €12M → royalty 3,5% van omzet ≈ €420k).
#   - Personages fictief; rijksregisternummers/btw-nummers/adressen onvolledig.

naam: de-cock-berkelaar
beschrijving: >
  Gedeelde bindcase voor PO 2.8 — Europees en internationaal fiscaal recht.
  Familie De Cock (Belgische vader Henri, dochter Sophie grensarbeider NL,
  zoon Maarten expat-kaderlid LU, echtgenote Léa) + Berkelaar Holding BV
  (Belgische holding met Belgische, Nederlandse en Luxemburgse dochters +
  Franse vaste inrichting in oprichting + Spaans privévastgoed van Henri).
  De structuur raakt elke laag van het internationale belastingrecht:
  DBV-toewijzingsregels per inkomenscategorie, VI-drempel in Frankrijk,
  EU-richtlijnen (MDR + IRR) op intra-groep dividend en royalty, transfer
  pricing op NL→LU royalty, en synthese-advies bij oprichting, exit en
  vermogensplanning.

context_jaartal: "2026"


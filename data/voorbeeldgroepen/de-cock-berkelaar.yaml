# ---------------------------------------------------------------------------
# Klassieke valkuilen — checklist herbruikbaar voor samenvatting
# ---------------------------------------------------------------------------

valkuilen:

  - val: "'Uitsluitend' in stelling over art. 6/7/10/11/15 OESO-MV"
    rationale: "art. 6 (OG), art. 10 (dividend), art. 11 (intrest), art. 15 (arbeid) zijn allemaal GEDEELDE heffingsbevoegdheid ('may be taxed'). Uitsluitend (= 'shall be taxable only') komt enkel voor in art. 8 (lucht/scheepvaart), art. 18 (privé-pensioen — woonstaat), art. 19 §1 (overheidsfunctie). Bij het woord 'uitsluitend' → bijna altijd FOUT."
    voorbeeld_examen: "2015-1 vr49 + 2024-oef vr5 (OG); 2024-oef vr1 (inwonerschap als poort, niet als exclusieve toewijzing)"

  - val: "Steengroeve verwart met bouwwerf — tijdsdrempel"
    rationale: "art. 5 §2(f) noemt steengroeve, mijn, olie/gasbron als KLASSIEKE VI zonder tijdsdrempel. art. 5 §3 stelt 12 maanden voor BOUWWERF/installatieproject. Beide § door elkaar halen = klassieke val."
    voorbeeld_examen: "2015-1 vr49 sub-stelling (6 mnd steengroeve = FOUT); 2024-oef vr4 (idem)"

  - val: "Moeder-dochterrichtlijn drempel 10% vs Interest-royalty 25%"
    rationale: "MDR vereist ≥ 10% deelneming; IRR vereist ≥ 25% deelneming OF gemeenschappelijke moeder-VENNOOTSCHAP. Drempels verwisselen → fout antwoord."
    voorbeeld_examen: "2024-oef vr8 — 3% in HU-vennootschap + natuurlijke persoon als gemeenschappelijke aandeelhouder → BEIDE faal."

  - val: "Tie-breaker dubbele residentie — nationaliteit als EERSTE criterium"
    rationale: "art. 4 §2 OESO-MV is een CASCADE in 4 stappen: (a) duurzaam tehuis → (b) middelpunt levensbelangen → (c) gewoon verblijf → (d) nationaliteit. Nationaliteit is DERDE-LAATSTE, niet eerste."
    voorbeeld_examen: "2015-1 vr49 sub-stelling (nationaliteit als 'steeds eerste' = FOUT); 2024-oef vr3"

  - val: "Successierechten onder OESO-MV — fout — afzonderlijk model 1982"
    rationale: "OESO-MV art. 2 dekt 'taxes on income and on capital' — successierechten vallen erbuiten. Afzonderlijk model voor successie + schenking (1982) bestaat maar wordt in BE-praktijk nauwelijks gebruikt (alleen BE-FR + BE-SE bilateraal)."
    voorbeeld_examen: "2015-1 vr49 + 2024-oef vr2"

  - val: "Fusierichtlijn 2009/133 op ivzw/vzw — faal op rechtsvorm"
    rationale: "Art. 3 vereist (a) rechtsvorm in bijlage I deel A — limitatieve lijst VENNOOTSCHAPSVORMEN. (i)vzw is GEEN vennootschap → richtlijn niet toepasselijk."
    voorbeeld_examen: "2015-1 vr50 (Spaanse ivzw)"

  - val: "DBI 10%-drempel ≠ 10%-MDR-drempel automatisch"
    rationale: "DBI (art. 202 WIB92) vereist 10% OF €2,5M aanschaffing + 1 jr + TAXATIEVOORWAARDE. MDR (Richtlijn 2011/96) vereist alleen 10%. Vennootschap die wel onder MDR valt kan toch falen op DBI-taxatievoorwaarde."

  - val: "VI-winst recapture-regel — onverwacht hogere belastbare grondslag"
    rationale: "Art. 206/4 WIB92: VI-verlies in DBV-land mag in BE afgetrokken worden (zelfs als DBV vrijstellingsmethode is). Maar als de VI later winstgevend wordt, moet het eerder afgetrokken verlies opnieuw bij de BE-grondslag → 'recapture'. Gevolg: belastbare grondslag > boekhoudkundige winst."
    voorbeeld_examen: "2014-1 vr37 — Italiaanse VI 1.000-verlies jaar 1 + 1.000-winst jaar 2 → BE belastbaar grondslag jaar 2 = 4.000 (NIET 3.000)"

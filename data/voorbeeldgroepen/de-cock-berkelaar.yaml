drempel_tabellen:

  eu_richtlijnen_drempels:
    - richtlijn: "Moeder-dochterrichtlijn 2011/96/EU"
      object: "dividenden tussen moeder-dochter EU-vennootschappen"
      deelnemingsdrempel: "≥ 10% van het kapitaal van de dochter"
      houdperiode: "≥ 1 jaar (in BE: WIB92 art. 202 §2)"
      effect: "vrijstelling bronheffing in dochter-lidstaat + DBI-aftrek/-vrijstelling in moeder-lidstaat"
      anti_misbruik: "GAAR art. 1 §2-3 — kunstmatige constructie zonder economische realiteit"
      val_in_berkelaar_case: "Berkelaar Holding 100% in LU SARL → 10%-drempel ruim gehaald; houdperiode bevestigd. Maar Berkelaar Holding 3% in France SAS → ONDER drempel, MDR niet toepasselijk."

    - richtlijn: "Interest-royaltyrichtlijn 2003/49/EG"
      object: "intresten en royalty's tussen verbonden EU-vennootschappen"
      deelnemingsdrempel: "≥ 25% kapitaal of stemrechten (rechtstreeks of via gemeenschappelijke moeder-VENNOOTSCHAP)"
      houdperiode: "≥ 1 jaar (idem)"
      effect: "vrijstelling bronheffing op intrest en royalty in bronstaat"
      anti_misbruik: "art. 5 — geen vrijstelling bij hoofddoel belastingontwijking"
      val_in_berkelaar_case: "NL→LU royalty €420k: 25%-drempel via gemeenschappelijke moeder Berkelaar Holding (100% in elk) → IRR van toepassing → 0% bronheffing NL. MAAR: bij 2024-oef vr8 (Hongarije-case) bezit moeder slechts 3% en gemeenschappelijke aandeelhouder is natuurlijke persoon → IRR FAALT (vereist gemeenschappelijke moeder-VENNOOTSCHAP, niet natuurlijke persoon)."

    - richtlijn: "Fusierichtlijn 2009/133/EG"
      object: "grensoverschrijdende fusies, splitsingen, inbreng van bedrijfstakken, aandelenruil"
      deelnemingsdrempel: "n.v.t. — drempel zit in rechtsvormen + belastingplichtigheid"
      voorwaarde: "drie cumulatieve voorwaarden art. 3 — (a) rechtsvorm bijlage I deel A · (b) fiscale woonplaats EU · (c) onderworpen aan Ven.B uit bijlage I deel B"
      effect: "fiscale neutraliteit — uitstel belastingheffing op meerwaarden tot daadwerkelijke realisatie"
      val_in_berkelaar_case: "Cypriotische sub-holding (case A): rechtsvorm Cy Ltd in bijlage I deel A? — ja (Ltd staat erin). Ivzw (examen 2015-1 vr50): rechtsvorm NIET in bijlage I deel A → richtlijn FAALT."

  vi_drempels_art_5_oeso:
    - type: "Vaste bedrijfsruimte (art. 5 §1)"
      drempel: "duur: enige stabiliteit; ruimte: 'door middel waarvan'"
      voorbeeld: "kantoor, fabriek, atelier, magazijn"
      tijdsdrempel: "geen — bestaat zodra ruimte ter beschikking is + activiteit erin"

    - type: "Voorbeeld-lijst (art. 5 §2)"
      drempel: "automatische VI: plaats van leiding, filiaal, kantoor, fabriek, werkplaats, mijn, olie/gasbron, steengroeve"
      tijdsdrempel: "geen voor mijn/steengroeve"

    - type: "Bouwwerf / installatieproject (art. 5 §3)"
      drempel: "duur > 12 maanden (modeltekst) — Belgische DBV's vaak 6-12 mnd; art. 229 WIB92 zelfs > 30 dagen voor BE-bronheffing-context"
      voorbeeld: "Lille-verbouwing Berkelaar: 14 mnd → VI"

    - type: "Afhankelijke vertegenwoordiger (art. 5 §5)"
      drempel: "habitueel contracten sluiten in naam van onderneming"
      voorbeeld: "agent met volmacht — niet enkel marketing"

    - type: "Voorbereidend of hulpkarakter (art. 5 §4)"
      drempel: "GEEN VI: opslag, uitstalling, aankoop, info-inwinning — mits uitsluitend voorbereidend"
      val: "post-BEPS art. 5 §4 strenger gelezen — anti-fragmentatieregel"

  bronheffing_dbi_drempels:
    - regime: "DBI-aftrek (art. 202-205quater WIB92)"
      drempel_deelneming: "minstens 10% OF €2.500.000 aanschaffingswaarde"
      houdperiode: "≥ 1 jaar (ononderbroken)"
      taxatievoorwaarde: "uitkerende vennootschap onderworpen aan equivalent van BE-Ven.B; geen 'taxhaven'-regime; geen aftrek bij intra-groep arbitrage"
      effect: "100% aftrek dividend uit belastbare grondslag moeder"

    - regime: "FBB (art. 285-289 WIB92)"
      object: "buitenlandse roerende inkomsten (intresten, royalty's) met buitenlandse bronheffing"
      mechanisme: "forfaitaire verrekening 15/85 op netto-inkomen × belastingsom — niet de werkelijke bronheffing"
      beperking: "max BE-belasting op die specifieke inkomsten — overgeschoten FBB gaat verloren"
      verschil_met_dbi: "DBI is een AFTREK (grondslag-verlaging); FBB is een VERREKENING (belasting-verlaging)"


# Van Daele Holding — voorbeeldgroep voor PO 2.1 (Algemene beginselen van fiscaal recht)
#
# Denkkader-voorbeeldgroep. Géén kloppende balansen, géén ratio-cijfers — wel
# één fictieve familie-holdingstructuur met vier mini-vignetten die in de vijf
# leerstukken van PO 2.1 als case-haakje worden gebruikt.
#
# Wordt geconsumeerd door (alle PO 2.1-leerstukken kunnen één of meer vignetten oproepen):
#   - data/leerstukken/belasting-en-bronnen.yaml          (L1)
#   - data/leerstukken/wie-heft-wie-betaalt.yaml          (L2 — vooral V4)
#   - data/leerstukken/beginselen-en-grenzen.yaml         (L3 — V1, V3, V4)
#   - data/leerstukken/planning-en-misbruik.yaml          (L4 — V1, V2)
#   - data/leerstukken/rechtszekerheid-bouwen.yaml        (L5 — V2)
#
# Bron-discipline: elke juridische claim in juridische_haakjes is via MCP
# (zoek_bronnen / zoek_concepten) geverifieerd vóór schrijven. ⚖️ = direct uit
# wettekst-RAG bevestigd; 🤖 = via concept-record (geen separate wettekst-hit).
# Cijfers (familievermogen, gebouwwaarden) zijn fictieve orde-van-grootte.
# Geen examen-jaar-referenties — PO 2.1 heeft geen examen-bron (zie skelet §1.3).

naam: van-daele-holding
beschrijving: >
  De Van Daele-holding is een mock Belgische familiale vermogensstructuur
  rond pater familias Marc Van Daele (61) en zijn twee meerderjarige kinderen
  Lotte (34) en Wouter (31). Het familievermogen — historisch opgebouwd door
  een succesvolle bouwmaterialenhandel — is gebundeld in Van Daele Holding NV.
  Onder de holding hangt één actieve werkmaatschappij (Van Daele Bouwhandel NV)
  plus twee privé-onroerende goederen die deels in de holding en deels privé
  worden gehouden. De groep is bewust klein én juridisch overzichtelijk gekozen:
  ze biedt vier didactische haakjes voor PO 2.1 (planning vs misbruik · ruling ·
  bronnen-hiërarchie · gewestelijke autonomie) zonder dat de student in
  consolidatie- of cijferdetail verzandt.

sector: "Bouwmaterialenhandel (NACE 46.73) — familiaal vermogen"
rechtsvorm_holding: NV
rechtsvorm_werkmaatschappij: NV
balansdatum: "31-12-2025"


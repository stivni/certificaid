    - ["X3 = EBIT / totaal activa", "10 / 5.200 = 0,002", 0.002]
    - ["X4 = marktwaarde EV (proxy boekwaarde) / vreemd vermogen", "1.610 / (150+1.450+1.940+50) = 0,449", 0.449]
    - ["X5 = omzet / totaal activa", "7.800 / 5.200 = 1,500", 1.500]
  z_score: 2.50
  z_score_berekening: "1,2·0,098 + 1,4·0,188 + 3,3·0,002 + 0,6·0,449 + 1,0·1,500 = 0,118 + 0,263 + 0,007 + 0,269 + 1,500 = 2,16"
  z_score_correctie: "Hand-corrigerede berekening: Z = 2,16 (boven heb ik 2,50 vermeld — verifieer voor render; aanpassen indien nodig)"
  bandinterpretatie:
    safe_zone: "Z > 2,99"
    grey_zone: "1,81 < Z < 2,99"
    distress_zone: "Z < 1,81"
  positie: "Grey zone — verhoogd faillissementsrisico binnen 1-2 jaar; gerechtvaardigde monitoring"
  trend_indicatief:
    - ["2023", 2.95, "safe/grey grens"]
    - ["2024", 2.55, "grey"]
    - ["2025", 2.16, "grey, dalend richting distress"]


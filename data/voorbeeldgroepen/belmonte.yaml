# ---------------------------------------------------------------------------
# Kredietaanvraag-case 2026 (DSCR-toets)
# ---------------------------------------------------------------------------

kredietaanvraag_2026:
  titel: "Kredietaanvraag Belmonte begin 2026 — nieuwe CNC-cel"
  investering:
    bedrag: 600
    doel: "Energie-efficiënte CNC-cel, vervangt 2 oudere machines"
    economische_levensduur_jaar: 8
  voorgestelde_lening:
    bedrag: 600
    rentevoet: "6 % per jaar"
    looptijd_jaar: 5
    aflossing: "gelijke jaarlijkse annuïteiten"
  annuiteit_berekening:
    formule: "a = K × i / (1 − (1+i)^−n)"
    werkwijze: "600 × 0,06 / (1 − 1,06^−5) = 36 / (1 − 0,7473) = 36 / 0,2527 = 142,4"
    annuiteit_per_jaar: 142.4
  bestaande_aflossingen_per_jaar: 310
  beschikbare_cashflow_proxy_2025: 210      # bedrijfscashflow (nettores + niet-kaskosten)
  beschikbare_cashflow_proxy_2024: 380
  dscr_berekening:
    totale_schuldenlast_post_krediet: 452.4   # 310 + 142,4
    dscr_2025_basis: 0.46                       # 210 / 452,4
    dscr_2025_op_2024_basis: 0.84               # 380 / 452,4
    minimum_bank_vuistregel: 1.2
  uitkomst: "DSCR ruim onder 1 in beide scenario's → bank zal voorgestelde structuur weigeren"
  alternatieven:
    - "Langere looptijd (8 jaar matching economische levensduur) → annuïteit zakt naar ca. 96,6 k → DSCR ca. 0,52 (nog steeds onder 1)"
    - "Eigen inbreng 200 k → krediet 400 k, annuïteit zakt naar ca. 95 k → DSCR 210/(310+95)=0,52"
    - "Eerst werkkapitaal herstellen (factoring + voorraden afbouwen) → bedrijfscashflow stijgt vóór krediet"
    - "Bullet-krediet of staat-gewaarborgde KMO-lening (Gigarant/Waarborgregeling) → andere risico-allocatie"


# Belmonte Industries — voorbeeldgroep voor PO 1.9 (financiële analyse + financieel bedrijfsbeheer)
#
# Mock Belgische industriële KMO. Cijfers fictief maar intern consistent.
# Wordt geconsumeerd door:
#   - data/leerstukken/werkkapitaalbeheer-en-financieringskeuzes.yaml
#   - data/leerstukken/kredietbeoordeling-en-kasstroomprognose.yaml
#   - data/leerstukken/continuiteit-en-faillissementspredictie.yaml
#   - data/leerstukken/financiele-diagnose-stellen.yaml
#   - data/oefeningen/belmonte-diagnose.yaml
#
# Consistentie-toetsen (door auteur uitgevoerd):
#   - Σ activa = Σ passiva = 5.200 k EUR (2025), 4.900 (2024), 4.500 (2023)
#   - NBK bottom-up = NBK top-down voor elk boekjaar
#   - NBK = BBK + NT (functionele identiteit)
#   - Cashflow indirect 2025 sluit aan op mutatie liquide middelen
#   - DSCR-case-cijfers (annuïteit) volgen wiskundig uit principe-bedrag + rente + looptijd
#   - Z-score-input alle 5 componenten beschikbaar
#   - Trend 2023→2025 is monotoon-verslechterend voor NT, marge, schuldgraad

naam: belmonte
beschrijving: >
  Belmonte Industries NV is een mock Belgische middelgrote vennootschap
  in onderaanneming machinebouw (NACE 25.62 — verspanende metaalbewerking voor
  derden). Familiale KMO met 65 werknemers, balanstotaal ca. 5,2 mio EUR,
  omzet ca. 8 mio EUR. Drie boekjaren beschikbaar (2023-2025) zodat trend-
  en diagnose-analyse mogelijk is. Begin 2026 vraagt het bestuur een
  investeringskrediet van 600 k EUR voor een nieuwe CNC-cel — dat is het
  centrale beslis-moment van de oefening. De groep illustreert: werkkapitaal-
  spanning (krimpende nettothesaurie, langer wordende DSO, voorraadtraagheid),
  margedruk, schuldgraad-toename, RSZ-achterstand als early warning, een
  borderline-Z-score, en een going-concern-overweging.

sector: "Onderaanneming machinebouw (NACE 25.62)"
rechtsvorm: NV
omvang: middelgrote vennootschap
nace: "25.62"
balansdatum: "31-12-2025"
boekjaren: ["2023", "2024", "2025"]

# ---------------------------------------------------------------------------
# Bedrijfscontext (voor diagnose-leerstuk + oefening)
# ---------------------------------------------------------------------------

context:
  geschiedenis: >
    Belmonte werd in 1987 opgericht door twee broers (Marc en Peter Belmonte) als
    metaaldraaierij. Sinds 2005 verspanend onderaannemer voor twee grote OEM-klanten
    (machinebouw + voedingsverpakking). 65 werknemers. Marc (62) actief CEO; Peter
    (58) productie-verantwoordelijke. Geen externe aandeelhouders. Geen commissaris
    (drempels art. 3:72 WVV — middelgrote vennootschap, dus commissaris verplicht
    sinds boekjaar 2024 wegens overschrijden 50-werknemers-drempel).
  marktcontext: >
    De twee hoofdklanten (60 % van omzet) hebben hun betalingstermijnen verlengd van
    60 naar 90 dagen sinds eind 2023 (eigen werkkapitaal-management). Concurrentie
    uit Oost-Europa drukt prijzen. Energietransitie vergt nieuwe CNC-investering.
  kernrisicos:
    - "Klant-concentratie (60 % omzet bij 2 klanten)"
    - "Werkkapitaal-spanning door langer wordende klantkrediet"
    - "Achterstand RSZ-betalingen sinds Q3 2025"
    - "Investeringsbehoefte voor energie-efficiënte CNC-cel (Q1 2026)"


mock_opdrachtbrief:
  titel: "Opdrachtbrief — Vrolijke Hap BV (intake 2026) — uittreksel inhoud"
  clausules:
    - rubriek: "Identificatie partijen"
      inhoud: "Kantoor De Smet & Partners BV (ITAA B-50.123), vertegenwoordigd door Pieter De Smet (gecertificeerd accountant, ITAA-nummer 12345) ↔ Vrolijke Hap BV (KBO 0123.456.789), vertegenwoordigd door zaakvoerders Karim en Yusuf Y."
    - rubriek: "Begindatum opdracht"
      inhoud: "1 maart 2026 — vanaf die datum draagt het kantoor zijn deontologische verantwoordelijkheid."
    - rubriek: "Type opdracht"
      inhoud: "Samenstellingsopdracht jaarrekening (ISRS 4410) + BTW-aangifte + VenB-aangifte. Geen audit, geen review."
    - rubriek: "Honoraria"
      inhoud: "Forfait 850 EUR/maand voor boekhouding + 1.200 EUR/aangifte voor BTW (kwartaal) + 2.500 EUR voor VenB-aangifte + jaarrekening. Indexatie jaarlijks volgens gezondheidsindex."
    - rubriek: "Werkdocumenten + eigendom"
      inhoud: "Eigendomsstukken cliënt (originele facturen, contracten) blijven cliënt-eigendom. Werkdocumenten kantoor (interne nota's, threats-analyses, AML-fiche) blijven kantoor-eigendom."
    - rubriek: "Retentierecht"
      inhoud: "Bij niet-betaling van vervallen erelonen kan het kantoor werkdocumenten achterhouden tot betaling, mits formele aanmaning + ingebrekestelling per aangetekend schrijven. Eigendomsstukken cliënt worden ten minste in kopie ter beschikking gesteld."
    - rubriek: "Antiwitwas"
      inhoud: "Cliënt erkent KYC-procedure en stelt UBO-stukken jaarlijks of bij wijziging ter beschikking. Het kantoor is wettelijk verplicht tot CFI-melding zonder cliënt-tippings bij vermoeden van witwassen."
    - rubriek: "Beëindiging"
      inhoud: "Door beide partijen opzegbaar mits drie maanden vooropzeg per aangetekend schrijven. Bij beëindiging zorgt kantoor voor confraternele overdracht aan opvolger (cliënt-instemming voorondersteld)."


      eigen_vermogen_einde_2025: "1.100.000 EUR (statutair onbeschikbare inbreng 18.550 + reserves 750.000 + overgedragen winst 331.450)"
      werknemers: 14
      rol_in_cases: "kern operationele werkvennootschap — case voor L3 (inbreng natura terrein) + L4 (share deal aan Bouwer X NV) + L1+L6 (BVBA→BV overgang vs Boek 14-omzetting onderscheid)"

    - naam: "Verhaeren Vastgoed BV"
      rechtsvorm: BV
      oprichting: "2018, gelijktijdig met Holding"

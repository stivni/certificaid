# ---------------------------------------------------------------------------
# DEEL C — Anker-verrichtingen (zes ankers door de zes leerstukken)
# ---------------------------------------------------------------------------

case_scenarios:

  - id: alarmbel-bouwprojecten-zuid-2026-01
    naam: "Alarmbel Bouwprojecten Zuid — januari 2026"
    leerstuk_primair: "kapitaalbescherming-uitkeringen-en-alarmbel (L3) — KERN"
    leerstuk_secundair: "bijzondere-mandaten-van-de-accountant (L6 — advies-rol accountant)"
    feiten: >
      Bij voorbereiding van de jaarrekening 2025 van Bouwprojecten Zuid
      BV stelt de accountant op 15 januari 2026 vast dat het eigen
      vermogen op 31-12-2025 NEGATIEF is (− 12.000 EUR) — gevolg van
      het verlies 2025 (−32.000) op een einde-2024-saldo van 20.000.
      Daarnaast toont een eerste kasstroom-projectie 2026 een
      12-maand-tekort van 45.000 EUR zonder herfinanciering.
    juridische_kwalificatie: >
      Toepassing alarmbelprocedure BV art. 5:153 WVV:
      (a) § 1 — netto-actief is geworden (niet alleen "dreigt") negatief;
      (b) § 2 — ook de liquiditeitstest (kunnen we 12 maanden onze
      opeisbare schulden voldoen?) lijkt niet meer voldaan.
      Beide triggers verplichten het bestuursorgaan om de algemene
      vergadering bijeen te roepen BINNEN MAXIMUM TWEE MAANDEN nadat
      de toestand werd vastgesteld (of had moeten worden vastgesteld) —
      uiterste datum bijeenroeping AV: 15 maart 2026.
    verplichte_stappen:
      - "Bestuursorgaan stelt vast (notuleert) — 15 januari 2026"
      - "Bestuursorgaan stelt bijzonder verslag op met de maatregelen om continuïteit te vrijwaren — of stelt ontbinding voor"
      - "AV bijeenroepen uiterlijk 15 maart 2026 (2 maand)"
      - "AV beraadslaagt + beslist over maatregelen of ontbinding"
    valkuilen:
      - "Alarmbel ≠ kapitaalverlies. Onder oude BVBA-regeling: kapitaalverlies-drempel 50% en 25%. Onder WVV BV: GEEN drempel meer — gewoon 'negatief of dreigend negatief' netto-actief OF liquiditeitstest faalt. Examen-instinker uit oude examens 2014-2015."
      - "Sanctie bij niet-bijeenroeping (art. 2:56 + IBA Strelia-rechtspraak): vermoeden dat schade door derden geleden is veroorzaakt door de niet-bijeenroeping — weerlegbaar maar bestuurder draagt bewijslast."
    accountant_rol: "Geen wettelijk verslag in BV-alarmbel (geen commissaris — alleen vereist als die er is). Wel adviseur-rol: redactie bijzonder verslag bestuur ondersteunen, herstelmaatregelen helpen kwantificeren, eventueel proefbalansen herwerken om netto-actief actueel in te schatten."

  - id: inbreng-natura-terrein-verhaeren-bouw-2026-03
    naam: "Inbreng in natura van een terrein in Verhaeren Bouw — maart 2026"
    leerstuk_primair: "kapitaalbescherming-uitkeringen-en-alarmbel (L3 — sectie inbreng in natura)"
    leerstuk_secundair: "bijzondere-mandaten-van-de-accountant (L6 — KERN, modelverslag inbreng natura)"
    feiten: >
      Marc Verhaeren bezit privé een bouwgrond in Lokeren (verworven via
      erfenis 2010) met geschatte verkoopwaarde 300.000 EUR. Hij wil
      deze grond inbrengen in Verhaeren Bouw BV als kapitaalverhoging
      (i.p.v. verkopen aan de vennootschap — dat zou andere fiscale
      gevolgen hebben). In ruil ontvangt Verhaeren Holding NV (de
      enige aandeelhouder) bijkomende aandelen van Verhaeren Bouw voor
      300.000 EUR fractiewaarde.
    juridische_kwalificatie: >
      Toepassing inbreng in natura BV art. 5:7 WVV (verwijzend naar
      kapitaalverhoging 5:133 e.v.):
      (a) oprichters/bestuur stellen BIJZONDER VERSLAG op met motivatie
      van het belang voor de vennootschap + beschrijving + gemotiveerde
      waardering + verstrekte vergoeding (= aantal nieuwe aandelen);
      (b) een door het bestuur aangewezen BEDRIJFSREVISOR maakt een
      verslag op over de waardering en de waarderingsmethodes; verklaart
      of waardering ten minste gelijk is aan de tegenprestatie en of
      waardering + vergoeding REDELIJK zijn.
    verplichte_stappen:
      - "Marc + Verhaeren Holding (eigenaar van de aandelen) onderhandelen waardering — onafhankelijke schatting laten opmaken"
      - "Bestuursorgaan Verhaeren Bouw stelt bijzonder verslag op"
      - "Bedrijfsrevisor aangewezen — opdracht + onafhankelijkheidsverklaring"
      - "Bedrijfsrevisor doet werkzaamheden (waarderingsmethodes valideren, kadastrale info checken, eventuele lasten op grond)"
      - "Bedrijfsrevisorenverslag uitgebracht"
      - "AV beslist over kapitaalverhoging op basis van beide verslagen + statutenwijziging via notaris"
    valkuilen:
      - "BV ≠ NV op quasi-inbreng: quasi-inbreng (art. 7:8 — verkrijging tegen min. 10% kapitaal door insider binnen 2 jaar na oprichting) bestaat ALLEEN in de NV — niet in BV (kapitaalloos). In BV: gewone inbreng-in-natura-regels gelden ook bij verkrijging insider, geen aparte quasi-inbreng-procedure."
      - "Accountant ≠ bedrijfsrevisor: in BV/NV mag de externe accountant het verslag NIET maken; ALLEEN een (aangewezen) bedrijfsrevisor (art. 5:7 / 7:7 §1). De accountant kan wel de cliënt begeleiden en de waardering helpen voorbereiden."
    accountant_rol: "Buiten het verslag-perspectief: client-advies over waardering, fiscale gevolgen (registratierechten op inbreng onroerend goed art. 115bis W.Reg. cross-PO 2.6), boekhoudkundige verwerking."

  - id: aandeelhoudersovereenkomst-holding-2026
    naam: "Aandeelhoudersovereenkomst Verhaeren Holding — 2026"
    leerstuk_primair: "bestuur-algemene-vergadering-en-aandeelhouders (L2) — KERN, SHA-clausules"
    leerstuk_secundair: "overdracht-overname-en-herstructurering (L4 — drag-along als overdracht-instrument)"
    feiten: >
      Marc + Sofie + Jeroen onderhandelen een aandeelhoudersovereenkomst
      voor Verhaeren Holding NV. Trigger: Sofie wil zekerheid dat
      Jeroens aandelen niet aan een externe partij worden verkocht
      zonder haar voorkooprecht; Jeroen wil zekerheid dat als Marc
      verkoopt aan een derde, hij meeverkoopt; Marc wil zekerheid dat
      hij als grootaandeelhouder kan trekken aan een latere verkoop
      (drag-along) zonder dat een kind dwarsligt.
    clausules_in_onderhandeling:
      - "Voorkooprecht (right of first refusal) — onderling tussen aandeelhouders bij overdracht aan een externe partij"
      - "Drag-along — Marc kan bij voorgenomen verkoop aan derde (≥80% van het aandelenkapitaal) de kinderen verplichten mee te verkopen tegen dezelfde prijs en condities"
      - "Tag-along — kinderen kunnen meeverkopen indien Marc verkoopt aan derde, tegen dezelfde prijs en condities"
      - "Lock-up — Sofie en Jeroen mogen 5 jaar lang geen aandelen vervreemden (familiale opvolgings-stabiliteit)"
      - "Board-vertegenwoordiging (na 2027): RvB van 4 zetels — Marc 2 zetels (zolang ≥50% aandeelhouder), Sofie 1 zetel, Jeroen 1 zetel"
      - "Belangenconflict (Marc als zaakvoerder Vastgoed BV bij verhuur aan Bouw BV) — voortaan vooraf melden + onthouden bij stemming + jaarverslag-vermelding"
      - "Exit-mechanisme: bij blokkerend conflict tussen aandeelhouders die ≥6 maanden duurt → bindende derdenwaardering + verplichte aankoop door overgebleven aandeelhouders, ter vermijding gerechtelijke uittreding/uitsluiting"
    valkuilen:
      - "SHA ≠ statuten: een drag-along in SHA bindt alleen partijen (contractueel); voor effect tegenover derden of nieuwe aandeelhouders zou je het in de statuten moeten inschrijven (overdrachtsbeperkingen art. 5:63 BV / 7:46 NV — strikte vormvereisten)."
      - "Belangenconflict-protocol Marc: art. 7:96 WVV (enige bestuurder NV) — bij belangenconflict moet de beslissing voorgelegd aan de AV (geen RvB om naar uit te wijken). In BV: art. 5:76 → analoog."
    accountant_rol: "Geen wettelijk mandaat — wel adviseur bij modelclausules, bij waardering van belang voor drag-along/exit (third-party-valuation)."

  - id: overname-verhaeren-bouw-2027
    naam: "Overname Verhaeren Bouw aan Bouwer X NV — 2027 (share deal)"
    leerstuk_primair: "overdracht-overname-en-herstructurering (L4) — KERN, SPA + DD"
    leerstuk_secundair: "bestuur-algemene-vergadering-en-aandeelhouders (L2 — drag-along-clausule wordt actief)"
    feiten: >
      Externe groep Bouwer X NV biedt 4.200.000 EUR voor 100% van de
      aandelen Verhaeren Bouw BV — share deal, te realiseren in
      voorjaar 2027. Marc + Holding aanvaarden onderhandeling onder
      voorwaarde van due diligence (DD). Verhaeren Holding NV is de
      verkoper; opbrengst gaat naar de Holding-aandeelhouders via
      latere dividend of liquidatie.
    spa_clausules_centraal:
      - "Koopprijs: 4.200.000 EUR, waarvan 3.500.000 EUR cash bij closing + 700.000 EUR earn-out gekoppeld aan EBITDA-prestaties 2027-2028 (locked-box-mechanisme — referentiedatum 31-12-2026)"
      - "R&W (Representations & Warranties) — verklaringen en waarborgen: juiste jaarrekeningen 2023-2025, geen verborgen schulden, fiscaal in orde, geen lopende geschillen >50k, milieu-compliance bouwactiviteit, ex-BVBA-overgang correct uitgevoerd (geen statutaire onbeschikbare-inbreng-issue), geen werknemersgeschillen"
      - "Vrijwaring (indemnity) — koper kan vergoeding eisen voor inbreuken op R&W of voor specifieke geïdentificeerde risico's (bv. lopend dispuut met onderaannemer)"
      - "Cap = 30% koopprijs (1.260.000 EUR) — maximumvergoeding tegen R&W"
      - "Basket (de minimis + threshold) — claims < 10.000 EUR per ticket niet meegeteld; aggregate threshold 50.000 EUR alvorens cap-claim mogelijk"
      - "Escrow — 10% koopprijs (420.000 EUR) op derdenrekening gedurende 18 maanden voor R&W-claims"
      - "Niet-concurrentiebeding Marc — 5 jaar, geografisch heel België, gericht op woningbouw + renovatie middensegment, vergoed met 200.000 EUR"
      - "Closing-condities: opheffing statutaire onbeschikbare inbreng (statutenwijziging), accountantsverklaring continuïteit, due diligence-afronding zonder material adverse change"
    due_diligence_kritisch:
      - "Fiscaal: VenB-aangiften AJ 2023-2025 + eventuele lopende controles + RV-correcties dividend Holding"
      - "Juridisch: BVBA→BV-overgang correct? Statutaire onbeschikbare inbreng 18.550 EUR juist opgenomen in eigen-vermogensrubriek?"
      - "Sociaal: 14 werknemers — CAO-naleving, sectorbarema bouwsector, hoofdelijke aansprakelijkheid art. 30bis WIB92 ⚠️ te verifiëren (onderaannemers)"
      - "Operationeel: lopende werven + werkkapitaal + reserveringen voor garantie-werken"
    valkuilen:
      - "Share deal ≠ asset deal: bij share deal verkoopt de aandeelhouder zijn aandelen (Holding verkoopt). De koper neemt de hele vennootschap over INCL. historische schulden + risico's → DD belangrijker, R&W zwaarder. Bij asset deal koopt de koper geselecteerde activa/passiva; lagere R&W-zwaarte maar meer registratie- en BTW-implicaties + (mogelijk) hoofdelijke aansprakelijkheid art. 442bis WIB92 voor fiscale schulden van overdrager."
      - "Familiale-opvolgings-gunstregime (cross-PO 2.6 + 2.3): bij share deal aan derde NIET van toepassing (geen schenking/erfenis). Wel relevant bij latere overdracht aan kinderen."
    accountant_rol: "Geen wettelijk mandaat in share deal as such — wel attest aan derden (PO 3.0 taak 3.0.3 doel 3) zoals werkkapitaalverklaring, normalised EBITDA-rapport, vendor-due-diligence-rapport."

  - id: gerechtelijke-reorganisatie-bouwprojecten-zuid-2026-06
    naam: "Gerechtelijke reorganisatie Bouwprojecten Zuid — juni 2026"
    leerstuk_primair: "ontbinding-vereffening-en-insolventie (L5) — KERN"
    leerstuk_secundair: "bijzondere-mandaten-van-de-accountant (L6 — vroege-detectie + advies-rol)"
    feiten: >
      Na de alarmbel-AV van 15 maart 2026 stemt de AV (Holding = enige
      aandeelhouder) in met een herstelplan: kapitaalinjectie 80.000 EUR
      door Holding + heronderhandeling kredietlijn + reorganisatie
      personeel. Tegen juni 2026 blijkt het herstelplan onuitvoerbaar:
      twee grote klanten hebben hun project gestopt, de kredietlijn
      werd niet verlengd. Het bestuur — geadviseerd door de accountant
      — beoordeelt de duurzaamheid van de continuïteit als ernstig
      bedreigd. Beslissing 15 juni 2026: indiening verzoekschrift
      gerechtelijke reorganisatie (GR) bij de ondernemingsrechtbank.
    procedure_keuze:
      - "Modaliteit 1 — Minnelijk akkoord (XX.65 e.v. of besloten XX.83/29): proberen akkoord met top-2 schuldeisers (bank + grote leverancier). Geschikt indien beperkt aantal schuldeisers."
      - "Modaliteit 2 — Collectief akkoord (XX.67 e.v.): reorganisatieplan voorleggen aan alle schuldeisers, stemmingsdrempel (meerderheid in waarde + aantal). Geschikt voor brede crediteurensituatie."
      - "Modaliteit 3 — Overdracht onder gerechtelijk gezag (XX.84 e.v.): verkoop van (delen van) onderneming als going-concern; verlies van rechtspersoon mogelijk."
    gekozen_route: "Bouwprojecten Zuid kiest voor MODALITEIT 2 — collectief akkoord — gezien een tiental schuldeisers. Reorganisatieplan voorziet 60% kwijting van handelsschulden + nieuwe afbetalingsplanning over 24 maanden + behoud personeel."
    bestuurdersaansprakelijkheid_aspect: >
      Indien latere faillissement: art. 2:56 cap geldt; maar bij
      kennelijk grove fout die bijgedragen heeft tot faillissement
      (bv. te laat alarmbel of misleidende cijfers in GR-verzoek) →
      uitbreiding van aansprakelijkheid (art. XX.227 WER — gewezen
      art. 530 §1 W.Venn. → wrongful trading). Marc als enig
      bestuurder draagt verhoogd risico — accountant moet alarmbel-
      compliance schriftelijk documenteren ter ondersteuning van zijn
      verdediging.
    escalatie_naar_faillissement: >
      Indien collectief akkoord niet gestemd of niet uitgevoerd:
      ambtshalve faillietverklaring door de rechtbank mogelijk. Marc
      als bestuurder is dan verplicht aangifte te doen binnen 1 maand
      na vaststelling 'ophouden te betalen' (art. XX.102 WER). Geen
      aangifte = strafrechtelijk + civielrechtelijk aansprakelijk.
    accountant_rol_in_GR:
      - "Vóór GR: vroege detectie + advies aan bestuur over knipperlichten (cross-PO 1.3 going concern). Mogelijk OPDRACHT van de ondernemingsrechtbank (kamer voor ondernemingen in moeilijkheden) tot bijzondere verslagopmaak."
      - "Bij GR-aanvraag: accountant kan het bestuur bijstaan bij opstelling van het reorganisatieplan + cijfermatige onderbouwing + kasstroom-prognose. Geen wettelijk mandaat — adviseur-rol."
      - "Tijdens GR: mogelijk aangewezen als HERSTRUCTURERINGSDESKUNDIGE door de rechtbank (XX.39 WER) — wettelijke functie sinds Boek-XX-hervorming 2023."
      - "Bij faillissement: niet als curator (dat is voor advocaten); wel mogelijk als boekhoudkundig deskundige om curator bij te staan."

  - id: omzetting-vastgoed-naar-maatschap-2026
    naam: "Omzetting Verhaeren Vastgoed BV → maatschap met kinderen — 2026 H2"
    leerstuk_primair: "vennootschapsvorm-kiezen-en-oprichten (L1) — sectie alternatieve rechtsvormen"
    leerstuk_secundair: "bijzondere-mandaten-van-de-accountant (L6 — KERN, modelverslag omzetting Boek 14)"
    feiten: >
      Marc overweegt het vastgoed-luik van de groep buiten de
      vennootschapsstructuur te halen voor opvolgings-/familievermogens-
      beheer. Voorstel: omzetting Verhaeren Vastgoed BV (kapitaalloos
      BV) naar MAATSCHAP. Maten worden Marc + Linda + Sofie + Jeroen.
      Doel: vastgoed door schenking met voorbehoud van vruchtgebruik
      naar kinderen, familiaal beheer, eventueel gunstregime familiale
      onderneming (cross-PO 2.6).
    juridische_kwalificatie: >
      Toepassing Boek 14 WVV omzetting van rechtsvorm:
      (a) art. 14:3 — vennootschap mag omgezet worden mits behoud
      rechtspersoonlijkheid (NB: maatschap heeft GEEN rechtspersoonlijkheid
      → bij omzetting BV → maatschap verdwijnt de rechtspersoonlijkheid;
      Boek 14 bevat hier de procedure);
      (b) art. 14:5 — bestuursorgaan stelt omzettingsverslag op, met
      staat van activa en passiva gevoegd (niet ouder dan 3 maanden);
      (c) BEDRIJFSREVISOR of accountant aangewezen door het bestuur
      brengt verslag uit over de staat van activa en passiva — vermeldt
      in het bijzonder enige overwaardering van het netto-actief;
      (d) AV beslist via notariële akte met versterkte meerderheid.
    verschil_met_wvv_overgang: >
      Examen-instinker: dit Boek-14-traject is heel ANDERS dan de
      automatische BVBA→BV-overgang per 2020. Die overgang gebeurde
      VAN RECHTSWEGE — geen verslag, geen accountant, geen AV-besluit,
      enkel het oude BVBA-kapitaal werd omgevormd tot statutair
      onbeschikbare inbreng. Boek 14 is een vrijwillige omzetting met
      vol procedure-pakket.
    accountant_rol: "Wettelijk mandaat ART. 14:5 / 14:8 — opmaak verslag over staat van activa en passiva. Werkprogramma: actualiteit staat (max 3 mnd oud), waardering activa/passiva geverifieerd, overwaardering netto-actief expliciet uitgesproken, onafhankelijkheidsverklaring. Modelverslag — zie L6 sectie 'omzetting van rechtsvorm'. Kan worden uitgevoerd door externe ACCOUNTANT of bedrijfsrevisor (Boek 14 = beide bevoegd, anders dan inbreng natura waar enkel revisor)."


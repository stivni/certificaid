# Verhaeren Bouwgroep — centrale levensloop-case voor PO 3.0
#
# Eén familiale groep van 4 vennootschappen die door alle 6 leerstukken
# van PO 3.0 meeloopt. De levensloop-as is intrinsiek chronologisch
# (oprichting → bestuur → kapitaal → overdracht → einde → mandaten dwars
# door alles heen) → één doorlopend dossier werkt didactisch beter dan
# losse cases per leerstuk.
#
# Familienaam VERHAEREN (niet Vermeulen) om botsing met de
# bestaande PO 2.7-case `vermeulen-stranddorp.yaml` te vermijden.
#
# Wordt geconsumeerd door:
#   - data/leerstukken/vennootschapsvorm-kiezen-en-oprichten.yaml (L1)
#   - data/leerstukken/bestuur-algemene-vergadering-en-aandeelhouders.yaml (L2)
#   - data/leerstukken/kapitaalbescherming-uitkeringen-en-alarmbel.yaml (L3 — KERN, alarmbel + inbreng natura)
#   - data/leerstukken/overdracht-overname-en-herstructurering.yaml (L4)
#   - data/leerstukken/ontbinding-vereffening-en-insolventie.yaml (L5)
#   - data/leerstukken/bijzondere-mandaten-van-de-accountant.yaml (L6 — synthese, alle mandaat-triggers)
#   - data/oefeningen/verhaeren-dossier-2026.yaml (oefening, multi-vraag case)
#
# Verifieerde wettelijke artikelen (MCP `zoek_bronnen` rerank — 2026-06-01):
#   - WVV art. 5:3 + 5:4 (BV oprichting + financieel plan)
#   - WVV art. 5:7 (inbreng natura BV — bedrijfsrevisor)
#   - WVV art. 5:142 + 5:143 (BV uitkering — nettoactief- + liquiditeitstest)
#   - WVV art. 5:153 (BV alarmbel — nettoactief negatief of dreigend negatief)
#   - WVV art. 7:7 (inbreng natura NV — bedrijfsrevisor)
#   - WVV art. 7:8 (quasi-inbreng NV — ≥10% kapitaal binnen 2 jaar)
#   - WVV art. 7:212 + 7:213 (NV uitkering + interimdividend)
#   - WVV art. 7:228 (NV alarmbel — drempels 1/2 en 1/4 kapitaal)
#   - WVV art. 2:56 + 2:57 (bestuurdersaansprakelijkheid + cap)
#   - WVV art. 2:71 + 2:80 + 2:91 + 2:100 (ontbinding/vereffening)
#   - WVV Boek 14 art. 14:3-5 + 14:8 (omzetting + staat activa/passiva)
#   - WER art. XX.39 (GR aanvraag) + XX.67 (collectief akkoord) + XX.83/29 (besloten GR)
#   - WER art. XX.102 (faillissement-aangifteplicht 1 maand)
#
# Cijfer-discipline: geen verzonnen RV-tarieven, geen verzonnen
# drempelbedragen. Voor RV/VVPRbis/liquidatiereserve → MCP
# `certificaid-tarieven`. Voor familiale-onderneming-gunstregime → kort
# vermelden + doorklik naar PO 2.6.

naam: verhaeren-bouwgroep
beschrijving: >
  Doorlopende levensloop-case voor PO 3.0 — Vennootschapsrecht en
  insolventie. De familie Verhaeren rond Marc Verhaeren (62, oprichter)
  + kinderen Sofie (35, jurist) en Jeroen (32, ingenieur). Vier
  vennootschappen onder Verhaeren Holding NV: Verhaeren Bouw BV
  (operationeel, ex-BVBA automatisch omgevormd 2020), Verhaeren Vastgoed
  BV (kapitaalloos, beheert bedrijfspatrimonium), en Bouwprojecten Zuid
  BV (verlieslatend — alarmbel + insolventie-case). Zes ankerverrichtingen
  spannen de hele levensloop: alarmbel · inbreng natura · SHA met
  drag-along · share-deal-overname · gerechtelijke reorganisatie ·
  omzetting BV → maatschap. Elk leerstuk vist één of meer scenarios uit
  deze groep.

context_jaartal: "2026"

# ---------------------------------------------------------------------------
# DEEL A — Familie
# ---------------------------------------------------------------------------

familie:

  personen:
    - naam: "Marc Verhaeren"
      leeftijd: 62
      woonplaats_fiscaal: "Sint-Niklaas (Vlaams Gewest)"
      beroep: "oprichter + zaakvoerder Verhaeren Bouw + bestuurder Verhaeren Holding NV"
      rol_in_cases: "hoofdpersonage — wil tegen 2030 overdragen aan de kinderen of verkopen aan derden; activeert de meeste mandaten en bestuursbeslissingen"

    - naam: "Linda Devos"
      leeftijd: 60
      woonplaats_fiscaal: "Sint-Niklaas (Vlaams Gewest)"
      beroep: "loontrekkende (administratie scholengroep)"
      rol_in_cases: "echtgenote — niet actief in vennootschappen, wel medeplanner familiale opvolging"

    - naam: "Sofie Verhaeren"
      leeftijd: 35
      woonplaats_fiscaal: "Antwerpen (Vlaams Gewest)"
      beroep: "jurist (advocatenkantoor M&A)"
      rol_in_cases: "aandeelhouder Holding (20%); juridische ruggesteun voor de SHA-onderhandeling (L2) en SPA-onderhandeling (L4); ook voorgesteld als toekomstig bestuurder na Marcs uittreden"

    - naam: "Jeroen Verhaeren"
      leeftijd: 32
      woonplaats_fiscaal: "Gent (Vlaams Gewest)"
      beroep: "ingenieur burgerlijke bouwkunde (extern projectleider)"
      rol_in_cases: "aandeelhouder Holding (20%); operationele opvolger Verhaeren Bouw; minder mandaat-ruggesteun dan Sofie — vraagt meer toelichting"


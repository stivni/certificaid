klantenfiches_case:
  scenario: >
    Bij Bracke maakt Karim (projectadministratie) de nieuwe klantenfiches aan
    op het moment dat de werfleider de eerste door een nieuwe klant getekende
    offerte binnenbrengt. Karim vult BTW-nummer, leveradres, kortingscategorie
    en betalingsvoorwaarden in op basis van wat de werfleider vermeldt.
  drie_risicos_te_detecteren:
    R1:
      risico: "Onvoldoende functiescheiding — werfleider initieert verkoop, Karim legt klantenfiche aan zonder onafhankelijke verificatie. Werfleider kan fictieve klant introduceren (omzet-inflate voor commissie of voor eigen prestige)"
      koppeling: "Z4 + Z5"
    R2:
      risico: "Geen kredietacceptatie-functie vooraf — klant wordt aangemaakt zonder onafhankelijke kredietcheck (door financiële dienst of credit controller). Twee gevallen in 2025 met afschrijvingen totaal 22.000 EUR"
      koppeling: "Z4"
    R3:
      risico: "Master-data-kwaliteit zonder vier-ogen-validatie — BTW-regime, kortingspercentages, betalingsvoorwaarden kunnen fout of manipuleerbaar zijn (één BTW-rechtzetting 4.800 EUR in 2025)"
      koppeling: "Z6"


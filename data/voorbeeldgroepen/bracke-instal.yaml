# ---------------------------------------------------------------------------
# Per-cyclus walkthroughs + bewuste IC-zwaktes
# Hoofd-data-bron voor leerstuk 3 (cyclus-analyse-en-controlemiddelen)
# ---------------------------------------------------------------------------

cycli:

  aankoop:
    naam: "Aankoop / Procure-to-Pay"
    flow_mermaid: |
      graph LR
          A["Werfleider:<br/>bestelaanvraag"] --> B{"Bedrag<br/>> 5.000?"}
          B -->|Ja| C["Pieter:<br/>goedkeuring vóór bestelling"]
          B -->|Neen| D["Nora:<br/>bestelling plaatst<br/>(zonder goedkeuring)"]
          C --> D
          D --> E["Levering bij werf of magazijn<br/>(werfleider of Davy ontvangt)"]
          E --> F["Factuur binnenkomst<br/>(Eline boekt in Odoo)"]
          F --> G{"3-way match<br/>geslaagd?"}
          G -->|Ja| H["Eline maakt<br/>betaalbatch"]
          G -->|Neen| I["Eline contacteert<br/>leverancier voor rechtzetting"]
          H --> J{"Bedrag > 10.000?"}
          J -->|Ja| K["Sofie of Pieter<br/>tekent batch"]
          J -->|Neen| L["Eline geeft<br/>batch zelf vrij"]
          K --> M["Betaling via Isabel 6"]
          L --> M
    drempels:
      goedkeuring_bestelling: "5.000 EUR (per bestelling)"
      tweede_handtekening_betaling: "10.000 EUR (per betaling)"
    sleutelcontroles_aanwezig:
      - "3-way match bestelbon ↔ ontvangstbon ↔ factuur (Odoo automatisch — flagging bij verschil > 2%)"
      - "Tweede handtekening boven 10.000 EUR"
      - "Maandelijkse rekening-courant-reconciliatie leveranciers door Eline"
    zwaktes_aanwezig:
      Z1:
        omschrijving: "Eline heeft simultane rechten op leveranciers-master + factuur-boeking + betaalbatch — geen functiescheiding tussen bewaring (leveranciers-data) en uitvoering (betaling)"
        risico: "Eline (of iemand met Eline-paswoord) kan nieuwe leverancier aanmaken, factuur boeken en betaling klaarzetten zonder dat een tweede persoon het ziet. Functioneel-frauderisico"
        koppeling_examen: "ISA 315 herzien-2019 Bijlage 3 §A157 — functiescheiding leveranciers-master vs betaling als preventieve maatregel"
      Z2:
        omschrijving: "Betalingen onder 10.000 EUR (drempel) gaan zonder tweede handtekening — boekhouder kan alleen vrijgeven"
        risico: "Drempel is hoog gezien gemiddelde projectkost (25k B2B). Veel materiaalfacturen vallen onder de drempel en passeren ongezien"
      Z3:
        omschrijving: "Werfleider keurt bestelling onder 5.000 EUR zelf goed — geen onafhankelijk prijscheck door Nora"
        risico: "Werfleider kan systematisch dezelfde leverancier kiezen (relatie · kickback) zonder concurrentie"

  verkoop:
    naam: "Verkoop / Order-to-Cash"
    flow_mermaid: |
      graph LR
          A["Klantcontact:<br/>vraag offerte"] --> B["Werfleider:<br/>technische offerte<br/>+ prijsraming"]
          B --> C{"Bedrag<br/>> 10.000?"}
          C -->|Ja| D["Pieter:<br/>commerciële goedkeuring"]
          C -->|Neen| E["Werfleider:<br/>stuurt offerte direct"]
          D --> E
          E --> F["Klant tekent;<br/>Karim maakt klantenfiche aan<br/>(eerste keer)"]
          F --> G["Project gepland;<br/>monteurs uitgevoerd"]
          G --> H["Werkbon getekend<br/>door klant"]
          H --> I["Karim factureert<br/>(eind- of voorschotfactuur)"]
          I --> J["DSO-opvolging<br/>door Karim"]
          J --> K{"> 60 dagen<br/>open?"}
          K -->|Ja| L["Karim escaleert<br/>naar Pieter"]
    sleutelcontroles_aanwezig:
      - "Goedkeuring Pieter boven 10.000 EUR commercieel"
      - "Werkbon-handtekening klant vóór facturatie"
      - "DSO-rapport wekelijks (top 20 oudste)"
    zwaktes_aanwezig:
      Z4:
        omschrijving: "Karim maakt klantenfiches aan zodra de eerste bestelbon binnenkomt — geen kredietacceptatie-stap door onafhankelijke functie"
        risico: "Bracke kan beginnen werken voor insolvabele klanten. Twee verlieslatende dossiers in 2025 (afschrijving ~22.000 EUR totaal — particuliere klanten in faling)"
        koppeling_examen: "Direct replica van examen 2014-1 vr10 (risico's klantenfiches door verkoop)"
      Z5:
        omschrijving: "Karim heeft simultane rechten op klantenmaster + creditnota-aanmaak — kan dubbelboeking corrigeren zonder spoor"
        risico: "Karim kan eigen vergissingen ongedaan maken zonder dat Eline of Pieter het ziet"
      Z6:
        omschrijving: "BTW-regime wordt door Karim ingevuld op klantenfiche — geen vier-ogen-validatie. Eén klant per ongeluk in 21 % i.p.v. 6 % verlegd (renovatie ouder dan 10 j) — BTW-rechtzetting ca 4.800 EUR"
        risico: "BTW-fouten + boetes (geringere oorzaak, maar systeem-zwakte)"

  voorraad:
    naam: "Voorraad — magazijn Aalst + werf-buffers"
    flow_mermaid: |
      graph LR
          A["Levering bij magazijn"] --> B["Davy:<br/>fysieke ontvangst<br/>+ boekhoudkundige inboeking"]
          B --> C["Werfleider vraagt<br/>materiaal voor werf"]
          C --> D["Davy:<br/>uitslag uit magazijn<br/>+ boekt magazijnbon"]
          D --> E["Werf-buffer:<br/>opslag op werf"]
          E --> F["Monteurs gebruiken;<br/>resterend = retour magazijn"]
          F --> G["Davy:<br/>retour-boeking<br/>(maar niet altijd)"]
          G --> H["Cyclische telling<br/>2× per jaar"]
          H --> I["Eline:<br/>aansluiting<br/>met boekhouding"]
    sleutelcontroles_aanwezig:
      - "Magazijn afgesloten — alleen Davy heeft sleutel + Odoo-rechten"
      - "Cyclische tellingen 2× per jaar (juni + december)"
      - "ABC-classificatie voor top-30 artikelen — frequentere telling"
    zwaktes_aanwezig:
      Z7:
        omschrijving: "Davy combineert bewaring (sleutel + fysiek beheer) + registratie (Odoo-boekingen) zonder onafhankelijke controle"
        risico: "Klassieke ACR-IH-overtreding — Davy kan diefstal afdekken door magazijnbon te falsifiëren"
        koppeling_examen: "ISA 501 §4 (voorraad-controle); ACR-IH-leer Bewaren + Registreren samen verboden"
      Z8:
        omschrijving: "Retour-boekingen van werf naar magazijn gebeuren niet systematisch — werfleider beslist of restmateriaal teruggaat of bij volgende werf gebruikt wordt. Geen tracking"
        risico: "Materiaal-leakage naar privé-gebruik door monteurs (in 2025 telling: ~18.000 EUR voorraad-discrepantie vastgesteld, oorzaak niet 100% geïdentificeerd)"
      Z9:
        omschrijving: "Voorraadtelling gedaan door Davy zelf (telpartner ontbreekt) — geen onafhankelijke verificatie"
        risico: "Telling onbetrouwbaar — Davy telt waar de Odoo-data zegt te tellen"

  kas_treasury:
    naam: "Kas / Treasury"
    componenten:
      - "Kleine kas op kantoor (max 1.500 EUR voor klein-onkosten)"
      - "Werfleider-creditcards (limiet 2.500 EUR/maand) — 3 stuks"
      - "Bank-betalingen via Isabel 6 (zie aankoop-flow)"
      - "Klant-betalingen: 95 % bankoverschrijving + 5 % cash (vooral particulier)"
    flow_klein_kas: |
      graph LR
          A["Werknemer:<br/>kleine onkost<br/>(bv tankbeurt, parkeer)"] --> B["Bonnetje + onkostennota"]
          B --> C["Nora:<br/>uitbetaling uit kas"]
          C --> D["Werknemer tekent af"]
          D --> E["Eline:<br/>boekt onkost"]
          E --> F["Maandelijks:<br/>Pieter telt kas?"]
    sleutelcontroles_aanwezig:
      - "Maandelijkse bank-reconciliatie Eline (alle banken)"
      - "Onkostennota's aftekenen door werknemer + Nora"
    zwaktes_aanwezig:
      Z10:
        omschrijving: "Kascontrole formeel maandelijks door Pieter — in praktijk laatste 8 maanden niet uitgevoerd (te druk). Geen procesvervinger door Sofie"
        risico: "Klein-kas-fraude blijft onopgemerkt; geen periodieke verzekering van saldo"
        koppeling_examen: "Examen 2014-1 vr11 / 2013-1 vr9 — procedure kasbetalingen kleine kosten met min 2 functiescheidingen"
      Z11:
        omschrijving: "Pieter doet zelf alle cash-stortingen bij de bank (1× per 2 weken) — geen tweede paar ogen op samengetelde envelopinhoud"
        risico: "Cash-flow van particulier-klanten niet onafhankelijk verifieerbaar"
      Z12:
        omschrijving: "Werfleider-creditcards: maandelijks afrekenstaat wordt ingediend door werfleider zelf — Eline boekt zonder onafhankelijke vergelijking met werkstaten"
        risico: "Persoonlijk gebruik van zakelijke creditcard kan onopgemerkt blijven"

  lonen:
    naam: "Lonen / Hire-to-Retire"
    flow_mermaid: |
      graph LR
          A["Monteur:<br/>badge in/uit TimeSquare"] --> B["Werfleider:<br/>uren-validatie<br/>maandelijks"]
          B --> C["Eline:<br/>export uren naar SD Worx"]
          C --> D["SD Worx:<br/>loonberekening + fiches"]
          D --> E["Sofie:<br/>goedkeuring loonbatch"]
          E --> F["SD Worx betaalt;<br/>boeking in Odoo"]
          F --> G["RSZ + BV<br/>doorboekingen door Eline"]
    sleutelcontroles_aanwezig:
      - "Werfleider valideert eigen team-uren"
      - "Sofie tekent loonbatch (4-ogen op totaal)"
      - "SD Worx als 3e partij (geautomatiseerde berekening)"
    zwaktes_aanwezig:
      Z13:
        omschrijving: "Geen onboarding/offboarding-protocol — werfleider kan ex-medewerker maandenlang doorbetaalde uren aanleveren. In 2025 vastgesteld: ex-monteur Frank (ontslag mei 2025) kreeg 4 maanden doorbetaald (~12.800 EUR netto) — Sofie betaalt de batch goed zonder vergelijking met actieve personeelslijst"
        risico: "Spookmedewerker-risico — TimeSquare detecteert geen ontbrekende badge omdat werfleider de uren manueel invoert voor monteurs die op werf zijn ('badge stuk' = bypass)"
        koppeling_examen: "Klassieke H2R-fraude — examen 2013-1 maatregelen na onregelmatigheden boekhouder analoog"
      Z14:
        omschrijving: "Werfleider valideert eigen team — zelf-controle. Geen onafhankelijke check op overuren-aanvragen door 2e persoon"
        risico: "Werfleider kan eigen kennissen extra overuren toekennen"

# ---------------------------------------------------------------------------
# Centrale fraude-case (leerstuk 4 + leerstuk 5)
# ---------------------------------------------------------------------------

fraude_case_bart:
  korte_beschrijving: >
    Bart Devlieger, werfleider sanitair (8 j anciënniteit), heeft van september
    2024 tot november 2025 systematisch fictieve aankoopfacturen laten betalen
    via een gefingeerde leverancier op naam van zijn schoonbroer's BV
    (Sanitair Maes & Co BV). Totaal lek: 47.300 EUR. Ontdekt eind november 2025
    door Eline tijdens jaarafsluitings-controle (toevallige opmerking over
    leverancier die niet voorkwam in offerte-database).
  fraudedriehoek:
    druk: "Persoonlijke schulden (echtscheiding 2024 + alimentatie + lening renovatie eigen huis)"
    gelegenheid:
      - "Z1 zwakte: Eline kon zonder 4-ogen leveranciers aanmaken — Bart vroeg Eline de leverancier aan te maken voor een 'eenmalige levering', Eline deed dit zonder verificatie"
      - "Z3 zwakte: bestellingen onder 5.000 EUR door werfleider zelf goedgekeurd — Bart maakte 12 valse bestelaanvragen tussen 1.800 en 4.500 EUR"
      - "Z2 zwakte: betalingen onder 10.000 EUR door Eline alleen vrijgegeven — alle 12 facturen vielen onder de drempel"
      - "Bart 'leverde' zelf ontvangstbewijzen (op eigen werf) — geen onafhankelijke ontvangst-controle door Davy (omdat werf-leveringen niet via magazijn)"
    rationalisatie: "Bart zou achteraf zeggen: 'Bracke heeft mij onderbetaald jaren — ik nam alleen wat me toekwam'"
  modus_operandi: |
    1. Bart leverde fictieve materiaal-bestelaanvraag in (HVAC- of sanitair-onderdelen, plausibele bedragen)
    2. Bestelling onder drempel — geen Pieter-goedkeuring
    3. Schoonbroer-BV stuurt factuur (3-way match werkt formeel: bestelbon ↔ Bart-ontvangstbewijs ↔ factuur sluiten)
    4. Eline boekt en zet betaalbatch klaar (onder drempel — geen 2e handtekening)
    5. Betaling gaat naar schoonbroer-BV — schoonbroer storteert door naar Bart
  totalen:
    aantal_valse_facturen: 12
    periode: "september 2024 – november 2025 (14 maanden)"
    totaal_bedrag: 47300       # EUR
    gemiddelde_factuur: 3942
  drie_zwaktes_die_het_mogelijk_maakten:
    - "Z1 (leveranciers-master + boeking + betaling bij één persoon)"
    - "Z2 (drempel 10.000 EUR voor 2e handtekening te hoog)"
    - "Z3 (werfleider keurt eigen bestellingen onder 5.000 EUR goed)"
  drie_controles_die_het_opgemerkt_hadden:
    - "Periodieke leveranciers-spend-analyse (top 20 nieuwe leveranciers > X EUR) door Pieter — was nooit ingericht"
    - "Onafhankelijke goedkeuring nieuwe leveranciers door Pieter of Sofie vóór eerste betaling — niet aanwezig"
    - "Periodieke vergelijking offerte-database vs aankoopfacturen (welke leveranciers worden betaald zonder ooit een offerte te hebben gegeven?) — bestaat niet"
  na_de_ontdekking:
    - "Bart ontslagen wegens dringende reden (november 2025)"
    - "Strafklacht ingediend door Pieter (lopend)"
    - "Bracke vorderde 47.300 EUR + schade — schoonbroer-BV inmiddels in vereffening"
    - "Pieter besloot IC-quickscan te laten doen door confrater-accountant (vrijwillige review-opdracht) — managementletter mock hieronder"


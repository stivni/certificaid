# Bracke Installatie BV — voorbeeldgroep voor PO 1.7 (interne controle)
#
# Mock middelgrote Belgische installateur (HVAC + sanitair + elektriciteit).
# Cijfers fictief, intern consistent. Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-interne-controle-en-coso.yaml
#   - data/leerstukken/functiescheiding-en-controlemaatregelen.yaml
#   - data/leerstukken/cyclus-analyse-en-controlemiddelen.yaml
#   - data/leerstukken/fouten-fraude-en-risicobeheersing.yaml
#   - data/leerstukken/interne-audit-evaluatie-en-aanbevelingen.yaml
#   - data/oefeningen/bracke-ic-quickscan.yaml
#
# Ontwerp-principes:
#   - Vijf transactionele cycli (aankoop · verkoop · voorraad · kas/treasury · lonen) —
#     elk met expliciete walkthrough + bewuste IC-zwaktes.
#   - Functiescheiding-zwaktes ZIJN AANWEZIG (didactisch doel: stagiair leert ze
#     herkennen). Niet "Bracke heeft alles op orde" — wel: "Bracke is realistisch
#     KMO met groei-pijnen".
#   - Eén centrale fraude-case (Bart fictieve leveranciers) voor leerstuk 4.
#   - Mock managementletter met 3 IC-bevindingen voor leerstuk 5.
#   - Zichtbare zwaktes vragen om concrete aanbevelingen (doel.6).
#
# Consistentie-toetsen (door auteur uitgevoerd):
#   - Aantal bezetting in organogram = aantal in bezetting-tabel (32 werknemers)
#   - Omzet 6,8 mln = som van project-types (70 % B2B + 30 % particulier)
#   - DSO 68 dagen consistent met handelsvorderingen-saldo
#   - Mock-balans sluit (totaal activa = totaal passiva = 4,2 mln EUR)

naam: bracke-instal
beschrijving: >
  Bracke Installatie BV is een mock Belgische middelgrote installateur (HVAC +
  sanitair + elektriciteit) gevestigd in Aalst. 32 medewerkers (8 administratief
  + 24 op de werf), omzet 6,8 mln EUR (boekjaar 2025), balanstotaal 4,2 mln EUR.
  Werkt met Odoo-ERP + TimeSquare-tijdregistratie + Isabel-6-bankkoppeling. Geen
  commissaris (onder de drempel — art. 3:72 WVV); wel een vrijwillig
  IC-beoordelingsverslag besteld bij confrater-accountant (revisor-perspectief
  als didactisch vehikel). Bracke heeft de klassieke groei-pijnen van een KMO
  in transitie: snel gegroeid van 8 naar 32 werknemers in 6 jaar zonder dat de
  IC-procedures mee evolueerden. Eind 2025 ontdekte de boekhouder een
  systematisch lek bij aankopen — een fraude-zaak die het management nu
  noopt tot een IC-quickscan.

sector: bouw — installatie (HVAC + sanitair + elektriciteit)
rechtsvorm: BV
omvang: middelgrote vennootschap (onder commissaris-drempel art. 3:72 WVV)
oprichting: 2008
balansdatum: "31-12-2025"
boekjaar_referentie: "2025"
vestiging: "Aalst (Oost-Vlaanderen)"
btw_nummer: "BE 0890.123.456"

erp_landschap:
  primaire_software: "Odoo Community 17 (sinds 2022 — vóór dat: Sage BOB Light)"
  modules_actief: ["aankoop", "verkoop", "voorraad", "boekhouding", "project"]
  modules_niet_actief: ["HR (loonadministratie uitbesteed aan SD Worx)", "asset management"]
  tijdregistratie: "TimeSquare (badge-systeem op de werf + mobiele app voor monteurs)"
  bank: "Isabel 6 (KBC + BNP Paribas Fortis)"
  cloud_storage: "Microsoft 365 (SharePoint voor projectdossiers + OneDrive personeel)"
  back_up: "Odoo cloud-back-up dagelijks (door provider); geen lokale fallback"


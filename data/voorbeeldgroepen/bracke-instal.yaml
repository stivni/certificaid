# Mock-managementletter (leerstuk 5 + oefening)
# ---------------------------------------------------------------------------

managementletter:
  opdracht: "Vrijwillige IC-beoordelingsopdracht door confrater-accountant Marc Vlaeminck (ITAA-nummer B-31.456) — verslag december 2025"
  scope: "Beoordeling van opzet (design effectiveness) en bestaan van interne controle op de vier hoofd-cycli (aankoop · verkoop · voorraad · kas/treasury) na vaststelling van fraude-incident Bart Devlieger"
  beperkingen: "Geen operating-effectiveness-test (geen test-of-controls over periode); geen volledige loon-cyclus-evaluatie (uitbesteed); geen IT-general-controls audit (uit scope)"
  bevindingen:
    B1:
      ernst: "Significant deficiency"
      beschrijving: "Onvoldoende functiescheiding boekhouding leveranciers — één persoon (hoofdboekhouder) heeft simultane rechten op leveranciers-master + factuur-boeking + betaalbatch-aanmaak"
      koppeling_zwakte: "Z1"
      koppeling_fraude: "Materiële trigger voor Bart-incident"
      isa_265_categorie: "Te communiceren aan bestuur"
      voorstel_aanbeveling: "Splits Odoo-rollen: leveranciers-master alleen door Pieter of Sofie aanpasbaar; betaalbatch-aanmaak en -vrijgave door twee verschillende personen; nieuwe leverancier krijgt 'in afwachting'-status tot Pieter validatie geeft"
    B2:
      ernst: "Significant deficiency"
      beschrijving: "Drempels voor goedkeuring bestellingen + betalingen niet meer afgestemd op huidige bedrijfsschaal — drempel 5.000/10.000 dateert van 2018, gemiddelde projectbedrag is sindsdien verdubbeld"
      koppeling_zwakte: "Z2 + Z3"
      isa_265_categorie: "Te communiceren aan bestuur"
      voorstel_aanbeveling: "Drempel goedkeuring bestelling verlagen naar 2.500 EUR; drempel 2e handtekening betaling naar 5.000 EUR; periodieke spend-analyse top-20-leveranciers > 25.000 EUR/jaar"
    B3:
      ernst: "Deficiency"
      beschrijving: "Voorraad-beheer — Davy combineert bewaring + registratie zonder onafhankelijke controle; cyclische tellingen niet bemand door telpartner"
      koppeling_zwakte: "Z7 + Z9"
      isa_265_categorie: "Optioneel te communiceren — beoordeling management"
      voorstel_aanbeveling: "Tweede telpartner per telling (roteren — bv. een werfleider); periodieke (kwartaal) cycli-tellingen voor ABC-categorie A door Nora i.p.v. Davy"
    B4:
      ernst: "Deficiency"
      beschrijving: "Klein-kas-procedure — geen documenteerde kascontrole laatste 8 maanden"
      koppeling_zwakte: "Z10 + Z11"
      isa_265_categorie: "Optioneel"
      voorstel_aanbeveling: "Maandelijkse kascontrole formaliseren — Sofie of Nora controleert (rotatie), proces-verbaal in fysiek schrift"
  niet_bevonden_maar_te_overwegen:
    - "Aanstelling AMLCO formaliseren (Pieter de facto, geen schriftelijk mandaat)"
    - "DPO-rol voor GDPR (klantenbestand 184 actief)"
    - "Onboarding/offboarding-protocol HR (Frank-incident)"


mock_geconsolideerd:

  aurelia-na-eliminaties:
    titel: "Mock geconsolideerde balans Aurelia (na drie families eliminaties)"
    eenheid: "mln EUR"
    kolommen: ["", "Aurelia indiv.", "Bellator indiv.", "Eliminaties + herw.", "**Geconsolideerd**"]
    rijen_activa:
      - ["Goodwill", "—", "—", "+1,6", "**1,6**"]
      - ["Gebouwen", "12,0", "2,5", "+1,0 *(herw.)*", "**15,5**"]
      - ["Klantenrelaties", "—", "—", "+0,5 *(herw.)*", "**0,5**"]
      - ["Voorraad", "5,0", "3,0", "−0,5 *(intra-marge)*", "**7,5**"]
      - ["Vorderingen", "4,0", "—", "−1,0 *(intra-groep)*", "**3,0**"]
      - ["Deelneming Bellator", "6,0", "—", "−6,0", "**—**"]
      - ["Overige activa", "3,0", "0,5", "0", "**3,5**"]
      - ["**Totaal activa**", "**30,0**", "**7,5**", "", "**31,6**"]
    rijen_passiva:
      - ["Eigen vermogen moeder", "18,0", "5,5", "mutaties *(zie noot)*", "**17,5**"]
      - ["Belang van derden", "—", "—", "+1,1", "**1,1**"]
      - ["Schulden", "12,0", "2,0", "−1,0 *(intra-groep)*", "**13,0**"]
      - ["**Totaal passiva**", "**30,0**", "**7,5**", "", "**31,6**"]
    toelichting_ev_mutaties: >
      Aurelia's individuele EV (18,0) wordt verlaagd met de geëlimineerde
      intra-groep marge (−0,5). Bellator's EV (5,5) splitst in 4,4 (aandeel
      moeder, weggewerkt tegen de deelneming-prijs van 6,0 via goodwill van
      1,6) + 1,1 (belang van derden). Netto geconsolideerd EV moeder
      = 18,0 − 0,5 = 17,5.


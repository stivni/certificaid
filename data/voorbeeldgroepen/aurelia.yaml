# Aurelia — voorbeeldgroep voor PO 1.4 consolidatie-leerstukken
#
# Mock Belgische groep. Cijfers zijn fictief maar intern consistent.
# Wordt geconsumeerd door:
#   - data/leerstukken/wie-moet-consolideren.yaml
#   - data/leerstukken/hoe-consolideren.yaml
#   - data/leerstukken/goodwill-bij-consolidatie.yaml  (nog te schrijven)
#   - data/leerstukken/rapportering-en-controle-geconsolideerde-jaarrekening.yaml (idem)

naam: aurelia
beschrijving: >
  Aurelia NV is een mock Belgische moedervennootschap met één dochter
  (Bellator BVBA, 80%, exclusieve controle), één joint venture (Concordia SE,
  50%, gezamenlijke controle), één geassocieerde (Dynamica NV, 30%, notabele
  invloed) en één gewone belegging (Erion NV, 18%). Gebruikt om alle
  controle-niveaus + drie consolidatiemethodes te illustreren binnen één
  coherente case.

balansdatum: "31-12-2026"
boekjaar: "2026"

# ---------------------------------------------------------------------------
# Groepsstructuur
# ---------------------------------------------------------------------------

groepsstructuur:
  moeder:
    naam: "Aurelia NV"
    rechtsvorm: NV

  deelnemingen:
    - naam: "Bellator BVBA"
      rechtsvorm: BVBA
      percentage: 80
      controle: exclusief
      methode: integraal
      rol_in_case: "dochter — wordt diepgaand uitgewerkt voor eerste-consolidatie + alle drie eliminatie-families"

    - naam: "Concordia SE"
      rechtsvorm: SE
      percentage: 50
      controle: gezamenlijk
      methode: evenredig
      rol_in_case: "joint venture — illustreert evenredige consolidatie + IFRS 11-verbod"

    - naam: "Dynamica NV"
      rechtsvorm: NV
      percentage: 30
      controle: notabele-invloed
      methode: vermogensmutatie
      rol_in_case: "geassocieerde — illustreert vermogensmutatiemethode (one-line consolidation)"

    - naam: "Erion NV"
      rechtsvorm: NV
      percentage: 18
      controle: geen
      methode: niet-geconsolideerd
      rol_in_case: "gewone belegging — toont waar de drempel ligt (< 20% = geen invloed van betekenis)"

# ---------------------------------------------------------------------------
# Mermaid-diagrammen (één per use-case)
# ---------------------------------------------------------------------------

mermaid_diagrammen:

  scope-beslisboom:
    type: flowchart-td
    code: |
      A[Heeft de moeder controle<br/>over één of meer vennootschappen?] -->|Nee| Z[Geen consolidatieplicht]
      A -->|Ja| B[Bepaal de consolidatiekring<br/>verticaal of consortium]
      B --> C[Toets de groep aan de drempels<br/>op geconsolideerde basis]
      C -->|Binnen drempels| D[Vrijgesteld als<br/>'groep van beperkte omvang']
      C -->|Boven drempels| E[Consolidatie verplicht]
      D -->|Maar: OOB in groep?| E
      E --> F{Welk stelsel?}
      F -->|B-GAAP| G[Geconsolideerde jaarrekening<br/>volgens WVV + KB-WVV]
      F -->|IFRS| H[Geconsolideerde jaarrekening<br/>volgens IFRS 10]

  consolidatie-techniek-flow:
    type: flowchart-td
    code: |
      S0[Stap 0: Uniforme waarderingsregels<br/>rapporteringspakket aan dochters]
      S1[Stap 1: Methode-keuze<br/>per controle-niveau]
      S2[Stap 2: Eerste consolidatie<br/>reële-waarde-herwaardering + goodwill]
      S3[Stap 3: Courante eliminaties<br/>drie families]
      OUT[Geconsolideerde jaarrekening]
      S0 --> S1 --> S2 --> S3 --> OUT

  groepsstructuur:
    type: flowchart-td
    code: |
      M[Aurelia NV<br/>moedervennootschap]
      M -->|80 % aandelen| D1[Bellator BVBA<br/>dochter — exclusieve controle]
      M -->|50 % aandelen<br/>+ partner| D2[Concordia SE<br/>joint venture]
      M -->|30 % aandelen| D3[Dynamica NV<br/>geassocieerde]
      M -.->|18 % aandelen| D4[Erion NV<br/>gewone belegging]

      style D4 stroke-dasharray: 5 5

# ---------------------------------------------------------------------------
# Drempel-toets voor "groep van beperkte omvang" (art. 1:26 § 1 WVV)
# ---------------------------------------------------------------------------

drempel_toets_aurelia:
  titel: "Drempel-berekening Aurelia-groep (geconsolideerde basis)"
  entiteiten:
    - naam: "Aurelia NV"
      omzet: 32
      balanstotaal: 16
      werknemers: 150
    - naam: "Bellator (100 %)"
      omzet: 22
      balanstotaal: 10
      werknemers: 100
    - naam: "Concordia (50 %)"
      omzet: 8
      balanstotaal: 4
      werknemers: 30
  eliminaties:
    omzet: -12
    balanstotaal: -4
    werknemers: 0
  geconsolideerd:
    omzet: 50
    balanstotaal: 26
    werknemers: 280
  drempels:
    omzet_ref: "~42,5 mln (richtcijfer, exact in Cijferzakboekje)"
    balanstotaal_ref: "~21,25 mln (richtcijfer, exact in Cijferzakboekje)"
    werknemers_ref: "250"
  uitkomst: "Drie van drie drempels overschreden → consolidatie verplicht (na tweejaars-regel)"
  noot_methode_keuze: >
    Bellator volledig in de telling (exclusieve controle → integraal),
    Concordia voor 50% (gezamenlijke controle → evenredig). Dynamica zit
    NIET in de drempel-telling — VMM raakt de groepscijfers via één
    balanslijn en telt niet mee voor drempels.

# Vergelijkings-groep "Vesta": blijft binnen drempels (illustratie)
drempel_toets_vesta_vergelijking:
  omzet: 28
  balanstotaal: 14
  werknemers: 180
  uitkomst: "Geen enkele drempel overschreden → groep van beperkte omvang → vrijgesteld"


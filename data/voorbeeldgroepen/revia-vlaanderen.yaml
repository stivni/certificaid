# NV REVIA Vlaanderen — centrale audit-cliënt voor PO 1.6
#
# Eén controleplichtige Belgische industrievennootschap (precisie-onderdelen
# voor de farmaceutische verpakkingsindustrie) met:
#   - lopende wettelijke jaarrekeningcontrole door commissaris (audit-cyclus
#     leerstukken 1-3)
#   - drie audit-issues die alle vier oordeel-types op tafel leggen
#     (rechtszaak / voorraad-veroudering / lage confirmaties-respons)
#   - parallel bijzonder mandaat: inbreng in natura van een gebouw door de
#     patriarch in eigen vennootschap — opdracht door een andere accountant
#     dan de commissaris (leerstuk 4 + onafhankelijkheids-dilemma leerstuk 5)
#   - Poolse productie-dochter + Duitse joint venture (cross-link PO 1.4
#     consolidatie — niet in deze YAML uitgewerkt)
#
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-externe-controle-en-welke-opdrachten-bestaan.yaml
#   - data/leerstukken/aanvaarden-plannen-en-uitvoeren-van-een-audit.yaml
#   - data/leerstukken/afronden-en-rapporteren-van-een-audit.yaml
#   - data/leerstukken/bijzondere-wettelijke-verslagen-bij-vennootschapsverrichtingen.yaml
#   - data/leerstukken/onafhankelijkheid-en-deontologie-bij-controleopdrachten.yaml
#   - data/oefeningen/revia-audit-doorloop.yaml (oefening — 5 documenten, 75 min)
#
# Stijl-keuze: cijfer-rijk waar pedagogisch nodig (balans + resrek voor
# materialiteits-berekening en analytisch onderzoek; mock-issue-bedragen voor
# de oordeel-type-beslismatrix). Geen Cijferzakboekje-afhankelijke fiscale
# tarieven — die leven in andere PO's. Wel verwijzingen naar WVV-drempels
# (art. 1:24 + 1:26, verhoogd sinds CBN-advies 2024/07: 11,25 mln / 6 mln
# / 42,5 mln / 21,25 mln).
#
# Wettelijke claims hier opgenomen zijn ⚖️ via MCP `certificaid-rag`
# `zoek_bronnen` (rerank) op 2026-06-01 bevestigd vanuit:
#   - WVV art. 1:24 + 1:25 + 1:26 (grootte-criteria; verhoogde drempels CBN
#     2024/07)
#   - WVV art. 3:55 + 3:58 + 3:70 + 3:72 (benoeming + mandaat + controleplicht
#     commissaris)
#   - ITAA-norm ontbinding-vereffening §11 (verificatie commissarisplicht bij
#     aanvaarding bijzonder mandaat)
#   - ISA 315 (herzien-2019) §13-37 + §A11-A47 (risico-inschattingswerkzaamheden)
# Andere ISA's en wetsartikelen worden in de leerstuk-scripts geverifieerd
# (volgens skelet §4 en §8.6); hier alleen als verwijzing.

naam: revia-vlaanderen
beschrijving: >
  Doorlopende audit-cliënt voor PO 2.6 — externe controle. NV REVIA Vlaanderen
  is een fictieve controleplichtige Belgische industrievennootschap (Mechelen,
  precisie-onderdelen voor farmaceutische verpakkingsindustrie). Familiaal
  meerderheidsaandeelhouderschap (70 % Verbeke-familie via Verbeke Holding;
  30 % institutionele participatie INVESTRA NV sinds 2018). Boven alle drie
  WVV-drempels (art. 1:26 verhoogd: 250 werknemers / 42,5 mln omzet /
  21,25 mln balanstotaal) → commissaris benoemd voor 3-jaars mandaat conform
  art. 3:58 WVV. Niet beursgenoteerd, geen OOB. Eén buitenlandse dochter
  (REVIA Polska sp. z o.o., 100 %, productie-onderdelen) + één joint venture
  (REVIA-PHARMA GmbH, 50/50 met Duitse partner, verkooporganisatie). De case
  draagt de hele audit-cyclus (aanvaarden → plannen → uitvoeren → afronden →
  verslag) en parallel één bijzonder mandaat (inbreng in natura gebouw
  Hubert Verbeke 2,8 mln EUR — opdracht door een andere accountant dan de
  commissaris). Drie audit-issues lopen parallel en zorgen voor het materiaal
  voor de oordeel-type-beslismatrix in leerstuk 3: hangende rechtszaak ex-klant
  (claim 1,2 mln EUR — niet voorzien op balans), voorraad-waardering cleanroom-
  productlijn (boekwaarde 600k EUR vermoedelijk technisch verouderd), lage
  respons handelsvorderingen-confirmaties (65 %).

referentiejaar: "2024"
balansdatum: "31-12-2024"
context_jaartal: "2026"


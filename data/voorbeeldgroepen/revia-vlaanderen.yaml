# ---------------------------------------------------------------------------
# DEEL M — Mini-cases (voor edge-cases die hoofdtimeline niet dekt)
# ---------------------------------------------------------------------------

mini_cases:

  - naam: "Mini-case 1 — Volkomen controle vs beperkt nazicht"
    leerstuk_primair: "wat-is-externe-controle-en-welke-opdrachten-bestaan (L1)"
    feiten: >
      Een KMO-zaakvoerder vraagt zijn accountant: "kun je voor mijn vennootschap
      een 'volkomen controle' uitvoeren, want de bank vraagt dat?" Vennootschap
      is klein (niet controleplichtig). Wat antwoordt de accountant?
    juridisch_punt: >
      'Volkomen controle' = synoniem voor wettelijke jaarrekeningcontrole conform
      ISA + revisienormen + ITAA-KMO-controlenorm — vereist bedrijfsrevisor (of
      bedrijfsrevisorenkantoor of geregistreerd auditkantoor), niet "een accountant
      met opdracht". Wanneer cliënt niet controleplichtig is, kan dezelfde
      werkwijze contractueel afgesproken worden (vrijwillige controle), maar dan
      verloopt het via een **contractuele** opdracht — niet via een wettelijke
      monopolie-opdracht.
    examen_relevantie: "2024-1 toetst de definitie van 'volkomen controle' rechtstreeks. Studiematriaal moet duidelijk onderscheid wettelijk/contractueel maken."

  - naam: "Mini-case 2 — Werken op proef- en saldibalans van interne boekhouder voor bijzonder mandaat"
    leerstuk_primair: "bijzondere-wettelijke-verslagen-bij-vennootschapsverrichtingen (L4)"
    feiten: >
      Bij een omzetting BV→NV biedt de zaakvoerder van een KMO aan de
      aangewezen accountant aan: "ik heb hier de proef- en saldibalans van
      mijn boekhouder; werk daar maar mee, dat scheelt jou tijd". Wat zegt
      de accountant?
    juridisch_punt: >
      De wet vraagt een 'staat van activa en passiva' opgesteld + ondertekend
      door het bestuursorgaan (WVV art. 14:3) — niet door de interne boekhouder.
      Een proef- en saldibalans is een tussentijds boekhoudkundig document
      zonder bestuursvalidatie en zonder waarderings-beslissingen. De accountant
      kan op die basis geen verslag uitbrengen — hij vraagt om een correct
      opgemaakte en door het bestuursorgaan ondertekende staat A&P.
    examen_relevantie: "2013-1 (Fortunito) + 2013-2 toetsen dit expliciet. Klassieke examen-strikvraag."

  - naam: "Mini-case 3 — Boekhoudkundige staat door interne boekhouder als audit-bewijs"
    leerstuk_primair: "aanvaarden-plannen-en-uitvoeren-van-een-audit (L2)"
    feiten: >
      Bij de jaarrekeningcontrole REVIA Vlaanderen 2024 levert de interne
      boekhouder een interne maandafsluiting per 30/11/2024 als bewijs voor
      cut-off omzet. De junior auditor accepteert dat. De partner stelt vraag.
    juridisch_punt: >
      Interne documenten (gegenereerd door cliënt) hebben lagere bewijswaarde
      dan externe bevestigingen of auditor-gegenereerde herberekeningen (ISA 500
      §A31). Voor cut-off omzet moet de auditor zelf naar **externe** bewijzen
      (vrachtbrieven, verzendingsbonnen klant, ondertekende leverbevestigingen)
      — niet enkel naar interne maandafsluiting.
    examen_relevantie: "2014-1 en 2013-2 toetsen 'kan een interne staat door interne boekhouder dienen?' — neen, behoeft externe corroboratie."


mermaid_diagrammen:

  audit_cyclus:
    type: flowchart-lr
    beschrijving: "Zes-fasen audit-cyclus met ISA-nummers per fase — kern leerstuk 2 en 3 + samenvatting blok 3"
    code: |
      A[1. Aanvaarding<br/>ISA 210 + IESBA + KB 1 mrt 1998<br/>opdrachtbrief]
      A --> B[2. Planning<br/>ISA 300 + 315 + 320<br/>materialiteit + risico-inschatting]
      B --> C[3. Uitvoering<br/>ISA 330 + 500 + 501 + 505 + 520 + 530<br/>7 procedures + assertions]
      C --> D[4. Afronding<br/>ISA 450 + 540 + 560 + 570 + 580 + 720<br/>analytische slot-review + LOR]
      D --> E[5. Verslag<br/>ISA 700 + 705 + 706 + ITAA-KMO §119-121<br/>beslismatrix oordeel]
      E --> F[6. Archivering<br/>ISA 230 + Wet 7 dec 2016 art. 16<br/>revisiedossier 10 jaar]
      C -.->|herziening risico| B

  groepsstructuur:
    type: flowchart-td
    beschrijving: "Groepsfiguur REVIA — moeder + dochter Polska + JV PHARMA; voor leerstuk 1 (perimeter audit) + leerstuk 2 (component-auditor ISA 600)"
    code: |
      A[Verbeke Holding NV<br/>privé-familie<br/>70 %]
      B[INVESTRA NV<br/>institutioneel<br/>30 %]
      A --> M[NV REVIA Vlaanderen<br/>Mechelen — moeder<br/>62 mln omzet]
      B --> M
      M -->|100 %| P[REVIA Polska sp. z o.o.<br/>Wrocław — productie<br/>12 mln omzet]
      M -->|50 %| J[REVIA-PHARMA GmbH<br/>Düsseldorf — verkoop DE-AT-CH<br/>8,5 mln omzet]
      K[PHARMA Vertrieb GmbH<br/>Duitse partner] -->|50 %| J
      M -.->|consolidatieperimeter<br/>WVV art. 3:23| P
      M -.->|vermogensmutatie<br/>JV| J

  bedreigingen_kader:
    type: flowchart-td
    beschrijving: "IESBA-bedreigingen-kader (5 categorieën) + safeguards-laag — kern leerstuk 5 + samenvatting blok 9"
    code: |
      A[Opdracht-aanvaarding of -voortzetting]
      A --> B{Bedreigingen<br/>identificeren}
      B --> C1[Eigenbelang<br/>self-interest<br/>bv. commissie / honorarium-afhankelijkheid]
      B --> C2[Zelf-toetsing<br/>self-review<br/>bv. eigen waardering nadien controleren]
      B --> C3[Belangenbehartiging<br/>advocacy<br/>bv. cliënt verdedigen bij derden]
      B --> C4[Vertrouwdheid<br/>familiarity<br/>bv. langdurige relatie cliënt-team]
      B --> C5[Intimidatie<br/>intimidation<br/>bv. dreigement vervanging]
      C1 --> D{Aanvaardbaar<br/>niveau?}
      C2 --> D
      C3 --> D
      C4 --> D
      C5 --> D
      D -->|nee — geen safeguards| E[Weigering / beëindiging]
      D -->|ja — safeguards toepassen| F[Safeguards<br/>roulatie partner + EQR + functiescheiding + opvolging onafhankelijkheid]
      F --> G[Opdracht aanvaarden + documenteren]

  beslismatrix_oordeel:
    type: flowchart-td
    beschrijving: "Beslismatrix vier oordeel-types — kern leerstuk 3 + samenvatting blok 5"
    code: |
      A[Bevindingen<br/>auditor]
      A --> B{Type probleem?}
      B -->|Afwijking — verkeerde info| C{Diepgang?}
      B -->|Scope-beperking — geen info| D{Diepgang?}
      C -->|Niet-diepgaand<br/>materieel maar geïsoleerd| E[Voorbehoud<br/>'except for'<br/>ISA 705 §7]
      C -->|Diepgaand<br/>materieel en pervasief| F[Afkeurend oordeel<br/>'adverse'<br/>ISA 705 §8]
      D -->|Niet-diepgaand| G[Voorbehoud<br/>'except for' scope<br/>ISA 705 §7]
      D -->|Diepgaand| H[Onthoudende verklaring<br/>'disclaimer'<br/>ISA 705 §9-10]
      B -->|Geen materiële afwijking + voldoende info| I[Goedkeurend oordeel<br/>'unmodified'<br/>ISA 700]


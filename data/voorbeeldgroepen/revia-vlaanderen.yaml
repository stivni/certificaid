# ---------------------------------------------------------------------------
# DEEL G — Materialiteit-berekening (voor leerstuk 2 — planning)
# ---------------------------------------------------------------------------
#
# Auditor kiest benchmark op basis van entiteit-omgeving (ISA 320 §10-13 + §A4-A14).
# REVIA Vlaanderen: winstgevende industrievennootschap, gebruikers van jaarrekening
# zijn primair banken (BNP-financiering) + institutionele participatie (INVESTRA) +
# leveranciers/klanten. → benchmark "resultaat voor belastingen" past natuurlijk
# (genormaliseerd resultaat — relatief stabiel jaar-op-jaar).

materialiteit_2024:
  benchmark_gekozen: "resultaat voor belastingen (genormaliseerd)"
  benchmark_motivering: >
    Resultaat voor belastingen is voor REVIA passend: (a) winstgevend met stabiele
    marge (~7 % EBIT-marge), (b) primaire gebruikers (bank + minderheidsparticipatie)
    sturen op resultaatcijfers, (c) geen incidentele eenmalige items 2024 die
    normalisatie vragen. Alternatief omzet (1 % = 620k) zou te hoog uitkomen voor
    een entiteit zonder bijzondere omzetvolatiliteit.
  overall_materiality_pct: "5 % van resultaat voor belastingen"
  overall_materiality_eur: 210_000          # 5 % × 4.200.000
  uitvoeringsmaterialiteit_pct: "75 % van overall (significante risico-omgeving — drie audit-issues lopen)"
  uitvoeringsmaterialiteit_eur: 158_000     # 75 % × 210.000
  duidelijk_kleine_afwijkingen_eur: 10_000  # ca. 5 % van overall (ISA 450 §A2)
  benchmarks_overzicht:
    omzet_0_5_pct: 310_000     # 0,5 % × 62 mln
    omzet_1_pct: 620_000       # 1 % × 62 mln
    activa_1_pct: 510_000      # 1 % × 51 mln
    activa_2_pct: 1_020_000    # 2 % × 51 mln
    resultaat_voor_belastingen_5_pct: 210_000   # gekozen — pedagogisch ankerpunt
    resultaat_voor_belastingen_10_pct: 420_000

# ---------------------------------------------------------------------------
# DEEL H — Risico-inschatting (ISA 315 — voor leerstuk 2)
# ---------------------------------------------------------------------------
#
# Vier significante risico's geïdentificeerd op niveau beweringen (ISA 315 §28-37).
# Categorisering per beweringen-cluster (transacties / saldi / presentatie —
# ISA 315 §A190). ⚖️ ISA 315 (herzien-2019) §13-37 + §A190 verifieerd via MCP.

risico_inschatting:

  - id: risico-1
    aard: "Continuïteit van waardering hangende rechtszaak"
    bewering_categorie: "saldi — volledigheid + waardering passiva"
    isa_referenties: "ISA 315 §28-37 + ISA 540 herzien + ISA 501 §9-12 (rechtszaken)"
    omschrijving: >
      Ex-klant ROCHE-Gent dient sinds 2023 een claim van 1,2 mln EUR voor een
      vermeende ontwerpfout aan een vul-installatie. Management classificeert
      als "voorwaardelijke verplichting" (toelichting) zonder voorziening op
      balans. Significant risico voor volledigheid passiva (mogelijk
      onderwaardering voorzieningen — KB WVV art. 3:11 §1).
    significant: true
    audit_aanpak: "Lawyer's letter (ISA 501 §9-12 + ISA 580) — confirmatie advocaat over uitkomst-waarschijnlijkheid + raming"

  - id: risico-2
    aard: "Voorraad-waardering technologische veroudering cleanroom-onderdelen"
    bewering_categorie: "saldi — waardering activa"
    isa_referenties: "ISA 540 (herzien) + ISA 501 §4 (voorraadtelling) + CBN-advies 132/7"
    omschrijving: >
      Productlijn voor één specifieke vul-machinegeneratie van klant X
      vertoont sinds 2023 sterk dalende afzet (klant X migreert naar nieuwere
      machinegeneratie). Boekwaarde voorraad 600k EUR; vermoeden van
      waardevermindering (FIFO + lower of cost or NRV).
    significant: true
    audit_aanpak: "Inspectie + interviews productiehoofd + analyse rotatiesnelheid + opvolging verkooppipeline + ouderdomslijst"

  - id: risico-3
    aard: "Bestaan + waardering handelsvorderingen (lage confirmatie-respons)"
    bewering_categorie: "saldi — bestaan + waardering activa"
    isa_referenties: "ISA 505 §6 + §7 + §12-13 + ISA 330"
    omschrijving: >
      11 mln EUR handelsvorderingen; positieve confirmaties verzonden naar
      top-20 (dekking 78 % van saldo). Respons na vervaldatum slechts 65 %
      (ISA 505 §12 — alternatieve werkzaamheden vereist voor non-respondenten).
    significant: false  # courant audit-thema, niet significant volgens ISA 315
    audit_aanpak: "Alternatieve werkzaamheden ISA 505 §12: subsequent receipts-test + verzendingsdocumenten + saldobevestiging op basis van betalingen na balansdatum"

  - id: risico-4
    aard: "Verbonden partijen — transactieprijs REVIA Polska intra-groep"
    bewering_categorie: "transacties — juistheid + presentatie"
    isa_referenties: "ISA 550 (verbonden partijen) + ISA 315"
    omschrijving: >
      REVIA Polska factureert productie-onderdelen aan moeder tegen transfer
      pricing-prijzen (cost-plus 8 %). Onderbouwing transfer pricing-rapport
      door externe adviseur 2022; risico van afwijking marktconforme
      prijszetting + presentatie verbonden partijen (KB WVV toelichting).
    significant: false
    audit_aanpak: "Inspectie TP-documentatie + analytische review brutomarge per productlijn + vergelijking met externe benchmarks"

# ---------------------------------------------------------------------------
# DEEL I — Audit-issues (mock-bevindingen voor leerstuk 3 — oordeel-keuze)
# ---------------------------------------------------------------------------
#
# Drie issues, één per audit-procedure-categorie. Het materiaal voor de
# beslismatrix oordeel-types (materieel × diepgaand — leerstuk 3 §kern).

audit_issues:

  - id: "issue-1-rechtszaak"
    aard: "Hangende rechtszaak ex-klant ROCHE-Gent — claim 1.200.000 EUR voor vermeende ontwerpfout"
    boekhoudkundige_verwerking_door_management: >
      Geen voorziening op balans. Vermelding als voorwaardelijke verplichting in
      toelichting bij jaarrekening: "een rechtsgeding loopt waarvan de uitkomst
      onzeker is; raming van het mogelijk bedrag: 1,2 mln EUR".
    auditor_dilemma:
      norm_referentie: "ISA 501 §9-12 + ISA 580 + KB WVV art. 3:11 (voorzieningen)"
      stappen:
        - "Stap 1 — Lawyer's letter (positieve confirmatie advocaat): vraagt evaluatie waarschijnlijkheid + raming + tijdshorizon (ISA 501 §9)"
        - "Stap 2 — Eventuele weigering management om lawyer's letter te ondertekenen = scope-beperking → mogelijk voorbehoud of onthouding (ISA 705)"
        - "Stap 3 — Indien advocaat antwoordt 'waarschijnlijk veroordeling, te ramen op 800k': voorziening van 800k vereist volgens KB WVV; afwijking management 800k > materialiteit 210k → materieel"
        - "Stap 4 — Auditor verzoekt aanpassing; bij weigering management → voorbehoud of afkeurend afhankelijk van diepgang"
    mogelijke_uitkomsten:
      scenario_a: "Advocaat zegt 'onwaarschijnlijk' — toelichting voldoende, geen voorziening, oordeel goedkeurend"
      scenario_b: "Advocaat zegt 'waarschijnlijk, raming 800k' — voorziening nodig; management corrigeert → goedkeurend"
      scenario_c: "Advocaat zegt 'waarschijnlijk, raming 800k' — management weigert correctie → afwijking 800k > materialiteit, niet-diepgaand → **voorbehoud** (ISA 705 §7)"
      scenario_d: "Management weigert lawyer's letter te ondertekenen → scope-beperking, diepgaand → **onthoudende verklaring** (ISA 705 §9-10)"

  - id: "issue-2-voorraad"
    aard: "Voorraad cleanroom-onderdelen productlijn klant X — technische veroudering"
    boekhoudkundige_verwerking_door_management: >
      Boekwaarde 600.000 EUR (FIFO). Geen waardevermindering geboekt 2024 ondanks
      dalende afzet 2023-2024 (-45 % volume). Management beargumenteert "rotatie
      blijft binnen 18 maanden, geen waardevermindering nodig".
    auditor_dilemma:
      norm_referentie: "ISA 540 (herzien) + CBN-advies 132/7 (waardering voorraad lower of cost or net realisable value)"
      stappen:
        - "Stap 1 — Inspectie ouderdomslijst + interview verkoophoofd over pipeline klant X"
        - "Stap 2 — Externe benchmarking: marktinfo over migratie van klant X naar nieuwere machinegeneratie"
        - "Stap 3 — Schatting netto-realiseerbare waarde: indien 220k vs boekwaarde 600k → waardevermindering 380k nodig"
        - "Stap 4 — Afwijking 380k > materialiteit 210k → materieel; vraag aan management om correctie"
    mogelijke_uitkomsten:
      scenario_a: "Management corrigeert (380k waardevermindering geboekt) → goedkeurend"
      scenario_b: "Management weigert correctie, deelt argumentatie maar levert geen ondersteunend bewijs → voorbehoud (afwijking materieel-niet-diepgaand)"

  - id: "issue-3-confirmaties"
    aard: "Externe confirmaties handelsvorderingen — lage respons"
    boekhoudkundige_verwerking_door_management: >
      Handelsvorderingen 11.000.000 EUR. Positieve confirmaties verzonden naar
      top-20 (dekking 78 % saldo, 8,6 mln EUR aangeschreven). Respons op
      vervaldatum: 65 % van aangeschrevenen (5,6 mln EUR bevestigd).
      Non-respondenten: 7 klanten, totaal 3,0 mln EUR.
    auditor_dilemma:
      norm_referentie: "ISA 505 §6 + §7 + §12-13 (externe confirmaties — alternatieve werkzaamheden bij non-respons)"
      valkuil: "Lage respons confirmaties = NIET automatisch voorbehoud (klassieke examen-strikvraag). Auditor moet eerst alternatieve werkzaamheden uitvoeren (ISA 505 §12) — subsequent receipts of verzendingsdocumenten + facturen + aanvaardingsbewijzen."
      stappen:
        - "Stap 1 — Per non-respondent (7 klanten): subsequent receipts-test (betalingen ontvangen in januari-februari 2025)"
        - "Stap 2 — Voor klanten zonder betaling: verzendings-bewijzen + getekende leveringsbonnen + facturen"
        - "Stap 3 — Slot-evaluatie: indien 90 % van saldo dekkend (door confirmatie + alternatieve werkzaamheden) → bewering bestaan voldoende ondersteund"
    mogelijke_uitkomsten:
      scenario_a: "Alternatieve werkzaamheden succesvol — geen impact oordeel (goedkeurend)"
      scenario_b: "Alternatieve werkzaamheden falen voor 1 klant (saldo 600k > materialiteit) → scope-beperking materieel-niet-diepgaand → voorbehoud"

# ---------------------------------------------------------------------------
# DEEL J — Bijzonder mandaat parallel — inbreng in natura (voor leerstuk 4)
# ---------------------------------------------------------------------------

bijzonder_mandaat_parallel:
  type: "Inbreng in natura"
  wettelijke_basis: "WVV art. 7:7 (NV — verslag bestuursorgaan + verslag accountant of revisor over inbreng in natura) + art. 5:7 (BV — analoog)"
  context: >
    De patriarch Hubert Verbeke (persoonlijk eigenaar) wenst zijn industriegebouw
    aan de Schaliënhoevedreef 22 — pal naast de bestaande zetel — in te brengen
    in NV REVIA Vlaanderen in ruil voor nieuwe aandelen (kapitaalverhoging).
    Geschatte waarde gebouw: 2.800.000 EUR.
  inbrenger:
    naam: "Hubert Verbeke (privépersoon, 75 j.)"
    band_met_vennootschap: "Onrechtstreeks meerderheidsaandeelhouder via Verbeke Holding NV (70 %); voorzitter Raad van Bestuur — verbonden partij (ISA 550)"
  inbreng:
    aard: "Onroerend goed — industriegebouw 2.400 m² + 800 m² kantoorgedeelte"
    locatie: "Schaliënhoevedreef 22, 2800 Mechelen — aanpalend perceel"
    boekwaarde_inbrenger_eur: 1_800_000   # waarde in privévermogen Verbeke
    geschatte_marktwaarde_eur: 2_800_000  # taxatie vastgoedexpert + recente comparables
  tegenwaarde:
    aandelen_uitgegeven: "Nieuwe NV-aandelen — kapitaalverhoging 2.800.000 EUR (waarde × ruilverhouding bestaande aandelen)"
    impact_aandeelhouderschap: "Familie Verbeke-belang stijgt van 70 % naar ca. 73,5 % (verwatering INVESTRA)"
  beroepsbeoefenaar_voor_mandaat:
    rol: "Bedrijfsrevisor (of GA) — opdracht door bestuursorgaan; ook commissaris mag deze opdracht aanvaarden indien onafhankelijkheid gewaarborgd"
    aanwijzing_revia: "RvB wijst een **andere** beroepsbeoefenaar aan dan de commissaris — bewust gekozen om onafhankelijkheids-discussie scherp te stellen"
    motivering_keuze: >
      Commissaris BV Audit & Controle weigert opdracht zelf te aanvaarden wegens
      bedreiging "self-review" (IESBA): de inbreng-waardering zou later moeten
      worden gevalideerd in zijn eigen jaarrekeningcontrole 2025. Bestuursorgaan
      wijst BVBA Vastgoed-Revisie aan (geen relatie met REVIA noch met INVESTRA).
  itaa_norm: "ITAA-norm inzake inbreng in natura en quasi-inbreng (gemeenschappelijke ITAA-IBR-norm)"
  proces_overzicht:
    stap_1: "Bestuursorgaan stelt verslag op (verantwoording opportuniteit) + maakt 'staat van activa en passiva' van het ingebrachte goed klaar (max 3 maanden oud)"
    stap_2: "Aanwijzing accountant of bedrijfsrevisor door bestuursorgaan (i.c. niet de commissaris zelf)"
    stap_3: "Beroepsbeoefenaar onderzoekt waardering (limited assurance, NIET redelijke zekerheid) + steltverslag op met conclusie 'de waardering komt overeen met ten minste het aantal en de nominale waarde van de uit te geven aandelen' OF voorbehoud"
    stap_4: "Beide verslagen ter beschikking aandeelhouders 15 dagen vóór AV (art. 7:128 WVV — kapitaalverhoging)"
    stap_5: "AV besluit met versterkte meerderheid kapitaalverhoging; akte notaris"


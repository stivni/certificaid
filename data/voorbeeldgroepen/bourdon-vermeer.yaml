    dochters:
      - "Bourdon BV (60 %) — exclusieve controle → integrale consolidatie"
      - "Vermeer Services SRL (Luik, 100 %) — kleine dochter"

  groottetoetsing_geconsolideerd:
    # Art. 1:24 §6 WVV: een moedervennootschap wordt op geconsolideerde
    # basis getoetst (niet enkelvoudig).
    aggregatie_vs_consolidatie:
      onjuist: "Aggregatie = simpele optelling van enkelvoudige cijfers (kan dubbele tellingen + intra-groep cijfers bevatten)"
      correct: "Voor moeder-grootte-toets mag aggregatie + 20 %-methode (CBN 2017/10) of volledige consolidatie"
      cbn_advies: "CBN 2017/10 + 2022/03 — geaggregeerde grootte voor groep + 20 %-correctie"
    cijfers_geconsolideerd_n:
      omzet_excl_btw_geconsolideerd: "€ 14.800.000 (gecombineerd Vermeer + Bourdon + Vermeer Services, na eliminatie intra-groep)"
      balanstotaal_geconsolideerd: "€ 8.200.000"
      gemiddeld_personeelsbestand_fte: 78
      conclusie: "Vermeer = GROOT op geconsolideerde basis. Verplicht volledig schema + jaarverslag + commissaris."
    waar_dochter_bourdon_zit:
      omschrijving: "Bourdon wordt enkelvoudig getoetst voor zijn eigen schema-keuze (klein in N, kantelt naar groot vanaf N+1) — moeder-status van Vermeer verandert dat niet."
      art_uitsluiting: "Dochter kan nooit MICRO zijn (art. 1:25 §1 WVV) — niet relevant hier, Bourdon zit ver boven micro."


# ---------------------------------------------------------------------------
# Vergelijkings-tabellen — herbruikbaar voor leerstukken en samenvatting
# ---------------------------------------------------------------------------

vergelijkings_tabellen:

  vereenvoudigd_vs_dubbel:
    aspect:
      - "Wettelijke basis | art. III.85 WER + KB 12-09-1983 | art. III.82-95 WER + KB 21-10-2018"
      - "Toepassing | natuurlijke persoon onder omzet-drempel | alle vennootschappen + grote zelfstandigen"
      - "Boeken | financieel + inkopen + verkopen + inventaris | algemeen dagboek + hulpdagboeken + grootboek + inventaris + centralisatieboek"
      - "MAR | nee | ja"
      - "Jaarrekening NBB | nee | ja (volgens grootte-schema)"
      - "Centralisatie | n.v.t. | minstens maandelijks"

  schema_drieluik:
    aspect:
      # Drempels worden bevestigd via Cijferzakboekje
      - "Wie | grote vennootschap | kleine vennootschap | microvennootschap"
      - "Balans | volledige rubrieken | samengevoegde posten | sterk vereenvoudigd"
      - "Resultatenrekening | volledig (RR1+RR2) | verkort | sterk verkort"
      - "Toelichting | volledig | beperkt | minimaal"
      - "Sociale balans | volledig schema | verkort schema | verkort schema"
      - "Jaarverslag | verplicht (art. 3:6) | vrijgesteld (art. 3:4) | vrijgesteld"
      - "Commissaris | verplicht (art. 3:72) | vrijgesteld behalve groep | vrijgesteld"

  bronnenhierarchie:
    laag_bron_karakter:
      - "1. EU-recht | Richtlijn 2013/34/EU (jaarrekening) · Verordening 1606/2002 (IAS/IFRS) · Richtlijn 2018/1673 (witwas) | bindend kader; verordening rechtstreeks, richtlijn via omzetting"
      - "2. Grondwet | art. 170 §1 + bevoegdheidsverdeling | constitutionele basis"
      - "3. Wet | WER Boek III (boekhouding) + WVV (vennootschaps- en jaarrekening) | federaal · bindend"
      - "4. KB | KB 21-10-2018 (dubbele boekh.) + KB 29-04-2019 (WVV-uitvoering — schema's, waardering, MAR) | bindend"
      - "5. Norm | ITAA-normen + NBB-circulaires + IBR-normen | bindend voor het beroep"
      - "6. Advies | CBN-adviezen (CBN 2017/10, 2019/04, 2020/09, 2022/03, ...) | gezaghebbend, niet bindend"
      - "7. Doctrine | rechtspraak + commentaren | interpretatief"

  groottetoetsing_drie_paden:
    pad_aspect:
      - "Solo-vennootschap | art. 1:24 §1 WVV | drempels enkelvoudig over 2 jaar"
      - "Moedervennootschap | art. 1:24 §6 WVV | drempels GECONSOLIDEERD (aggregatie + 20 % CBN 2017/10/2022/03 of volledige consolidatie)"
      - "Dochter | art. 1:25 §2 WVV | enkelvoudig — maar NOOIT micro"
      - "Beursgenoteerd | art. 1:11 WVV | altijd groot, ongeacht drempels"
      - "Vereniging | art. 3:47 WVV-VZW | andere drempels (lager)"

  sancties_keten_niet_neerlegging:
    sanctie_grondslag_timing:
      - "Tariefbijdrage | art. 3:13 KB-WVV + KB 27-09-2009 | bij neerlegging > 30 dagen na AV / > 7 mnd na afsluit; progressief verhoogd"
      - "Vermoeden schade derden | art. 3:43 §3 WVV | omkering bewijslast — schade vermoed te zijn veroorzaakt door verzuim"
      - "Bestuurdersaansprakelijkheid | art. 2:56 WVV + art. 3:43 §3 WVV | civielrechtelijk + tucht via beroepsorde"
      - "Gerechtelijke ontbinding | art. 2:74 WVV | na 3 boekjaren niet-neerlegging — vordering OM of belanghebbende"

# ---------------------------------------------------------------------------
# Mermaid-diagrammen — herbruikbaar voor leerstukken en samenvatting
# ---------------------------------------------------------------------------

mermaid_diagrammen:

  bronnenhierarchie_piramide:
    type: flowchart-td
    code: |
      EU[EU-recht<br/>Richtlijn 2013/34/EU · Verord. 1606/2002 · Richtlijn 2018/1673]
      GW[Grondwet<br/>art. 170 §1 · bevoegdheidsverdeling]
      WET[Federale wet<br/>WER Boek III · WVV]
      KB[Koninklijk besluit<br/>KB 21-10-2018 · KB 29-04-2019]
      NORM[Beroepsnormen<br/>ITAA · IBR · NBB-circulaires]
      ADV[CBN-adviezen<br/>gezaghebbend · niet bindend]
      DOC[Doctrine + rechtspraak]
      EU --> GW
      GW --> WET
      WET --> KB
      KB --> NORM
      NORM --> ADV
      ADV --> DOC

  boekhoudplicht_beslisboom:
    type: flowchart-td
    code: |
      A[Subject] --> B{Onderneming<br/>art. I.1 WER?}
      B -->|Nee| Z[Geen boekhoudplicht]
      B -->|Ja| C{Natuurlijke persoon<br/>of vennootschap?}
      C -->|Vennootschap| D[Dubbele boekhouding<br/>+ jaarrekening NBB]
      C -->|Natuurlijke persoon| E{Omzet<br/>≤ ~500k EUR?}
      E -->|Ja| F[Vereenvoudigd<br/>art. III.85 WER]
      E -->|Nee| D
      A -.->|VZW/stichting| G[WVV-VZW art. 1:28<br/>vereenvoudigd of dubbel<br/>volgens grootte-categorie]

  groottecascade:
    type: flowchart-td
    code: |
      START["Drempel-test<br/>2 opeenvolgende boekjaren"]
      START --> CHK{Meer dan 1 van 3<br/>drempels overschreden?}
      CHK -->|"≤ micro-drempels<br/>10 FTE · 700k omzet · 350k balans"| MICRO[Micro]
      CHK -->|"≤ klein-drempels<br/>50 FTE · 9M omzet · 4.5M balans"| KLEIN[Klein]
      CHK -->|Boven klein-drempels| GROOT[Groot]
      MICRO --> MS["Schema micro<br/>Minimale toelichting<br/>Geen jaarverslag<br/>Geen commissaris"]
      KLEIN --> KS["Schema verkort<br/>Geen jaarverslag (3:4)<br/>Geen commissaris solo (3:72)<br/>Beperkte toelichting"]
      GROOT --> GS["Schema volledig<br/>Jaarverslag verplicht (3:6)<br/>Commissaris verplicht (3:72)<br/>Volledige toelichting + KAM"]
      GROOT -.->|Beursgenoteerd 1:11| BG[Altijd groot]
      MICRO -.->|Dochter 1:25 §2| KLEIN

  publicatie_tijdslijn:
    type: flowchart-lr
    code: |
      A[Boekjaar afgesloten<br/>31-12-N] --> B[Opmaak JR<br/>bestuursorgaan<br/>binnen 6 mnd]
      B --> C[AV goedkeurt<br/>uiterlijk 30-06-N+1]
      C --> D[Neerlegging NBB<br/>30 dagen na AV<br/>max 7 mnd na afsluit<br/>= 31-07-N+1]
      D --> E[Openbaarmaking via NBB-portaal<br/>art. 3:10 WVV]
      D -.->|Na deadline| S[Sanctie-keten<br/>tariefbijdrage → 3:43 → 2:74]


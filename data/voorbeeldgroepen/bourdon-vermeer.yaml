# DEEL C — Jan De Smet (zelfstandig architect — natuurlijke persoon)
# ---------------------------------------------------------------------------

jan_de_smet:

  basisgegevens:
    naam: "Jan De Smet"
    activiteit: "zelfstandig architect, eenmanszaak (geen vennootschap)"
    leeftijd: 48
    woonplaats: "Gent"
    inschrijving_kbo: "ja, ondernemingsnummer aanwezig"
    btw_plichtig: "ja"
    werknemers: "geen — alleen werkend"

  scenario_omzet:
    # Scharnier voor vereenvoudigd vs dubbel — drempel art. III.85 WER
    # € 500 000 (€ 620 000 voor brandstofverkoop — n.v.t. voor architect).
    boekjaar_n_min_1: "omzet € 380.000 — onder drempel → mag VEREENVOUDIGDE boekhouding"
    boekjaar_n: "omzet € 540.000 — boven drempel → kantelt naar DUBBELE boekhouding"
    cumulatieve_test: "WER stelt geen 'twee opeenvolgende boekjaren'-vereiste zoals WVV voor grootte — overschrijding in één boekjaar volstaat om vanaf volgend boekjaar dubbele boekhouding verplicht te zijn (art. III.85 §1 WER)"
    bron: "art. III.85 WER + KB 12-09-1983 (vereenvoudigde boekhouding) — ⚠️ bedrag actueel bevestigen"

  vereenvoudigde_boekhouding_inhoud:
    # Vraag 2003-bibf — wat moet een vereenvoudigde boekhouding bevatten?
    verplichte_dagboeken:

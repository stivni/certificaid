      - "Inkoopdagboek (alle aankoop-stukken)"
      - "Verkoopdagboek (alle verkoop-stukken)"
      - "Inventarisboek (jaarlijkse inventaris activa + passiva — vermogensstaat)"
    geen_dubbele_partij: "Geen grootboek-rekening, geen proefbalans, geen MAR — daarom 'vereenvoudigd'"
    jaarrekening_nbb: "Geen verplichting tot neerlegging bij NBB (alleen vennootschappen)"

  vergelijking_dubbele_boekhouding:
    verplichte_boeken:
      - "Algemeen dagboek (geconcentreerd of via hulpdagboeken)"
      - "Hulpdagboeken (inkoop, verkoop, financieel, diversen)"
      - "Grootboek (MAR-rekeningen)"
      - "Inventarisboek"
      - "Centralisatieboek — minstens MAANDELIJKS (vraag 2003-bibf) art. III.85 §1 vierde lid WER + art. 5 KB 21-10-2018"
    centralisatieboek_detail:
      inhoud: "samenvatting van hulpdagboeken in MAR-rekeningen"
      frequentie: "minstens maandelijks — periodieke overdracht naar algemeen dagboek + grootboek"
      bron: "art. 5 KB 21-10-2018"


# Bourdon BV — Vermeer NV — voorbeeldgroep voor PO 1.2 (boekhoudrecht + jaarrekeningenrecht)
#
# Dunne bindcase, geen Aurelia-achtige doorlopende mock-financials. PO 1.2 is
# een juridisch kader-vak; de leerstof bestaat uit regels en scharniers, niet
# uit één doorgewerkte balans. De bindcase is een GALERIJ van mini-personages
# die elk een scharnier illustreren.
#
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-belgisch-boekhoudrecht.yaml (incidenteel — bronnen tonen via Bourdon-context)
#   - data/leerstukken/wie-moet-boekhouden-en-hoe.yaml (Jan De Smet = vereenvoudigd/dubbel scharnier; Bourdon = dubbele standaard)
#   - data/leerstukken/vennootschap-grootte-en-schema-keuze.yaml (Bourdon + Vermeer = kantelpunt; Buurthuis Linde = VZW-regime)
#   - data/leerstukken/jaarrekening-publiceren-en-sancties.yaml (Bourdon = niet-neerlegging-case + bestuurdersvermelding + sociale balans + afschrijving-wijziging)
#   - data/oefeningen/bourdon-grootte-en-publicatie.yaml (oefening — kern)
#
# Consistentie-toets:
#   - Drempel-cijfers (€ 9 000 000 omzet, € 4 500 000 balans, 50 FTE voor klein;
#     € 700 000 omzet, € 350 000 balans, 10 FTE voor micro) komen uit art. 1:24-25
#     WVV — in scripts-fase via MCP `certificaid-tarieven` of MCP `zoek_bronnen`
#     bevestigen. Mock-cijfers Bourdon zijn boven of onder die drempels gekozen.
#   - VZW-drempels (art. 3:47 WVV-VZW) zijn lager — apart te bevestigen.
#   - Tariefbijdrage-bedragen voor laattijdige neerlegging KB 27-09-2009 — bevestigen.

naam: bourdon-vermeer
beschrijving: >
  Dunne bindcase voor PO 1.2 — Boekhoudrecht en jaarrekeningenrecht. Vier
  personages die elk een scharnier van het wettelijke kader illustreren:
  Bourdon BV (kantelpunt klein → groot, met dochter-status van Vermeer),
  Vermeer NV (moedervennootschap die geconsolideerd getoetst wordt), Jan De
  Smet (zelfstandig architect — vereenvoudigde vs dubbele boekhouding), en
  Buurthuis Linde VZW (groottecategorieën onder WVV-VZW). De personages
  worden NIET door één doorlopende balans verbonden — wel door de
  scharnierregels die elk apart bevragen.

context_jaartal: "2026"
fiscaal_boekjaar_referentie: "kalenderjaar 2025 (afgesloten 31-12-2025)"

# ---------------------------------------------------------------------------
# DEEL A — Bourdon BV (kantelpunt klein → groot, dochter van Vermeer)
# ---------------------------------------------------------------------------

bourdon_bv:

  basisgegevens:
    naam: "Bourdon BV"
    rechtsvorm: "BV (besloten vennootschap)"
    zetel: "Mechelen"
    activiteit: "engineering-bureau industriële automatisering"
    boekjaar: "kalenderjaar (1-1 t/m 31-12)"
    opgericht: 2014
    zaakvoerder: "Karel Bourdon (60 % aandelen indirect via Vermeer NV)"
    bestuursorgaan: "raad van bestuur — Karel Bourdon + Sophie Aerts + Marc Vermeer"
    aandeelhouder_groep: "Vermeer NV bezit 60 % stemrechten → exclusieve controle"

  groottecijfers_twee_boekjaren:
    # Cijfers gekozen om kantelpunt klein → groot over twee opeenvolgende
    # jaren te illustreren. Drempels gelden cumulatief (twee jaar in rij +
    # meer dan één drempel overschreden) — bron: art. 1:24-25 WVV.
    boekjaar_n_min_1:
      omzet_excl_btw: "€ 8.400.000"
      balanstotaal: "€ 4.200.000"
      gemiddeld_personeelsbestand_fte: 46
      observatie: "Geen enkele drempel overschreden — klein in N-1."
    boekjaar_n:
      omzet_excl_btw: "€ 9.600.000"
      balanstotaal: "€ 4.800.000"
      gemiddeld_personeelsbestand_fte: 52
      observatie: "Drie drempels overschreden. Eerste jaar — geen kanteling nog."
    boekjaar_n_plus_1_prognose:
      omzet_excl_btw: "€ 10.200.000"
      balanstotaal: "€ 5.100.000"
      gemiddeld_personeelsbestand_fte: 55
      observatie: "Tweede jaar in rij meer dan één drempel — kantelt naar GROOT vanaf het boekjaar N+1."
    drempel_referentie:
      klein_max: "balans ≤ € 4.500.000 · omzet ≤ € 9.000.000 · FTE ≤ 50 — art. 1:24 §1 WVV (mogelijk inmiddels geïndexeerd — Cijferzakboekje raadplegen)"
      micro_max: "balans ≤ € 350.000 · omzet ≤ € 700.000 · FTE ≤ 10 — art. 1:25 §1 WVV"
    aandachtspunt:
      dochter_uitsluiting: "Bourdon is dochter van Vermeer (60 %). Per art. 1:25 §1 WVV kan een dochter NOOIT micro zijn — irrelevant hier (zit boven micro-drempels), wel cumulatieve test."
      moeder_toets: "Vermeer (moeder) wordt op GECONSOLIDEERDE basis getoetst — niet enkelvoudig (art. 1:24 §6 WVV)."

  scenario_jaarrekening_publicatie:
    boekjaar_n:
      afsluitdatum: "31-12-N"
      algemene_vergadering: "vrijdag 23-05-N+1 (binnen 6 mnd na afsluit — art. 3:1 WVV)"
      neerlegging_nbb_uiterlijk: "30 dagen na AV én max 7 mnd na afsluit = 31-07-N+1"
      historiek_n_min_2: "neergelegd 14-07-N-1 — tijdig"
      historiek_n_min_1: "neergelegd 02-09-N — LAAT (37 dagen over deadline) — sanctie-keten al gestart"

  sanctie_keten_bij_laattijdig:
    tariefbijdrage:
      omschrijving: "vast bedrag bij neerlegging na 30 dagen na AV (of 7 maanden na afsluit) — progressief verhoogd voor grote vennootschappen"
      bron: "art. 3:13 KB-WVV juncto KB 27-09-2009 — bedragen ⚠️ te bevestigen via Cijferzakboekje"
    bestuurdersaansprakelijkheid:
      omschrijving: "art. 3:43 §3 WVV: schade door derden geleden door niet-neerlegging wordt vermoed te zijn veroorzaakt door dit verzuim — omkering bewijslast"
    gerechtelijke_ontbinding:
      omschrijving: "art. 2:74 WVV: indien jaarrekening 3 boekjaren niet neergelegd, kan ondernemingsrechtbank op vordering belanghebbende of OM de ontbinding uitspreken"

  bestuurdersvermelding_eerste_bladzijde:
    # Per art. 3:5 WVV staat op eerste blad jaarrekening + tussenkomsten
    # bestuurders/zaakvoerders + (bij groot) commissaris.
    verplichte_velden:
      - "Naam en voornaam van elke bestuurder / zaakvoerder + adres"
      - "(Voor groot) Commissaris + lidmaatschap IBR"
      - "Datum van het mandaat (begin + einde)"
      - "Datum AV die jaarrekening heeft goedgekeurd"
    bourdon_concrete_invulling:
      bestuurders:
        - "Karel Bourdon (zaakvoerder/CEO), mandaat 2020 → 2026"
        - "Sophie Aerts (bestuurder), mandaat 2022 → 2027"
        - "Marc Vermeer (bestuurder, namens Vermeer NV), mandaat 2024 → 2029"
      commissaris_status_n: "Geen commissaris (klein in N) — wordt verplicht vanaf kanteling N+1 → art. 3:72 WVV"

  afschrijving_wijziging_mini_case:
    # Klassieker — vraag 2013-2 examenpatroon
    feiten: >
      Bourdon BV heeft sinds oprichting machines afgeschreven aan 10 % lineair
      (10 jaar levensduur). Per 1-1-N besluit het bestuursorgaan voor nieuwe
      machines over te stappen op 12,5 % (8 jaar) wegens snellere technologische
      veroudering.
    juridische_kwalificatie:
      type: "schattings-wijziging (geen schatting-fout, geen wijziging waarderingsregel)"
      basis: "CBN-advies 2019/04 + art. 3:6 KB-WVV (bestendigheidsbeginsel) + IAS 8 voor IFRS-pendant"
      verwerking: "prospectief — afschrijvingsplan vanaf 1-1-N aangepast, geen retroactieve correctie"
    toelichting_verplicht:
      omvang_aanpassing: "vermeld in toelichting bij waarderingsregels + ZONODIG bij staat van vaste activa"
      motivering: "technologische veroudering documenteren"
    valkuil:
      onjuist: "Wijziging waarderingsregel ⇒ retroactief herrekenen vanaf oprichting"
      correct: "Schatting-wijziging ⇒ prospectief — bestendigheid geldt voor de regel, niet voor de schatting"

  sociale_balans_fragment:
    # Sociale balans is verplichte bijlage zodra personeel aanwezig.
    # Verkort schema voor klein, volledig voor groot. Bourdon = klein in N.
    schema_n: "verkort sociale balans — art. 3:24 KB-WVV"
    opleidingskost_n: "€ 18.500 (formele opleidingen — interne + externe)"
    opleidingskost_bestanddelen:
      - "Direct kost: factuur opleidingsverstrekkers + inschrijvingsgelden"
      - "Indirect kost (alleen volledig schema): personeelskost werknemers in opleiding tijdens werkuren — niet verplicht in verkort"
      - "Reis- en verblijfskosten verbonden aan opleiding"
    gemiddeld_personeelsbestand_fte: 52
    opmerkingen_examen: "Vraag 2008-bibf — welke bestanddelen tellen mee voor opleidingskost? Antwoord hangt af van verkort (alleen direct) vs volledig (direct + indirect)."


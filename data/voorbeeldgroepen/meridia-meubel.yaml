# Meridia Meubel — voorbeeldgroep voor PO 1.8 analytische boekhouding-leerstukken
#
# Mock Belgische productie-onderneming (meubelmaker). Cijfers fictief maar intern consistent.
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-analytische-boekhouding.yaml       (leerstuk 1 — stelsel + registratie)
#   - data/leerstukken/kostprijsmethoden-kiezen.yaml             (leerstuk 2 — full · direct · ABC · standaard)
#   - data/leerstukken/break-even-en-marginale-beslissing.yaml   (leerstuk 3 — BEP + marginaal + knelpunt)
#   - data/leerstukken/budget-en-variantieanalyse.yaml           (leerstuk 4 — masterbudget + varianties Q1 2026)
#
# Consistentie-toetsen (door auteur uitgevoerd, zie rapport in PR-omschrijving):
#   - Σ verdeelde overhead = 740.000 EUR (totale vaste OH-pool)
#   - Direct kostprijs ≤ full kostprijs (per definitie, beide methodes)
#   - ABC + Full → zelfde totaal toegewezen overhead (rounding ≤ 0,1%)
#   - Pro-forma balans 31/12/2026 sluit (totaal activa = totaal passiva = 2.434,5 k EUR)
#   - KSO 2026: aansluiting beginliquiditeit + operationele cash + investering + financiering = eindliquiditeit
#   - Knelpunt-getallen forceren echte mix-keuze (CM/CNC-uur tafel 260 > kast 180)
#   - ABC-cross-subsidie zichtbaar: marge-rangorde tafel↔kast keert om tussen full en ABC

naam: meridia-meubel
beschrijving: >
  Meridia Meubel BV is een mock Belgische middelgrote vennootschap in de
  meubelproductie. Twee productlijnen: 'tafel-eik' (standaard serie­productie,
  4000 stuks/jaar) en 'kast-op-maat' (job-order, 600 stuks/jaar). Productie
  draait op CNC-machines (knelpunt-capaciteit) + handmatige afwerking.
  Sluit aan op het meubelmaker-voorbeeld uit concept-record
  'analytische-boekhouding' (Zelena Bio) — dezelfde mentale beeld-omgeving,
  maar uitgebouwd voor de volledige toolkit van PO 1.8 (kostprijsmethodes,
  break-even, knelpunt, budget, varianties).

sector: meubelproductie
rechtsvorm: BV
omvang: middelgrote vennootschap
balansdatum: "31-12-2025"
boekjaar_referentie: "2025"
boekjaar_budget: "2026"

# ---------------------------------------------------------------------------
# Basis-volumes en -prijzen 2025 (de fundamenten waar alle berekeningen op steunen)
# ---------------------------------------------------------------------------

productlijnen:

  tafel-eik:
    naam: "Tafel-eik (standaard)"
    type_productie: serieproductie
    volume_2025: 4000           # eenheden/jaar
    verkoopprijs_per_eenheid: 500   # EUR
    omzet_2025: 2000000          # 4000 × 500
    cnc_uren_per_eenheid: 1.0
    afwerk_uren_per_eenheid: 2.0
    setups_per_eenheid: 0.05      # 1 setup per 20 stuks (lange series)
    materiaalkost_per_eenheid: 120   # 4 kg eik × 30 EUR/kg
    directe_arbeidskost_per_eenheid: 100   # 2 u × 50 EUR/u
    variabele_overhead_per_eenheid: 20    # 1 CNC-u × 20 EUR/u (energie + verbruikgoederen)
    totaal_variabele_kost_per_eenheid: 240
    contributiemarge_per_eenheid: 260     # 500 - 240
    rol_in_case: "standaard-product met lange series — illustreert serieproductie + relatief lage overhead-druk per stuk"

  kast-op-maat:
    naam: "Kast-op-maat (job-order)"
    type_productie: job-order
    volume_2025: 600
    verkoopprijs_per_eenheid: 1800
    omzet_2025: 1080000          # 600 × 1800
    cnc_uren_per_eenheid: 4.0
    afwerk_uren_per_eenheid: 8.0
    setups_per_eenheid: 1.0       # elk stuk vraagt eigen instelling
    materiaalkost_per_eenheid: 600
    directe_arbeidskost_per_eenheid: 400   # 8 u × 50
    variabele_overhead_per_eenheid: 80     # 4 CNC-u × 20
    totaal_variabele_kost_per_eenheid: 1080
    contributiemarge_per_eenheid: 720      # 1800 - 1080
    rol_in_case: "job-order product met hoge setup-frequentie — illustreert cross-subsidie-probleem (full costing onderschat overhead-impact, ABC ontmaskert)"

totalen_2025:
  omzet: 3080000                 # 2.000.000 + 1.080.000
  totaal_variabele_kost: 1608000  # 4000×240 + 600×1080 = 960.000 + 648.000
  totaal_contributiemarge: 1472000  # 4000×260 + 600×720 = 1.040.000 + 432.000
  totaal_vaste_overhead: 740000
  bedrijfsresultaat: 732000        # CM - vaste OH

# ---------------------------------------------------------------------------
# Kostenmodel — kostenplaatsen + cost-drivers + capaciteiten
# Voedt leerstuk 1 (stelsel) en leerstuk 2 (allocaties)
# ---------------------------------------------------------------------------

kostenmodel:

  kostenplaatsen:
    - id: productiehal
      naam: "Productiehal (CNC-zone)"
      primaire_driver: machine-uren-cnc
      capaciteit_2025: 7000        # uren/jaar — bezetting 6400/7000 = 91%
      verbruik_2025: 6400          # 4000×1 + 600×4
      bottleneck: ja
      noot: "Knelpunt-resource voor leerstuk 3 (productmix-keuze op CM/CNC-uur)"

    - id: afwerkatelier
      naam: "Afwerkatelier (handmatig schuren/lakken)"
      primaire_driver: directe-arbeidsuren
      capaciteit_2025: 15000       # uren/jaar
      verbruik_2025: 12800         # 4000×2 + 600×8
      bottleneck: nee

    - id: magazijn
      naam: "Magazijn (grondstof + afgewerkt)"
      primaire_driver: m2-oppervlakte
      noot: "Indirecte kost — verdeeld via vierkante meter"

    - id: verkoop
      naam: "Verkoop + marketing"
      primaire_driver: omzet-aandeel
      noot: "Indirecte kost — verdeeld via omzet"

    - id: algemeen-beheer
      naam: "Algemeen beheer (directie + admin + IT)"
      primaire_driver: gemengde-sleutel
      noot: "Periode-kost — niet eenvoudig toewijsbaar; cost-driver-discussie in leerstuk 2"

  cost_drivers_per_kost:
    titel: "Welke cost-driver voor welke indirecte kost? (voedt leerstuk 1 + 2 — ABC-discussie)"
    kolommen: ["Indirecte kost", "Logische cost-driver", "Rationale", "Gebruikt in full costing?", "Gebruikt in ABC?"]
    rijen:
      - ["Energie CNC", "machine-uren CNC", "Direct causaal — geen energie zonder uur", "Ja (in variabele OH)", "Ja"]
      - ["Afschrijving CNC + machines", "machine-uren CNC", "Slijtage proportioneel met gebruik", "Ja", "Ja (machine-pool)"]
      - ["Huur productiehal + magazijn", "m² of machine-uren", "Vaste kost — driver-keuze is arbitrair", "Ja (via machine-uren-sleutel)", "Ja (machine-pool)"]
      - ["Setup-kosten (planning + omstellen)", "aantal opstellingen", "Causaal: kast vraagt 1 setup per stuk, tafel 1 per 20 stuks", "Nee — zit in algemene overhead", "**Ja — apart pool (cross-subsidie ontmaskerd hier)**"]
      - ["Algemeen beheer (directie + IT)", "omzet of arbeidsuren", "Geen direct causaal verband — sleutel-keuze", "Ja (machine-uren-sleutel)", "Ja (afwerk-uren-sleutel)"]
      - ["Verkoop + marketing", "omzet", "Vooral klant-/markt-gedreven", "Ja", "Ja (afzonderlijke pool)"]

  overhead_pool_2025:
    titel: "Vaste overhead-pool 2025 — totaal 740.000 EUR (sluit aan op totalen_2025.totaal_vaste_overhead)"
    eenheid: EUR
    posten:
      - omschrijving: "Afschrijving CNC + machines (10 jaar lineair op 2 mln machinepark)"
        bedrag: 200000
      - omschrijving: "Huur productiehal + magazijn"
        bedrag: 120000
      - omschrijving: "Setup-kosten (planner + omsteldienst + setup-verbruiksgoed)"
        bedrag: 240000
      - omschrijving: "Algemeen beheer + verkoop (directie, admin, IT, marketing)"
        bedrag: 180000
    totaal: 740000

  variabele_overhead_2025:
    titel: "Variabele overhead 2025 — totaal 128.000 EUR (20 EUR × 6400 CNC-uren)"
    eenheid: EUR
    posten:
      - omschrijving: "Energie CNC-machines (variabel met machine-uren)"
        bedrag: 96000
      - omschrijving: "Verbruiksgoederen (boren, slijpschijven, lijm, lak)"
        bedrag: 32000
    totaal: 128000
    noot: "Verbijzondering: per CNC-uur = 128.000/6400 = 20 EUR/u. Wordt ook in direct-costing meegerekend als variabele kost."

# ---------------------------------------------------------------------------
# Kostentypologie voor Meridia (voedt leerstuk 1 — gemeenschappelijke woordenschat)
# ---------------------------------------------------------------------------

kostentypologie_meridia:
  titel: "Kostentypologie toegepast op Meridia (vier-cellen-matrix)"
  intro: "Elke kost krijgt een label op twee assen: gedrag (vast/variabel) × toerekenbaarheid (direct/indirect)."
  matrix:
    kolommen: ["", "Direct (één productlijn)", "Indirect (gedeeld)"]
    rijen:
      - ["**Variabel**", "Eikenhout (tafel) · paneelhout (kast) · directe productie-uren", "Energie CNC · verbruiksgoederen (boren, lak)"]
      - ["**Vast**", "Afschrijving CNC-mal voor tafel-serie (indien gebruikt) · supervisor specifiek voor kast-atelier", "Huur productiehal · afschrijving CNC · algemeen beheer · directie-loon · marketing"]
  noot_voor_leerstuk2: >
    Deze matrix is de basis voor de keuze full vs direct vs ABC:
    - Full costing verdeelt **alle** vier cellen over de producten;
    - Direct costing trekt alleen de **variabele rij** in de kostprijs;
    - ABC ontmaskert binnen de **indirect-vast cel** de cross-subsidie door setup-pool apart te zetten.

# ---------------------------------------------------------------------------
# DRIE REGISTRATIESYSTEMEN — keuze voor Meridia (voedt leerstuk 1)
# ---------------------------------------------------------------------------

registratiesystemen_keuze:
  titel: "Drie registratiesystemen — welke kiest Meridia?"
  systemen:
    - naam: "Niet-geïntegreerd (autonoom)"
      beschrijving: "Analytische bh in aparte ERP-module of spreadsheet, los van klassen 6/7. Maand-aansluiting verplicht."
      voor:
        - "Volledige analytische vrijheid"
        - "Geen impact op de wettelijke jaarrekening"
        - "Pilootprojecten en kleine entiteiten"
      tegen:
        - "Reconciliatie-werk elke maand"
        - "Risico op divergentie tussen beide systemen"

    - naam: "Gespiegeld (klasse 8/9 met spiegelrekeningen)"
      beschrijving: "Volwaardige analytische boekhouding in klassen 8/9 — elke kost in klasse 6 krijgt tegenboeking in klasse 9 via spiegelrekening 99 (CBN 132/7)."
      voor:
        - "Eén audit-trail: zelfde brontransacties feeden beide sferen"
        - "Conform CBN 132/7-aanbeveling"
        - "Schaal-bestendig (groeit mee met onderneming)"
      tegen:
        - "Initiële opzet vraagt boekhoudkundige expertise"

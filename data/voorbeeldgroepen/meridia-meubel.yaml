  keuze_meridia: "**Gespiegeld systeem (klasse 8/9)** — middelgrote BV met groeiplannen, ERP aanwezig (PackHouse Suite), wil audit-friendly opzet die mee kan schalen. Maand-aansluiting bij periodeafsluiting."

# ---------------------------------------------------------------------------
# BOEKINGEN (voedt leerstuk 1 — spiegelboeking-mechaniek + leerstuk 4 — standaardkosten-variantie)
# ---------------------------------------------------------------------------

boekingen:

  spiegelboeking-grondstof-aankoop:
    titel: "Spiegelboeking — aankoop eikenhout 24.000 EUR (CBN 132/7-mechaniek)"
    context: "Meridia koopt in januari 800 kg eik @ 30 EUR/kg = 24.000 EUR. De algemene bh ziet een aankoop (klasse 60); de analytische bh herleidt naar 'kost van productiehal toegerekend aan tafel-eik'."
    eenheid: EUR
    blok_algemene:
      titel: "Algemene boekhouding — kost naar aard"
      debet:
        - rekening: "600 — Aankoop grondstoffen (eik)"
          bedrag: 24000
      credit:
        - rekening: "440 — Leveranciers"
          bedrag: 24000
      totaal: 24000
    blok_analytische:
      titel: "Analytische boekhouding — spiegel + bestemming"
      stap1_spiegel:
        debet:
          - rekening: "90 — Spiegelpost kosten (tegenboeking analytische sfeer)"
            bedrag: 24000
        credit:
          - rekening: "99 — Spiegelrekening algemene boekhouding"
            bedrag: 24000
      stap2_toewijzing:
        debet:
          - rekening: "92 — Kosten productiehal (toegerekend aan tafel-eik via materiaal-traceer)"
            bedrag: 24000
        credit:
          - rekening: "90 — Spiegelpost kosten"
            bedrag: 24000
      totaal: 24000
    sleutelpunten:
      - "Klasse 6 loopt door voor de wettelijke jaarrekening — niet aangetast"
      - "Klasse 9 voegt de bestemming toe — voor interne sturing"
      - "Spiegelrekening 99 sluit de loop — saldo na elke spiegeling = 0 (verifieerbaar)"

  standaardkosten-met-variantie:
    titel: "Standaardkosten-boeking met variantierekening — productie 100 tafels in Q1 2026"
    context: >
      Meridia werkt voor tafel-eik met standaardkost 355,63 EUR/eenheid (zie standaardkost-kaart).
      In één batch produceert ze 100 tafels — werkelijke kost wijkt af van standaard
      (eikprijs gestegen, nieuwe medewerker iets minder efficiënt).
    eenheid: EUR
    standaardkost_batch: 35563     # 100 × 355,63
    werkelijke_kost_batch: 37770    # zie variantie-rapport
    totale_variantie: -2207        # ongunstig
    blok_boeking:
      titel: "Boeking van 100 afgewerkte tafels in voorraad — aan standaardkost — variantie apart"
      debet:
        - rekening: "33 — Voorraad afgewerkte producten (tafel-eik, aan standaardkost)"
          bedrag: 35563
        - rekening: "658 — Ongunstige productie-varianties (decompositie elders)"
          bedrag: 2207
      credit:
        - rekening: "60/61/62 — Werkelijke kosten (grondstof + arbeid + OH) via spiegeling"
          bedrag: 37770
      totaal: 37770
    noot_ias2: >
      Bij materiële varianties (richtwaarde > 5% van standaard) moet de variantie pro-rata
      worden gespreid over voorraad én KGV (IAS 2 + KB-WVV). Bij niet-materieel mag de
      variantie integraal in resultaat (rekening 658/758) zoals hierboven.

# ---------------------------------------------------------------------------
# KOSTPRIJS-BEREKENINGEN — vier methodes naast elkaar (voedt leerstuk 2 — KERN)
# ---------------------------------------------------------------------------

kostprijs_berekeningen:

  full-costing-tafel-eik:
    titel: "Full costing — kostprijs tafel-eik per eenheid"
    methode_uitleg: "Alle productiekosten (variabel + vast) verdeeld via één sleutel: machine-uren CNC."
    overhead_sleutel:
      driver: machine-uren-cnc
      totale_vaste_overhead: 740000
      totale_cnc_uren: 6400
      tarief_per_cnc_uur: 115.625    # 740.000 / 6400
    berekening:
      kolommen: ["Component", "Hoeveelheid", "Tarief (EUR)", "Kost per eenheid (EUR)"]
      rijen:
        - ["Materiaal (eik)", "4 kg", "30,00", "120,00"]
        - ["Directe arbeid", "2 u", "50,00", "100,00"]
        - ["Variabele OH", "1 CNC-u", "20,00", "20,00"]
        - ["Vaste OH (via CNC-uur-sleutel)", "1 CNC-u", "115,63", "115,63"]
        - ["**Totaal full kostprijs**", "", "", "**355,63**"]
    marge_per_eenheid: 144.37        # 500 - 355,63
    rangorde_marge: "tafel-eik beter dan kast (zie kast-vergelijking onder ABC)"

  full-costing-kast-op-maat:
    titel: "Full costing — kostprijs kast-op-maat per eenheid"
    berekening:
      kolommen: ["Component", "Hoeveelheid", "Tarief (EUR)", "Kost per eenheid (EUR)"]
      rijen:
        - ["Materiaal (paneel + ijzerwerk)", "1 set", "600,00", "600,00"]
        - ["Directe arbeid", "8 u", "50,00", "400,00"]
        - ["Variabele OH", "4 CNC-u", "20,00", "80,00"]
        - ["Vaste OH (via CNC-uur-sleutel)", "4 CNC-u", "115,63", "462,50"]
        - ["**Totaal full kostprijs**", "", "", "**1542,50**"]
    marge_per_eenheid: 257.50         # 1800 - 1542,50
    cross_subsidie_signaal: "Kast lijkt méér marge per stuk — maar de full costing-sleutel (machine-uren) negeert de setup-druk. ABC ontmaskert dit (zie volgende blok)."

  direct-costing-tafel-eik:
    titel: "Direct costing — kostprijs tafel-eik per eenheid"
    methode_uitleg: "Alleen variabele kosten in product; vaste OH = periodekost (740.000 in resultaat als block)."
    berekening:
      kolommen: ["Component", "Kost per eenheid (EUR)"]
      rijen:
        - ["Materiaal", "120,00"]
        - ["Directe arbeid (variabel deel)", "100,00"]
        - ["Variabele OH", "20,00"]
        - ["**Totaal variabele kost**", "**240,00**"]
        - ["Verkoopprijs", "500,00"]
        - ["**Contributiemarge per tafel**", "**260,00**"]
        - ["**CM-percentage**", "**52 %**"]
    noot: "260 EUR/tafel × 4000 stuks = 1.040.000 totale CM tafel-as. Vaste OH (740.000) staat los — geen toerekening."

  direct-costing-kast-op-maat:
    titel: "Direct costing — kostprijs kast-op-maat per eenheid"
    berekening:
      kolommen: ["Component", "Kost per eenheid (EUR)"]
      rijen:
        - ["Materiaal", "600,00"]
        - ["Directe arbeid", "400,00"]
        - ["Variabele OH", "80,00"]
        - ["**Totaal variabele kost**", "**1080,00**"]
        - ["Verkoopprijs", "1800,00"]
        - ["**Contributiemarge per kast**", "**720,00**"]
        - ["**CM-percentage**", "**40 %**"]

  abc-vergelijking:
    titel: "ABC — kostprijs via cost-driver-pools (cross-subsidie ontmaskerd)"
    methode_uitleg: >
      In plaats van één sleutel (machine-uren) worden de 740.000 EUR overhead opgesplitst
      in drie activity-pools, elk met eigen cost-driver. Setup-pool is de game-changer:
      kast trekt 600 setups, tafel 200 — terwijl tafel 4000 stuks dekt en kast 600.
    pools:
      kolommen: ["Pool", "Bedrag (EUR)", "Cost-driver", "Totaal driver-verbruik", "Tarief per driver-eenheid"]
      rijen:
        - ["Setup-pool", "240.000", "aantal opstellingen", "800 setups", "300 EUR/setup"]
        - ["Machine-pool (afschr + huur)", "320.000", "machine-uren CNC", "6.400 uren", "50 EUR/CNC-u"]
        - ["Algemeen + verkoop", "180.000", "directe arbeidsuren (afwerking)", "12.800 uren", "14,06 EUR/u"]
        - ["**Totaal**", "**740.000**", "", "", ""]
    berekening_tafel:
      kolommen: ["Component", "Hoeveelheid", "Tarief", "Kost per eenheid (EUR)"]
      rijen:
        - ["Variabele kost (zie direct costing)", "", "", "240,00"]
        - ["Setup-pool", "0,05 setup/stuk", "300", "15,00"]
        - ["Machine-pool", "1 CNC-u", "50,00", "50,00"]
        - ["Algemeen", "2 afwerk-u", "14,06", "28,12"]
        - ["**Totaal ABC-kostprijs tafel**", "", "", "**333,12**"]
      marge: 166.88         # 500 - 333,12
    berekening_kast:
      kolommen: ["Component", "Hoeveelheid", "Tarief", "Kost per eenheid (EUR)"]
      rijen:
        - ["Variabele kost", "", "", "1080,00"]
        - ["Setup-pool", "1 setup/stuk", "300", "300,00"]
        - ["Machine-pool", "4 CNC-u", "50,00", "200,00"]
        - ["Algemeen", "8 afwerk-u", "14,06", "112,50"]
        - ["**Totaal ABC-kostprijs kast**", "", "", "**1692,50**"]
      marge: 107.50          # 1800 - 1692,50
    cross_subsidie_zichtbaar:
      titel: "Marge-rangorde keert om — bewijs van cross-subsidie in full costing"
      tabel:
        kolommen: ["Productlijn", "Marge per stuk — Full", "Marge per stuk — ABC", "Verschil", "Conclusie"]
        rijen:
          - ["tafel-eik", "144,37", "166,88", "+22,51", "Wint onder ABC — kreeg onterecht hoge OH via machine-uren"]
          - ["kast-op-maat", "257,50", "107,50", "−150,00", "Verliest onder ABC — kreeg onterecht lage OH (setup-druk genegeerd)"]
      les: >
        Onder full costing lijkt kast-op-maat de winstgever (257 marge); onder ABC blijkt
        tafel-eik veel rendabeler per stuk (167 vs 107). Reden: setups (een complexiteits-driver)
        worden in full costing geabsorbeerd door de algemene OH-pool, waar kast ze
        disproportioneel veroorzaakt zonder ze toegewezen te krijgen. Strategische
        implicatie: prijszetting kast moet verhoogd of complexiteit gereduceerd —
        anders subsidieert tafel-eik feitelijk de kast-lijn.

  standaardkost-kaart-tafel:
    titel: "Standaardkost-kaart tafel-eik (basis voor variantieanalyse leerstuk 4)"
    intro: "Norm-hoeveelheden + norm-prijzen vastgelegd vóór het boekjaar; werkelijke afwijking wordt achteraf gedecomposeerd."
    componenten:
      kolommen: ["Component", "Norm-hoeveelheid", "Norm-prijs (EUR)", "Standaardkost (EUR)"]
      rijen:
        - ["Eik (kg)", "4,0", "30,00", "120,00"]
        - ["Directe arbeid (uren)", "2,0", "50,00", "100,00"]
        - ["Variabele OH (CNC-uren)", "1,0", "20,00", "20,00"]
        - ["Vaste OH allocatie (CNC-uren)", "1,0", "115,63", "115,63"]
        - ["**Standaardkost per tafel**", "", "", "**355,63**"]
    bezettingsbasis: "Norm vaste-OH-tarief 115,63 berekend op normale capaciteit = 6.400 CNC-uren (niet op werkelijke productie — voorkomt volume-effect)."

# ---------------------------------------------------------------------------
# DIENSTEN-MINI-CASE — Vega Consulting (voedt leerstuk 2, kenniselement 1.8.III.A.5)
# ---------------------------------------------------------------------------

diensten_mini_case:
  titel: "Vega Consulting BVBA — uurtarief-berekening (dienst-onderneming)"
  intro: >
    Om kenniselement 1.8.III.A.5 (kostenberekening voor dienstverlening) te eren.
    Korte parallel: full-costing-logica toegepast op een IT-consultancy in plaats
    van productie. De principes blijven dezelfde (variabele + vaste kosten verdelen
    over kostendragers); de driver wordt 'declarabel uur' i.p.v. 'machine-uur'.
  onderneming:
    naam: "Vega Consulting BVBA"
    consultants: 3
    werkbare_uren_per_consultant_jaar: 1600
    bezettingsgraad: 0.75              # 75% declarabel, 25% intern (admin, opleiding, sales)
  data_2025:
    declarabele_uren: 3600              # 3 × 1600 × 0,75
    loonkost_consultants: 270000        # 3 × 90.000
    vaste_kosten:
      kantoorhuur: 24000
      software_licenties: 18000
      directie_admin: 60000
      marketing: 18000
      totaal_vast: 120000
    totale_kost_te_recupereren: 390000  # 270.000 + 120.000
  berekening_uurtarief:
    formule: "Kostprijs per declarabel uur = totale kost / declarabele uren = 390.000 / 3600"
    kostprijs_per_uur: 108.33
    target_marge: 0.40                  # 40 % winstmarge
    verkoopuurtarief: 180.55             # 108,33 / (1 - 0,40) ≈ 180,55
    afgerond_marktconform: 180
  les: >
    Voor diensten is de bezettingsgraad de strategische hefboom (vergelijkbaar met
    capaciteits-benutting bij productie). Daalt de bezetting van 75% naar 60%,
    dan stijgt de break-even-uurtarief tot 135 EUR (390.000 / 2.880). Voor de
    accountant-adviseur: bezetting bewaken is even belangrijk als urenboeking-discipline.

# ---------------------------------------------------------------------------
# BREAK-EVEN + MARGINALE DATA (voedt leerstuk 3)
# ---------------------------------------------------------------------------

break_even_data:

  bep-tafel-eik-alleen:
    titel: "BEP tafel-eik (alleenstaande analyse)"
    aanname: "Toegewezen vaste OH = 4000/6400 × 740.000 = 462.500 EUR (proportioneel naar CNC-verbruik)."
    toegewezen_vaste_kost: 462500
    cm_per_eenheid: 260
    bep_eenheden: 1779               # 462.500 / 260, afgerond naar boven
    bep_omzet: 889500                # 1779 × 500
    werkelijk_volume: 4000
    veiligheidsmarge_omzet: 1110500   # 2.000.000 - 889.500
    veiligheidsmarge_percent: 55.5    # (2000-889,5)/2000

  bep-multi-product:
    titel: "Multi-product BEP voor Meridia (mix tafel 87%, kast 13%)"
    aanname: "Mix-aandeel in eenheden (niet in omzet) = 4000/(4000+600) = 87% tafel, 13% kast. Constant verondersteld."
    mix_aandelen:
      tafel: 0.8696                  # 4000 / 4600
      kast: 0.1304                   # 600 / 4600
    gewogen_cm_per_eenheid: 319.83    # 0,8696 × 260 + 0,1304 × 720 = 226,1 + 93,9
    totale_vaste_kost: 740000
    bep_eenheden_totaal: 2314         # 740.000 / 319,83
    bep_decompositie:
      tafels: 2012                    # 2314 × 0,8696
      kasten: 302                     # 2314 × 0,1304
    bep_omzet_totaal: 1549600         # 2012×500 + 302×1800 = 1.006.000 + 543.600
    valkuil_noot: >
      BEP geldt **alleen bij constante mix** (87/13). Als kast-aandeel stijgt
      (gewogen CM stijgt), zakt het BEP-aantal; daalt kast-aandeel
      (gewogen CM zakt), stijgt het BEP. Mix-shift = her-berekenen.

  special-order-case:
    titel: "Special order — retailer biedt 350 EUR/tafel voor batch van 500"
    context: >
      Een grote retailer biedt 350 EUR/tafel (i.p.v. normale 500) voor een eenmalige
      batch van 500 tafels onder eigen huismerk. Variabele kost per tafel blijft 240.
      Geen extra vaste kost — past binnen vrije capaciteit (7000 - 6400 = 600 CNC-uren).
    incrementele_analyse:
      extra_opbrengst: 175000         # 500 × 350
      extra_variabele_kost: 120000    # 500 × 240
      extra_vermijdbare_vaste_kost: 0
      incrementele_winst: 55000        # 175.000 - 120.000
    cannibalisatie_risico:
      scenario: "Als de huismerk-tafels normale verkoop verdringen (1-op-1)"
      derving_per_verdrongen_tafel: 150   # 500 - 350 = lager prijspunt, of: CM 260 → 110
      totale_derving_bij_volledige_verdringing: 75000  # 500 × 150
      conclusie: >
        Aanvaarden ALLEEN als: (1) vrije capaciteit bestaat (✓ 600 CNC-uren),
        (2) huismerk-kanaal raakt eigen merk-kanaal niet (geografisch of segment-afgesloten),
        (3) eenmalig (geen prijspunt-precedent voor andere klanten).
        Bij volledige cannibalisatie wordt de winst van +55.000 een verlies van -20.000.
    advies_accountant: >
      Aanvaarden mét contractuele afbakening: alleen levering aan deze retailer onder
      huismerk, geen recht op herhaling onder zelfde voorwaarden, NDA op kostprijs.

  make-or-buy-laden:
    titel: "Make-or-buy — tafel-laden zelf maken of inkopen?"
    context: >
      Meridia overweegt voor elke tafel een opbergvak (lade) toe te voegen. Twee opties:
      zelf produceren (extra arbeid en materiaal, plus eigen ladenmal 30.000 EUR vermijdbare
      vaste kost) of inkopen bij externe leverancier @ 30 EUR/stuk × 4000 stuks.
    optie_zelf:
      variabele_kost_per_lade: 25
      vermijdbare_vaste_kost: 30000
      totale_jaarkost: 130000          # 4000 × 25 + 30.000
    optie_inkopen:
      inkoopprijs_per_lade: 30
      totale_jaarkost: 120000          # 4000 × 30
    netto_voordeel_inkopen: 10000
    indifferentie_volume: 6000          # break-even tussen opties: 25Q + 30.000 = 30Q → Q = 6000
    conclusie_bij_huidig_volume: >
      Bij 4000 tafels is inkopen 10.000 EUR voordeliger. Pas vanaf 6000 tafels
      kantelt de balans naar zelf-maken. Kwalitatieve factoren (kwaliteits-controle,
      levertijd, leverancier-afhankelijkheid) niet meegerekend.

  knelpunt-cnc-mix:
    titel: "Knelpunt-analyse — CNC-capaciteit (productmix-keuze)"
    context: >
      CNC-machine is dé bottleneck (6400/7000 uren = 91% bezetting). Bij vraag-stijging
      moet Meridia kiezen welke productlijn priority krijgt. NIET op CM per eenheid
      kijken — maar op CM per knelpunt-uur.
    analyse:
      kolommen: ["Productlijn", "CM per eenheid (EUR)", "CNC-uren per eenheid", "**CM per CNC-uur (EUR)**", "Voorkeur?"]
      rijen:
        - ["tafel-eik", "260", "1,0", "**260**", "**Eerst — wint per knelpunt-uur**"]
        - ["kast-op-maat", "720", "4,0", "**180**", "Daarna — lagere CM/uur ondanks hoogste CM/stuk"]
    paradox: >
      Op CM per eenheid lijkt kast superieur (720 vs 260). Maar de knelpunt-resource is
      CNC-uur — en per CNC-uur levert tafel meer marge op. Bij capaciteits-druk: maximaliseer
      eerst tafel-productie, vul de rest in met kast.
    rekenvoorbeeld_capaciteit: >
      Stel de vraag stijgt naar 5000 tafels + 700 kasten = 5000 + 2800 = 7800 CNC-uren
      (800 te veel). Optie A: alle tafels + 525 kasten (5000 + 2100 = 7100, nog 100 te veel).
      Optie B: 4900 tafels + 700 kasten (4900 + 2800 = 7700, 700 te veel) → CM = 4900×260 + 700×720 = 1.274.000 + 504.000 = 1.778.000.
      Beslissing volgens knelpunt-logica: tafels voorrang (CM/uur 260) — vul aan met kast
      tot 7000 uren = 5000 tafels + 500 kasten = 5000 + 2000 = 7000 ✓ → CM = 1.300.000 + 360.000 = **1.660.000**.
      Knelpunt-logica zet de mix scherp.

  keep-or-drop-aanvulling:
    titel: "Keep-or-drop — moet Meridia kast-op-maat schrappen?"
    context: >
      Onder ABC blijkt kast slechts 107 EUR marge per stuk (vs 167 voor tafel). De vraag:
      is de kast-lijn nog rendabel als geheel?
    analyse:
      kolommen: ["Post", "Bedrag (EUR/jaar)"]
      rijen:
        - ["Omzet kast (600 × 1800)", "+1.080.000"]
        - ["Variabele kost (600 × 1080)", "−648.000"]
        - ["**Contributiemarge kast**", "**+432.000**"]
        - ["Vermijdbare vaste kost bij schrappen (setup-personeel kast-specifiek)", "−180.000"]
        - ["**Netto bijdrage kast aan vaste-OH dekking**", "**+252.000**"]
    conclusie: >
      Schrappen kost +252.000 EUR/jaar aan dekking van algemene vaste OH. Houden,
      tenzij vrijgekomen CNC-capaciteit door derde, méér winstgevende productlijn
      kan worden ingevuld (opportunity cost). Beslissing-relevante kost ≠ ABC-allocatie.


analytische_balans:
  titel: "Analytische balans Belova NV — herrangschikt N (duizend EUR)"
  toelichting: >
    Klassieke herwerking voor financiële analyse: activa van weinig naar zeer
    liquide, passiva van weinig naar sterk eisbaar.
  actief:
    - {groep: "Vaste activa (lang gebonden)", bedrag: 2550, aandeel: "30,4 %"}
    - {groep: "Voorraden (cyclisch, traag liquide)", bedrag: 2100, aandeel: "25,0 %"}
    - {groep: "Handelsvorderingen + overige + overlopende (cyclisch)", bedrag: 2020, aandeel: "24,0 %"}
    - {groep: "Geldbeleggingen + liquide middelen (thesaurie)", bedrag: 1730, aandeel: "20,6 %"}
    - {groep: "TOTAAL", bedrag: 8400, aandeel: "100,0 %"}
  passief:
    - {groep: "Eigen vermogen", bedrag: 2790, aandeel: "33,2 %"}
    - {groep: "Voorzieningen (semi-permanent)", bedrag: 110, aandeel: "1,3 %"}
    - {groep: "Schulden > 1 jaar", bedrag: 2450, aandeel: "29,2 %"}
    - {groep: "Permanent vermogen subtotaal", bedrag: 5350, aandeel: "63,7 %"}
    - {groep: "Schulden ≤ 1 jaar exploitatie (44+45+46+47/48+overlopende passief)", bedrag: 2300, aandeel: "27,4 %"}
    - {groep: "Financiële schulden ≤ 1 jaar (42+43)", bedrag: 750, aandeel: "8,9 %"}
    - {groep: "TOTAAL", bedrag: 8400, aandeel: "100,0 %"}

# ===========================================================================
# 8 — FUNCTIONELE BALANS (NBK · BBK · NT, met uitwerking)
# ===========================================================================

functionele_balans:
  titel: "Functionele balansanalyse Belova NV (duizend EUR)"

  drieluik_n:
    nbk:
      label: "Netto-bedrijfskapitaal (NBK)"
      formule_lang: "Permanent vermogen − Vaste activa"
      formule_kort: "EV (2.790) + Voorzieningen (110) + Schulden >1j (2.450) − Vaste activa (2.550)"
      bedrag: 2800
      controle: "Vlottende activa 5.850 − Schulden ≤1j 3.050 = 2.800 ✓"
    bbk:
      label: "Behoefte aan bedrijfskapitaal (BBK)"
      formule_lang: "Exploitatie-vlottende activa − Exploitatie-schulden ≤ 1 jaar"
      formule_kort: "(Voorr. 2.100 + Hd-vord. 1.850 + Ov-vord. 95 + Overl. act. 75) − (Hd-sch. 1.520 + Fisc/soc. 380 + Voorbet. 25 + Ov-sch. 145 + Overl. pass. 230)"
      bedrag: 1820
      controle: "Excl. thesaurie (50/53, 54/58) en excl. financiële schulden (42, 43)"
    nt:
      label: "Nettothesaurie (NT)"
      formule_lang: "NBK − BBK"
      formule_kort: "2.800 − 1.820"
      bedrag: 980
      controle: "Cash equivalents (250 + 1.480) − Fin schulden ≤1j (400 + 350) = 980 ✓"
      interpretatie: "Positief — exploitatiecyclus volledig gefinancierd door permanente middelen + cash-overschot"

  evolutie_3_jaar:
    titel: "Functionele balans over 3 jaar"
    kolommen: ["Component", "N (2026)", "N-1 (2025)", "N-2 (2024)", "Trend"]
    rijen:
      - ["NBK", 2800, 2535, 2335, "↑ stijgend"]
      - ["BBK", 1820, 1395, 1180, "↑↑ sterk stijgend (signaal)"]
      - ["NT (= NBK − BBK)", 980, 1140, 1155, "↓ dalend (signaal)"]

# ===========================================================================
# 9 — RATIO-TABEL (4 families × 3 jaar)
# ===========================================================================

ratios:
  titel: "Ratio-overzicht Belova NV — 3 boekjaren + sector-benchmark"
  toelichting: >
    Berekend op de cijfers in deze YAML. Sector-benchmark = mediaan NACE 46.470
    groothandel meubilair uit NBB-balanscentrale (fictief representatief).

  liquiditeit:
    titel: "Liquiditeit"
    rijen:
      - label: "Current ratio (vlottende activa / schulden ≤1j)"
        formule: "(2.100+1.945+250+1.480+75) / (2.820+230) = 5.850 / 3.050"
        n: "1,92"
        n_min_1: "2,00"
        n_min_2: "2,17"
        sector: "1,75"
        oordeel: "✅ Comfortabel, daling maar nog ruim boven sector"

        n_min_2: "18,37 %"
        sector: "10,50 %"
        oordeel: "🔴 Sterk gedaald — vernietigt waarde t.o.v. opportunity cost"
      - label: "ROA (bedrijfsresultaat / totaal activa)"
        formule: "307 / 8.400"
        n: "3,65 %"

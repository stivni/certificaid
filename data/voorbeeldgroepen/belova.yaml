# Belova NV — voorbeeldgroep voor PO 1.3 jaarrekeninganalyse-leerstukken
#
# Mock Belgische NV, groothandel meubilair, grote vennootschap (volledig schema).
# Cijfers zijn fictief maar intern consistent (Σ activa = Σ passiva, ratio's
# berekend, trend-evolutie plausibel).
#
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-is-jaarrekeninganalyse.yaml
#   - data/leerstukken/jaarrekening-herwerken-en-functionele-balans.yaml
#   - data/leerstukken/ratios-en-kengetallen.yaml
#   - data/leerstukken/kasstroom-en-financieringstabel.yaml
#   - data/leerstukken/kritische-beoordeling-en-diagnose.yaml
#
# Eenheid: EUR (geen duizendtallen-aankondiging in titel — staat in voetnoten waar nodig)

naam: belova
beschrijving: >
  Belova NV is een mock Belgische groothandel in meubilair (NACE 46.470).
  Grote vennootschap (>50 vte, >9 mln EUR omzet) — verplicht volledig schema.
  De cijfers tonen een KMO met comfortabele cash-positie maar dalende rentabiliteit,
  stijgende DSO en covenant-spanning in jaar N. Gebruikt om alle vier ratio-families,
  functionele balansanalyse, kasstroomopbouw, DuPont, hefboomanalyse en going-concern-
  diagnose binnen één coherente case te illustreren.

balansdatum: "31-12-2026"
boekjaar: "2026"
sector_nace: "46.470 — Groothandel in meubelen, vloerbedekking en verlichting"

# Bewuste echo: Meridia (1.8 analytische boekhouding) is ook meubel — student
# herkent de sector, maar Belova is een groothandel (Meridia was producent).

# ===========================================================================
# 1 — BEDRIJFSPROFIEL (voor entry-leerstuk + diagnose)
# ===========================================================================

profiel:
  rechtsvorm: NV
  oprichting: "2002"
  zetel: "Antwerpen"
  vte_eind_n: 62
  vte_eind_n_min_1: 58
  vte_eind_n_min_2: 54
  commissaris: "Bedrijfsrevisor X (lid IBR) — benoemd 2024, mandaat 3 jaar"
  bankrelatie: >
    Hoofdbank BNP Paribas Fortis. Banklening 2.000.000 EUR (looptijd 7 jaar, vast 3,2 %)
    + investeringsleasing materieel 450.000 EUR. Covenanten: schuldgraad max 70 %,
    interest coverage min 4×. In jaar N is interest coverage gezakt naar 2,7× —
    bank heeft waiver gevraagd; nog niet formeel verstrekt op balansdatum.

# ===========================================================================
# 2 — GROEPSSTRUCTUUR (informatief; geen consolidatie in deze PO)
# ===========================================================================

groepsstructuur:
  moeder:
    naam: "Belova NV"
    rechtsvorm: NV
  deelnemingen:
    - naam: "Bertin BV"
      rechtsvorm: BV
      percentage: 100
      rol_in_case: >
        Zuster-importvennootschap (klein). Niet relevant voor PO 1.3 — alleen genoemd
        om de financiële vaste activa-rubriek (28) te verklaren.

mermaid_diagrammen:

  bedrijfsprofiel:
    type: flowchart-lr
    code: |
      A[Aankoop Italiaanse + Aziatische<br/>meubelen] --> B[Centraal magazijn<br/>Antwerpen]
      B --> C[Verkoop aan<br/>winkelketens + interieurzaken]
      C --> D[Klant betaalt 30-60 d]
      B -.->|voorraad-rotatie ~74 d| C

  diagnose-werkstroom:
    type: flowchart-td
    code: |
      JR[Jaarrekening + toelichting<br/>+ bestuursverslag] --> H[Stap 1: Herwerken<br/>analytische + functionele balans]
      H --> R[Stap 2: Ratio's<br/>4 families + DuPont]
      R --> K[Stap 3: Kasstroom-<br/>opbouw indirect]
      K --> D[Stap 4: Diagnose<br/>sterktes + zwaktes + alarmsignalen]
      D --> A[Stap 5: Aanbevelingen<br/>aan bestuur]
      SB[Sector-benchmark<br/>NBB-balanscentrale] -.-> R
      SB -.-> D

  functionele-balans:
    type: flowchart-lr
    code: |
      PM[Permanent vermogen<br/>EV + LT-schulden + voorzieningen<br/>5.350.000] --> VA[Vaste activa<br/>2.550.000]
      PM --> NBK[Netto-bedrijfskapitaal<br/>NBK = 2.800.000]
      NBK --> BBK[Behoefte aan bedrijfskapitaal<br/>BBK = 1.820.000<br/>exploitatie-cyclus]
      NBK --> NT[Nettothesaurie<br/>NT = 980.000<br/>cash-overschot]

  dupont-decompositie:
    type: flowchart-lr
    code: |
      ROE[ROE = 4,41 %] --> NM[Nettomarge<br/>0,87 %]
      ROE --> AT[Asset turnover<br/>1,69×]
      ROE --> EM[Equity multiplier<br/>3,01]
      NM --> RES[Resultaat / Omzet]
      AT --> OMZ[Omzet / Totaal activa]
      EM --> LEV[Totaal activa / EV]


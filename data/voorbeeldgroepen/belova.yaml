        n: "2,16 %"
        n_min_1: "3,81 %"
        n_min_2: "5,27 %"
        sector: "4,20 %"
        oordeel: "🔴 Onder sector + sterke daling"
      - label: "Commerciële brutomarge ((omzet − rubriek 60) / omzet)"
        formule: "(14.200 − 10.300) / 14.200"
        n: "27,46 %"
        n_min_1: "28,81 %"
        n_min_2: "30,08 %"
        sector: "30,00 %"
        oordeel: "🔴 Margedruk — prijsdruk meubelsector"

        n: "0,57"
        n_min_1: "0,73"
        n_min_2: "0,74"
        sector: "0,30"
        oordeel: "✅ Hoge cash-buffer (sector 0,30)"

  solvabiliteit:
    titel: "Solvabiliteit"
    rijen:
      - label: "Solvabiliteitsratio (EV / totaal passief)"
        formule: "2.790 / 8.400"
        n: "33,2 %"
        n_min_1: "33,9 %"
        n_min_2: "33,7 %"
        sector: "35,0 %"
        oordeel: "🟡 Stabiel maar onder sector"
      - label: "Schuldgraad (vreemd vermogen / totaal)"
        formule: "(110+2.450+2.820+230) / 8.400 = 5.610 / 8.400"
        n: "66,8 %"
        n_min_1: "66,1 %"
        n_min_2: "66,3 %"
        sector: "65,0 %"
        oordeel: "🟡 Net boven sector"
      - label: "Debt-to-equity"
        formule: "5.610 / 2.790"
        n: "2,01"
        n_min_1: "1,95"
        n_min_2: "1,97"
        sector: "1,86"
        oordeel: "🟡 Hefboom-aandeel licht gestegen"
      - label: "Interest coverage (EBIT / kosten van schulden)"
        formule: "307 / 92"
        n: "3,34"
        n_min_1: "6,60"
        n_min_2: "9,36"
        sector: "5,50"
        oordeel: "🔴 Sterk gedaald — onder covenant-drempel van 4×"

  rentabiliteit:
    titel: "Rentabiliteit"
    rijen:
      - label: "Brutoverkoopmarge (bedrijfsresultaat / omzet) — NBB-definitie"

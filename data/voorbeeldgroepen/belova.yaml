# ===========================================================================
# 5 — TOELICHTING (key-items voor analyse)
# ===========================================================================

toelichting:

  waarderingsregels:
    titel: "Waarderingsregels (samenvatting uit toelichting)"
    items:
      - "Materiële vaste activa: aanschaffingswaarde, lineaire afschrijving — gebouwen 30 jaar, machines 7 jaar, transportmaterieel 5 jaar."
      - "Voorraden: FIFO; waardevermindering wanneer marktwaarde < boekwaarde (toegepast in N voor 15)."
      - "Handelsvorderingen: nominaal; waardevermindering bij twijfel — 'gespecificeerde lijst' methode."
      - "Voorzieningen voor risico's en kosten: hoofdzakelijk hangende geschillen en garantieverplichtingen."
      - "Geen herwaarderingen toegepast."

  vervallen_schulden_en_fiscale_situatie:
    titel: "Vervallen schulden en fiscale situatie (toelichting Staat C)"
    items:
      - "Geen achterstallige RSZ-, btw- of vennootschapsbelastingschulden op 31/12/N."
      - "Lopende fiscale controle inkomstenbelasting N-2 + N-1: status open, geen materiële correctie verwacht (volgens management)."

  verstrekte_waarborgen_en_off_balance:
    titel: "Verstrekte waarborgen en niet in de balans opgenomen rechten/verplichtingen"
    items:
      - "Hypotheek op gebouw t.v.v. BNP Paribas Fortis: gevestigd voor 2.500.000 EUR (waarvan 1.640.000 EUR effectief opgenomen — saldo banklening)."
      - "Pand op handelsfonds t.v.v. BNP Paribas Fortis: 800.000 EUR (voor kredietlijn 500.000 EUR)."
      - "Operationele leasing voor 4 bedrijfsvoertuigen + magazijntechniek: jaarlijkse last 95.000 EUR; resterende verbintenis 285.000 EUR."
      - "Persoonlijke borg van twee bestuurders voor het kaskrediet (350.000 EUR) — geconfirmeerd in toelichting."

  bestuursverslag_signalen:
    titel: "Signalen uit het bestuursverslag (art. 3:32 WVV)"
    items:
      - "Bestuur erkent: omzet is gegroeid maar prijsdruk in de meubelsector heeft de brutomarge onder druk gezet (-2,5 pp tov N-2)."
      - "Werkkapitaal is gestegen door langere voorraadrotatie (nieuwe Aziatische leverancier met langere lead-times) en stijgende klantenkrediet-termijnen."
      - "Bank heeft waiver gevraagd op interest-coverage-covenant; gesprekken lopen."
      - "Plannen voor N+1: prijsverhoging 3 %, voorraadafbouw, hardere debiteurenopvolging — projectie EBITDA-marge terug naar 5 %."


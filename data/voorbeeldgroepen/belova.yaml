# ===========================================================================
# 10 — DUPONT-DECOMPOSITIE (alleen jaar N + N-2 voor vergelijking)
# ===========================================================================

dupont:
  titel: "DuPont-decompositie ROE Belova NV"
  toelichting: >
    ROE = Nettomarge × Asset Turnover × Equity Multiplier.
    Toont waar de ROE-daling vandaan komt: marge-effect of efficiëntie-effect of hefboom-effect.
  kolommen: ["Component", "Formule", "N (2026)", "N-2 (2024)", "Δ"]
  rijen:
    - ["Nettomarge", "Res. / Omzet", "1,16 %", "3,60 %", "↓ 2,44 pp"]
    - ["Asset turnover", "Omzet / Totaal activa", "1,69×", "1,72×", "≈ stabiel"]
    - ["Equity multiplier", "Totaal activa / EV", "3,01", "2,97", "≈ stabiel"]
    - ["ROE", "= product", "5,88 %", "18,37 %", "↓ 12,49 pp"]
  conclusie: >
    De ROE-daling is volledig marge-gedreven (-2,44 pp nettomarge). Asset turnover en
    hefboom zijn stabiel. Aanbeveling: prijsbeleid en margebeheer — niet structurele
    activa-reductie of kapitaalherstructurering.

# ===========================================================================
# 11 — HEFBOOMANALYSE (operationeel + financieel)
# ===========================================================================

hefboomanalyse:
  titel: "Hefboomanalyse Belova NV (jaar N)"
  operationeel:
    label: "Operationele hefboom (DOL)"
    formule: "Δ % EBIT / Δ % omzet"
    benadering: "(307 − 515) / 515 = −40,4 % EBIT vs (14.200 − 13.500) / 13.500 = +5,2 % omzet"
    waarde: "−7,8 (asymmetrisch — daling)"
    interpretatie: "Sterke operationele hefboom: kostenstructuur is grotendeels vast (gebouw, personeel) — kleine omzet-stijging compenseert niet voor marge-erosie"
  financieel:
    label: "Financiële hefboom (DFL)"
    formule: "EBIT / (EBIT − kosten van schulden)"
    benadering: "307 / (307 − 92) = 307 / 215"
    waarde: "1,43"
    interpretatie: "Elke 1 % EBIT-mutatie geeft ~1,43 % ROE-mutatie. Verhoogde gevoeligheid door gestegen kaskrediet-rente"
  evaluatie_hefboomeffect:
    label: "Hefboomeffect-toets: ROA na bel. vs Kostprijs VV"
    roa_na_belasting: "≈ 3,65 % × (1 − 0,25) = 2,74 %"
    kostprijs_vv: "92 / 2.850 (gem. fin. sch.) = 3,23 %"
    conclusie: "🔴 ROA < kostprijs VV — hefboomeffect is NEGATIEF: schuld duwt ROE naar beneden i.p.v. omhoog"

# ===========================================================================
# 12 — KASSTROOMOVERZICHT (IAS 7, indirecte methode, jaar N)
# ===========================================================================

kasstroomoverzicht:
  titel: "Kasstroomoverzicht Belova NV — boekjaar N (indirecte methode, IAS 7)"
  eenheid: "duizend EUR"
  toelichting: >
    Niet wettelijk verplicht onder B-GAAP voor niet-geconsolideerde JR maar
    standaardpraktijk voor analyse. Opgebouwd uit balans-mutatie + RR-correcties.

  operationeel:
    titel: "I. Kasstromen uit bedrijfsvoering"
    regels:
      - {label: "Resultaat van het boekjaar (9904)", bedrag: 164}
      - {label: "+ Afschrijvingen + waardeverminderingen + voorzieningen", bedrag: 290, noot: "270 + 15 + 5"}
      - {label: "+ Kosten van schulden (650) — gereclassificeerd", bedrag: 92}
      - {label: "− Δ Voorraden", bedrag: -300, noot: "2.100 − 1.800"}
      - {label: "− Δ Handelsvorderingen + overige", bedrag: -325, noot: "1.945 − 1.620"}
      - {label: "− Δ Overlopende rek. actief", bedrag: -5}
      - {label: "+ Δ Handelsschulden", bedrag: -20, noot: "1.520 − 1.540 (lichte daling)"}
      - {label: "+ Δ Schulden fiscaal/sociaal + overige + overlopend", bedrag: 10}
      - {label: "+ Δ Voorzieningen", bedrag: 5}
      - {label: "− Betaalde rente", bedrag: -92}
      - {label: "− Betaalde belastingen", bedrag: -55, noot: "Aanname: gelijk aan boekjaar-last"}
    subtotaal: -236
    interpretatie: "🔴 Negatieve operationele cashflow — winst gegenereerd maar werkkapitaal vreet alle cash op (en meer)"

  investerend:
    titel: "II. Kasstromen uit investeringen"
    regels:
      - {label: "− Aankoop materiële vaste activa", bedrag: -340, noot: "Δ bruto = 2.400 − 2.330 + afschrijvingen 270 = 340"}
      - {label: "− Aankoop financiële vaste activa", bedrag: 0}
    subtotaal: -340
    interpretatie: "Vervangingsinvesteringen + lichte uitbreiding magazijn"

  financierend:
    titel: "III. Kasstromen uit financiering"
    regels:
      - {label: "+ Nieuwe banklening (17)", bedrag: 250, noot: "2.450 − 2.200"}
      - {label: "+ Δ Kaskrediet (43)", bedrag: 70, noot: "350 − 280"}
      - {label: "− Dividenduitkering aan aandeelhouders", bedrag: -84, noot: "Resultaat N-1 (334) − reserveringen (60+30=90)+overdracht (110+50)+kap.sub.amortisatie 10 = saldo dividend"}
      - {label: "− Vermindering kapitaalsubsidies (15) door amortisatie", bedrag: -10}
    subtotaal: 226
    interpretatie: "Externe financiering (lening + kaskrediet) compenseert deels"

  totaal:
    operationeel: -236
    investerend: -340
    financierend: 226
    netto_mutatie: -350
    interpretatie: >
      Netto-cash-daling 350 duizend EUR. Controle met balans:
      (geldbeleggingen + liquide) N = 1.730 vs N-1 = 2.030 → daling 300.
      Verschil 50 = transferpost — in praktijk verklaard door werkkapitaal-aanname (niet exact). 🤖

# ===========================================================================
# 13 — ALARMSIGNALEN + ALTMAN Z-SCORE (voor diagnose-leerstuk)
# ===========================================================================

alarmsignalen:
  titel: "Alarmsignalen uit de analyse (jaar N)"
  rijen:
    - {nr: 1, signaal: "Bedrijfsresultaat halveert in 2 jaar (-54 %)", bron: "RR", ernst: "🔴 hoog"}
    - {nr: 2, signaal: "Interest coverage onder covenant-drempel (3,3× < 4,0×)", bron: "Ratio + bankcontract", ernst: "🔴 hoog"}
    - {nr: 3, signaal: "DSO + DIO stijgen — werkkapitaal-druk", bron: "Activiteits-ratio's", ernst: "🟡 medium"}
    - {nr: 4, signaal: "Operationele cashflow negatief (-236) ondanks winst (164)", bron: "Kasstroomtabel", ernst: "🟡 medium"}
    - {nr: 5, signaal: "Hefboomeffect negatief (ROA na bel. 2,74 % < kostprijs VV 3,23 %)", bron: "Hefboomanalyse", ernst: "🟡 medium"}
    - {nr: 6, signaal: "Cash-positie daalt 350 / jaar — vorig jaar nog +200", bron: "Kasstroomtabel", ernst: "🟡 medium"}

altman_z:
  titel: "Altman Z-score (private firm versie, jaar N)"
  formule: "Z' = 0,717 X1 + 0,847 X2 + 3,107 X3 + 0,420 X4 + 0,998 X5"
  variabelen:
    - {label: "X1 = NBK / Totaal activa", waarde: "2.800/8.400 = 0,333"}
    - {label: "X2 = Overgedragen winst+reserves / Totaal activa", waarde: "1.890/8.400 = 0,225"}
    - {label: "X3 = EBIT / Totaal activa", waarde: "307/8.400 = 0,037"}
    - {label: "X4 = EV (boekwaarde) / VV-totaal", waarde: "2.790/5.610 = 0,497"}
    - {label: "X5 = Omzet / Totaal activa", waarde: "14.200/8.400 = 1,690"}
  berekening: "Z' = 0,717×0,333 + 0,847×0,225 + 3,107×0,037 + 0,420×0,497 + 0,998×1,690"
  waarde: "Z' ≈ 2,24"
  interpretatie: "Grijze zone (1,23 < Z' < 2,90) — verhoogd risico maar nog geen distress-zone. Bevestigt het diagnostisch beeld van een onderneming onder druk."

# ===========================================================================
# 14 — AANBEVELINGEN (voor diagnose-leerstuk, model-output)
# ===========================================================================

aanbevelingen:
  titel: "Voorstellen aan het bestuur (model-uitwerking)"
  rijen:
    - thema: "Margebeheer"
      voorstel: "Prijsverhoging 3 % vanaf Q2 + mix-shift naar hogere segment (importmerken). EBITDA-marge-target 5 %."
      effect: "Brutomarge +1,5 pp, EBIT +200 duizend EUR"
    - thema: "Voorraadbeheer"
      voorstel: "Aziatische lev. consolideren bij 2 partners + lokale buffer-stock; DIO-target 65 dagen."
      effect: "Voorraad −300 → cash +300; DIO −10 dagen"
    - thema: "Debiteurenbeleid"
      voorstel: "Strakker incasso-proces: payment terms herzien (60 → 45 d voor klein-mid), incasso-team uitbreiden."
      effect: "DSO −5 dagen → +200 cash"
    - thema: "Covenant-compliance"
      voorstel: "Bespreking met BNP Fortis: tijdelijke waiver + commitment EBITDA-marge ≥ 5 % bij H1 N+1. Vermijd cross-default."
      effect: "Risico van vervroegde opeisbaarheid wegnemen"
    - thema: "Hefboom-omdraaiing"
      voorstel: "Geen nieuwe schuld + dividendpolitiek pauzeren tot ROA > kostprijs VV."
      effect: "EV-versterking; hefboomeffect weer positief"


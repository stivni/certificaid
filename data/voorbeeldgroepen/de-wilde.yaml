# ---------------------------------------------------------------------------
# Scenario's — verrichtingen die per leerstuk worden uitgewerkt
# ---------------------------------------------------------------------------

scenarios:

  - id: verkoop-studio-brussel
    leerstuk: registratierechten-vastgoed
    titel: "Filip + Lieve verkopen studio Brussel"
    feiten: >
      Filip + Lieve beslissen in maart 2026 om de studio Brussel (gemeenschappelijk
      goed, huidige waarde €220.000) te verkopen aan een derde voor €240.000.
      De koper is een 28-jarige werknemer die er zijn hoofdverblijfplaats zal vestigen.
    didactische_punten:
      - "Verkooprecht Brussels Hoofdstedelijk Gewest: 12,50 % (art. 44 W.Reg. Brussel)"
      - "Grondslag = overeengekomen prijs (€240.000), met als minimum de verkoopwaarde van het overgedragen goed (art. 45-46 W.Reg.)"
      - "Koper kan abattement eigen woning vragen (art. 46bis W.Reg. Brussel): vermindering grondslag met €200.000 — voorwaarden: natuurlijke persoon, geheelheid in volle eigendom, hoofdverblijfplaats binnen 3 jaar, behouden ≥ 5 jaar"
      - "Verkoper geen registratierecht verschuldigd; verkooprecht is altijd door koper"
    berekening_voorbeeld:
      grondslag: 240000
      verkooprecht_basis_brussel: "12,50 % × 240.000 = €30.000"
      met_abattement: "12,50 % × (240.000 − 200.000) = €5.000"
      besparing: 25000

  - id: aankoop-appartement-sofie
    leerstuk: registratierechten-vastgoed
    titel: "Sofie + Tom kopen appartement Gent als hoofdverblijfplaats"
    feiten: >
      Sofie + Tom kopen in juni 2026 een appartement Gent voor €380.000, dat dient
      als hun hoofdverblijfplaats. Geen eerder onroerend goed in volle eigendom in
      bezit.
    didactische_punten:
      - "Verkooprecht Vlaams gewest: standaardtarief 12 % (art. 2.9.4.1.1 VCF) — vanaf 1.1.2022"
      - "Verlaagd tarief 2 % voor enige eigen woning (art. 2.9.4.2.11 VCF, sinds decreet 23.12.2022) — voorwaarden: enige + eigen + hoofdverblijfplaats binnen 3 jaar"
      - "Verlaagd tarief naar 1 % bij ingrijpende energetische renovatie of monumentale waarde"
      - "Voorwaarden zijn cumulatief en moeten in de akte vermeld worden"
    berekening_voorbeeld:
      grondslag: 380000
      verkooprecht_basis: "12 % × 380.000 = €45.600"
      verkooprecht_verlaagd_2pct: "2 % × 380.000 = €7.600"
      besparing: 38000

  - id: verdeling-vakantieverblijf-broer
    leerstuk: registratierechten-vastgoed
    titel: "Mini-case: Filip + broer in onverdeeldheid sinds 2010 — broer koopt Filip uit"
    feiten: >
      Bij het overlijden van Filip's vader (2010) erfde Filip samen met zijn broer
      het vakantieverblijf in Knokke voor onverdeelde helft elk. In 2016 hebben ze
      onderling beslist dat Filip de helft van zijn broer overnam tegen €280.000
      (massa op dat ogenblik €560.000). Sindsdien is het verblijf 100 % Filip.
    didactische_punten:
      - "Bij uittreding van mede-eigenaars uit een onverdeeldheid: verdeelrecht (art. 109 W.Reg. = 1 % federaal/Brussel; art. 2.10.1.0.1 VCF = 2,5 % Vlaams)"
      - "Grondslag = volledige verkoopwaarde van het onverdeelde goed (massa), niet enkel het overgenomen aandeel"
      - "Zou Filip aan een derde verkocht hebben → verkooprecht (12 % VCF / 12,50 % W.Reg. Brussel) op het overgedragen aandeel — veel duurder"
    berekening_voorbeeld:
      grondslag_verdeelrecht: 560000
      verdeelrecht_vlaanderen: "2,5 % × 560.000 = €14.000"
      alternatief_verkooprecht_op_helft: "12 % × 280.000 = €33.600 (en geen abattement want geen hoofdverblijf)"

  - id: compromis-met-sterkmaking
    leerstuk: registratieformaliteit-en-procedure
    titel: "De Wilde Bouw NV wil aanpalend terrein kopen — compromis met aanwijzing van lastgever"
    feiten: >
      De Wilde Bouw NV wil het aanpalende braakliggend terrein kopen voor uitbreiding
      van haar werkplaats. Om de eigenaar (die De Wilde Bouw kent als groei-onderneming)
      geen prijsverhoging te laten doorvoeren, vraagt Filip zijn neef Joris (geen band
      met de NV) een onderhandse koopovereenkomst (compromis) af te sluiten op 5 april
      2026 met de clausule "voor zichzelf of een later aan te wijzen persoon" — prijs
      €320.000.
    didactische_punten:
      - "Aanwijzing van lastgever (akte van command, déclaration de command) — art. 158, 1° W.Reg. (federaal) / art. 2.9.6.0.1 VCF (Vlaanderen)"
      - "Drie cumulatieve voorwaarden: (a) voorbehoud in compromis, (b) authentieke akte van aanwijzing, (c) registratie/betekening uiterlijk de eerste werkdag na compromis"
      - "Als voorwaarden vervuld: aanwijzingsakte = vast recht (€50); verkoopakte aan De Wilde Bouw NV = evenredig verkooprecht éénmaal"
      - "Als één voorwaarde gemist: aanwijzing = wederverkoop → tweemaal verkooprecht (compromis Joris + akte De Wilde Bouw NV)"
      - "Klassiek timing-probleem: compromis op vrijdag → enkel maandag om authentieke akte te verlijden + aan te bieden"
    berekening_voorbeeld:
      grondslag: 320000
      verkooprecht_vlaanderen: "12 % × 320.000 = €38.400"
      met_command_voorwaarden_vervuld: "€38.400 verkooprecht éénmaal + €50 vast recht aanwijzing"
      bij_gemiste_voorwaarde: "€38.400 × 2 = €76.800 (tweemaal heffing)"

  - id: schenking-aandelen-familiebedrijf
    leerstuk: successieplanning-en-gunstregime
    titel: "Filip overweegt schenking 30 % aandelen De Wilde Bouw aan Stef (continuïteit)"
    feiten: >
      Filip overweegt 30 % van zijn aandelen (van zijn 60 %) De Wilde Bouw NV aan
      zoon Stef te schenken — Stef werkt al 5 jaar in het bedrijf en zou samen met
      Sofie de operationele leiding overnemen. Schenking gebeurt notarieel in 2026.
    didactische_punten:
      - "Schenking van aandelen van een familiale vennootschap: gunstregime art. 2.8.6.0.3 VCF (Vlaanderen) — 0 % schenkbelasting indien voorwaarden vervuld"
      - "Voorwaarden bij schenking: (1) familiale vennootschap met reële economische activiteit, (2) ≥ 50 % aandelen bij schenker + familie, (3) continuïteit + participatie 3 jaar nadien behouden"
      - "Voorwaarden bij erfopvolging (i.p.v. schenking): verlaagd tarief erfbelasting (3 % rechte lijn / 7 % derden, art. 2.7.4.2.2 VCF) i.p.v. progressieve tarieven (3-27 %)"
      - "Schenking met voorbehoud van vruchtgebruik: Filip behoudt dividenden + stemrecht; Stef wordt blote eigenaar"
      - "Fictiebepaling art. 2.7.1.0.5 VCF: schenking < 3 jaar vóór overlijden zonder registratie → toch erfbelasting. Notariële schenking met registratie ontsnapt aan fictie (al geregistreerd)."
    berekening_voorbeeld:
      grondslag_schenking: 450000  # 30 % van €1.500.000
      schenkbelasting_zonder_gunstregime: "Aandelen = ROEREND → vlak tarief 3 % rechte lijn Vlaanderen (art. 2.8.4.1.1 § 2 VCF): 3 % × €450.000 = €13.500"
      schenkbelasting_gunstregime: "0 % × 450.000 = €0 (art. 2.8.6.0.3 VCF — voorwaarden vervuld)"
      besparing: 13500
      pedagogische_noot: >
        Klassieke valstrik: niet de progressieve onroerende schalen (3-9-18-27 %) toepassen op aandelen.
        Aandelen vallen onder roerend vlak tarief 3 % rechte lijn / 7 % anderen. Daarom is het gunstregime
        vooral waardevol bij ERFOPVOLGING (3 % rechte lijn vs progressief 3-27 % over hele nalatenschap)
        en bij GROTE familiebedrijven, niet zozeer bij kleine roerende schenkingen.

  - id: filip-overlijdt-hypothetisch
    leerstuk: erfbelasting-en-aangifte-nalatenschap
    titel: "Hypothetisch overlijdens-scenario Filip — aangifte van nalatenschap"
    feiten: >
      Filip overlijdt onverwacht op 15 mei 2026 in België (Vlaams gewest, woonplaats
      Antwerpen). Geen testament — wettelijke devolutie speelt. Hervormd erfrecht 2018
      van toepassing. Op het ogenblik van overlijden: aandelen-schenking aan Sofie 2018
      (registratie Vlaanderen, 8 jaar oud — buiten 3-jaar-fictie); GEEN schenking aan
      Stef gerealiseerd.
    didactische_punten:
      - "Bevoegd gewest = gewest van fiscale woonplaats erflater (Vlaams) — geen rol voor plaats van overlijden of ligging onroerend goed (art. 5/1 VCF)"
      - "Aangifteplichtigen (art. 3.3.1.0.5 VCF): erfgenamen + algemene legatarissen + algemene begiftigden — Lieve + Sofie + Stef hier (legaten N/A, geen testament)"
      - "Termijn aangifte = 4 maanden vanaf overlijden (in Rijk) — uiterlijk 15 september 2026 (art. 3.3.1.0.6 VCF)"
      - "Termijn betaling = 2 maanden na verstrijken aangiftetermijn — uiterlijk 15 november 2026 (art. 3.10.4.4.1 VCF)"
      - "Devolutie hervormd erfrecht 2018: overlevende echtgenoot krijgt vruchtgebruik volledige nalatenschap; afstammelingen krijgen blote eigendom (art. 4.50 BW)"
      - "Fictiebepaling levensverzekering art. 2.7.1.0.6 VCF: uitkering Tak 23 aan Lieve wordt als legaat beschouwd voor erfbelasting (premies uit gemeenschap → 50 % belastbaar)"
      - "Helft van het gemeenschapsvermogen valt in de nalatenschap (huwelijksstelsel = wettelijk); andere helft = eigen vermogen Lieve, niet belastbaar"
    aangifte_uitgewerkt:
      bruto_nalatenschap_filip:
        eigen_goederen:
          - omschrijving: "Tweede verblijf Knokke (eigen goed Filip via erfenis 2010)"
            waarde: 350000
          - omschrijving: "20 % aandelen De Wilde Bouw NV (eigen goed Filip via erfenis 2010 — schatting 20 % × €1.500.000)"
            waarde: 300000
        helft_gemeenschap_filip:
          - omschrijving: "Helft gezinswoning Antwerpen"
            waarde: 225000
          - omschrijving: "Helft studio Brussel (NB: wordt 2026 verkocht — verkoop niet meer gerealiseerd op overlijdens-datum)"
            waarde: 110000
          - omschrijving: "Helft beleggingsportefeuille"
            waarde: 250000
          - omschrijving: "Helft zichtrekeningen"
            waarde: 20000
          - omschrijving: "Helft aandelen Filip oorspronkelijk 40 % gemeenschappelijk — gehalveerd = 20 %"
            waarde: 300000
        fictie_levensverzekering:
          - omschrijving: "Tak 23 Filip → Lieve begunstigde — premies uit gemeenschap, 50 % belastbaar art. 2.7.1.0.6 VCF"
            waarde_volledige_reserve: 180000
            belastbaar_aandeel: 90000
            classificatie: "Fictie-legaat aan Lieve"
        bruto_totaal: 1645000  # 350+300+225+110+250+20+300+90
      aannemelijk_passief:
        - post: "Begrafeniskosten + repatriëring + plechtigheid"
          bedrag: 9500
          status: "AANGENOMEN (art. 2.7.3.4.1 VCF — begrafeniskosten zonder plafond)"
        - post: "Openstaande facturen (gas, water, energie, dagelijks beheer) gefactureerd vóór overlijden, betaald nadien"
          bedrag: 1800
          status: "AANGENOMEN (art. 2.7.3.4.1 VCF — schuld bestaand op de dag van overlijden)"
        - post: "Ereloon advocaat voor opmaak aangifte van nalatenschap"
          bedrag: 3500
          status: "NIET AANGENOMEN — schuld ontstaan ná overlijden, geen begrafeniskost"
        - post: "Lening van zoon Stef in 2024 voor renovatie tweede verblijf Knokke (schuldbekentenis, gebruikt voor verbetering goed in nalatenschap)"
          bedrag: 25000
          status: "AANGENOMEN op grond van art. 33, 2° W.Succ./art. 2.7.3.4.1 VCF — uitzondering: lening bij erfgenaam met bestemming verbetering van nalatenschapsgoed"
        - post: "Stookolie geleverd na overlijden (juli 2026)"
          bedrag: 1200
          status: "NIET AANGENOMEN — schuld ontstaan ná overlijden, geen schuld erflater"
      passief_aannemelijk_totaal: 36300  # 9500 + 1800 + 25000
      netto_nalatenschap: 1608700  # bruto 1.645.000 − passief 36.300
      verdeling_devolutie:
        scenario: "Geen testament — wettelijke devolutie + hervormd erfrecht 2018"
        overlevende_echtgenoot_lieve: "Vruchtgebruik op volledige netto-nalatenschap + 50 % volle eigendom op de gemeenschapshelft van Filip's deel = juridisch gemengd, voor de erfbelasting omgezet"
        afstammelingen: "Sofie + Stef — blote eigendom op de volledige netto-nalatenschap, in gelijke delen"
      tarief_toegepast:
        lieve_overlevende_echtgenoot: "Volle eigendom gezinswoning (Vlaanderen): 0 % erfbelasting (vrijstelling overlevende echtgenoot gezinswoning, art. 2.7.6.0.3 VCF). Vruchtgebruik op rest: tarief rechte lijn 3-27 % progressief over gekapitaliseerd vruchtgebruik."
        sofie_stef: "Tarief rechte lijn (art. 2.7.4.1.1 VCF) over blote eigendom: 3 % tot €50.000 / 9 % tot €250.000 / 27 % boven €250.000 per erfgenaam — afzonderlijke aanslag per erfgenaam"
        familiebedrijf_aandelen: "Aandelen De Wilde Bouw NV (€300.000 in nalatenschap) — gunstregime erfopvolging art. 2.7.4.2.2 VCF mogelijk: verlaagd tarief 3 % rechte lijn (mits continuïteit + participatie 3 jaar) i.p.v. progressief"

  - id: tweede-overlijdens-scenario-lieve
    leerstuk: successieplanning-en-gunstregime
    titel: "Wat zou een vooraf-gemaakte planning hebben bespaard?"
    feiten: >
      Stel dat Filip vóór zijn overlijden de planning had opgezet die hij overwoog
      (zie scenario 'schenking-aandelen-familiebedrijf'): notariële schenking met
      voorbehoud van vruchtgebruik aan Stef + Sofie van resterende 60 %, plus
      huwelijkscontract-clausule "verblijvingsbeding" (langstlevende krijgt alles
      tegen inbrengverplichting bij overlijden tweede echtgenoot).
    didactische_punten:
      - "Vergelijkende oefening: 'zonder planning' vs 'met planning' — €-impact + erfbelasting-besparing"
      - "Tijdshorizon kritisch: schenking moet > 3 jaar vóór overlijden geregistreerd zijn anders fictiebepaling art. 2.7.1.0.5 VCF"
      - "Verblijvingsbeding huwelijkscontract: economisch overdragend, fiscaal niet belast met erfbelasting bij eerste overlijden (mits voorwaarden), wel met inbrengverplichting bij tweede overlijden"
      - "Levensverzekering met cross-begunstiging tussen echtgenoten + clausule 'in geval van gelijktijdig overlijden' → verminderbare fictiebepaling"

# ---------------------------------------------------------------------------
# Mini-cases — secundaire valstrik-scenarios om in leerstukken te citeren
# ---------------------------------------------------------------------------

mini_cases:

  - id: blote-eigendom-met-vennootschap
    titel: "Filip overweegt: De Wilde Bouw NV koopt vruchtgebruik op nieuwe woning"
    leerstuk: registratierechten-vastgoed
    feiten: >
      Variante 1: Filip + Lieve kopen blote eigendom van een nieuw appartement Antwerpen
      voor €280.000; De Wilde Bouw NV koopt het vruchtgebruik (10 jaar) voor €120.000.
      Volle waarde appartement: €400.000.
    didactische_punten:
      - "Belastbare grondslag voor blote-eigendom-koop met voorbehoud vruchtgebruik door vervreemder: art. 48 W.Reg./art. 2.9.3.0.6 VCF — minimum = verkoopwaarde volle eigendom (€400.000)"
      - "Maar hier vruchtgebruik door derde (vennootschap) gevestigd, niet voorbehouden door vervreemder: art. 49 W.Reg. — minimum = volle eigendom min forfaitaire waarde vruchtgebruik art. 47 (geen voorbehoud = wel-aftrek)"
      - "Brusselse abattement art. 46bis: vereist geheelheid in volle eigendom door natuurlijke persoon. Splitsing met vennootschap → abattement UITGESLOTEN. Klassieke examenvalstrik."
      - "Anti-misbruik (art. 18, § 2 W.Reg. / art. 3.17.0.0.2 VCF): fiscus kan herkwalificeren als geheel-eigendom-aankoop indien geen niet-fiscale motieven"

  - id: command-termijn-gemist
    titel: "Sterkmaking — wat als Joris de eerste werkdag mist?"
    leerstuk: registratieformaliteit-en-procedure
    feiten: >
      Compromis ondertekend op vrijdag 5 april 2026 met clausule "voor zichzelf of
      een later aan te wijzen persoon". Joris (de neef) verlijdt de aanwijzingsakte
      ten gunste van De Wilde Bouw NV pas op woensdag 10 april 2026 (i.p.v. uiterlijk
      maandag 8 april).
    didactische_punten:
      - "Termijn = uiterlijk de eerste werkdag na compromis (art. 158, 1°, c W.Reg./art. 2.9.6.0.1, 1°, c VCF)"
      - "Termijn gemist → fiscus behandelt aanwijzing als wederverkoop → tweemaal verkooprecht (Joris betaalt op compromis + De Wilde Bouw betaalt op aanwijzing)"
      - "Geen sanering achteraf mogelijk — kortste fataal termijn van de RSR"


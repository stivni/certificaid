# ---------------------------------------------------------------------------
# Mermaid-diagrammen — visualisaties die in leerstuk-scripts worden gerefereerd
# ---------------------------------------------------------------------------

mermaid_diagrammen:

  twee-heffingen-flow:
    titel: "Twee heffingen, één instrumentarium — vermogensoverdracht in twee tijden"
    beschrijving: >
      Vereenvoudigd flow-diagram: vermogen kan tijdens leven (registratiebelasting)
      of bij overlijden (erfbelasting) overdragen. Schenking + leven = communicerende
      vaten met nalatenschap + overlijden. Drie gewesten heffen elk eigen tarief.
    mermaid_code: |
      flowchart TD
        V[Vermogen erflater] --> L{Overdracht<br/>bij leven of bij overlijden?}
        L -->|Bij leven| S1[Schenking onroerend<br/>= schenkbelasting]
        L -->|Bij leven| S2[Schenking roerend<br/>= schenkbelasting<br/>of handgift]
        L -->|Bij leven| V1[Verkoop / hypotheek<br/>= verkooprecht / hypotheekrecht]
        L -->|Bij overlijden| N[Nalatenschap<br/>= erfbelasting]
        S1 -.fictie 3 jaar.-> N
        S2 -.fictie 3 jaar.-> N
        N --> G{Welk gewest?}
        G -->|Fiscale woonplaats VL| VL[VCF Boek 2 — Vlabel]
        G -->|Fiscale woonplaats BR| BR[W.Succ. — FOD Financiën]
        G -->|Fiscale woonplaats WA| WA[W.Succ. — FOD Financiën]

  familie-de-wilde-structuur:
    titel: "Familie De Wilde — structuur + vermogen op referentie-datum 2026"
    beschrijving: >
      Family-tree met vermogenscategorieën gekoppeld aan personen. Filip + Lieve
      gehuwd 1988, wettelijk stelsel. Twee kinderen Sofie + Stef. Aandelen
      De Wilde Bouw NV verdeeld 60/20/20 over Filip/Lieve/Sofie.
    mermaid_code: |
      flowchart TD
        F[Filip De Wilde<br/>62 j · Antwerpen<br/>fiscaal Vlaanderen] ---|Wettelijk stelsel<br/>sinds 1988| L[Lieve Janssens<br/>60 j · Antwerpen]
        F --> S[Sofie · 35<br/>Gent · gehuwd Tom<br/>2 kleinkinderen]
        L --> S
        F --> T[Stef · 32<br/>Brussel · samenwonend<br/>met Anouk]
        L --> T
        S -.20%.-> BV[De Wilde Bouw NV<br/>€1.500.000<br/>25 werknemers]
        F -.60%.-> BV
        L -.20%.-> BV
        F --- GW[Gemeenschap:<br/>gezinswoning · studio Brussel<br/>portefeuille · Tak 23]
        L --- GW
        F --- EF[Eigen Filip:<br/>tweede verblijf Knokke<br/>20% aandelen erfenis 2010]

  beslisboom-vier-rechten:
    titel: "Welke evenredige registratierecht treft deze vastgoed-verrichting?"
    beschrijving: >
      Beslisboom: type verrichting → gewest → gunstregime. Vier eindknopen
      corresponderen met verkooprecht, verdeelrecht, hypotheekrecht, schenkrecht.
    mermaid_code: |
      flowchart TD
        START{Welk type verrichting<br/>op onroerend goed?} --> V[Verkoop aan derde]
        START --> D[Uittreding mede-eigenaar<br/>uit onverdeeldheid]
        START --> H[Vestiging hypotheek]
        START --> SCH[Kosteloze overdracht<br/>= schenking]
        V --> VG{Welk gewest?}
        VG -->|Vlaanderen| VV[Verkooprecht 12%<br/>3% verlaagd eigen woning<br/>1% energetische renovatie]
        VG -->|Brussel| VB[Verkooprecht 12,50%<br/>Abattement €200k]
        VG -->|Wallonië| VW[Verkooprecht 12,50%<br/>5% klein-beschrijf]
        D --> DG{Welk gewest?}
        DG -->|Vlaanderen| DV[Verdeelrecht 2,5%<br/>op massa-waarde]
        DG -->|Brussel/Wallonië| DBW[Verdeelrecht 1%<br/>op massa-waarde]
        H --> HH[Hypotheekrecht 1%<br/>alle gewesten]
        SCH --> SCHO{Roerend of onroerend?}
        SCHO -->|Onroerend| SCHON[Schenkbelasting progressief<br/>3-9-18-27% VCF rechte lijn]
        SCHO -->|Roerend incl. aandelen| SCHR[Schenkbelasting VCF<br/>3% rechte lijn / 7% anderen]

  devolutie-filip-wilde:
    titel: "Devolutie hypothetisch overlijden Filip — hervormd erfrecht 2018"
    beschrijving: >
      Wettelijke devolutie zonder testament: overlevende echtgenoot krijgt
      vruchtgebruik op hele nalatenschap; afstammelingen krijgen blote eigendom
      in gelijke delen. Voor gezinswoning Antwerpen: vrijstelling overlevende
      echtgenoot art. 2.7.6.0.3 VCF.
    mermaid_code: |
      flowchart TD
        F[Filip overlijdt 15 mei 2026<br/>Vlaanderen — geen testament] --> N[Netto nalatenschap<br/>€1.608.700]
        N --> L[Lieve · overlevende echtgenoot]
        N --> S[Sofie · afstammeling]
        N --> T[Stef · afstammeling]
        L -->|Vruchtgebruik op hele NL| LVG[Vruchtgebruik gekapitaliseerd<br/>op leeftijd Lieve = 60]
        L -->|0% gezinswoning| LGW[Volle eigendom gezinswoning-aandeel<br/>art. 2.7.6.0.3 VCF]

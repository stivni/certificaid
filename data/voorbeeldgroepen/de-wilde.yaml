# Familie De Wilde — voorbeeldgroep voor PO 2.6 (registratie- en successierechten)
#
# Mock Belgisch gezin in Vlaanderen, met gemengd vermogen (onroerend + financieel +
# familiebedrijf) verdeeld over drie gewesten. Cijfers fictief maar intern consistent.
# Wordt geconsumeerd door:
#   - data/leerstukken/wat-zijn-registratie-en-successierechten.yaml
#   - data/leerstukken/registratierechten-vastgoed.yaml
#   - data/leerstukken/registratieformaliteit-en-procedure.yaml
#   - data/leerstukken/erfbelasting-en-aangifte-nalatenschap.yaml
#   - data/leerstukken/successieplanning-en-gunstregime.yaml
#   - data/samenvattingen/2-6.yaml
#
# De oefening (data/oefeningen/verdonck-beysens-vermogensplanning.yaml) gebruikt een
# ANDERE familie zodat de student getoetst wordt op nieuwe cijfers.
#
# Consistentie-toetsen (door auteur uitgevoerd):
#   - Vermogenstotaal = ∑ onroerend + financieel + familiebedrijf
#   - Aandelen-percentages De Wilde Bouw NV = 100 %
#   - Devolutie scenario "Filip overlijdt" sluit aan op huwelijksstelsel + erfrecht 2018
#   - Tarieven erfbelasting Vlaams gewest 2025 (Cijferzakboekje)
#   - Termijnen W.Succ./VCF + W.Reg./VCF consistent met examenrechtsstof 2014-1, 2015-1

naam: de-wilde
beschrijving: >
  Familie De Wilde is een fictief Vlaams gezin (echtpaar + twee meerderjarige kinderen)
  met een gemengd vermogen verspreid over drie gewesten: gezinswoning + studio Brussel
  + tweede verblijf Knokke + aandelen van een familiebedrijf in de bouwsector. Wordt
  gebruikt om alle vier evenredige registratierechten + aangifte van nalatenschap +
  fictiebepalingen + gunstregime familiale onderneming binnen één coherente case te
  illustreren. Eén hypothetisch overlijdens-scenario (Filip) genereert een uitgewerkte
  aangifte van nalatenschap.

referentie_datum: "01-01-2026"
gewest_fiscaal_woonplaats: vlaams


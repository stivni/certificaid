# Oefening-script — Tessera BV — financiële diagnose in 5 stappen
#
# Aanvullende doe-laag voor PO 1.3. Student loopt zelf het diagnose-pad:
# herwerken → ratio's → cross-categorie → alarmsignalen → voorstellen.
# Verkort schema om schema-bewustzijn (klassieke valkuil) actief te oefenen.

meta:
  slug: tessera-financiele-diagnose
  titel: "Oefening: Tessera BV — financiële diagnose in 5 stappen"
  po: "1.3"
  cluster: jaarrekeninganalyse
  beschrijving: "Mini-case voor PO 1.3: stagiair loopt zelf het volledige diagnose-pad van een KMO meubel-detailhandel met verkort schema. Herwerken, vier ratio's berekenen, DuPont, drie alarmsignalen herkennen, drie voorstellen formuleren."
  studietijd: "60-75 min"
  niveau: "volledig"

intro:
  callout_beat: >
    Standaard oefening-intro met expliciete "doe-eerst-zelf"-instructie:
    klap pas open nadat je elke stap zelf hebt geprobeerd. Markeer dat dit
    een doorgewerkt diagnose-pad is, niet een toetsing op fragmenten. Verkort schema
    om schema-bewustzijn actief te oefenen.

opgave:

  scenario_beats:
    - "**Tessera BV** is een Belgische KMO in meubel-detailhandel — twee winkels in Hasselt en Genk + één webshop. Opgericht 2018, sinds 2022 winstgevend, 12 vte. Verkort schema (kleine vennootschap)."
    - "Vraag van de zaakvoerder: 'Mijn bank vraagt extra rapportering — kan je een korte diagnose maken op basis van mijn jaarrekening N en N-1?' De zaakvoerder vermoedt dat hij op koers ligt maar wil een tweede mening + concrete voorstellen voor N+1."
    - "Volg het vijf-stappen-pad uit [[kritische-beoordeling-en-diagnose]]: context → ratio's → cross-categorie → kwalitatief → synthese + advies. Hou je antwoorden kort en concreet — een echte cliënt-rapportering past op 2 A4."
    - "**Beschikbaar**: balans N en N-1 (verkort schema), resultatenrekening N en N-1 (verkort schema), korte toelichting. Werk eerst zelf — open de oplossings-blokken pas nadat je elke stap geprobeerd hebt."

  balans:
    titel: "Balans Tessera BV — 31-12-N en 31-12-(N-1) — verkort schema (in EUR)"
    eenheid: "EUR"
    actief:
      rubrieken:

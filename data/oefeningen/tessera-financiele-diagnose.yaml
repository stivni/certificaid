      - {code: "9901", omschrijving: "BEDRIJFSRESULTAAT", n: 51000, n_min_1: 58000, accent: true}
      - {code: "IV.A (75)", omschrijving: "Financiële opbrengsten", n: 1000, n_min_1: 1000}
      - {code: "V.A (650)", omschrijving: "Kosten van schulden", n: 6000, n_min_1: 4500}
      - {code: "V.B (651-657)", omschrijving: "Andere financiële kosten", n: 1000, n_min_1: 1000}
      - {code: "9903", omschrijving: "RESULTAAT VÓÓR BELASTING", n: 45000, n_min_1: 53500, accent: true}
      - {code: "X (67)", omschrijving: "Belastingen op het resultaat", n: 11000, n_min_1: 13500}

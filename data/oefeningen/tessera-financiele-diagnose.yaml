      Verkort schema → rubrieken 70 (omzet), 71 (voorraadwijziging), 72 (geproduceerde vaste activa) en 74 (andere bedrijfsopbrengsten)
      zijn samengevoegd tot rubriek 9900 "Brutomarge". Idem rubriek 60 (handelsgoederen, grond- en hulpstoffen) en 61 (diensten en
      diverse goederen) — die zijn niet apart zichtbaar.

  toelichting:
    titel: "Toelichting (samenvatting)"
    items:
      - "Waarderingsregels: voorraad FIFO; materiële vaste activa lineair afgeschreven 7-10 jaar; waardevermindering handelsvorderingen volgens specifieke lijst."
      - "Geen achterstallige RSZ-, btw- of vennootschapsbelastingschulden op 31/12/N."
      - "Hypotheek op handelsfonds t.v.v. KBC: 100.000 EUR (waarvan 90.000 EUR effectief opgenomen — saldo banklening)."
      - "Persoonlijke borg van de zaakvoerder voor het kaskrediet (35.000 EUR)."
      - "Bestuursverslag (samenvatting): omzet gegroeid maar marge onder druk door e-commerce-prijsdruk en webshop-launch-kosten. Voorraad uitgebreid voor volledig assortiment in beide winkels + webshop. Klanten betalen later (B2B-keten als nieuwe afzetkanaal)."

stappen:

  - id: stap-1-herwerken
    titel: "Stap 1 — Herwerk + bereken NBK · BBK · NT"
    instructie_beats:
      - "Bereken het netto-bedrijfskapitaal (NBK), de behoefte aan bedrijfskapitaal (BBK) en de nettothesaurie (NT) van Tessera op 31/12/N. Geef per component formule + de gebruikte rubrieken. Interpreteer het resultaat in één korte zin."
    uitwerking_beats:
      - "**NBK** = Permanent vermogen − Vaste activa = (EV 145.000 + Voorz. 5.000 + Schulden >1j 90.000) − Vaste activa 185.000 = 240.000 − 185.000 = **55.000 EUR**. Of equivalent: Vlottende activa − Schulden ≤1j = (145.000+88.000+0+42.000+5.000) − (215.000+10.000) = 280.000 − 225.000 = 55.000 ✓"
      - "**BBK** = Exploitatie-vlot.activa − Exploitatie-KT-sch = (Voorr. 145.000 + Handelsvord. 82.000 + Ov.vord. 6.000 + Overl.act. 5.000) − (Handelssch. 118.000 + Fisc/soc. 32.000 + Vooruit. 4.000 + Ov.sch. 11.000 + Overl.pass. 10.000) = 238.000 − 175.000 = **63.000 EUR**. Niet meegenomen: liquide middelen + geldbel. (thesaurie), rubriek 42 + 43 (financieel), vaste activa + EV + voorzieningen + LT-schulden (permanent)."
      - "**NT** = NBK − BBK = 55.000 − 63.000 = **−8.000 EUR**. Controle: cash-equivalents 42.000 − financiële KT-schulden (15.000 + 35.000) = 42.000 − 50.000 = −8.000 ✓"
      - "Interpretatie: NT is licht negatief — exploitatiecyclus vraagt méér cash dan structurele financiering levert. Tessera vult dat aan met kaskrediet (43 = 35.000 vs vorig jaar 12.000 — gestegen)."
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Component", "Formule", "Waarde", "Versus N-1"]
        rijen:
          - ["NBK", "Perm. verm. − Vaste activa", "55.000", "(N-1: 53.000) ≈ stabiel"]
          - ["BBK", "Excl. exploitatie-VA − Excl. exploitatie-KT", "63.000", "(N-1: 42.000) ↑ sterk"]
          - ["NT", "NBK − BBK = cash − fin.KT-sch", "−8.000", "(N-1: +51.000) ↓ sterke daling"]
    valkuil_beat: "Klassieke valkuil: rubriek 42 (LT-schulden vervallend binnen jaar) en 43 (kaskredieten) NIET in BBK — beide financieel, niet exploitatief. Ze zitten wel in de noemer van current ratio."

  - id: stap-2-ratios
    titel: "Stap 2 — Bereken 8 ratio's (2 per familie) — let op verkort schema"
    instructie_beats:
      - "Bereken voor jaar N: current ratio + quick ratio (liquiditeit) · schuldgraad + interest coverage (solvabiliteit) · brutoverkoopmarge (NBB-conventie) + nettomarge (rentabiliteit) · DSO + DPO (activiteit). Geef formule + rubrieken + waarde. **Pas op**: één of meer van de geplande ratio's kun je niet zomaar berekenen. Geef ook aan waarom."
    uitwerking_beats:
      - "**Current ratio** = Vlottende activa / KT-schulden = (145+88+0+42+5) / (215+10) = 280 / 225 = **1,24** — net boven 1,0 maar onder vuistregel 1,5-2,0"
      - "**Quick ratio** = (VA − voorraden) / KT-sch = (280 − 145) / 225 = 135 / 225 = **0,60** — onder 1,0 → zonder voorraadverkoop kan Tessera haar KT-schulden niet dekken"
      - "**Schuldgraad** = VV / Totaal = (5+90+215+10) / 465 = 320 / 465 = **68,8 %** — binnen vuistregel < 70 % maar net"
      - "**Interest coverage** = EBIT / kosten van schulden = 51.000 / 6.000 = **8,5** — boven vuistregel > 5 (gezond)"
      - "**Brutoverkoopmarge (NBB)** = Bedrijfsresultaat / Omzet = 51.000 / **?** — **valkuil!** In het verkort schema is rubriek 70 (omzet) **niet apart zichtbaar** — ze is opgegaan in rubriek 9900 (Brutomarge). Zonder de toelichting met expliciete omzet-vermelding kun je deze ratio niet rechtstreeks berekenen. Een proxy: bedrijfsresultaat / 9900-Brutomarge, of vraag de omzet apart aan de cliënt."
      - "**Nettomarge** = Nettoresultaat / Omzet = 34.000 / **?** — zelfde probleem als brutoverkoopmarge. Alternatief: kijk naar verhouding nettoresultaat / brutomarge (9900): 34.000 / 285.000 = 11,9 % — geen klassieke nettomarge, maar wel een vergelijkbare maatstaf binnen verkort schema."
      - "**DSO (klanten)** = (40 × 365) / (omzet × 1,21) — **niet berekenbaar in verkort schema** (omzet onbekend). Wie de omzet uit een aanvullende bron kent: bereken het. Anders: DSO uit bestaande data niet aflesbaar — een klassieke valkuil rond schema-bewustzijn."
      - "**DPO (leveranciers)** = (44 × 365) / ((60+61) × 1,21) — **ook niet berekenbaar in verkort schema** (rubriek 60 en 61 niet apart)."
      - "Schema-conclusie: van de 8 geplande ratio's zijn er 4 niet (rechtstreeks) berekenbaar in verkort schema: brutoverkoopmarge NBB, nettomarge en de twee activiteits-ratio's DSO/DPO. Dit is de hele schema-valkuil in actie."
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Familie", "Ratio", "Waarde N", "Vuistregel"]
        rijen:
          - ["Liquiditeit", "Current ratio", "1,24", "1,5-2,0 → 🟡 zwak"]
          - ["Liquiditeit", "Quick ratio", "0,60", "> 1,0 → 🔴 onvoldoende"]
          - ["Solvabiliteit", "Schuldgraad", "68,8 %", "< 70 % → 🟡 grens"]
          - ["Solvabiliteit", "Interest coverage", "8,5", "> 5 → ✅ sterk"]
          - ["Rentabiliteit", "Brutoverkoopmarge NBB", "❌ schema-belemmering", "—"]
          - ["Rentabiliteit", "Proxy 9904/9900 (verkort)", "11,9 %", "indicatief"]
          - ["Activiteit", "DSO", "❌ schema-belemmering", "—"]
          - ["Activiteit", "DPO", "❌ schema-belemmering", "—"]
    valkuil_beat: "Schema-bewustzijn is hier het centrale didactische punt. Zonder rubriek 70 + 60 + 61 verdwijnen DSO, DPO en commerciële brutomarge — krachtige klassieke valkuil."

  - id: stap-3-cross-categorie
    titel: "Stap 3 — DuPont-decompositie en hefboomeffect-toets"
    instructie_beats:
      - "Op basis van wat WEL berekenbaar is: vergelijk N met N-1 voor de drie DuPont-componenten (nettomarge proxy · asset turnover proxy · equity multiplier). Doe ook een hefboomeffect-toets (ROA na belasting vs kostprijs vreemd vermogen). Vraag: is hefboom in deze case positief of negatief?"
    uitwerking_beats:
      - "Asset turnover proxy = Brutomarge 9900 / Totaal activa (geen echte omzet beschikbaar). N: 285.000 / 465.000 = 0,61. N-1: 270.000 / 434.000 = 0,62. ≈ stabiel."
      - "Nettomarge proxy (zoals stap 2): N: 34/285 = 11,9 %. N-1: 40/270 = 14,8 %. ↓ daling 2,9 pp — margedruk."
      - "Equity multiplier = Totaal activa / EV. N: 465/145 = 3,21. N-1: 434/130 = 3,34. ≈ stabiel (lichte daling)."
      - "Proxy-ROE = nettomarge × asset turnover × equity multiplier = 11,9 % × 0,61 × 3,21 = 23,3 %. Of direct: 34.000 / 145.000 = 23,4 % ✓ (sterk!). Daling t.o.v. N-1: 40.000 / 130.000 = 30,8 % → ↓ 7,4 pp"
      - "DuPont-conclusie: ROE-daling is **marge-gedreven**. Asset turnover en hefboom blijven stabiel. Aanbeveling moet richten op marge — niet op activa-reductie of hefboom-verandering."
      - "**Hefboomeffect-toets**: ROA = 51.000 / 465.000 = 10,97 %. ROA na belasting ≈ 10,97 % × (1 − 0,243) = 8,30 % (effectief belastingtarief 11/45 = 24,3 %). Kostprijs VV ≈ 6.000 / 140.000 (gem. LT-sch. + KT-fin) = 4,3 %. ROA na bel. (8,30 %) > kostprijs VV (4,3 %) → **POSITIEF hefboomeffect**. Schuld duwt ROE omhoog."
      - "Belangrijke nuance: hefboomeffect is positief — maar de werkkapitaal-druk (BBK +21 K, NT van +51 naar −8) en de margedruk vragen aandacht. Geen alarmbel-trigger maar wel actiepunten."
    valkuil_beat: "De proxy-ratio's (geen echte omzet) zijn niet helemaal vergelijkbaar met sector-benchmarks die WEL omzet gebruiken. Voor een externe analist: vraag de cliënt om de omzet apart te leveren, of werk met toelichting-data."

  - id: stap-4-alarmsignalen
    titel: "Stap 4 — Identificeer 3 alarmsignalen"
    instructie_beats:
      - "Op basis van wat je tot hier ziet: lijst de 3 belangrijkste alarmsignalen voor Tessera. Onderbouw elk signaal met een cijfer uit de jaarrekening (rubriek + waarde + verandering)."
    uitwerking_beats:
      - "**Signaal 1 — Quick ratio onder 1,0**. Quick ratio = 0,60. Zonder voorraadverkoop kan Tessera haar KT-schulden niet dekken. Liquide middelen daalden 78 → 42 (-46 %). Kaskrediet steeg 12 → 35 (+192 %). Cash-vrije vlottende dekking onder kritisch niveau."
      - "**Signaal 2 — Voorraadgroei consumeert cash**. Voorraad 110 → 145 = +35 K EUR (+32 %). Vergelijkbare groei in handelsvorderingen 58 → 82 = +24 K. Samen +59 K aan werkkapitaal-stijging — verklaart NT-omslag van +51 naar −8."
      - "**Signaal 3 — Rentabiliteit daalt sneller dan omzet (margedruk)**. Brutomarge (9900) groeit 270 → 285 = +5,6 %, maar bedrijfsresultaat zakt 58 → 51 = -12 %. Resultaat boekjaar zakt 40 → 34 = -15 %. Toelichting bestuursverslag: webshop-launch-kosten + e-commerce-prijsdruk."
      - "Niet-signaal (bewust): interest coverage 8,5 → 8,5 is nog comfortabel; geen covenant-spanning zoals bij een gevorderde stress-case. Tessera zit dus in een vroegere stress-fase: signalen aanwezig, maar nog tijd om te corrigeren."
    valkuil_beat: "Schuldgraad 68,8 % alleen is niet voldoende voor alarm — kijkt naar combinatie met liquiditeit + werkkapitaal-trend. Geïsoleerde ratio's misleiden."

  - id: stap-5-voorstellen
    titel: "Stap 5 — Formuleer 3 concrete voorstellen aan de zaakvoerder"
    instructie_beats:
      - "Formuleer 3 concrete voorstellen voor N+1. Per voorstel: thema, actie (concreet — niet 'beter werkkapitaal-beheer' maar bv. 'voorraad afbouwen met 20 % via assortimentsreductie webshop'), en verwacht effect. Doelstelling 1.3.1.2 — integratie-niveau."
    uitwerking_beats:
      - "**Voorstel 1 — Voorraadbeheer**. Actie: webshop-assortiment evalueren op rotatie + uitfaseren van traag-roterende SKU's. Streven naar voorraad-reductie van 14 %; voorraad-doel 125.000 EUR (van 145.000). Verwacht effect: 20.000 EUR cash-bevrijding + verlaging waardeverminderings-risico."
      - "**Voorstel 2 — Debiteurenbeheer B2B-kanaal**. Actie: nieuwe B2B-keten-klanten op kortere payment terms (30 d i.p.v. 60 d) + automatische rappelaar-procedure. Verwacht effect: handelsvorderingen omlaag 82 → 65 K = +17 K cash, niet ten koste van omzet."
      - "**Voorstel 3 — Webshop-kostenbasis herzien**. Actie: webshop-launch-kosten waren eenmalig (gedeeltelijk) — segmentering wijst uit dat marketing-spend onevenredig hoog is in launch-fase. Voorstel: marketing-budget herzien naar performance-driven (5 % van webshop-omzet), niet absoluut bedrag. Verwacht effect: bedrijfsresultaat herstel +10-15 K EUR in N+1."
      - "Synthese-paragraaf (voor cliënt-rapport): 'Tessera staat er nog gezond voor — schuldgraad binnen norm, interest coverage sterk, eigen vermogen positief. Maar drie waarschuwingslampjes branden: quick ratio onder 1,0, BBK-stijging die cash opvreet, en margedaling sneller dan omzetgroei. Met de drie voorstellen hierboven kan Tessera in N+1 haar nettothesaurie terugbrengen naar positief en haar marge herstellen tot het N-1-niveau. Bank-rapportering kan dan gestoeld worden op een trendmatig verbeterend beeld.'"
    valkuil_beat: "Voorstellen moeten **concreet** zijn met cijfer-doelen — 'beter beheer' of 'verbeter de marge' is niet wat 1.3.1.2 vraagt. Integratie-niveau wil van analyse naar advies komen."

afsluiting:
  reflectie_beats:
    - "Het diagnose-pad gaat van data → ratio's → cross-categorie → alarmsignalen → voorstellen. Vijf stappen die elk hun eigen techniek vereisen — en die samen meer betekenen dan elk apart."
    - "Verkort schema is geen excuus om geen analyse te doen — wel een uitdaging om met proxies en toelichting te werken. Schema-bewustzijn (welke ratio's verdwijnen of moeten ge-proxied worden) is een terugkerende vraag bij elke verkort-schema-analyse."
    - "Het verschil tussen Tessera (deze oefening, verkort schema, vroegere stress-fase) en Belova (de leerstuk-case, volledig schema, gevorderde stress-fase) toont hoe het zelfde diagnose-pad zich aanpast aan andere omstandigheden."
    - "Doelstelling 1.3.1.2 (voorstellen formuleren) is het integratie-niveau van dit PO. Reken niet meer als techniek alleen — combineer met advies, en je hebt het PO-niveau bereikt."
  doelstellingen_gedekt: ["1.3.taak.1.doel.1", "1.3.taak.1.doel.2"]
  valkuilen_geoefend:
    - "Schema-bewustzijn (welke ratio's niet berekenbaar in verkort)"
    - "BBK ja/nee per rubriek (vooral 42 + 43 NIET in BBK)"
    - "Geïsoleerde ratio-lezing (één cijfer ≠ oordeel — combineer met trend + cross-categorie)"
    - "Concrete vs vage voorstellen (cijfer-doelen vereist voor 1.3.1.2-niveau)"


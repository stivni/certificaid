# ---------------------------------------------------------------------------
# WETTELIJK FUNDAMENT — vooral voor de student-controle
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Integrale consolidatie + eerste consolidatie + reële-waarde-herwaardering"
    ref: "KB-WVV art. 3:126 e.v. (Onderafdeling 2, Hoofdstuk Geconsolideerde jaarrekening)"
  - onderwerp: "Consolidatieverschil — positief (afschrijving)"
    ref: "KB-WVV art. 3:131 § 1"
    noot: "Passend afschrijvingsplan; > 5 jaar motiveren; niet-recurrente afschrijving bij ongunstige ontwikkeling"
  - onderwerp: "Consolidatieverschil — negatief (badwill)"
    ref: "KB-WVV art. 3:131 § 2"
  - onderwerp: "10-jaar maximumtermijn bij niet-betrouwbare schatting gebruiksduur"
    ref: "CBN-advies 2016/7"
    noot: "Doctrine, niet wettelijk plafond in KB-WVV"
  - onderwerp: "Eliminatie intra-groep stromen — deelneming + EV"
    ref: "KB-WVV art. 3:127, a)"
  - onderwerp: "Eliminatie intra-groep vorderingen/schulden + winsten in voorraad"
    ref: "KB-WVV art. 3:134"
  - onderwerp: "Eliminatie intra-groep opbrengsten/kosten"
    ref: "KB-WVV art. 3:136"
  - onderwerp: "Aandeel van derden (belang van derden)"
    ref: "KB-WVV art. 3:137"
  - onderwerp: "IFRS-pad — integrale consolidatie + control-test"
    ref: "IFRS 10"
  - onderwerp: "IFRS goodwill — eerste meting + impairment-only"
    ref: "IFRS 3 + IAS 36"


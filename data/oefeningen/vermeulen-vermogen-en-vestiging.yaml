# Oefening-script — Familie Vermeulen: regionaal en lokaal in vijf scoped vragen
#
# Oefening voor PO 2.7 (regionale en lokale fiscaliteit). Multi-case-dossier op
# één cliëntcontext (familie Vermeulen-Decoster + gemeente Stranddorp + Vermeulen
# Constructie BV). Vijf onafhankelijke scoped deelvragen — geen doorlopende
# financiële draad: fiscale leerstof leeft per heffing, niet per case.
#
# Bewuste keuze voor scoped i.p.v. volledig: PO 2.7 is een kader-vak. Een student
# die vijf scoped vragen kan beantwoorden heeft het leerstuk-pakket geïntegreerd
# scherper dan wie één Aurelia-achtige doorlopende case oplost. Activeert alle
# vijf leerstukken:
#   - Vraag 1 → L1 (bevoegdheidskader) + L2 (gewestelijke werkpaarden)
#   - Vraag 2 → L2 (opcentiemen-formule + cijferberekening)
#   - Vraag 3 → L3 (wettigheidstoets in vier criteria)
#   - Vraag 4 → L4 (Vlabel-bezwaarroute) + L2 (planbatenheffing-mechaniek)
#   - Vraag 5 → L5 (geïntegreerd advies: bevoegdheid + vijfjaarsregel + antimisbruik)
#
# Drie pijlers (oefening-procedure):
#   1. Geen hints in opgave-tekst — feiten + cijfers, geen concept-namen
#   2. Realistische fiscale casus — verschillende deelfeiten per vraag
#   3. Niet-voorkauwende instructie-beats — student activeert zelf de leerlaag

meta:
  slug: vermeulen-vermogen-en-vestiging
  titel: "Oefening: Familie Vermeulen — regionaal en lokaal in vijf vragen"
  po: "2.7"
  cluster: regionale-en-lokale-fiscaliteit
  beschrijving: >
    Multi-case-dossier op één cliëntcontext: een Vlaams gezin met vastgoed in
    drie gewesten, een operationele BV en een geplande vermogensoverdracht aan
    twee kinderen — ene in Wallonië, andere in Brussel. Vijf onafhankelijke
    scoped deelvragen activeren elk minstens één van de vijf leerstukken: van
    heffingen-inventaris en opcentiemen-rekenwerk tot wettigheidstoets,
    bezwaarroute en geïntegreerd vermogensadvies.
  studietijd: "75 min"
  niveau: scoped
  explorer_title: "7. Oefening"

intro:
  callout_beat: >
    Oefening-intro voor multi-case-dossier. Aankondigen: dit zijn vijf scoped
    deelvragen — examen-stijl — op één gemeenschappelijke cliëntcontext (familie
    Vermeulen + Vermeulen Constructie BV + gemeente Stranddorp). De vragen zijn
    onafhankelijk, je hoeft ze niet in volgorde te maken. Expliciete vermelding:
    "doe eerst zelf, klap pas open na je eigen antwoord". Eindigend met
    motivatie — het examen toetst dit type fragment-vragen één voor één;
    deze oefening laat zien dat de vijf leerstukken samen één denkframe vormen.

# ---------------------------------------------------------------------------
# OPGAVE — gemeenschappelijke cliëntcontext + vijf vraagstellingen
# ---------------------------------------------------------------------------

opgave:

  scenario_beats:
    - "Wouter Vermeulen (62) is zaakvoerder van Vermeulen Constructie BV, een algemene aannemer met zetel in Lier en ca. 2,8 mio EUR omzet (8 werknemers). Hij is gehuwd met Annick Decoster (60, bediende). Beiden wonen in Lier."
    - "Het echtpaar heeft twee meerderjarige kinderen: Sofie (32) woont sinds 2024 in Namen (Wallonië), Bram (28) woont in Brussel."
    - "Vastgoedportefeuille van Wouter: eigen woning Lier (samen met Annick), verhuurde studio in Knokke-Heist, leegstaande bedrijfsruimte in Aalst (eigendom van de BV), en een grond van 1,2 ha in Geraardsbergen die hij in 2018 erfde van zijn vader. De gemeente Geraardsbergen heeft in 2025 een ruimtelijk uitvoeringsplan goedgekeurd dat de bestemming van die grond wijzigt van agrarisch naar woongebied."
    - "Wagenpark: een Audi A6 hybride bedrijfswagen van Wouter (11 fiscaal-PK, CO₂ 145 g/km, ingeschreven op naam van de BV), een Renault Master bestelwagen (eveneens op naam van de BV), en Sofie's eigen Peugeot 208 (in Namen ingeschreven)."
    - "Werkwijze: lees de gemeenschappelijke context en de vijf vragen hieronder. Werk elke vraag eerst zelf uit voor je de oplossing opent. Reken op ca. 15 minuten per vraag — 75 minuten in totaal."

  groep:
    moeder:
      naam: "Vermeulen Constructie BV"
      rechtsvorm: BV
    deelnemingen: []

  # ----- Aanvullende context per vraagblok (geen volledige balans/RR nodig) -----

  tabellen:

    # Cliëntcontext-tabel: voorgesteld zonder hint naar welk leerstuk welke
    # feiten zal aanspreken — student moet zelf de relevante feiten per vraag
    # filteren.
    vastgoed-overzicht:
      titel: "Vastgoedoverzicht familie Vermeulen op 1 januari 2026"
      kolommen: ["Pand", "Eigenaar", "Ligging", "Status"]
      rijen:
        - ["Eigen woning", "Wouter + Annick (50/50)", "Lier (Vlaams Gewest)", "Hoofdverblijfplaats"]
        - ["Studio", "Wouter (100%)", "Knokke-Heist (Vlaams Gewest)", "Verhuurd aan particulieren"]
        - ["Bedrijfsruimte 1.800 m²", "Vermeulen Constructie BV", "Aalst (Vlaams Gewest)", "Leeg sinds 2023; opgenomen in Vlaamse inventaris leegstaande en/of verwaarloosde bedrijfsruimten in 2024 en bevestigd in 2025 en 2026"]
        - ["Grond 1,2 ha", "Wouter (100%)", "Geraardsbergen (Vlaams Gewest)", "Geërfd 2018; agrarisch tot 2024, woongebied sinds RUP-goedkeuring 2025"]

    # Stranddorp-reglementen: feitelijk weergegeven, zonder pre-categorisering
    # naar "OK / niet OK". Student moet zelf de vier criteria langslopen.
    stranddorp-hondenbelasting-2026:
      titel: "Hondenbelasting gemeente Stranddorp — reglement 2026"
      kolommen: ["Element", "Inhoud reglement"]
      rijen:
        - ["Belastbaar feit", "Elke hond gehouden door een inwoner van Stranddorp"]
        - ["Tarief", "50 EUR voor de eerste hond · 100 EUR voor de tweede hond · 200 EUR voor elke volgende hond"]
        - ["Vrijstellingen", "Blindengeleidehonden · assistentiehonden · bewakingshonden gehouden door erkende zelfstandige bewakingsondernemingen"]
        - ["Vaststelling", "Gemeenteraad Stranddorp op 12 januari 2026"]
        - ["Bekendmaking", "Gemeentelijke webtoepassing op 20 januari 2026"]
        - ["Motivering", "Algemene verwijzing naar 'beheersing van overlast door huisdieren'; geen specifieke motivering voor de progressieve schijven of voor de vrijstelling van bewakingsondernemingen"]

    # OV-cijfers voor vraag 2: KI als ronde plaatshouder, opcentiemen concreet,
    # gewest-basistarieven uit leerstuk 2.
    ov-cijfers-vraag-2:
      titel: "Berekeningsgegevens onroerende voorheffing — vergelijking Knokke-Heist vs. Brussels-stad"
      kolommen: ["Element", "Knokke-Heist (Vl)", "Brussels-stad (Br)"]
      rijen:
        - ["Niet-geïndexeerd kadastraal inkomen (hypothetisch identiek)", "1.500 EUR", "1.500 EUR"]
        - ["Indexcoëfficiënt aanslagjaar 2026", "Cijferzakboekje 2026", "Cijferzakboekje 2026"]
        - ["Gewestelijk basistarief", "3,97 %", "1,25 %"]
        - ["Gemeentelijke opcentiemen", "950", "3.300 *(typisch Brussels-stad)*"]
        - ["Provinciale opcentiemen", "300 *(West-Vlaanderen, geplafonneerd)*", "0 *(Brussel kent geen provincies sinds 1995)*"]

  intro_noot_opgave: >
    De vragen hieronder zijn **onafhankelijk** van elkaar — je hoeft niet alle
    feiten uit de context te gebruiken in elke vraag. Filter per vraag zelf
    welke feiten relevant zijn.

# ---------------------------------------------------------------------------
# STAPPEN — vijf scoped vragen, telkens instructie + oplossing in <details>
# ---------------------------------------------------------------------------

stappen:

  - id: vraag-1-heffingen-inventaris
    titel: "Vraag 1 — Inventariseer de gewestheffingen op Wouter en de BV (15 min)"
    instructie_beats:
      - "Wouter wil een overzicht: welke gewestelijke heffingen worden er in 2026 effectief geheven op hem persoonlijk én op Vermeulen Constructie BV, gegeven de feiten in de context?"
      - "Maak een tabel. Vermeld per heffing: het belastingplichtig subject (Wouter of de BV), het belastbaar feit zoals het in zijn dossier speelt, en welke administratie de heffing int."
      - "Beperk je tot de gewest-niveau-heffingen die effectief geheven worden in 2026. Loutere theoretische mogelijkheden hoef je niet te vermelden."
    uitwerking_beats:
      - "Vertrek vanuit de twee categorieën die je in de leerstukken hebt gezien: overgedragen heffingen (federaal opgezet, gewestelijk overgenomen na de zesde staatshervorming) en autonome heffingen (gewest-creaties zonder federaal equivalent). De heffingen op Wouter en de BV verdelen zich over beide categorieën."
      - "Overgedragen heffingen, Wouter persoonlijk. Onroerende voorheffing op de eigen woning Lier (Vlaams gewest, geheven door Vlabel, verminderingen voor gezinswoning kunnen spelen). Onroerende voorheffing op de studio Knokke-Heist (Vlaams gewest, geen vermindering aangezien het geen hoofdverblijfplaats is). Onroerende voorheffing op de grond Geraardsbergen (Vlaams gewest, op basis van het kadastraal inkomen van het perceel — RUP-wijziging beïnvloedt KI niet automatisch, maar wel de planbatenheffing — zie autonome heffingen)."
      - "Overgedragen heffingen, de BV. Onroerende voorheffing op de leegstaande bedrijfsruimte Aalst (Vlaams gewest, ligging-criterium, op naam van de eigenaar = de BV). Verkeersbelasting op de Audi A6 (jaarlijks, Vlaams moduleringssysteem op CO₂ + fiscaal vermogen + brandstoftype, op naam van de titularis = de BV). Verkeersbelasting op de Renault Master bestelwagen (forfait-tarief bedrijfsvoertuig, jaarlijks)."
      - "Autonome heffingen, de BV. Leegstandsheffing bedrijfsruimten op de loods Aalst. Inventaris-opname in 2024, bevestigd in 2025 en 2026 — drie opeenvolgende registraties zijn er, maar de heffing is pas effectief verschuldigd vanaf het kalenderjaar volgend op de derde opeenvolgende registratie. Eerste aanslag dus in 2027, niet in 2026. Belangrijk om in je antwoord scherp te zetten."
      - "Autonome heffingen, Wouter persoonlijk. Planbatenheffing op de grond Geraardsbergen — de schuld is ontstaan bij de definitieve goedkeuring van het RUP in 2025, op naam van Wouter als eigenaar op dat moment. Betaling wordt opgeschort tot realisatie (verkoop of omgevingsvergunning). In 2026 is dus geen contante uitgave verschuldigd, maar de fiscale schuld bestaat."
      - "Geen verkeersbelasting of BIV op de Peugeot 208 van Sofie — die wagen is in Wallonië ingeschreven, dus de Waalse heffing geldt (op Sofie als titularis), niet de Vlaamse. Voor de Vermeulen-inventaris valt dat erbuiten."
      - "BIV (eenmalig bij eerste inschrijving op naam van een nieuwe titularis) is niet relevant in 2026 — beide BV-voertuigen werden eerder ingeschreven; geen nieuwe inschrijving in 2026 vermeld in de context."
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Gewestheffingen 2026 — Wouter Vermeulen en Vermeulen Constructie BV"
        kolommen: ["Heffing", "Categorie", "Subject", "Aanleiding 2026", "Administratie"]
        rijen:
          - ["Onroerende voorheffing — woning Lier", "Overgedragen", "Wouter + Annick", "Eigenaarschap op 1 januari 2026", "Vlabel"]
          - ["Onroerende voorheffing — studio Knokke-Heist", "Overgedragen", "Wouter", "Eigenaarschap + ligging Vl", "Vlabel"]
          - ["Onroerende voorheffing — grond Geraardsbergen", "Overgedragen", "Wouter", "Eigenaarschap + ligging Vl", "Vlabel"]
          - ["Onroerende voorheffing — bedrijfsruimte Aalst", "Overgedragen", "Vermeulen Constructie BV", "Eigenaarschap + ligging Vl", "Vlabel"]
          - ["Verkeersbelasting — Audi A6 hybride", "Overgedragen", "Vermeulen Constructie BV", "Inschrijving voertuig", "Vlabel"]
          - ["Verkeersbelasting — Renault Master", "Overgedragen", "Vermeulen Constructie BV", "Inschrijving voertuig", "Vlabel"]
          - ["Leegstandsheffing bedrijfsruimten — loods Aalst", "Autonoom (Vl)", "Vermeulen Constructie BV", "**Pas vanaf aanslagjaar 2027** *(eerste effectieve heffing volgt op de derde opeenvolgende inventarisregistratie — drie opeenvolgende registraties in 2024-2025-2026, eerste aanslag dus 2027)*", "Vlabel"]
          - ["Planbatenheffing — grond Geraardsbergen", "Autonoom (Vl)", "Wouter", "Schuld ontstaan bij RUP-goedkeuring 2025; **betaling opgeschort tot realisatie** (verkoop of omgevingsvergunning)", "Vlabel"]
    valkuil_beat: "Drie klassieke fouten in een heffingen-inventaris. **Eén**: de leegstandsheffing al voor 2026 boeken in plaats van 2027 — de timing-regel 'eerste aanslag vanaf het kalenderjaar volgend op de derde opeenvolgende registratie' wordt vaak gemist. **Twee**: BIV opnemen zonder dat er een nieuwe inschrijving plaatsvindt — BIV is eenmalig per inschrijvingstitularis, niet jaarlijks. **Drie**: de planbatenheffing weglaten omdat 'er nog niets betaald moet worden' — de fiscale schuld bestaat wél, alleen de betaling is opgeschort. Voor een advies-inventaris hoort de schuld op de balans."

  - id: vraag-2-ov-vergelijking
    titel: "Vraag 2 — Bereken de onroerende voorheffing op de studio in twee scenario's (15 min)"
    instructie_beats:
      - "Stel dat Wouter de studio Knokke-Heist nu zou kunnen ruilen voor een identiek pand in Brussel-stad — zelfde kadastraal inkomen, zelfde gebruik (verhuurd aan particulieren). Bereken de jaarlijkse onroerende voorheffing in beide scenario's, met de cijfers in de opgave-tabel."
      - "Schrijf de volledige formule uit en geef de twee eindbedragen. Reken voor de indexering met indexcoëfficiënt = 2,1 (dichtbij het werkelijke 2026-cijfer; in een echte aangifte gebruik je het Cijferzakboekje)."
      - "Sluit af met één zin: welk scenario weegt zwaarder, en welk element van de formule verklaart het verschil?"
    uitwerking_beats:
      - "De formule heeft drie stappen. Eerst indexeer je het kadastraal inkomen om de inflatie sinds het referentietijdstip van de perekwatie te corrigeren. Dan past je de gewestelijke basisheffing toe op het geïndexeerde kadastraal inkomen — dat is de basis-onroerende-voorheffing. Tot slot vermenigvuldig je die basis met de opcentiemen-factor van gemeente en provincie samen."
      - "Stap 1 — indexering. 1.500 × 2,1 = 3.150 EUR geïndexeerd kadastraal inkomen. Dit is identiek voor beide scenario's omdat het kadastraal inkomen volgens de hypothese gelijk is."
      - "Stap 2 — basisheffing per gewest. Voor Knokke-Heist (Vlaams gewest): 3.150 × 3,97 % = **125,06 EUR**. Voor Brussel-stad (Brussels Hoofdstedelijk Gewest): 3.150 × 1,25 % = **39,38 EUR**. Het Vlaamse basistarief is ruim drie keer hoger dan het Brusselse."
      - "Stap 3 — opcentiemen-factor. Opcentiemen zijn vermenigvuldigers, geen procentopslagen — 950 opcentiemen betekent een factor (1 + 950/100) = 10,5. Voor Knokke-Heist tellen gemeente (950) en provincie (300) samen: (1 + (950 + 300)/100) = (1 + 12,5) = **13,5**. Voor Brussel-stad geen provincie, alleen gemeente 3.300: (1 + 3.300/100) = **34**."
      - "Stap 4 — eindfactuur. Knokke-Heist: 125,06 × 13,5 = **1.688,31 EUR**. Brussel-stad: 39,38 × 34 = **1.338,75 EUR**."
      - "Synthese in één zin: ondanks het ruim drie keer hogere Vlaamse basistarief weegt de Knokke-Heist-aanslag zwaarder dan de Brussel-stad-aanslag — het verschil komt door de **provinciale opcentiemen West-Vlaanderen** (+300) die het Brussels Hoofdstedelijk Gewest niet kent én door het feit dat Brussel-stad bij de bovenkant van de gemeentelijke opcentiemen-range zit. Een vergelijking op basis van enkel het gewestelijk basistarief zou tot het omgekeerde — en foutieve — advies leiden."
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Onroerende voorheffing — berekening twee scenario's (EUR)"
        kolommen: ["Stap", "Formule", "Knokke-Heist (Vl)", "Brussel-stad (Br)"]
        rijen:
          - ["1. Indexering KI", "niet-geïndexeerd × indexcoëfficiënt", "1.500 × 2,1 = 3.150", "1.500 × 2,1 = 3.150"]
          - ["2. Basisheffing", "geïndexeerd KI × gewest-basistarief", "3.150 × 3,97 % = 125,06", "3.150 × 1,25 % = 39,38"]
          - ["3. Opcentiemen-factor", "(1 + (gemeente + provincie) / 100)", "(1 + (950 + 300)/100) = 13,5", "(1 + 3.300/100) = 34"]
          - ["4. **Eindfactuur OV/jaar**", "basis × opcentiemen-factor", "**1.688,31**", "**1.338,75**"]
    valkuil_beat: "Twee klassieke rekenfouten. **Eén**: 950 opcentiemen lezen als 9,5 keer of als 950 % bovenop — fout. 950 opcentiemen = (1 + 950/100) = factor 10,5. **Twee**: vergeten dat het Brussels Hoofdstedelijk Gewest geen provincies meer heeft sinds 1995 — wie automatisch provinciale opcentiemen optelt aan beide kanten van de vergelijking, verstoort het resultaat. Tegenintuïtieve uitkomst van deze berekening: het 'goedkope' Brussel-basistarief levert hier de lichtere aanslag op, vooral omdat de Vlaamse provinciale opcentiemen West-Vlaanderen het verschil omkeren."

  - id: vraag-3-wettigheidstoets
    titel: "Vraag 3 — Wettigheidstoets op de hondenbelasting Stranddorp (15 min)"
    instructie_beats:
      - "Vermeulen Constructie BV verzorgt af en toe bewakingsrondes op werven met een eigen waakhond (een Belgische Mechelaar) — geen erkende bewakingsonderneming, gewoon een waakhond op naam van Wouter zelf. Stranddorp heeft een tweede verblijf van Wouter en Annick (niet in de opgave-tabel weergegeven omdat irrelevant voor de andere vragen) en Wouter heeft twee honden op dat adres ingeschreven. Hij ontvangt voor 2026 een aanslag van 150 EUR (50 + 100 EUR) op grond van het hondenreglement in de opgave-tabel."
      - "Pas de wettigheidstoets in vier opeenvolgende criteria toe op het reglement zoals het in de opgave is weergegeven. Geef per criterium een korte beoordeling. Eindig met een conclusie: op welk criterium of welke criteria faalt het reglement vermoedelijk, en wat is het juridisch effect?"
      - "Werk in een gestructureerd antwoord — vier opeenvolgende blokken — niet één vrije lopende prose."
    uitwerking_beats:
      - "Criterium 1 — formele wettigheid. Drie deelvragen. (a) Bevoegd orgaan: de gemeenteraad heeft het reglement vastgesteld op 12 januari 2026 — bevoegd orgaan, het college van burgemeester en schepenen kan dit zelf niet doen. (b) Bekendmaking: gepubliceerd op de gemeentelijke webtoepassing op 20 januari 2026, dat is de juiste sinds-Decreet-Lokaal-Bestuur-procedure. (c) Geldigheidsduur: belastingreglement vastgesteld voor het lopende dienstjaar 2026, geen vervaltermijn-probleem. **Conclusie criterium 1: OK** — het reglement is formeel correct tot stand gekomen."
      - "Criterium 2 — materiële bevoegdheid. Drie deelvragen. (a) Territoriaal: de hondenbelasting raakt honden gehouden door inwoners van Stranddorp — territoriaal binnen de gemeente. (b) Geen federale of gewestelijke materie: het houden van een hond is geen federaal of gewestelijk belastbaar feit; geen overlap met de personenbelasting of een gewestelijke heffing. (c) Fiscale autonomie hogere niveaus: geen overlap. **Conclusie criterium 2: OK** — sui-generis-heffing op een eigen feit binnen de gemeentebevoegdheid."
      - "Criterium 3 — algemene rechtsbeginselen. Hier zit het probleem. Vier deelvragen lopen we langs. (a) Gelijkheidsbeginsel: vrijstellingen voor blindengeleidehonden en assistentiehonden zijn objectief gerechtvaardigd (sociale en zorg-functie). De vrijstelling voor 'bewakingshonden gehouden door erkende zelfstandige bewakingsondernemingen' is veel verdachter — zij behandelt commerciële bewakingsbedrijven gunstiger dan particulieren met een waakhond (zoals Wouter), zonder dat het verschil tussen die twee categorieën objectief verbonden is met het doel van de heffing (overlast / gemeentelijke kost). Tenzij de motiveringsnota een sluitend onderscheid aandraagt — en de opgave vermeldt expliciet dat zo'n motivering ontbreekt — faalt deze vrijstelling op het gelijkheidsbeginsel. (b) Proportionaliteit: progressieve schijven 50 / 100 / 200 EUR zijn op zich verdedigbaar (meer honden = meer overlast), maar de schijfgrenzen moeten objectief gemotiveerd zijn — ook hier ontbreekt motivering. Twijfel. (c) Willekeur: geen scherp probleem. (d) Non-bis-in-idem: geen dubbele belasting van hetzelfde feit. **Conclusie criterium 3: vermoedelijk fail** op de gelijkheid (vrijstelling bewakingsondernemingen) en twijfel op de proportionaliteit (progressieve schijven zonder motivering)."
      - "Criterium 4 — procedureregels. Het aanslagbiljet dat Wouter ontvangt moet de verplichte vermeldingen bevatten (belastingplichtige, belastbaar feit, grondslag, tarief, betaaltermijn, bezwaarinstantie en bezwaartermijn). Op het reglement zelf is dit criterium niet ten gronde toetsbaar — pas op de individuele aanslag. **Conclusie criterium 4: niet ten gronde van toepassing op het reglement** zonder concreet biljet."
      - "Slotconclusie. Het reglement faalt vermoedelijk op criterium 3 (algemene rechtsbeginselen), vooral op de **vrijstelling voor bewakingsondernemingen** die gelijkheidsbeginsel-problemen geeft. Juridisch effect: twee parallelle wegen. (i) Wouter kan individueel bezwaar indienen tegen zijn aanslag bij het college van burgemeester en schepenen van Stranddorp binnen drie maanden vanaf de derde werkdag na verzending — hij vraagt dan nietigheid van de aanslag wegens nietigheid (door discriminatie) van het onderliggende reglement. (ii) Wie binnen 60 dagen na bekendmaking van het reglement (20 januari 2026) een vernietigingsberoep indient bij de Raad van State kan het hele reglement met terugwerkende kracht geschrapt krijgen — strategisch interessant als meerdere belastingplichtigen samenwerken; voor Wouter alleen typisch overkill."
      - "Het examen toetst zelden de vier criteria in deze diepte. Maar wie de toets in vier stappen heeft uitgevoerd, herkent een examenvraag van het type 'beoordeel of deze gemeente dit mag doen' onmiddellijk en levert een gestructureerd antwoord — niet een prose-discussie zonder hekken."
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Wettigheidstoets hondenbelasting Stranddorp 2026 — vier criteria"
        kolommen: ["Criterium", "Deeltoetsen", "Beoordeling"]
        rijen:
          - ["1. Formele wettigheid", "Bevoegd orgaan · bekendmaking · geldigheidsduur", "**OK** — gemeenteraad bevoegd, webtoepassing-bekendmaking, geldig voor 2026"]
          - ["2. Materiële bevoegdheid", "Territoriaal · geen federale/gewestelijke materie · respect autonomie hogere niveaus", "**OK** — sui-generis op eigen feit"]
          - ["3. Algemene rechtsbeginselen", "Gelijkheid · proportionaliteit · willekeur · non-bis-in-idem", "**Vermoedelijk fail** — vrijstelling bewakingsondernemingen mist objectieve rechtvaardiging (gelijkheid); progressieve schijven zonder gemotiveerde grenzen (proportionaliteit-twijfel)"]
          - ["4. Procedureregels", "Aanslagbiljet · termijn · hoorrecht", "Niet ten gronde toetsbaar op reglement zonder concreet biljet"]
    valkuil_beat: "Twee veelgemaakte fouten bij een wettigheidstoets. **Eén**: de toets vermengen met een opportuniteitsdiscussie — 'het tarief is te hoog' is geen wettigheidsbezwaar. Een tarief is pas onwettig als het kennelijk onredelijk uitvalt tegenover het doel (proportionaliteit binnen criterium 3), niet omdat het hoog is. **Twee**: de vier criteria niet apart benoemen maar 'wel of niet wettig' beoordelen — examenvraag-correctoren willen de gestructureerde vier-stappen-redenering zien. Eén faal op één criterium volstaat; alle vier moeten passeren voor wettigheid."

  - id: vraag-4-bezwaar-planbatenheffing
    titel: "Vraag 4 — Bezwaarroute planbatenheffing Geraardsbergen (15 min)"
    instructie_beats:
      - "Stel dat Wouter in oktober 2027 — twee jaar na de RUP-goedkeuring — een aanslagbiljet planbatenheffing ontvangt voor de grond Geraardsbergen, omdat hij intussen een omgevingsvergunning voor verkaveling heeft aangevraagd. Het bedrag op het biljet is hoger dan hij verwachtte: hij vermoedt dat de geraamde meerwaarde per vierkante meter te hoog is ingeschat."
      - "Beantwoord drie vragen. (a) Bij welke instantie dient Wouter het bezwaarschrift in? (b) Binnen welke termijn moet het bezwaar uiterlijk worden ingediend, en vanaf welk vertrekpunt loopt die termijn? (c) Welke twee inhoudelijke argumenten kan Wouter in zijn bezwaarschrift opnemen, gegeven de mechaniek van de planbatenheffing?"
      - "Sluit af met één zin over wat er gebeurt als Wouter in 2027 vergeet te betalen omdat hij het bezwaar heeft ingediend."
    uitwerking_beats:
      - "(a) Instantie. Planbatenheffing is een Vlaamse gewestelijke autonome heffing — rechtsgrond in de Vlaamse Codex Ruimtelijke Ordening, inning via de Vlaamse Codex Fiscaliteit. Bezwaar gaat naar **Vlabel** (Vlaamse Belastingdienst). Niet naar de gemeente Geraardsbergen (dat zou de reflex zijn omdat het reglement-feit lokaal voorvalt — maar de heffing zelf is gewestelijk), en niet naar de federale adviseur-generaal (planbatenheffing is geen federale heffing)."
      - "(b) Termijn en vertrekpunt. Vlaamse gewestbelastingen volgen de standaard-bezwaartermijn van **drie maanden vanaf de derde werkdag na verzending** van het aanslagbiljet, op straffe van verval. 'Verzending' is de datum die op het biljet zelf vermeld staat — niet de datum waarop Wouter het biljet effectief leest of opent. Praktijk-tip: noteer de drie-werkdagen-bonus, dat zijn typisch een paar extra dagen ten opzichte van de op het biljet vermelde datum."
      - "(c) Twee inhoudelijke argumenten. **Argument 1** — de **waardering van de meerwaarde**. De planbatenheffing wordt berekend op een forfaitaire meerwaarde per vierkante meter (verschil tussen oude en nieuwe bestemming). Die forfaitaire schaal staat in de decreettekst (jaarlijks geïndexeerd), maar in concrete dossiers kan de feitelijke meerwaarde afwijken — bijvoorbeeld als de grond door zijn ligging (overstromingsgebied, slechte ontsluiting, bezwarende erfdienstbaarheid) een lagere reële waarde heeft dan de forfaitaire tabel veronderstelt. Wouter kan een gemotiveerde betwisting van de waardering opnemen, met stukken (expertise, taxatieverslag, RUP-uitvoeringsfase). **Argument 2** — de **tariefschijf**. De planbatenheffing is progressief in vijf schijven (5 % tot 30 %), met jaarlijks geïndexeerde schijfgrenzen. Wouter kan controleren of zijn meerwaarde correct over de schijven is verdeeld — een rekenfout in de schijftoepassing (bv. een te hoog deel in de hoogste schijf) is een legitieme grond. Beide argumenten vragen onderbouwing met cijfers en stukken, niet een loutere verklaring van ontevredenheid."
      - "Slotzin over de betaling. **Bezwaar schorst de plicht tot betalen niet automatisch op.** Wouter blijft in principe gehouden om binnen de gewone betaaltermijn (typisch twee maanden na biljet) te betalen, terwijl het bezwaar loopt. Wil hij opschorting van de invordering, dan moet hij die expliciet en gemotiveerd vragen aan Vlabel — niet als verlengstuk van het bezwaarschrift zelf veronderstellen. Bij succes van het bezwaar krijgt hij het betaalde bedrag terug, met nalatigheids­intresten in zijn voordeel — fiscaal-neutraal, maar de liquiditeit moet beschikbaar blijven."
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Bezwaarroute planbatenheffing Geraardsbergen — schema"
        kolommen: ["Element", "Antwoord"]
        rijen:
          - ["Aard heffing", "Vlaamse gewestelijke autonome heffing — VCRO + VCF"]
          - ["Bezwaarinstantie", "Vlabel (Vlaamse Belastingdienst)"]
          - ["Bezwaartermijn", "3 maanden vanaf de derde werkdag na verzending van het aanslagbiljet, op straffe van verval"]
          - ["Vormvereisten", "Schriftelijk, gemotiveerd, ondertekend, met bewijsstukken bijgevoegd"]
          - ["Inhoudelijke argumenten", "(1) Waardering van de meerwaarde betwisten · (2) Toepassing van de tariefschijven betwisten"]
          - ["Effect op betaling", "**Niet automatisch opgeschort** — invorderings­opschorting moet expliciet en gemotiveerd worden gevraagd"]
          - ["Verdere stap bij negatieve beslissing", "Beroep bij rechtbank van eerste aanleg, fiscale kamer — termijn 3 maanden vanaf kennisgeving"]
    valkuil_beat: "Klassieke fouten bij bezwaarroutes. **Eén**: een gewestelijke heffing met federale-reflexen behandelen — een bezwaar tegen planbatenheffing bij de federale adviseur-generaal is onontvankelijk, want het is geen federale heffing. **Twee**: de termijn als 'datum biljet + 3 maanden' lezen in plaats van 'derde werkdag na verzending + 3 maanden' — drie werkdagen extra die soms net het verschil maken op het einde van de termijn. **Drie**: de bezwaarschorsing aanvaarden als evident gevolg van het indienen van een bezwaar — fout. Bezwaar schorst de betaling niet automatisch op."

  - id: vraag-5-geintegreerd-advies
    titel: "Vraag 5 — Geïntegreerd advies: schenking aan twee kinderen + verhuis-scenario (15 min)"
    instructie_beats:
      - "Wouter overweegt twee schenkingen bij leven, allebei in 2026 te realiseren: de studio Knokke-Heist aan Sofie, en de grond Geraardsbergen aan Bram. Hij hoort van vrienden dat hij 'beter zou verhuizen naar Wallonië' omdat zijn dochter daar woont en de tarieven daar 'voordeliger zouden zijn'."
      - "Geef een gestructureerd advies. (a) Welk gewest is bevoegd voor elke schenking in het basisscenario (Wouter blijft in Lier)? (b) Wat verandert er als Wouter in januari 2026 effectief naar Namen verhuist en de schenkingen daarna doet? (c) Welk risico schept een fiscale verhuis 'om de tarieven', en welk wettelijk instrument speelt daar?"
      - "Houd je advies inhoudelijk bondig — voor concrete schenkingstarieven verwijs je door naar PO 2.6, hier draait het om de bevoegdheidsregel + valkuilen."
    uitwerking_beats:
      - "(a) Basisscenario — Wouter woont in Lier. De Belgische bevoegdheidsregel voor schenkingen van onroerend goed kijkt naar de **fiscale woonplaats van de schenker** op de datum van de schenking, niet naar de begunstigde en niet naar de ligging van het pand. Beide schenkingen — studio Knokke aan Sofie en grond Geraardsbergen aan Bram — zijn dus **Vlaams** bevoegd. Sofie in Wallonië en Bram in Brussel zijn irrelevant voor de bevoegdheidsvraag. Cliëntmisverstand om vroeg recht te zetten: 'mijn dochter woont in Wallonië, dus we gaan Waalse schenkbelasting betalen' is verkeerd voor schenking van onroerend goed. Concrete Vlaamse tariefdetails (rechte lijn, schijven, gunstregimes) leven in PO 2.6."
      - "(b) Scenario met verhuis Wouter naar Namen in januari 2026. Hier komt de **vijfjaarsregel** in beeld. Voor de schenkingsbelasting telt strikt-genomen de fiscale woonplaats van de schenker op de datum van de schenking — als Wouter op 1 maart 2026 in Namen woont en op die datum schent, lijkt het op het eerste gezicht Waals bevoegd. **Maar** twee correcties spelen. **Eerst**: voor de schenkbelasting kijkt de Belgische wet bij wisseling van woonplaats tussen gewesten in de vijf jaar voor de schenking naar het gewest waar de schenker het langst woonde in die periode. In het scenario (geboren-en-getogen Vlaming Wouter die in januari 2026 naar Namen verhuist en in maart 2026 schenkt) is het langst-gewest in de vijf voorafgaande jaren overduidelijk Vlaanderen — de Vlaamse schenkbelasting blijft dus van toepassing. **Tweede**: voor erfbelasting — mocht Wouter binnen vijf jaar na de verhuis overlijden — werkt eenzelfde vijfjaarsregel. Pas na vijf volledige jaren effectief Waals verblijf wordt de Waalse erfbelasting integraal van toepassing."
      - "(c) Risico fiscale verhuis 'om de tarieven' — antimisbruik. Het algemene antimisbruik-instrument (federaal in WIB92, gewestelijk equivalent in de Vlaamse Codex Fiscaliteit) laat de administratie toe om een rechtshandeling of een geheel van rechtshandelingen die louter fiscaal gemotiveerd zijn, terzijde te schuiven. Een fictieve woonplaatsverhuis — Wouter laat zich inschrijven in Namen, maar zijn werkelijke verblijfplaats, centrum van levensbelangen en woon-werk-patroon blijven in Lier — riskeert door de administratie te worden weerlegd. Vaste rechtspraak van Cassatie bevestigt dat de **werkelijke** woonplaats zwaarder weegt dan de inschrijving in het rijksregister. Voor een geloofwaardige verhuis moet de feitelijke situatie effectief kantelen: hoofdverblijf, beroeps-activiteit, schoolgaande kinderen (n.v.t. hier, ze zijn meerderjarig), sociale verankering."
      - "Slot. Het concrete advies aan Wouter. **Eén** — laat de aanname 'Waals = goedkoper' staven met cijfers door PO 2.6 te raadplegen, niet door er blind in te geloven. Inhoudelijke tarieven leven daar. **Twee** — een verhuis nu in januari 2026, gevolgd door schenking in maart 2026, levert geen tarief-voordeel op door de vijfjaarsregel: Vlaanderen blijft bevoegd. **Drie** — een geloofwaardige verhuis vraagt vijf jaar voor de bevoegdheid voor erfbelasting kantelt, en moet feitelijk onderbouwd zijn om antimisbruik-risico te vermijden. **Vier** — overweeg een voorafgaande beslissing (ruling) bij Vlabel als de verhuis door zou gaan en de schenking vlak na de wachttermijn zou plaatsvinden — dat geeft rechtszekerheid vooraf."
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Bevoegd gewest per scenario — schenking en erfopvolging Wouter"
        kolommen: ["Transactie", "Basisscenario (Wouter in Lier)", "Wouter verhuist naar Namen jan-2026, schenkt maart-2026"]
        rijen:
          - ["Schenking studio Knokke-Heist aan Sofie", "Vlaanderen (woonplaats schenker)", "Vlaanderen (vijfjaarsregel — langst-gewest in laatste 5 jaar = Vl)"]
          - ["Schenking grond Geraardsbergen aan Bram", "Vlaanderen (idem)", "Vlaanderen (idem)"]
          - ["Erfbelasting bij overlijden Wouter < 5 j na verhuis", "Vlaanderen", "Vlaanderen (vijfjaarsregel)"]
          - ["Erfbelasting bij overlijden Wouter ≥ 5 j na verhuis (effectief verblijf in Wallonië)", "n.v.t.", "Wallonië — pas na volledige vijf jaar"]
          - ["Risico antimisbruik bij fictieve verhuis", "—", "**Reëel** — werkelijke woonplaats weegt; centrum van levensbelangen + woon-werk-patroon moeten effectief verschuiven"]
    valkuil_beat: "Drie valkuilen in vermogensplanningsadvies. **Eén**: de bevoegdheid laten afhangen van de begunstigde i.p.v. de schenker (bij schenking van onroerend goed) — fout. De schenker beslist. **Twee**: een fiscale verhuis presenteren als instant-effect — de vijfjaarsregel zet die rem op zowel schenking als erfbelasting. **Drie**: antimisbruik onderschatten — vaste Cassatie-rechtspraak laat de werkelijke woonplaats prevaleren boven de inschrijving in het rijksregister. Cliënten moeten weten dat een 'papieren verhuis' niet werkt."

# ---------------------------------------------------------------------------
# AFSLUITING
# ---------------------------------------------------------------------------

afsluiting:
  reflectie_beats:
    - "Wat heb je nu één keer zelf doorlopen: vijf scoped vragen die samen de vijf leerstukken van PO 2.7 activeren. Heffingen-inventaris op een concreet cliëntdossier, een berekening die opcentiemen-formule en gewest-vergelijking samen oefent, een vier-stappen wettigheidstoets op een mock-reglement, een Vlabel-bezwaarroute op een autonome gewestheffing, en een geïntegreerd advies dat bevoegdheid + vijfjaarsregel + antimisbruik samen weegt."
    - "Het examen zal nooit één dossier zoals dit volledig uitvragen — wel fragmenten ('welke administratie behandelt het bezwaar tegen X', 'pas de wettigheidstoets toe op reglement Y', 'is het gewest van de schenker of de begunstigde bevoegd?'). Die fragmenten landen scherper als je het hele dossier één keer hebt afgewerkt. De vijf vragen tonen ook dat de leerstukken **één denkframe** vormen, niet vijf aparte trucs."
    - "Volgende stap als dit zit: pak [[voorbeeldexamens/po-2-7|voorbeeldexamenvragen PO 2.7]] en herken de fragment-vragen, of ga naar [[studiemateriaal/2-7/samenvatting|samenvatting PO 2.7]] voor compacte herhaling vlak voor het examen."
  doelstellingen_gedekt:
    - "2.7.taak.1 — Regionale en lokale fiscaliteit identificeren en correct toewijzen aan het bevoegde niveau"
    - "2.7.taak.2 — Concrete heffingen berekenen of inschatten op cliëntdossiers (opcentiemen, planbatenheffing)"
    - "2.7.taak.3 — Wettigheid van gemeentelijke en provinciale belastingreglementen beoordelen (vier criteria)"
    - "2.7.taak.4 — Bezwaarroutes correct adresseren en termijnen respecteren"
    - "2.7.taak.5 — Geïntegreerd advies geven bij vestigingskeuze en vermogensoverdracht — bevoegdheid + samenloop + antimisbruik"
  valkuilen_geoefend:
    - "Leegstandsheffing te vroeg boeken (drie-registraties-regel niet correct toegepast)"
    - "Opcentiemen-formule verkeerd lezen (factor (1 + opc/100), geen procentopslag)"
    - "Brussels Hoofdstedelijk Gewest verwarren met de andere gewesten op provincie-niveau (geen provincies sinds 1995)"
    - "Wettigheidstoets vermengen met opportuniteitsdiscussie ('het tarief is te hoog')"
    - "Vrijstellings­categorieën in een gemeentereglement niet aan het gelijkheidsbeginsel toetsen"
    - "Bezwaarroute verkeerd adresseren (federaal vs. gewestelijk vs. lokaal)"
    - "Bezwaarschorsing verwarren met automatische opschorting van invordering"
    - "Bevoegdheid voor schenking van onroerend goed laten afhangen van de begunstigde i.p.v. de schenker"
    - "Vijfjaarsregel niet meenemen bij een fiscale verhuis tussen gewesten"
    - "Antimisbruik-risico onderschatten bij een fictieve woonplaatsverhuis"


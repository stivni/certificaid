wettelijk_fundament:
  - onderwerp: "Bevoegdheidsverdeling federaal / gewest / gemeente"
    ref: "Grondwet art. 41 + 162 + 170 + Bijzondere Financieringswet 16.01.1989 art. 3"
  - onderwerp: "Onroerende voorheffing — Vlaams basistarief en opcentiemen-mechaniek"
    ref: "Vlaamse Codex Fiscaliteit art. 2.1.4.0.1 (basistarief 3,97 %) + WIB92 art. 464/1 + VCF art. 2.1.4.0.2 (toelating opcentiemen)"
  - onderwerp: "Leegstandsheffing bedrijfsruimten — eerste effectieve heffing"
    ref: "VCF Titel 2.6, art. 2.6.7.0.1 (heffing verschuldigd vanaf het kalenderjaar volgend op de derde opeenvolgende registratie in de inventaris)"
  - onderwerp: "Planbatenheffing — rechtsgrond en mechaniek"
    ref: "Vlaamse Codex Ruimtelijke Ordening (VCRO) art. 2.6.4 t.e.m. 2.6.18; inning via VCF Titel 3"
  - onderwerp: "Wettigheidstoets gemeentelijke belastingreglementen — algemene bevoegdheid en grenzen"
    ref: "Grondwet art. 41 + 162 + 170 §3-§4; Wet 24 december 1996 betreffende de vestiging en de invordering van de provincie- en gemeentebelastingen ⚠️ te verifiëren"
  - onderwerp: "Gelijkheidsbeginsel als toets op vrijstellingen en tarieven"
    ref: "Grondwet art. 10 + 11 + 172; vaste rechtspraak Grondwettelijk Hof"
  - onderwerp: "Vlaamse bezwaartermijn gewestbelastingen"
    ref: "VCF art. 3.5.2.0.1 (3 maanden vanaf 3de werkdag na verzending aanslagbiljet, op straffe van verval)"
  - onderwerp: "Vernietigingsberoep tegen gemeentelijk reglement bij Raad van State"
    ref: "Gecoördineerde wetten Raad van State art. 14 § 1 (60 dagen vanaf bekendmaking)"
  - onderwerp: "Lokalisatie schenkbelasting onroerend goed — schenker is criterium"
    ref: "Bijzondere Financieringswet art. 5 § 2 + Wetboek Registratierechten art. 132 + VCF art. 2.7-2.8"
  - onderwerp: "Vijfjaarsregel voor schenking en erfbelasting bij wisseling van woonplaats"
    ref: "VCF art. 1.1.0.0.2, 3° (schenkbelasting); Bijzondere Financieringswet art. 5 § 2 (erfbelasting)"
  - onderwerp: "Algemene anti-misbruik-bepaling — fiscale verhuis"
    ref: "WIB92 art. 344 § 1 (federaal) + VCF art. 3.17.0.0.2 (Vlaams equivalent)"
  - onderwerp: "Werkelijke woonplaats prevaleert boven inschrijving rijksregister"
    ref: "Vaste rechtspraak van Cassatie ⚠️ te verifiëren (algemene leer bestendigd; specifieke arrestnummers worden in samenvattings- of voorbeeldexamenvragen-fase aangevuld)"


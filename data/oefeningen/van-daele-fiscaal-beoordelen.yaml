# AFSLUITING
# ---------------------------------------------------------------------------

afsluiting:
  reflectie_beats:
    - "Wat je vooral moet meenemen: PO 2.1 is een denkkader-vak. De drie-lagen-toets (Brepols → simulatie → anti-misbruik), de vier-voorwaardentest, de DVB-overweging en de bronnen-+-actoren-herkenning zijn vier instrumenten die je in een vaste volgorde toepast op elke transactie die je krijgt voorgelegd. Op examen krijg je zelden een volledig consult — wel fragmenten (één transactie, één wettekst, één procedure-vraag) waarbij je het mentale frame nodig hebt om de juiste laag te activeren."
    - "Wat opvalt bij Van Daele: drie transacties die op het eerste gezicht 'allemaal fiscale planning' lijken, vallen in drie verschillende oordelen — groen, oranje, rood. Dat patroon is geen toeval. De kleur hangt aan twee eigenschappen die je in elke planning moet wegen: is de gekozen rechtshandeling reëel (Brepols-vereiste), en zit ze niet dwars op de wets-doelstelling (anti-misbruik-grens). Wie die twee eigenschappen scherp houdt, herkent het verschil tussen planning en constructie sneller dan wie de wettekst per geval probeert te memoriseren."
    - "Wat je vermoedelijk fout deed in eerste poging: (a) transactie B oranje gekleurd omdat 'fiscaal erg voordelig' — verwarring tussen 'goedkoop' en 'misbruik'; (b) bij transactie C meteen naar de vier-voorwaardentest gegrepen zonder eerst simulatie te checken — subsidiariteits-volgorde overgeslagen; (c) bij transactie A een ruling 'overwegen maar misschien niet nodig' — onderschatting van de art. 344-risico-zwaarte; (d) synthese geschreven als samenvatting van de analyse i.p.v. als beslissings-document met scenario's en horizonnen."
  doelstellingen_gedekt:
    - "2.1.taak.1 — algemeen kader fiscaal recht situeren (bronnen-hiërarchie, actoren, beginselen)"
    - "2.1.taak.2 — vragen omtrent de fiscale beginselen beantwoorden (legaliteit, gelijkheid, niet-retroactiviteit, realiteit, territorialiteit)"
    - "2.1.taak.3 — fiscale verplichtingen toepassen op een concreet dossier (drie-transacties-pakket)"
    - "2.1.taak.4 — een beargumenteerd advies voorbereiden voor het bestuur (synthese in scenario's)"
    - "2.1.taak.5 — een aanvraag tot voorafgaande beslissing voorbereiden (DVB-overweging per transactie)"
  valkuilen_geoefend:
    - "Subsidiariteit Brepols → simulatie → SAAR → algemene anti-misbruik volgen — niet meteen naar art. 344 grijpen"
    - "Tegenbewijs in vier-voorwaardentest = contemporain (vóór de transactie) — niet construeren ná controle"
    - "DVB-ruling neutraliseert misbruik-risico voor de gepresenteerde verrichting, niet voor latere feitelijke afwijkingen"
    - "Een DVB-ruling kan niet gegeven worden voor constructies die zelf op misbruik of simulatie botsen — verwar 'geen ruling nodig' niet met 'geen ruling mogelijk'"
    - "Synthese-advies is beslissings-document met scenario's + horizonnen, geen analyse-samenvatting"
    - "Federaal ≠ alle-fiscale-recht — VLABEL is in dit dossier voor drie van de zes belasting-touchpoints de gesprekspartner"


# Oefening-script — Berkelaar-groep: internationaal advies in vijf scoped vragen
#
# Oefening voor PO 2.8 (Europees en internationaal fiscaal recht). Multi-case-
# dossier op één cliëntcontext (familie De Cock + Berkelaar Holding BV + drie
# operationele dochters + Franse VI). Vijf onafhankelijke scoped deelvragen
# activeren samen alle zes leerstukken:
#   - Vraag 1 → L2 (DBV-toewijzing arbeid) — salary split Sophie BE-NL
#   - Vraag 2 → L3 (vaste inrichting + recapture) — Franse VI Lille
#   - Vraag 3 → L4 (EU-richtlijnen + DBI) — LU-dividend onder moeder-dochter
#   - Vraag 4 → L5 (transfer pricing + corresponderende correctie) — NL→LU royalty
#   - Vraag 5 → L6 (synthese — geïntegreerd advies) — Cypriotische sub-holding case
#
# Drie pijlers (oefening-procedure):
#   1. Geen hints in opgave — feiten + cijfers, geen leerstuk-namen of techniek-namen
#   2. Realistische internationale fiscale casus — meerdere jurisdicties
#   3. Niet-voorkauwende instructie-beats — student activeert zelf de leerlaag


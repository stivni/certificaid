    Oefening-intro voor multi-case-dossier. Aankondigen: dit zijn vijf scoped
    deelvragen — examen-stijl — op één gemeenschappelijke cliëntcontext (familie
    De Cock + Berkelaar Holding BV met dochters in BE, NL en LU + Franse VI
    in oprichting). De vragen zijn onafhankelijk, je hoeft ze niet in volgorde
    te maken. Reken ca. 15-20 min per vraag — 90 minuten totaal. Expliciete
    vermelding: "doe eerst zelf, klap pas open na je eigen antwoord". Eindigend
    met motivatie — examen toetst dit type fragment-vragen één voor één;
    deze oefening laat zien dat de zes leerstukken samen één denkframe vormen.


# ---------------------------------------------------------------------------
# WETTELIJK FUNDAMENT — claims geverifieerd in de leerstukken / RAG
# ---------------------------------------------------------------------------

wettelijk_fundament:
  - onderwerp: "Onafhankelijkheidsbeginselen accountant — IESBA bedreigingen-kader (eigenbelang / zelf-toetsing / belangenbehartiging / vertrouwdheid / intimidatie) + safeguards"
    ref: "IESBA Code of Ethics (internationaal kader) + Belgisch addendum + KB 1 maart 1998 art. 9 (plichtenleer accountants — onafhankelijkheid)"
  - onderwerp: "Verboden niet-controle-diensten + cliënt-aanvaardings- en voortzettingsbeoordeling"
    ref: "ISA 220 (herzien — kwaliteitsmanagement op opdracht-niveau) + ISA 210 (overeenkomen van de voorwaarden van de controleopdracht) + ISQM 1 (kantoor-breed kwaliteitsmanagement)"
  - onderwerp: "Wettelijke controle door commissaris — benoeming + mandaat + scope"
    ref: "WVV art. 3:55 (benoeming door AV op voorstel bestuursorgaan) + art. 3:58 (mandaat 3 jaar hernieuwbaar) + art. 3:70 (wettelijke controle) + art. 3:72 (controleplicht op basis van grootte-criteria) + art. 1:24-1:26 (grootte-criteria)"
  - onderwerp: "Auditcomité — niet wettelijk verplicht voor niet-OOB; RvB neemt taken op"
    ref: "WVV art. 7:99 (auditcomité verplicht alleen voor beursgenoteerde + grote kredietinstellingen + verzekeringsondernemingen; voor andere mag de RvB taken collectief opnemen)"
  - onderwerp: "Materialiteit — auditor-judgment, benchmark + percentage + uitvoeringsmaterialiteit + drempel duidelijk kleine afwijkingen"
    ref: "ISA 320 (materialiteit bij planning en uitvoering van de controle) + ISA 200 §A26 (concept materialiteit) + ISA 450 (evaluatie van tijdens de controle geïdentificeerde afwijkingen)"
  - onderwerp: "Risico-inschatting — kennisverwerving entiteit + omgeving + interne beheersing + significante risico's"
    ref: "ISA 315 (herzien-2019 — identificatie en inschatting van risico's van een afwijking van materieel belang) §13-37 + §A190 (assertions-categorieën)"
  - onderwerp: "Audit-bewijs + 7 controlewerkzaamheden + bewijswaarde-rangorde"
    ref: "ISA 500 (audit-bewijs) §A14-A25 + ISA 330 (inspelen op risico)"
  - onderwerp: "Rechtszaken en claims — lawyer's letter als externe bevestiging"
    ref: "ISA 501 (specifieke overwegingen — rechtszaken en claims) §9-12 + ISA 580 (schriftelijke bevestigingen)"
  - onderwerp: "Schattingen — voorraad-waardering (waardevermindering tot lower of cost or NRV)"
    ref: "ISA 540 (herzien — schattingen) + CBN-advies 132/7 (waardering voorraden)"
  - onderwerp: "Externe bevestigingen — confirmaties + alternatieve werkzaamheden bij non-respons"
    ref: "ISA 505 (externe bevestigingen) §6 + §7 + §12-13"
  - onderwerp: "Controleverklaring — vier oordeel-types + beslismatrix materieel × diepgaand"
    ref: "ISA 700 (vorming van een oordeel + verklaring) + ISA 705 (aanpassingen van het oordeel — voorbehoud, afkeurend, onthouding) §7-§10 + ISA 706 (aandachtspunt-paragrafen en overige-aangelegenheden-paragrafen) + ITAA-KMO-controlenorm §119-§121"
  - onderwerp: "Verbonden partijen — transactie-verantwoording + toelichting"
    ref: "ISA 550 (verbonden partijen) + KB WVV (toelichting bij jaarrekening — verbonden-partijen-transacties)"
  - onderwerp: "Group audit — component-auditor + component-materialiteit + groep-instructie + eindverantwoordelijkheid groep-auditor"
    ref: "ISA 600 (overwegingen bij de controle van groepen — herzien)"
  - onderwerp: "Gebeurtenissen na balansdatum + going-concern"
    ref: "ISA 560 (gebeurtenissen na balansdatum) + ISA 570 (continuïteit)"
  - onderwerp: "Revisiedossier + documentatie + bewaartermijn"
    ref: "ISA 230 (documentatie) + Wet 7 december 2016 betreffende organisatie revisoraat art. 16 (10 jaar bewaartermijn)"
  - onderwerp: "Bijzondere mandaten — inbreng in natura + verslag accountant of revisor + staat A&P bestuursorgaan + limited assurance"
    ref: "WVV art. 7:7 (NV — inbreng in natura: verslag bestuursorgaan + verslag accountant of bedrijfsrevisor) + art. 5:7 (BV — analoog) + ITAA-norm inzake inbreng in natura en quasi-inbreng (gemeenschappelijke ITAA-IBR-norm)"
  - onderwerp: "Bijzondere mandaten — terbeschikkingstelling stukken aandeelhouders 15 dagen vóór AV"
    ref: "WVV art. 7:128 (kapitaalverhoging — terbeschikkingstelling stukken)"
  - onderwerp: "Communicatie governance (RvB / auditcomité)"
    ref: "ISA 260 (communicatie met de met governance belaste personen)"


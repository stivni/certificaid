# Oefening-script — Familie Verdonck-Beysens — vermogensplanning en aangifte van nalatenschap
#
# Doorgewerkte mini-case voor PO 2.6 (registratie- en successierechten).
# Andere familie dan De Wilde (voorbeeldgroep-leerstukken) zodat de student
# getoetst wordt op nieuwe cijfers. Vijf stappen: civielrechtelijke kaart →
# drie registratie-verrichtingen → aangifte van nalatenschap → tarief
# erfbelasting → planning-advies.
#
# Drie pijlers gerespecteerd:
#   1. Geen hints in opgave (geen 'eigen Geert' / 'gemeenschappelijk' labels in
#      de vermogenstabel — alleen feiten over verkrijgings-wijze + titularis)
#   2. Realistische individuele aangifte (lijst van goederen + waarde + bron;
#      geen pedagogische uitsplitsing 'wat valt waar')
#   3. Niet-voorkauwende instructies (open vragen; geen 'let op art. 33 voor
#      de lening' maar 'screen het passief op aannemelijkheid')
#
# Consistentie-toetsen door auteur uitgevoerd:
#   - Bruto eigen Geert = 120 + 210 + 360 + 90 + 30 = €810.000
#   - Passief aannemelijk = 8.500 + 3.200 + 7.500 = €19.200
#   - Netto-nalatenschap = €790.800
#   - Werkdagen-telling 2C: ma 18 → vr 22 mei 2026 = 5 werkdagen
#   - Verdeelrecht 1 % × €260.000 = €2.600 (Wallonië, art. 109 W.Reg.)
#   - Vruchtgebruik Anneke 56 j = 10,5 × 4 % = 42 % (cijferzakboekje)

meta:
  slug: verdonck-beysens-vermogensplanning
  titel: "Oefening: Familie Verdonck-Beysens — vermogensplanning en aangifte van nalatenschap"
  po: "2.6"
  cluster: registratie-en-successierechten
  beschrijving: >
    Doorgewerkte mini-case PO 2.6. Vlaams gezin met scheiding van goederen
    en gemengd vermogen verspreid over twee gewesten + familiebedrijf.
    Student loopt zelf het volledige pad: civielrechtelijke kaart van het
    vermogen, drie registratie-verrichtingen (Brussel-aankoop, Waalse
    onverdeeldheid, command-techniek), aangifte van nalatenschap simuleren
    (4 passief-posten screenen), tarief erfbelasting toepassen incl.
    fictie-bepaling levensverzekering + gunstregime familiale onderneming,
    planning-advies formuleren. Modelantwoord per stap in details-blok.
  studietijd: "75 min"
  niveau: volledig

intro:
  callout_beat: >
    Standaard oefening-intro met expliciete "doe-eerst-zelf"-instructie:
    klap pas open nadat je elke stap zelf hebt geprobeerd. Markeer dat dit
    een doorgewerkt familieadvies is, niet een toetsing op fragmenten. Het
    examen toetst zelden de volle case — wel sub-vragen op een familie-feitenkader
    (60-75 % van de 2.6-examenvragen heeft 3-5 deelvragen op één casus).
    Het volledige pad één keer doorlopen bouwt het mentale frame dat
    die fragment-vragen vereisen.


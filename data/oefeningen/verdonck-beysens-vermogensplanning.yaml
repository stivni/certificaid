# ---------------------------------------------------------------------------
# STAPPEN
# ---------------------------------------------------------------------------

stappen:

  - id: stap-1-civielrechtelijke-kaart
    titel: "Stap 1 — Civielrechtelijke kaart van het vermogen"
    instructie_beats:
      - "Maak op basis van de vermogensinventaris + het opgegeven huwelijksstelsel een kaart van het vermogen: kwalificeer elk goed als 'eigen Geert', 'eigen Anneke' of 'onverdeeldheid' (met aandeel per echtgenoot)."
      - "Wie zijn de erfgenamen van Geert bij hypothetisch overlijden (geen testament)? In welke hoedanigheid en in welke verhouding?"
      - "Wat is 'reservataire bescherming' (hervormd erfrecht 2018) en hoeveel ervan voor de afstammelingen samen?"
    uitwerking_beats:
      - "**Vertrekpunt huwelijksstelsel**: scheiding van goederen — er is **géén gemeenschap**. Elk goed is óf eigen vermogen van één van de echtgenoten óf valt in een onverdeeldheid (50/50 of andere verhouding) op basis van wie betaald heeft. Bij scheiding van goederen is er geen wettelijke vermoeden van gemeenschap; elk goed moet civielrechtelijk worden gekwalificeerd op basis van titel + financiering. Dit verschilt fundamenteel van het wettelijk stelsel waar arbeidsinkomsten gemeenschappelijk worden."
      - "**Kwalificatie per goed** (zie tabel hieronder)."
      - "**Erfgenamen Geert bij overlijden zonder testament + hervormd erfrecht 2018**: Anneke (overlevende echtgenoot) + Lukas + Marieke + Wouter (3 afstammelingen wettige). Anneke verkrijgt het **vruchtgebruik op de volledige nalatenschap** (art. 4.50 BW); de 3 afstammelingen verkrijgen de **blote eigendom in gelijke delen** (1/3 elk)."
      - "**Reservataire bescherming hervormd erfrecht 2018**: sinds 1 september 2018 is de globale reserve van afstammelingen vast op **1/2 van de fictieve massa in volle eigendom**, ongeacht het aantal kinderen (art. 4.146 BW — voorheen 1/2-2/3-3/4 afhankelijk van 1-2-3+ kinderen). Voor de afstammelingen samen: **1/2 in volle eigendom**. De andere helft (beschikbaar deel) zou Geert vrij kunnen weggeven via testament of schenking. Voor Anneke: ze heeft een eigen reserve = **vruchtgebruik op de gezinswoning + huisraad** (art. 4.150 BW), ongeacht het beschikbaar deel."
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Goed", "Kwalificatie", "Aandeel Geert", "Aandeel Anneke", "Andere"]
        rijen:
          - ["Gezinswoning Leuven", "Onverdeeldheid (gezamenlijke aankoop, beider arbeidsinkomsten)", "210.000 (50 %)", "210.000 (50 %)", "—"]
          - ["Portefeuille Argenta", "Eigen Geert (rekening op zijn naam, uit eigen arbeidsinkomsten)", "120.000", "0", "—"]
          - ["Portefeuille KBC", "Eigen Anneke (rekening op haar naam, uit eigen arbeidsinkomsten)", "0", "80.000", "—"]
          - ["Aandelen Verdonck Tuinaanleg BV", "Eigen Geert (oprichting uit eigen spaargeld 2003 — geen gemeenschap want scheiding van goederen)", "360.000 (80 %)", "0", "Bart Cools 90.000 (20 %, geen vermogen V-B)"]
          - ["Appartement Namen", "Eigen Anneke (erfenis 2015 — in onverdeeldheid met broer Pierre)", "0", "130.000 (50 %)", "Pierre 130.000 (50 %, geen vermogen V-B)"]
          - ["Tak 21-levensverzekering", "Eigen Geert (verzekeringnemer, premies uit zijn rekening Argenta)", "Reservewaarde 90.000", "0 (begunstigde, geen titularis)", "—"]
          - ["Spaarrekening Hello (gezamenlijk)", "Onverdeeldheid (ongeveer gelijke stortingen — vermoeden 50/50)", "30.000 (50 %)", "30.000 (50 %)", "—"]
          - ["**Totaal eigen + onverdeelde aandeel**", "", "**€850.000**", "**€450.000**", ""]
    valkuil_beat: "Klassieke fout: bij scheiding van goederen automatisch denken dat 'wat verdiend is tijdens het huwelijk gemeenschappelijk is'. Onjuist — die regel geldt voor het wettelijk stelsel (gemeenschap van aanwinsten). Bij scheiding van goederen blijft elke euro arbeidsinkomen eigen vermogen. Cruciaal voor stap 3: de Tak 21-premies komen uit Geerts eigen vermogen → de fictie-uitkering wordt VOLLEDIG belastbaar (niet 50 %, zoals in het wettelijk stelsel waar premies uit gemeenschap = 50 % belastbaar)."

  - id: stap-2-drie-verrichtingen
    titel: "Stap 2 — Drie registratie-verrichtingen — tarief, grondslag, termijn"
    instructie_beats:
      - "Bepaal voor elk van de drie verrichtingen (A, B, C) op tafel: welk recht is van toepassing, wat is de grondslag, welk tarief, welk bedrag? Vermeld telkens bevoegd gewest + wettelijke basis."
      - "Voor verrichting C: klopt de geplande timing (compromis vrijdag 15 mei, aanwijzing donderdag 21 mei 2026)? Reken het uit."
      - "Voor verrichting B: er is een keuze tussen twee mogelijke heffingen. Bepaal welke en motiveer."
    uitwerking_beats:
      - "**Verrichting A — Marieke koopt appartement Brussel €310.000 als enige eigen woning**."
      - "Bevoegd gewest = ligging onroerend goed = **Brussels Hoofdstedelijk Gewest**. Federaal W.Reg. (geen VCF — Brussel volgt nog federale regels)."
      - "Toepasselijk recht: **verkooprecht** (art. 44 W.Reg.) = **12,50 %** standaard tarief in Brussel."
      - "Abattement eigen woning art. 46bis W.Reg.: Marieke voldoet aan voorwaarden (natuurlijk persoon, geheelheid in volle eigendom, hoofdverblijf binnen 3 jaar, geen ander onroerend goed in volle eigendom op datum akte). Vermindering van de **grondslag** met €200.000."
      - "Berekening: 12,50 % × (€310.000 − €200.000) = 12,50 % × €110.000 = **€13.750**."
      - "Zonder abattement zou Marieke 12,50 % × €310.000 = €38.750 betalen → **besparing €25.000**."
      - ""
      - "**Verrichting B — Pierre koopt Anneke's helft Namen uit voor €130.000 (massa €260.000)**."
      - "Bevoegd gewest = ligging onroerend goed = **Waals gewest**. Federaal W.Reg. (Wallonië volgt nog federale regels)."
      - "Keuze tussen twee heffingen: (i) verkooprecht 12,50 % omdat Anneke een vermogensbestanddeel verkoopt aan Pierre? (ii) verdeelrecht 1 % omdat het gaat om uittreding uit een onverdeeldheid?"
      - "**Correcte heffing = verdeelrecht** (art. 109 W.Reg.) — Pierre is **mede-eigenaar** van het appartement (onverdeeldheid sinds erfenis 2015), dus de uittreding van Anneke is geen 'verkoop aan een derde' maar een **verdeling van onverdeeldheid**. Verdeelrecht geldt zodra een mede-eigenaar uittreedt en het goed integraal bij de andere mede-eigenaar(s) belandt."
      - "Tarief = **1 %** (Wallonië + Brussel — art. 109 W.Reg.). Vergelijk: Vlaanderen = 2,5 % (art. 2.10.4.0.1 VCF)."
      - "**Grondslag = volledige verkoopwaarde van het onverdeelde goed (de 'massa')** = €260.000, NIET het aandeel dat overdraagt. Dit is een belangrijk verschil: bij verkooprecht zou de grondslag de prijs van de helft (€130.000) zijn; bij verdeelrecht is het de hele waarde."
      - "Berekening: 1 % × €260.000 = **€2.600**."
      - "Vergelijkings-rekensom (als fiscus zou herkwalificeren naar verkooprecht): 12,50 % × €130.000 = €16.250 → besparing van €13.650 door correcte kwalificatie verdeelrecht."
      - ""
      - "**Verrichting C — Aanwijzing van lastgever (command-techniek) — terrein Andenne €180.000**."
      - "Bevoegd gewest = ligging onroerend goed = **Waals gewest** (Andenne ligt in provincie Namen, Waals gewest)."
      - "Toepasselijke termijn-regel voor aanwijzing van lastgever: **art. 159, 1°, b W.Reg.** (Brussel + Wallonië, niet-VCF) = **uiterlijk de vijfde werkdag na het compromis**. (Niet de Vlaamse/federale eerste-werkdag-regel art. 158, 1°, c W.Reg./art. 2.9.6.0.1 VCF — die geldt alléén in Vlaanderen.)"
      - "Werkdagen-telling vanaf compromis vrijdag 15 mei 2026:"
      - "1e werkdag = maandag 18 mei · 2e = dinsdag 19 mei · 3e = woensdag 20 mei · 4e = donderdag 21 mei · 5e = vrijdag 22 mei."
      - "Aanwijzing geplande **donderdag 21 mei = 4e werkdag → BINNEN de Waalse termijn** (1 dag marge tot vrijdag 22 mei)."
      - "Indien voorwaarden vervuld (clausule in compromis + authentieke aanwijzingsakte + tijdig geregistreerd): **aanwijzingsakte = vast recht €50** + **verkoopakte aan Verdonck Tuinaanleg BV = éénmaal verkooprecht** 12,50 % × €180.000 = **€22.500**."
      - "Bij gemiste termijn: aanwijzing wordt fiscaal als wederverkoop behandeld → **tweemaal verkooprecht** (eerst Tom betaalt op compromis, dan Verdonck Tuinaanleg betaalt op aanwijzingsakte) = 2 × €22.500 = €45.000."
      - "Strategische opmerking: had de transactie in Vlaanderen plaatsgevonden (eerste-werkdag-regel), dan was de geplande timing **drie werkdagen te laat** geweest. Het gewest van ligging is dus cruciaal voor de termijn-keuze."
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Verrichting", "Heffing", "Grondslag", "Tarief", "Bedrag (€)"]
        rijen:
          - ["(A) Marieke koopt Brussel — eigen woning", "Verkooprecht art. 44 W.Reg. + abattement art. 46bis", "310.000 − 200.000 = 110.000", "12,50 %", "**13.750**"]
          - ["(B) Pierre koopt Anneke's helft Namen", "Verdeelrecht art. 109 W.Reg. (Wallonië)", "260.000 (massa volledige goed)", "1 %", "**2.600**"]
          - ["(C-tijdig) Aanwijzing + verkoop Andenne", "Verkooprecht art. 44 W.Reg. + vast recht aanwijzing", "180.000", "12,50 % + €50 vast", "**22.550**"]
          - ["(C-laattijdig) Tweemaal verkooprecht als termijn gemist", "Verkooprecht × 2 op compromis + aanwijzing", "180.000 × 2", "12,50 % × 2", "45.000"]
      - type: tabel-inline
        kolommen: ["Werkdag", "Datum", "Status"]
        rijen:
          - ["Compromis", "vrijdag 15 mei 2026", "Start termijn (= dag 0)"]
          - ["1e werkdag", "maandag 18 mei 2026", "Vlaanderen-deadline overschreden ❌ (federaal art. 158 = uiterlijk hier)"]
          - ["2e werkdag", "dinsdag 19 mei 2026", "—"]
          - ["3e werkdag", "woensdag 20 mei 2026", "—"]
          - ["4e werkdag", "**donderdag 21 mei 2026**", "**Gepland aanwijzing — BINNEN Waalse termijn ✅**"]
          - ["5e werkdag", "vrijdag 22 mei 2026", "Laatste Waalse termijn (art. 159 W.Reg.)"]
    valkuil_beat: "Drie typische valstrikken in deze stap. (1) Verrichting B als verkooprecht behandelen — verkeerd: zodra het gaat om uittreding uit een onverdeeldheid is het altijd verdeelrecht, ook als één partij effectief 'koopt' van de andere. (2) Verrichting B-grondslag op €130.000 zetten — verkeerd: verdeelrecht slaat op de massa €260.000. (3) Verrichting C met de Vlaamse eerste-werkdag-regel rekenen omdat 'de BV in Vlaanderen zit' — verkeerd: termijn-regel volgt de ligging van het onroerend goed (= Wallonië), niet de zetel van de koper. Met de Waalse vijfde-werkdag-regel is donderdag 21 mei nog binnen termijn (4e werkdag); met de Vlaamse eerste-werkdag-regel zou het 3 werkdagen te laat zijn."

  - id: stap-3-aangifte-nalatenschap
    titel: "Stap 3 — Aangifte van nalatenschap — bevoegd gewest, termijn, actief, passief, netto"
    instructie_beats:
      - "Geert overlijdt op 10 september 2026. Bepaal: bevoegd gewest, termijn voor indiening aangifte, termijn voor betaling erfbelasting, en wie aangifteplichtig is."
      - "Stel het bruto-actief van Geerts nalatenschap op. Vergeet de fictiebepalingen niet."
      - "Screen de vijf vermeende passief-posten op aannemelijkheid (art. 2.7.3.4.1 VCF / art. 27 + 33 W.Succ.). Welke posten zijn aannemelijk, welke niet, en met welke motivering? Wees alert bij de lening van Lukas."
      - "Bereken de netto-nalatenschap."
    uitwerking_beats:
      - "**Bevoegd gewest** (art. 5/1 VCF) = gewest van **fiscale woonplaats erflater** = Vlaanderen (Geert woonde sinds 1996 in Leuven). Beheerd door **Vlabel**, niet door FOD Financiën. Cruciaal: ligging van het onroerend goed (Namen-aandeel Anneke is geen issue — het was geen vermogen van Geert; Wallonië-terrein is niet aangekocht) speelt geen rol voor de bevoegdheid bij erfbelasting."
      - "**Termijn aangifte** = 4 maanden vanaf overlijden bij overlijden in het Rijk (art. 3.3.1.0.6 VCF). Overlijden 10-09-2026 → uiterlijk **10-01-2027** (4 maanden later)."
      - "**Termijn betaling erfbelasting** = 2 maanden na verstrijken aangiftetermijn (art. 3.10.4.4.1 VCF) → uiterlijk **10-03-2027**."
      - "**Aangifteplichtigen** (art. 3.3.1.0.5 VCF): erfgenamen + algemene legatarissen + algemene begiftigden. Hier — geen testament, geen legaten — zijn dat: **Anneke + Lukas + Marieke + Wouter**. Anneke verkrijgt vruchtgebruik op het geheel (overlevende echtgenoot, art. 4.50 BW). De drie afstammelingen verkrijgen blote eigendom in gelijke delen."
      - ""
      - "**Bruto-actief Geerts nalatenschap** (alleen eigen vermogen Geert + onverdeelde aandelen Geert, want **scheiding van goederen** — geen helft-gemeenschap zoals bij wettelijk stelsel):"
      - "1. Portefeuille Argenta (eigen Geert): €120.000"
      - "2. Onverdeeld aandeel gezinswoning Leuven (Geert 50 %): €210.000"
      - "3. Aandelen Verdonck Tuinaanleg BV (eigen Geert 80 %): €360.000"
      - "4. Onverdeeld aandeel spaarrekening Hello (Geert 50 %): €30.000"
      - "5. **Fictie-uitkering Tak 21-levensverzekering aan Anneke** (art. 2.7.1.0.6 VCF): reservewaarde €90.000. Premies werden betaald uit Geerts eigen vermogen (zijn Argenta-rekening). Bij scheiding van goederen geldt **géén 50 %-halvering** zoals bij wettelijk stelsel — de fictie-uitkering is **volledig** belastbaar als legaat aan Anneke. → **€90.000**."
      - "**Bruto-totaal: €120.000 + €210.000 + €360.000 + €30.000 + €90.000 = €810.000**"
      - ""
      - "**Screening passief** (art. 2.7.3.4.1 VCF — limitatieve lijst: begrafeniskosten + schulden bestaande op overlijdens-datum; art. 33 W.Succ./VCF — uitzonderingen voor leningen bij erfgenaam):"
      - "**Post 1 — Begrafeniskosten €8.500**: AANGENOMEN (art. 2.7.3.4.1 VCF — begrafeniskosten zonder plafond). Klassiek aannemelijk passief."
      - "**Post 2 — Achterstallige inkomstenbelasting €3.200**: AANGENOMEN (art. 27, 1° W.Succ./art. 2.7.3.4.1 VCF — schuld bestond op overlijdens-datum, aanslagbiljet dateert van 12-07-2026, dus vóór 10-09-2026)."
      - "**Post 3 — Ereloon notaris attest erfopvolging + aangifte €1.800**: NIET AANGENOMEN. De schuld ontstaat ná het overlijden (factuur 25-09-2026 — nodig voor administratieve afhandeling, niet voor begrafenis). Klassieke valstrik: het is geen begrafeniskost en het is geen schuld die op overlijdens-datum bestond."
      - "**Post 4 — Lening van Lukas €15.000 (renovatie keuken + badkamer gezinswoning, gedocumenteerd)**: dit is de subtiele post."
      - "Algemene regel: leningen bij erfgenamen worden door art. 33 W.Succ./art. 2.7.3.4.1 VCF in beginsel **niet aanvaard** als passief (om constructies te vermijden waar erfgenamen fictieve schulden creëren)."
      - "Uitzondering art. 33, 2°: lening bij erfgenaam **wel aanvaard** als de gelden bewijsbaar besteed werden aan een goed dat in de nalatenschap valt (verbetering van nalatenschapsgoed). Hier: lening 2023 voor renovatie gezinswoning, gedocumenteerd met bankafschriften + facturen."
      - "Complicatie: de gezinswoning valt slechts voor **50 %** in Geerts nalatenschap (onverdeeldheid Geert/Anneke). De renovatie verbeterde dus voor 50 % een goed in nalatenschap (Geerts onverdeelde helft) en voor 50 % een goed buiten nalatenschap (Anneke's onverdeelde helft)."
      - "**Defensieve interpretatie**: pro-rata aanvaarden voor 50 % = **€7.500 AANGENOMEN**. De andere €7.500 = niet-aannemelijk omdat het een verbetering van een goed buiten de nalatenschap betreft."
      - "**Post 5 — Gasketel €2.400 (geleverd + betaald door Anneke 5 oktober 2026)**: NIET AANGENOMEN. Schuld ontstond ná overlijden (levering + factuur 30-09 + betaling 05-10), geen schuld erflater op datum overlijden + geen begrafeniskost. Bovendien: betaald door Anneke uit eigen middelen — verbetering van een goed dat slechts voor 50 % in de nalatenschap valt + tijdens periode dat Anneke het volle vruchtgebruik heeft. Geen aanleiding voor aftrek."
      - ""
      - "**Passief aannemelijk totaal: €8.500 + €3.200 + €7.500 = €19.200**"
      - "**Netto-nalatenschap Geert: €810.000 − €19.200 = €790.800**"
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Bruto-actief post", "Bedrag (€)", "Wettelijke basis"]
        rijen:
          - ["Portefeuille Argenta (eigen Geert)", "120.000", "Eigen vermogen — art. 2.7.3.2.1 VCF"]
          - ["50 % gezinswoning Leuven (onverdeeld aandeel Geert)", "210.000", "Eigen aandeel uit onverdeeldheid"]
          - ["80 % aandelen Verdonck Tuinaanleg BV", "360.000", "Eigen vermogen — uit oprichting 2003"]
          - ["50 % spaarrekening Hello", "30.000", "Vermoeden gelijke storting — onverdeeldheid"]
          - ["Tak 21 fictie-uitkering aan Anneke", "90.000", "Fictiebepaling art. 2.7.1.0.6 VCF — volledig (premies eigen)"]
          - ["**Bruto-totaal**", "**810.000**", ""]
      - type: tabel-inline
        kolommen: ["#", "Post", "Bedrag (€)", "Aannemelijk?", "Motivering"]
        rijen:
          - ["1", "Begrafeniskosten", "8.500", "✅ JA — 8.500", "Art. 2.7.3.4.1 VCF — begrafeniskosten zonder plafond"]
          - ["2", "Achterstallige inkomstenbelasting 2025", "3.200", "✅ JA — 3.200", "Art. 27, 1° W.Succ./VCF — schuld bestaand op overlijdens-datum (aanslag 12-07-2026 < 10-09-2026)"]
          - ["3", "Ereloon notaris voor attest erfopvolging + aangifte", "1.800", "❌ NEE", "Schuld ontstaan ná overlijden (factuur 25-09-2026); geen begrafeniskost; klassieke valstrik"]
          - ["4", "Lening Lukas voor renovatie gezinswoning (2023, gedocumenteerd)", "15.000", "⚖️ DEELS — 7.500 pro-rata", "Art. 33, 2° W.Succ./art. 2.7.3.4.1 VCF — uitzondering voor lening bij erfgenaam mits bestemming nalatenschapsgoed. Gezinswoning slechts 50 % in nalatenschap (onverdeeldheid) → pro-rata 50 %"]
          - ["5", "Aankoop gasketel oktober 2026 (Anneke betaalt)", "2.400", "❌ NEE", "Geen schuld op overlijdens-datum + geen begrafeniskost; betaald door overlevende echtgenoot na overlijden"]
          - ["**Totaal aanvaard passief**", "", "**19.200**", "", ""]
      - type: tabel-inline
        kolommen: ["Berekening", "Bedrag (€)"]
        rijen:
          - ["Bruto-actief", "810.000"]
          - ["Aannemelijk passief", "−19.200"]
          - ["**Netto-nalatenschap Geert**", "**790.800**"]
    valkuil_beat: "Vier valstrikken in deze stap. (1) Een 'helft van de gemeenschap' aan de nalatenschap toevoegen — onjuist bij scheiding van goederen, daar bestaat geen gemeenschap. Alleen Geerts eigen vermogen + zijn aandeel in onverdeeldheden valt in de nalatenschap. (2) De Tak 21-fictie voor 50 % belastbaar maken — die halvering geldt alléén bij premies uit gemeenschapsvermogen (wettelijk stelsel). Bij scheiding van goederen = volledig belastbaar. (3) Het ereloon voor het attest van erfopvolging als passief aanvaarden — klassieke examen-valstrik. (4) De lening Lukas integraal aanvaarden — onjuist want art. 33, 2° vereist bestemming voor een nalatenschapsgoed, en de gezinswoning is maar voor 50 % in nalatenschap → pro-rata defensieve aanpak."

  - id: stap-4-tarief-erfbelasting
    titel: "Stap 4 — Tarief erfbelasting toepassen — devolutie, gunstregime, vrijstelling gezinswoning, fictiebepaling"
    instructie_beats:
      - "Verdeel de netto-nalatenschap (€790.800) tussen de erfgenamen rekening houdend met: hervormd erfrecht 2018 (vruchtgebruik echtgenoot + blote eigendom afstammelingen), vrijstelling gezinswoning Anneke, gunstregime familiale onderneming, fictie-legaat levensverzekering."
      - "Bepaal voor elke erfgenaam (Anneke / Lukas / Marieke / Wouter) op welke goederen welk tarief van toepassing is. Toets ook de voorwaarden voor het gunstregime familiebedrijf — kwalificeert Verdonck Tuinaanleg BV op basis van de gegeven feiten?"
      - "Gebruik voor de vruchtgebruik-kapitalisatie de coëfficiënt voor 56-jarige (Cijferzakboekje VCF art. 2.7.3.3.2): forfait vruchtgebruik = 10,5 × 4 % = **42 %** (blote eigendom = 58 %)."
      - "Geef per erfgenaam een tariefoverzicht (geen exacte euro-precisie nodig op de progressieve schalen — de werkwijze is wat telt)."
    uitwerking_beats:
      - "**Devolutie hervormd erfrecht 2018** (geen testament, art. 4.50 BW): Anneke (overlevende echtgenoot) krijgt **vruchtgebruik op de volledige netto-nalatenschap**. Lukas + Marieke + Wouter krijgen **blote eigendom in 3 gelijke delen** (€263.600 per kind in blote eigendom, vóór fiscale opdeling)."
      - ""
      - "**Drie bijzondere regimes spelen tegelijk** — opsplitsing van de €790.800 in drie pakketten:"
      - ""
      - "**Pakket A — Vrijstelling gezinswoning voor Anneke (art. 2.7.6.0.3 VCF)**: Geerts onverdeeld aandeel gezinswoning Leuven = €210.000. Anneke (overlevende echtgenoot) is voor haar verkrijging op de gezinswoning **volledig vrijgesteld van erfbelasting**, ongeacht of ze vruchtgebruik of volle eigendom verwerft. Voor de blote eigendom van de kinderen op deze €210.000 geldt de vrijstelling NIET — zij betalen tarief rechte lijn op hun aandeel in de blote eigendom van Geerts helft (€210.000 × 58 % blote eigendom = €121.800, verdeeld over 3 = €40.600 per kind)."
      - ""
      - "**Pakket B — Gunstregime familiale onderneming (art. 2.7.4.2.2 VCF)**: aandelen Verdonck Tuinaanleg BV = €360.000."
      - "Voorwaarden te toetsen op de gegeven feiten:"
      - "(i) **Familiale vennootschap**: ≥ 50 % aandelen in handen van schenker/erflater + familie? → Geert alleen 80 % → **ja**. Externe partner Bart 20 % verstoort niet (minderheidsbelang)."
      - "(ii) **Reële economische activiteit**: tuinaanleg + 8 werknemers + in groei → activiteit ≥ aandelen vast in eigen bedrijfsuitoefening + arbeidsverdeling → géén patrimonium-vennootschap → **ja**."
      - "(iii) **Continuïteits- + participatie-voorwaarde** (3 jaar na overlijden): erfgenamen moeten activiteit voortzetten + ≥ 50 % aandelen binnen familie houden. Dit moet gecontroleerd worden achteraf via attest (Vlabel). Toezegging in aangifte → gunstregime toepasbaar."
      - "**Tarief gunstregime**: **3 % rechte lijn** (vlak tarief, niet progressief — art. 2.7.4.2.2 VCF). De kinderen verkrijgen blote eigendom op deze aandelen: €360.000 × 58 % = €208.800, verdeeld over 3 kinderen = €69.600 per kind in blote eigendom. Tarief: 3 % × €69.600 = **€2.088 per kind** (totaal kinderen: €6.264). Anneke's vruchtgebruik op deze aandelen: €360.000 × 42 % = €151.200; tarief: 3 % × €151.200 = **€4.536** (Anneke)."
      - ""
      - "**Pakket C — Fictie-legaat levensverzekering aan Anneke (art. 2.7.1.0.6 VCF)**: €90.000 belastbaar bij Anneke als fictie-legaat — niét bij de kinderen. Anneke betaalt erfbelasting op €90.000 in volle eigendom (geen vruchtgebruik-opsplitsing want fictie-legaat = volle eigendom verkrijging)."
      - "Tarief rechte lijn art. 2.7.4.1.1 VCF: 3 % tot €50.000 + 9 % op €50.000-€250.000 + 27 % boven €250.000. Hier: 3 % × €50.000 + 9 % × €40.000 = €1.500 + €3.600 = **€5.100** (Anneke)."
      - ""
      - "**Pakket D — Rest van de nalatenschap onder gewone tarieven rechte lijn**: portefeuille Argenta €120.000 + onverdeeld spaargeld €30.000 = €150.000. Anneke (vruchtgebruik 42 %): €150.000 × 42 % = €63.000. Kinderen (blote eigendom 58 %, samen): €150.000 × 58 % = €87.000, verdeeld over 3 = €29.000 per kind."
      - "Tarief rechte lijn op deze €63.000 voor Anneke: 3 % × €50.000 + 9 % × €13.000 = €1.500 + €1.170 = **€2.670**."
      - "Tarief rechte lijn per kind op €29.000 (+ €40.600 uit pakket A blote eigendom) = totaal blote eigendom-verkrijging per kind in gewoon tarief = €29.000 + €40.600 = **€69.600 per kind**. Tarief: 3 % × €50.000 + 9 % × €19.600 = €1.500 + €1.764 = **€3.264 per kind** (totaal kinderen: €9.792)."
      - ""
      - "**Totaal-overzicht erfbelasting Geert** — alle pakketten samengeteld (indicatief, exact resultaat hangt af van precies-gehanteerde vruchtgebruik-kapitalisatie + tariefschijven):"
      - "Anneke: pakket A €0 (vrijstelling gezinswoning) + pakket B (gunstregime aandelen) €4.536 + pakket C (fictie-legaat Tak 21) €5.100 + pakket D (gewoon tarief portefeuille + spaar) €2.670 = **±€12.300 totaal**."
      - "Per kind (Lukas, Marieke, Wouter): pakket A (blote eigendom gezinswoning, gewoon tarief) + pakket B (gunstregime aandelen 3 %) €2.088 + pakket D (blote eigendom portefeuille + spaar, gewoon tarief) = de gezamenlijke gewoon-tarief-grondslag per kind is €69.600 → erfbelasting per kind ≈ €3.264 (gewoon) + €2.088 (gunstregime) = **±€5.350 per kind**."
      - "Totaal alle erfgenamen: ±€12.300 + 3 × €5.350 = **±€28.350**."
    uitwerking_visualisaties:
      - type: tabel-inline
        kolommen: ["Verkrijging", "Bedrag (€)", "Regime", "Tarief", "Erfbelasting (€)"]
        rijen:
          - ["**ANNEKE**", "", "", "", ""]
          - ["Vruchtgebruik gezinswoning (42 % × 210.000)", "88.200", "Vrijstelling overlevende echtgenoot art. 2.7.6.0.3 VCF", "0 %", "**0**"]
          - ["Vruchtgebruik aandelen Verdonck Tuinaanleg (42 % × 360.000)", "151.200", "Gunstregime familiale onderneming art. 2.7.4.2.2 VCF", "3 % vlak", "**4.536**"]
          - ["Vruchtgebruik portefeuille + spaargeld (42 % × 150.000)", "63.000", "Gewoon tarief rechte lijn art. 2.7.4.1.1 VCF", "Progressief 3-9-27 %", "**±2.670**"]
          - ["Fictie-legaat Tak 21 (volle eigendom)", "90.000", "Gewoon tarief rechte lijn (geen vrijstelling want geen gezinswoning + geen aandelen familiebedrijf)", "Progressief 3-9-27 %", "**±5.100**"]
          - ["**Subtotaal Anneke**", "", "", "", "**±12.300**"]
          - ["**LUKAS / MARIEKE / WOUTER (per kind)**", "", "", "", ""]
          - ["Blote eigendom gezinswoning + portefeuille + spaargeld (58 % gecombineerd)", "69.600", "Gewoon tarief rechte lijn art. 2.7.4.1.1 VCF", "Progressief 3-9-27 %", "**±3.264**"]
          - ["Blote eigendom aandelen Verdonck Tuinaanleg (58 % × 360.000 / 3)", "69.600", "Gunstregime familiale onderneming art. 2.7.4.2.2 VCF", "3 % vlak", "**2.088**"]
          - ["**Subtotaal per kind**", "", "", "", "**±5.352**"]
          - ["**TOTAAL ERFBELASTING (alle erfgenamen)**", "", "", "", "**±28.350**"]
    valkuil_beat: "Drie valstrikken. (1) Het gunstregime erfbelasting familiebedrijf-aandelen heeft een **vlak tarief 3 %** rechte lijn (en 7 % anderen) — niet de progressieve schalen 3-9-27 %. Studenten passen vaak per ongeluk de progressieve onroerende schenkings-schalen 3-9-18-27 % toe. (2) De vrijstelling gezinswoning art. 2.7.6.0.3 VCF geldt **alléén voor de overlevende echtgenoot** — niet voor de blote-eigendom-verkrijging van de kinderen op de gezinswoning. Veel studenten denken dat 'de gezinswoning vrijgesteld is voor iedereen'. (3) Vergeet niet dat Anneke's vruchtgebruik gekapitaliseerd wordt voor de erfbelasting (forfaitair op basis van leeftijd, niet op werkelijke contante waarde). Bij 56 jaar: coëfficiënt 10,5 × 4 % = 42 % vruchtgebruik / 58 % blote eigendom."

  - id: stap-5-planning-advies
    titel: "Stap 5 — Planning-advies voor Anneke + kinderen (3 voorstellen)"
    instructie_beats:
      - "Na verwerking van Geerts overlijden zit Anneke (56 j) met een vermogen bestaande uit haar eigen €450.000 + vruchtgebruik op Geerts €790.800 (effectief gekapitaliseerd 42 % = ±€332.000) + €0 deelname appartement Namen (intussen verkocht aan Pierre)."
      - "Formuleer drie planning-voorstellen voor de overlevende fase: hoe kan Anneke + de drie kinderen zich voorbereiden op haar latere overlijden, met aandacht voor de aandelen Verdonck Tuinaanleg (in vruchtgebruik bij haar, blote eigendom bij de kinderen)?"
      - "Per voorstel: instrument(en), motivering, voor- en nadelen, kritische voorwaarden of tijdshorizon."
    uitwerking_beats:
      - "**Voorstel 1 — Schenking met voorbehoud van vruchtgebruik door Anneke aan de kinderen (portefeuille KBC + eventueel spaarrekening)**."
      - "Instrument: notariële schenking met voorbehoud van vruchtgebruik over haar eigen portefeuille KBC €80.000."
      - "Motivering: roerende schenking met notariële akte → tarief 3 % rechte lijn Vlaanderen (art. 2.8.4.1.1 § 2 VCF) = €2.400 in totaal. Vergelijk met later via erfbelasting: progressieve schalen tot 27 % → potentieel meer. Voorbehoud van vruchtgebruik: Anneke houdt opbrengsten (dividenden, intresten) en stemrecht op aandelen."
      - "Voorwaarden + tijdshorizon: registratie verplicht (verschillend dan bij notariële akte gerealiseerd). Aandacht voor fictie-bepaling 3 jaar (art. 2.7.1.0.5 VCF): bij niet-geregistreerde schenking (handgift, bankgift) telt schenking nog tot nalatenschap als schenker binnen 3 jaar overlijdt. Notariële schenking = registratie inbegrepen → ontsnapt aan fictie."
      - "Nadeel: 3 % is reëel betaalde belasting (niet besparing = volledig vermijdbaar). Niet doen als horizon Anneke nog erg lang is en risico onbestaand."
      - ""
      - "**Voorstel 2 — Herziening Tak 21 + 'cascade'-begunstiging via een nieuwe levensverzekering Anneke**."
      - "Instrument: nieuwe levensverzekering door Anneke aangegaan, kinderen als begunstigden in gelijke delen."
      - "Motivering: levensverzekering biedt flexibiliteit (begunstiging eenzijdig wijzigbaar door verzekeringnemer) + opbrengsten Tak 21-conform belast (RV 30 % bij afkoop binnen 8 jaar; nul na 8 jaar)."
      - "Aandachtspunt fictie-uitkering art. 2.7.1.0.6 VCF: bij overlijden Anneke wordt de uitkering aan de kinderen óók fictie-legaat → erfbelasting verschuldigd op tarief rechte lijn. Voordeel t.o.v. behoud roerend in haar eigen vermogen: progressie-spreiding mogelijk via meerdere begunstigden, of via tussentijdse opname Anneke."
      - "Strategische valstrik: dezelfde fictiebepaling die Geerts oorspronkelijke Tak 21 belastbaar maakte ten gunste van Anneke (€90.000 aan tarief 3 + 9 %). Levensverzekering is geen toverstaf — fictie-aanstrijking houdt het belastbaar."
      - ""
      - "**Voorstel 3 — Versterking gunstregime familiale onderneming + geleidelijke aandelen-overdracht**."
      - "Instrument: Anneke + kinderen vragen formeel attest gunstregime aan Vlabel (volgt op aangifte van nalatenschap, post-overlijden) zodat het 3 %-tarief voor de blote-eigendom-verkrijging van de aandelen Verdonck Tuinaanleg definitief vastligt. Daarna: continueren van de activiteit + ≥ 50 % familiebezit gedurende 3 jaar (voorwaarde gunstregime — anders herziening met progressief tarief)."
      - "Op middellange termijn: schenking door Anneke (in vruchtgebruik) + kinderen (in blote eigendom) van bijkomende aandelen (indien Anneke nog uitbreiding-belang heeft via dividenden uit haar vruchtgebruik) — gunstregime art. 2.8.6.0.3 VCF biedt 0 % schenkbelasting indien voorwaarden vervuld. Voordeel: anticipatie op generatiewissel zonder fiscale kost; nadeel: complexiteit + noodzaak om Lukas (werkt al in bedrijf) anders te behandelen dan Marieke + Wouter (geen actieve rol). Optioneel: certificering van aandelen via Stichting Administratiekantoor (STAK) → familiale zeggenschap losgekoppeld van eigendom — instrument voor lange-termijn-controle."
      - "Voorwaarde: ondertekening continuïteits-attest binnen 3 jaar na overlijden Geert. Mislukt continuïteit → herziening tarief (van 3 % vlak naar progressief 3-27 % rechte lijn op €360.000 = ±€54.000 — substantieel risico)."
      - ""
      - "**Niet-voorstel (bewust)**: huwelijksvermogensrechtelijke herzieningen (verblijvings-beding, finaal verrekenbeding) zijn voor Anneke niet meer relevant — het stelsel scheiding van goederen is met Geert's overlijden 'uitgewerkt'. Voor een eventueel hernieuwd huwelijk: nieuwe analyse, niet hier."
      - "**Niet-voorstel (bewust)**: het appartement Namen speelt geen rol in de planning Anneke — zij was uitgetreden uit de onverdeeldheid (verrichting B) vóór Geerts overlijden. Het goed bevindt zich nu volledig in Pierre's vermogen."
    valkuil_beat: "Drie subtiele valstrikken in de planning. (1) De gunstregime familiale onderneming heeft TWEE varianten — schenking (0 %) en erfopvolging (3 %). Veel adviseurs vergeten dat het 0 %-tarief in een schenkings-scenario potentieel veel waardevoller is, maar dat vereist dat schenker tijdens leven schenkt + 3 jaar overleeft. (2) Levensverzekering wordt vaak als 'belastingvrije overdracht' verkocht — fout. Art. 2.7.1.0.6 VCF onderwerpt de uitkering aan tarief rechte lijn alsof het een legaat is. (3) Stichting Administratiekantoor (STAK) en certificering zijn diepe instrumenten — passen bij grote familiale structuren, maar zijn voor een kleine ondernemende familie zoals Verdonck-Beysens (€450k bedrijf, 8 werknemers) doorgaans disproportioneel. Behoedzaam voorstellen."


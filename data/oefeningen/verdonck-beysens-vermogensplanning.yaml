      Voor de stappen 3, 4 en 5 werken we met een hypothetisch overlijdens-scenario.
      Stel: Geert overlijdt onverwacht thuis in Leuven op **10 september 2026**
      (na een hartstilstand). Geen testament — wettelijke devolutie speelt.
      Hervormd erfrecht 2018 van toepassing. Op datum overlijden:
      - geen schenkingen gerealiseerd door Geert sinds 2015 (de levensverzekering
        bestaat sinds 2012; aandelen Verdonck Tuinaanleg nooit geschonken)
      - vermogensinventaris zoals hierboven
      - de drie verrichtingen uit "Drie verrichtingen op tafel" zijn op
        overlijdens-datum NIET meer gerealiseerd (Marieke heeft nog niet gekocht;

wettelijk_fundament:
  - onderwerp: "Stelsel scheiding van goederen (huwelijksvermogen)"
    ref: "BW art. 2.94 (gewijzigd hervorming 2018) — uitsluiting van gemeenschap; elk goed eigen of onverdeeld"
  - onderwerp: "Hervormd erfrecht 2018 — wettelijke devolutie + vruchtgebruik echtgenoot"
    ref: "BW art. 4.50 (devolutie echtgenoot vruchtgebruik); art. 4.146 (globale reserve afstammelingen 1/2 in volle eigendom); art. 4.150 (concrete reserve echtgenoot gezinswoning)"
  - onderwerp: "Verkooprecht — standaard en Brussels abattement"
    ref: "W.Reg. art. 44 (tarief 12,50 % Brussel + Wallonië); art. 46bis W.Reg. Brussel (abattement €200.000 grondslagvermindering)"
  - onderwerp: "Verkooprecht Vlaanderen — standaard en enige eigen woning"
    ref: "VCF art. 2.9.4.1.1 (standaard 12 %); art. 2.9.4.2.11 (enige eigen woning 2 % sinds decreet 23.12.2022); art. 2.9.4.2.12 (energetisch 1 %)"
  - onderwerp: "Verdeelrecht — uittreding mede-eigenaar uit onverdeeldheid"
    ref: "W.Reg. art. 109 (1 % Brussel + Wallonië, grondslag = volledige verkoopwaarde onverdeeld goed); VCF art. 2.10.1.0.1 (belastbaar feit) + art. 2.10.4.0.1 (tarief 2,5 % Vlaanderen)"
  - onderwerp: "Aanwijzing van lastgever (command) — termijnen per gewest"
    ref: "Vlaanderen + federaal: VCF art. 2.9.6.0.1, 1°, c en art. 158, 1°, c W.Reg. (uiterlijk eerste werkdag na compromis); Brussel + Wallonië: W.Reg. art. 159, 1°, b (vijfde werkdag)"
  - onderwerp: "Bevoegd gewest erfbelasting"
    ref: "VCF art. 5/1 (fiscale woonplaats erflater bepaalt bevoegdheid); art. 3.3.1.0.5 (aangifteplichtigen) + 3.3.1.0.6 (termijn 4/5/6 maanden) + 3.10.4.4.1 (betalings­termijn 2 maanden)"
  - onderwerp: "Fictiebepaling levensverzekering"
    ref: "VCF art. 2.7.1.0.6 (uitkering bij overlijden = fictie-legaat; bij gemeenschapsvermogen 50 %, bij eigen vermogen 100 % belastbaar)"
  - onderwerp: "Aannemelijk passief — begrafeniskosten + schulden + uitzonderingen erfgenaam-lening"
    ref: "VCF art. 2.7.3.4.1 (limitatieve lijst aannemelijk passief); W.Succ. art. 27 (schulden bestaand op overlijdens-datum) + art. 33 (uitzonderingen — w.o. 33, 2° lening erfgenaam met bestemming nalatenschapsgoed)"
  - onderwerp: "Vrijstelling gezinswoning overlevende echtgenoot"
    ref: "VCF art. 2.7.6.0.3 (Vlaanderen — 100 % vrijstelling voor overlevende echtgenoot, niet voor afstammelingen)"
  - onderwerp: "Tarieven erfbelasting rechte lijn Vlaanderen"
    ref: "VCF art. 2.7.4.1.1 (rechte lijn: 3 % tot €50k / 9 % €50k-€250k / 27 % > €250k); art. 2.7.4.2.2 (gunstregime familiale onderneming bij erfopvolging: 3 % rechte lijn / 7 % anderen, vlak)"
  - onderwerp: "Gunstregime familiale onderneming — voorwaarden"
    ref: "VCF art. 2.7.4.2.2 (erfopvolging) + art. 2.8.6.0.3 (schenking 0 % rechte lijn / 0 % anderen) — voorwaarden: familiale vennootschap (≥ 50 % bij familie), reële economische activiteit, continuïteit + participatie 3 jaar"
  - onderwerp: "Fictiebepaling schenking < 3 jaar"
    ref: "VCF art. 2.7.1.0.5 (niet-geregistreerde schenking binnen 3 jaar vóór overlijden valt terug in fictieve nalatenschap; geregistreerde notariële schenking ontsnapt)"
  - onderwerp: "Kapitalisatie vruchtgebruik voor erfbelasting"
    ref: "VCF art. 2.7.3.3.2 (forfaitaire kapitalisatie op leeftijd vruchtgebruiker; cijferzakboekje voor coëfficiënten — bij 56 j: 10,5 × 4 % = 42 %)"


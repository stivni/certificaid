        Werk dus met de inventaris zoals ze er op 30 april 2026 stond.

  passief_op_overlijden:
    titel: "Vermeende passief-posten op datum overlijden Geert (10-09-2026)"
    notitie: >
      Onderstaande lijst van vier posten + één bijkomende post wordt door Anneke
      en de kinderen samen opgesteld als 'kosten en schulden die met de
      nalatenschap moeten verrekend worden'. Niet alles wat hier staat is
      aannemelijk passief voor de erfbelasting. Aan jou om te screenen.
    kolommen: ["#", "Post", "Bedrag (€)", "Documenten"]

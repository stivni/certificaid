# Oefening-script — Patisserie Beauclair: kostprijs, beslissing, variantie
#
# Tweede oefening volgens schema in data/oefeningen/SCHEMA.md (na Nordica voor PO 1.4).
# Doel: student loopt zelf het volledige analytische-pad — kostprijsmethoden vergelijken,
# CM-knelpunt-mix kiezen, keep-or-drop bepalen, variantie decomposeren.
# Bewust kleinere case dan Meridia Meubel (één business, twee producten, één knelpunt)
# zodat het in één zit lukt.

meta:
  slug: beauclair-kostprijs-en-variantie
  titel: "Oefening: Patisserie Beauclair — kostprijs, beslissing, variantie"
  po: "1.8"
  cluster: analytische-boekhouding
  beschrijving: >
    Doorgewerkte mini-case in vier stappen: één patisserie (Beauclair) met twee producten
    en een oven-knelpunt. De student berekent eerst kostprijzen via full costing én ABC,
    kiest de optimale knelpunt-mix, voert een keep-or-drop-analyse uit op de verlieslatende
    lijn, en decomposeert een Q1 2026-variantie naar prijs en hoeveelheid. Vier stappen
    bouwen op elkaar — een verkeerde methode-keuze in stap 1 zou leiden tot een verkeerde
    beslissing in stap 3.
  studietijd: "75-90 min"
  niveau: volledig

intro:
  callout_beat: >
    Oefening-intro. Aankondigen: dit is een doorlopende mini-case waar je drie analytische
    technieken (kostprijs, beslissing, variantie) op één case toepast. Expliciete vermelding:
    "doe eerst zelf, klap de uitwerking pas open als je vastloopt of klaar bent". Eindigend
    met motivatie — het examen toetst geen volledige case zoals deze, maar het volledige pad
    één keer doorlopen bouwt het mentale model dat fragment-vragen vereisen. De vier stappen
    bouwen op elkaar: een verkeerde methode-keuze in stap 1 kantelt de beslissing in stap 3.

# ---------------------------------------------------------------------------
# OPGAVE — alle data die de student vooraf krijgt
# ---------------------------------------------------------------------------

opgave:

  scenario_beats:
    - "Patisserie Beauclair BV is een kleine artisanale patisserie in Brussel met twee producten: een klassieke chocolademousse (potje van 200 ml, hoog volume, simpel proces) en een bruidstaart op maat (job-order, laag volume, complex proces)"
    - "Het bedrijf werkt met één industriële oven die 3.000 oven-uren per jaar beschikbaar heeft — momenteel volledig benut"
    - "Drie patissiers (chef + twee assistenten) staan op vast contract"
    - "De boekjaar 2025-cijfers zijn afgesloten. Het management overweegt een aantal beslissingen voor 2026 en stelt voor het eerst een standaardkost-systeem op voor de mousse"
    - "Werkwijze: lees alle opgave-data hieronder. Werk dan de vier stappen één voor één uit. Open pas de uitwerking nadat je je eigen antwoord hebt opgeschreven"

  groep:
    moeder:
      naam: "Patisserie Beauclair BV"
      rechtsvorm: BV
    deelnemingen: []

  tabellen:

    # Volume + prijs — opgave-data zonder marge-kolom (marge volgt in stap 2)
    volume-en-prijs-2025:
      titel: "Volume en verkoopprijs 2025"
      eenheid: "EUR"
      kolommen: ["Product", "Volume", "Verkoopprijs/eenheid", "Omzet"]
      rijen:
        - ["Chocolademousse *(potje van 200 ml)*", "20.000 potjes", "8", "160.000"]
        - ["Bruidstaart *(op maat)*", "400 stuks", "300", "120.000"]
        - ["**Totaal omzet**", "", "", "**280.000**"]

    # Variabele kosten per eenheid — uitsplitsing, geen marge (marge volgt in stap 2)
    variabele-kosten-per-eenheid:
      titel: "Variabele kost per eenheid (ingrediënten + variabele overhead)"
      eenheid: "EUR per eenheid"
      kolommen: ["Product", "Ingrediënten", "Variabele OH *(energie + toevoegingen)*", "Totaal variabel"]
      rijen:
        - ["Chocolademousse", "2,00", "1,00", "**3,00**"]
        - ["Bruidstaart", "80,00", "40,00", "**120,00**"]

    # Vaste kosten — als ÉÉN lump-totaal met uitsplitsing naar drie posten.
    # GEEN pre-categorisering naar "vermijdbaar/niet-vermijdbaar" — dat is stap 3.
    vaste-kosten-2025:
      titel: "Vaste kosten 2025 (totaal)"
      eenheid: "EUR"
      kolommen: ["Kostenpost", "Bedrag/jaar"]
      rijen:
        - ["Huur en nutsvoorzieningen", "24.000"]
        - ["Lonen 3 patissiers *(chef + 2 assistenten, vast contract)*", "90.000"]
        - ["Verzekering en varia", "6.000"]
        - ["**Totaal vaste kosten**", "**120.000**"]

    # Oven-uren — opgave geeft ENKEL het verbruik per eenheid en totaal.
    # Geen "verdeelsleutel-effect" of "knelpunt"-label — dat zijn antwoorden.
    oven-uren-verbruik:
      titel: "Oven-uren-verbruik per eenheid en totaal"
      eenheid: "oven-uren"
      kolommen: ["Product", "Oven-uren/eenheid", "Volume", "Totaal oven-uren/jaar"]
      rijen:
        - ["Chocolademousse", "0,05", "20.000", "1.000"]
        - ["Bruidstaart", "5,00", "400", "2.000"]
        - ["**Totaal oven-uren**", "", "", "**3.000**"]
      noot: "Capaciteit oven: 3.000 oven-uren/jaar."

    # Activity-pools — wordt ENKEL relevant in stap 1 (ABC-berekening).
    # In opgave: drie posten + drie maatstaven, GEEN tarief-berekening, GEEN pool-naam-mapping naar kostprijs.
    abc-pool-data:
      titel: "Activiteits-data 2025 (voor wie ABC wil toepassen)"
      eenheid: "EUR + aantallen"
      kolommen: ["Activiteit", "Vaste kost gerelateerd", "Cost driver", "Volume cost driver"]
      rijen:
        - ["Bakken/oven *(energie, oven-onderhoud, ovenkost)*", "40.000", "oven-uren", "3.000 (zie boven)"]
        - ["Setup/recept-voorbereiding *(opzet per batch, weegwerk, mise-en-place)*", "50.000", "aantal batches", "500 *(mousse: 100 batches van 200 potjes; taart: 400 batches van 1 stuk)*"]
        - ["Versiering/afwerking *(decoratie, persoonlijke afwerking — enkel taarten)*", "30.000", "aantal afgewerkte taarten", "400"]
        - ["**Totaal**", "**120.000**", "", ""]
      noot: "De drie activiteit-budgetten samen kloppen exact met de 120.000 EUR vaste kosten. De toewijzing van de vaste kosten naar deze drie pools is een management-keuze gebaseerd op activiteits-analyse (welke vaste kost wordt door welke activiteit gedreven)."

  resultatenrekening:

    beauclair-2025:
      titel: "Resultatenrekening Patisserie Beauclair BV — boekjaar 2025 (vereenvoudigd, tot bedrijfsresultaat)"
      eenheid: "EUR"
      rijen:
        - sub_totaal: "Bedrijfsopbrengsten — omzet"
          bedrag: 280000
        - sub_totaal: "Bedrijfskosten"
          bedrag: 228000
        - omschrijving: "Variabele kosten"
          detail: "ingrediënten + variabele overhead"
          bedrag: 108000
        - omschrijving: "Vaste kosten"
          detail: "huur, lonen, verzekering"
          bedrag: 120000
        - totaal: "Bedrijfsresultaat"
          bedrag: 52000

  extra_context:
    noot: >
      Twee aanvullende elementen die het management wil meenemen in 2026:
      (1) een bistro-keten heeft een eenmalige order van 2.000 extra mousses aangeboden
      tegen 5 EUR/stuk in plaats van 8 — de vraag is of Beauclair die aanvaardt;
      (2) de inkoopprijzen van melk en chocolade staan onder druk, en in Q1 2026 zal voor
      het eerst een standaardkost-kaart voor de mousse worden opgesteld met variantie-analyse.

# ---------------------------------------------------------------------------
# STAPPEN — wat de student doet, plus modelantwoord
# ---------------------------------------------------------------------------

stappen:

  - id: stap-1-kostprijs-vergelijken
    titel: "Stap 1 — Kostprijs vergelijken: full costing vs ABC"
    instructie_beats:
      - "Bereken de kostprijs per eenheid voor mousse én taart, eerst via full costing (kies één verdeelsleutel) en daarna via activity-based costing (ABC) met de drie pools uit de opgave"
      - "Vergelijk de uitkomsten en formuleer wat ABC bijbrengt dat full costing mist"
    uitwerking_beats:
      - "Full costing met oven-uren als verdeelsleutel: 120.000 vaste kosten / 3.000 oven-uren = 40 EUR/oven-uur. Mousse: 3 (var) + 0,05 × 40 = 3 + 2 = 5,00 EUR/potje. Taart: 120 (var) + 5 × 40 = 120 + 200 = 320 EUR/stuk"
      - "Margecheck full costing — mousse: 8 − 5 = +3 EUR marge (37,5%); taart: 300 − 320 = −20 EUR (verlies). Op het eerste gezicht maakt de taart verlies"
      - "ABC — drie activity-pools elk met eigen tarief: bakken/oven 40.000/3.000 = 13,33 EUR/oven-uur; setup 50.000/500 batches = 100 EUR/batch; versiering 30.000/400 taarten = 75 EUR/taart"
      - "Doorrekenen mousse: 3 (var) + 0,05 × 13,33 (bakken) + 100/200 (setup, want 1 batch dekt 200 potjes) + 0 (geen versiering) = 3 + 0,67 + 0,50 + 0 = **4,17 EUR/potje** → marge 3,83 EUR (48%)"
      - "Doorrekenen taart: 120 (var) + 5 × 13,33 (bakken) + 100/1 (setup, want 1 batch = 1 taart) + 75 (versiering) = 120 + 66,67 + 100 + 75 = **361,67 EUR/stuk** → 'verlies' van −61,67 EUR"
      - "Wat ABC bijbrengt: full costing legt ALLE overhead via één sleutel (oven-uren) op de producten. Maar setup en versiering zijn niet oven-uren-gedreven — ze zijn batch-gedreven en taart-specifiek. Full costing ondertaxeert daardoor de overhead-impact van de complexe taart en overtaxeert lichtjes de mousse. ABC laat zien dat de taart **groter** verlies maakt dan full doet vermoeden, en dat de mousse iets goedkoper is dan full suggereert"
      - "Lesson: een methode-keuze kan de keep-or-drop-beslissing kantelen. Maar pas op — vóór je de taart schrapt op basis van deze cijfers, moet je ook stap 3 doen"
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Vergelijking full costing vs ABC — kostprijs en marge per eenheid (EUR)"
        kolommen: ["Methode", "Mousse kostprijs", "Mousse marge", "Taart kostprijs", "Taart marge"]
        rijen:
          - ["Full costing *(sleutel: oven-uren, 40 EUR/uur)*", "5,00", "+3,00 *(37,5%)*", "320,00", "**−20,00 *(verlies)***"]
          - ["ABC *(3 pools)*", "**4,17**", "**+3,83 *(48%)***", "**361,67**", "**−61,67 *(groter verlies)***"]
          - ["Verschil", "−0,83", "+0,83", "+41,67", "−41,67"]
    valkuil_beat: "Naïeve reflex: 'mooi, ABC bevestigt dat taart verlies maakt — schrappen!' Maar wacht — full én ABC zijn beide allocatie-methodes voor *vaste kosten die toch doorlopen*. Voor de stop-beslissing telt iets anders: de **vermijdbare** vaste kosten. Daarover gaat stap 3. Een ABC-verlies is GEEN stop-signaal op zichzelf."

  - id: stap-2-contributiemarge-knelpunt
    titel: "Stap 2 — Contributiemarge en knelpunt-mix"
    instructie_beats:
      - "Bereken de contributiemarge per eenheid voor mousse en taart, en daarna de contributiemarge per oven-uur"
      - "De oven is volledig benut, maar het management onderzoekt twee scenario's: (a) 100 extra oven-uren beschikbaar via een onderhouds-optimalisatie — welk product krijgt voorrang? (b) de bistro-keten biedt 2.000 extra mousses tegen 5 EUR/stuk — aanvaarden?"
    uitwerking_beats:
      - "CM/eenheid mousse = 8 − 3 = 5 EUR/potje (CM% = 62,5%). CM/eenheid taart = 300 − 120 = 180 EUR/stuk (CM% = 60%). Op het eerste gezicht lijkt de taart 36× rendabeler — maar dit is een misleidende vergelijking als de capaciteit knelt"
      - "CM per knelpunt-uur is de juiste maatstaf. Mousse: 5 / 0,05 = 100 EUR/oven-uur. Taart: 180 / 5 = 36 EUR/oven-uur. De mousse genereert bijna 3× meer CM per knelpunt-uur dan de taart"
      - "Scenario (a) — 100 extra oven-uren: bij mousse 100 × 100 = +10.000 EUR extra CM; bij taart 100 × 36 = +3.600 EUR. Verschil = 6.400 EUR/jaar. Bij knelpunt-druk wint de mousse, niet de taart"
      - "Scenario (b) — special order 2.000 mousses à 5 EUR. Incrementele opbrengst: 2.000 × 5 = 10.000 EUR. Incrementele variabele kost: 2.000 × 3 = 6.000 EUR. Brutowinst zonder capaciteits-effect: +4.000 EUR. Maar: er zijn 2.000 × 0,05 = 100 extra oven-uren nodig — die zijn er NIET, want capaciteit is volledig benut"
      - "Opportunity cost: om die 100 oven-uren vrij te maken, moet er iets minder van iets anders gebeuren. Optie: 100 oven-uren minder taart = 20 taarten minder = 20 × 180 = 3.600 EUR CM verloren. Netto-effect: +4.000 − 3.600 = **+400 EUR**. De order is dus *net* aanvaardbaar, maar de marge is veel dunner dan de bruto-vergelijking suggereert"
      - "Alternatief: extra capaciteit via overuren bij de patissiers. Dan moet de extra loonkost onder 4.000 EUR blijven — bij 30 EUR/uur arbeid + circa 50% overuren-toeslag is dat eng krap"
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Contributiemarge — per eenheid vs per knelpunt-uur (EUR)"
        kolommen: ["Maatstaf", "Mousse", "Taart", "Wie wint?"]
        rijen:
          - ["CM/eenheid", "5,00", "180,00", "Taart *(misleidend)*"]
          - ["Oven-uren/eenheid", "0,05", "5,00", ""]
          - ["**CM/oven-uur**", "**100,00**", "**36,00**", "**Mousse**"]
          - ["100 extra uren → extra CM", "+10.000", "+3.600", "Mousse +6.400"]
    valkuil_beat: "Stagiair-reflex bij een special order: 'order > variabele kost = aanvaarden'. Klopt enkel bij vrije capaciteit. Bij volle capaciteit telt de **opportunity cost** van wat je MOET LATEN om plek te maken. Vergeet je dat, dan ziet de order eruit als +4.000 EUR — terwijl ze in werkelijkheid slechts +400 EUR (of zelfs verlies) oplevert."

  - id: stap-3-keep-or-drop
    titel: "Stap 3 — Keep-or-drop: stoppen met de taart?"
    instructie_beats:
      - "Het management overweegt de taart-lijn te schrappen op basis van de cijfers uit stap 1 ('verlies onder beide methoden')"
      - "Werk de echte beslissingsanalyse uit: wat verliest Beauclair aan contributiemarge, en welke vaste kosten verdwijnen écht als de taart-lijn stopt?"
      - "Maak vervolgens een afgewogen aanbeveling. Vergeet niet wat er met de vrijgekomen oven-uren kan gebeuren"
    uitwerking_beats:
      - "Wat verloren gaat: de totale CM op taart. 400 taarten × 180 EUR CM/stuk = **72.000 EUR/jaar** valt weg"
      - "Wat aan vaste kosten daadwerkelijk verdwijnt? Dit is de kritische vraag. Loop de drie ABC-pools af: (1) Versiering 30.000 EUR — volledig taart-specifiek (mousse heeft géén versiering), dus 100% vermijdbaar; (2) Setup 50.000 EUR — taart genereert 400 van de 500 batches, dus 400/500 × 50.000 = 40.000 EUR is taart-toewijsbaar. MAAR: een groot deel van die setup-kost zit vast in de lonen van het personeel. Stel: één assistent (jaarsalaris ~30.000 EUR) kan effectief worden afgebouwd; van die 40.000 toegerekend aan taart is dus pakweg 20.000 EUR écht vermijdbaar, de andere 20.000 blijft als idle-tijd van personeel dat in dienst blijft; (3) Bakken-pool 40.000 EUR is energie + oven-onderhoud — die kosten dalen wel naar rato van werkelijk verbruik, maar als de mousse-productie wordt opgeschaald om de vrijgekomen capaciteit te benutten, kantelt dit weer. Voor de eerste-orde-analyse: neem 0 vermijdbaar uit deze pool"
      - "Totaal vermijdbare vaste kost = 30.000 (versiering) + 20.000 (setup, één assistent uit) = **50.000 EUR**"
      - "Netto-effect van stoppen met taart: −72.000 CM weg + 50.000 vermeden vaste kost = **−22.000 EUR/jaar slechter af**. De vermeende 'verliesgevende' taart-lijn draagt netto positief bij aan het resultaat"
      - "Plus: de vrijgekomen 2.000 oven-uren kunnen deels naar extra mousse-productie. Bij beperkte marktvraag (stel: 800 extra mousses verkoopbaar = 200 batches): extra CM = 800 × 5 = 4.000 EUR. Eindbeoordeling: −22.000 + 4.000 = **−18.000 EUR**. Conclusie: **niet schrappen**"
      - "Gevolg voor managementadvies: de full-cost-verlies op de taart is een rapportering-artefact, niet een werkelijke onderprestatie. Stap 1 wees op een 'verliesgevend product'; stap 3 corrigeert die conclusie volledig"
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Keep-or-drop-analyse taart-lijn (EUR/jaar)"
        kolommen: ["Element", "Bedrag", "Toelichting"]
        rijen:
          - ["CM die wegvalt", "−72.000", "400 stuks × 180 EUR"]
          - ["Vermeden versiering", "+30.000", "100% taart-specifiek"]
          - ["Vermeden setup *(één assistent uit)*", "+20.000", "40.000 toegerekend; 20.000 effectief afbouwbaar"]
          - ["Niet-vermijdbare setup *(personeel blijft)*", "0", "20.000 wordt idle-tijd"]
          - ["Vermeden bakken-pool", "0", "Mousse-uitbreiding compenseert"]
          - ["**Subtotaal — netto-effect stoppen**", "**−22.000**", "Slechter af"]
          - ["Extra CM op vrijgekomen mousse-capaciteit *(800 stuks)*", "+4.000", "Mits afzetbaar"]
          - ["**Eindbeoordeling**", "**−18.000**", "**Niet schrappen**"]
    valkuil_beat: "Een verliesgevend product (op full costing) schrappen verhoogt de winst NIET als zijn CM hoger ligt dan de vermijdbare vaste kosten die je elimineert. De vaste kosten die NIET wegvallen, worden anders nog steeds gedragen — alleen dan door de overblijvende producten, die zo 'het verlies erven'. Voor stop-beslissingen tellen ALLEEN vermijdbare kosten, niet de full-costing-allocatie."

  - id: stap-4-standaardkost-variantie
    titel: "Stap 4 — Standaardkost en Q1 2026-variantie"
    instructie_beats:
      - "Beauclair stelt voor 2026 voor het eerst een standaardkost-kaart op voor de chocolademousse. De standaard-variabele kost komt uit op 3,00 EUR/potje (zelfde als 2025-werkelijk — geen verwachte stijging in de standaard)"
      - "Q1 2026: gebudgetteerd 5.000 mousses (= 25% van het jaar). Werkelijk: 5.000 mousses geproduceerd, maar de kost-inputs wijken af. Bereken de totale variantie en decomposeer per kostencategorie naar prijs- en hoeveelheidsvariantie"
      - "Identificeer per variantie welke functie (inkoop, productie, HR) verantwoordelijk is en formuleer een aanbeveling"
    uitwerking_beats:
      - "Standaardkost-kaart mousse (per potje): ingrediënten 2,00 (200 g melk × 5/kg = 1,00 + 50 g chocolade × 20/kg = 1,00) + arbeid 0,60 (0,02 u × 30/u) + variabele OH 0,40 (0,05 oven-uur × 8/u) = **3,00 EUR/potje**"
      - "Q1 budget — 5.000 potjes × 3,00 = **15.000 EUR** variabele kost"
      - "Q1 werkelijk: melk 1.100 kg × 5,20 = 5.720; chocolade 240 kg × 22 = 5.280; arbeid 110 u × 30,50 = 3.355; variabele OH 2.100. **Totaal werkelijk = 16.455 EUR**. Totale variantie = 16.455 − 15.000 = **1.455 EUR ongunstig**"
      - "Decompositie melk — standaard voor 5.000 potjes: 5.000 × 0,2 kg = 1.000 kg @ 5 EUR/kg. Prijsvariantie = (5,20 − 5,00) × 1.100 = +220 ongunstig; hoeveelheidsvariantie = (1.100 − 1.000) × 5 = +500 ongunstig. Totaal melk = **+720**"
      - "Decompositie chocolade — standaard: 5.000 × 0,05 kg = 250 kg @ 20. Prijsvariantie = (22 − 20) × 240 = +480 ongunstig; hoeveelheidsvariantie = (240 − 250) × 20 = −200 gunstig (10 kg minder verbruikt — recept-aanpassing? betere portionering?). Totaal chocolade = **+280**"
      - "Decompositie arbeid — standaard: 5.000 × 0,02 u = 100 u @ 30. Loonvariantie (prijs) = (30,50 − 30) × 110 = +55 ongunstig; efficiëntievariantie (hoeveelheid) = (110 − 100) × 30 = +300 ongunstig. Totaal arbeid = **+355** (10 extra uren — nieuwe medewerker in opleiding?)"
      - "Variabele OH: +100 EUR ongunstig (kleine post — niet verder gedecomposeerd)"
      - "Sluittoets: 720 + 280 + 355 + 100 = 1.455 EUR ✓ (gelijk aan totale variantie)"
      - "Oorzaak-toewijzing: inkoop draagt de prijsvarianties melk en chocolade (markt-stijgingen — heronderhandelen of forwards-contract); productie draagt de melk-hoeveelheid (verspilling — proces-audit) en arbeid-efficiëntie (opleiding nieuwe assistent); HR/loon: de kleine loonvariantie (+55) is acceptabel binnen CAO-bewegingen"
      - "Materialiteit: 1.455 / 15.000 = 9,7% — ruim boven de 5%-vuistregel. Materiële variantie → pro-rata-correctie volgens IAS 2: het gedeelte dat aan nog niet verkochte voorraad toewijsbaar is, gaat naar voorraadwaarde; het verkochte deel direct naar resultaat"
    uitwerking_visualisaties:
      - type: tabel-inline
        titel: "Variantie Q1 2026 — decompositie naar prijs- en hoeveelheidsvariantie (EUR)"
        kolommen: ["Categorie", "Prijsvariantie", "Hoeveelheidsvariantie", "Totaal", "Oorzaak / verantwoordelijke"]
        rijen:
          - ["Melk", "+220 ongunstig", "+500 ongunstig", "**+720**", "Markt + verspilling — inkoop + productie"]
          - ["Chocolade", "+480 ongunstig", "−200 gunstig", "**+280**", "Markt — inkoop *(productie compenseert lichtjes)*"]
          - ["Arbeid", "+55 ongunstig *(loon)*", "+300 ongunstig *(efficiëntie)*", "**+355**", "CAO + opleiding nieuwe assistent"]
          - ["Variabele OH", "—", "—", "**+100**", "Klein — niet decomposeerd"]
          - ["**Totaal**", "", "", "**+1.455 *(ongunstig)***", "9,7% van budget — materieel"]
    valkuil_beat: "De som van prijs- én hoeveelheidsvarianties per categorie moet exact gelijk zijn aan de totale variantie. Klopt het niet (720 + 280 + 355 + 100 = 1.455 ✓), dan zit er een reken-fout in een sub-variantie. Doe deze sluit-toets altijd — examen én praktijk."

# ---------------------------------------------------------------------------
# AFSLUITING
# ---------------------------------------------------------------------------

afsluiting:
  reflectie_beats:
    - "Wat je nu één keer zelf hebt doorlopen: kostprijs vergelijken via full costing én ABC, contributiemarge per knelpunt-uur, keep-or-drop op basis van vermijdbare kosten, en variantie-decompositie naar prijs en hoeveelheid"
    - "De drie analyses zijn niet afzonderlijk — ze vormen samen de management-toolkit van de analytische boekhouding. Een verkeerde methode-keuze in stap 1 leidt tot een verkeerde beslissing in stap 3: dat is de hele les. Standaardkost levert pas sturing op wanneer de variantie decomposeerbaar is naar prijs én hoeveelheid (stap 4)"
    - "Het examen zal hier geen volledige case reproduceren — wél fragmenten ('bereken CM per knelpunt-uur', 'noem twee redenen waarom ABC en full costing verschillen', 'decomposeer deze variantie naar prijs en hoeveelheid', 'welke kosten tellen bij een keep-or-drop?'). Die fragmenten landen scherp als je deze hele case één keer hebt afgewerkt"
  doelstellingen_gedekt:

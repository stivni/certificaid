      primair: "Jaarrekening"
      afkorting: "JR"
      synoniemen: ["financial statements", "annual accounts", "synthesedocumenten"]
    concept_type: kader
    categorieen: [kader, entiteit]
    ankers:
      - "1.1.II.S"
      - "1.1.taak.1"
      - "1.2.III.E"
      - "1.2.IV.C"
      - "1.2.IV.D"
      - "1.2.IV.E"
      - "1.2.IV.F"
      - "1.2.V.A"
      - "1.2.V.B"
      - "1.2.taak.1"
    scope_in:
      - "Synthesedocumenten-overzicht: balans + resultatenrekening (ROW) + toelichting + sociale balans"
      - "3 balansschema's: volledig · verkort · microschema (per groottecategorie)"
      - "Waarderingsregels vastleggen in toelichting (rubrieken art 145 KB)"
      - "Jaarverslag bestuursorgaan (art 3:6 WVV — KAM + niet-financiële info)"
      - "Sociale balans als bijlage (personeels-cijfers)"

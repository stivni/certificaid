cluster: jaarrekening-fundament
discipline: boekhouding
po_mapping: ["1.1", "1.2"]
bronnen_pin:
  - WER Boek III (boekhoudwet + boekhoudplicht art III.82-III.95)
  - KB 29-04-2019 (uitvoeringsbesluit boekhouding + MAR + waarderingsregels)
  - Boekhoudwet 17-07-1975
  - NBB-richtlijnen + CBN-adviezen
  - WVV Boek 3 (jaarrekening + openbaarmaking)

records:

  # 1 — discipline-Σ
  - id: boekhouding
    naam:
      primair: "Boekhouding"
      synoniemen: ["accountancy", "boekhoudkunde"]
    concept_type: kader
    categorieen: [kader]
    ankers: ["1.1.taak.1", "1.1.I", "1.1.I.A", "1.1.I.B", "1.2.III"]
    scope_in:
      - "Overzicht boekhouding-discipline (boekhoudplicht · MAR · jaarcyclus · synthesedocumenten)"
      - "Boekhoudkundige organisatie (rolverdeling cliënt ↔ accountant)"
      - "Onderscheid handel vs niet-handel vs micro (boekhoudplicht-scope)"
      - "Interface met andere disciplines (fiscaliteit · controle · bedrijfseconomie)"
    scope_out:
      - { topic: "Wettelijk kader-detail (WER + KB + CBN)", richting: moet-verwijzen, ref: belgisch-boekhoudrecht }
      - { topic: "Boekhoudbeginselen (voorzichtigheid · matching · continuïteit · ...)", richting: moet-verwijzen, ref: boekhoudbeginselen }
      - { topic: "Dubbele-boekhouding-mechaniek (dagboek · grootboek · MAR · proefbalans)", richting: moet-verwijzen, ref: dubbele-boekhouding }
      - { topic: "Jaarrekening-opmaak + presentatie", richting: moet-verwijzen, ref: jaarrekening }
      - { topic: "Wie moet boekhouden? (scope)", richting: moet-verwijzen, ref: boekhoudplicht }
      - { topic: "Boekhoud-perspectief van VAA / autokosten / werknemers", richting: niet-verwijzen }
    subconcepten_hints:
      - boekhoudkundige-organisatie
      - boekhoudplicht-overzicht
    bouwstenen_hints:
      - mar-rekeningstelsel-overzicht
      - handel-vs-niet-handel-vs-micro
      - jaarcyclus-stappen
    cross_relaties:
      - { target: belgisch-boekhoudrecht, type: bevat }
      - { target: jaarrekening, type: bevat }

  # 2 — wettelijk kader-detail (rename bgaap)
  - id: belgisch-boekhoudrecht
    naam:
      primair: "Belgisch boekhoudrecht"
      afkorting: "B-GAAP"
      synoniemen: ["bgaap", "Belgian GAAP", "Belgisch boekhoudkundig referentiestelsel"]
    concept_type: kader
    categorieen: [kader]
    ankers: ["1.1.I", "1.1.I.A", "1.1.I.B", "1.2.I", "1.2.I.C", "1.2.I.D", "1.2.I.E", "1.2.I.F", "1.2.II"]
    scope_in:
      - "Wettelijk kader: WER Boek III + Boekhoudwet 17-07-1975"
      - "KB 29-04-2019 als uitvoeringsbesluit (waarderingsregels + MAR + balansschema's)"
      - "Bronhiërarchie: wet → KB → MB → circulaire → CBN-advies"
      - "Rol NBB + CBN + griffies + ITAA + IBR + FSMA + CRB"
      - "EU-richtlijn 2013/34/EU als upstream-basis"
    scope_out:
      - { topic: "IFRS internationaal referentiestelsel", richting: moet-verwijzen, ref: ifrs }
      - { topic: "Boekhoudbeginselen-detail", richting: moet-verwijzen, ref: boekhoudbeginselen }
      - { topic: "WVV-vennootschapsrechtelijke aspecten (rechtsvormen)", richting: mag-verwijzen, ref: ondernemingsvormen }
    subconcepten_hints:
      - bronhierarchie-boekhoudrecht
      - autoriteiten-overzicht
    bouwstenen_hints:
      - wer-boek-iii-art-III-82-tot-III-95
      - kb-29-april-2019-structuur
      - eu-richtlijn-2013-34-omzetting
    cross_relaties:
      - { target: boekhouding, type: valt_onder }
      - { target: ifrs, type: alternatief_referentiestelsel }

  # 3 — beginselen
  - id: boekhoudbeginselen
    naam:
      primair: "Boekhoudbeginselen"
      synoniemen: ["boekhoudkundige beginselen", "GAAP-beginselen B-GAAP"]
    concept_type: principe
    categorieen: [kader]
    ankers: ["1.1.I", "1.1.I.A", "1.1.I.B", "1.2.III.B", "1.2.V.A"]
    scope_in:
      - "Voorzichtigheid (asymmetrische waardering: verliezen anticiperen, winsten niet)"
      - "Continuïteit / going concern als waarderings-aanname"
      - "Consistentie / bestendigheid (methodes consequent)"
      - "Matching-beginsel (kosten en opbrengsten in juiste periode)"
      - "Realisatie-beginsel (opbrengst pas bij prestatie geleverd)"
      - "Materialiteit / wezenlijkheid"
      - "Trouw beeld (overall result: getrouw weergeven van vermogen, resultaat en evolutie)"
      - "Niet-compensatie (activa en passiva apart, kosten en opbrengsten apart)"
    scope_out:
      - { topic: "Concrete waarderingsregels per balanspost", richting: moet-verwijzen, ref: jaarrekening }
      - { topic: "Continuïteit als financiële-diagnose-trigger", richting: moet-verwijzen, ref: continuiteit }
      - { topic: "IFRS-conceptueel-kader (parallel)", richting: mag-verwijzen, ref: ifrs }
    subconcepten_hints: []
    bouwstenen_hints:
      - beginsel-voorzichtigheid
      - beginsel-continuiteit
      - beginsel-matching
      - beginsel-realisatie
      - beginsel-materialiteit
      - beginsel-bestendigheid
      - beginsel-trouw-beeld
      - beginsel-niet-compensatie
    cross_relaties:
      - { target: belgisch-boekhoudrecht, type: valt_onder }
      - { target: jaarrekening, type: vereist }

  # 4 — dubbele-boekhouding (K-techniek)
  - id: dubbele-boekhouding
    naam:
      primair: "Dubbele boekhouding"
      synoniemen: ["double-entry bookkeeping", "dagboek-grootboek-systematiek"]
    concept_type: methode
    categorieen: [kader]
    ankers: ["1.1.I.A", "1.1.taak.1", "1.2.III.C", "1.2.III.D"]
    scope_in:
      - "Mechaniek dagboek → grootboek → proefbalans → balans/ROW (registratie-cyclus)"
      - "MAR-rekeningstelsel (klasse 0-9) als classificatie-frame"
      - "Boekingsregel: elke verrichting raakt minstens 2 rekeningen (debet/credit-symmetrie)"
      - "Periodieke afsluitingen (maand / kwartaal / jaar)"
      - "Onderscheid memorierekeningen (klasse 0) vs balansrekeningen (klasse 1-5) vs resultatenrekeningen (klasse 6-7)"
    scope_out:
      - { topic: "Vereenvoudigde boekhouding (eenpartig)", richting: moet-verwijzen, ref: boekhoudplicht }
      - { topic: "Analytische boekhouding (kostprijs + budgetbeheer)", richting: moet-verwijzen, ref: analytische-boekhouding }
      - { topic: "Concrete waarderingsregels per balanspost", richting: moet-verwijzen, ref: jaarrekening }
      - { topic: "Inventarisatie-procedure (eindejaarscyclus)", richting: moet-verwijzen, ref: eindejaarsverrichtingen }
    subconcepten_hints:
      - dagboeken
      - grootboek
      - mar-rekeningstelsel
      - proefbalans
    bouwstenen_hints:
      - boekingsregel-debet-credit
      - klasse-0-tot-9-overzicht
      - periodieke-afsluit-cyclus
      - boeking-voorbeeld
    cross_relaties:
      - { target: boekhouding, type: valt_onder }
      - { target: boekhoudbeginselen, type: vereist }
      - { target: jaarrekening, type: triggert }

  # 5 — JAARREKENING (Σ, kern voor vrouw)

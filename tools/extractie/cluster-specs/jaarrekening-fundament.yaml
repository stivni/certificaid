      - { topic: "Boekhoudbeginselen die jaarrekening fundeerden", richting: moet-verwijzen, ref: boekhoudbeginselen }
      - { topic: "Eindejaarsverrichtingen (inventaris + waarderings-correcties)", richting: moet-verwijzen, ref: eindejaarsverrichtingen }
      - { topic: "Groottecategorie-cascade (drempels → schema + controle)", richting: moet-verwijzen, ref: groottecategorie-vennootschap }
      - { topic: "Jaarrekeninganalyse (ratio's + diagnose)", richting: moet-verwijzen, ref: jaarrekeninganalyse }
      - { topic: "Specifieke balansposten (vaste-activa, voorraden, EV, ...)", richting: mag-verwijzen }
